{{- if or .Values.keda.enabled .Values.keda.external }}
{{- if .Values.worker.keda.scaledJob.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "plugin-worker.fullname" . }}
  labels:
    {{- include "plugin-worker.labels" (dict "context" . "name" .Values.worker.name ) | nindent 4 }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: reporter
  annotations:
    {{- with .Values.worker.annotations }}
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
spec:
  jobTargetRef:
    backoffLimit: {{ .Values.worker.keda.scaledJob.backoffLimit }}
    ttlSecondsAfterFinished: {{ .Values.worker.keda.scaledJob.ttlSecondsAfterFinished }}
    activeDeadlineSeconds: {{ .Values.worker.keda.scaledJob.activeDeadlineSeconds | default 300 }}
    template:
      spec:
        {{- with .Values.worker.imagePullSecrets }}
        imagePullSecrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.worker.serviceAccount.create }}
        serviceAccountName: {{ include "plugin-worker.fullname" . }}
        {{- end }}
        {{- if and $.Values.aws $.Values.aws.rolesAnywhere $.Values.aws.rolesAnywhere.enabled }}
        securityContext:
          fsGroup: 65532
        {{- end }}
        containers:
        - name: {{ include "plugin-worker.fullname" . }}
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "plugin-worker.fullname" . }}
            - secretRef:
                name: {{ if .Values.worker.useExistingSecret }}{{ .Values.worker.existingSecretName }}{{ else }}{{ include "plugin-worker.fullname" . }}{{ end }}
          env:
          {{- include "reporter.mongoPasswordEnv" (dict "context" $ "secretName" (ternary .Values.worker.existingSecretName (include "plugin-worker.fullname" .) .Values.worker.useExistingSecret)) | nindent 10 }}
          {{- if (index .Values "otel-collector-lerian").enabled }}
          - name: "HOST_IP"
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
            value: "$(HOST_IP):4317"
          {{- end }}
          {{- if and $.Values.aws $.Values.aws.rolesAnywhere $.Values.aws.rolesAnywhere.enabled }}
          {{- include "lerian-common.rolesAnywhere.imdsEnv" (dict "aws" $.Values.aws) | nindent 10 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu }}
              memory: {{ .Values.worker.resources.limits.memory }}
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu }}
              memory: {{ .Values.worker.resources.requests.memory }}
        {{- if and $.Values.aws $.Values.aws.rolesAnywhere $.Values.aws.rolesAnywhere.enabled }}
        {{- include "lerian-common.rolesAnywhere.sidecar" (dict "aws" $.Values.aws) | nindent 8 }}
        {{- end }}
        {{- if and $.Values.aws $.Values.aws.rolesAnywhere $.Values.aws.rolesAnywhere.enabled }}
        {{- include "lerian-common.rolesAnywhere.volume" (dict "aws" $.Values.aws "iamTlsDefault" "reporter-iam-tls") | nindent 8 }}
        {{- end }}
        restartPolicy: Never
        {{- with .Values.worker.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.worker.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.worker.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}        
  pollingInterval: {{ .Values.worker.keda.scaledJob.pollingInterval }}
  successfulJobsHistoryLimit: {{ .Values.worker.keda.scaledJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.worker.keda.scaledJob.failedJobsHistoryLimit }}
  maxReplicaCount: {{ .Values.worker.keda.scaledJob.maxReplicaCount }}        
  triggers:
  {{- range .Values.worker.keda.scaledJob.triggers }}
  - type: {{ .type }}
    metadata:
      queueName: {{ $.Values.common.configmap.RABBITMQ_GENERATE_REPORT_QUEUE | default "reporter.generate-report.queue" | quote }}
      {{- /* scheme/amqpPort resolved via the SAME broker datastore mask as host below
         (and as _helpers.tpl RABBITMQ_URI/RABBITMQ_PORT_AMQP) — a managed-broker
         profile (global.datastores.broker.{scheme,amqpPort}) must agree here too,
         or KEDA polls the wrong endpoint while the app connects to the right one. */}}
      host: "{{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($.Values.datastores | default dict) "configmap" ($.Values.common.configmap | default dict) "type" "broker" "field" "scheme" "nativeKey" "RABBITMQ_URI" "default" "amqp") }}://{{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($.Values.datastores | default dict) "configmap" ($.Values.common.configmap | default dict) "type" "broker" "field" "host" "nativeKey" "RABBITMQ_HOST" "default" "reporter-rabbitmq.reporter.svc.cluster.local") }}:{{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($.Values.datastores | default dict) "configmap" ($.Values.common.configmap | default dict) "type" "broker" "field" "amqpPort" "nativeKey" "RABBITMQ_PORT_AMQP" "default" "5672") }}"
      queueLength: {{ .metadata.queueLength | quote }}
      protocol: {{ .metadata.protocol | quote }}
      vhost: {{ .metadata.vhost }}
    authenticationRef:
      name: keda-trigger-authentication
  {{- end }}
{{- end }}
{{- end }}
