{{- /*
Only rendered when this chart owns the Secret (secrets.create=true). The BYOC
default (secrets.create=false) references an externally managed Secret via
secrets.existingSecretName instead — see br-slc.secretName in _helpers.tpl and
README.md "Secrets" section. Never bake real values into values.yaml; supply
them via --set-string/-f at install time when create=true.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets.data | default dict -}}
{{- $cm := .Values.configmap.data | default dict -}}
{{- $mtEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_ENABLED" "params" (.Values.multiTenant | default dict) "field" "enabled" "default" "false")) "true" -}}
{{- $rmqEnabled := eq (toString ($cm.RABBITMQ_ENABLED | default "false")) "true" -}}
{{- /* Secret keys emitted with fail-fast semantics below — excluded from the
   generic passthrough range so they are single-sourced and feature-gated. */ -}}
{{- $managed := dict -}}
{{- range $k := (list "MULTI_TENANT_SERVICE_API_KEY" "MULTI_TENANT_REDIS_PASSWORD" "RABBITMQ_DEFAULT_PASS") -}}
{{- $_ := set $managed $k true -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-slc.secretName" . }}
  labels:
    {{- include "br-slc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $s }}
  {{- if not (hasKey $managed $key) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- /* Multi-tenant secrets (lerian-common.multiTenant.secret): SERVICE_API_KEY
     required + REDIS_PASSWORD optional, emitted only when MT is enabled; fails
     fast when enabled but the API key is empty. */ -}}
  {{- with (include "lerian-common.multiTenant.secret" (dict
        "context" . "secrets" $s
        "secretName" (include "br-slc.secretName" .)
        "valuesPrefix" "secrets.data." "mode" "stringData"
        "enabled" $mtEnabled
        "useExistingSecret" (not .Values.secrets.create))) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- /* RabbitMQ password: required when the broker is on; optional otherwise. */ -}}
  {{- if $rmqEnabled }}
  RABBITMQ_DEFAULT_PASS: {{ required "secrets.data.RABBITMQ_DEFAULT_PASS is required when RABBITMQ_ENABLED=true" $s.RABBITMQ_DEFAULT_PASS | quote }}
  {{- else if $s.RABBITMQ_DEFAULT_PASS }}
  RABBITMQ_DEFAULT_PASS: {{ $s.RABBITMQ_DEFAULT_PASS | quote }}
  {{- end }}
{{- end }}
