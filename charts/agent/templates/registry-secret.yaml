{{- if .Values.agent.enabled }}
{{- $registry := .Values.agent.chartRegistry | default dict }}
{{- if and $registry.existingSecret (or $registry.host $registry.username $registry.password) }}
{{- fail "set agent.chartRegistry.existingSecret, or agent.chartRegistry.host/username/password, never both: an existingSecret is a kubernetes.io/dockerconfigjson Secret and already names the registries it speaks for." }}
{{- end }}
{{- if and (or $registry.username $registry.password) (not (and $registry.username $registry.password)) }}
{{- fail "agent.chartRegistry.username and agent.chartRegistry.password go together: half a credential produces an Authorization header the registry answers with the same 'unauthorized' it answers an anonymous request with." }}
{{- end }}
{{- if and $registry.host (not $registry.username) (not $registry.existingSecret) }}
{{- fail "agent.chartRegistry.host on its own configures nothing: set agent.chartRegistry.username and password, or agent.chartRegistry.existingSecret." }}
{{- end }}
{{- if and $registry.username (not $registry.existingSecret) }}
{{- $host := include "lerian-agent.chartRegistryHost" . }}
{{- $auth := printf "%s:%s" $registry.username $registry.password | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lerian-agent.chartRegistrySecretName" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "lerian-agent.labels" (dict "context" . "component" .Values.agent.name "name" .Values.agent.name) | nindent 4 }}
# The standard pull-secret shape - what `kubectl create secret docker-registry`
# writes and External Secrets Operator syncs - so both paths hand the agent the
# same file. The credential is offered only to the registry it is keyed for.
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict $host (dict "username" $registry.username "password" $registry.password "auth" $auth)) | toJson | quote }}
{{- end }}
{{- end }}
