suite: app-lerian client secret is one kept source
release:
  name: pam
  namespace: pam
set:
  identity.secrets.LICENSE_KEY: x
  auth.secrets.LICENSE_KEY: x
  caradhras.secrets.LICENSE_KEY: x
  caradhras.image.tag: "2.4.0-beta.4"
tests:
  - it: generates a kept 40-char secret and every consumer reads it
    asserts:
      - isKind:
          of: Secret
        template: templates/caradhras/app-client-secret.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: templates/caradhras/app-client-secret.yaml
      - matchRegex:
          path: data.AUTHORIZER_CLIENT_SECRET
          pattern: "^[A-Za-z0-9+/]{54}={0,2}$"
        template: templates/caradhras/app-client-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: appLerianClientSecret
            valueFrom:
              secretKeyRef:
                name: pam-auth-app-client-secret
                key: AUTHORIZER_CLIENT_SECRET
        template: templates/caradhras/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHORIZER_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: pam-auth-app-client-secret
                key: AUTHORIZER_CLIENT_SECRET
        template: templates/auth/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHORIZER_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: pam-auth-app-client-secret
                key: AUTHORIZER_CLIENT_SECRET
        template: templates/identity/deployment.yaml

  - it: carries the provided value
    set:
      auth.secrets.AUTHORIZER_CLIENT_SECRET: x
    asserts:
      - equal:
          path: data.AUTHORIZER_CLIENT_SECRET
          value: eA==
        template: templates/caradhras/app-client-secret.yaml

  - it: reuses the value already in the cluster
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: { version: v1, resource: secrets }
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: { name: pam-auth-app-client-secret, namespace: pam }
          data: { AUTHORIZER_CLIENT_SECRET: a2VwdA== }
    asserts:
      - equal:
          path: data.AUTHORIZER_CLIENT_SECRET
          value: a2VwdA==
        template: templates/caradhras/app-client-secret.yaml

  - it: reads the operator's auth Secret and renders no chart Secret
    set:
      auth.useExistingSecret: true
      auth.existingSecretName: mine
    asserts:
      - hasDocuments:
          count: 0
        template: templates/caradhras/app-client-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: appLerianClientSecret
            valueFrom:
              secretKeyRef:
                name: mine
                key: AUTHORIZER_CLIENT_SECRET
        template: templates/caradhras/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHORIZER_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: mine
                key: AUTHORIZER_CLIENT_SECRET
        template: templates/identity/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTHORIZER_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: mine
                key: AUTHORIZER_CLIENT_SECRET
        template: templates/auth/deployment.yaml

  - it: refuses to generate for a Caradhras image that cannot seed it
    set:
      caradhras.image.tag: "2.3.0"
    asserts:
      - failedTemplate:
          errorPattern: "cannot seed a generated one"

  - it: still renders an older image when the secret is provided
    set:
      caradhras.image.tag: "2.3.0"
      auth.secrets.AUTHORIZER_CLIENT_SECRET: x
    asserts:
      - isKind:
          of: Secret
        template: templates/caradhras/app-client-secret.yaml

  - it: no longer puts the secret in the auth and identity Secrets
    asserts:
      - notExists:
          path: data.AUTHORIZER_CLIENT_SECRET
        template: templates/auth/secrets.yaml
      - notExists:
          path: data.AUTHORIZER_CLIENT_SECRET
        template: templates/identity/secrets.yaml
  - it: rolls auth, identity and caradhras when the provided secret changes
    set:
      auth.secrets.AUTHORIZER_CLIENT_SECRET: one
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/app-client-secret"]
          pattern: "^[0-9a-f]{64}$"
        template: templates/auth/deployment.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/app-client-secret"]
          pattern: "^[0-9a-f]{64}$"
        template: templates/identity/deployment.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/app-client-secret"]
          pattern: "^[0-9a-f]{64}$"
        template: templates/caradhras/deployment.yaml
