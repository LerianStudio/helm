{{- $h := include "schedule.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "schedule.fullname" . }}
  labels:
    {{- include "schedule.labels" (dict "context" . "name" .Values.schedule.name ) | nindent 4 }} 
spec:
  revisionHistoryLimit: {{ .Values.schedule.revisionHistoryLimit | default 10 }}
  strategy: {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "schedule.selectorLabels" (dict "context" . "name" .Values.schedule.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/schedule/configmap.yaml") . | sha256sum }}
        {{- if not .Values.schedule.useExistingSecrets }}
        checksum/secret: {{ include (print $.Template.BasePath "/schedule/secrets.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- omit (include "schedule.labels" (dict "context" . "name" .Values.schedule.name ) | fromYaml) "helm.sh/chart" | toYaml | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
    {{- with .Values.schedule.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.schedule.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "schedule.fullname" . }}
          securityContext:
            {{- toYaml .Values.schedule.securityContext | nindent 12 }}
          image: {{ .Values.schedule.image.repository }}:{{ .Values.schedule.image.tag | default (include "plugin.version" .) }}
          imagePullPolicy: {{ .Values.schedule.image.pullPolicy }}
          ports:
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
          - secretRef:
              name: {{ if .Values.schedule.useExistingSecrets }}{{ required "schedule.existingSecretName is required when schedule.useExistingSecrets is true" .Values.schedule.existingSecretName }}{{ else }}{{ include "schedule.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "schedule.fullname" . }}
          {{- $otelEnabled := (index .Values "otel-collector-lerian").enabled }}
          env:
          {{- toYaml $h.env | nindent 10 }}
          {{- if $otelEnabled }}
          - name: "HOST_IP"
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
            value: "$(HOST_IP):4317"
          {{- end }}
          resources:
            {{- toYaml .Values.schedule.resources | nindent 12 }}
          startupProbe: {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe: {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $h.readinessProbe | nindent 12 }}
      {{- with .Values.schedule.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.schedule.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.schedule.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
