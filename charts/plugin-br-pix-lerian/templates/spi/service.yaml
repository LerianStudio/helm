{{- if .Values.spi.enabled }}
{{- $component := "spi" }}
{{- $values := .Values.spi }}
{{- /* Workload fragment delegated to lerian-common; naming/labels/selector are
   this chart's own helpers, passed already-rendered, so the output is
   byte-identical to the previous hand-rolled Service. */}}
{{- include "lerian-common.service" (dict
      "service" $values.service
      "name" (include "plugin-br-pix-lerian.componentFullname" (dict "context" $ "component" $component))
      "namespace" (include "global.namespace" $)
      "labels" (include "plugin-br-pix-lerian.labels" (dict "context" $ "component" $component))
      "selector" (include "plugin-br-pix-lerian.selectorLabels" (dict "context" $ "component" $component))) }}
{{- end }}
