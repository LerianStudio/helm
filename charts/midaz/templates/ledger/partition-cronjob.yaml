{{- if and .Values.ledger.enabled (include "midaz.ledgerPartitionEnabled" .) }}
{{- /* The daily pass retries index reconciliation and never prunes partitions. */}}
{{- $partition := .Values.ledger.partition | default dict }}
{{- $component := printf "%s-partition" .Values.ledger.name }}
apiVersion: batch/v1
kind: CronJob
metadata:
  {{- /* A CronJob name is capped at 52 characters (the controller appends an
     11-character suffix to each Job it spawns). */}}
  name: {{ printf "%s-partition" (include "midaz-ledger.fullname" . | trunc 42 | trimSuffix "-") }}
  labels:
    {{- include "midaz.labels" (dict "context" . "component" $component "name" $component) | nindent 4 }}
spec:
  schedule: {{ $partition.schedule | default "0 6 * * *" | quote }}
  {{- with $partition.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "midaz.labels" (dict "context" . "component" $component "name" $component) | nindent 8 }}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ $partition.activeDeadlineSeconds | default 1800 }}
      template:
        metadata:
          labels:
            {{- include "midaz.podLabels" (dict "context" . "component" $component "name" $component) | nindent 12 }}
        spec:
          {{- include "midaz-ledger.partitionPodSpec" (dict "context" . "args" (list "ensure" "--reconcile-indexes")) | nindent 10 }}
{{- end }}
