# values-internal-lerian.yaml — ambientes NOSSOS (benedita, anacleto, aws-*).
#
# ============================================================================
# O QUE ESTE ARQUIVO É
# ============================================================================
# O catálogo COMPLETO de serviços que o chart pode habilitar, cada um com o que
# custa e o que exige. Tudo DESLIGADO por padrão, exceto o que já foi validado
# em cluster.
#
# A ordem de habilitação é uma por vez, medindo séries antes e depois.
#
# ============================================================================
# ⚠️ NÃO USE OS NÚMEROS DA BENEDITA COMO REFERÊNCIA DE PRODUÇÃO
# ============================================================================
# A benedita tem 426k séries ativas; produção opera com 60–70k. E o motivo não é
# só escala de uso: MEDIDO, a benedita tem 3 nós de 256 CPUs cada = 768 CPUs.
# Métricas de nó escalam por CPU, não por nó, então "X séries em 3 nós" não
# transfere para nenhum outro ambiente.
#
# Use as TAXAS POR UNIDADE abaixo. Derivadas de medição, não estimadas, e
# conferidas contra o real (o modelo previu 4.905 séries de contêiner na
# benedita; o medido foi 4.893).
#
#   MÉTRICAS DE NÓ (com allowlist)      CONSUMO POR CONTÊINER (com allowlist)
#   por CPU:         5 séries           por contêiner:  ~11 séries
#   por nó:         ~28 séries          por pod:         ~2 séries
#   por disco:      ~10 séries
#   por interface:  ~12 séries
#
#   custo = (CPUs x 5) + (nós x 28) + (discos x 10) + (interfaces x 12)
#         + (contêineres x 11) + (pods x 2)
#
# EXEMPLOS CALCULADOS COM O MODELO:
#
#   ambiente              nós x CPU   contêineres   nó      contêiner   TOTAL
#   -------------------   ---------   -----------   -----   ---------   ------
#   produção pequena       3 x 8          80          336     1.000     1.336
#   produção média         6 x 16        200          912     2.500     3.412
#   benedita (referência)  3 x 256       375        4.056     4.905     8.961
#
# Num ambiente de 60–70k séries ativas, ligar os dois custa ~2% (produção
# pequena) a ~5% (média). Na benedita seria 2% — mesma ordem, mas por acidente:
# lá a base é 6x maior E os nós são 32x maiores.
#
# ⚠️ RECALCULE POR AMBIENTE antes de habilitar. `kubectl get nodes` dá CPUs e
# nós; `kubectl get pods -A` dá a contagem de pods.
#
# ============================================================================
# ⚠️ ESTE ARQUIVO NÃO SERVE PARA CLUSTER DE CLIENTE
# ============================================================================
# `# ============================================================================
# ESTADO DE CADA SERVIÇO — este quadro é a resposta rápida
# ============================================================================
#
#  SERVIÇO                       ESTADO      ONDE ESTÁ NESTE ARQUIVO
#  ----------------------------  ----------  ----------------------------------
#  Telemetria de app (OTLP)      ✅ LIGADO   `node.enabled: true`      (§6)
#  Objetos de cluster + eventos  ✅ LIGADO   `singleton.enabled: true` (§6)
#  Objetos de cluster (KSM)      📦 reusa    `kube-state-metrics: false` (§2)
#                                            ↳ COLETA ATIVA. O false só diz "não
#                                              instale outro"; o scrape aponta
#                                              para o KSM que o ambiente já roda
#  Métricas de nó                ⬜ off      `collection.nodeInfrastructure` (§3)
#  node-exporter (subchart)      ⬜ off      `node-exporter:`          (§3)
#  Fleet Management              ⬜ off      `fleetManagement:`        (§5)
#  ----------------------------  ----------  ----------------------------------
#  podLogs                       ✳ n/impl   catálogo comentado        (§4)
#  profiles (perfilamento eBPF)  ✳ n/impl   catálogo comentado        (§4)
#  costMetrics                   ✳ n/impl   catálogo comentado        (§4)
#  containerResources            ✳ n/impl   catálogo comentado        (§4)
#  ----------------------------  ----------  ----------------------------------
#  kepler, Beyla, windows-exp.   ❌ nunca    descartados com motivo    (§4)
#  alloy-operator                ❌ nunca    descartado com motivo     (§4)
#
# ============================================================================
# INVENTÁRIO COMPLETO — os 17 serviços que o Alloy oferece
# ============================================================================
# Levantado do chart guarda-chuva 4.3.3 (a lista canônica), cruzado com o que o
# nosso chart instancia de fato.
#
#  LIGADO (3)
#    applicationObservability   telemetria de app por OTLP        papel node
#    clusterMetrics             objetos de cluster (via KSM)      papel singleton
#    clusterEvents              eventos do Kubernetes             papel singleton
#
#  IMPLEMENTADO, off (1)
#    hostMetrics                métricas de nó, com allowlist     §3
#
#  A IMPLEMENTAR — decidido que VAI entrar (1)
#    costMetrics                custo (opencost) — habilitar depois no interno
#
#  NÃO IMPLEMENTADO — avaliar ao levar para aws-staging (4)
#    profiling                  perfilamento contínuo por eBPF
#    profilesReceiver           receber perfis que a app envia
#    costMetrics                custo (opencost)
#    annotationAutodiscovery    descoberta por anotação nos pods
#    prometheusOperatorObjects  consumir PodMonitor/ServiceMonitor
#
#  NÃO SE APLICA (9)
#    podLogsViaLoki             ❌ já temos log das aplicações por OTLP
#    podLogsViaKubernetesApi    ❌ idem
#    podLogsObjects             ❌ idem
#    nodeLogs                   ❌ idem
#      ↳ decidido 2026-08-11. Medido: 15 serviços da Lerian, em 21 namespaces,
#        já entregam log por OTLP. Coletar por arquivo capturaria o MESMO log por
#        outro caminho e duplicaria o custo — e log é o maior custo da plataforma
#        hoje (o ledger sozinho domina a volumetria).
#      ⚠️ O que fica descoberto, para constar: log de contêiner que NÃO usa a lib
#        compartilhada — infra de terceiro, sidecars, jobs. Se algum dia precisar
#        diagnosticar um desses pelo log, o caminho é `kubectl logs`, não o
#        pipeline. Aceito.
#    autoInstrumentation        Beyla — decisão de negócio, não entra
#    kubernetesManifests        tail de manifesto; sem uso identificado
#    selfReporting              telemetria de uso para a Grafana; desligado
#                               deliberadamente (`enableReporting: false`)
#    podLogsViaOpenTelemetry    já coberto: é o que as apps fazem hoje via OTLP
#    windows-exporter           decisão de negócio; sem nós Windows
#
#  Dos 8 `telemetryServices` (componentes instaláveis):
#    kube-state-metrics  ⬜ off (o ambiente já roda um)
#    node-exporter       ⬜ off (o ambiente já roda um)
#    opencost            ✳ não implementado
#    beyla, kepler       ❌ decisão de negócio
#    windows-exporter    ❌ decisão de negócio
#    k8s-manifest-tail   ✳ sem uso identificado
#    sdkInjector         ✳ injeção de SDK; as apps já usam a lib compartilhada
#
# ⚠️ NOTA SOBRE PRIVILÉGIO NOS AMBIENTES INTERNOS
# O usuário esclareceu que privilégio, RBAC e políticas NÃO são restrição nos
# nossos clusters. Então o critério para os 9 acima é VALOR e CUSTO — o que a
# métrica responde e quanto de série ela adiciona — e não postura de segurança.
# A avaliação acontece ao levar para aws-staging, um por vez, medindo antes e
# depois. O que continua fora é o que é decisão de negócio: Beyla, kepler,
# windows-exporter.

# LEGENDA
#   ✅ LIGADO    a COLETA está ativa, e validada em cluster
#   📦 reusa     a coleta está ATIVA, mas o subchart NÃO é instalado — o Alloy
#                raspa um exportador que o ambiente já roda. `enabled: false`
#                aqui significa "não instale outro", NUNCA "não colete".
#                Verificado na benedita: kube_pod_info chega com
#                client_id=benedita (390 séries) enquanto
#                kube-state-metrics.enabled é false
#   ⬜ off       a chave EXISTE e funciona — mudar para true habilita
#   ✳ n/impl    a chave NÃO EXISTE no chart; está comentada como catálogo.
#                Descomentar não faz nada. Precisa ser implementada primeiro.
#   ❌ nunca     decidido não entrar; motivo registrado
#
# Só há DOIS serviços ligados: os dois papéis do agente. Todo o resto está off.

# `profile: own` desliga a exigência de credencial e libera métricas de nó. Num
# cluster de cliente use `values-cliente.yaml`.
#
# E note o limite, medido: a guarda de perfil NÃO É CONTROLE. Quem instala o
# chart controla o values, então trocar `profile` libera qualquer coisa —
# verificado. As guardas impedem quem ERRA, não quem quer. O controle de custo
# real fica no lado servidor, por `client.id`, e nasce como feature do
# alloy-server (projeto 2).

profile: own

origin:
  # ⚠️ Trocar isto num ambiente em operação é MIGRAÇÃO DE DADO: a marca compõe a
  # identidade da série no destino, então valor novo órfã todas as anteriores.
  id: SUBSTITUIR   # benedita | anacleto | aws-staging | aws-production

destination:
  endpoint: SUBSTITUIR

# ===========================================================================
# §1 — ✅ OS DOIS PAPÉIS DO AGENTE (os únicos serviços LIGADOS)
# ===========================================================================
# As chaves `enabled` destes dois estão na §6, junto com a configuração de
# credencial de cada papel — UM bloco por papel, porque chave YAML duplicada
# descarta a primeira em silêncio (verificado).

# --- Telemetria de aplicação por OTLP (o papel node) ---------------------
# É o núcleo do chart: recebe push das aplicações, enriquece com contexto k8s,
# marca procedência, aplica perímetro, sanitiza e entrega.
# Medido na benedita: 26 namespaces de aplicação entregando, 3 sinais.
# (o bloco `node:` completo está no fim do arquivo — UM bloco por papel, porque
# chave YAML duplicada descarta a primeira em SILÊNCIO; verificado)

# --- Estado de objetos de cluster + eventos (o papel singleton) ----------
# EXATAMENTE UMA réplica, imposto pelo chart. Mais de uma duplicaria toda série
# sem atributo que distinga os escritores — o defeito que esta migração corrige.
# Medido: DPM 3,41 -> 1,00, com 1 produtor distinto.
# (o bloco `singleton:` completo está no fim do arquivo)

# ===========================================================================
# §2 — ⬜ kube-state-metrics (off: o ambiente já roda um)
# ===========================================================================
# Única fonte de métricas de objeto de cluster no modelo Alloy: o agente não tem
# equivalente do receptor k8s_cluster do OTel.
#
# `false` porque benedita e anacleto JÁ rodam um (chart prometheus). Subir o
# nosso criaria dois produtores da mesma métrica — a duplicação que corrigimos.
# Em ambiente sem um, ligue e remova o clusterObjectTarget abaixo.
kube-state-metrics:
  enabled: false

collection:
  clusterObjectTarget: "prometheus-kube-state-metrics.monitoring.svc.cluster.local:8080"

  # =========================================================================
  # §3 — ⬜ MÉTRICAS DE NÓ (implementado, off)
  # =========================================================================
  # Já validado em cluster, mas fica desligado porque o volume é grande e a
  # decisão é por ambiente.
  #
  # MEDIDO na benedita (3 nós):
  #   sem allowlist   612 famílias / 46.575 séries  (11% do cluster inteiro)
  #   com allowlist    34 famílias /  2.612 séries  (-94,4%)
  #
  # Escala com o número de nós. O motor de cardinalidade são 256 CPUs x 8 modos
  # por métrica; a allowlist mantém 5 modos (idle, iowait, system, user, steal).
  #
  # Para ligar, DUAS coisas — instalar o exportador e raspá-lo são decisões
  # separadas:
  #   collection.nodeInfrastructure: true
  #   node-exporter.enabled: true          OU  collection.nodeExporterTarget
  nodeInfrastructure: false

  # Aponte para um node-exporter que o ambiente já rode. benedita e anacleto têm
  # `prometheus-prometheus-node-exporter` há mais de 40 dias.
  nodeExporterTarget: ""

  interval: "60s"
  dropDebugLogs: true

# node-exporter como subchart. `false` quando o ambiente já roda um.
# O privilégio que ele pede fica CONTIDO nele (não-root, sem eBPF, rootfs
# somente-leitura) em vez de no agente — que continua uid 473.
node-exporter:
  enabled: false

# ===========================================================================
# §4 — ✳ NÃO IMPLEMENTADOS + ❌ DESCARTADOS (catálogo, não configuração)
# ===========================================================================
# As chaves abaixo NÃO EXISTEM no chart ainda. Estão aqui como catálogo da ordem
# de habilitação acordada, com o que cada uma vai exigir quando for implementada.
#
# Descomentar não faz nada hoje — e é deliberado: uma flag que promete e não
# entrega é pior que sua ausência. Foi o defeito que o `nodeInfrastructure` teve
# até ser implementado de verdade.

# --- ❌ COLETA DE LOG POR ARQUIVO/API — NÃO SE APLICA -------------------
# Removido do catálogo em 2026-08-11: já temos log das aplicações por OTLP.
#
# Medido antes de decidir: 15 serviços da Lerian, em 21 namespaces, entregam log
# pelo papel node. Ligar coleta por arquivo capturaria o MESMO log por um segundo
# caminho, duplicando o que já é o maior custo da plataforma.
#
# Cobre podLogsViaLoki, podLogsViaKubernetesApi, podLogsObjects e nodeLogs — os
# quatro resolvem o mesmo problema, que já está resolvido.
#
# Lacuna aceita: contêiner que não usa a lib compartilhada (infra de terceiro,
# sidecars, jobs) não tem log no pipeline. Diagnóstico desses é `kubectl logs`.

# --- 1º: PERFILAMENTO CONTÍNUO (eBPF) -----------------------------------
# Componente verificado: `pyroscope.ebpf` existe e exige `forward_to`.
#
# ⚠️ O ÚNICO ITEM DESTA LISTA QUE MUDA A POSTURA DE PRIVILÉGIO.
# O values do guarda-chuva da Grafana usa preset `privileged` + `daemonset` para
# isto, e o README oficial pede `privileged: true` + `runAsUser: 0`.
#
# REGRA ACORDADA: entra como PAPEL PRÓPRIO, nunca como flag num papel existente.
# Ligar no papel node desfaria o uid 473 + rootfs somente-leitura no MESMO
# DaemonSet que recebe OTLP de 26 namespaces de aplicação. O privilégio fica
# contido num papel que só perfila.
#
# EXIGE: papel novo, `privileged: true`, `hostPID: true`, e um destino Pyroscope.
# profiles:
#   enabled: false

# --- 2º: MÉTRICAS DE CUSTO (opencost) -----------------------------------
# EXIGE um Prometheus próprio para scrape e armazenamento, mais credencial de
# FATURAMENTO da conta de nuvem — sem ela entrega preço de tabela, não custo real.
#
# É FinOps, ortogonal ao objetivo deste chart. Avaliar se não é melhor fora dele.
# costMetrics:
#   enabled: false

# --- 2º: CONSUMO REAL POR CONTÊINER (containerResources) ----------------
# Componente verificado: `prometheus.exporter.cadvisor` existe e carrega sem
# exigir atributo.
#
# SIM, É ISTO QUE FALTA para ter uso real de contêiner. O kube-state-metrics não
# substitui: ele lê a API do Kubernetes, então sabe o que foi DECLARADO
# (`resource_limits`, 737 séries) e o estado do objeto. Consumo não está na API —
# está no kubelet/cAdvisor.
#
# ============================================================================
# CUSTO MEDIDO (benedita, 3 nós — o prometheus-server local já coleta, então os
# números são reais, não estimativa)
# ============================================================================
#
#   sem filtro nenhum                    78 famílias / 90.948 séries
#   com allowlist de 16 famílias                     / 14.406 séries
#   allowlist + filtro de nível                      /  4.893 séries  (-94,6%)
#
# O QUE SOBRA — 16 famílias, contadas uma a uma:
#
#   POR CONTÊINER (container!="")                            séries
#   ------------------------------------------------------  ------
#   container_cpu_usage_seconds_total                           375
#   container_memory_usage_bytes                                375
#   container_memory_working_set_bytes                          375   ← o que
#   container_memory_rss                                        375     importa
#   container_memory_cache                                      375     p/ OOM
#   container_last_seen                                         375
#   container_spec_memory_limit_bytes                           374   ← o limite,
#   container_spec_cpu_period                                   374     p/ a razão
#   container_cpu_cfs_periods_total                             303
#   container_cpu_cfs_throttled_periods_total                   303   ← throttling
#   container_cpu_cfs_throttled_seconds_total                   303     de CPU
#   container_spec_cpu_quota                                    302
#                                                            -------
#                                                              4.209
#
#   POR POD (pod!="") — cAdvisor mede fs e rede no nível do POD, não do
#   contêiner. MEDIDO: essas 4 têm ZERO séries com nome de contêiner, então um
#   filtro `container!=""` sozinho as eliminaria por inteiro.
#   ------------------------------------------------------  ------
#   container_network_receive_bytes_total                        ~176
#   container_network_transmit_bytes_total                       ~176
#   container_fs_usage_bytes                                     ~166
#   container_fs_limit_bytes                                     ~166
#                                                            -------
#                                                                684
#
#   TOTAL                                                      4.893
#
# Dois cortes independentes, e o segundo foi a surpresa:
#
# 1. ALLOWLIST. As famílias caras não respondem nada — `container_tasks_state`
#    (5.255), `container_blkio_device_usage_total` (5.048),
#    `container_memory_failures_total` (4.204), `container_fs_reads/writes_total`
#    (3.885 cada). As que importam são baratas: `memory_usage_bytes` e
#    `memory_working_set_bytes` custam 1.393 séries cada.
#
# 2. `container!=""`. MEDIDO: de 1.393 séries de memory_usage, apenas 374 têm
#    nome de contêiner. As outras 1.019 (73%) são sandbox de pod e agregados do
#    cgroup raiz — o mesmo dado somado, num nível que ninguém consulta.
#
# ============================================================================
# O QUE ISSO COMPRA, com caso real medido agora
# ============================================================================
#   mimir-ingester-0 / ingester        94,4% do limite de memória
#   alloy-lerian-singleton / alloy      81,0%
#   cert-manager / cert-manager-c       79,7%
#   flowker-worker / flowker-worker     77,8%
#
# Isso é `working_set / spec_memory_limit`, ambos do cAdvisor. Hoje é INVISÍVEL
# no pipeline do Alloy — e a benedita tem 5 séries de
# `last_terminated_reason{reason="OOMKilled"}`: cinco contêineres já morreram por
# memória, e só soubemos depois.
#
# Na benedita a lacuna é encoberta pelo prometheus-server local. Num cluster BYOC
# não haveria nada.
#
# 16 famílias a manter: cpu_usage, cpu_cfs_throttled (×3), memory_usage,
# memory_working_set, memory_rss, memory_cache, spec_memory_limit,
# spec_cpu_quota/period, fs_usage, fs_limit, network_rx/tx, last_seen.
# containerResources:
#   enabled: false

# DECISÃO DE NEGÓCIO (não de privilégio) — decidido pelo usuário 2026-08-11:
#
# kepler (energia)        não faz sentido para o negócio. Consumo energético não
#                         responde pergunta de SLO nem regulatória aqui.
# Beyla (auto-instr.)     não faz sentido: as aplicações já emitem telemetria
#                         nativa pela lib compartilhada. Beyla existe para código
#                         que não se controla.
# windows-exporter        não há nós Windows; o stack é Go em Linux.
#
# ⚠️ Nos ambientes internos, privilégio/RBAC/política NÃO são restrição — o
# usuário confirmou. Então o argumento de segurança que estes três carregavam
# aqui foi removido: nos NOSSOS clusters eles seriam viáveis tecnicamente, e não
# entram porque não têm valor de negócio.
#
# A ressalva de privilégio permanece válida para o perfil `client` (BYOC), onde o
# cluster é de terceiro — ver docs/COMPONENTES-EXCLUIDOS.md.
# alloy-operator          ⚠️ REAVALIADO 2026-08-11, e o veredito mudou de nuance.
#
#   Medido na versão ATUAL (chart 0.6.3 / app 1.11.1), não na documentação:
#   o ClusterRole pede, em `rbac.authorization.k8s.io` sobre clusterroles,
#   clusterrolebindings, roles e rolebindings:
#
#     get list watch create update patch delete BIND ESCALATE
#
#   `escalate` permite conceder permissões que o próprio sujeito não tem —
#   é caminho para admin. Continua lá; a objeção original NÃO estava
#   desatualizada.
#
#   O QUE MUDOU: com `rbac.createClusterRoles: false` e `namespaces: [monitoring]`
#   os ClusterRoles DESAPARECEM do render (medido: sobram 3 Role + 3 RoleBinding,
#   nenhum ClusterRole) e o escalate fica restrito ao namespace. Isso é bem
#   diferente de escalate no cluster inteiro.
#
#   POR QUE AINDA NÃO ENTRA: o operator resolve gestão de frota
#   multi-instância — o guarda-chuva o adotou porque cada instância exigia um
#   subchart e o values do pai chegou a ~3.000 linhas. Temos DOIS papéis fixos.
#   Não há problema para ele resolver aqui, então o privilégio não compra nada.
#
#   QUANDO REABRIR: se passarmos de dois para muitos papéis (profiling, logs,
#   receiver separados, como o guarda-chuva faz com cinco), o custo de gerenciar
#   subcharts pode passar a justificar. Aí a discussão é honesta — hoje seria
#   privilégio sem contrapartida.
#
# Detalhe de cada um em docs/COMPONENTES-EXCLUIDOS.md.

# ===========================================================================
# §5 — ⬜ FLEET MANAGEMENT (pronto e inativo)
# ===========================================================================
# Nasce configurado, ligamos depois de validar nos nossos ambientes. Quatro
# validações no render ao habilitar; ver docs/FLEET-MANAGEMENT.md.
fleetManagement:
  enabled: false

# ===========================================================================
# §6 — ✅ OS PAPÉIS: `enabled` + credencial
# ===========================================================================
# É AQUI que os dois papéis são ligados. Estão no fim do arquivo porque a
# configuração de credencial de cada um vive no mesmo bloco.
# O destino interno não valida credencial, então a entrada é opcional. NÃO zere
# `extraEnv` para isso: apagaria também as variáveis do Fleet Management.
node:
  enabled: true
  alloy:
    extraEnv:
      - name: ALLOY_DESTINATION_CREDENTIAL
        valueFrom:
          secretKeyRef:
            name: alloy-lerian
            key: telemetry-token
            optional: true
      - name: ALLOY_FLEET_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: ALLOY_FLEET_TOKEN
        valueFrom:
          secretKeyRef:
            name: alloy-lerian
            key: fleet-token
            optional: true

singleton:
  enabled: true
  alloy:
    extraEnv:
      - name: ALLOY_DESTINATION_CREDENTIAL
        valueFrom:
          secretKeyRef:
            name: alloy-lerian
            key: telemetry-token
            optional: true
      - name: ALLOY_FLEET_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: ALLOY_FLEET_TOKEN
        valueFrom:
          secretKeyRef:
            name: alloy-lerian
            key: fleet-token
            optional: true
