# Default values for tracer components.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
nameOverride: "tracer"
fullnameOverride: ""
namespaceOverride: "tracer"

global:
  # -- Env-wide SHARED datastore mask (set once per environment; a native
  # tracer.configmap.<KEY> overrides it). Consumed by lerian-common.datastore.value.
  # Fields: postgres.{host,port,user,ssl}.
  # Example: datastores: { postgres: { host: "my-rds.example.com", user: "tracer" } }
  datastores: {}
  # -- Env-wide environment name. Consumed by lerian-common.globalValue (block
  # "env"). Fields: name. (configmap.ENV_NAME overrides.)
  # Example: env: { name: "production" }
  env: {}
  # -- Env-wide telemetry gate + endpoint. Consumed by lerian-common.globalValue
  # (block "observability"). Fields: enabled, otlpEndpoint. (configmap.ENABLE_TELEMETRY/
  # OTEL_EXPORTER_OTLP_ENDPOINT override.)
  # Example: observability: { enabled: true, otlpEndpoint: "otel-collector:4317" }
  observability: {}
  # -- Env-wide auth (plugin-access-manager). Consumed by lerian-common.globalValue
  # (block "auth"). Fields: enabled, host. (configmap.PLUGIN_AUTH_* overrides.)
  # Example: auth: { host: "http://plugin-access-manager-auth:4000" }
  auth: {}
  # -- Bootstrap job for external PostgreSQL: creates databases, roles, and grants privileges
  externalPostgresDefinitions:
    # -- Enable or disable the PostgreSQL bootstrap job
    enabled: false
    # -- PostgreSQL connection settings
    connection:
      # -- PostgreSQL host (last-resort fallback; the same postgres datastore
      # mask/native DB_HOST value wins over this when set)
      host: "tracer-postgresql.tracer.svc.cluster.local."
      # -- PostgreSQL port
      port: "5432"
    # -- Admin credentials for PostgreSQL
    postgresAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing DB_USER_ADMIN and DB_ADMIN_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "postgres"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for tracer role created by the job
    tracerCredentials:
      useExistingSecret:
        # -- Name of existing secret containing DB_PASSWORD_TRACER key
        name: ""
      # -- Password for tracer role (ignored if useExistingSecret.name is set)
      password: ""

tracer:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- Service name
  name: tracer

  # -- Service description
  description: "Real-time transaction validation and fraud prevention API"

  # -- Enable or disable the tracer service
  enabled: true

  # -- Number of replicas for the tracer service
  replicaCount: 1

  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10

  image:
    # -- Repository for the tracer service container image
    repository: lerianstudio/tracer
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "1.0.0"

  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []

  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""

  # -- Pod annotations for additional metadata
  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext:
    # -- Defines the group ID for the user running the process inside the container
    runAsGroup: 1000
    # -- Defines the user ID for the process running inside the container
    runAsUser: 1000
    # -- Ensures the process does not run as root
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
    # -- Defines the root filesystem as read-only
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  # -- PodDisruptionBudget configuration. Rendered via lerian-common.pdb with
  # specStyle "explicit": minAvailable and maxUnavailable are mutually exclusive
  # (policy/v1 rejects a PDB spec with both set) — set only ONE. Pre-existing bug
  # fixed here: both were set simultaneously, which the prior hand-rolled template
  # rendered as-is (no mutual-exclusivity check), producing a manifest the K8s API
  # server would reject at admission. Kept minAvailable (guarantees the single
  # default replica is never voluntarily evicted); dropped maxUnavailable.
  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Minimum number of available pods
    minAvailable: 1
    # -- Annotations for the PodDisruptionBudget
    annotations: {}

  # -- Deployment update strategy
  deploymentUpdate:
    # -- Type of deployment strategy
    type: RollingUpdate
    # -- Maximum number of pods that can be created over the desired number of pods
    maxSurge: 1
    # -- Maximum number of pods that can be unavailable during the update
    maxUnavailable: 1

  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Port for the HTTP API. Matches the tracer source convention
    # (Dockerfile EXPOSE 4020 + .env.example + Dockerfile.dev SERVER_PORT=4020).
    # Override in environment values.yaml when an existing deployment expects
    # a different port (e.g. legacy 8080).
    port: 4020
    annotations: {}

  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 500m
      memory: 512Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 5
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}

  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}

  # -- Affinity rules for pod scheduling
  affinity: {}

  # -- ConfigMap for environment variables and configurations. Most keys below
  # are NOT pinned: they duplicate the template's own default in
  # templates/configmap.yaml, so pinning them here was pure noise (and a drift
  # risk — a future template default change would silently have no effect
  # while the pin stands). Only genuine overrides + REQUIRED-when-enabled
  # documentation stay. Set any of them via configmap.<KEY> to override.
  # @default -- templates/configmap.yaml
  configmap: {}
    # =================================================================
    # Application identity
    # ENV_NAME is resolved via the global mask (global.env.name) — do NOT pin
    # it here, a native configmap.ENV_NAME WINS over the mask and defeats it.
    # The default ("production") lives in templates/configmap.yaml.
    # ALLOW_INSECURE_TLS/SERVER_PORT/SERVER_ADDRESS/LOG_LEVEL are NOT pinned —
    # no mask reads them and the chart already defaults them
    # ("true"/"4020"/":4020"/"info") in templates/configmap.yaml.
    # =================================================================

    # =================================================================
    # Authentication / CORS
    # API_KEY_ENABLED/CORS_ALLOWED_ORIGINS are NOT pinned — the chart already
    # defaults them ("false"/"*") in templates/configmap.yaml.
    # =================================================================

    # =================================================================
    # Auth Plugin (Access Manager) — resolved via the lerian-common auth mask
    # (global.auth.{enabled,host}). Neither PLUGIN_AUTH_ENABLED nor
    # PLUGIN_AUTH_ADDRESS is pinned here — pinning a native key would always
    # win over global.auth.host and make the mask permanently inert. The
    # real in-cluster FQDN default now lives in templates/configmap.yaml's
    # `auth.env` call (hostDefault), so global.auth.host can still override it.
    # =================================================================

    # =================================================================
    # PostgreSQL Database — host/port/user/sslmode resolved via the postgres
    # datastore mask (global.datastores.postgres / global.cloud). DB_HOST is
    # NOT pinned here — same reasoning as PLUGIN_AUTH_ADDRESS above; its real
    # default now lives in templates/configmap.yaml's datastore.value call.
    # DB_PORT/DB_USER/DB_SSL_MODE are NOT pinned — the chart already defaults
    # them ("5432"/"tracer"/"disable"). DB_NAME/MIGRATIONS_PATH are per-module
    # passthrough (no mask) and are NOT pinned either.
    # =================================================================

    # =================================================================
    # Swagger Documentation
    # SWAGGER_TITLE/DESCRIPTION/HOST/BASE_PATH/SCHEMES are NOT pinned — the
    # chart already defaults them in templates/configmap.yaml.
    # =================================================================

    # =================================================================
    # CEL Expression Engine
    # CEL_COST_LIMIT is NOT pinned — the chart already defaults it ("10000").
    # =================================================================

    # =================================================================
    # OpenTelemetry
    # ENABLE_TELEMETRY/OTEL_EXPORTER_OTLP_ENDPOINT are resolved via the global
    # mask (global.observability.{enabled,otlpEndpoint}) — do NOT pin them
    # here, a native key WINS over the mask and defeats it. Defaults ("false"/
    # "") live in templates/configmap.yaml. OTEL_LIBRARY_NAME/
    # OTEL_RESOURCE_SERVICE_NAME are per-service identity, NOT masked, and are
    # NOT pinned either — the chart already defaults them.
    # =================================================================

    # =================================================================
    # Cleanup Worker
    # CLEANUP_WORKER_ENABLED/CLEANUP_INTERVAL_HOURS are NOT pinned — the chart
    # already defaults them ("false"/"24").
    # =================================================================

    # =================================================================
    # Multi-Tenant — flat-passthrough via lerian-common.multiTenant.envFlat.
    # -- Enable multi-tenant mode. When true, the following fields are required:
    #    MULTI_TENANT_URL, MULTI_TENANT_REDIS_HOST, secrets.MULTI_TENANT_SERVICE_API_KEY.
    #    Also requires PLUGIN_AUTH_ENABLED=true and API_KEY_ENABLED_ONLY_VALIDATION=false
    #    (enforced by the app at boot for security).
    # MULTI_TENANT_ENABLED is NOT pinned — the chart already defaults it
    # ("false") in templates/configmap.yaml.
    # When MULTI_TENANT_ENABLED=true, also set:
    #   MULTI_TENANT_URL (required) — Tenant Manager URL, e.g.
    #     http://tenant-manager.<ns>.svc.cluster.local:4026
    #   MULTI_TENANT_REDIS_HOST (required) — Redis host for the tenant
    #     connection-pool registry
    #   MULTI_TENANT_ALLOW_INSECURE_HTTP / MULTI_TENANT_REDIS_PORT /
    #   MULTI_TENANT_REDIS_TLS (defaults "true" for tracer) /
    #   MULTI_TENANT_MAX_TENANT_POOLS / MULTI_TENANT_IDLE_TIMEOUT_SEC /
    #   MULTI_TENANT_TIMEOUT / MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD /
    #   MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC / MULTI_TENANT_CACHE_TTL_SEC /
    #   MULTI_TENANT_CONNECTIONS_CHECK_INTERVAL_SEC — all optional, chart-defaulted.
    # -- Optional cap on per-tenant DB connections (only set in MT integration tests
    #    or environments with very low DB max_connections; leave unset in production).
    #    NOT part of the multiTenant.envFlat standard key set — emitted directly
    #    by the template when set.
    # MULTI_TENANT_MAX_OPEN_CONNS_PER_TENANT: ""
    # MULTI_TENANT_MAX_IDLE_CONNS_PER_TENANT: ""

  # -- Secrets for storing sensitive data
  # @default -- templates/secrets.yaml
  secrets:
    # -- PostgreSQL password
    DB_PASSWORD: ""
    # -- API Key value (read by the app as $API_KEY when API_KEY_ENABLED=true).
    #    The chart previously named this API_KEY_SECRET, which the app never
    #    reads — silently disabling API-key auth even with API_KEY_ENABLED=true.
    API_KEY: ""
    # -- Tenant Manager service API key (required when MULTI_TENANT_ENABLED=true).
    #    Helm render fails fast if MT is enabled and this is empty.
    # MULTI_TENANT_SERVICE_API_KEY: ""
    # -- Optional Redis password for the tenant connection-pool registry.
    # MULTI_TENANT_REDIS_PASSWORD: ""

  # -- Existing secrets name
  useExistingSecret: false
  existingSecretName: ""

  # -- Extra environment variables
  extraEnvVars: []

  serviceAccount:
    # -- Specifies whether a ServiceAccount should be created
    create: true
    # -- Annotations for the ServiceAccount
    annotations: {}
    # -- Name of the service account
    # @default -- `tracer.fullname`
    name: ""

