    annotations: {}
    name: ""

  # -- Dedicated datastore connections for this component (override
  #    global.datastores.*). postgres: {host,user,name,port,ssl,replica*};
  #    redis: {host,port,user,db,tls}.
  datastores: {}
  # -- App configuration. PRODUCTIZED: every default now lives in
  #    templates/pixauto/configmap.yaml as `$cm.<KEY> | default "<value>"`.
  #    Set a KEY here ONLY to override a default; un-enumerated keys pass
  #    through too. Credentials are NOT configmap -- see `secrets` below.
  configmap: {}
  # -- Credentials (never rendered in the ConfigMap). Provide via a
  #    protected values source or useExistingSecret. DATABASE_URL and
  #    VALKEY_URL are composed URIs consumed by the migration Job and the
  #    wait-for-dependencies init container (NOT app-runtime config).
  secrets:
    DATABASE_URL: ""
    IDP_M2M_CLIENT_SECRET: ""
    LICENSE_KEY: ""
    MULTI_TENANT_SERVICE_API_KEY: ""
    REDIS_PASSWORD: ""
    SPI_CLIENT_SECRET: ""
    STREAMING_SASL_PASSWORD: ""
    STREAMING_TLS_CA_CERT: ""
    SYSTEMPLANE_POSTGRES_DSN: ""
    VALKEY_URL: ""
  useExistingSecret: false
  existingSecretName: ""

  extraEnvVars: {}

  # -- golang-migrate Job that applies SQL migrations from the component's
  # /migrations directory against the database referenced by DATABASE_URL.
  # The migrate binary ships in the same image; the chart renders a Job with
  # command [/migrate] overriding the default ENTRYPOINT (/app). Runs as a Helm
  # hook on pre-install + pre-upgrade. This is pixauto's ONLY migration Job —
  # the single chain also creates the systemplane_entries table, so
  # pixauto-systemplane has none.
  migrations:
    enabled: true
    # Image path holding the SQL files. Match the Dockerfile's COPY target.
    migrationsPath: /migrations
    ttlSecondsAfterFinished: 300
    backoffLimit: 3

# -----------------------------------------------------------------------------
# pixauto/systemplane/api — runtime config plane for Pix Automático
#
# Sole writer of the pixauto systemplane store; pixauto/api consumes it
# read-only over a Postgres ChangeFeed (LISTEN/NOTIFY on systemplane_changes)
# against the SAME database. No migration Job — see pixauto.migrations above.
# -----------------------------------------------------------------------------
pixautoSystemplane:
  enabled: false
  name: "pixauto-systemplane"
  description: "Runtime config plane for Pix Automático"
  replicaCount: 1
  revisionHistoryLimit: 10

  image:
    repository: "ghcr.io/lerianstudio/plugin-br-pix-lerian-pixauto-systemplane-api"
    pullPolicy: ""
    tag: ""

  imagePullSecrets: []

  # -- Override container entrypoint (e.g., to dispatch to a specific binary
  # inside a multi-binary image). When empty, the image's ENTRYPOINT is used.
  command: []
  # -- Container args
  args: []

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  pdb:
    enabled: false
    # Set EXACTLY ONE of minAvailable / maxUnavailable (0 is honoured; an
    # explicit null unsets a key). Setting both fails the render.
    # minAvailable: 1
    maxUnavailable: 1

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  service:
    type: ClusterIP
    port: 4117

  resources:
    limits: { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m, memory: 64Mi }

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1

  readinessProbe:
    path: "/pixauto/readyz"
  livenessProbe:
    path: "/pixauto/health"
  nodeSelector: {}
  tolerations: []
  affinity: {}

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # -- App configuration. PRODUCTIZED: every default now lives in
  #    templates/pixauto-systemplane/configmap.yaml as `$cm.<KEY> | default "<value>"`.
  #    Set a KEY here ONLY to override a default; un-enumerated keys pass
  #    through too. Credentials are NOT configmap -- see `secrets` below.
  configmap: {}
  # -- Credentials (never rendered in the ConfigMap). Provide via a
  #    protected values source or useExistingSecret. DATABASE_URL and
  #    VALKEY_URL are composed URIs consumed by the migration Job and the
  #    wait-for-dependencies init container (NOT app-runtime config).
  secrets:
    DATABASE_URL: ""
    LICENSE_KEY: ""
    MULTI_TENANT_SERVICE_API_KEY: ""
    SYSTEMPLANE_POSTGRES_DSN: ""
    SYSTEMPLANE_SECRET_MASTER_KEY: ""
  useExistingSecret: false
  existingSecretName: ""

  extraEnvVars: {}

systemplaneIngress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []
  routes:
    - path: /spi
      pathType: Prefix
      component: spiSystemplane
      serviceName: spi-systemplane
    - path: /dict
      pathType: Prefix
      component: dictSystemplane
      serviceName: dict-systemplane
    - path: /cob
      pathType: Prefix
      component: cobSystemplane
      serviceName: cob-systemplane
    - path: /pixauto
      pathType: Prefix
      component: pixautoSystemplane
      serviceName: pixauto-systemplane
    - path: /lerian
      pathType: Prefix
      component: adapterLerianSystemplane
      serviceName: adapter-lerian-systemplane

# -----------------------------------------------------------------------------
# Providers Ingress — outbound-provider adapters (provider mock, BACEN, JD, ...).
#
# Single hostname routes provider traffic by path prefix. Each route names a
# component already defined in the chart (or one a future PR adds) and the
# kebab-case Service name suffix.
#
# Today only adapter-provider-mock is shipped; BACEN and JD providers will be
# added as components in future PRs and exposed here under their own paths.
# -----------------------------------------------------------------------------
providersIngress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []
  routes:
    # Path must match the source-side routePrefix:
    #   apps/adapter-provider-mock/components/api/bootstrap/server.go
    #     const routePrefix = "/provider-mock"
    - path: /provider-mock
      pathType: Prefix
      component: adapterProviderMock
      serviceName: adapter-provider-mock
    - path: /lerian
      pathType: Prefix
      component: adapterLerian
      serviceName: adapter-lerian
    # Reserved for future components — uncomment when the bacen/jd
    # adapter components ship in the chart:
    # - path: /bacen
    #   pathType: Prefix
    #   component: bacenAdapter
    #   serviceName: bacen-adapter
    # - path: /jd
    #   pathType: Prefix
    #   component: jdAdapter
    #   serviceName: jd-adapter

postgresql:
  enabled: false
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/postgresql
    tag: "latest"
  # Bitnami subchart credentials. Operator MUST override when enabled.
  # For external Postgres set `enabled: false` and configure DATABASE_URL
  # per component via component secrets or an existing Kubernetes Secret.
  auth:
    enablePostgresUser: true
    postgresPassword: ""
    username: "pixswitch"
    password: ""
    database: "postgres"

# Valkey (Bitnami chart, OCI registry)
# Used by spi, dict-hub, dict-hub-vsync for VALKEY_URL (optional — caching).
valkey:
  enabled: false
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/valkey
    tag: "latest"
  # Bitnami subchart credentials. Operator MUST override when enabled.
  # For external Valkey/ElastiCache set `enabled: false` and configure
  # VALKEY_URL per component via an existing Kubernetes Secret (see header).
  auth:
    enabled: true
    password: ""

# RabbitMQ (groundhog2k chart — same as plugin-br-bank-transfer / matcher)
# Used only by dict-hub-vsync for RABBITMQ_URI.
# Chosen path: EXTERNAL broker with a CA-signed TLS cert (trusted by the system
# trust store) on amqps://:5671. The in-cluster subchart would present a
# self-signed cert that lib-commons rejects, so it stays disabled — the anacleto
# chaos/fuzzing overlays also migrate off the embedded broker to external.
rabbitmq:
  enabled: false
  image:
    tag: "3.13.6"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  # groundhog2k subchart credentials. Operator MUST override when enabled.
  # For external RabbitMQ / AmazonMQ set `enabled: false` and configure
  # dictHubVsync.secrets.RABBITMQ_URI via component secrets or an existing Kubernetes Secret.
  authentication:
    user:
      value: "pixswitch"
    password:
      value: ""
    erlangCookie:
      value: ""                  # MUST be set when enabled=true
                                 # (groundhog2k chart requires it; generate
                                 #  with `openssl rand -base64 32`)

# OpenTelemetry Collector (Lerian)
# Optional in-cluster collector. Disabled by default — set per-component
# OTEL_EXPORTER_OTLP_ENDPOINT to an external collector for production.
otel-collector-lerian:
  enabled: false
