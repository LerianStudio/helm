suite: fetcher optional licence file mount
templates:
  - templates/manager/deployment.yaml
  - templates/worker/deployment.yaml
  # loaded so the deployments can include and hash them
  - templates/manager/configmap.yaml
  - templates/manager/secrets.yaml
  - templates/worker/configmap.yaml
  - templates/worker/secrets.yaml
  - templates/common/configmap.yaml
  - templates/common/secrets.yaml
release:
  name: fetcher
  namespace: fetcher
tests:
  - it: renders no licence mount when licenseFile is null
    template: templates/manager/deployment.yaml
    set: {manager.licenseFile: null}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: LICENSE_FILE_PATH, value: /etc/lerian/license/license}
      - notExists: {path: spec.template.spec.volumes}
  - it: mounts the manager licence Secret as a directory
    template: templates/manager/deployment.yaml
    set: {manager.licenseFile.existingSecret: fetcher-licence}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LICENSE_FILE_PATH, value: /etc/lerian/license/license}
      - equal: {path: "spec.template.spec.containers[0].volumeMounts[0].mountPath", value: /etc/lerian/license}
      - equal: {path: "spec.template.spec.volumes[0].secret.secretName", value: fetcher-licence}
  - it: mounts the worker licence Secret as a directory
    template: templates/worker/deployment.yaml
    set: {worker.licenseFile.existingSecret: fetcher-licence}
    asserts:
      - equal: {path: "spec.template.spec.containers[0].volumeMounts[0].mountPath", value: /etc/lerian/license}
      - equal: {path: "spec.template.spec.volumes[0].secret.secretName", value: fetcher-licence}
