# Copy-paste starter for a managed/BYOC install. Every value here is set
# through the lerian-common global masks — do NOT add native
# {identity,auth}.configmap.<KEY> pins for ENV_NAME/AUTHORIZER_CLIENT_ID/
# AUTH_ENABLED/AUTH_PORT/DB_NAME: a native key WINS over its mask and defeats
# it (see values.yaml), and AUTH_ENABLED/AUTH_PORT/DB_NAME have no mask at all
# — the chart already defaults them.

global:
  # -- Managed-cloud topology preset: aws | gcp | azure. Leave "" for the
  # bundled in-cluster infra (plaintext). Endpoints (host/port/user) still
  # come from global.datastores below.
  cloud: ""
  env:
    name: "development"
  multiTenant:
    enabled: false
  datastores:
    redis:
      port: 6379
      user: "auth"
    postgres:
      port: 5432
      user: "auth"
  # -- Env-wide service discovery (Consul) tuning. Leave unset to keep it off
  # (SD_ENABLED stays with {auth,identity}.configmap.SD_ENABLED per component).
  serviceDiscovery: {}
    # address: "consul.internal:8500"
    # tls: "true"
  # -- Env-wide telemetry gate. Leave unset to keep the chart's own default.
  observability: {}
    # enabled: "true"

common:
  authorizer:
    # -- Casdoor application client id, shared by the identity and auth
    # components. Set ONCE here instead of per-component
    # {identity,auth}.configmap.AUTHORIZER_CLIENT_ID.
    clientId: "ac56c81d4d6d95c0ac12"

identity:
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []

  configmap:
    ALLOW_INSECURE_TLS: "true"

  secrets:
    AUTHORIZER_CLIENT_SECRET: ""
    LICENSE_KEY: ""
    ORGANIZATION_IDS: ""
    REDIS_PASSWORD: ""

auth:
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []

  configmap:
    ALLOW_INSECURE_TLS: "true"

  secrets:
    DB_PASSWORD: ""
    AUTHORIZER_CLIENT_SECRET: ""
    REDIS_PASSWORD: ""
    LICENSE_KEY: ""
    ORGANIZATION_IDS: ""

  initUser:
    enabled: true

# Bundled dependencies. On a managed-cloud install (global.cloud set), turn
# both off — you're pointing at RDS/ElastiCache instead of the in-cluster bundle.
auth-database:
  enabled: true

valkey:
  enabled: true
