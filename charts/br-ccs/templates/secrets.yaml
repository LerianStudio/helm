{{- if .Values.brCcs.enabled }}
{{- if not .Values.brCcs.useExistingSecret }}
{{- $s := .Values.brCcs.secrets | default dict }}
{{- $cm := .Values.brCcs.configmap | default dict }}
{{- $mtEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_ENABLED" "params" (.Values.brCcs.multiTenant | default dict) "field" "enabled" "default" "false")) "true" }}
{{- $rmqEnabled := eq (toString ($cm.RABBITMQ_ENABLED | default "false")) "true" }}
{{- $streamingEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_ENABLED" "params" (.Values.brCcs.streaming | default dict) "field" "enabled" "default" "false")) "true" }}
{{- /* Resolve the streaming SASL mechanism/username the same way streaming.env does
   (configmap.STREAMING_SASL_* > global.streaming.*) so streaming.secret's fail-fast
   agrees with the ConfigMap. */ -}}
{{- $gStream := (.Values.global | default dict).streaming | default dict }}
{{- $streamMech := $gStream.saslMechanism | default "" }}{{- if hasKey $cm "STREAMING_SASL_MECHANISM" }}{{- $streamMech = index $cm "STREAMING_SASL_MECHANISM" }}{{- end }}
{{- $streamUser := $gStream.saslUsername | default "" }}{{- if hasKey $cm "STREAMING_SASL_USERNAME" }}{{- $streamUser = index $cm "STREAMING_SASL_USERNAME" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-ccs.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-ccs.labels" (dict "context" . "component" .Values.brCcs.name "name" .Values.brCcs.name ) | nindent 4 }}
type: Opaque
stringData:
  # Infra passwords (PostgreSQL / Valkey) are single-sourced from the bundled
  # Bitnami subchart Secrets and read via secretKeyRef on the deployment. They
  # are written here ONLY for an EXTERNAL infra component without an
  # <subchart>.auth.existingSecret.
  {{- $pg := .Values.postgresql | default dict }}
  {{- $pgAuth := $pg.auth | default dict }}
  {{- if and (not (and (ne (toString $pg.enabled) "false") (not $pg.external))) (not $pgAuth.existingSecret) $s.POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ $s.POSTGRES_PASSWORD | quote }}
  {{- if $s.POSTGRES_REPLICA_PASSWORD }}
  POSTGRES_REPLICA_PASSWORD: {{ $s.POSTGRES_REPLICA_PASSWORD | quote }}
  {{- end }}
  {{- end }}

  # Redis/Valkey password (external-only; bundled valkey is read from its subchart Secret)
  {{- $vk := .Values.valkey | default dict }}
  {{- $vkAuth := $vk.auth | default dict }}
  {{- if and (not (and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled)) (not $vkAuth.existingSecret) $s.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ $s.REDIS_PASSWORD | quote }}
  {{- end }}
  {{- if $s.REDIS_CA_CERT }}
  REDIS_CA_CERT: {{ $s.REDIS_CA_CERT | quote }}
  {{- end }}

  # Multi-tenant (tenant-manager) secrets. The uniform SERVICE_API_KEY (required)
  # + REDIS_PASSWORD (optional) come from lerian-common.multiTenant.secret, which
  # fails fast when MT is enabled but the API key is empty. REDIS_CA_CERT is a
  # br-ccs extra kept inline.
  {{- with (include "lerian-common.multiTenant.secret" (dict
        "context" . "secrets" $s
        "secretName" (include "br-ccs.fullname" .)
        "valuesPrefix" "brCcs.secrets." "mode" "stringData"
        "enabled" $mtEnabled
        "useExistingSecret" .Values.brCcs.useExistingSecret)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- if $s.MULTI_TENANT_REDIS_CA_CERT }}
  MULTI_TENANT_REDIS_CA_CERT: {{ $s.MULTI_TENANT_REDIS_CA_CERT | quote }}
  {{- end }}

  # RabbitMQ credentials. When RABBITMQ_ENABLED=true and no full RABBITMQ_URL is
  # supplied, the app assembles the dial string from HOST/PORT/USER/PASS, so
  # RABBITMQ_DEFAULT_PASS is required (fail-fast). If RABBITMQ_URL is set (it
  # embeds the password) the pass is optional.
  {{- if and $rmqEnabled (not $s.RABBITMQ_URL) }}
  RABBITMQ_DEFAULT_PASS: {{ required "brCcs.secrets.RABBITMQ_DEFAULT_PASS is required when RABBITMQ_ENABLED=true (or provide brCcs.secrets.RABBITMQ_URL instead)" $s.RABBITMQ_DEFAULT_PASS | quote }}
  {{- else if $s.RABBITMQ_DEFAULT_PASS }}
  RABBITMQ_DEFAULT_PASS: {{ $s.RABBITMQ_DEFAULT_PASS | quote }}
  {{- end }}
  # Full amqp:// dial string. Embeds the password, so it is a Secret (never a
  # ConfigMap value). When set, the app dials via this instead of assembling the
  # URL from RABBITMQ_HOST/PORT/USER/PASS.
  {{- if $s.RABBITMQ_URL }}
  RABBITMQ_URL: {{ $s.RABBITMQ_URL | quote }}
  {{- end }}

  # Service-discovery ACL token (optional; only relevant when SD is enabled).
  {{- if $s.SD_TOKEN }}
  SD_TOKEN: {{ $s.SD_TOKEN | quote }}
  {{- end }}

  # Streaming SASL credentials (lerian-common.streaming.secret). Emitted only when
  # streaming is enabled with a SASL mechanism; STREAMING_SASL_PASSWORD is then
  # required (fail-fast), STREAMING_TLS_CA_CERT optional.
  {{- with (include "lerian-common.streaming.secret" (dict
        "context" . "secrets" $s
        "secretName" (include "br-ccs.fullname" .)
        "valuesPrefix" "brCcs.secrets." "mode" "stringData"
        "enabled" $streamingEnabled
        "useExistingSecret" .Values.brCcs.useExistingSecret
        "saslMechanism" $streamMech "saslUsername" $streamUser)) }}
  {{- . | nindent 2 }}
  {{- end }}

  # Crypto keys (REQUIRED in production — empty CCS_CRYPTO_MASTER_KEY fails fast
  # at boot by design; supply via a secrets manager or an existing Secret).
  {{- if $s.CCS_CRYPTO_MASTER_KEY }}
  CCS_CRYPTO_MASTER_KEY: {{ $s.CCS_CRYPTO_MASTER_KEY | quote }}
  {{- end }}
  {{- if $s.FETCHER_CRYPTO_KEY }}
  FETCHER_CRYPTO_KEY: {{ $s.FETCHER_CRYPTO_KEY | quote }}
  {{- end }}
  {{- /* STA business-event HMAC master-key catalogue ("v1:<hex>,..."). Held as a
         Secret (not a ConfigMap) because it is HMAC key material — the app reads
         STA_EVENT_HMAC_MASTER_KEYS via the envFrom secretRef and fails fast at
         boot when STA_EVENT_HMAC_VERIFY_ENABLED is on but the catalogue is
         missing/malformed. Inert while verification stays disabled. */}}
  {{- if $s.STA_EVENT_HMAC_MASTER_KEYS }}
  STA_EVENT_HMAC_MASTER_KEYS: {{ $s.STA_EVENT_HMAC_MASTER_KEYS | quote }}
  {{- end }}

  # License (lib-license-go). Read as env via the envFrom secretRef. LICENSE_KEY
  # authorizes the app against the Lerian license gateway at boot (fail-closed);
  # ORGANIZATION_IDS selects the enforcement scope (e.g. "global"). Held as a
  # Secret (not a ConfigMap) so the key material is not exposed in plain
  # manifests, matching the br-slc / br-sta / fetcher convention.
  {{- if $s.LICENSE_KEY }}
  LICENSE_KEY: {{ $s.LICENSE_KEY | quote }}
  {{- end }}
  {{- if $s.ORGANIZATION_IDS }}
  ORGANIZATION_IDS: {{ $s.ORGANIZATION_IDS | quote }}
  {{- end }}

  # Object storage credentials (per bucket)
  {{- range $k := (list "OBJECT_STORAGE_STA_ACCESS_KEY" "OBJECT_STORAGE_STA_SECRET_KEY" "OBJECT_STORAGE_CCS_ACCESS_KEY" "OBJECT_STORAGE_CCS_SECRET_KEY" "OBJECT_STORAGE_FETCHER_ACCESS_KEY" "OBJECT_STORAGE_FETCHER_SECRET_KEY") }}
  {{- if index $s $k }}
  {{ $k }}: {{ index $s $k | quote }}
  {{- end }}
  {{- end }}

  # Per-upstream M2M API keys (on-prem / local fallback)
  {{- range $k := (list "FETCHER_API_KEY" "REPORTER_API_KEY" "STA_API_KEY") }}
  {{- if index $s $k }}
  {{ $k }}: {{ index $s $k | quote }}
  {{- end }}
  {{- end }}

  # Per-upstream M2M OAuth2 client credentials (single-tenant). The client_id/client_secret
  # pair authenticates br-ccs to each upstream (Fetcher / Reporter / STA) via the
  # plugin-auth token endpoint. Multi-tenant (SaaS) resolves per-tenant credentials from
  # AWS Secrets Manager instead and ignores these. Held as a Secret (never a ConfigMap) so
  # the client secrets are not exposed in plain manifests, matching the *_API_KEY convention.
  {{- range $k := (list "FETCHER_CLIENT_ID" "FETCHER_CLIENT_SECRET" "REPORTER_CLIENT_ID" "REPORTER_CLIENT_SECRET" "STA_CLIENT_ID" "STA_CLIENT_SECRET") }}
  {{- if index $s $k }}
  {{ $k }}: {{ index $s $k | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
