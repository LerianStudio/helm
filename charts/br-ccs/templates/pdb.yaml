{{- if and .Values.brCcs.enabled .Values.brCcs.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "br-ccs.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-ccs.labels" (dict "context" . "component" .Values.brCcs.name "name" .Values.brCcs.name ) | nindent 4 }}
  {{- with .Values.brCcs.pdb.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- /* Key-presence check (not truthiness): an explicit maxUnavailable: 0 must
       render as maxUnavailable, not silently fall back to minAvailable. An empty
       string ("") still means "unset". */}}
  {{- if and (hasKey .Values.brCcs.pdb "maxUnavailable") (not (kindIs "invalid" .Values.brCcs.pdb.maxUnavailable)) (ne (toString .Values.brCcs.pdb.maxUnavailable) "") }}
  maxUnavailable: {{ .Values.brCcs.pdb.maxUnavailable }}
  {{- else if and (hasKey .Values.brCcs.pdb "minAvailable") (not (kindIs "invalid" .Values.brCcs.pdb.minAvailable)) (ne (toString .Values.brCcs.pdb.minAvailable) "") }}
  minAvailable: {{ .Values.brCcs.pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "br-ccs.selectorLabels" (dict "context" . "component" .Values.brCcs.name "name" .Values.brCcs.name ) | nindent 6 }}
{{- end }}
