  # -- Dedicated datastore masks for the SPI family (one Postgres + one Redis shared
  # by all four binaries). Overrides global.datastores; each configmap.<KEY> still wins.
  # postgres accepts host/port/user/name/ssl/replicaHost; redis accepts host.
  datastores: {}
  #   postgres: { host: "spi-postgresql", port: "5432", user: "brspi", name: "brspi", ssl: "require" }
  #   redis:    { host: "spi-valkey:6379" }
  # -- SHARED ConfigMap escape hatch for all four binaries: set/override ANY native
  # env KEY here (wins over the template default). Per-binary override via
  # spi.<api|dict|brcode|core>.configmap.<KEY>. Credentials NEVER go here — use secrets.
  configmap: {}
  # -- SHARED Secret map for all four binaries (emit-when-set; per-binary override via
  # spi.<comp>.secrets). Holds POSTGRES_PASSWORD/REDIS_PASSWORD and the PII/crypto keys.
  secrets: {}
  # -- Bring your own Secret instead of the chart-managed one (family-wide).
  useExistingSecret: false
  existingSecretName: ""
  api:
    replicaCount: 1
    revisionHistoryLimit: 10
    image:
