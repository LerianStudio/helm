{{- if .Values.manager.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plugin-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-manager.labels" (dict "context" . "name" .Values.manager.name ) | nindent 4 }}
  {{- $cloudAnn := include "lerian-common.cloud.saAnnotations" (dict "context" .) | trim }}
  {{- if or $cloudAnn .Values.manager.serviceAccount.annotations }}
  annotations:
    {{- with $cloudAnn }}{{ . | nindent 4 }}{{- end }}
    {{- with .Values.manager.serviceAccount.annotations }}{{- toYaml . | nindent 4 }}{{- end }}
  {{- end }}
{{- end }}