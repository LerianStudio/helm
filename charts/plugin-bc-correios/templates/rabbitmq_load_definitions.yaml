{{- if .Values.rabbitmq.enabled }}
{{- $component := index .Values "bc-correios" -}}
{{- $defs := .Files.Get "files/rabbitmq/load_definitions.json" | fromJson -}}
{{- /* The broker imports these definitions at boot and then creates no default user, so the app
   account is declared here from RABBITMQ_USER and RABBITMQ_PASS. With an existing app Secret the
   password is not known to the chart and no user is declared. */ -}}
{{- if not $component.useExistingSecret }}
{{- $user := $component.configmap.RABBITMQ_USER | default "plugin-bc-correios" -}}
{{- $_ := set $defs "users" (list (dict "name" $user "password" $component.secrets.RABBITMQ_PASS "tags" "")) -}}
{{- $_ = set $defs "permissions" (list (dict "user" $user "vhost" "/" "configure" ".*" "write" ".*" "read" ".*")) -}}
{{- end }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "bc-correios.fullname" . }}-rabbitmq-load-definition
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "bc-correios.labels" (dict "context" . "component" "rabbitmq" "name" "load-definition") | nindent 4 }}
data:
  load_definition.json: |
    {{ $defs | toJson | b64enc | nindent 4 }}
{{- end }}
