{{- if and .Values.tracer.enabled (dig "serviceAccount" "create" true .Values.tracer) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
  {{- with (dig "serviceAccount" "annotations" dict .Values.tracer) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
