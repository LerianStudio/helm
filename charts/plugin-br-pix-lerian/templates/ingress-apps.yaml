{{- /*
Apps Ingress — single hostname routes user-facing traffic to the application
components (SPI, DICT hub/proxy, COB hub/proxy, Pix Automático).

Each path under .Values.appsIngress.routes maps to one component's Service.
The chart renders one path rule per route only when the target component is
enabled; rendering is skipped entirely when .Values.appsIngress.enabled is
false or no routes resolve to enabled components.

No path rewriting is performed at the ingress — apps own their /<component>
path namespace (e.g. SPI's router registers /spi/health, /spi/keys/lookup).

adapter-provider-mock retains its own per-component ingress block; this shared
ingress only covers the externally-facing application components.

The rendering logic itself lives in the shared
"plugin-br-pix-lerian.routedIngress" helper (templates/_helpers.tpl).
*/}}
{{- if .Values.appsIngress.enabled }}
{{- /*
Pix Automatico exposure guards.

WHAT THE APP ACTUALLY DOES. An earlier version of this comment claimed the
lib-auth middleware on /pixauto/internal/v1/* was "the only authentication
boundary". That is wrong, and the mistake matters. In
apps/pixauto/internal/adapters/http/in/routes.go the authorize middleware is
appended by routeChain under a STRUCTURAL condition:

    if sharedboot.AuthEnabled(wiring.Auth) {
        chain = append(chain, authorize(wiring.Auth, ApplicationName, resource, action))
    }

and every route goes through routeChain — the internal callback and execution
groups AND the twelve public payer routes under /pixauto/v1. So when
PLUGIN_AUTH_ENABLED is not "true", authentication is absent from the WHOLE
component, not just the internal group. Dropping the internal paths from the
ingress therefore narrows the exposure but does not close it: /pixauto/v1
still mutates mandates (decide, cancel, PATCH parameters) with no caller
identity. Both guards below are needed; neither substitutes for the other.

The previous behaviour here printed a WARNING comment into the rendered
manifest and continued. A comment in a manifest is not an access control, and
the render succeeded, so nothing stopped the deploy. It is replaced by two
hard failures.
*/}}
{{- $pixautoRoutes := list }}
{{- range $route := .Values.appsIngress.routes }}
  {{- if eq $route.component "pixauto" }}
    {{- $pixautoRoutes = append $pixautoRoutes $route }}
  {{- end }}
{{- end }}
{{- if and $pixautoRoutes .Values.pixauto.enabled }}
{{- /*
GUARD 1 — never publish the internal M2M namespace on the apps host.
Independent of authentication: these routes take BACEN-derived recurrence
callbacks and drive the scheduler sweep, and they have no business being
reachable from the apps hostname. A Prefix rule at /pixauto or at / swallows
/pixauto/internal/v1/* just as surely as naming it outright, so all three
shapes are rejected.
*/}}
{{- range $route := $pixautoRoutes }}
{{- $path := trimSuffix "/" (toString $route.path) }}
{{- $prefixLike := ne (toString (default "Prefix" $route.pathType)) "Exact" }}
{{- if or (hasPrefix "/pixauto/internal" $path) (and $prefixLike (or (eq $path "/pixauto") (eq $path ""))) }}
{{- fail (printf "plugin-br-pix-lerian: appsIngress route %q (pathType %s) publishes the Pix Automatico internal M2M group /pixauto/internal/v1/* on the apps host. Those endpoints take inbound recurrence callbacks and drive the scheduler sweep and must not be externally routed. Use %q for the client-facing surface, plus an Exact route for /pixauto/readyz if the dashboard link is needed - that is what values.yaml ships by default." $route.path (default "Prefix" $route.pathType) "/pixauto/v1") }}
{{- end }}
{{- end }}
{{- /*
GUARD 2 — refuse to publish Pix Automatico at all while authentication is off.
See the routeChain note above: with PLUGIN_AUTH_ENABLED != "true" the payer
routes under /pixauto/v1 are unauthenticated too, so Guard 1 alone would still
leave mandate mutations open to anyone who can reach the apps host.
*/}}
{{- $auth := toString (default "false" .Values.pixauto.configmap.PLUGIN_AUTH_ENABLED) }}
{{- if ne $auth "true" }}
{{- fail (printf "plugin-br-pix-lerian: appsIngress publishes Pix Automatico but pixauto.configmap.PLUGIN_AUTH_ENABLED is %q, not \"true\". The app appends its authorize middleware only when auth is enabled, so EVERY pixauto route would be served without authentication - including the payer routes under /pixauto/v1 that create, decide and cancel mandates. Fix by setting pixauto.configmap.PLUGIN_AUTH_ENABLED=\"true\" (values-template.yaml already does), or by removing the pixauto route(s) from appsIngress.routes if this environment should not expose Pix Automatico." $auth) }}
{{- end }}
{{- end }}
{{- include "plugin-br-pix-lerian.routedIngress" (dict "context" $ "component" "apps" "config" .Values.appsIngress) }}
{{- end }}
