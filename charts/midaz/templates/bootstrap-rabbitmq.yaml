{{- $ext := .Values.global.externalRabbitmqDefinitions }}
{{- $bundled := and .Values.rabbitmq.enabled .Values.ledger.enabled (not $ext.enabled) }}
{{- if or $ext.enabled $bundled }}
{{- $appSecret := $ext.appCredentials.useExistingSecret.name }}
{{- $txPass := $ext.appCredentials.transactionPassword }}
{{- $consPass := $ext.appCredentials.consumerPassword }}
{{- $adminSecret := $ext.rabbitmqAdminLogin.useExistingSecret.name }}
{{- if $bundled }}
{{- /* Logged in as transaction with the password the definitions Secret last gave the broker,
   else (upgrade from a chart without that key) the one the ledger runs on. */}}
{{- $appSecret = ternary .Values.ledger.existingSecretName "" .Values.ledger.useExistingSecret }}
{{- $txPass = .Values.ledger.secrets.RABBITMQ_DEFAULT_PASS }}
{{- $consPass = .Values.ledger.secrets.RABBITMQ_CONSUMER_PASS }}
{{- $adminSecret = ternary .Values.ledger.existingSecretName (include "midaz-ledger.fullname" .) .Values.ledger.useExistingSecret }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: midaz-bootstrap-rabbitmq-definitions
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- /* A hook sorted before the Job: pre-upgrade hooks run before plain resources exist.
       Never hook-succeeded, or it is deleted before the Job mounts it. */}}
    argocd.argoproj.io/hook: Sync
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  load_definitions.json: {{ .Files.Get "files/rabbitmq/load_definitions.json" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: midaz-bootstrap-rabbitmq
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- /* Recreated at every run: a Job's spec.template is immutable, so any chart bump would fail a
       plain upgrade. Annotations for both delivery paths; each controller reads only its own. */}}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # the curl image's own user
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - name: RABBITMQ_HOST
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.portAmqp | quote }}
          command:
            - /bin/sh
            - -c
            - >
              TIMEOUT=300;
              ELAPSED=0;
              echo "Checking $RABBITMQ_HOST:$RABBITMQ_PORT...";
              while ! nc -z "$RABBITMQ_HOST" "$RABBITMQ_PORT"; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for $RABBITMQ_HOST:$RABBITMQ_PORT after ${TIMEOUT}s";
                  exit 1;
                fi;
                echo "$RABBITMQ_HOST:$RABBITMQ_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
                sleep 5;
                ELAPSED=$((ELAPSED + 5));
              done;
              echo "$RABBITMQ_HOST:$RABBITMQ_PORT is ready!";
      containers:
        - name: apply-definitions
          image: curlimages/curl:8.7.1
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          command:
            - sh
            - -c
            - |
              set -e

              # Build base URL - omit port for default HTTPS (443) or HTTP (80)
              if [ "$RABBITMQ_PROTOCOL" = "https" ] && [ "$RABBITMQ_PORT" = "443" ]; then
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST"
              elif [ "$RABBITMQ_PROTOCOL" = "http" ] && [ "$RABBITMQ_PORT" = "80" ]; then
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST"
              else
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST:$RABBITMQ_PORT"
              fi

              echo "=== RabbitMQ Bootstrap ==="
              echo "API URL: $BASE_URL"
              echo ""

              case "$RABBITMQ_TRANSACTION_PASS$RABBITMQ_CONSUMER_PASS" in *[[:cntrl:]]*)
                echo "A RabbitMQ app password (transaction or consumer) contains a control character; choose one without."
                exit 1;;
              esac

              RABBITMQ_ADMIN_PASS=${RABBITMQ_APPLIED_PASS:-$RABBITMQ_ADMIN_PASS}

              # Every run PUTs both users, then POSTs the definitions (their permissions need the users),
              # so a rotated password converges. The password is JSON-escaped.
              put_user() {
                echo "Updating RabbitMQ user: $1..."
                PASS=$(printf '%s' "$2" | sed 's/[\\"]/\\&/g')
                HTTP_CODE=$(curl -sSk -o /tmp/response.txt -w "%{http_code}" \
                  -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" \
                  -H "content-type: application/json" \
                  -X PUT \
                  --data "{\"password\":\"$PASS\",\"tags\":\"administrator\"}" \
                  "$BASE_URL/api/users/$1")
                if [ "$HTTP_CODE" = 401 ]; then
                  echo "RabbitMQ refused the login of user $RABBITMQ_ADMIN_USER (HTTP 401).{{ if $bundled }} The broker holds another password than the one this chart gave it: restart the broker pod ($RABBITMQ_HOST-0, which boots with the chart's passwords and drops queued messages), then upgrade or sync again. Once that succeeds, restart the ledger, whose pods keep the password they started with: kubectl -n {{ .Release.Namespace }} rollout restart deployment/{{ include "midaz-ledger.fullname" . }}{{ end }}"
                  exit 1
                fi
                if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                  echo "Error updating $1 user (HTTP $HTTP_CODE):"
                  cat /tmp/response.txt
                  exit 1
                fi
                # An admin that just changed its own password logs in with the new one.
                if [ "$1" = "$RABBITMQ_ADMIN_USER" ]; then RABBITMQ_ADMIN_PASS=$2; fi
                echo "Done."
              }
              put_user transaction "$RABBITMQ_TRANSACTION_PASS"
              put_user consumer "$RABBITMQ_CONSUMER_PASS"

              echo "Applying RabbitMQ definitions from file..."
              HTTP_CODE=$(curl -sSk -o /tmp/response.txt -w "%{http_code}" \
                -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" \
                -H "content-type: application/json" \
                -X POST \
                --data-binary @/definitions/load_definitions.json \
                "$BASE_URL/api/definitions")
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "Error applying definitions (HTTP $HTTP_CODE):"
                cat /tmp/response.txt
                exit 1
              fi
              echo "Done."
              {{- if $bundled }}

              # The subchart never seeds midaz beside boot-time definitions; drop the one the old file made.
              HTTP_CODE=$(curl -sSk -o /tmp/response.txt -w "%{http_code}" \
                -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" -X DELETE "$BASE_URL/api/users/midaz")
              case "$HTTP_CODE" in 2??|404) ;; *) echo "Error deleting midaz (HTTP $HTTP_CODE):"; cat /tmp/response.txt; exit 1;; esac
              {{- end }}

              echo ""
              echo "=== RabbitMQ Bootstrap completed successfully ==="
          env:
            - name: RABBITMQ_PROTOCOL
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.protocol | quote }}
            - name: RABBITMQ_HOST
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.port | quote }}
            - name: RABBITMQ_TRANSACTION_PASS
              {{- if $appSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret | quote }}
                  key: RABBITMQ_DEFAULT_PASS
              {{- else }}
              value: {{ $txPass | quote }}
              {{- end }}
            - name: RABBITMQ_CONSUMER_PASS
              {{- if $appSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $appSecret | quote }}
                  key: RABBITMQ_CONSUMER_PASS
              {{- else }}
              value: {{ $consPass | quote }}
              {{- end }}
            - name: RABBITMQ_ADMIN_PASS
              {{- if $adminSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: {{ if $bundled }}RABBITMQ_DEFAULT_PASS{{ else }}RABBITMQ_ADMIN_PASS{{ end }}
              {{- else }}
              value: {{ $ext.rabbitmqAdminLogin.password | quote }}
              {{- end }}
            {{- if $bundled }}
            - name: RABBITMQ_APPLIED_PASS
              valueFrom:
                secretKeyRef:
                  name: midaz-rabbitmq-load-definition
                  key: transaction-password
                  optional: true
            {{- end }}
            - name: RABBITMQ_ADMIN_USER
              {{- if $bundled }}
              value: transaction
              {{- else if $adminSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: RABBITMQ_ADMIN_USER
              {{- else }}
              value: {{ $ext.rabbitmqAdminLogin.username | quote }}
              {{- end }}
          volumeMounts:
            - name: definitions
              mountPath: /definitions
      volumes:
        - name: definitions
          configMap:
            name: midaz-bootstrap-rabbitmq-definitions
            items:
              - key: load_definitions.json
                path: load_definitions.json
{{- end }}