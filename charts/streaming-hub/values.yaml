# Default values for streaming-hub.
# This is a YAML-formatted file.
#
# streaming-hub consumes lib-streaming CloudEvents from Kafka/Redpanda and fans
# them out to per-tenant subscribers. ONE image, ONE binary, RUNTIME-selected
# into a role via STREAMING_HUB_ROLE. This chart exposes that via a single
# `mode` switch (see streamingHub.mode below).
#
# External infra (provisioned OUTSIDE this chart): Kafka/Redpanda, PostgreSQL and
# — for the control plane's per-tenant rate limiting — Redis/Valkey.
# There are NO database/broker/cache/OTEL subcharts (deliberate — see Chart.yaml).

# -- Override the chart name component of resource names.
nameOverride: ""
# -- Override the fully-qualified release name (wins verbatim).
fullnameOverride: ""
# -- Override the namespace (defaults to .Release.Namespace).
namespaceOverride: ""
# @section Global (env-wide, shared across components / the umbrella)
global:
  # -- Env-wide pod scheduling. `spread` is the topologySpreadConstraints preset
  #    (lerian-common.topologySpreadConstraints) applied to every component
  #    Deployment (all / ingest / delivery). Each constraint counts only the
  #    component's own pods of the same ReplicaSet (matchLabelKeys:
  #    [pod-template-hash]), so rolling updates never deadlock.
  #    streamingHub.spread and streamingHub.<component>.spread override these
  #    fields one by one; a raw topologySpreadConstraints list replaces the preset.
  scheduling:
    spread:
      # -- Master switch for the spread preset.
      enabled: true
      # -- Spread across nodes (kubernetes.io/hostname): ScheduleAnyway (soft) | DoNotSchedule (hard) | "" (off).
      hostname: ScheduleAnyway
      # -- Spread across zones (topology.kubernetes.io/zone): ScheduleAnyway | DoNotSchedule | "" (off).
      #    Off by default: on clusters without zone labels (bare-metal, k3s) a zone
      #    constraint silently cancels the hostname spread. Enable on EKS/GKE/AKS.
      zone: ""
      # -- Max allowed pod-count difference between topology domains (integer >= 1).
      maxSkew: 1
      # -- Minimum eligible domains for DoNotSchedule constraints (0 = off). With
      #    fewer domains the scheduler treats the global minimum as 0, so a hard
      #    hostname spread never stacks replicas on a single node (Karpenter adds one).
      minDomains: 0
      # -- Honor | Ignore | "" (omitted = Kubernetes default Ignore). Honor counts
      #    only nodes whose taints the pod tolerates (e.g. skips a node being drained).
      nodeTaintsPolicy: ""
  # -- Shared datastore masks (lerian-common.datastore.value). Operator sets the
  #    typed fields instead of raw env; empty by default so the template defaults
  #    win (standalone stays render-equivalent). Dedicated per-component overrides
  #    live under streamingHub.datastores. Example:
  #      postgres: { host: pg.internal, port: "5432", user: streaming_hub,
  #                  name: streaming_hub, ssl: require }
  datastores: {}
  # -- Shared plugin-access-manager JWT auth contract (lerian-common.auth.env).
  auth:
    # -- Enable control-plane JWT auth env-wide (PLUGIN_AUTH_ENABLED). Override per
    #    component via streamingHub.configmap.PLUGIN_AUTH_ENABLED.
    enabled: true
  # -- Shared observability contract (lerian-common.globalValue block `observability`).
  #    Empty by default → the template ships the defaults. Fields: otlpEndpoint
  #    (OTEL_EXPORTER_OTLP_ENDPOINT), insecureExporter (OTEL_INSECURE_EXPORTER),
  #    deploymentEnvironment (ENV_NAME). The per-pod OTLP endpoint override is
  #    governed separately by streamingHub.telemetry.enabled.
  observability: {}
  # -- Shared multi-tenant contract (lib-commons/multitenancy). `enabled` drives the
  #    UNPREFIXED MULTI_TENANT_ENABLED knob; override per component via
  #    streamingHub.configmap.MULTI_TENANT_ENABLED. Fields: url (MULTI_TENANT_URL),
  #    redisHost / redisPort / redisTls (MULTI_TENANT_REDIS_*).
  #    `url` is MANDATORY whenever MULTI_TENANT_ENABLED=true: the app refuses to
  #    boot without it from 1.6.0 on, so the chart refuses to RENDER without it.
  #    It points at the platform tenant-manager, which reports the active tenant
  #    set (the control-plane authorization allowlist). The hub still reads each
  #    tenant's credentials from AWS Secrets Manager — that part needs no secret
  #    here — but the ROSTER comes over this URL.
  #    redisHost/Port/Tls are the tenant-lifecycle Pub/Sub fast channel: the hub
  #    subscribes to the TENANT-MANAGER's Valkey so an onboarding or offboarding
  #    lands without waiting for the fixed 5-minute roster tick. Optional and a
  #    sanctioned degraded mode when unset — except on a `delivery`-role pod, where
  #    the tick is not mounted at all and the allowlist then freezes at its boot
  #    value for the life of the process.
  #    NOT the same Redis as the hub's OWN STREAMING_HUB_REDIS_* (the rate-limiter
  #    store). Two different instances; pointing one at the other degrades silently.
  #    Precedence for every key: streamingHub.configmap.<KEY> > global.multiTenant.<field>.
  multiTenant: {}
  # -- Bootstrap Job for an external/shared PostgreSQL: creates the hub's ONE
  #    database + role and grants privileges. The hub owns a SINGLE database with
  #    a tenant_id column (NOT per-tenant DB). Default OFF — an install may instead
  #    point STREAMING_HUB_POSTGRES_DSN at a pre-provisioned managed host.
  externalPostgresDefinitions:
    # -- Enable or disable the PostgreSQL bootstrap Job.
    enabled: false
    # -- Name of the database the Job creates (must match the DSN dbname).
    database: "streaming-hub"
    # -- Name of the login role the Job creates (must match the DSN user).
    role: "streaming-hub"
    # -- PostgreSQL connection settings for the bootstrap Job.
    connection:
      # -- PostgreSQL host.
      host: "streaming-hub-postgresql"
      # -- PostgreSQL port.
      port: "5432"
    # -- Admin credentials used by the Job to create the DB/role.
    postgresAdminLogin:
      useExistingSecret:
        # -- Existing secret with DB_USER_ADMIN and DB_ADMIN_PASSWORD keys.
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set).
      username: "postgres"
      # -- Admin password (ignored if useExistingSecret.name is set).
      password: ""
    # -- Credentials for the hub role created by the Job.
    hubCredentials:
      useExistingSecret:
        # -- Existing secret with DB_PASSWORD_HUB key.
        name: ""
      # -- Password for the hub role (ignored if useExistingSecret.name is set).
      password: ""
# =============================================================================
# streamingHub — the single root key for everything the hub owns.
# =============================================================================
streamingHub:
  # -- (enum: all|split) Deployment topology switch. One of: all or split.
  #    all   (default) -> ONE Deployment with STREAMING_HUB_ROLE=all (ingest +
  #          delivery co-resident; the single-instance setup). Byte-equivalent to the
  #          historical single binary.
  #    split           -> TWO Deployments: ingest (role=ingest) and delivery
  #          (role=delivery), each scaled independently.
  #
  #    !!! NEVER run both an `all` Deployment AND ingest/delivery against the same
  #    Kafka cluster: they join ONE consumer group and DOUBLE-CONSUME every event.
  #    The mode switch enforces either/or — do not work around it. !!!
  #    The values.schema.json constrains this to the enum ["all","split"].
  mode: all
  image:
    # -- Container image repository.
    repository: ghcr.io/lerianstudio/streaming-hub
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag. Empty falls back to Chart.appVersion via the defaultTag helper.
    tag: "3.0.0"
  # -- Secrets for pulling the image from a private registry. The published
  # images are public, so none is needed by default.
  imagePullSecrets: []
  # -- Number of old ReplicaSets to retain for rollback.
  revisionHistoryLimit: 10
  # -- Annotations applied to every Deployment resource.
  annotations: {}
  # -- Annotations applied to every pod.
  podAnnotations: {}
  # -- Deployment update strategy (shared by all roles).
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- Pod-level security context. Empty by default (the hub needs no fsGroup).
  podSecurityContext: {}
  # -- Container-level security context (distroless:nonroot, uid/gid 65532).
  securityContext:
    # -- Group ID for the process inside the container.
    runAsGroup: 65532
    # -- User ID for the process inside the container.
    runAsUser: 65532
    # -- Never run as root.
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    # -- Read-only root filesystem (the image carries no writable state).
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  service:
    # -- Service type. MUST be ClusterIP (Lerian convention; Ingress fronts external).
    type: ClusterIP
    # -- Control-plane HTTP port (the hub listens on :8080; see Dockerfile EXPOSE).
    port: 8080
    # -- Annotations for every Service.
    annotations: {}
  ingress:
    # -- Enable or disable the control-plane Ingress (opt-in per env in gitops).
    enabled: false
    # -- Ingress class name.
    className: "nginx"
    # -- Additional ingress annotations.
    annotations: {}
    # -- Hosts (default empty; the control API is served on every role).
    hosts: []
    #  - host: "streaming-hub.example.com"
    #    paths:
    #      - path: /
    #        pathType: Prefix
    # -- TLS configuration.
    tls: []
    #  - secretName: streaming-hub-tls
    #    hosts:
    #      - streaming-hub.example.com
  serviceAccount:
    # -- Whether a ServiceAccount is created.
    create: true
    # -- Annotations for the ServiceAccount (e.g. AWS IRSA role-arn).
    annotations: {}
    # -- ServiceAccount name. Empty defaults to the chart fullname.
    name: ""
    # -- Mount the SA API token into pods. Default false — the hub makes no
    #    in-cluster Kubernetes API calls. (IRSA's projected token is injected by
    #    the EKS webhook independently of this, so it stays functional.)
    automountServiceAccountToken: false
  # -- Graceful-shutdown window. Defaults to the hub's derived SIGTERM drain
  #    ceiling (80s) at STREAMING_HUB_SHUTDOWN_TIMEOUT=30s +
  #    STREAMING_HUB_PRE_STOP_DRAIN_TIMEOUT=5s: 30s HTTP + 5s consumer-commit +
  #    30s dispatcher + 10s slack = 75s, + 5s pre-stop = 80s (see .env.reference).
  #    If you tune those knobs up, recompute and keep this AT OR ABOVE the new
  #    ceiling so the orchestrator never SIGKILLs a still-draining replica. NO
  #    preStop hook is used — the hub self-drains on SIGTERM (PID 1 receives it
  #    directly; exec-form ENTRYPOINT).
  terminationGracePeriodSeconds: 80
  # -- Liveness probe tuning (GET /healthz on the http port; stays 200 during drain).
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  # -- Readiness probe tuning (GET /readyz; flips NotReady first on SIGTERM).
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  # -- Shared default scheduling (per-role blocks may override).
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Override of global.scheduling.spread for every component (fields: enabled,
  #    hostname, zone, maxSkew, minDomains, nodeTaintsPolicy); a component's own
  #    `spread` (streamingHub.<all|ingest|delivery>.spread) overrides these.
  spread: {}
  # -- Raw Kubernetes topologySpreadConstraints for every component. Non-empty =
  #    replaces the preset; a component's own list replaces this one.
  topologySpreadConstraints: []
  # -- Extra non-sensitive env vars injected on every Deployment (key -> value map).
  #    The un-enumerated escape hatch; NEVER put credentials here (use secrets).
  extraEnvVars: {}
  # ===========================================================================
  # telemetry — CHART-LEVEL OTEL wiring toggle (NOT an app env var; never shipped
  # to the container). When enabled, each Deployment injects HOST_IP via the
  # downward API and sets OTEL_EXPORTER_OTLP_ENDPOINT=$(HOST_IP):4317 (node-local
  # DaemonSet collector pattern; see templates/_deployment.tpl). The hub's own
  # Prometheus exposition is governed by STREAMING_HUB_METRICS_ENABLED in the
  # ConfigMap above — a separate, app-read knob.
  # ===========================================================================
  telemetry:
    # -- Inject the per-pod OTLP endpoint override (HOST_IP downward API).
    enabled: false
  # ===========================================================================
  # Secret sourcing.
  # useExistingSecret=false -> the chart renders templates/secrets.yaml (inline).
  # useExistingSecret=true  -> NO Secret is rendered; Deployments reference
  #                            existingSecretName (the gitops/Vault path).
  #                            KEY CONTRACT: that Secret MUST carry
  #                            STREAMING_HUB_POSTGRES_DSN,
  #                            STREAMING_HUB_DASHBOARD_CURSOR_HMAC_KEY and
  #                            LICENSE_KEY — the Deployments pin all three via
  #                            secretKeyRef, so a Secret missing one fails
  #                            container creation with a clear event instead of
  #                            CrashLooping the app.
  # ===========================================================================
  useExistingSecret: false
  existingSecretName: ""
  # ===========================================================================
  # Dedicated datastore masks (lerian-common.datastore.value). Empty by default →
  # the template ships the defaults. Set a field here to override THIS component
  # only; global.datastores.<type> is the shared tier.
  #
  #   postgres: host / port / user / name / ssl — feeds the POSTGRES_* migration-
  #     toolchain keys (defaults: localhost / 5432 / streaming_hub / streaming_hub
  #     / disable). The APP connects via the STREAMING_HUB_POSTGRES_DSN Secret.
  #   redis:    host / tls / caCert — the rate-limiter store. `host` carries the
  #     FULL host:port (the shape reporter uses), and maps to
  #     STREAMING_HUB_REDIS_ADDRESS. Empty by default → nothing is limited.
  #     Example: redis: { host: valkey.internal:6379, tls: "true" }
  # ===========================================================================
  datastores: {}
  # ===========================================================================
  # configmap — the PRIMARY operator override surface. Ships EMPTY: every
  # non-sensitive key already has a template default (see templates/configmap.yaml).
  # Put configmap.<KEY> here to OVERRIDE an enumerated (allowlisted) key — the
  # values.schema.json propertyNames.enum guards it, so a typo is rejected. To
  # inject a key that is NOT in the allowlist, use `extraEnvVars` instead (the
  # unconstrained per-Deployment env hatch). NEVER put a credential here — those
  # go to `secrets` (routed to a Secret, never the ConfigMap).
  #
  # RATE LIMITING lives in its own typed block below (streamingHub.rateLimit) and
  # its Redis connection in streamingHub.datastores.redis — configmap.<KEY> still
  # overrides either. Leaving the Redis address empty is a SILENT no-op: every
  # request is served unlimited. The password goes to
  # secrets.STREAMING_HUB_REDIS_PASSWORD.
  #
  # STREAMING_HUB_KAFKA_SCRAM_USERNAME is EMIT-WHEN-SET. The Deployment reads the
  # Secret first and this ConfigMap second, and Kubernetes takes the last source
  # for a duplicate key — so a value here OVERWRITES one projected from Vault into
  # the same key. Set it here OR project it from the Secret, never both.
  #
  # STREAMING_HUB_PULL_BURST is still allowlisted but has NO chart default any
  # more: the 2.x line retired it (with _DASHBOARD_BURST and _READ_BURST) when the
  # in-process token buckets became Redis fixed windows. Set it only against a
  # pre-2.x image pin; on 2.x it buys one WARN per boot and changes nothing.
  #
  # LICENSE (lib-license-go, GLOBAL mode; UNPREFIXED platform names). The key is a
  # Secret (secrets.LICENSE_KEY). Two non-secret companions are allowlisted here:
  #   ORGANIZATION_IDS — chart default "global"; must stay EXACTLY "global" (the
  #     app and the render both refuse any other value).
  #   IS_DEVELOPMENT   — emit-when-set; exactly "true" selects the development
  #     license server (license.dev.lerian.io), which a dev license key needs.
  #     Refused (render and boot) when STREAMING_HUB_ENV=production.
  # ===========================================================================
  # -- Operator ConfigMap overrides (key -> value). Ships empty; the built-in
  #    defaults live in templates/configmap.yaml.
  configmap: {}
  # ===========================================================================
  # rateLimit — the lib-commons three-tier rate-limit contract, rendered by
  # lerian-common.rateLimit.env. Ships EMPTY so the helper's own defaults apply
  # (enabled "true", max 500 / window 60s, aggressive 100/60, relaxed 1000/60,
  # Redis timeout 500ms). Fields: enabled, allowDisabled, allowFailOpen, max,
  # windowSec, aggressiveMax, aggressiveWindowSec, relaxedMax, relaxedWindowSec,
  # redisTimeoutMs. Any configmap.<NATIVE_KEY> still overrides a field here.
  #
  # The store is streamingHub.datastores.redis (or global.datastores.redis) —
  # EXTERNAL to this chart. With no address configured, lib-commons builds a
  # pass-through limiter and nothing is limited, silently.
  #
  # allowFailOpen: lib-commons FORBIDS fail-open by default and, when permitted,
  # logs "security bypass active". Setting it here makes an unreachable limiter
  # ALLOW the request instead of refusing it: a Redis outage degrades enforcement
  # rather than taking the control plane down. That is the hub's intended posture,
  # and it is a deliberate security trade — leave it unset for fail-closed.
  # ===========================================================================
  # -- lib-commons rate-limit knobs (see the block comment above).
  rateLimit:
    # -- Permit fail-open. lib-commons classifies this as a security bypass and
    #    logs it as one; unset means fail-CLOSED (requests are refused when the
    #    limiter is unreachable).
    allowFailOpen: "true"
  # ===========================================================================
  # secrets — role-INVARIANT, SENSITIVE env (one shared Secret). Never rendered to
  # the ConfigMap. STREAMING_HUB_POSTGRES_DSN is ALWAYS emitted (even empty) so a
  # bare render succeeds; an empty DSN fails the app fast at boot. The rest are
  # emit-when-set. In gitops these come from Vault via useExistingSecret=true
  # (this map is then unused).
  # ===========================================================================
  secrets:
    # -- Single hub-owned Postgres DSN (password embedded → whole DSN is a secret).
    #    ALWAYS emitted; required for a working install (provide via a protected source).
    STREAMING_HUB_POSTGRES_DSN: ""
    # -- Broker TLS CA cert PEM (ALWAYS emitted; used when KAFKA_TLS_ENABLED=true).
    STREAMING_HUB_KAFKA_CA_CERT: ""
    # -- DEV-ONLY KEK material holder, named by STREAMING_HUB_KEK_REF (local BYOC).
    #    ALWAYS emitted; leave empty in real deploys (use a KMS-backed KEK_SOURCE).
    STREAMING_HUB_DEV_KEK: ""
    # -- Dashboard pagination-cursor signing key: 32 bytes, base64. MANDATORY in
    #    every mode from the 2.x line on — the app refuses to boot without it.
    #    ALWAYS emitted, and pinned via secretKeyRef on the useExistingSecret path
    #    so a Secret missing it says which key is missing instead of CrashLooping.
    STREAMING_HUB_DASHBOARD_CURSOR_HMAC_KEY: ""
    # -- Lerian license key (lib-license-go, GLOBAL mode; UNPREFIXED). REQUIRED in
    #    EVERY environment by the license-gated app — it refuses to boot without
    #    it. ALWAYS emitted (even empty, so a bare render succeeds), and pinned via
    #    secretKeyRef on the useExistingSecret path. Never a literal in a values
    #    file in git: supply it through useExistingSecret (Vault/ExternalSecret).
    #    ORGANIZATION_IDS / IS_DEVELOPMENT are non-secret and live in `configmap`.
    LICENSE_KEY: ""
    # -- SASL/SCRAM password (emit-when-set; required when KAFKA_SCRAM_MECHANISM is set).
    #    The SCRAM username is non-sensitive and lives in the ConfigMap.
    STREAMING_HUB_KAFKA_SCRAM_PASSWORD: ""
    # -- Migration-toolchain Postgres password (emit-when-set; no in-cluster
    #    consumer — the migration Job uses the DSN — shipped for .env parity).
    POSTGRES_PASSWORD: ""
    # -- Rate-limiting Redis/Valkey password (emit-when-set; MAY stay empty when the
    #    instance takes no AUTH). The host, port, TLS flag and CA cert are NOT
    #    credentials and live in the ConfigMap as STREAMING_HUB_REDIS_ADDRESS /
    #    _TLS / _CA_CERT.
    STREAMING_HUB_REDIS_PASSWORD: ""
  # ===========================================================================
  # migrations — OUT-OF-BAND schema migration Job (Helm + ArgoCD PreSync hook).
  #
  # The hub NEVER migrates itself (the app refuses to). Without this Job, ingest /
  # dispatcher / partition workers spin on `relation "event_inbox"/"delivery_jobs"
  # does not exist (42P01)`. This Job applies the SQL migrations BEFORE the app
  # rolls out.
  #
  # ORDERING (the load-bearing design): the chain is
  #   bootstrap-postgres (PreSync weight -10, creates role+db)
  #     -> migration-secret (PreSync weight -5, carries the DSN)
  #     -> migrations Job   (PreSync weight -1, creates the schema)
  #     -> app Deployment   (main Sync)
  #
  # The runner is the stock `migrate/migrate` toolchain baked with the hub's
  # `migrations/` dir; its entrypoint runs
  #   migrate -path=/migrations -database="$STREAMING_HUB_POSTGRES_DSN" up
  # so the Job's ONLY required env is STREAMING_HUB_POSTGRES_DSN (secretKeyRef).
  # It runs ONCE regardless of streamingHub.mode (all | split) — it is not per-role.
  # ===========================================================================
  migrations:
    # -- Enable or disable the migrations Job. Default false — opt-in per env
    #    (consistent with the chart's other optional features).
    enabled: false
    # -- Optional. When true, the Job reads STREAMING_HUB_POSTGRES_DSN from a
    #    pre-existing Secret (existingSecretName) instead of the chart-managed
    #    migration-secret hook. Independent of streamingHub.useExistingSecret;
    #    set this to point migrations at the app's existing (e.g. Vault) Secret.
    useExistingSecret: false
    # -- Name of the pre-existing Secret holding STREAMING_HUB_POSTGRES_DSN
    #    (only used when migrations.useExistingSecret=true).
    existingSecretName: ""
    image:
      # -- Migrations image (FROM migrate/migrate + COPY migrations/ /migrations/).
      repository: ghcr.io/lerianstudio/streaming-hub-migrations
      # -- Tag for the migrations image. Empty falls back to the app image tag
      #    (streamingHub.image.tag, or the chart appVersion). An explicit tag
      #    or digest overrides this.
      tag: ""
      # -- Pin by digest (sha256:...) instead of tag. Wins over tag when set.
      digest: ""
      # -- Image pull policy.
      pullPolicy: IfNotPresent
    # -- Maximum retries before the Job is considered failed.
    backoffLimit: 3
    # -- Hard wall-clock cap on the Job (seconds).
    activeDeadlineSeconds: 600
    # -- TTL after which a finished Job is garbage-collected (seconds).
    ttlSecondsAfterFinished: 600
    # -- Extra annotations on the Job (merged after the hook annotations).
    annotations: {}
    # -- Extra annotations on the migration pod.
    podAnnotations: {}
    # -- Resource requests/limits for the migration container.
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
  # ===========================================================================
  # Per-role blocks. Each carries replicaCount, resources, autoscaling, pdb, and
  # the Postgres pool sizing injected as explicit per-Deployment env.
  #
  # !!! CONNECTION-BUDGET INVARIANT (the load-bearing operational rule) !!!
  #   Σ over all running pods of (replicas × poolMaxOpenConns) + headroom
  #     ≤ PostgreSQL max_connections.
  #   Under HPA, use maxReplicas (not replicaCount) in the sum. Every open
  #   connection on every pod draws from the ONE shared Postgres budget.
  #   NEVER run mode=all alongside split — see streamingHub.mode.
  # Pool defaults (from .env.reference): all 25/12, ingest 8/4, delivery 16/10.
  # ===========================================================================
  all:
    replicaCount: 1
    poolMaxOpenConns: 25
    poolMaxIdleConns: 12
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    autoscaling:
      # -- HPA off by default; replicaCount governs. maxReplicas × poolMaxOpenConns
      #    must respect the connection-budget invariant above.
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
      annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  ingest:
    replicaCount: 1
    poolMaxOpenConns: 8
    poolMaxIdleConns: 4
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      # -- maxReplicas × 8 (poolMaxOpenConns) must fit the connection budget.
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
      annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  delivery:
    replicaCount: 1
    poolMaxOpenConns: 16
    poolMaxIdleConns: 10
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      # -- maxReplicas × 16 (poolMaxOpenConns) must fit the connection budget.
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
      annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
# =============================================================================
# postgres — chart-level Postgres wiring that is NOT an app env var.
#
# caBundle projects the Postgres/RDS SERVER CA into every workload that dials the
# database, at one fixed path:
#
#     /etc/streaming-hub/postgres-ca/bundle.pem
#
# Default OFF. Turn it on for any environment whose DSN verifies the server
# certificate: the hardened 2.x boot REFUSES a DSN with sslmode=verify-full (or
# verify-ca/require) unless sslrootcert names a readable bundle. The chart
# guarantees only the FILE — the DSN stays in the Secret (gitops/Vault) and is
# what points sslrootcert at that path. For AWS RDS the bundle is the PUBLIC
# `global-bundle.pem`, which is why it lives in a ConfigMap and not a Secret.
#
# Mounted read-only in all three roles (all / ingest / delivery) AND in the
# migrations Job — migrate/migrate dials the same DSN, so it needs the same file.
# The Job is a PreSync hook, so the chart renders a hook COPY of the ConfigMap at
# wave -5 for it; a normal ConfigMap does not exist yet when a PreSync pod starts.
#
# pem and existingConfigMap are mutually exclusive; enabling caBundle with
# NEITHER set fails the render on purpose (a mount of a ConfigMap that does not
# exist hangs every pod in ContainerCreating with no useful message).
# =============================================================================
postgres:
  caBundle:
    # -- Mount the Postgres server CA bundle in the app pods and the migrations Job.
    enabled: false
    # -- The CA bundle PEM itself. When set (and existingConfigMap is empty) the
    #    chart renders the ConfigMap holding it under the key `bundle.pem`.
    pem: ""
    # -- Name of an operator-managed ConfigMap to mount instead. It MUST carry the
    #    key `bundle.pem` — the volume pins that single key, so a ConfigMap keyed
    #    otherwise blocks pod creation with a clear kubelet event rather than
    #    starting the app with no certificate at the path.
    existingConfigMap: ""
# =============================================================================
# aws — AWS IAM Roles Anywhere (X.509 -> short-lived AWS credentials).
#
# Default OFF. When enabled, every role's pod (all / ingest / delivery) gets an
# `aws-signing-helper` sidecar serving an IMDS-compatible endpoint on
# 127.0.0.1:<port>; the app's AWS SDK is pointed at it via
# AWS_EC2_METADATA_SERVICE_ENDPOINT. Same shape and sidecar contract used by
# fetcher, reporter, matcher and plugin-fees.
#
# The X.509 cert/key are NOT produced by this chart: mount a Secret of type
# kubernetes.io/tls (keys tls.crt / tls.key) named by certificateSecretName —
# in the Lerian environments a cert-manager Certificate in the deploying overlay
# creates it. fsGroup 65532 is applied to the pod so the sidecar's non-root user
# can read the 0440 projection; it is MERGED into streamingHub.podSecurityContext
# while rolesAnywhere is enabled — fsGroup wins, and every other pod-level setting
# you configured (runAsNonRoot, seccompProfile, supplementalGroups, ...) survives.
# It used to replace the block wholesale, silently dropping all of them.
#
# trustAnchorArn / profileArn / roleArn are `required` when enabled — the chart
# fails to render rather than starting a sidecar that cannot authenticate.
# =============================================================================
aws:
  rolesAnywhere:
    # -- Enable the IAM Roles Anywhere credential sidecar.
    enabled: false
    # -- Trust anchor ARN (required when enabled).
    trustAnchorArn: ""
    # -- Profile ARN (required when enabled).
    profileArn: ""
    # -- Role ARN the sidecar assumes (required when enabled).
    roleArn: ""
    # -- AWS region for the credential exchange.
    region: "us-east-2"
    # -- Credential session duration in seconds.
    sessionDuration: 3600
    # -- Name of the kubernetes.io/tls Secret holding tls.crt / tls.key.
    #    Left empty on purpose so the template fallback in _deployment.tpl actually
    #    fires: it resolves to "<streaming-hub.fullname>-iam-tls". Note that fullname
    #    is fullnameOverride if set, else nameOverride if set, else the CHART name
    #    (never the Helm release name), so the fallback yields "streaming-hub-iam-tls"
    #    unless one of those overrides is set (e.g. nameOverride: foo -> "foo-iam-tls").
    #    A non-empty default here made that branch unreachable and pinned every install
    #    to one literal name, ignoring the overrides.
    certificateSecretName: ""
    sidecar:
      image:
        repository: public.ecr.aws/rolesanywhere/credential-helper
        tag: "latest-amd64"
        pullPolicy: IfNotPresent
      # -- Port the sidecar serves the IMDS-compatible endpoint on.
      port: 9911
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
