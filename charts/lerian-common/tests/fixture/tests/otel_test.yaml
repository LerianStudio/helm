suite: lerian-common otel.podEnv
templates:
  - templates/otel.yaml
tests:
  - it: the default plaintext hop to the node-local collector carries ALLOW_INSECURE_OTEL
    asserts:
      - equal:
          path: "spec.containers[0].env"
          value:
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(HOST_IP):4317"}
            - {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}

  - it: an explicit http:// scheme still carries it
    set: {otelPodEnv: {port: 4318, scheme: "http://"}}
    asserts:
      - equal: {path: "spec.containers[0].env[1].value", value: "http://$(HOST_IP):4318"}
      - equal: {path: "spec.containers[0].env[2].name", value: ALLOW_INSECURE_OTEL}

  - it: https never carries it, whatever the setting says
    set: {otelWithContext: true, otelPodEnv: {scheme: https}, global: {observability: {allowInsecureOtel: "reason"}}}
    asserts:
      - equal: {path: "spec.containers[0].env[1].value", value: "https://$(HOST_IP):4317"}
      - lengthEqual: {path: "spec.containers[0].env", count: 2}

  - it: global.observability.allowInsecureOtel sets the value env-wide
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: "env-wide reason"}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}}

  - it: the component configmap wins over the global
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: "env-wide reason"}}, app: {configmap: {ALLOW_INSECURE_OTEL: "component reason"}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: "component reason"}}

  - it: an explicit refusal ("false" or empty) stands as the one entry
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: "false"}}, app: {configmap: {ALLOW_INSECURE_OTEL: ""}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: ""}}
      - lengthEqual: {path: "spec.containers[0].env", count: 3}

  - it: a global refusal stands with no component key ("false")
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: "false"}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: "false"}}

  - it: a global refusal stands with no component key (empty)
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: ""}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: ""}}

  - it: a global refusal stands with no component key (boolean false)
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: false}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: "false"}}

  - it: a null setting is unset, not a reason
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: null}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2].value", value: "node-local collector on the pod's own node"}

  - it: a string allowInsecure is the value a chart knob resolved
    set: {otelPodEnv: {allowInsecure: "chart knob reason"}}
    asserts:
      - equal: {path: "spec.containers[0].env[2]", value: {name: ALLOW_INSECURE_OTEL, value: "chart knob reason"}}

  - it: allowInsecure=false still leaves the variable to the operator (legacy extraEnvVars)
    set: {otelPodEnv: {allowInsecure: false}}
    asserts:
      - lengthEqual: {path: "spec.containers[0].env", count: 2}

  - it: allowInsecure=true with a context resolves the setting
    set: {otelWithContext: true, otelPodEnv: {allowInsecure: true}, global: {observability: {allowInsecureOtel: "env-wide reason"}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2].value", value: "env-wide reason"}

  - it: podAttributes still follow
    set: {otelPodEnv: {podAttributes: true}}
    asserts:
      - lengthEqual: {path: "spec.containers[0].env", count: 5}
      - equal: {path: "spec.containers[0].env[4]", value: {name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.ip=$(POD_IP)"}}

  - it: a null component key falls through to the global
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: "env-wide reason"}}, app: {configmap: {ALLOW_INSECURE_OTEL: null}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2].value", value: "env-wide reason"}

  - it: a boolean setting is rendered as its string
    set: {otelWithContext: true, global: {observability: {allowInsecureOtel: true}}}
    asserts:
      - equal: {path: "spec.containers[0].env[2].value", value: "true"}
