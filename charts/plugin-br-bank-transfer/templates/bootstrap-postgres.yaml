{{- if .Values.global.externalPostgresDefinitions.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bank-transfer.fullname" . }}-bootstrap-postgres
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "bank-transfer.labels" (dict "context" . "component" "bootstrap" "name" "postgres") | nindent 4 }}
  annotations:
    {{- /* Must run BEFORE migrations.yaml's pre-install hook (hook-weight -1), not
       after it — migrations connects as the bank_transfer role this Job creates, so
       a post-install ordering (the original state of this annotation block) meant
       migrations always ran first and failed auth on a role that didn't exist yet,
       on EVERY deploy method (plain helm install, not just this GitOps combined-
       Application setup — Helm's own hook-phase model runs all pre-install hooks
       before all post-install hooks within a single release, same ordering
       ArgoCD uses). Confirmed live on srm-dev: 'password authentication failed for
       user "bank_transfer"' until this fix.

       Job.spec.template is also immutable — any pod-template change makes a plain
       `kubectl apply`/ArgoCD Sync, or a plain `helm upgrade`, fail to patch it in
       place, silently leaving the stale Job's pods retrying forever. Both native-
       Helm and ArgoCD replace-on-upgrade mechanisms are set so this self-heals
       under either deploy path (the Job is naturally idempotent: create-or-update
       role/db/grants). */}}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.37
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalPostgresDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalPostgresDefinitions.connection.port | quote }}
        command:
        - /bin/sh
        - -c
        - >
          TIMEOUT=300;
          ELAPSED=0;
          echo "Checking $DB_HOST:$DB_PORT...";
          while ! nc -z "$DB_HOST" "$DB_PORT"; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for $DB_HOST:$DB_PORT after ${TIMEOUT}s";
              exit 1;
            fi;
            echo "$DB_HOST:$DB_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
            sleep 5;
            ELAPSED=$((ELAPSED + 5));
          done;
          echo "$DB_HOST:$DB_PORT is ready!";
      containers:
      - name: psql
        image: postgres:17
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalPostgresDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalPostgresDefinitions.connection.port | quote }}
        - name: DB_USER_ADMIN
          {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
              key: DB_USER_ADMIN
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.username | quote }}
          {{- end }}
        - name: DB_ADMIN_PASSWORD
          {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
              key: DB_ADMIN_PASSWORD
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.password | quote }}
          {{- end }}
        - name: DB_PASSWORD_BANK_TRANSFER
          {{- if .Values.global.externalPostgresDefinitions.bankTransferCredentials.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.bankTransferCredentials.useExistingSecret.name | quote }}
              key: DB_PASSWORD_BANK_TRANSFER
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.bankTransferCredentials.password | quote }}
          {{- end }}
        - name: DB_DATABASE
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail
          echo "=== Bank Transfer PostgreSQL Bootstrap ==="
          echo "Host: $DB_HOST:$DB_PORT"
          echo ""

          echo "Checking existing PostgreSQL objects..."
          DB_EXISTS=0
          ROLE_EXISTS=0

          if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_database WHERE datname='bank_transfer'" | grep -q 1; then
            DB_EXISTS=1
          fi
          if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_roles WHERE rolname='bank_transfer'" | grep -q 1; then
            ROLE_EXISTS=1
          fi

          # psql's :'var' client-side interpolation doesn't fire for -c input on
          # this image/version (server rejects the literal ":'pw'' with a syntax
          # error — confirmed live), so escape the password for a plain SQL
          # string literal ourselves (double any embedded single quotes) instead
          # of relying on it. The statement is sent via stdin (printf | psql), not
          # -c, so the password never appears in this container's process
          # arguments (ps output) — CodeRabbit finding, confirmed real. (A heredoc
          # was tried first but its unindented body/terminator lines broke the
          # YAML block-scalar indentation of this whole script — printf avoids
          # that entirely.)
          ESCAPED_PW=$(printf '%s' "$DB_PASSWORD_BANK_TRANSFER" | sed "s/'/''/g")

          if [ "$ROLE_EXISTS" = "1" ]; then
            echo "Role 'bank_transfer' already exists. Refreshing password..."
            printf "ALTER ROLE bank_transfer LOGIN PASSWORD '%s';\n" "$ESCAPED_PW" | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE"
          else
            echo "Creating role 'bank_transfer'..."
            printf "CREATE ROLE bank_transfer LOGIN PASSWORD '%s';\n" "$ESCAPED_PW" | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE"
          fi

          if [ "$DB_EXISTS" = "1" ]; then
            echo "Database 'bank_transfer' already exists. Skipping creation."
          else
            echo "Creating database 'bank_transfer'..."
            PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "CREATE DATABASE bank_transfer OWNER bank_transfer"
          fi

          # Privileges (safe to run repeatedly)
          echo "Ensuring privileges and schema permissions..."
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "ALTER USER bank_transfer CREATEDB" || echo "Warning: Could not grant CREATEDB (may require superuser privileges)"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "GRANT ALL PRIVILEGES ON DATABASE bank_transfer TO bank_transfer"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d bank_transfer -c "GRANT ALL ON SCHEMA public TO bank_transfer"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d bank_transfer -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO bank_transfer"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d bank_transfer -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO bank_transfer"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d bank_transfer -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO bank_transfer"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d bank_transfer -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO bank_transfer"

          echo ""
          echo "=== Bank Transfer PostgreSQL Bootstrap completed successfully ==="
{{- end }}
