# Smoke-test values for br-sfn on benedita-k8s (ns br-sfn-productize-test).
# THROWAWAY. Isolated Bitnami-legacy infra; ONE postgres server, per-rail DBs.
# Goal: push max rails to Ready, mirroring how br-sfn-dev-st configures apps
# against plaintext infra. NOT BACEN-ready. imagePullSecrets defaults to
# ghcr-credential (chart top-level default) -> all rails inherit it.
#
# Dev recipe (from br-sfn-dev-st recon): ENV_NAME=development + DEPLOYMENT_MODE=byoc
# relax production guards; ALLOW_INSECURE_TLS=true lets apps accept plaintext
# Postgres AND Redis. ALLOW_INSECURE_TLS is REJECTED by the schema enum on every
# <rail>.configmap, so it is injected via <rail>.extraEnvVars (allowlist gap -> #1877).
# Per-rail Postgres DB via <rail>.datastores.postgres.name (per-field mask override;
# host/port/user/ssl still inherit global).

global:
  datastores:
    postgres: { host: "pg-postgresql", port: "5432", user: "postgres", name: "sfntest", ssl: "disable" }
    redis:    { host: "valkey-primary", port: "6379" }
    broker:   { host: "rabbitmq", port: "5672", user: "user" }
  observability: {}
  auth: {}
  multiTenant: {}
  objectStorage: {}

# --- SPI / Pix (api + dict + brcode + core + migrations) ---
spi:
  enabled: true
  datastores:
    postgres: { name: "brspi" }
  configmap:
    ENV_NAME: "development"
    # spi hard-requires a full replica DSN (host alone -> "replica dsn cannot be empty").
    # Point the replica at the primary for this test.
    POSTGRES_REPLICA_HOST: "pg-postgresql"
    POSTGRES_REPLICA_PORT: "5432"
    POSTGRES_REPLICA_USER: "postgres"
    POSTGRES_REPLICA_DB: "brspi"
    POSTGRES_REPLICA_SSLMODE: "disable"
    REDIS_TLS: "false"
    SYSTEMPLANE_ENABLED: "false"   # spi dedicated migrator doesn't create systemplane_entries here
  # ALLOW_INSECURE_TLS + DEPLOYMENT_MODE rejected on spi.configmap enum -> per-binary extraEnvVars.
  api:
    extraEnvVars:
      - { name: ALLOW_INSECURE_TLS, value: "true" }
      - { name: DEPLOYMENT_MODE, value: "byoc" }
  dict:
    extraEnvVars:
      - { name: ALLOW_INSECURE_TLS, value: "true" }
      - { name: DEPLOYMENT_MODE, value: "byoc" }
  brcode:
    extraEnvVars:
      - { name: ALLOW_INSECURE_TLS, value: "true" }
      - { name: DEPLOYMENT_MODE, value: "byoc" }
  core:
    extraEnvVars:
      - { name: ALLOW_INSECURE_TLS, value: "true" }
      - { name: DEPLOYMENT_MODE, value: "byoc" }
  secrets:
    POSTGRES_PASSWORD: "testpass123"
    POSTGRES_REPLICA_PASSWORD: "testpass123"   # replica conn needs its own password
    REDIS_PASSWORD: "testpass123"

# --- SPB / STR (TED over IBM MQ) ---
spb:
  enabled: true
  datastores:
    postgres: { name: "br_spb" }
  configmap:
    ENV_NAME: "develop"          # spb vocab is production|staging|develop (NOT "development")
    REDIS_TLS_ENABLED: "false"
  # ALLOW_INSECURE_TLS + DEPLOYMENT_MODE rejected on spb.configmap enum -> extraEnvVars.
  extraEnvVars:
    - { name: ALLOW_INSECURE_TLS, value: "true" }
    - { name: DEPLOYMENT_MODE, value: "byoc" }
  secrets:
    POSTGRES_PASSWORD: "testpass123"
    REDIS_PASSWORD: "testpass123"
    RABBITMQ_PASSWORD: "testpass123"

# --- SILOC ---
siloc:
  enabled: true
  datastores:
    postgres: { name: "br_siloc" }
  configmap:
    ENV_NAME: "development"
    DEPLOYMENT_MODE: "byoc"
    REDIS_TLS: "false"
  extraEnvVars:                                # ALLOW_INSECURE_TLS rejected on configmap enum
    - { name: ALLOW_INSECURE_TLS, value: "true" }
  secrets:
    DB_PASSWORD: "testpass123"
    REDIS_PASSWORD: "testpass123"

# --- SCR ---
scr:
  enabled: true
  datastores:
    postgres: { name: "br_scr" }
  configmap:
    ENV_NAME: "development"
    DEPLOYMENT_MODE: "byoc"
    REDIS_TLS_ENABLED: "false"
    SCR_STREAMING_EMISSION_DISABLED: "true"    # no RedPanda here
  extraEnvVars:                                # ALLOW_INSECURE_TLS rejected on configmap enum
    - { name: ALLOW_INSECURE_TLS, value: "true" }
  secrets:
    POSTGRES_PASSWORD: "testpass123"
    REDIS_PASSWORD: "testpass123"
    SCR_WSSCR2N_BASIC_PASSWORD: "dummy"   # required (non-empty) in dedicated secret-store mode

# --- DESK (app reads DB_*, migrator reads POSTGRES_*) ---
desk:
  enabled: true
  datastores:
    postgres: { name: "br_desk" }
  configmap:
    ENV_NAME: "development"
    DEPLOYMENT_MODE: "byoc"
  extraEnvVars:                                # ALLOW_INSECURE_TLS rejected on configmap enum
    - { name: ALLOW_INSECURE_TLS, value: "true" }
  secrets:
    DB_PASSWORD: "testpass123"

# --- CORREIOS (Postgres + cache + RabbitMQ + S3) ---
correios:
  enabled: true
  datastores:
    postgres: { name: "br_correios" }
  configmap:
    ENV_NAME: "development"
    DEPLOYMENT_MODE: "byoc"
    BC_CORREIO_ENVIRONMENT: "mock"
  extraEnvVars:                                # ALLOW_INSECURE_TLS rejected on configmap enum
    - { name: ALLOW_INSECURE_TLS, value: "true" }
  secrets:
    POSTGRES_PASSWORD: "testpass123"
    RABBITMQ_URL: "amqp://user:testpass123@rabbitmq:5672/"
    CACHE_PASSWORD: "testpass123"
    OBJECT_STORAGE_ACCESS_KEY: "smoketest"
    OBJECT_STORAGE_SECRET_KEY: "smoketest"
    ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"

# --- SLC-EDGE (stateless) ---
slcEdge:
  enabled: true
  configmap:
    SLC_UPSTREAM_URL: "https://br-slc.br-sfn-productize-test.svc.cluster.local:3010"

# --- STA (manager + worker) ---
sta:
  enabled: true
  datastores:
    postgres: { name: "br_sta" }
  image:
    tag: "1.0.0-beta.33"
  configmap:
    ENV_NAME: "development"
    REDIS_TLS: "false"
  # CHART BUG (#1877): sta.extraEnvVars schema=array, but staConfigData toYaml-injects
  # it straight into ConfigMap `data:` (map semantics) AND componentDeployment renders
  # it into container `env:` (list semantics) — contradictory, so ANY non-empty value
  # breaks the ConfigMap render. And ALLOW_INSECURE_TLS is not in sta.configmap enum.
  # => sta manager has NO working path to the insecure-TLS knob and CrashLoops on
  # plaintext PG. Empty array keeps the render valid.
  extraEnvVars: []
  migrations:
    image:
      tag: "1.1.0-beta.11"
    allowInsecureTLS: true
  secrets:
    POSTGRES_PASSWORD: "testpass123"
    REDIS_PASSWORD: "testpass123"
    MASTER_KEYS: "v1:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  worker:
    enabled: true
    image:
      repository: "ghcr.io/lerianstudio/br-sta-worker"
      tag: "1.1.0-beta.11"
    # CHART BUG (#1877): worker.extraEnvVars schema=array but template ranges it as a
    # map -> array yields `name: 0` garbage, map fails schema. And ALLOW_INSECURE_TLS
    # is not in worker.configmap enum. So the worker has NO working path to the insecure
    # knob and will CrashLoop on plaintext PG. Empty array = schema-valid; worker still
    # inherits ENV_NAME=development from the manager ConfigMap.
    extraEnvVars: []

# --- COCKPIT (build-arg-only SPA) ---
cockpit:
  enabled: true
