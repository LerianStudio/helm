{{- if and .Values.caradhras.ui.enabled .Values.caradhras.ui.ingress.enabled -}}
{{- include "lerian-common.ingress" (dict
      "context" .
      "ingress" .Values.caradhras.ui.ingress
      "global" (.Values.global).ingress
      "subdomain" "caradhras"
      "name" (include "plugin-caradhras-ui.fullname" .)
      "labels" (printf "%s " (include "plugin-caradhras-ui.labels" (dict "context" . "name" .Values.caradhras.ui.name)))
      "svcPort" .Values.caradhras.ui.service.port
    ) }}
{{- end }}
