{{- $component := .Values.brSta -}}
{{- $cm := $component.configmap | default dict -}}
{{- $ds := $component.datastores | default dict -}}
{{- $app := $component.app | default dict -}}
{{- $auth := $component.auth | default dict -}}
{{- $broker := $component.broker | default dict -}}
{{- $cors := $component.cors | default dict -}}
{{- $idempotency := $component.idempotency | default dict -}}
{{- $multiTenant := $component.multiTenant | default dict -}}
{{- $outbox := $component.outbox | default dict -}}
{{- $pagination := $component.pagination | default dict -}}
{{- $postgres := $component.postgres | default dict -}}
{{- $rateLimit := $component.rateLimit | default dict -}}
{{- $redis := $component.redis | default dict -}}
{{- $server := $component.server | default dict -}}
{{- $swagger := $component.swagger | default dict -}}
{{- $audit := $component.audit | default dict -}}
{{- $transfer := $component.transfer | default dict -}}
{{- $truststore := $component.truststore | default dict -}}
{{- $masterKey := $component.masterKey | default dict -}}
{{- $m2m := $component.m2m | default dict -}}
{{- $sd := $component.serviceDiscovery | default dict -}}
{{- $strm := $component.streaming | default dict -}}
{{- $namespace := include "global.namespace" . -}}
{{- $multiTenantEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_ENABLED" "params" ($component.multiTenant | default dict) "field" "enabled" "default" "false")) "true" -}}
{{- $sdEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SD_ENABLED" "params" $sd "field" "enabled" "default" "false")) "true" -}}
{{- $streamingEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_ENABLED" "params" $strm "field" "enabled" "default" "false")) "true" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "br-sta.fullname" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "br-sta.labels" (dict "context" .) | nindent 4 }}
data:
  # Config knobs — each resolves via lerian-common.cfgValue:
  #   configmap.<NATIVE_KEY> (escape hatch) > br-sta.<group>.<field> > chart default.
  AGGRESSIVE_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AGGRESSIVE_RATE_LIMIT_MAX" "params" $rateLimit "field" "aggressiveRateLimitMax" "default" "100") | quote }}
  AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AGGRESSIVE_RATE_LIMIT_WINDOW_SEC" "params" $rateLimit "field" "aggressiveRateLimitWindowSec" "default" "60") | quote }}
  AWS_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AWS_REGION" "params" $app "field" "awsRegion" "default" "us-east-1") | quote }}
  CIRCUIT_BREAKER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CIRCUIT_BREAKER_ENABLED" "params" $app "field" "circuitBreakerEnabled" "default" "false") | quote }}
  CORS_ALLOWED_HEADERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOWED_HEADERS" "params" $cors "field" "allowedHeaders" "default" "Origin,Content-Type,Accept,Authorization,X-Request-ID") | quote }}
  CORS_ALLOWED_METHODS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOWED_METHODS" "params" $cors "field" "allowedMethods" "default" "GET,POST,PUT,PATCH,DELETE,OPTIONS") | quote }}
  CORS_ALLOWED_ORIGINS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOWED_ORIGINS" "params" $cors "field" "allowedOrigins" "default" "*") | quote }}
  CORS_ALLOW_CREDENTIALS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOW_CREDENTIALS" "params" $cors "field" "allowCredentials" "default" "false") | quote }}
  CORS_EXPOSE_HEADERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_EXPOSE_HEADERS" "params" $cors "field" "exposeHeaders" "default" "") | quote }}
  DB_METRICS_INTERVAL_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DB_METRICS_INTERVAL_SEC" "params" $postgres "field" "dbMetricsIntervalSec" "default" "15") | quote }}
  DEFAULT_TENANT_ID: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DEFAULT_TENANT_ID" "params" $multiTenant "field" "defaultTenantId" "default" "11111111-1111-1111-1111-111111111111") | quote }}
  ENV_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ENV_NAME" "params" $app "field" "envName" "default" "production") | quote }}
  EXAMPLE_STATUS_PROVIDER_MODE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "EXAMPLE_STATUS_PROVIDER_MODE" "params" $app "field" "exampleStatusProviderMode" "default" "healthy") | quote }}
  HTTP_BODY_LIMIT_BYTES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "HTTP_BODY_LIMIT_BYTES" "params" $server "field" "httpBodyLimitBytes" "default" "104857600") | quote }}
  IDEMPOTENCY_RETRY_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "IDEMPOTENCY_RETRY_WINDOW_SEC" "params" $idempotency "field" "idempotencyRetryWindowSec" "default" "300") | quote }}
  INFRA_CONNECT_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "INFRA_CONNECT_TIMEOUT_SEC" "params" $postgres "field" "infraConnectTimeoutSec" "default" "30") | quote }}
  LOG_LEVEL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "LOG_LEVEL" "params" $app "field" "logLevel" "default" "info") | quote }}
  M2M_CREDENTIAL_CACHE_TTL_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "M2M_CREDENTIAL_CACHE_TTL_SEC" "params" $app "field" "m2mCredentialCacheTtlSec" "default" "300") | quote }}
  MAX_PAGINATION_LIMIT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MAX_PAGINATION_LIMIT" "params" $pagination "field" "maxPaginationLimit" "default" "100") | quote }}
  MAX_PAGINATION_MONTH_DATE_RANGE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MAX_PAGINATION_MONTH_DATE_RANGE" "params" $pagination "field" "maxPaginationMonthDateRange" "default" "3") | quote }}
  MIGRATIONS_PATH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MIGRATIONS_PATH" "params" $postgres "field" "migrationsPath" "default" "migrations") | quote }}
  OUTBOX_ALLOW_EMPTY_TENANT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_ALLOW_EMPTY_TENANT" "params" $outbox "field" "allowEmptyTenant" "default" "true") | quote }}
  OUTBOX_BATCH_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_BATCH_SIZE" "params" $outbox "field" "batchSize" "default" "50") | quote }}
  OUTBOX_DISPATCH_INTERVAL_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_DISPATCH_INTERVAL_SEC" "params" $outbox "field" "dispatchIntervalSec" "default" "2") | quote }}
  OUTBOX_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_ENABLED" "params" $outbox "field" "enabled" "default" "false") | quote }}
  OUTBOX_INCLUDE_TENANT_METRICS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_INCLUDE_TENANT_METRICS" "params" $outbox "field" "includeTenantMetrics" "default" "false") | quote }}
  OUTBOX_MAX_DISPATCH_ATTEMPTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_MAX_DISPATCH_ATTEMPTS" "params" $outbox "field" "maxDispatchAttempts" "default" "10") | quote }}
  OUTBOX_MAX_FAILED_PER_BATCH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_MAX_FAILED_PER_BATCH" "params" $outbox "field" "maxFailedPerBatch" "default" "25") | quote }}
  OUTBOX_PROCESSING_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_PROCESSING_TIMEOUT_SEC" "params" $outbox "field" "processingTimeoutSec" "default" "600") | quote }}
  OUTBOX_PUBLISH_BACKOFF_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_PUBLISH_BACKOFF_MS" "params" $outbox "field" "publishBackoffMs" "default" "200") | quote }}
  OUTBOX_PUBLISH_MAX_ATTEMPTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_PUBLISH_MAX_ATTEMPTS" "params" $outbox "field" "publishMaxAttempts" "default" "3") | quote }}
  OUTBOX_RETRY_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_RETRY_WINDOW_SEC" "params" $outbox "field" "retryWindowSec" "default" "300") | quote }}
  OUTBOX_TABLE_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_TABLE_NAME" "params" $outbox "field" "tableName" "default" "outbox_events") | quote }}
  PLUGIN_AUTH_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "PLUGIN_AUTH_ENABLED" "params" $auth "field" "pluginAuthEnabled" "default" "false") | quote }}
  PLUGIN_AUTH_HOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "PLUGIN_AUTH_HOST" "params" $auth "field" "pluginAuthHost" "default" "") | quote }}
  POSTGRES_CONNECT_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_CONNECT_TIMEOUT_SEC" "params" $postgres "field" "postgresConnectTimeoutSec" "default" "10") | quote }}
  POSTGRES_CONN_MAX_IDLE_TIME_MINS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_CONN_MAX_IDLE_TIME_MINS" "params" $postgres "field" "postgresConnMaxIdleTimeMins" "default" "5") | quote }}
  POSTGRES_CONN_MAX_LIFETIME_MINS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_CONN_MAX_LIFETIME_MINS" "params" $postgres "field" "postgresConnMaxLifetimeMins" "default" "30") | quote }}
  POSTGRES_MAX_IDLE_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_MAX_IDLE_CONNS" "params" $postgres "field" "postgresMaxIdleConns" "default" "5") | quote }}
  POSTGRES_MAX_OPEN_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_MAX_OPEN_CONNS" "params" $postgres "field" "postgresMaxOpenConns" "default" "25") | quote }}
  POSTGRES_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_NAME" "params" $postgres "field" "postgresName" "default" "br_sta") | quote }}
  RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK" "params" $broker "field" "allowInsecureHealthCheck" "default" "false") | quote }}
  RABBITMQ_ALLOW_INSECURE_TLS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ALLOW_INSECURE_TLS" "params" $broker "field" "allowInsecureTls" "default" "false") | quote }}
  RABBITMQ_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ENABLED" "params" $broker "field" "enabled" "default" "false") | quote }}
  RABBITMQ_EXCHANGE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_EXCHANGE" "params" $broker "field" "exchange" "default" "events") | quote }}
  RABBITMQ_PORT_HOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PORT_HOST" "params" $broker "field" "portHost" "default" "15672") | quote }}
  RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS" "params" $broker "field" "publisherConfirmTimeoutMs" "default" "5000") | quote }}
  RABBITMQ_PUBLISHER_MAX_RECOVERIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_MAX_RECOVERIES" "params" $broker "field" "publisherMaxRecoveries" "default" "10") | quote }}
  RABBITMQ_PUBLISHER_RECOVERY_INITIAL_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_RECOVERY_INITIAL_MS" "params" $broker "field" "publisherRecoveryInitialMs" "default" "1000") | quote }}
  RABBITMQ_PUBLISHER_RECOVERY_MAX_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_RECOVERY_MAX_MS" "params" $broker "field" "publisherRecoveryMaxMs" "default" "30000") | quote }}
  RABBITMQ_REQUIRE_HEALTH_ALLOWED_HOSTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_REQUIRE_HEALTH_ALLOWED_HOSTS" "params" $broker "field" "requireHealthAllowedHosts" "default" "false") | quote }}
  RABBITMQ_VHOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_VHOST" "params" $broker "field" "vhost" "default" "/") | quote }}
  RATE_LIMIT_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_ENABLED" "params" $rateLimit "field" "rateLimitEnabled" "default" "true") | quote }}
  RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_MAX" "params" $rateLimit "field" "rateLimitMax" "default" "500") | quote }}
  RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_WINDOW_SEC" "params" $rateLimit "field" "rateLimitWindowSec" "default" "60") | quote }}
  REDIS_DB: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_DB" "params" $redis "field" "db" "default" "0") | quote }}
  REDIS_DIAL_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_DIAL_TIMEOUT" "params" $redis "field" "dialTimeout" "default" "5") | quote }}
  REDIS_MAX_RETRIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MAX_RETRIES" "params" $redis "field" "maxRetries" "default" "3") | quote }}
  REDIS_MAX_RETRY_BACKOFF: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MAX_RETRY_BACKOFF" "params" $redis "field" "maxRetryBackoff" "default" "1") | quote }}
  REDIS_MIN_IDLE_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MIN_IDLE_CONNS" "params" $redis "field" "minIdleConns" "default" "2") | quote }}
  REDIS_MIN_RETRY_BACKOFF: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MIN_RETRY_BACKOFF" "params" $redis "field" "minRetryBackoff" "default" "8") | quote }}
  REDIS_POOL_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_POOL_SIZE" "params" $redis "field" "poolSize" "default" "10") | quote }}
  REDIS_POOL_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_POOL_TIMEOUT" "params" $redis "field" "poolTimeout" "default" "2") | quote }}
  REDIS_PROTOCOL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_PROTOCOL" "params" $redis "field" "protocol" "default" "3") | quote }}
  REDIS_READ_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_READ_TIMEOUT" "params" $redis "field" "readTimeout" "default" "3") | quote }}
  REDIS_TLS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_TLS" "params" $redis "field" "tls" "default" "false") | quote }}
  REDIS_WRITE_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_WRITE_TIMEOUT" "params" $redis "field" "writeTimeout" "default" "3") | quote }}
  RELAXED_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RELAXED_RATE_LIMIT_MAX" "params" $rateLimit "field" "relaxedRateLimitMax" "default" "1000") | quote }}
  RELAXED_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RELAXED_RATE_LIMIT_WINDOW_SEC" "params" $rateLimit "field" "relaxedRateLimitWindowSec" "default" "60") | quote }}
  SERVER_ADDRESS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SERVER_ADDRESS" "params" $server "field" "serverAddress" "default" "0.0.0.0:8080") | quote }}
  SWAGGER_BASE_PATH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_BASE_PATH" "params" $swagger "field" "basePath" "default" "/") | quote }}
  SWAGGER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_ENABLED" "params" $swagger "field" "enabled" "default" "false") | quote }}
  SWAGGER_LEFT_DELIM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_LEFT_DELIM" "params" $swagger "field" "leftDelim" "default" "{{") | quote }}
  SWAGGER_RIGHT_DELIM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_RIGHT_DELIM" "params" $swagger "field" "rightDelim" "default" "}}") | quote }}
  SWAGGER_TITLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_TITLE" "params" $swagger "field" "title" "default" "br-sta") | quote }}
  SWAGGER_VERSION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_VERSION" "params" $swagger "field" "version" "default" "1.0.0") | quote }}
  SYSTEMPLANE_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SYSTEMPLANE_ENABLED" "params" $postgres "field" "systemplaneEnabled" "default" "false") | quote }}
  TLS_TERMINATED_UPSTREAM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TLS_TERMINATED_UPSTREAM" "params" $server "field" "tlsTerminatedUpstream" "default" "true") | quote }}

  # Always set VERSION from the resolved image tag.
  VERSION: {{ include "br-sta.defaultTag" . | quote }}

  # =====================================================================
  # MULTI-TENANCY (lerian-common.multiTenant.env). Toggle via
  # brSta.multiTenant.enabled; URL + Redis infra from global.multiTenant.
  # MT infra keys render only when enabled; URL/REDIS_HOST required then.
  # =====================================================================
  MULTI_TENANT_ENABLED: {{ $multiTenantEnabled | quote }}
  {{- include "lerian-common.multiTenant.env" (dict
        "context" $ "configmap" $cm "enabled" $multiTenantEnabled
        "emitRedis" true "emitPool" true "emitCache" true
        "emitAllowInsecure" true
        "requiredUrl" true "requiredRedisHost" true) | nindent 2 }}
  {{- if $multiTenantEnabled }}
  MULTI_TENANT_POOL_MAX_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_POOL_MAX_CONNS" "params" $multiTenant "field" "poolMaxConns" "default" "20") | quote }}
  MULTI_TENANT_POOL_MAX_IDLE_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_POOL_MAX_IDLE_CONNS" "params" $multiTenant "field" "poolMaxIdleConns" "default" "5") | quote }}
  {{- end }}

  # =====================================================================
  # OPENTELEMETRY. Shared keys (ENABLE_TELEMETRY / OTLP endpoint /
  # deployment-environment) derive from global.observability with a
  # configmap.<KEY> override; identity (name/library/version) per-service.
  # =====================================================================
  {{- include "lerian-common.otel.env" (dict
        "context" $ "configmap" $cm
        "enabledDefault" "false"
        "endpointDefault" ""
        "deploymentEnvironmentDefault" "production") | nindent 2 }}
  {{- include "lerian-common.otel.envFlat" (dict
        "configmap" $cm
        "keys" (list "OTEL_RESOURCE_SERVICE_NAME" "OTEL_LIBRARY_NAME" "OTEL_RESOURCE_SERVICE_VERSION")
        "defaults" (dict
          "OTEL_RESOURCE_SERVICE_NAME" "br-sta"
          "OTEL_LIBRARY_NAME" "github.com/LerianStudio/br-sta"
          "OTEL_RESOURCE_SERVICE_VERSION" (include "br-sta.defaultTag" .))) | nindent 2 }}

  # =====================================================================
  # SERVICE DISCOVERY (serviceDiscovery.env + global.serviceDiscovery). Toggle via
  # brSta.serviceDiscovery.enabled; SD_TOKEN (ACL) is a Secret. Full block when enabled.
  # =====================================================================
  SD_ENABLED: {{ $sdEnabled | quote }}
  {{- include "lerian-common.serviceDiscovery.env" (dict
        "context" $
        "enabled" $sdEnabled
        "configmap" $cm
        "name" (include "br-sta.fullname" .)
        "port" ($component.service).port
        "namespace" $namespace
        "ingressHost" (include "lerian-common.firstIngressHost" (dict "ingress" ($component.ingress | default dict)))) | nindent 2 }}

  # =====================================================================
  # STREAMING (streaming.env + global.streaming). Toggle via brSta.streaming.enabled;
  # STREAMING_SASL_PASSWORD is a Secret. Full SASL/broker block when enabled.
  # =====================================================================
  STREAMING_ENABLED: {{ $streamingEnabled | quote }}
  {{- include "lerian-common.streaming.env" (dict
        "context" $
        "enabled" $streamingEnabled
        "configmap" $cm
        "clientId" (include "br-sta.fullname" .)
        "cloudeventsSource" "lerian.br-sta") | nindent 2 }}

  # =====================================================================
  # ADDITIONAL CONFIG (audit / transfer / trust-store / crypto provider / misc).
  # Each resolves via cfgValue (configmap.<KEY> > br-sta.<group>.<field> > default).
  # =====================================================================
  AUDIT_EXPORT_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AUDIT_EXPORT_RATE_LIMIT_MAX" "params" $audit "field" "exportRateLimitMax" "default" "10") | quote }}
  AUDIT_EXPORT_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AUDIT_EXPORT_RATE_LIMIT_WINDOW_SEC" "params" $audit "field" "exportRateLimitWindowSec" "default" "60") | quote }}
  AUDIT_PUBLISHER_ALTERNATE_EXCHANGE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AUDIT_PUBLISHER_ALTERNATE_EXCHANGE" "params" $audit "field" "publisherAlternateExchange" "default" "sta.audit.dlq") | quote }}
  AUDIT_PUBLISHER_CONFIRM_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AUDIT_PUBLISHER_CONFIRM_TIMEOUT_SEC" "params" $audit "field" "publisherConfirmTimeoutSec" "default" "5") | quote }}
  BACEN_ENVIRONMENT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "BACEN_ENVIRONMENT" "params" $app "field" "bacenEnvironment" "default" "homologation") | quote }}
  CREDENTIALS_RECOVERY_ON_BOOT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CREDENTIALS_RECOVERY_ON_BOOT" "params" $app "field" "credentialsRecoveryOnBoot" "default" "true") | quote }}
  MASTER_KEY_PROVIDER: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MASTER_KEY_PROVIDER" "params" $masterKey "field" "provider" "default" "envvar") | quote }}
  MASTER_KEY_VERSION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MASTER_KEY_VERSION" "params" $masterKey "field" "version" "default" "v1") | quote }}
  POSTGRES_MAX_CONNECTIONS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_MAX_CONNECTIONS" "params" $postgres "field" "maxConnections" "default" "100") | quote }}
  POSTGRES_SHARED_BUFFERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_SHARED_BUFFERS" "params" $postgres "field" "sharedBuffers" "default" "128MB") | quote }}
  RABBITMQ_SCHEME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_SCHEME" "params" $broker "field" "scheme" "default" "amqp") | quote }}
  SERVER_TRUSTED_PROXIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SERVER_TRUSTED_PROXIES" "params" $server "field" "trustedProxies" "default" "") | quote }}
  TRANSFER_INBOUND_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRANSFER_INBOUND_ENABLED" "params" $transfer "field" "inboundEnabled" "default" "false") | quote }}
  TRANSFER_INBOUND_MAX_FILE_SIZE_BYTES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRANSFER_INBOUND_MAX_FILE_SIZE_BYTES" "params" $transfer "field" "inboundMaxFileSizeBytes" "default" "5368709120") | quote }}
  TRANSFER_OBJECT_STORAGE_BUCKET: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRANSFER_OBJECT_STORAGE_BUCKET" "params" $transfer "field" "objectStorageBucket" "default" "") | quote }}
  TRUST_STORE_DEFAULT_PAGE_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_DEFAULT_PAGE_SIZE" "params" $truststore "field" "defaultPageSize" "default" "25") | quote }}
  TRUST_STORE_EXPIRING_SOON_DAYS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_EXPIRING_SOON_DAYS" "params" $truststore "field" "expiringSoonDays" "default" "30") | quote }}
  TRUST_STORE_MAX_CERT_SIZE_BYTES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_MAX_CERT_SIZE_BYTES" "params" $truststore "field" "maxCertSizeBytes" "default" "65536") | quote }}
  TRUST_STORE_MAX_PAGE_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_MAX_PAGE_SIZE" "params" $truststore "field" "maxPageSize" "default" "100") | quote }}
  TRUST_STORE_S3_BUCKET: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_S3_BUCKET" "params" $truststore "field" "s3Bucket" "default" "br-sta-truststore") | quote }}
  TRUST_STORE_S3_ENDPOINT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_S3_ENDPOINT" "params" $truststore "field" "s3Endpoint" "default" "http://localhost:8333") | quote }}
  TRUST_STORE_S3_PATH_STYLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_S3_PATH_STYLE" "params" $truststore "field" "s3PathStyle" "default" "true") | quote }}
  TRUST_STORE_S3_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUST_STORE_S3_REGION" "params" $truststore "field" "s3Region" "default" "us-east-1") | quote }}
  AWS_ACCESS_KEY_ID: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AWS_ACCESS_KEY_ID" "params" $m2m "field" "awsAccessKeyId" "default" "any") | default "" | quote }}

  # =====================================================================
  # POSTGRESQL. HOST/PORT/USER/SSL from the datastore mask (brSta.datastores.postgres
  # → global.datastores.postgres) with a configmap.<KEY> override. When the mask
  # yields no HOST and the bundled subchart is enabled, HOST defaults to the
  # subchart primary Service DNS; otherwise "".
  # =====================================================================
  {{- $pgHost := include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "host" "nativeKey" "POSTGRES_HOST") }}
  {{- if $pgHost }}
  POSTGRES_HOST: {{ $pgHost | quote }}
  {{- else if eq (include "postgresql.enabled" .) "true" }}
  {{- $pgArch := default "standalone" .Values.postgresql.architecture }}
  {{- $pgFullname := include "common.names.dependency.fullname" (dict "chartName" "postgresql" "chartValues" (index .Values "postgresql") "context" .) }}
  {{- if eq $pgArch "replication" }}
  POSTGRES_HOST: {{ printf "%s-primary.%s.svc.cluster.local" $pgFullname $namespace | quote }}
  {{- else }}
  POSTGRES_HOST: {{ printf "%s.%s.svc.cluster.local" $pgFullname $namespace | quote }}
  {{- end }}
  {{- else }}
  POSTGRES_HOST: ""
  {{- end }}
  POSTGRES_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "port" "nativeKey" "POSTGRES_PORT" "default" "5432") | quote }}
  POSTGRES_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "user" "nativeKey" "POSTGRES_USER" "default" "br_sta") | quote }}
  POSTGRES_SSLMODE: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "ssl" "nativeKey" "POSTGRES_SSLMODE" "default" "require") | quote }}
  {{- $replicaHost := include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "replicaHost" "nativeKey" "POSTGRES_REPLICA_HOST") }}
  {{- if $replicaHost }}
  POSTGRES_REPLICA_HOST: {{ $replicaHost | quote }}
  POSTGRES_REPLICA_PORT: {{ $cm.POSTGRES_REPLICA_PORT | default "5432" | quote }}
  POSTGRES_REPLICA_USER: {{ $cm.POSTGRES_REPLICA_USER | quote }}
  POSTGRES_REPLICA_NAME: {{ $cm.POSTGRES_REPLICA_NAME | quote }}
  POSTGRES_REPLICA_SSLMODE: {{ $cm.POSTGRES_REPLICA_SSLMODE | default "require" | quote }}
  {{- end }}

  # =====================================================================
  # REDIS / VALKEY. HOST (host:port) from the datastore mask; when empty and
  # the bundled subchart is enabled, defaults to the primary Service DNS.
  # =====================================================================
  {{- $redisHost := include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "redis" "field" "host" "nativeKey" "REDIS_HOST") }}
  {{- if $redisHost }}
  REDIS_HOST: {{ $redisHost | quote }}
  {{- else if eq (include "valkey.enabled" .) "true" }}
  {{- $vkFullname := include "common.names.dependency.fullname" (dict "chartName" "valkey" "chartValues" (index .Values "valkey") "context" .) }}
  REDIS_HOST: {{ printf "%s-primary.%s.svc.cluster.local:6379" $vkFullname $namespace | quote }}
  {{- else }}
  REDIS_HOST: ""
  {{- end }}

  # =====================================================================
  # RABBITMQ. HOST from the datastore mask; when empty and the bundled broker
  # is enabled, defaults to the groundhog2k Service DNS. PORT/USER via mask.
  # =====================================================================
  {{- $rmqHost := include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "broker" "field" "host" "nativeKey" "RABBITMQ_HOST") }}
  {{- if $rmqHost }}
  RABBITMQ_HOST: {{ $rmqHost | quote }}
  {{- else if eq (include "rabbitmq.enabled" .) "true" }}
  RABBITMQ_HOST: {{ printf "%s-rabbitmq.%s.svc.cluster.local" .Release.Name $namespace | quote }}
  {{- else }}
  RABBITMQ_HOST: ""
  {{- end }}
  RABBITMQ_PORT_AMQP: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "broker" "field" "port" "nativeKey" "RABBITMQ_PORT_AMQP" "default" "5672") | quote }}
  RABBITMQ_DEFAULT_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "broker" "field" "user" "nativeKey" "RABBITMQ_DEFAULT_USER" "default" "br_sta") | quote }}

  # Extra environment variables (passthrough from values.app.extraEnvVars)
  {{- with $component.extraEnvVars }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
