apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-pix-indirect-btg-helm.fullname" . }}-pix
  labels:
    {{- include "plugin-br-pix-indirect-btg-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: pix
type: Opaque
data:
  ANTIFRAUD_HOOK_HMAC_SECRET: {{ .Values.pix.secrets.ANTIFRAUD_HOOK_HMAC_SECRET | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.pix.extraSecretVars }}
  {{- toYaml .Values.pix.extraSecretVars | nindent 2 }}
  {{- end }}
