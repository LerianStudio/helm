{{- $bankTransfer := .Values.bankTransfer | default dict }}
{{- $migrations := get $bankTransfer "migrations" | default dict }}
{{- $configmap := get $bankTransfer "configmap" | default dict }}
{{- $migrationsEnabled := and (eq (lower (toString (get $bankTransfer "enabled" | default false))) "true") (eq (lower (toString (get $migrations "enabled" | default false))) "true") }}
{{- $appUseExisting := eq (lower (toString (get $bankTransfer "useExistingSecret" | default false))) "true" }}
{{- $multiTenantRaw := include "lerian-common.globalValue" (dict "context" $ "configmap" $configmap "block" "multiTenant" "field" "enabled" "nativeKey" "MULTI_TENANT_ENABLED" "default" "false") -}}
{{- $licKey := include "bank-transfer.licenseKeyValue" . }}
{{- /* The licence-gated PreSync migrator runs before the app Secret exists: it gets its own copy of the key. */}}
{{- if and $migrationsEnabled $licKey (not $appUseExisting) (ne (include "bank-transfer.postgresInternal" .) "true") (ne (lower (toString $multiTenantRaw)) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bank-transfer.licenseHookName" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "bank-transfer.labels" (dict "context" . "component" "migrations" "name" (get $bankTransfer "name")) | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-5"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
type: Opaque
stringData:
  LICENSE_KEY: {{ $licKey | quote }}
{{- end }}
