{{- /*
Gated on app.enabled as well as serviceAccount.create: with the app disabled the
chart renders nothing, so a lone ServiceAccount would be an orphan resource.
*/ -}}
{{- if and .Values.app.enabled .Values.serviceAccount.create -}}
{{- include "br-spi-mock-bacen.validateEnvironment" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "br-spi-mock-bacen.serviceAccountName" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-spi-mock-bacen.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) (.Values.serviceAccount.annotations | default dict) ((.Values.global | default dict).commonAnnotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
