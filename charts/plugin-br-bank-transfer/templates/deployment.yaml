{{- if .Values.bankTransfer.enabled }}
{{- $h := include "bank-transfer.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-transfer.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "bank-transfer.labels" (dict "context" . "component" .Values.bankTransfer.name "name" .Values.bankTransfer.name ) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.bankTransfer.revisionHistoryLimit | default 10 }}
  strategy: {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bank-transfer.selectorLabels" (dict "context" . "name" .Values.bankTransfer.name ) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.bankTransfer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "bank-transfer.labels" (dict "context" . "component" .Values.bankTransfer.name "name" .Values.bankTransfer.name "podTemplate" true) | nindent 8 }}
    spec:
      {{- with .Values.bankTransfer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bank-transfer.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.bankTransfer.podSecurityContext | nindent 8 }}
      {{- /* Same global.multiTenant mask configmap.yaml resolves MULTI_TENANT_ENABLED through, so the
             dependency wait gate is skipped exactly when the ConfigMap omits POSTGRES_*. */}}
      {{- $multiTenantEnabledRaw := include "lerian-common.globalValue" (dict "context" $ "configmap" (.Values.bankTransfer.configmap | default dict) "block" "multiTenant" "field" "enabled" "nativeKey" "MULTI_TENANT_ENABLED" "default" "false") }}
      {{- $multiTenantEnabled := eq (lower (toString $multiTenantEnabledRaw)) "true" }}
      {{- if not $multiTenantEnabled }}
      # In multi-tenant mode the bootstrap does not connect to any static
      # Postgres / Redis at boot — per-tenant connections are resolved via
      # tenant-manager at request time. Skip the dependency wait gate.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          envFrom:
          - configMapRef:
              name: {{ include "bank-transfer.fullname" . }}
          command:
            - /bin/sh
            - -c
            - |
              MAX_ATTEMPTS=60
              SLEEP_SECONDS=5
              # Total timeout: 60 * 5 = 300 seconds (5 minutes)

              wait_for_service() {
                local HOST="$1"
                local PORT="$2"
                local ATTEMPTS=0
                echo "Checking $HOST:$PORT..."
                while ! nc -z "$HOST" "$PORT"; do
                  ATTEMPTS=$((ATTEMPTS + 1))
                  if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                    echo "Timeout waiting for $HOST:$PORT after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds"
                    exit 1
                  fi
                  echo "$HOST:$PORT is not ready yet, waiting... (attempt $ATTEMPTS/$MAX_ATTEMPTS)"
                  sleep $SLEEP_SECONDS
                done
                echo "$HOST:$PORT is ready!"
              }

              # Wait for PostgreSQL
              wait_for_service "$POSTGRES_HOST" "$POSTGRES_PORT"

              # Wait for Redis/Valkey
              REDIS_SVC=$(echo "$REDIS_HOST" | cut -d: -f1)
              REDIS_PORT_NUM=$(echo "$REDIS_HOST" | cut -d: -f2)
              wait_for_service "$REDIS_SVC" "$REDIS_PORT_NUM"

              echo "All dependencies are ready!"
        {{- if and (eq (include "bank-transfer.postgresInternal" .) "true") (eq (lower (toString .Values.bankTransfer.migrations.enabled)) "true") }}
        {{- include "bank-transfer.migrationsContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "bank-transfer.fullname" . }}
          securityContext:
            {{- toYaml .Values.bankTransfer.securityContext | nindent 12 }}
          image: "{{ .Values.bankTransfer.image.repository }}:{{ .Values.bankTransfer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.bankTransfer.image.pullPolicy }}
          envFrom:
          - secretRef:
              name: {{ if .Values.bankTransfer.useExistingSecret }}{{ required "bankTransfer.existingSecretName is required when bankTransfer.useExistingSecret is true" .Values.bankTransfer.existingSecretName }}{{ else }}{{ include "bank-transfer.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "bank-transfer.fullname" . }}
          env:
          {{- toYaml $h.env | nindent 10 }}
          {{- $secretName := ternary .Values.bankTransfer.existingSecretName (include "bank-transfer.fullname" .) .Values.bankTransfer.useExistingSecret }}
          {{- $pg := .Values.postgresql | default dict }}
          {{- $pgAuth := $pg.auth | default dict }}
          {{- if or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
          {{- include "bank-transfer.infraSecretRef" (dict "context" $ "subchart" "postgresql" "key" "password" "envName" "POSTGRES_PASSWORD") | nindent 10 }}
          {{- else if .Values.bankTransfer.secrets.POSTGRES_PASSWORD }}
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $secretName }}
                key: POSTGRES_PASSWORD
          {{- end }}
          {{- $vk := .Values.valkey | default dict }}
          {{- $vkAuth := $vk.auth | default dict }}
          {{- if or (and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled) $vkAuth.existingSecret }}
          {{- include "bank-transfer.infraSecretRef" (dict "context" $ "subchart" "valkey" "key" "valkey-password" "envName" "REDIS_PASSWORD") | nindent 10 }}
          {{- else if .Values.bankTransfer.secrets.REDIS_PASSWORD }}
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $secretName }}
                key: REDIS_PASSWORD
          {{- end }}
          {{- include "bank-transfer.mongoEnv" (dict "context" $) | nindent 10 }}
          {{- /* Same global.observability mask configmap.yaml resolves ENABLE_TELEMETRY and the endpoint through. */}}
          {{- $otelCm := .Values.bankTransfer.configmap | default dict }}
          {{- if eq (lower (include "lerian-common.globalValue" (dict "context" $ "configmap" $otelCm "block" "observability" "field" "enabled" "nativeKey" "ENABLE_TELEMETRY" "default" "false"))) "true" }}
          - name: "HOST_IP"
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: "POD_IP"
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if not (include "lerian-common.globalValue" (dict "context" $ "configmap" $otelCm "block" "observability" "field" "otlpEndpoint" "nativeKey" "OTEL_EXPORTER_OTLP_ENDPOINT" "default" "")) }}
          - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
            value: "$(HOST_IP):4317"
          {{- end }}
          - name: "OTEL_RESOURCE_ATTRIBUTES"
            value: "k8s.pod.ip=$(POD_IP)"
          {{- end }}
          ports:
            - name: http
              containerPort: 4027
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          startupProbe: {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe: {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $h.readinessProbe | nindent 12 }}
          {{- with (include "bank-transfer.licenseFileMount" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.bankTransfer.resources | nindent 12 }}
      {{- with (include "bank-transfer.licenseFileVolume" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- /* nodeSelector / affinity / tolerations + topologySpreadConstraints
             (global.scheduling.spread preset, bankTransfer.spread, bankTransfer.topologySpreadConstraints).
             selectorLabels MUST equal spec.selector.matchLabels above. */}}
      {{- with (include "lerian-common.scheduling" (dict
            "component" .Values.bankTransfer
            "global" .Values.global
            "selectorLabels" (include "bank-transfer.selectorLabels" (dict "context" . "name" .Values.bankTransfer.name))) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.bankTransfer.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
