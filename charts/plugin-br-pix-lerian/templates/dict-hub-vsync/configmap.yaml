{{- if .Values.dictHubVsync.enabled }}
{{- $component := "dict-hub-vsync" }}
{{- $values := .Values.dictHubVsync }}
{{- $cm := $values.configmap | default dict }}
{{- /*
PRODUCTIZED to the STANDARD lerian-common contract (productize-chart-env).
Dependency-connection families flow from the shared global.* contract via
lerian-common masks; the chart emits STANDARD key names.
  - auth (auth.env -> PLUGIN_AUTH_ENABLED + PLUGIN_AUTH_HOST; global.auth)
  - observability (otel.env -> ENABLE_TELEMETRY + OTEL_EXPORTER_OTLP_ENDPOINT + OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT; global.observability)
  - redis (datastore.value -> REDIS_HOST/PORT/USER/DB/TLS; global.datastores.redis)
  - multiTenant (multiTenant.env -> MULTI_TENANT_URL + circuit breaker; global.multiTenant)

DROPPED deviating app keys (superseded by the standard names above):
  TELEMETRY_ENABLED (->ENABLE_TELEMETRY), PLUGIN_AUTH_URL (->PLUGIN_AUTH_HOST),
  ORGANIZATION_ID (->ORGANIZATION_IDS), DB_SSL_MODE (->DB_SSLMODE).
Composed URIs DATABASE_URL / VALKEY_URL remain ONLY in secrets.yaml as
migration/wait-init tooling inputs (never app-runtime config here).

Credentials NEVER render here; the trailing escape hatch OMITS them
(leaked-secret guard). A masked key still honours dictHubVsync.configmap.<KEY>.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plugin-br-pix-lerian.componentFullname" (dict "context" $ "component" $component) }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-pix-lerian.labels" (dict "context" $ "component" $component) | nindent 4 }}
data:
  # --- auth: global.auth contract (PLUGIN_AUTH_ENABLED + PLUGIN_AUTH_HOST) ---
  {{- include "lerian-common.auth.env" (dict "context" $ "configmap" $cm "hostKey" "PLUGIN_AUTH_HOST" "hostDefault" "http://plugin-auth:4000") | nindent 2 }}
  # --- observability: global.observability contract (otel.env) ---
  {{- include "lerian-common.otel.env" (dict "context" $ "configmap" $cm "enabledDefault" "true" "endpointDefault" "" "deploymentEnvironmentDefault" "development") | nindent 2 }}
  # --- redis: global.datastores.redis contract (standard REDIS_*) ---
  REDIS_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($values.datastores | default dict) "configmap" $cm "type" "redis" "field" "host" "nativeKey" "REDIS_HOST" "default" "localhost") | quote }}
  REDIS_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($values.datastores | default dict) "configmap" $cm "type" "redis" "field" "port" "nativeKey" "REDIS_PORT" "default" "6379") | quote }}
  REDIS_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($values.datastores | default dict) "configmap" $cm "type" "redis" "field" "user" "nativeKey" "REDIS_USER" "default" "") | quote }}
  REDIS_DB: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($values.datastores | default dict) "configmap" $cm "type" "redis" "field" "db" "nativeKey" "REDIS_DB" "default" "0") | quote }}
  REDIS_TLS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" ($values.datastores | default dict) "configmap" $cm "type" "redis" "field" "tls" "nativeKey" "REDIS_TLS" "default" "false") | quote }}
  # --- multi-tenant: global.multiTenant contract (URL + circuit breaker, gated) ---
  {{- $mtEnabled := eq (toString ($cm.MULTI_TENANT_ENABLED | default "false")) "true" }}
  MULTI_TENANT_ENABLED: {{ $cm.MULTI_TENANT_ENABLED | default "false" | quote }}
  {{- include "lerian-common.multiTenant.env" (dict "context" $ "configmap" $cm "enabled" $mtEnabled) | nindent 2 }}
  # --- app config (plain passthrough; default = curated/.env.example value) ---
  APPLICATION_NAME: {{ $cm.APPLICATION_NAME | default "pix-dict-hub-vsync" | quote }}
  SERVER_ADDRESS: {{ $cm.SERVER_ADDRESS | default ":4105" | quote }}
  LOG_LEVEL: {{ $cm.LOG_LEVEL | default "info" | quote }}
  ENV_NAME: {{ $cm.ENV_NAME | default "development" | quote }}
  DEPLOYMENT_MODE: {{ $cm.DEPLOYMENT_MODE | default "byoc" | quote }}
  REQUEST_TIMEOUT_SEC: {{ $cm.REQUEST_TIMEOUT_SEC | default "30" | quote }}
  OTEL_RESOURCE_SERVICE_NAME: {{ $cm.OTEL_RESOURCE_SERVICE_NAME | default "pix-dict-hub-vsync" | quote }}
  OTEL_LIBRARY_NAME: {{ $cm.OTEL_LIBRARY_NAME | default "github.com/LerianStudio/plugin-br-pix-lerian" | quote }}
  # -- Deliberately empty: the only adapter this chart can render is
  # adapter-provider-mock, which ships disabled (see
  # adapterProviderMock.enabled), so any default here would point at a
  # Service that does not exist -- and the previous default also omitted the
  # /provider-mock prefix every real environment appends, so it could only
  # ever be wrong, masking the absence of real configuration.
  # Empty does NOT fail at boot: the app does not validate this variable at
  # startup (no `required` tag), it only seeds the systemplane provider key.
  # The effective value is resolved per request from TenantConfig, so a
  # request with no adapter base URL is rejected then, not at rollout.
  # Example: http://plugin-br-pix-lerian-adapter-provider-mock:4103/provider-mock
  ADAPTER_BASE_URL: {{ $cm.ADAPTER_BASE_URL | default "" | quote }}
  CRM_BASE_URL: {{ $cm.CRM_BASE_URL | default "" | quote }}
  CRM_CLIENT_ID: {{ $cm.CRM_CLIENT_ID | default "" | quote }}
  CRM_ORGANIZATION_ID: {{ $cm.CRM_ORGANIZATION_ID | default "" | quote }}
  # -- Multi-tenant (vsync uses the per-tenant DSN resolver only; no
  # API key here, no CB tunables — the resolver shares the dict-hub
  # tenant-manager client config).
  # VSync tunables
  VSYNC_ENABLED: {{ $cm.VSYNC_ENABLED | default "true" | quote }}
  VSYNC_CHUNK_PROCESSING_DEADLINE_MIN: {{ $cm.VSYNC_CHUNK_PROCESSING_DEADLINE_MIN | default "30" | quote }}
  VSYNC_EVENTSYNC_MAX_PAGES: {{ $cm.VSYNC_EVENTSYNC_MAX_PAGES | default "100" | quote }}
  VSYNC_FILE_RECON_ENABLED: {{ $cm.VSYNC_FILE_RECON_ENABLED | default "false" | quote }}
  VSYNC_GATE_TTL_SEC: {{ $cm.VSYNC_GATE_TTL_SEC | default "300" | quote }}
  VSYNC_MAX_JOB_ATTEMPTS: {{ $cm.VSYNC_MAX_JOB_ATTEMPTS | default "5" | quote }}
  VSYNC_OK_CACHE_TTL_SEC: {{ $cm.VSYNC_OK_CACHE_TTL_SEC | default "60" | quote }}
  VSYNC_SCOPE_CONCURRENCY: {{ $cm.VSYNC_SCOPE_CONCURRENCY | default "10" | quote }}
  VSYNC_START_TIME: {{ $cm.VSYNC_START_TIME | default "" | quote }}
  VSYNC_STUCK_JOB_SWEEP_TICK_SEC: {{ $cm.VSYNC_STUCK_JOB_SWEEP_TICK_SEC | default "30" | quote }}
  ORGANIZATION_IDS: {{ $cm.ORGANIZATION_IDS | default "global" | quote }}
  ISPB: {{ $cm.ISPB | default "00000000" | quote }}
  RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK: {{ $cm.RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK | default "true" | quote }}
  ALLOW_INSECURE_TLS: {{ $cm.ALLOW_INSECURE_TLS | default "true" | quote }}
  {{- /* OTEL_RESOURCE_SERVICE_VERSION: from image tag (image.tag then
     Chart.AppVersion); override via dictHubVsync.configmap.OTEL_RESOURCE_SERVICE_VERSION. */}}
  {{- if not (hasKey $cm "OTEL_RESOURCE_SERVICE_VERSION") }}
  {{- $compTag := default $.Chart.AppVersion $values.image.tag }}
  OTEL_RESOURCE_SERVICE_VERSION: {{ $compTag | quote }}
  {{- end }}
  {{- /* Escape hatch: un-enumerated configmap.<KEY>. Skips every emitted key
     (plain/mask/inline), the superseded deviating names, and every credential
     (leaked-secret guard) so a configmap.<SECRET> can never surface here. */}}
  {{- $enumerated := dict }}
  {{- range $k := (list
      "ADAPTER_BASE_URL" "ALLOW_INSECURE_TLS" "APPLICATION_NAME" "CRM_BASE_URL" "CRM_CLIENT_ID"
      "CRM_CLIENT_SECRET" "CRM_ORGANIZATION_ID" "DATABASE_URL" "DB_REPLICA_SSL_MODE"
      "DB_SSL_MODE" "DEPLOYMENT_MODE" "ENABLE_TELEMETRY" "ENV_NAME" "ISPB" "LICENSE_KEY"
      "LOG_LEVEL" "MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD"
      "MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC" "MULTI_TENANT_ENABLED" "MULTI_TENANT_URL"
      "ORGANIZATION_ID" "ORGANIZATION_IDS" "OTEL_EXPORTER_OTLP_ENDPOINT" "OTEL_LIBRARY_NAME"
      "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" "OTEL_RESOURCE_SERVICE_NAME"
      "OTEL_RESOURCE_SERVICE_VERSION" "PLUGIN_AUTH_ENABLED" "PLUGIN_AUTH_HOST"
      "PLUGIN_AUTH_URL" "RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK" "RABBITMQ_URI" "REDIS_DB"
      "REDIS_HOST" "REDIS_PASSWORD" "REDIS_PORT" "REDIS_TLS" "REDIS_USER" "REQUEST_TIMEOUT_SEC"
      "SERVER_ADDRESS" "SYSTEMPLANE_POSTGRES_DSN" "TELEMETRY_ENABLED" "VALKEY_URL"
      "VSYNC_CHUNK_PROCESSING_DEADLINE_MIN" "VSYNC_ENABLED" "VSYNC_EVENTSYNC_MAX_PAGES"
      "VSYNC_FILE_RECON_ENABLED" "VSYNC_GATE_TTL_SEC" "VSYNC_MAX_JOB_ATTEMPTS"
      "VSYNC_OK_CACHE_TTL_SEC" "VSYNC_SCOPE_CONCURRENCY" "VSYNC_START_TIME"
      "VSYNC_STUCK_JOB_SWEEP_TICK_SEC"
    ) }}
  {{- $_ := set $enumerated $k 1 }}
  {{- end }}
  {{- range $key, $value := $cm }}
  {{- if not (hasKey $enumerated $key) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
