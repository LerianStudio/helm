{{- if .Values.dictSystemplane.enabled }}
{{- $component := "dict-systemplane" }}
{{- $values := .Values.dictSystemplane }}
{{- $cm := $values.configmap | default dict }}
{{- /*
PRODUCTIZED (productize-chart-env pattern; see charts/streaming-hub,
charts/reporter). AUTHORITY = the app component's config/.env.example on
develop. Every non-secret key is a `$cm.<KEY> | default "<value>"` passthrough:
the default lives HERE (curated k8s default where the chart shipped one, else the
.env.example default), and `dictSystemplane.configmap.<KEY>` overrides it.

No lerian-common mask is adopted: this app reads DB_* (not POSTGRES_*),
TELEMETRY_ENABLED (not ENABLE_TELEMETRY), and BOTH PLUGIN_AUTH_URL and
PLUGIN_AUTH_HOST -- none is a clean key-name match for datastore.value /
otel.env / auth.env, so a correct plain default is used (a mask emitting the
wrong key name would render config the app ignores).

Credentials NEVER render here -- they live in templates/dict-systemplane/secrets.yaml
and the trailing escape hatch OMITS them (leaked-secret guard) so a mistaken
`configmap.<SECRET>` can never surface in this plaintext ConfigMap.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plugin-br-pix-lerian.componentFullname" (dict "context" $ "component" $component) }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-pix-lerian.labels" (dict "context" $ "component" $component) | nindent 4 }}
data:
  PLUGIN_AUTH_ENABLED: {{ $cm.PLUGIN_AUTH_ENABLED | default "false" | quote }}
  PLUGIN_AUTH_URL: {{ $cm.PLUGIN_AUTH_URL | default "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000" | quote }}
  APPLICATION_NAME: {{ $cm.APPLICATION_NAME | default "pix-dict-systemplane" | quote }}
  SERVER_ADDRESS: {{ $cm.SERVER_ADDRESS | default ":4107" | quote }}
  LOG_LEVEL: {{ $cm.LOG_LEVEL | default "info" | quote }}
  ENV_NAME: {{ $cm.ENV_NAME | default "development" | quote }}
  DEPLOYMENT_MODE: {{ $cm.DEPLOYMENT_MODE | default "byoc" | quote }}
  REQUEST_TIMEOUT_SEC: {{ $cm.REQUEST_TIMEOUT_SEC | default "30" | quote }}
  TELEMETRY_ENABLED: {{ $cm.TELEMETRY_ENABLED | default "true" | quote }}
  OTEL_RESOURCE_SERVICE_NAME: {{ $cm.OTEL_RESOURCE_SERVICE_NAME | default "pix-dict-systemplane" | quote }}
  OTEL_LIBRARY_NAME: {{ $cm.OTEL_LIBRARY_NAME | default "github.com/LerianStudio/plugin-br-pix-lerian" | quote }}
  OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT: {{ $cm.OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT | default "development" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $cm.OTEL_EXPORTER_OTLP_ENDPOINT | default "" | quote }}
  # -- Multi-tenant flag. dict-systemplane reads only the boolean (URL +
  # API key live on spi-systemplane). When enabled, the systemplane store
  # is bootstrapped in MT mode.
  MULTI_TENANT_ENABLED: {{ $cm.MULTI_TENANT_ENABLED | default "false" | quote }}
  # --- coverage: keys from dict-systemplane .env.example not previously in the chart ---
  MULTI_TENANT_URL: {{ $cm.MULTI_TENANT_URL | default "" | quote }}
  MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD: {{ $cm.MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD | default "5" | quote }}
  MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC: {{ $cm.MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC | default "30" | quote }}
  ORGANIZATION_ID: {{ $cm.ORGANIZATION_ID | default "" | quote }}
  ISPB: {{ $cm.ISPB | default "" | quote }}
  ADAPTER_BASE_URL: {{ $cm.ADAPTER_BASE_URL | default "" | quote }}
  CRM_BASE_URL: {{ $cm.CRM_BASE_URL | default "" | quote }}
  CRM_CLIENT_ID: {{ $cm.CRM_CLIENT_ID | default "" | quote }}
  SPI_BASE_URL: {{ $cm.SPI_BASE_URL | default "" | quote }}
  SPI_CLIENT_ID: {{ $cm.SPI_CLIENT_ID | default "" | quote }}
  KEY_CACHE_TTL_SEC: {{ $cm.KEY_CACHE_TTL_SEC | default "60" | quote }}
  OUTBOUND_CALLBACK_URL: {{ $cm.OUTBOUND_CALLBACK_URL | default "" | quote }}
  OUTBOUND_HMAC_SECRET_REF: {{ $cm.OUTBOUND_HMAC_SECRET_REF | default "callback_hmac_secret" | quote }}
  VSYNC_ENABLED: {{ $cm.VSYNC_ENABLED | default "true" | quote }}
  VSYNC_FILE_RECON_ENABLED: {{ $cm.VSYNC_FILE_RECON_ENABLED | default "true" | quote }}
  VSYNC_CHUNK_CONSUMER_WORKERS: {{ $cm.VSYNC_CHUNK_CONSUMER_WORKERS | default "3" | quote }}
  VSYNC_JOBS_CONSUMER_WORKERS: {{ $cm.VSYNC_JOBS_CONSUMER_WORKERS | default "3" | quote }}
  VSYNC_STUCK_JOB_SWEEP_TICK_SEC: {{ $cm.VSYNC_STUCK_JOB_SWEEP_TICK_SEC | default "120" | quote }}
  VSYNC_CHUNK_PROCESSING_DEADLINE_MIN: {{ $cm.VSYNC_CHUNK_PROCESSING_DEADLINE_MIN | default "30" | quote }}
  VSYNC_MAX_JOB_ATTEMPTS: {{ $cm.VSYNC_MAX_JOB_ATTEMPTS | default "3" | quote }}
  VSYNC_EVENTSYNC_MAX_PAGES: {{ $cm.VSYNC_EVENTSYNC_MAX_PAGES | default "100" | quote }}
  VSYNC_GATE_TTL_SEC: {{ $cm.VSYNC_GATE_TTL_SEC | default "3600" | quote }}
  VSYNC_TENANT_CONCURRENCY: {{ $cm.VSYNC_TENANT_CONCURRENCY | default "4" | quote }}
  {{- /*
  OTEL_RESOURCE_SERVICE_VERSION: derive from the deployed image tag so it
  tracks releases automatically. Resolution order:
    component image.tag then Chart.AppVersion.
  Operators can override via `dictSystemplane.configmap.OTEL_RESOURCE_SERVICE_VERSION`.
  */}}
  {{- if not (hasKey $cm "OTEL_RESOURCE_SERVICE_VERSION") }}
  {{- $compTag := default $.Chart.AppVersion $values.image.tag }}
  OTEL_RESOURCE_SERVICE_VERSION: {{ $compTag | quote }}
  {{- end }}
  {{- /*
  Escape hatch: emit any un-enumerated configmap.<KEY> the operator injects.
  Skips every key emitted above AND every credential key (leaked-secret guard)
  so a mistaken configmap.<SECRET> can never surface in this plaintext ConfigMap.
  */}}
  {{- $enumerated := dict }}
  {{- range $k := (list
      "ADAPTER_BASE_URL" "APPLICATION_NAME" "CRM_BASE_URL" "CRM_CLIENT_ID" "CRM_CLIENT_SECRET" 
      "DATABASE_URL" "DEPLOYMENT_MODE" "ENV_NAME" "ISPB" "KEY_CACHE_TTL_SEC" "LICENSE_KEY" 
      "LOG_LEVEL" "MULTI_TENANT_API_KEY" "MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD" 
      "MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC" "MULTI_TENANT_ENABLED" "MULTI_TENANT_URL" 
      "ORGANIZATION_ID" "OTEL_EXPORTER_OTLP_ENDPOINT" "OTEL_LIBRARY_NAME" 
      "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" "OTEL_RESOURCE_SERVICE_NAME" 
      "OTEL_RESOURCE_SERVICE_VERSION" "OUTBOUND_CALLBACK_URL" "OUTBOUND_HMAC_SECRET" 
      "OUTBOUND_HMAC_SECRET_REF" "PLUGIN_AUTH_ENABLED" "PLUGIN_AUTH_URL" "REQUEST_TIMEOUT_SEC" 
      "SERVER_ADDRESS" "SPI_BASE_URL" "SPI_CLIENT_ID" "SPI_CLIENT_SECRET" 
      "SYSTEMPLANE_POSTGRES_DSN" "SYSTEMPLANE_SECRET_MASTER_KEY" "TELEMETRY_ENABLED" 
      "VSYNC_CHUNK_CONSUMER_WORKERS" "VSYNC_CHUNK_PROCESSING_DEADLINE_MIN" "VSYNC_ENABLED" 
      "VSYNC_EVENTSYNC_MAX_PAGES" "VSYNC_FILE_RECON_ENABLED" "VSYNC_GATE_TTL_SEC" 
      "VSYNC_JOBS_CONSUMER_WORKERS" "VSYNC_MAX_JOB_ATTEMPTS" "VSYNC_STUCK_JOB_SWEEP_TICK_SEC" 
      "VSYNC_TENANT_CONCURRENCY"
    ) }}
  {{- $_ := set $enumerated $k 1 }}
  {{- end }}
  {{- range $key, $value := $cm }}
  {{- if not (hasKey $enumerated $key) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
