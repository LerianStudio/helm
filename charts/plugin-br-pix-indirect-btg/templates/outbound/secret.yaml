apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-pix-indirect-btg-helm.fullname" . }}-outbound
  labels:
    {{- include "plugin-br-pix-indirect-btg-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbound
type: Opaque
data:
  LICENSE_KEY: {{ .Values.outbound.secrets.LICENSE_KEY | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.outbound.extraSecretVars }}
  {{- toYaml .Values.outbound.extraSecretVars | nindent 2 }}
  {{- end }}
