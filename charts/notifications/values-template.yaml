# Per-environment values template. Copy and override per env (firmino, staging,
# production). Sensitive values should be left empty here and injected via
# gitops + ArgoCD Vault Plugin, or replaced entirely with `secretRef.name`
# pointing at a pre-existing Secret.

api:
  replicaCount: 1
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3

workerEmail:
  enabled: true
  replicaCount: 1

workerSms:
  enabled: true
  replicaCount: 1

workerWebhook:
  enabled: true
  replicaCount: 1

migrations:
  enabled: true

# External Secret (preferred for gitops). Leave blank to use the chart-rendered
# Secret populated from `.Values.secrets` below.
secretRef:
  name: ""

config:
  # Only `production` enables the application's production checks (Swagger off,
  # rate limiting forced on, dev encryption keys and sslmode=disable refused).
  ENV_NAME: "firmino"
  LOG_LEVEL: "info"
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "notifications"
  POSTGRES_NAME: "notifications"
  POSTGRES_SSLMODE: "require"
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  RABBITMQ_HOST: ""
  RABBITMQ_PORT_AMQP: "5672"

# Required: the application will not boot without the two encryption keys, and
# the migrations Job needs DATABASE_URL while `migrations.enabled` is true.
# Generate keys with `openssl rand -base64 32`.
secrets:
  DATABASE_URL: ""                          # postgres://USER:PASSWORD@HOST:PORT/DB?sslmode=require (URL-escaped)
  NOTIFICATION_ENCRYPTION_KEY: ""           # base64, 32 bytes
  NOTIFICATION_AUTH_CACHE_ENCRYPTION_KEY: ""  # base64, 32 bytes
  POSTGRES_PASSWORD: ""
  REDIS_PASSWORD: ""
  RABBITMQ_URL: ""
  RABBITMQ_DEFAULT_USER: ""
  RABBITMQ_DEFAULT_PASS: ""
  RABBITMQ_HEALTH_CHECK_URL: ""
