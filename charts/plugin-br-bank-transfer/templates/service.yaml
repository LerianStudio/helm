{{- if .Values.bankTransfer.enabled }}
{{- $h := include "bank-transfer.health" . | fromYaml }}
{{- $mt := eq (lower (toString (include "lerian-common.globalValue" (dict "context" $ "configmap" .Values.bankTransfer.configmap "block" "multiTenant" "field" "enabled" "nativeKey" "MULTI_TENANT_ENABLED" "default" "false")))) "true" }}
{{- include "lerian-common.service" (dict
      "service" .Values.bankTransfer.service
      "name" (include "bank-transfer.fullname" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "bank-transfer.labels" (dict "context" . "component" .Values.bankTransfer.name "name" .Values.bankTransfer.name))
      "selector" (include "bank-transfer.selectorLabels" (dict "context" . "name" .Values.bankTransfer.name))
      "ports" (ternary $h.servicePorts (list) $mt)
    ) }}
{{- end }}
