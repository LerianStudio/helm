apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "br-slc.fullname" . }}-validator
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-slc.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.xsdValidator.configmap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
