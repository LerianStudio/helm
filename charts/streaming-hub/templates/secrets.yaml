{{/*
ONE shared Opaque Secret — role-INVARIANT sensitive env. Identical across all
roles, so it is NOT duplicated per role.

Rendered ONLY when NOT useExistingSecret. When useExistingSecret=true (the
gitops/Vault path) this emits nothing and the Deployments reference
existingSecretName instead — that branch is exercised by the chart and MUST stay
working, and it carries a KEY CONTRACT (STREAMING_HUB_POSTGRES_DSN,
STREAMING_HUB_DASHBOARD_CURSOR_HMAC_KEY and LICENSE_KEY, all pinned via
secretKeyRef in _deployment.tpl).

Credential classification (productize-chart-env): every value here carries
credential material and NEVER lands in the ConfigMap (the configmap template
omit-guards these exact keys).

ALWAYS-emitted (even empty) so a bare `helm template`/coverage render succeeds
and the key is present for envFrom — an empty value fails the app fast at boot
rather than deferring to a silent misconfig:
  - STREAMING_HUB_POSTGRES_DSN — the app's single Postgres connection (password
    embedded). Provide it via a protected values source, or useExistingSecret=true.
  - STREAMING_HUB_KAFKA_CA_CERT — broker TLS CA (used when KAFKA_TLS_ENABLED=true).
  - STREAMING_HUB_DEV_KEK — dev-only KEK material, named by STREAMING_HUB_KEK_REF.
  - STREAMING_HUB_DASHBOARD_CURSOR_HMAC_KEY — 32 bytes, base64, signing the
    dashboard pagination cursors. Mandatory in EVERY mode from the 2.x line on,
    so it joins the KEY CONTRACT above: the Deployments pin it via secretKeyRef
    exactly like the DSN, and the app never echoes its value.
  - LICENSE_KEY — the Lerian license (lib-license-go, GLOBAL mode). UNPREFIXED by
    the platform's lib-license-go convention. REQUIRED in EVERY environment: the
    license-gated app refuses to boot without it (ErrMissingLicenseKey), so it
    joins the KEY CONTRACT and is pinned via secretKeyRef on the
    useExistingSecret path. Its non-secret companions ORGANIZATION_IDS (must be
    exactly "global") lives in the ConfigMap.
(These are ALSO always-emitted because their NAMES are not credential-shaped,
so the coverage check only counts them when actually rendered.)

Emit-when-set (skipped when empty): STREAMING_HUB_KAFKA_SCRAM_PASSWORD (required
when a SASL mechanism is set), STREAMING_HUB_REDIS_PASSWORD (rate-limiter AUTH;
legitimately absent when the Redis takes none — which is why it is NOT pinned via
secretKeyRef on the useExistingSecret path) and POSTGRES_PASSWORD (migration-
toolchain input; no in-cluster consumer — the migration Job uses the DSN —
shipped for .env parity).
*/}}
{{- if not .Values.streamingHub.useExistingSecret }}
{{- $secrets := .Values.streamingHub.secrets | default dict }}
{{- $always := list "STREAMING_HUB_POSTGRES_DSN" "STREAMING_HUB_KAFKA_CA_CERT" "STREAMING_HUB_DEV_KEK" "STREAMING_HUB_DASHBOARD_CURSOR_HMAC_KEY" "LICENSE_KEY" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streaming-hub.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "streaming-hub.labels" (dict "context" . "component" "all") | nindent 4 }}
type: Opaque
data:
  {{- range $key := $always }}
  {{ $key }}: {{ get $secrets $key | default "" | toString | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := $secrets }}
  {{- if and $value (not (has $key $always)) }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
