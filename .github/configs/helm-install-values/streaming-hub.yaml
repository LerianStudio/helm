# CI-ONLY install fixture for charts/streaming-hub, layered on top of
# ../helm-render-values/streaming-hub.yaml by helm-install-test.yml.
#
# Derived from the first real install run (helm#2123, kind, deep mode): the pod
# sat in ImagePullBackOff with "failed to fetch anonymous token ... 401", so the
# kubelet pulled ghcr.io/lerianstudio/streaming-hub with NO credential at all.
#
# Why the test's own mechanism did not reach this pod: install-test.sh creates the
# pull Secret `it-registry` in every namespace and attaches it to the `default`
# ServiceAccount, "so no chart has to expose an imagePullSecrets value for this".
# This chart runs its pods under its OWN ServiceAccount (templates/serviceaccount.yaml),
# which the patch never touches, and values.yaml pins `imagePullSecrets` to
# `ghcr-credential`, a Secret that exists in Lerian clusters and not in kind. The
# pod therefore referenced a missing Secret and fell back to anonymous.
#
# The delta: point the chart's own list at the Secret the test creates. Nothing
# else changes; the chart's production default stays `ghcr-credential`.
streamingHub:
  imagePullSecrets:
    - name: it-registry
