name: Access Manager Startup Contract

on:
  pull_request:
    paths:
      - 'charts/plugin-access-manager/**'
      - '.github/workflows/access-manager-startup-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-contract:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Install test dependencies in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/am-startup-tests"
          "$RUNNER_TEMP/am-startup-tests/bin/pip" install 'PyYAML==6.0.2'
      - name: Build chart dependencies
        run: helm dependency build charts/plugin-access-manager
      - name: Verify startup prerequisites and rendered manifests
        run: '"$RUNNER_TEMP/am-startup-tests/bin/python" charts/plugin-access-manager/tests/test_startup_contract.py'
