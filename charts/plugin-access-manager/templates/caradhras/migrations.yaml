apiVersion: batch/v1
kind: Job
metadata:
  # Bounded to 63 chars: the Job controller stamps an auto `job-name` pod label
  # whose VALUE is the Job name; >63 chars makes spec.template.labels invalid and
  # the post-install hook fails. The release-prefixed fullname (lp-<module>-<key>)
  # is already ~63, so the "-migrations" suffix overflows without the trunc.
  name: {{ printf "%s-migrations" (include "plugin-caradhras.fullname" .) | trunc 63 | trimSuffix "-" }}
  annotations:
    helm.sh/hook: pre-upgrade, post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
    {{- with .Values.auth.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      initContainers:
      - name: wait-for-dependencies
        image: busybox
        envFrom:
        - configMapRef:
            name: {{ include "plugin-auth.fullname" . }}
        command:
          - /bin/sh
          - -c
          - >
            for svc in "$DB_HOST:$DB_PORT" "$REDIS_HOST:$REDIS_PORT";
            do
              echo "Checking $svc...";
              while ! nc -z $(echo $svc | cut -d: -f1) $(echo $svc | cut -d: -f2); do
                echo "$svc is not ready yet, waiting...";
                sleep 5;
              done;
              echo "$svc is ready!";
            done;
      containers:
        - name: migrate
          image: "{{ include "caradhras.migrationsImageRepository" . }}:{{ include "caradhras.migrationsImageTag" . }}"
          imagePullPolicy: {{ include "caradhras.migrationsImagePullPolicy" . }}
          env:
            # NOTE: caradhras-migrations (unlike the old casdoor-migrations)
            # reads the standard lib-commons POSTGRES_* env var names, not
            # DB_*. Confirmed by extracting string constants from the
            # ghcr.io/lerianstudio/caradhras-migrations:1.2.0-beta.59 binary
            # (POSTGRES_HOST/PORT/USER/PASSWORD/DB/SSLMODE) after it silently
            # defaulted to host=localhost/user=/db= in a live rehearsal. The
            # source configmap/secret keys are still named DB_* (they belong
            # to the auth component's own contract) -- only the env var NAME
            # the migrate container sees is POSTGRES_*.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_USER
            {{- include "plugin-auth.dbPasswordEnv" (dict "context" $ "envName" "POSTGRES_PASSWORD") | nindent 12 }}
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_SSLMODE
      restartPolicy: OnFailure
