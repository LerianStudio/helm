{{- if and .Values.flowker.enabled (not .Values.flowker.useExistingSecret) }}
{{- /* Multi-tenant enable is the structured knob (.Values.flowker.multiTenant.enabled),
   the same source the ConfigMap uses for MULTI_TENANT_ENABLED. */}}
{{- $mtEnabled := eq (dig "multiTenant" "enabled" false .Values.flowker | toString) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowker.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "flowker.labels" (dict "context" . "component" .Values.flowker.name "name" .Values.flowker.name) | nindent 4 }}
type: Opaque
stringData:
  {{- if not (include "flowker.licenseFileSecret" .Values.flowker) }}
  # Flowker >= 1.6 refuses to boot without a license; flowker.licenseFile replaces the key on v5 images.
  LICENSE_KEY: {{ required "flowker.secrets.LICENSE_KEY (or flowker.licenseFile.existingSecret on a lib-license-go v5 image) is required: flowker >= 1.6 does not boot without a license" .Values.flowker.secrets.LICENSE_KEY | quote }}
  {{- end }}

  # MongoDB is single-sourced. With the bundled Bitnami mongodb subchart, MONGO_PASSWORD is read
  # from <release>-mongodb (key mongodb-root-password) and MONGO_URI is assembled on the deployment
  # via $(MONGO_PASSWORD) expansion (the app is URI-only) — see the flowker.mongoEnv helper and
  # docs/helm-chart-standard.md "Single-Source Infra Secrets". MONGO_PASSWORD is written here only
  # for an EXTERNAL MongoDB without mongodb.auth.existingSecret. An explicit
  # flowker.secrets.MONGO_URI override still wins (stored below, referenced by secretKeyRef).
  {{- $mongo := .Values.mongodb | default dict }}
  {{- $mongoAuth := $mongo.auth | default dict }}
  {{- if and (not .Values.flowker.secrets.MONGO_URI) (not (and (ne (toString $mongo.enabled) "false") (not $mongo.external))) (not $mongoAuth.existingSecret) .Values.flowker.secrets.MONGO_PASSWORD }}
  MONGO_PASSWORD: {{ .Values.flowker.secrets.MONGO_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.flowker.secrets.MONGO_URI }}
  # Explicit MongoDB URI (external MongoDB). It embeds the password, so it lives here
  # and the Deployments reference it with secretKeyRef.
  MONGO_URI: {{ .Values.flowker.secrets.MONGO_URI | quote }}
  {{- end }}
  {{- if .Values.flowker.secrets.MONGO_TLS_CA_CERT }}
  MONGO_TLS_CA_CERT: {{ .Values.flowker.secrets.MONGO_TLS_CA_CERT | quote }}
  {{- end }}

  # WorkOS Tenant Manager client secret (feature #300) — required when
  # flowker.workosTmEnabled=true (all-or-none with WORKOS_TM_TOKEN_URL/CLIENT_ID).
  # TODO(review): on the useExistingSecret=true path this whole Secret is skipped,
  # so the client-secret required() is not enforced at template time (the app still
  # fail-fasts at boot) (ring-helm, 2026-07-10, Low).
  {{- if .Values.flowker.workosTmEnabled }}
  WORKOS_TM_CLIENT_SECRET: {{ required "flowker.secrets.WORKOS_TM_CLIENT_SECRET is required when flowker.workosTmEnabled=true" .Values.flowker.secrets.WORKOS_TM_CLIENT_SECRET | quote }}
  {{- end }}

  # Scheduler queue Redis password (optional). Set for an external/managed Redis, or
  # when the bundled valkey subchart has auth enabled (its ACL must match this value).
  {{- if .Values.flowker.secrets.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ .Values.flowker.secrets.REDIS_PASSWORD | quote }}
  {{- end }}

  {{- /* Optional AES-256-GCM key for the L2 token cache (feature Fase 4). Set only when TOKEN_CACHE_L2_ENABLED=true; supply via a secret manager (e.g. Vault ref), never in plaintext values. */}}
  {{- if .Values.flowker.secrets.TOKEN_CACHE_ENCRYPTION_KEY }}
  TOKEN_CACHE_ENCRYPTION_KEY: {{ .Values.flowker.secrets.TOKEN_CACHE_ENCRYPTION_KEY | quote }}
  {{- end }}

  # Access Manager permission declaration (RI) M2M credentials. Required by the
  # app only when IDP_DECLARATION_ENABLED=true; emitted only when set. With
  # flowker.useExistingSecret=true this Secret is not rendered, so the keys must
  # live in the existing Secret instead.
  {{- if .Values.flowker.secrets.IDP_M2M_CLIENT_ID }}
  IDP_M2M_CLIENT_ID: {{ .Values.flowker.secrets.IDP_M2M_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.flowker.secrets.IDP_M2M_CLIENT_SECRET }}
  IDP_M2M_CLIENT_SECRET: {{ .Values.flowker.secrets.IDP_M2M_CLIENT_SECRET | quote }}
  {{- end }}

  # Tenant Manager service API key (required when multi-tenant is enabled)
  {{- if $mtEnabled }}
  MULTI_TENANT_SERVICE_API_KEY: {{ required "flowker.secrets.MULTI_TENANT_SERVICE_API_KEY is required when MULTI_TENANT_ENABLED=true" .Values.flowker.secrets.MULTI_TENANT_SERVICE_API_KEY | quote }}
  {{- if .Values.flowker.secrets.MULTI_TENANT_REDIS_PASSWORD }}
  MULTI_TENANT_REDIS_PASSWORD: {{ .Values.flowker.secrets.MULTI_TENANT_REDIS_PASSWORD | quote }}
  {{- end }}
  {{- end }}
{{- end }}
