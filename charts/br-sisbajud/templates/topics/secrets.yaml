{{- $streamingOn := eq (include "br-sisbajud.isTrue" (include "br-sisbajud.streamingEnabledRaw" .)) "true" -}}
{{- $s := .Values.brSisbajud.secrets | default dict -}}
{{- $x := include "br-sisbajud.extraEnv" . | fromYaml -}}
{{- $keys := list -}}
{{- range $k := list "STREAMING_SASL_PASSWORD" "STREAMING_TLS_CA_CERT" -}}
{{- if and (index $s $k) (not (hasKey $x $k)) -}}
{{- $keys = append $keys $k -}}
{{- end -}}
{{- end -}}
{{- if and .Values.topics.enabled $streamingOn (not .Values.brSisbajud.useExistingSecret) $keys }}
{{- /* Dedicated PreSync Secret carrying only the broker credentials the topics Job
   needs (SASL password / CA cert from brSisbajud.secrets). PreSync hooks run
   BEFORE the main sync wave, so on a first install the app Secret does not exist
   yet. hook-weight -2 creates it before the Job (-1); BeforeHookCreation only, so
   it survives the whole PreSync phase. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-sisbajud-topics.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sisbajud-topics.labels" . | nindent 4 }}
  annotations:
    {{- include "br-sisbajud.presyncSecretAnnotations" (dict "bundled" (eq (include "br-sisbajud.redpandaEnabled" .) "true")) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := $keys }}
  {{ $k }}: {{ index $s $k | quote }}
  {{- end }}
{{- end }}
