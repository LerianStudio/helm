name: Chart Bump Merge

# Merges a routine chart bump (see chart-bump-automerge.yml) once its CI is green. Nothing waits
# on CI: this runs for a few seconds each time a check on a bot update/ branch completes, and
# only the run that finds every check done does the merge. A run that finds a check still
# pending exits; one that finds a failure sends the Severino ticket instead.
#
# Triggers: workflow_run for the repository's pull request workflows, and check_run for the
# checks of other apps (Socket, Radagast), whose completion no workflow_run reports. Both run
# from main with this repository's secrets, and nothing from the pull request is executed.
# "Lint PR" runs on pull_request_target, whose workflow_run carries no pull request; it finishes
# in seconds, long before the install test, so it is never the last check.
#
# The merge uses the push bot's token: the bot is an always-bypass actor on the main ruleset,
# and --admin is what makes gh use that bypass over the review requirement. Its push, unlike
# GITHUB_TOKEN's, triggers workflows. release.yml skips the push bot's pushes (its own release
# commits) unless the head commit carries MERGE_MARKER, which only this merge writes.

on:
  workflow_run:
    workflows:
      - Helm Install Test
      - Helm Chart Standard
      - Chart Image Refs
      - Markdown Liquid Guard
      - PR Labeling
      - Sanitizacao de dado regulado
    types: [completed]
  check_run:
    types: [completed]

permissions:
  contents: read

concurrency:
  # Queued, not cancelled: each run reads the live state, so the last one decides.
  group: chart-bump-merge-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha }}
  cancel-in-progress: false

env:
  # Checks that must exist and pass; a missing or skipped one is not green.
  REQUIRED_CHECKS: |-
    Install + upgrade (kind)
    Validate Helm chart standard
    Chart Image Refs
    Validate PR title
    Markdown Liquid Guard
  # The classification workflow's jobs, and the merge job the first version ran there, left
  # out of the evaluation.
  IGNORED_CHECKS: '["Classify chart bump","Notify Severino","Merge routine bump"]'
  REVIEW_LABEL: needs-human-review
  TICKET_LABEL: severino-ticket-sent
  # Written into the merge commit body; release.yml matches it. Change both together.
  MERGE_MARKER: "Auto-merged-by: chart-bump-automerge"
  BOT_LOGIN: lerian-studio-midaz-push-bot[bot]

jobs:
  merge:
    name: Merge routine bump
    # Filtered here so the many unrelated completions cost no runner. GitHub Actions' own
    # check runs are left out: they are already reported through workflow_run, and this
    # job's own completion would otherwise trigger it again.
    if: >-
      vars.AUTOMERGE_ENABLED == 'true'
      && ((github.event_name == 'workflow_run'
           && github.event.workflow_run.event == 'pull_request'
           && startsWith(github.event.workflow_run.head_branch, 'update/'))
          || (github.event_name == 'check_run'
              && github.event.check_run.app.slug != 'github-actions'
              && startsWith(github.event.check_run.check_suite.head_branch, 'update/')))
    runs-on: ${{ (github.event.repository.visibility == 'public' && vars.PUBLIC_RUNNERS) || vars.GENERAL_RUNNERS || vars.FALLBACK_RUNNERS }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" | jq -r \
            --arg sha "$HEAD_SHA" --arg bot "$BOT_LOGIN" \
            '[.[] | select(.state == "open" and .base.ref == "main" and .head.sha == $sha
                           and .user.login == $bot and (.head.ref | startswith("update/"))
                           and .head.repo.full_name == .base.repo.full_name)] | first | .number // empty')
          if [ -z "$number" ]; then
            echo "No open bot update pull request at ${HEAD_SHA}; nothing to do"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Classify
        id: classify
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python3 .github/scripts/chart-bump-classify.py

      # Not routine: chart-bump-automerge.yml already sent the ticket.
      - name: Evaluate checks
        id: checks
        if: steps.classify.outputs.routine == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          # The completion that triggered this run can take a moment to show in the checks API.
          sleep 10
          checks=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,bucket 2>/dev/null || true)
          if [ -z "$checks" ]; then
            echo "::warning::Could not read the checks; a later completion will try again"
            echo "verdict=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          checks=$(jq -c --argjson ignored "$IGNORED_CHECKS" 'map(select(.name as $n | $ignored | index($n) | not))' <<<"$checks")
          failed=$(jq -r 'map(select(.bucket == "fail" or .bucket == "cancel")) | .[].name' <<<"$checks")
          if [ -n "$failed" ]; then
            echo "Checks failed, leaving the bump to a human:"
            echo "$failed"
            echo "verdict=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            jq -e --arg n "$name" 'any(.[]; .name == $n and .bucket == "pass")' <<<"$checks" >/dev/null || missing+="${name}; "
          done <<<"$REQUIRED_CHECKS"
          pending=$(jq -r 'map(select(.bucket == "pending")) | .[].name' <<<"$checks" | paste -sd ',' -)
          if [ -n "$missing" ] || [ -n "$pending" ]; then
            echo "Not yet. Required not passed: ${missing:-none}. Pending: ${pending:-none}"
            echo "verdict=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "All checks green."
          echo "verdict=green" >> "$GITHUB_OUTPUT"

      - name: Send Severino review ticket
        if: steps.checks.outputs.verdict == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN_HELM }}
          BOT_MENTION: ${{ secrets.SLACK_BOT_SEVERINO }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_DEVOPS }}
        run: bash .github/scripts/severino-ticket.sh

      - name: Check the pull request is unchanged and mergeable
        id: ready
        if: steps.checks.outputs.verdict == 'green'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # mergeable is computed lazily and reads UNKNOWN for a few seconds.
          for _ in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,baseRefName,mergeable,state,labels)
            jq -e '.mergeable != "UNKNOWN"' <<<"$state" >/dev/null && break
            sleep 5
          done
          echo "$state"
          if jq -e --arg l "$REVIEW_LABEL" 'any(.labels[]; .name == $l)' <<<"$state" >/dev/null; then
            echo "Pull request carries ${REVIEW_LABEL}; leaving it to a human"
            exit 0
          fi
          if ! jq -e --arg sha "$HEAD_SHA" '.headRefOid == $sha and .baseRefName == "main" and .state == "OPEN"' <<<"$state" >/dev/null; then
            echo "Pull request moved, was retargeted or closed; a newer run decides"
            exit 0
          fi
          if ! jq -e '.mergeable == "MERGEABLE"' <<<"$state" >/dev/null; then
            echo "Pull request is not mergeable ($(jq -r .mergeable <<<"$state")); leaving it to a human"
            echo "ticket=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merge=true" >> "$GITHUB_OUTPUT"

      - name: Send Severino review ticket (not mergeable)
        if: steps.ready.outputs.ticket == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN_HELM }}
          BOT_MENTION: ${{ secrets.SLACK_BOT_SEVERINO }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_DEVOPS }}
        run: bash .github/scripts/severino-ticket.sh

      - name: Approve
        if: steps.ready.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Routine chart bump: only versions raised within the same major, CI green. Approved and merged by chart-bump-merge.yml."

      - name: Generate push bot token
        id: app-token
        if: steps.ready.outputs.merge == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private-key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}
          repositories: helm

      - name: Merge
        if: steps.ready.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        # The subject keeps the repository's default (PR title and number), which semantic-release reads.
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --admin --match-head-commit "$HEAD_SHA" --body "$MERGE_MARKER"

      # The merge was attempted and refused: in doubt, a human looks.
      - name: Send Severino review ticket (merge failed)
        if: failure() && steps.ready.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN_HELM }}
          BOT_MENTION: ${{ secrets.SLACK_BOT_SEVERINO }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_DEVOPS }}
        run: bash .github/scripts/severino-ticket.sh
