# dict/hub/vsync — DICT verification sync worker (background, no ingress)
# -----------------------------------------------------------------------------

dictHubVsync:
  # -- Ships DISABLED. The worker is a RabbitMQ queue consumer and cannot do
  # anything without secrets.RABBITMQ_URI, which has no safe default; shipping
  # it enabled meant the default render produced a Deployment that starts and
  # then does nothing, because the dependency init container skips empty URLs.
  # Enable it per environment together with the URI - templates/dict-hub-vsync
  # fails the render if it is enabled with an empty RABBITMQ_URI.
  enabled: false
  name: "dict-hub-vsync"
  description: "DICT verification sync worker"
  replicaCount: 1
  revisionHistoryLimit: 10

  image:
    repository: "ghcr.io/lerianstudio/plugin-br-pix-lerian-dict-hub-vsync"
    pullPolicy: ""
    tag: ""

  imagePullSecrets: []

  # -- Override container entrypoint (e.g., to dispatch to a specific binary
  # inside a multi-binary image). When empty, the image's ENTRYPOINT is used.
  command: []
  # -- Container args
  args: []

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  pdb:
    enabled: false
    # Set EXACTLY ONE of minAvailable / maxUnavailable (0 is honoured; an
