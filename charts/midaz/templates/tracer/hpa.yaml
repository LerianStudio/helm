{{- if and .Values.tracer.enabled .Values.tracer.autoscaling.enabled (or .Values.tracer.autoscaling.targetCPUUtilizationPercentage .Values.tracer.autoscaling.targetMemoryUtilizationPercentage) }}
{{- $migrationSyncWave := dig "deploymentSyncWave" "1" (.Values.tracer.migrations | default dict) | toString }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  {{- if and .Values.tracer.migrations.enabled $migrationSyncWave }}
  {{- /* Match the Deployment sync-wave so the HPA is applied in the same wave as
         its target (never an earlier wave): otherwise a wave-0 HPA waits on a
         target Deployment that only lands in a later wave, and the wave never
         goes healthy — a bootstrap deadlock on first install. */}}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $migrationSyncWave | quote }}
  {{- end }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "midaz-tracer.fullname" . }}
  minReplicas: {{ .Values.tracer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.tracer.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.tracer.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tracer.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.tracer.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.tracer.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
