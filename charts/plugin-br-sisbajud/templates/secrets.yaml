{{- if and .Values.sisbajud.enabled (not .Values.sisbajud.useExistingSecret) -}}
{{- $data := include "plugin-br-sisbajud.secretData" . | trim -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-sisbajud.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-sisbajud.labels" (dict "context" $ "component" "sisbajud") | nindent 4 }}
type: Opaque
{{- if $data }}
stringData:
  {{- $data | nindent 2 }}
{{- else }}
stringData: {}
{{- end }}
{{- end -}}
