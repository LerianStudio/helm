# CI-only render fixture for charts/br-sisbajud (render gate + install test).
# NOT a production example. It renders the FULL dev bundle, the same shape as
# charts/br-sisbajud/values-dev.yaml: bundled PostgreSQL, Valkey, SeaweedFS,
# OpenBao (dev mode) and Redpanda. The render gate then checks every secretKeyRef
# the chart points at the subchart Secrets, the release-name collapse, the derived
# endpoints (POSTGRES_HOST, REDIS_HOST, SEAWEEDFS_S3_ENDPOINT, VAULT_ADDR,
# STREAMING_BROKERS) and the bootstrap Jobs (buckets, Transit, migrations and
# topics as bundle-aware hooks). OpenBao/Redpanda are refused in a production-like
# environment, so this fixture runs in development. The dev root token is the
# public dev-only value from the app's config/.env.example.
global:
  env:
    name: "development"
  objectStorage:
    sta:
      bucket: "br-sta-transfer"

brSisbajud:
  vault:
    tokenRenewEnabled: false

postgresql:
  enabled: true
  external: false
valkey:
  enabled: true
  external: false
seaweedfs:
  enabled: true
openbao:
  enabled: true
  server:
    dev:
      devRootToken: "dev-root-token"
redpandaBundle:
  enabled: true
