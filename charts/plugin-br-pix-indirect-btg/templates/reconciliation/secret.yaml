apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-pix-indirect-btg-helm.fullname" . }}-reconciliation
  labels:
    {{- include "plugin-br-pix-indirect-btg-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciliation
type: Opaque
data:
  LICENSE_KEY: {{ .Values.reconciliation.secrets.LICENSE_KEY | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.reconciliation.extraSecretVars }}
  {{- toYaml .Values.reconciliation.extraSecretVars | nindent 2 }}
  {{- end }}
