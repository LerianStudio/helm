{{- $component := index .Values "bc-correios" -}}
{{- if $component.enabled }}
{{- include "bc-correios.bootGuards" . }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "bc-correios.fullname" . }}
  namespace: {{ include "global.namespace" . }}
data:
  # Application Settings
  ALLOW_INSECURE_TLS: {{ include "bc-correios.flagDefaultTrue" $component.configmap.ALLOW_INSECURE_TLS | quote }}
  {{- if not (hasKey (default dict $component.extraEnvVars) "ENV_NAME") }}
  ENV_NAME: {{ include "bc-correios.envName" . | quote }}
  {{- end }}
  APP_NAME: {{ $component.configmap.APP_NAME | default "plugin-bc-correios" | quote }}
  LOG_LEVEL: {{ $component.configmap.LOG_LEVEL | default "info" | quote }}
  SERVER_PORT: {{ $component.configmap.SERVER_PORT | default "9090" | quote }}
  SERVER_READ_TIMEOUT_SEC: {{ $component.configmap.SERVER_READ_TIMEOUT_SEC | default "30" | quote }}
  SERVER_WRITE_TIMEOUT_SEC: {{ $component.configmap.SERVER_WRITE_TIMEOUT_SEC | default "30" | quote }}
  SERVER_SHUTDOWN_TIMEOUT_SEC: {{ $component.configmap.SERVER_SHUTDOWN_TIMEOUT_SEC | default "30" | quote }}

  # CORS / Proxy
  ALLOWED_ORIGINS: {{ $component.configmap.ALLOWED_ORIGINS | default "*" | quote }}
  TRUSTED_PROXIES: {{ $component.configmap.TRUSTED_PROXIES | default "127.0.0.1,::1" | quote }}

  # PostgreSQL
  POSTGRES_HOST: {{ $component.configmap.POSTGRES_HOST | default (include "common.names.dependency.fullname" (dict "chartName" "postgresql" "chartValues" .Values.postgresql "context" .)) | quote }}
  POSTGRES_PORT: {{ $component.configmap.POSTGRES_PORT | default "5432" | quote }}
  POSTGRES_USER: {{ $component.configmap.POSTGRES_USER | default "plugin-bc-correios" | quote }}
  POSTGRES_NAME: {{ $component.configmap.POSTGRES_NAME | default "plugin-bc-correios" | quote }}
  POSTGRES_SSLMODE: {{ $component.configmap.POSTGRES_SSLMODE | default "disable" | quote }}
  POSTGRES_MAX_CONNS: {{ $component.configmap.POSTGRES_MAX_CONNS | default "50" | quote }}
  POSTGRES_MIN_CONNS: {{ $component.configmap.POSTGRES_MIN_CONNS | default "5" | quote }}

  # Streaming broker (Kafka API). The app refuses to boot with a blank STREAMING_BROKERS.
  {{- if not (or (hasKey (default dict $component.extraEnvVars) "STREAMING_BROKERS") (and $component.useExistingSecret (not $component.configmap.STREAMING_BROKERS))) }}
  STREAMING_BROKERS: {{ $component.configmap.STREAMING_BROKERS | default "" | quote }}
  {{- end }}
  STREAMING_TLS_ENABLED: {{ $component.configmap.STREAMING_TLS_ENABLED | default "false" | quote }}
  {{- with $component.configmap.STREAMING_SASL_MECHANISM }}
  STREAMING_SASL_MECHANISM: {{ . | quote }}
  {{- end }}
  {{- with $component.configmap.STREAMING_SASL_USERNAME }}
  STREAMING_SASL_USERNAME: {{ . | quote }}
  {{- end }}

  # Cache (Valkey)
  CACHE_ADDR: {{ $component.configmap.CACHE_ADDR | default (printf "%s-primary:6379" (include "common.names.dependency.fullname" (dict "chartName" "valkey" "chartValues" .Values.valkey "context" .))) | quote }}
  CACHE_TTL_SEC: {{ $component.configmap.CACHE_TTL_SEC | default "60" | quote }}

  # Object Storage (SeaweedFS S3)
  OBJECT_STORAGE_PROVIDER: {{ $component.configmap.OBJECT_STORAGE_PROVIDER | default "s3" | quote }}
  # SeaweedFS runs inline (templates/seaweedfs.yaml); its Service is named off bc-correios.fullname, not the release name.
  OBJECT_STORAGE_ENDPOINT: {{ $component.configmap.OBJECT_STORAGE_ENDPOINT | default (printf "http://%s-seaweedfs:8333" (include "bc-correios.fullname" .)) | quote }}
  OBJECT_STORAGE_BUCKET: {{ $component.configmap.OBJECT_STORAGE_BUCKET | default "bc-correios-attachments" | quote }}
  OBJECT_STORAGE_PATH_STYLE: {{ include "bc-correios.flagDefaultTrue" $component.configmap.OBJECT_STORAGE_PATH_STYLE | quote }}

  # BC Correio integration
  BC_CORREIO_ENVIRONMENT: {{ $component.configmap.BC_CORREIO_ENVIRONMENT | default "homologation" | quote }}
  BC_CORREIO_RATE_LIMIT_PER_MINUTE: {{ $component.configmap.BC_CORREIO_RATE_LIMIT_PER_MINUTE | default "50" | quote }}
  BC_CORREIO_RATE_LIMIT_PER_HOUR: {{ $component.configmap.BC_CORREIO_RATE_LIMIT_PER_HOUR | default "2700" | quote }}
  BC_CORREIO_TLS_MIN_VERSION: {{ $component.configmap.BC_CORREIO_TLS_MIN_VERSION | default "TLSv1.2" | quote }}

  # Distributed HTTP rate limiting (the limiter is off unless RATE_LIMIT_ENABLED is true)
  RATE_LIMIT_ENABLED: {{ include "bc-correios.flagDefaultTrue" $component.configmap.RATE_LIMIT_ENABLED | quote }}
  ALLOW_RATELIMIT_FAIL_OPEN: {{ $component.configmap.ALLOW_RATELIMIT_FAIL_OPEN | default "false" | quote }}

  # Plugin Auth
  PLUGIN_AUTH_ENABLED: {{ include "bc-correios.flagDefaultTrue" $component.configmap.PLUGIN_AUTH_ENABLED | quote }}
  {{- $authHost := $component.configmap.PLUGIN_AUTH_HOST | default $component.configmap.PLUGIN_AUTH_ADDRESS | default "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000" }}
  PLUGIN_AUTH_ADDRESS: {{ $authHost | quote }}
  {{- if not (or (hasKey (default dict $component.extraEnvVars) "PLUGIN_AUTH_HOST") (and $component.useExistingSecret (not $component.configmap.PLUGIN_AUTH_HOST))) }}
  PLUGIN_AUTH_HOST: {{ $authHost | quote }}
  {{- end }}

  # License
  {{- if not (and $component.useExistingSecret (not $component.configmap.LICENSE_KEY)) }}
  LICENSE_KEY: {{ $component.configmap.LICENSE_KEY | default "" | quote }}
  {{- end }}

  # AI Insights
  FEATURE_AI_INSIGHTS_ENABLED: {{ include "bc-correios.flagDefaultTrue" $component.configmap.FEATURE_AI_INSIGHTS_ENABLED | quote }}
  AI_RATE_LIMIT_PER_MIN: {{ $component.configmap.AI_RATE_LIMIT_PER_MIN | default "50" | quote }}
  AI_MAX_CONCURRENT: {{ $component.configmap.AI_MAX_CONCURRENT | default "3" | quote }}

  # Observability
  TRACING_ENABLED: {{ $component.configmap.TRACING_ENABLED | default "false" | quote }}
  METRICS_ENABLED: {{ $component.configmap.METRICS_ENABLED | default "false" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $component.configmap.OTEL_EXPORTER_OTLP_ENDPOINT | default "http://otel-collector:4317" | quote }}

  # Extra Env Vars (must be a map of key: value pairs)
  {{- range $key, $value := $component.extraEnvVars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
