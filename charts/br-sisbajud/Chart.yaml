apiVersion: v2
name: br-sisbajud-helm
description: A Helm chart for br-sisbajud — the Lerian SISBAJUD plugin (judicial
  asset blocking/unblocking integration with BACEN SISBAJUD)

type: application
annotations:
  lerian.studio/chart-type: single-service

home: https://github.com/LerianStudio/helm

sources:
  - https://github.com/LerianStudio/helm/tree/main/charts/br-sisbajud
  - https://github.com/LerianStudio/br-sisbajud

maintainers:
  - name: "Lerian Studio"
    email: "support@lerian.studio"

version: 1.1.0

# NOTE: appVersion is the default image tag for the app, the migrations Job and
# the topics Job. Override via brSisbajud.image.tag / migrations.image.tag /
# topics.image.tag when needed.
appVersion: "1.0.2"

keywords:
  - br-sisbajud
  - sisbajud
  - bacen
  - judicial
  - blocking
  - lerian

icon: https://avatars.githubusercontent.com/u/148895005?s=200&v=4

# lerian-common-helm is the shared library (env contracts, datastore/KMS/object
# storage masks). Bitnami subcharts are DECLARED (exact pins, condition-gated) so
# the chart can optionally bundle infra, but they default to disabled: on the
# target environments Postgres and Redis are EXTERNAL and pre-provisioned.
dependencies:
  - name: lerian-common-helm
    version: "2.1.2"
    repository: "oci://ghcr.io/lerianstudio"
  - name: postgresql
    version: "16.3.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: valkey
    version: "2.4.7"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled
