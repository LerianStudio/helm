{{- if and (.Values.worker).enabled (.Values.worker.serviceAccount).create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" .Values.worker.serviceAccount
      "name" (include "system-facts.worker.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "system-facts.worker.labels" .)
    ) }}
{{- end }}
