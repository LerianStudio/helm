app:
  configmap:
    BTG_API_BASE_URL: "https://example.test"
    BTG_AUTH_URL: "https://example.test/oauth"
    MIDAZ_ONBOARDING_URL: "http://midaz-onboarding:3000"
    MIDAZ_TRANSACTION_URL: "http://midaz-transaction:3000"
    # Exercises the MT-on render path: the required-value gates (_helpers.tpl,
    # templates/controlplane-migrations.yaml) and the controlplane-migrations
    # PreSync Job only render/fire when MULTI_TENANT_ENABLED is explicitly "true".
    MULTI_TENANT_ENABLED: "true"
    MULTI_TENANT_URL: "http://tenant-manager:8080"
  secrets:
    BTG_CLIENT_ID: "sample"
    BTG_CLIENT_SECRET: "sample"
    BTG_WEBHOOK_SECRET: "sample"
    INTERNAL_API_KEY: "0123456789abcdef0123456789abcdef"
    CREDENTIAL_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    MULTI_TENANT_SERVICE_API_KEY: "sample-mt-api-key"
