{{- if and .Values.api.enabled (include "plugin-br-pix-jd.rendersOwnSecret" (dict "comp" .Values.api)) }}
{{- /* Required gate for the external/disabled Postgres path. Fires only there: with
   the subchart bundled the password comes from its own Secret and this chart must
   NOT hold a second copy (the dual-secret rule the repository validator enforces).

   TRIM RULE for every comment in this chart: do NOT right-trim a comment that sits
   directly above a literal YAML line. A right-trimmed comment swallows the newline
   terminating the line above it, which silently produced "data:LICENSE_KEY: ..." —
   valid YAML, but with data as a STRING instead of a mapping, so the render passed
   and only the apply would have failed. Right-trimming is fine above an action that
   trims its own left side or pipes through nindent. */}}
{{- /* Consistency gates first: Helm's template order is not guaranteed to reach the
   ConfigMap before this file, and a contradiction like postgresql.enabled=true with
   external=true would otherwise surface as the vaguer "password is not sourced"
   instead of naming the actual mistake. Invoking them here too is idempotent. */ -}}
{{- include "plugin-br-pix-jd.consistencyGates" . }}
{{- include "plugin-br-pix-jd.externalPostgresPasswordRequired" . }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "plugin-br-pix-jd.componentFullname" (dict "root" $ "name" "api") }}
  namespace: {{ include "plugin-br-pix-jd.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "api") | nindent 4 }}
  {{- with (include "plugin-br-pix-jd.commonAnnotations" (dict "root" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- /* LICENSE_KEY is OPTIONAL here, and that is a correction, not an oversight.
     The api does NOT validate a license: lib-license-go is imported by exactly two
     production files, internal/bootstrap/config_pix.go (the config struct) and
     internal/bootstrap/worker.go. The `license` mentioned in cmd/app/main.go is the
     OpenAPI document metadata, not the license client. Only the WORKER validates —
     at startup and on every tick — so the gate lives in the worker Secret.
     Emitted when set so an api and a worker sharing one Secret still agree. */}}
  {{- with (.Values.api.secrets | default dict).LICENSE_KEY }}
  LICENSE_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- /* REDIS_PASSWORD — optional: an in-cluster Redis/Valkey with no auth is a
     legitimate topology, so an empty value is silence, not an error.
     Suppressed on the BUNDLED Valkey path for the same reason POSTGRES_PASSWORD is:
     there the credential is read from the subchart's own Secret through a discrete
     secretKeyRef (plugin-br-pix-jd.redisPasswordEnv), and leaving it here too would
     define REDIS_PASSWORD twice for one container — which the standard forbids. */}}
  {{- if not (include "plugin-br-pix-jd.valkeyRenders" .) }}
  {{- with .Values.api.secrets.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- /* POSTGRES_PASSWORD appears here ONLY on the external path. On the bundled
     path it is deliberately absent and read from the subchart's own Secret via a
     discrete secretKeyRef (see plugin-br-pix-jd.dbPasswordEnv), so the credential
     lives in exactly one place. */}}
  {{- if not (include "plugin-br-pix-jd.postgresPasswordSourced" .) }}
  {{- with (.Values.api.secrets | default dict).POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- /* PIX domain credentials (JD, Midaz, CRM, SendGrid, Twilio, indirects), emitted
     only when set. Shared with the worker through one helper so the two components
     cannot drift onto different credentials for the same downstream. */}}
  {{- with (include "plugin-br-pix-jd.domainSecrets" (dict "root" $ "comp" .Values.api)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- with (include "plugin-br-pix-jd.platformSecrets" (dict "root" $ "comp" .Values.api)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- /* Escape hatch for secret keys this chart does not model yet. */}}
  {{- range $key, $value := (.Values.api.extraSecrets | default dict) }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
