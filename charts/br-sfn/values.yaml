        memory: 128Mi
      limits:
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
      tls: []
    nodeSelector: {}
    affinity: {}
    tolerations: []
  dict:
    replicaCount: 1
    revisionHistoryLimit: 10
    image:
      repository: ghcr.io/lerianstudio/br-spi-dict
      tag: ""
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    podAnnotations: {}
    deploymentUpdate:
      type: RollingUpdate
      maxSurge: 1
      maxUnavailable: 0
    service:
      type: ClusterIP
      port: 9801
    configmap: {}
    secrets: {}
    extraEnvVars: []
    extraVolumes: []
    extraVolumeMounts: []
    livenessProbe: {}
    readinessProbe: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
      tls: []
    nodeSelector: {}
    affinity: {}
    tolerations: []
  brcode:
    replicaCount: 1
    revisionHistoryLimit: 10
    image:
      repository: ghcr.io/lerianstudio/br-spi-brcode
      tag: ""
      pullPolicy: IfNotPresent
    imagePullSecrets: []
    podAnnotations: {}
    deploymentUpdate:
      type: RollingUpdate
      maxSurge: 1
      maxUnavailable: 0
    service:
      type: ClusterIP
      port: 9802
    configmap: {}
    secrets: {}
    extraEnvVars: []
    extraVolumes: []
    extraVolumeMounts: []
    livenessProbe: {}
    readinessProbe: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
    pdb:
      enabled: false
      minAvailable: 1
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
