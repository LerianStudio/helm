# Since app 3.0.2 the service refuses to boot with ENV_NAME=production (the
# chart default) unless LICENSE_KEY is set:
#   ASSERTION FAILED: LICENSE_KEY is required in production
# kind has no license, so the gate runs the workload as a non-production
# environment. ENV_NAME goes through the global mask (global.env.name), the
# same path an operator uses; the production license guard itself is the
# application's contract, not the chart's.
global:
  env:
    name: "development"

# Since app 3.1.0 a non-empty encryption key must be 64 hex characters (AES-256),
# and the render values' "sample" refuses boot. Test-only keys, never a real secret.
# The bundled Postgres serves no TLS, and the chart default sslmode is "require".
bankTransfer:
  configmap:
    POSTGRES_SSLMODE: "disable"
  secrets:
    JD_INCOMING_RAW_XML_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    RECIPIENT_DETAILS_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
