{{- /* Template-owned ConfigMap: every key the application reads is listed below,
   generated from one spec together with values.schema.json's allowlist. Each key
   is either a chart default (kept for behavior parity; app.configmap.<KEY>
   overrides it) or rendered only when the overlay sets it, so the application's
   own default applies otherwise. A null in an overlay counts as unset. */ -}}
{{- $cm := dict -}}
{{- range $k, $v := (.Values.app.configmap | default dict) -}}
{{- if not (kindIs "invalid" $v) }}{{- $_ := set $cm $k $v -}}{{- end -}}
{{- end -}}
{{- $gv := "lerian-common.globalValue" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plugin-br-payments.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 4 }}
data:
  # ====================================================================
  # APPLICATION
  # ====================================================================
  ENV_NAME: {{ include $gv (dict "context" $ "configmap" $cm "block" "env" "field" "name" "nativeKey" "ENV_NAME" "default" "production") | quote }}
  LOG_LEVEL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "LOG_LEVEL" "default" "info") | quote }}
  DEPLOYMENT_MODE: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "DEPLOYMENT_MODE" "default" "saas") | quote }}
  SERVICE_TYPE: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "SERVICE_TYPE" "default" "both") | quote }}
  SWAGGER_ENABLED: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "SWAGGER_ENABLED" "default" "false") | quote }}
  VERSION: {{ include "plugin-br-payments.defaultTag" . | quote }}
  ALLOW_INSECURE_TLS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "ALLOW_INSECURE_TLS" "default" "true") | quote }}
  # ====================================================================
  # HTTP SERVER
  # ====================================================================
  SERVER_ADDRESS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "SERVER_ADDRESS" "default" "0.0.0.0:8080") | quote }}
  HTTP_BODY_LIMIT_BYTES: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "HTTP_BODY_LIMIT_BYTES" "default" "104857600") | quote }}
  {{- if hasKey $cm "HTTP_READ_BUFFER_SIZE" }}
  HTTP_READ_BUFFER_SIZE: {{ index $cm "HTTP_READ_BUFFER_SIZE" | quote }}
  {{- end }}
  TLS_TERMINATED_UPSTREAM: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "TLS_TERMINATED_UPSTREAM" "default" "true") | quote }}
  {{- if hasKey $cm "SERVER_TLS_CERT_FILE" }}
  SERVER_TLS_CERT_FILE: {{ index $cm "SERVER_TLS_CERT_FILE" | quote }}
  {{- end }}
  {{- if hasKey $cm "SERVER_TLS_KEY_FILE" }}
  SERVER_TLS_KEY_FILE: {{ index $cm "SERVER_TLS_KEY_FILE" | quote }}
  {{- end }}
  INTERNAL_WORKER_URL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "INTERNAL_WORKER_URL" "default" "") | quote }}
  # ====================================================================
  # CORS
  # ====================================================================
  ACCESS_CONTROL_ALLOW_ORIGIN: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "ACCESS_CONTROL_ALLOW_ORIGIN" "default" "*") | quote }}
  ACCESS_CONTROL_ALLOW_METHODS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "ACCESS_CONTROL_ALLOW_METHODS" "default" "GET,POST,PUT,PATCH,DELETE,OPTIONS") | quote }}
  ACCESS_CONTROL_ALLOW_HEADERS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "ACCESS_CONTROL_ALLOW_HEADERS" "default" "Origin,Content-Type,Accept,Authorization,X-Request-ID") | quote }}
  ACCESS_CONTROL_EXPOSE_HEADERS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "ACCESS_CONTROL_EXPOSE_HEADERS" "default" "") | quote }}
  ACCESS_CONTROL_ALLOW_CREDENTIALS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "ACCESS_CONTROL_ALLOW_CREDENTIALS" "default" "false") | quote }}
  # ====================================================================
  # RATE LIMITING
  # ====================================================================
  RATE_LIMIT_ENABLED: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "RATE_LIMIT_ENABLED" "default" "true") | quote }}
  RATE_LIMIT_MAX: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "RATE_LIMIT_MAX" "default" "500") | quote }}
  RATE_LIMIT_WINDOW_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "RATE_LIMIT_WINDOW_SEC" "default" "60") | quote }}
  AGGRESSIVE_RATE_LIMIT_MAX: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "AGGRESSIVE_RATE_LIMIT_MAX" "default" "100") | quote }}
  AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "AGGRESSIVE_RATE_LIMIT_WINDOW_SEC" "default" "60") | quote }}
  RELAXED_RATE_LIMIT_MAX: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "RELAXED_RATE_LIMIT_MAX" "default" "1000") | quote }}
  RELAXED_RATE_LIMIT_WINDOW_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "RELAXED_RATE_LIMIT_WINDOW_SEC" "default" "60") | quote }}
  {{- /* Bill consult route: in-process limit per (tenantId, sub). Not the
     AGGRESSIVE_* tier, and RATE_LIMIT_ENABLED does not turn it off. No chart
     default: rendered only when set, so the app default (100 per 60s) applies. */}}
  {{- if hasKey $cm "CONSULT_RATE_LIMIT_MAX" }}
  CONSULT_RATE_LIMIT_MAX: {{ index $cm "CONSULT_RATE_LIMIT_MAX" | quote }}
  {{- end }}
  {{- if hasKey $cm "CONSULT_RATE_LIMIT_WINDOW_SEC" }}
  CONSULT_RATE_LIMIT_WINDOW_SEC: {{ index $cm "CONSULT_RATE_LIMIT_WINDOW_SEC" | quote }}
  {{- end }}
  # ====================================================================
  # MULTI-TENANCY
  # ====================================================================
  {{- with (include $gv (dict "context" $ "configmap" $cm "block" "multiTenant" "field" "enabled" "nativeKey" "MULTI_TENANT_ENABLED" "default" "")) }}
  MULTI_TENANT_ENABLED: {{ . | quote }}
  {{- end }}
  MULTI_TENANT_URL: {{ include $gv (dict "context" $ "configmap" $cm "block" "multiTenant" "field" "url" "nativeKey" "MULTI_TENANT_URL" "default" "") | quote }}
  MULTI_TENANT_SERVICE_NAME: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_SERVICE_NAME" "default" "plugin-br-payments") | quote }}
  MULTI_TENANT_POSTGRES_MODULE: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_POSTGRES_MODULE" "default" "") | quote }}
  MULTI_TENANT_ALLOW_INSECURE_HTTP: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_ALLOW_INSECURE_HTTP" "default" "false") | quote }}
  MULTI_TENANT_TIMEOUT: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_TIMEOUT" "default" "10") | quote }}
  MULTI_TENANT_CACHE_TTL_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_CACHE_TTL_SEC" "default" "3600") | quote }}
  MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD" "default" "5") | quote }}
  MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC" "default" "30") | quote }}
  MULTI_TENANT_MAX_TENANT_POOLS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_MAX_TENANT_POOLS" "default" "100") | quote }}
  MULTI_TENANT_CREDENTIAL_SOURCE: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MULTI_TENANT_CREDENTIAL_SOURCE" "default" "vault") | quote }}
  {{- if hasKey $cm "MULTI_TENANT_DISCOVERY_INTERVAL_SEC" }}
  MULTI_TENANT_DISCOVERY_INTERVAL_SEC: {{ index $cm "MULTI_TENANT_DISCOVERY_INTERVAL_SEC" | quote }}
  {{- end }}
  {{- if hasKey $cm "MULTI_TENANT_IDLE_TIMEOUT_SEC" }}
  MULTI_TENANT_IDLE_TIMEOUT_SEC: {{ index $cm "MULTI_TENANT_IDLE_TIMEOUT_SEC" | quote }}
  {{- end }}
  {{- if hasKey $cm "AWS_REGION" }}
  AWS_REGION: {{ index $cm "AWS_REGION" | quote }}
  {{- end }}
  # ====================================================================
  # POSTGRESQL
  # ====================================================================
  POSTGRES_HOST: {{ include "plugin-br-payments.pgHost" . | quote }}
  POSTGRES_PORT: {{ include "plugin-br-payments.pgPort" . | quote }}
  POSTGRES_USER: {{ include "plugin-br-payments.pgUser" . | quote }}
  POSTGRES_DB: {{ include "plugin-br-payments.pgDb" . | quote }}
  POSTGRES_SSLMODE: {{ include "plugin-br-payments.pgSsl" . | quote }}
  POSTGRES_MAX_IDLE_CONNS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "POSTGRES_MAX_IDLE_CONNS" "default" "15") | quote }}
  POSTGRES_MAX_OPEN_CONNS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "POSTGRES_MAX_OPEN_CONNS" "default" "25") | quote }}
  POSTGRES_CONN_MAX_LIFETIME_MINS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "POSTGRES_CONN_MAX_LIFETIME_MINS" "default" "30") | quote }}
  POSTGRES_CONN_MAX_IDLE_TIME_MINS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "POSTGRES_CONN_MAX_IDLE_TIME_MINS" "default" "5") | quote }}
  POSTGRES_CONNECT_TIMEOUT_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "POSTGRES_CONNECT_TIMEOUT_SEC" "default" "10") | quote }}
  {{- with (include "plugin-br-payments.pg" (dict "root" $ "field" "replicaHost" "nativeKey" "POSTGRES_REPLICA_HOST" "default" "")) }}
  POSTGRES_REPLICA_HOST: {{ . | quote }}
  {{- end }}
  {{- if hasKey $cm "POSTGRES_REPLICA_PORT" }}
  POSTGRES_REPLICA_PORT: {{ index $cm "POSTGRES_REPLICA_PORT" | quote }}
  {{- end }}
  {{- if hasKey $cm "POSTGRES_REPLICA_USER" }}
  POSTGRES_REPLICA_USER: {{ index $cm "POSTGRES_REPLICA_USER" | quote }}
  {{- end }}
  {{- if hasKey $cm "POSTGRES_REPLICA_DB" }}
  POSTGRES_REPLICA_DB: {{ index $cm "POSTGRES_REPLICA_DB" | quote }}
  {{- end }}
  {{- if hasKey $cm "POSTGRES_REPLICA_SSLMODE" }}
  POSTGRES_REPLICA_SSLMODE: {{ index $cm "POSTGRES_REPLICA_SSLMODE" | quote }}
  {{- end }}
  INFRA_CONNECT_TIMEOUT_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "INFRA_CONNECT_TIMEOUT_SEC" "default" "30") | quote }}
  MIGRATION_TIMEOUT_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MIGRATION_TIMEOUT_SEC" "default" "300") | quote }}
  MIGRATION_LOCK_TIMEOUT_MS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MIGRATION_LOCK_TIMEOUT_MS" "default" "10000") | quote }}
  DB_METRICS_INTERVAL_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "DB_METRICS_INTERVAL_SEC" "default" "15") | quote }}
  IDEMPOTENCY_RECORD_TTL_HOURS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "IDEMPOTENCY_RECORD_TTL_HOURS" "default" "48") | quote }}
  # ====================================================================
  # OUTBOX
  # ====================================================================
  OUTBOX_DISPATCH_INTERVAL_SEC: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_DISPATCH_INTERVAL_SEC" "default" "2") | quote }}
  OUTBOX_BATCH_SIZE: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_BATCH_SIZE" "default" "50") | quote }}
  OUTBOX_PUBLISH_BACKOFF_MS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_PUBLISH_BACKOFF_MS" "default" "200") | quote }}
  OUTBOX_MAX_DISPATCH_ATTEMPTS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_MAX_DISPATCH_ATTEMPTS" "default" "10") | quote }}
  OUTBOX_MAX_FAILED_PER_BATCH: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_MAX_FAILED_PER_BATCH" "default" "25") | quote }}
  OUTBOX_INCLUDE_TENANT_METRICS: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_INCLUDE_TENANT_METRICS" "default" "false") | quote }}
  OUTBOX_ALLOW_EMPTY_TENANT: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OUTBOX_ALLOW_EMPTY_TENANT" "default" "true") | quote }}
  {{- if hasKey $cm "OUTBOX_PRIORITY_EVENT_TYPES" }}
  OUTBOX_PRIORITY_EVENT_TYPES: {{ index $cm "OUTBOX_PRIORITY_EVENT_TYPES" | quote }}
  {{- end }}
  {{- if hasKey $cm "OUTBOX_PUBLISH_MAX_ATTEMPTS" }}
  OUTBOX_PUBLISH_MAX_ATTEMPTS: {{ index $cm "OUTBOX_PUBLISH_MAX_ATTEMPTS" | quote }}
  {{- end }}
  {{- if hasKey $cm "OUTBOX_RETRY_WINDOW_SEC" }}
  OUTBOX_RETRY_WINDOW_SEC: {{ index $cm "OUTBOX_RETRY_WINDOW_SEC" | quote }}
  {{- end }}
  {{- if hasKey $cm "OUTBOX_PROCESSING_TIMEOUT_SEC" }}
  OUTBOX_PROCESSING_TIMEOUT_SEC: {{ index $cm "OUTBOX_PROCESSING_TIMEOUT_SEC" | quote }}
  {{- end }}
  # ====================================================================
  # AUTHENTICATION (plugin-access-manager)
  # ====================================================================
  PLUGIN_AUTH_ENABLED: {{ include $gv (dict "context" $ "configmap" $cm "block" "auth" "field" "enabled" "nativeKey" "PLUGIN_AUTH_ENABLED" "default" "true") | quote }}
  PLUGIN_AUTH_ADDRESS: {{ include $gv (dict "context" $ "configmap" $cm "block" "auth" "field" "host" "nativeKey" "PLUGIN_AUTH_ADDRESS" "default" "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000") | quote }}
  # ====================================================================
  # PROVIDER (BTG)
  # ====================================================================
  BTG_API_BASE_URL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "BTG_API_BASE_URL" "default" "") | quote }}
  BTG_AUTH_URL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "BTG_AUTH_URL" "default" "") | quote }}
  BTG_COMMON_BASE_URL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "BTG_COMMON_BASE_URL" "default" "") | quote }}
  BTG_TOKEN_REFRESH_INTERVAL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "BTG_TOKEN_REFRESH_INTERVAL" "default" "4m") | quote }}
  {{- if hasKey $cm "BTG_HTTP_TIMEOUT" }}
  BTG_HTTP_TIMEOUT: {{ index $cm "BTG_HTTP_TIMEOUT" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_CREDENTIAL_SYNC_INTERVAL" }}
  BTG_CREDENTIAL_SYNC_INTERVAL: {{ index $cm "BTG_CREDENTIAL_SYNC_INTERVAL" | quote }}
  {{- end }}
  {{- if hasKey $cm "PROVIDER_CREDENTIAL_CLAIM_LEASE" }}
  PROVIDER_CREDENTIAL_CLAIM_LEASE: {{ index $cm "PROVIDER_CREDENTIAL_CLAIM_LEASE" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_MTLS_OUTBOUND_ENABLED" }}
  BTG_MTLS_OUTBOUND_ENABLED: {{ index $cm "BTG_MTLS_OUTBOUND_ENABLED" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_MTLS_OUTBOUND_CERT_FILE" }}
  BTG_MTLS_OUTBOUND_CERT_FILE: {{ index $cm "BTG_MTLS_OUTBOUND_CERT_FILE" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_MTLS_OUTBOUND_KEY_FILE" }}
  BTG_MTLS_OUTBOUND_KEY_FILE: {{ index $cm "BTG_MTLS_OUTBOUND_KEY_FILE" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_MTLS_OUTBOUND_CA_FILE" }}
  BTG_MTLS_OUTBOUND_CA_FILE: {{ index $cm "BTG_MTLS_OUTBOUND_CA_FILE" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_MTLS_INBOUND_ENABLED" }}
  BTG_MTLS_INBOUND_ENABLED: {{ index $cm "BTG_MTLS_INBOUND_ENABLED" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_MTLS_INBOUND_CERT_HEADER" }}
  BTG_MTLS_INBOUND_CERT_HEADER: {{ index $cm "BTG_MTLS_INBOUND_CERT_HEADER" | quote }}
  {{- end }}
  {{- if hasKey $cm "BTG_WEBHOOK_CERTIFICATE_URL" }}
  BTG_WEBHOOK_CERTIFICATE_URL: {{ index $cm "BTG_WEBHOOK_CERTIFICATE_URL" | quote }}
  {{- end }}
  # ====================================================================
  # MIDAZ
  # ====================================================================
  MIDAZ_LEDGER_URL: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "MIDAZ_LEDGER_URL" "default" "") | quote }}
  {{- if hasKey $cm "MIDAZ_CRM_URL" }}
  MIDAZ_CRM_URL: {{ index $cm "MIDAZ_CRM_URL" | quote }}
  {{- end }}
  {{- if hasKey $cm "MIDAZ_AUTH_ENABLED" }}
  MIDAZ_AUTH_ENABLED: {{ index $cm "MIDAZ_AUTH_ENABLED" | quote }}
  {{- end }}
  {{- if hasKey $cm "MIDAZ_ALLOW_INSECURE_HTTP" }}
  MIDAZ_ALLOW_INSECURE_HTTP: {{ index $cm "MIDAZ_ALLOW_INSECURE_HTTP" | quote }}
  {{- end }}
  {{- if hasKey $cm "MIDAZ_DEFAULT_ORG_ID" }}
  MIDAZ_DEFAULT_ORG_ID: {{ index $cm "MIDAZ_DEFAULT_ORG_ID" | quote }}
  {{- end }}
  {{- if hasKey $cm "MIDAZ_DEFAULT_LEDGER_ID" }}
  MIDAZ_DEFAULT_LEDGER_ID: {{ index $cm "MIDAZ_DEFAULT_LEDGER_ID" | quote }}
  {{- end }}
  {{- if hasKey $cm "M2M_CRM_TARGET_SERVICE" }}
  M2M_CRM_TARGET_SERVICE: {{ index $cm "M2M_CRM_TARGET_SERVICE" | quote }}
  {{- end }}
  {{- if hasKey $cm "ORGANIZATION_IDS" }}
  ORGANIZATION_IDS: {{ index $cm "ORGANIZATION_IDS" | quote }}
  {{- end }}
  {{- if hasKey $cm "ACCOUNT_VALIDATION_DISABLED" }}
  ACCOUNT_VALIDATION_DISABLED: {{ index $cm "ACCOUNT_VALIDATION_DISABLED" | quote }}
  {{- end }}
  {{- if hasKey $cm "ACCOUNTING_ROUTES_ENABLED" }}
  ACCOUNTING_ROUTES_ENABLED: {{ index $cm "ACCOUNTING_ROUTES_ENABLED" | quote }}
  {{- end }}
  {{- if hasKey $cm "ACCOUNTING_ROUTES_CACHE_TTL_SEC" }}
  ACCOUNTING_ROUTES_CACHE_TTL_SEC: {{ index $cm "ACCOUNTING_ROUTES_CACHE_TTL_SEC" | quote }}
  {{- end }}
  {{- if hasKey $cm "ACCOUNTING_ROUTES_FETCH_TIMEOUT_SEC" }}
  ACCOUNTING_ROUTES_FETCH_TIMEOUT_SEC: {{ index $cm "ACCOUNTING_ROUTES_FETCH_TIMEOUT_SEC" | quote }}
  {{- end }}
  # ====================================================================
  # RECONCILIATION
  # ====================================================================
  {{- if hasKey $cm "RECONCILIATION_INTERVAL" }}
  RECONCILIATION_INTERVAL: {{ index $cm "RECONCILIATION_INTERVAL" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_DELAY_MS" }}
  RECONCILIATION_DELAY_MS: {{ index $cm "RECONCILIATION_DELAY_MS" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_MAX_BOLETOS_PER_CYCLE" }}
  RECONCILIATION_MAX_BOLETOS_PER_CYCLE: {{ index $cm "RECONCILIATION_MAX_BOLETOS_PER_CYCLE" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_MAX_MONEY_ITEMS_PER_CYCLE" }}
  RECONCILIATION_MAX_MONEY_ITEMS_PER_CYCLE: {{ index $cm "RECONCILIATION_MAX_MONEY_ITEMS_PER_CYCLE" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_BOLETO_GRACE_PERIOD" }}
  RECONCILIATION_BOLETO_GRACE_PERIOD: {{ index $cm "RECONCILIATION_BOLETO_GRACE_PERIOD" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_PAYMENT_GRACE_PERIOD" }}
  RECONCILIATION_PAYMENT_GRACE_PERIOD: {{ index $cm "RECONCILIATION_PAYMENT_GRACE_PERIOD" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_WEBHOOK_CLAIM_LEASE" }}
  RECONCILIATION_WEBHOOK_CLAIM_LEASE: {{ index $cm "RECONCILIATION_WEBHOOK_CLAIM_LEASE" | quote }}
  {{- end }}
  {{- if hasKey $cm "RECONCILIATION_WEBHOOK_SILENCE_WINDOW" }}
  RECONCILIATION_WEBHOOK_SILENCE_WINDOW: {{ index $cm "RECONCILIATION_WEBHOOK_SILENCE_WINDOW" | quote }}
  {{- end }}
  # ====================================================================
  # WEBHOOKS
  # ====================================================================
  {{- if hasKey $cm "WEBHOOK_PUBLIC_BASE_URL" }}
  WEBHOOK_PUBLIC_BASE_URL: {{ index $cm "WEBHOOK_PUBLIC_BASE_URL" | quote }}
  {{- end }}
  {{- if hasKey $cm "WEBHOOK_SKIP_URL_VALIDATION" }}
  WEBHOOK_SKIP_URL_VALIDATION: {{ index $cm "WEBHOOK_SKIP_URL_VALIDATION" | quote }}
  {{- end }}
  {{- if hasKey $cm "WEBHOOK_CONNECTION_GRACE_WINDOW_SEC" }}
  WEBHOOK_CONNECTION_GRACE_WINDOW_SEC: {{ index $cm "WEBHOOK_CONNECTION_GRACE_WINDOW_SEC" | quote }}
  {{- end }}
  {{- if hasKey $cm "WEBHOOK_DISPATCHER_INTERVAL" }}
  WEBHOOK_DISPATCHER_INTERVAL: {{ index $cm "WEBHOOK_DISPATCHER_INTERVAL" | quote }}
  {{- end }}
  {{- if hasKey $cm "WEBHOOK_DISPATCHER_BATCH_SIZE" }}
  WEBHOOK_DISPATCHER_BATCH_SIZE: {{ index $cm "WEBHOOK_DISPATCHER_BATCH_SIZE" | quote }}
  {{- end }}
  {{- if hasKey $cm "WEBHOOK_DISPATCHER_CLAIM_LEASE" }}
  WEBHOOK_DISPATCHER_CLAIM_LEASE: {{ index $cm "WEBHOOK_DISPATCHER_CLAIM_LEASE" | quote }}
  {{- end }}
  {{- if hasKey $cm "WEBHOOK_CONSUMER_INTERVAL" }}
  WEBHOOK_CONSUMER_INTERVAL: {{ index $cm "WEBHOOK_CONSUMER_INTERVAL" | quote }}
  {{- end }}
  # ====================================================================
  # TELEMETRY
  # ====================================================================
  ENABLE_TELEMETRY: {{ include $gv (dict "context" $ "configmap" $cm "block" "observability" "field" "enabled" "nativeKey" "ENABLE_TELEMETRY" "default" "true") | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include $gv (dict "context" $ "configmap" $cm "block" "observability" "field" "otlpEndpoint" "nativeKey" "OTEL_EXPORTER_OTLP_ENDPOINT" "default" "") | quote }}
  OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT: {{ include $gv (dict "context" $ "configmap" $cm "block" "observability" "field" "deploymentEnvironment" "nativeKey" "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" "default" "production") | quote }}
  OTEL_LIBRARY_NAME: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OTEL_LIBRARY_NAME" "default" "github.com/LerianStudio/plugin-br-payments") | quote }}
  OTEL_RESOURCE_SERVICE_NAME: {{ include "plugin-br-payments.cfg" (dict "root" $ "key" "OTEL_RESOURCE_SERVICE_NAME" "default" "plugin-br-payments") | quote }}
  OTEL_RESOURCE_SERVICE_VERSION: {{ include "plugin-br-payments.defaultTag" . | quote }}
  # ====================================================================
  # EXTRA ENV (escape hatch: app.extraEnvVars, rendered verbatim)
  # ====================================================================
  {{- with .Values.app.extraEnvVars }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
