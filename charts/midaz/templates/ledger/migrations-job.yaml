{{- if and .Values.ledger.enabled (include "midaz.ledgerMigrationsEnabled" .) }}
{{- /*
Ledger schema migration runner (onboarding + transaction).

midaz v4 removed in-process migration from the ledger, so the unified binary
boots against an already-migrated schema. The release publishes a dedicated
`midaz-ledger-migrations` image (FROM migrate/migrate) whose entrypoint applies
both migration sets from DB_ONBOARDING_* / DB_TRANSACTION_* and exits.

Rendered automatically for 4.x ledger tags and skipped for 3.x, which still
migrates at startup; `ledger.migrations.enabled` pins either behaviour. The Job
name carries the migration image tag because a Job spec is immutable — a stable
name would silently skip the run on upgrade. Re-running is safe: golang-migrate
tracks progress in the schema_migrations table.
*/}}
{{- $migrations := .Values.ledger.migrations }}
{{- $cm := .Values.ledger.configmap | default dict }}
{{- $pg := .Values.postgresql | default dict }}
{{- $pgAuth := $pg.auth | default dict }}
{{- $pgInternal := or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
{{- $secretName := ternary .Values.ledger.existingSecretName (include "midaz-ledger.fullname" .) .Values.ledger.useExistingSecret }}
{{- $dbHost := $cm.DB_ONBOARDING_HOST | default "midaz-postgresql-primary" }}
{{- $dbPort := $cm.DB_ONBOARDING_PORT | default "5432" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "midaz-ledger.migrationsFullname" . }}
  labels:
    {{- include "midaz.labels" (dict "context" . "component" .Values.ledger.name "name" .Values.ledger.name ) | nindent 4 }}
  {{- with $migrations.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ $migrations.backoffLimit | default 6 }}
  activeDeadlineSeconds: {{ $migrations.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ $migrations.ttlSecondsAfterFinished | default 259200 }}
  template:
    metadata:
      labels:
        {{- include "midaz.labels" (dict "context" . "component" .Values.ledger.name "name" .Values.ledger.name ) | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.ledger.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.ledger.podSecurityContext | nindent 8 }}
      {{- if $migrations.waitForPostgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ $migrations.waitForPostgres.image.repository }}:{{ $migrations.waitForPostgres.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >
              TIMEOUT={{ $migrations.activeDeadlineSeconds | default 600 }};
              ELAPSED=0;
              echo "Checking {{ $dbHost }}:{{ $dbPort }}...";
              while ! nc -z {{ $dbHost }} {{ $dbPort }}; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for {{ $dbHost }}:{{ $dbPort }} after ${TIMEOUT}s";
                  exit 1;
                fi;
                echo "{{ $dbHost }}:{{ $dbPort }} is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
                sleep 5;
                ELAPSED=$((ELAPSED + 5));
              done;
              echo "{{ $dbHost }}:{{ $dbPort }} is ready!";
          securityContext:
            {{- toYaml .Values.ledger.securityContext | nindent 12 }}
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
      {{- end }}
      containers:
        - name: migrations
          image: {{ $migrations.image.repository }}:{{ include "midaz-ledger.migrationsTag" . }}
          imagePullPolicy: {{ $migrations.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.ledger.securityContext | nindent 12 }}
          env:
            - name: DB_ONBOARDING_HOST
              value: {{ $dbHost | quote }}
            - name: DB_ONBOARDING_PORT
              value: {{ $dbPort | quote }}
            - name: DB_ONBOARDING_NAME
              value: {{ $cm.DB_ONBOARDING_NAME | default "onboarding" | quote }}
            - name: DB_ONBOARDING_USER
              value: {{ $cm.DB_ONBOARDING_USER | default "midaz" | quote }}
            - name: DB_ONBOARDING_SSLMODE
              value: {{ $cm.DB_ONBOARDING_SSLMODE | default "disable" | quote }}
            - name: DB_TRANSACTION_HOST
              value: {{ $cm.DB_TRANSACTION_HOST | default $dbHost | quote }}
            - name: DB_TRANSACTION_PORT
              value: {{ $cm.DB_TRANSACTION_PORT | default "5432" | quote }}
            - name: DB_TRANSACTION_NAME
              value: {{ $cm.DB_TRANSACTION_NAME | default "transaction" | quote }}
            - name: DB_TRANSACTION_USER
              value: {{ $cm.DB_TRANSACTION_USER | default "midaz" | quote }}
            - name: DB_TRANSACTION_SSLMODE
              value: {{ $cm.DB_TRANSACTION_SSLMODE | default "disable" | quote }}
            {{/* Same single-source rule as the ledger Deployment: the bundled
                 PostgreSQL Secret when internal, the ledger Secret when external. */}}
            {{- if $pgInternal }}
            {{- include "midaz.infraSecretRef" (dict "context" $ "subchart" "postgresql" "key" "password" "envName" "DB_ONBOARDING_PASSWORD") | nindent 12 }}
            {{- include "midaz.infraSecretRef" (dict "context" $ "subchart" "postgresql" "key" "password" "envName" "DB_TRANSACTION_PASSWORD") | nindent 12 }}
            {{- else }}
            {{- if or .Values.ledger.useExistingSecret .Values.ledger.secrets.DB_ONBOARDING_PASSWORD }}
            - name: DB_ONBOARDING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_ONBOARDING_PASSWORD
            {{- end }}
            {{- if or .Values.ledger.useExistingSecret .Values.ledger.secrets.DB_TRANSACTION_PASSWORD }}
            - name: DB_TRANSACTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_TRANSACTION_PASSWORD
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml $migrations.resources | nindent 12 }}
      {{- with .Values.ledger.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ledger.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ledger.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
