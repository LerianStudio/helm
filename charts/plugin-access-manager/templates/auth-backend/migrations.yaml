apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "plugin-auth-backend.fullname" . }}-migrations
  annotations:
    # Migration timing is asymmetric on purpose:
    #  - post-install: on first install the Job reads the plugin-auth ConfigMap
    #    (DB_*/POSTGRES_* via configMapKeyRef) and needs the ghcr-credential
    #    imagePullSecret, which the main release only creates during this install —
    #    a pre-install hook would fail (they don't exist yet).
    #  - pre-upgrade: on upgrade those deps already exist, and the new schema MUST
    #    be applied BEFORE the new app rolls (post-upgrade would boot the new
    #    backend against the old schema and break).
    # Also valid for the bundled auth-database case (DB exists by install-time post
    # hook / already exists on upgrade).
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    # hook-succeeded removes the completed Job so a stale (immutable) Job never
    # blocks the next sync.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- /* Deploy-tool annotations (e.g. argocd.argoproj.io/hook: PreSync) are NOT
           hardcoded here — ArgoCD already auto-converts the helm.sh/hook above.
           Set auth.backend.migrations.annotations to add/override per environment. */}}
    {{- with .Values.auth.backend.migrations.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  template:
    spec:
    {{- with .Values.auth.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      initContainers:
      - name: wait-for-dependencies
        image: busybox
        envFrom:
        - configMapRef:
            name: {{ include "plugin-auth.fullname" . }}
        command:
          - /bin/sh
          - -c
          - >
            for svc in "$DB_HOST:$DB_PORT" "$REDIS_HOST:$REDIS_PORT";
            do
              echo "Checking $svc...";
              while ! nc -z $(echo $svc | cut -d: -f1) $(echo $svc | cut -d: -f2); do
                echo "$svc is not ready yet, waiting...";
                sleep 5;
              done;
              echo "$svc is ready!";
            done;
      containers:
        - name: migrate
          {{- $migrationImage := .Values.auth.backend.migrations.image -}}
          {{- if kindIs "string" $migrationImage }}
          image: {{ $migrationImage | quote }}
          imagePullPolicy: Always
          {{- else }}
          image: "{{ $migrationImage.repository | default "ghcr.io/lerianstudio/casdoor-migrations" }}:{{ $migrationImage.tag | default "latest" }}"
          imagePullPolicy: {{ $migrationImage.pullPolicy | default "Always" }}
          {{- end }}
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_USER
            {{- include "plugin-auth.dbPasswordEnv" (dict "context" $ "envName" "DB_PASS") | nindent 12 }}
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_SSLMODE
            # Caradhras cmd/postgres-migrations reads POSTGRES_* (migration/dsn.go),
            # not the casdoor-style DB_*. Provide both so the Job works with the
            # legacy caradhras-migrations (DB_*) and the new
            # caradhras-postgres-migrations (POSTGRES_*). Same configmap/secret sources.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_USER
            {{- include "plugin-auth.dbPasswordEnv" (dict "context" $ "envName" "POSTGRES_PASSWORD") | nindent 12 }}
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plugin-auth.fullname" . }}
                  key: DB_SSLMODE
      restartPolicy: OnFailure