{{- /* The bundled broker imports this at every boot; its only login is the app user with secrets.RABBITMQ_DEFAULT_PASS. */ -}}
{{- if .Values.rabbitmq.enabled }}
{{- if or .Values.manager.useExistingSecret .Values.worker.useExistingSecret }}
{{- fail "rabbitmq.enabled: the bundled broker's only login is secrets.RABBITMQ_DEFAULT_USER with secrets.RABBITMQ_DEFAULT_PASS, and manager.useExistingSecret or worker.useExistingSecret points a workload at a Secret whose password the broker never learns. Drop useExistingSecret, or use an external broker (rabbitmq.enabled=false, externalRabbitmqDefinitions.enabled=true)." }}
{{- end }}
{{- $user := .Values.secrets.RABBITMQ_DEFAULT_USER | default "reporter" }}
{{- $pass := toString .Values.secrets.RABBITMQ_DEFAULT_PASS }}
{{- if has $pass (list "reporter123" "Lerian@123" "CHANGE_ME") }}
{{- fail (printf "rabbitmq.enabled: secrets.RABBITMQ_DEFAULT_PASS is %s, a password printed in this chart (a default of earlier versions, or the values-template placeholder). Set another and upgrade, then restart the broker, which keeps its old password until its pod restarts: kubectl -n %s rollout restart statefulset/%s-rabbitmq" $pass .Release.Namespace .Release.Name) }}
{{- end }}
{{- $defs := .Files.Get "files/rabbitmq/load_definitions.json" | fromJson }}
{{- $_ := set $defs "users" (list (dict "name" $user "password" $pass "tags" "administrator")) }}
{{- $_ := set $defs "permissions" (list (dict "user" $user "vhost" "/" "configure" ".*" "write" ".*" "read" ".*")) }}
apiVersion: v1
kind: Secret
metadata:
  name: "reporter-manager-load-definitions"
type: Opaque
data:
  load_definition.json: {{ toJson $defs | b64enc | quote }}
{{- end }}
