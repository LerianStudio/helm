{{- if .Values.worker.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fetcher-worker.serviceAccountName" . }}
  labels:
    {{- include "fetcher-worker.labels" . | nindent 4 }}
  {{- /* One merged map so a key set in both never renders twice: explicit
     worker.serviceAccount.annotations win over the cloud preset. */}}
  {{- $cloudAnn := include "lerian-common.cloud.saAnnotations" (dict "context" .) | trim | fromYaml | default dict }}
  {{- $ann := merge (deepCopy (.Values.worker.serviceAccount.annotations | default dict)) $cloudAnn }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
