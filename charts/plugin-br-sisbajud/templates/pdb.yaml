{{- if .Values.sisbajud.enabled -}}
{{- $h := include "plugin-br-sisbajud.health" . | fromYaml -}}
{{- if $h.pdb -}}
{{- include "lerian-common.pdb" (dict
      "pdb" $h.pdb
      "name" (include "plugin-br-sisbajud.fullname" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "plugin-br-sisbajud.labels" (dict "context" $ "component" "sisbajud"))
      "selector" (include "plugin-br-sisbajud.selectorLabels" (dict "context" $ "component" "sisbajud"))
      "specStyle" "explicit") }}
{{- end -}}
{{- end -}}
