# reporter — quickstart values (the layperson layer)
#
# Copy this file, fill the CHANGE_ME credentials, and install:
#   helm install reporter lerian/reporter -f values-quickstart.yaml
#
# It exposes ONLY the knobs needed to get running. Everything else has a sane
# default in the chart; override any app setting via `common.configmap.<KEY>`,
# `manager.configmap.<KEY>` or `worker.configmap.<KEY>`. The full values.yaml is
# the power-user surface.
#
# STYLE: the whole env-wide typed contract lives in ONE `global:` block, first —
# set each dependency connection ONCE with its typed mask; the chart emits the
# app's native env keys from it. (Mirrors the midaz productized chart. Do NOT
# scatter *_HOST keys into common.configmap when a mask exists.)

# --- The env-wide typed contract (dependency connections + cross-cutting) ------
global:
  # -- Dependency connections. Defaults point at the chart's bundled infra using
  # bare service names (resolve inside the release namespace). Point at your own
  # infra with the typed masks (one knob per field); set <dep>.enabled=false below.
  datastores:
    mongo:  { host: "reporter-mongodb", port: "27017", user: "reporter" }
    redis:  { host: "reporter-valkey:6379" }
    broker: { host: "reporter-rabbitmq", port: "15672" }
  # -- Object storage (S3/SeaweedFS) — non-secret fields via the mask (name
  # "reporter"); access keys go in `secrets`. (lerian-common >= 1.5.0.)
  objectStorage:
    reporter:
      endpoint: "http://seaweedfs-s3:8333"
  # -- OTel collector. Leave empty to keep telemetry off / the bundled endpoint.
  observability: {}
    # enabled: "true"
    # otlpEndpoint: "otel-collector:4317"
    # deploymentEnvironment: "production"
  # -- plugin-access-manager auth, env-wide (per-component override via configmap).
  auth: {}
    # enabled: "true"
    # host: "http://plugin-access-manager-auth:4000"
  # -- Streaming backend (only needed when STREAMING_ENABLED=true; required by the
  # worker for Fetcher job-event notifications since fetcher 2.0.0-beta.5).
  streaming: {}
    # brokers: "redpanda:9092"

# --- Component images / ingress ------------------------------------------------
manager:
  image:
    tag: "2.4.0"          # -- pin the application version
  # -- Expose the manager API through an Ingress (set enabled: true + a host).
  ingress:
    enabled: false
    className: "nginx"
    hosts:
      - host: "reporter.example.com"   # <- your DNS name
        paths:
          - path: /
            pathType: Prefix
worker:
  image:
    tag: "2.4.0"

common:
  configmap:
    # -- TLS enforcement bypass. "true" for the bundled plaintext infra; set
    # "false" (and enable TLS on every dependency) for production. NEVER prod=true.
    ALLOW_INSECURE_TLS: "true"
    # -- Multi-tenant isolation. "true" also requires global.multiTenant.url.
    MULTI_TENANT_ENABLED: "false"
    # -- Open datasources (DATASOURCE_<name>_*) — the report SOURCES reporter reads
    # from. Deployment-named passthrough (not a mask); *_PASSWORD goes in `secrets`.
    # DATASOURCE_ONBOARDING_HOST: "midaz-postgresql-replica"
    # DATASOURCE_ONBOARDING_PORT: "5432"
    # DATASOURCE_ONBOARDING_USER: "midaz"

# -- Bundled dependencies. Set enabled: false to use an external instance instead
# (then point the masks under global.datastores above at it).
rabbitmq:
  enabled: true
mongodb:
  enabled: true
valkey:
  enabled: true
seaweedfs:
  enabled: true

# -- Credentials. Provide strong values, or reference your own Secret instead by
# setting `manager.useExistingSecret: true` + `manager.existingSecretName: <name>`
# (and the same under `worker`) with these keys.
secrets:
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  # Stable across upgrades (do not rotate): openssl rand -hex 32
  RABBITMQ_ERLANG_COOKIE: "CHANGE_ME"
  # Only needed when an open datasource (global-less common.configmap.DATASOURCE_*) is set:
  DATASOURCE_ONBOARDING_PASSWORD: "CHANGE_ME"
  # External S3 only (bundled SeaweedFS runs auth-less):
  # OBJECT_STORAGE_ACCESS_KEY_ID: "CHANGE_ME"
  # OBJECT_STORAGE_SECRET_KEY: "CHANGE_ME"
