# =============================================================================
# br-sfn — QUICKSTART values (the layperson layer)
# -----------------------------------------------------------------------------
# The full values.yaml is the power-user API. This file is the short list of
# DEPENDENCY-CONNECTION knobs a non-expert fills to get a rail running: where the
# database / cache live, which rail to deploy, the image tag, the ingress host,
# and the operator-provided secrets. Everything else has a working default in the
# chart; reach it only via `<component>.configmap.<KEY>` (the escape hatch).
#
#   helm install br-sfn charts/br-sfn -f values-quickstart.yaml
#
# Anything with CHANGE_ME MUST be set. Infra (Postgres / Valkey / RedPanda) is
# EXTERNAL and pre-provisioned — the host knobs below point the rail at it.
#
# All 8 rails are now productized on lerian-common. `cockpit` is a special case:
# it is BUILD-ARG-ONLY (see below) — it has no runtime config surface, so its
# escape-hatch stays open with nothing to wire.
# =============================================================================

global:
  # -- SHARED datastore tier (the PRIMARY knob): set the connection ONCE and every
  #    rail inherits it. One Postgres/Redis/broker for the whole platform. Point a
  #    single rail elsewhere with the ADVANCED per-rail override <rail>.datastores.*
  #    (see the spi/spb blocks below). Precedence: configmap.<KEY> > <rail>.datastores
  #    > global.datastores > default.
  datastores: {}
    # postgres: { host: "postgresql.internal", port: "5432", user: "brsfn", ssl: "verify-full", replicaHost: "postgresql-replica.internal" }
    # redis:    { host: "valkey.internal", port: "6379" }
    # broker:   { host: "rabbitmq.internal", port: "5672", user: "brsfn" }   # RabbitMQ (spb)
  # -- OTel collector, env-wide (leave empty to keep telemetry off).
  observability: {}
    # enabled: "true"
    # otlpEndpoint: "otel-collector-lerian:4317"
    # deploymentEnvironment: "production"
  # -- plugin-access-manager auth, env-wide (per-component override via configmap).
  auth: {}
    # enabled: "true"
    # host: "https://plugin-access-manager:4000"
  # -- Tenant Manager URL, env-wide (read when a rail sets MULTI_TENANT_ENABLED=true; scr + correios).
  multiTenant: {}
    # url: "https://tenant-manager.internal"
  # -- Object storage, env-wide, keyed by backend name (correios uses `default`).
  objectStorage: {}
    # default: { endpoint: "https://s3.amazonaws.com", region: "us-east-1" }

# --- SPI / Pix rail (spi-api + spi-dict + spi-brcode + spi-core) ---
spi:
  enabled: true
  # -- ADVANCED per-rail override (dedicated). Prefer setting the connection ONCE in
  #    global.datastores above; use this only to point SPI at a different host/db.
  #    One Postgres + one Redis shared by all four SPI binaries.
  datastores:
    postgres:
      host: "CHANGE_ME"          # e.g. spi-postgresql.internal
      port: "5432"
      user: "brspi"
      name: "brspi"
      ssl: "require"
      # replicaHost: "spi-postgresql-replica.internal"
    redis:
      host: "CHANGE_ME:6379"     # e.g. spi-valkey.internal:6379
  api:
    image:
      tag: "1.0.0-beta.1"        # -- pin the spi-api image version
    ingress:
      enabled: false
      # hosts: [{ host: "pix.example.com", paths: [{ path: "/", pathType: Prefix }] }]
  dict:
    image:
      tag: "1.0.0-beta.1"
  brcode:
    image:
      tag: "1.0.0-beta.1"
  core:
    image:
      tag: "1.0.0-beta.1"
  migrations:
    image:
      tag: "1.0.0-beta.1"        # -- pin the br-spi-migrations image
  # -- Turn on env-wide/rail features here (escape hatch; each key wins over the default):
  configmap: {}
    # ENV_NAME: "production"                  # protected runtime -> stricter fail-closed validation
    # BACEN_SPI_PARTICIPANT_ISPB: "12345678"
    # BACEN_SPI_SIGNER_KIND: "pkcs11"         # production custody (file is dev/HML only)
    # BACEN_SPI_PAYLOAD_RESOLVER_KIND: "postgres"
  # -- Operator-provided credentials (NEVER in configmap — schema rejects them there).
  secrets:
    POSTGRES_PASSWORD: "CHANGE_ME"
    # REDIS_PASSWORD: "CHANGE_ME"
    # -- Required in protected runtimes / when the owning feature is on (openssl rand -hex 32):
    # SPI_OPERATIONS_PII_ENCRYPTION_KEY: "CHANGE_ME"      # spi binary — always required
    # SPI_OPERATIONS_BLIND_INDEX_PEPPER: "CHANGE_ME"      # spi binary — always required
    # DICT_KEY_PII_ENCRYPTION_KEY: "CHANGE_ME"            # dict binary
    # DICT_KEY_BLIND_INDEX_PEPPER: "CHANGE_ME"            # dict binary
    # BRCODE_PII_ENCRYPTION_KEY: "CHANGE_ME"              # brcode binary
    # BRCODE_PII_BLIND_INDEX_PEPPER: "CHANGE_ME"          # brcode binary
    # BACEN_SPI_INTERNAL_CALLBACK_SECRET: "CHANGE_ME"     # >=32 chars; required in production
    # BACEN_SPI_PAYLOAD_RESOLVER_ENCRYPTION_KEY: "CHANGE_ME"  # required when RESOLVER_KIND=postgres
    # BACEN_DICT_INTENT_ENCRYPTION_KEY: "CHANGE_ME"
    # DICT_AUDIT_HASH_PEPPER: "CHANGE_ME"                 # >=32 chars in protected runtimes
    # IDEMPOTENCY_RESPONSE_ENCRYPTION_KEY: "CHANGE_ME"

# --- SPB / STR rail (TED over IBM MQ / RSFN) ---
spb:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- pin the br-spb image version
  # -- ADVANCED per-rail override (dedicated). Prefer global.datastores above; use
  #    this only to point SPB at a different Postgres/Redis/RabbitMQ.
  datastores:
    postgres:
      host: "CHANGE_ME"          # e.g. spb-postgresql.internal
      port: "5432"
      user: "br_spb"
      name: "br_bank_transfer_jota"
      ssl: "verify-full"         # production/staging require verify-full
    redis:
      host: "CHANGE_ME"          # e.g. spb-valkey.internal
      port: "6379"
    broker:                      # RabbitMQ (outbox event relay); optional in develop
      host: ""                   # e.g. spb-rabbitmq.internal
      port: "5672"
      user: "br_spb"
  ingress:
    enabled: false
    # hosts: [{ host: "str.example.com", paths: [{ path: "/", pathType: Prefix }] }]
  # -- Escape hatch (each key wins over the default). IBM MQ / STR transport lives here:
  configmap: {}
    # ENV_NAME: "production"                 # protected runtime -> stricter fail-closed validation
    # STR_MQ_HOST: "mq.rsfn.internal"        # real IBM MQ host (required in production/staging)
    # STR_MQ_CHANNEL: "..."
    # STR_MQ_QUEUE_MGR: "..."
    # STR_ISPB: "12345678"
    # SPB_SIGNER_KIND: "pkcs11"              # production custody (file is dev only)
  # -- Operator-provided credentials (NEVER in configmap — schema rejects them there).
  secrets:
    POSTGRES_PASSWORD: "CHANGE_ME"
    # REDIS_PASSWORD: "CHANGE_ME"            # required in production/staging
    # RABBITMQ_PASSWORD: "CHANGE_ME"         # when broker.host is set
    # STR_MQ_PASSWORD: "CHANGE_ME"           # required in production/staging
    # WEBHOOK_SECRET_KEY: "CHANGE_ME"        # 64 hex chars (32 bytes); required in prod/staging
    # STR_PAYLOAD_ENCRYPTION_KEY: "CHANGE_ME"  # AES-256 (hex/base64); required in prod/staging
    # SPB_KMIP_CRYPTO_USER_TOKEN: "CHANGE_ME"  # when SPB_SIGNER_KIND=kmip

# --- SILOC rail (Núclea card settlement over IBM MQ) ---
siloc:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- pin the br-siloc image version
  # -- Native DB naming is DB_* / REDIS_ADDRESS; the mask emits those for you.
  #    Prefer global.datastores above; this per-rail block points SILOC elsewhere.
  #    The SAME postgres mask also feeds the migrator (POSTGRES_*), so set it once.
  datastores:
    postgres:
      host: "CHANGE_ME"          # e.g. siloc-postgresql.internal
      port: "5432"
      user: "br_siloc"
      name: "br_siloc"
      ssl: "require"
    redis:
      host: "CHANGE_ME:6379"     # REDIS_ADDRESS (host:port)
  ingress:
    enabled: false
  # -- Escape hatch. The Núclea SILOC IBM MQ leg lives here (plain passthrough):
  configmap: {}
    # ENV_NAME: "production"
    # CAMARA_PAG_ISPB: "02992335"            # Núclea SILOC câmara ISPB (8 digits)
    # MQ_HOST: "..."
    # MQ_CHANNEL: "C02992335.12345678.1"     # Núclea pattern C02992335.{ISPB}.1
    # MQ_QUEUE_MANAGER: "..."                 # must be the SILOC settlement QM
    # MQ_SEND_QUEUE: "..."
    # MQ_RECEIVE_QUEUE: "..."
    # MQ_TLS_ENABLED: "true"
  # -- Operator-provided credentials (NEVER in configmap). DB_PASSWORD also feeds
  #    the migrator (mapped to POSTGRES_PASSWORD).
  secrets:
    DB_PASSWORD: "CHANGE_ME"
    # REDIS_PASSWORD: "CHANGE_ME"

# --- SCR rail (Sistema de Informações de Crédito — wsscr2n facade) ---
scr:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- pin the br-scr image version
  # -- Postgres + Redis (app AND baked migrator both read POSTGRES_*). Prefer global.datastores.
  datastores:
    postgres:
      host: "CHANGE_ME"          # e.g. scr-postgresql.internal
      port: "5432"
      user: "scr"
      name: "scr"
      ssl: "require"
    redis:
      host: "CHANGE_ME"          # e.g. scr-valkey.internal
      port: "6379"
  ingress:
    enabled: false
  # -- Escape hatch. wsscr2n upstream + RedPanda streaming (SCR_STREAMING_*, app-prefixed)
  #    + secret-store selection live here (plain passthrough):
  configmap: {}
    # ENV_NAME: "production"
    # DEPLOYMENT_MODE: "saas"                 # fail-closed TLS everywhere
    # SCR_WSSCR2N_BASE_URL: "https://scr.bcb.gov.br/wsscr2n"   # prod; keep the /wsscr2n suffix
    # SCR_STREAMING_BROKERS: "redpanda:9092"  # OR set SCR_STREAMING_EMISSION_DISABLED: "true"
    # SCR_STREAMING_TLS: "true"
    # SECRET_STORE_KIND: "aws"                # then set AWS_REGION
    # AWS_REGION: "us-east-1"
    # MULTI_TENANT_ENABLED: "true"            # then set global.multiTenant.url + secrets.MULTI_TENANT_SERVICE_API_KEY
  # -- Operator-provided credentials (NEVER in configmap — schema rejects them there).
  secrets:
    POSTGRES_PASSWORD: "CHANGE_ME"
    # REDIS_PASSWORD: "CHANGE_ME"                       # required in production when Redis configured
    # SCR_WSSCR2N_BASIC_PASSWORD: "CHANGE_ME"           # WSCR0001 basic-auth pw (SECRET_STORE_KIND=env)
    # SCR_ATREST_ENCRYPTION_KEY: "CHANGE_ME"            # openssl rand -base64 32; required in prod/saas
    # SCR_ATREST_BLIND_INDEX_KEY: "CHANGE_ME"           # openssl rand -base64 48; distinct from above
    # MULTI_TENANT_SERVICE_API_KEY: "CHANGE_ME"         # required when MULTI_TENANT_ENABLED=true

# --- DESK rail (cabine operator-state + four-eyes back-office) ---
desk:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- pin the br-desk image version
  # -- Postgres only (no Redis). App reads DB_*; the baked migrator reads POSTGRES_*;
  #    the SAME mask feeds both. Prefer global.datastores.
  datastores:
    postgres:
      host: "CHANGE_ME"          # e.g. desk-postgresql.internal
      port: "5432"
      user: "desk"
      name: "desk"
      ssl: "require"
  ingress:
    enabled: false
  # -- Escape hatch. CORS (cockpit SPA), ACK-workflow TTLs, and the outbound M2M
  #    access-manager URL/CLIENT_ID live here (plain passthrough):
  configmap: {}
    # ENV_NAME: "production"
    # DEPLOYMENT_MODE: "saas"
    # DESK_CORS_ALLOWED_ORIGINS: "https://cockpit.example.com"
    # PLUGIN_ACCESS_MANAGER_URL: "https://plugin-access-manager:4000"   # or set global.auth.host
    # PLUGIN_ACCESS_MANAGER_CLIENT_ID: "br-desk"
  # -- Operator-provided credentials (NEVER in configmap — schema rejects them there).
  #    DB_PASSWORD also feeds the migrator (mapped to POSTGRES_PASSWORD).
  secrets:
    DB_PASSWORD: "CHANGE_ME"
    # PLUGIN_ACCESS_MANAGER_CLIENT_SECRET: "CHANGE_ME"   # four-eyes user-deletion M2M; required in prod

# --- CORREIOS rail (BC Correio regulatory mailbox — Postgres + cache + RabbitMQ + S3) ---
correios:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- pin the plugin-bc-correios image version
  # -- Postgres (native db-name is POSTGRES_NAME; app + migrator both POSTGRES_*) + cache
  #    (CACHE_ADDR host:port). Prefer global.datastores.
  datastores:
    postgres:
      host: "CHANGE_ME"          # e.g. correios-postgresql.internal
      port: "5432"
      user: "plugin-bc-correios"
      name: "plugin-bc-correios"
      ssl: "require"
    redis:
      host: "CHANGE_ME:6379"     # CACHE_ADDR (host:port)
  # -- S3/SeaweedFS attachment store (backend name `default`). Prefer global.objectStorage.
  objectStorage:
    default:
      endpoint: "CHANGE_ME"      # e.g. https://s3.amazonaws.com or http://seaweedfs:8333
      region: "us-east-1"
      bucket: "bc-correios-attachments"
      usePathStyle: "false"      # "true" for MinIO/SeaweedFS
  ingress:
    enabled: false
  # -- Escape hatch. RabbitMQ URL, BCB SOAP env, AI/feature/tenant tuning live here:
  configmap: {}
    # ENV_NAME: "production"
    # BC_CORREIO_ENVIRONMENT: "production"    # mock | homologation | production
    # MULTI_TENANT_ENABLED: "true"            # then set global.multiTenant.url + secrets
  # -- Operator-provided credentials (NEVER in configmap — schema rejects them there).
  secrets:
    POSTGRES_PASSWORD: "CHANGE_ME"
    RABBITMQ_URL: "amqp://user:CHANGE_ME@correios-rabbitmq:5672/"   # embeds credentials -> Secret
    # CACHE_PASSWORD: "CHANGE_ME"
    OBJECT_STORAGE_ACCESS_KEY: "CHANGE_ME"
    OBJECT_STORAGE_SECRET_KEY: "CHANGE_ME"
    ENCRYPTION_KEY: "CHANGE_ME"                # 32-byte AES-256; required in non-dev
    # LICENSE_KEY: "CHANGE_ME"                 # required (non-empty) in non-development
    # MULTI_TENANT_SERVICE_API_KEY: "CHANGE_ME"   # when MULTI_TENANT_ENABLED=true

# --- SLC-EDGE rail (Cabine SLC authenticated passthrough edge — stateless) ---
slcEdge:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- pin the br-slc-edge image version
  ingress:
    enabled: false
  # -- Stateless: no datastore, no secrets (it relays the caller's bearer verbatim).
  #    The ONE required knob is the br-slc core upstream (a plain inter-service URL —
  #    br-slc is a separate service, not derived by the chart).
  configmap:
    SLC_UPSTREAM_URL: "CHANGE_ME"              # e.g. http://br-slc:3010 (the br-slc core base)
    # SLC_EDGE_CORS_ALLOWED_ORIGINS: "https://cockpit.example.com"
    # SLC_UPSTREAM_TIMEOUT: "30s"

# --- COCKPIT rail (operations SPA — BUILD-ARG-ONLY, no runtime config) ---
# The SPA's backend URLs (VITE_AUTH_URL / VITE_SPB_URL / VITE_SPI_URL / ...) are
# baked into the bundle at IMAGE BUILD time via `docker build --build-arg VITE_*=...`
# — NOT chart values. To point cockpit at real backends, build/pin an
# environment-specific image; there are NO runtime knobs to set here.
cockpit:
  enabled: true
  image:
    tag: "1.0.0-beta.1"          # -- the ONLY knob: pin the environment-specific image
  ingress:
    enabled: false
  # configmap/secrets: intentionally empty — cockpit reads no runtime env (VITE_* are build args).
