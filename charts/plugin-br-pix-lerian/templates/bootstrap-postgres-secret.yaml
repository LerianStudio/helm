{{- if .Values.global.externalPostgresDefinitions.enabled }}
{{- /*
Credentials for the bootstrap Jobs.

WHY THIS EXISTS. The Jobs used to carry DB_ADMIN_PASSWORD and
DB_PASSWORD_PIXSWITCH as literal `env.value` whenever the operator supplied
them inline instead of naming an existing Secret. That put the Postgres
SUPERUSER password into the Job spec, into the Helm release Secret, into
`kubectl describe job` output and into any audit trail that records object
bodies — readable by every principal holding `get job` in the namespace.

The values are now written once into this Secret and referenced by
`secretKeyRef`, so both supply paths — external Secret or inline values —
reach the container the same way and no credential is ever inlined into a
Job manifest.

Only the halves that are actually inline are rendered. The admin login and the
application role each have their own `useExistingSecret.name`, so an operator
can put one in an external Secret and leave the other inline; this Secret then
carries just the inline half, and nothing is duplicated.

No hook annotations: Helm's install order already applies a Secret before a
Job, and the bootstrap Jobs are plain resources. Adding hooks here would
change sync ordering, which is a separate concern tracked on its own review
thread.
*/}}
{{- $defs := .Values.global.externalPostgresDefinitions -}}
{{- $admin := $defs.postgresAdminLogin -}}
{{- $creds := $defs.pixswitchCredentials -}}
{{- $inlineAdmin := not (default "" $admin.useExistingSecret.name) -}}
{{- $inlineCreds := not (default "" $creds.useExistingSecret.name) -}}
{{- if or $inlineAdmin $inlineCreds }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-pix-lerian.name" $ }}-bootstrap-postgres
  namespace: {{ include "global.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-lerian.labels" (dict "context" $ "component" "bootstrap-postgres") | nindent 4 }}
type: Opaque
stringData:
  {{- if $inlineAdmin }}
  DB_USER_ADMIN: {{ $admin.username | quote }}
  DB_ADMIN_PASSWORD: {{ $admin.password | quote }}
  {{- end }}
  {{- if $inlineCreds }}
  DB_PASSWORD_PIXSWITCH: {{ $creds.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
