# midaz — values-template.yaml (the operator fill-in surface)
#
# STYLE: the env-wide typed contract lives in ONE `global:` block, FIRST — set
# each dependency connection ONCE with its typed mask; ledger/crm/tracer
# configmaps emit the app's native env keys from it. Do NOT scatter
# *_HOST/*_PORT/*_USER keys into <component>.configmap when a mask exists.

global:
  # -- Managed-cloud topology preset: aws | gcp | azure. Sets tls/scheme/
  # ports/ssl for the masks below in one knob — e.g. "aws" turns on Redis
  # TLS, AmazonMQ amqps, RDS sslmode=require, DocumentDB TLS params. Leave ""
  # for the bundled in-cluster infra (plaintext). Endpoints (host/port/user)
  # still come from global.datastores below — a cloud preset can't know your
  # RDS host.
  # Example:
  #   global:
  #     cloud: "aws"
  cloud: ""

  # -- Dependency connections — typed masks (one knob per field), shared by
  # ledger/crm/tracer configmaps. Point at your infra here, or keep the
  # bundled defaults and toggle postgresql/mongodb/rabbitmq/valkey.enabled below.
  # If ONE component needs a different backend than the rest of the env, set
  # `ledger.datastores`/`crm.datastores`/`tracer.datastores` instead (same
  # shape, higher precedence, lower than a native `<component>.configmap.<KEY>`).
  # Example:
  #   global:
  #     datastores:
  #       postgresOnboarding:  { host: "my-rds.example.com", user: "midaz" }
  #       postgresTransaction: { host: "my-rds.example.com", user: "midaz" }
  #       mongoOnboarding:     { host: "my-docdb.example.com", user: "midaz" }
  #       mongoTransaction:    { host: "my-docdb.example.com", user: "midaz" }
  #       redis:               { host: "my-elasticache.example.com", port: "6379" }
  #       broker:               { host: "my-amazonmq.example.com" }
  datastores: {}

  # -- Env-wide environment name (drives ENV_NAME + observability's deployment
  # environment default, single-sourced so they can't drift).
  # Example:
  #   global:
  #     env:
  #       name: "production"
  env: {}
    # name: "production"

  # -- Env-wide multi-tenancy gate.
  # Example:
  #   global:
  #     multiTenant:
  #       enabled: "true"
  multiTenant: {}
    # enabled: "true"

  # -- Env-wide telemetry gate.
  # Example:
  #   global:
  #     observability:
  #       enabled: "true"
  observability: {}
    # enabled: "true"

  # -- plugin-access-manager auth, env-wide (ledger/crm/tracer all consume it).
  # Example:
  #   global:
  #     auth:
  #       enabled: "true"
  #       host: "http://plugin-access-manager-auth:4000"
  auth: {}
    # enabled: "true"
    # host: "http://plugin-access-manager-auth:4000"

  # -- Bootstrap job for external RabbitMQ: creates users, vhosts, and permissions
  externalRabbitmqDefinitions:
    # -- Enable or disable the RabbitMQ bootstrap job
    enabled: false
    connection:
      protocol: "http"
      host: "midaz-rabbitmq"
      port: "15672"
      portAmqp: "5672"
    rabbitmqAdminLogin:
      useExistingSecret:
        name: ""
      username: "midaz"
      password: ""
    appCredentials:
      useExistingSecret:
        name: ""
      transactionPassword: ""
      consumerPassword: ""

  # -- Bootstrap job for external PostgreSQL: creates databases, roles, and grants privileges
  externalPostgresDefinitions:
    enabled: false
    connection:
      host: "midaz-postgresql-primary"
      port: "5432"
    postgresAdminLogin:
      useExistingSecret:
        name: ""
      username: "postgres"
      password: ""
    midazCredentials:
      useExistingSecret:
        name: ""
      password: ""

ledger:
  # -- Enable ledger service (unified onboarding + transaction)
  enabled: false

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []

  configmap:
    ALLOW_INSECURE_TLS: "true"
    # -- Auth configuration: PLUGIN_AUTH_ENABLED/PLUGIN_AUTH_HOST come from
    # global.auth above; do NOT pin them here, a native key wins and defeats it.
    # -- RI permission declaration to the IdP identity service (:4001, distinct from
    # auth :4000). IDP_DECLARATION_ENABLED turns on manifest publication at boot
    # (default false, fail-open). Under DEPLOYMENT_MODE=saas, IDP_HOST MUST be an https:// URL.
    IDP_DECLARATION_ENABLED: "false"
    IDP_HOST: ""
    IDP_M2M_CLIENT_ID: ""
    # -- Accounting config
    ACCOUNT_TYPE_VALIDATION: ""
    TRANSACTION_ROUTE_VALIDATION: ""
    # -- PostgreSQL Onboarding module (host/user/port/replicaHost come from
    # global.datastores.postgresOnboarding above; only the per-module db name
    # is native)
    DB_ONBOARDING_NAME: "onboarding"
    DB_ONBOARDING_REPLICA_NAME: "onboarding"
    # -- MongoDB Onboarding module (host/user/port from global.datastores.mongoOnboarding)
    MONGO_ONBOARDING_URI: "mongodb"
    MONGO_ONBOARDING_NAME: "onboarding"
    # -- PostgreSQL Transaction module (host/user/port/replicaHost come from
    # global.datastores.postgresTransaction above; only the per-module db name
    # is native)
    DB_TRANSACTION_NAME: "transaction"
    DB_TRANSACTION_REPLICA_NAME: "transaction"
    # -- MongoDB Transaction module (host/user/port from global.datastores.mongoTransaction)
    MONGO_TRANSACTION_URI: "mongodb"
    MONGO_TRANSACTION_NAME: "transaction"
    # -- Redis (shared) — host/port come from global.datastores.redis above;
    # a native REDIS_HOST here is used verbatim (its own host:port).
    # -- RabbitMQ configuration (host/scheme/ports come from global.datastores.broker)
    RABBITMQ_DEFAULT_USER: "transaction"
    RABBITMQ_CONSUMER_USER: "consumer"
    RABBITMQ_TRANSACTION_ASYNC: "false"
    # -- Audit
    AUDIT_LOG_ENABLED: "false"
    # -- Balance Sync Worker
    BALANCE_SYNC_WORKER_ENABLED: "false"
    BALANCE_SYNC_MAX_WORKERS: "5"
    # Rate Limiting
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_MAX: "500"
    RATE_LIMIT_WINDOW_SEC: "60"
    AGGRESSIVE_RATE_LIMIT_MAX: "100"
    AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: "60"
    RELAXED_RATE_LIMIT_MAX: "1000"
    RELAXED_RATE_LIMIT_WINDOW_SEC: "60"
    RATE_LIMIT_REDIS_TIMEOUT_MS: "500"
    ALLOW_RATELIMIT_DISABLED: ""
    ALLOW_RATELIMIT_FAIL_OPEN: ""

  secrets:
    DB_ONBOARDING_PASSWORD: ""
    DB_ONBOARDING_REPLICA_PASSWORD: ""
    MONGO_ONBOARDING_PASSWORD: ""
    DB_TRANSACTION_PASSWORD: ""
    DB_TRANSACTION_REPLICA_PASSWORD: ""
    MONGO_TRANSACTION_PASSWORD: ""
    REDIS_PASSWORD: ""
    RABBITMQ_DEFAULT_PASS: ""
    RABBITMQ_CONSUMER_PASS: ""
    # -- RI permission declaration M2M client secret. Operator-provided; only set
    # when IDP_DECLARATION_ENABLED=true. Rendered into the ledger Secret, never the ConfigMap.
    IDP_M2M_CLIENT_SECRET: ""

 # -- Existing secrets name
  useExistingSecret: false
  existingSecretName: ""

grafana:
  enabled: false

valkey:
  enabled: true

postgresql:
  enabled: true

mongodb:
  enabled: true

rabbitmq:
  enabled: true

# -- OTEL exporter configuration for midaz services.
# When enabled, HOST_IP, POD_IP, OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_RESOURCE_ATTRIBUTES
# are injected into the `ledger` and `crm` deployments only. Port is fixed at 4317.
# If you need a different collector endpoint, leave enabled=false and configure
# OTEL env vars directly in the application configmap (ledger.configmap / crm.configmap).
otel-collector-lerian:
  # -- Inject OTEL env vars into the midaz ledger and crm deployments
  enabled: true
