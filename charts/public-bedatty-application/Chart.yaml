apiVersion: v2
name: public-bedatty-application-helm
description: A Helm chart for Public Bedatty Application - Lerian reference service template
type: application
annotations:
  lerian.studio/chart-type: single-service
home: https://github.com/LerianStudio/public-bedatty-application
sources:
  - https://github.com/LerianStudio/helm-boilerplates/tree/main/charts/public-bedatty-application
  - https://github.com/LerianStudio/public-bedatty-application
maintainers:
  - name: "Lerian Studio"
    email: "support@lerian.studio"
version: 1.3.1
appVersion: "1.0.0-beta.1"
keywords:
  - boilerplate
  - reference
  - template
  - lerian
  - ddd
  - hexagonal
icon: https://avatars.githubusercontent.com/u/148895005?s=200&v=4
# Bitnami subcharts are DECLARED (exact pins, condition-gated) so the chart can
# optionally bundle its own datastores, but they default to DISABLED: on
# benedita, Postgres and Valkey are EXTERNAL and pre-provisioned. Enable them
# for a self-contained install — e.g. the anacleto chaos/fuzzing environments,
# where each app brings its own infra instead of sharing cluster-wide services.
dependencies:
  - name: lerian-common-helm
    version: "2.0.0"
    repository: "oci://ghcr.io/lerianstudio"
  - name: postgresql
    version: "16.3.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: valkey
    version: "2.4.7"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled
