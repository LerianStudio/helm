{{- if not .Values.worker.useExistingSecret }}
{{- $_ := required "secrets.RABBITMQ_DEFAULT_PASS is required" .Values.secrets.RABBITMQ_DEFAULT_PASS }}
{{- /* Same genuinely-conditional guard as manager/secrets.yaml: only require
   DATASOURCE_ONBOARDING_PASSWORD when a REAL direct datasource override is present at
   any precedence tier (native configmap key > dedicated mask > shared/global mask) —
   NOT the with-fallback resolved value from lerian-common.datastore.value, which is
   never empty. */ -}}
{{- $dsCm := .Values.common.configmap | default dict }}
{{- $dsDedicated := index (.Values.datastores | default dict) "postgres" | default dict }}
{{- $dsShared := index ((.Values.global | default dict).datastores | default dict) "postgres" | default dict }}
{{- $dsConfigured := or (hasKey $dsCm "DATASOURCE_ONBOARDING_HOST") (hasKey $dsDedicated "host") (hasKey $dsShared "host") }}
{{- if $dsConfigured }}
{{- $_ := required "secrets.DATASOURCE_ONBOARDING_PASSWORD is required when a direct datasource (DATASOURCE_ONBOARDING_HOST) is configured" .Values.secrets.DATASOURCE_ONBOARDING_PASSWORD }}
{{- end }}
{{- include "reporter.rabbitmqErlangCookieRequired" . }}
{{- include "reporter.rabbitmqExistingSecretConsistent" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-worker.fullname" . }}
  labels:
    {{- include "plugin-worker.labels" (dict "context" . "name" .Values.worker.name ) | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
type: Opaque
data:
  # MONGO_PASSWORD is single-sourced from the Bitnami mongodb subchart Secret; see the
  # manager Secret and docs/helm-chart-standard.md "Single-Source Infra Secrets".
  {{- include "reporter.mongoExternalSecretData" . | nindent 2 }}
  {{- range $key, $value := .Values.secrets }}
  {{- if ne $key "MONGO_PASSWORD" }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
