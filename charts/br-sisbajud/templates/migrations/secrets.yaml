{{- $pw := "" -}}
{{- if .Values.migrations.enabled -}}{{- $pw = include "br-sisbajud.migrationsHookPassword" . -}}{{- end -}}
{{- if $pw }}
{{- /* Dedicated hook Secret carrying only the Postgres password for the migrations
   Job, rendered ONLY when that password comes from values
   (brSisbajud.secrets.POSTGRES_PASSWORD, the same value the app Secret carries, or
   the migrations.postgres.password override). Every other source (bundled or
   existing Secrets, extraEnvVars) is referenced directly by the Job. A pre-install
   / PreSync hook runs BEFORE the app Secret exists on a first install, hence the
   copy. Created one weight before the Job, and kept after success so the Job can
   read it (replaced on the next run). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-sisbajud-migrations.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sisbajud-migrations.labels" . | nindent 4 }}
  annotations:
    {{- include "br-sisbajud.presyncSecretAnnotations" (dict "bundled" (eq (include "br-sisbajud.postgresInternal" .) "true")) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
{{- end }}
