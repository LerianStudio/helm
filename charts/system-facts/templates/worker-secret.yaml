{{- if and (.Values.worker).enabled (not .Values.worker.useExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "system-facts.worker.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "system-facts.worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $data := include "system-facts.worker.secretData" . | fromJson }}
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ get $data $k | quote }}
  {{- end }}
{{- end }}
