{{- if and .Values.worker.enabled (include "plugin-br-pix-jd.rendersOwnSecret" (dict "comp" .Values.worker)) }}
{{- /* The worker needs the same credentials as the api — lib-license-go validates the
   license on EVERY tick, not just at boot — so the license falls back to the api's
   value rather than making the operator set it twice and risk the two drifting.
   POSTGRES_PASSWORD is absent for the same reason it is absent from the api Secret on
   the bundled path: it comes from the Secret that owns it, via secretKeyRef. */ -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "plugin-br-pix-jd.componentFullname" (dict "root" $ "name" "worker") }}
  namespace: {{ include "plugin-br-pix-jd.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "worker") | nindent 4 }}
  {{- with (include "plugin-br-pix-jd.commonAnnotations" (dict "root" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- $ws := .Values.worker.secrets | default dict -}}
  {{- /* The closing `}}` keeps its newline on purpose: the assignment above trims both
     sides, so this is what terminates the `data:` line. Right-trimming both would join
     them into `data:LICENSE_KEY:` — valid YAML naming a key `data:LICENSE_KEY`, with no
     `data` field at all. */}}
  {{- $as := .Values.api.secrets | default dict }}
  {{- /* THE license gate. The worker validates on startup and on every tick
     (internal/bootstrap/worker.go initLicense), so an unlicensed worker stops the
     reconcilers — including the money-moving settlement reconcile. IS_DEVELOPMENT=true
     takes the early-return path that leaves the client nil and skips validation
     entirely, so the key is genuinely optional there. Falls back to the api value so
     the two components cannot drift. */}}
  {{- /* Visão mesclada: IS_DEVELOPMENT não é chave modelada, chega por extraConfigmap. */ -}}
  {{- $isDev := eq (index (fromYaml (include "plugin-br-pix-jd.effectiveConfig" .)) "IS_DEVELOPMENT" | default "false" | toString) "true" -}}
  {{- $license := ($ws.LICENSE_KEY | default $as.LICENSE_KEY | default "") -}}
  {{- if $isDev }}
  {{- with $license }}
  LICENSE_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- else }}
  LICENSE_KEY: {{ required "\n\nERROR: a license key is required for the worker.\nlib-license-go validates it at startup and on every job tick, so an unlicensed worker\nstops the reconcilers — including med_settlement_reconcile, which commits or cancels\nreserved money. Set worker.secrets.LICENSE_KEY or api.secrets.LICENSE_KEY.\nFor a local stack only, IS_DEVELOPMENT=true skips validation and makes this optional.\n" $license | b64enc | quote }}
  {{- end }}
  {{- with ($ws.REDIS_PASSWORD | default $as.REDIS_PASSWORD) }}
  REDIS_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- if not (include "plugin-br-pix-jd.postgresPasswordSourced" .) }}
  {{- with ($ws.POSTGRES_PASSWORD | default $as.POSTGRES_PASSWORD) }}
  POSTGRES_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with (include "plugin-br-pix-jd.domainSecrets" (dict "root" $ "comp" .Values.worker)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- /* MT / streaming / M2M credentials, shared with the api through one helper. */}}
  {{- with (include "plugin-br-pix-jd.platformSecrets" (dict "root" $ "comp" .Values.worker)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- range $key, $value := (.Values.worker.extraSecrets | default dict) }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
