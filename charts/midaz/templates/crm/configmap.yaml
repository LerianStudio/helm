{{- if .Values.crm.enabled }}
{{- /* Resolve the environment name ONCE and reuse it for every environment-dependent
   key (ENV_NAME, OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT) so they can never drift apart.
   Cascade (highest precedence first): configmap.ENV_NAME (legacy) -> crm.env (param)
   -> global.environment (env-wide) -> "development" (component default). global.environment
   slots just above the hardcoded default via cfgValue's `default` argument. */ -}}
{{- $env := include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "ENV_NAME" "params" .Values.crm "field" "env" "default" (default "development" (.Values.global | default dict).environment)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "midaz-crm.fullname" . }}
  labels:
    {{- include "midaz-crm.labels" (dict "context" . "name" .Values.crm.name ) | nindent 4 }}
data:
  # -- Default Environment variables for CRM
  ALLOW_INSECURE_TLS: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "ALLOW_INSECURE_TLS" "params" .Values.crm "field" "allowInsecureTls" "default" "true") | quote }}
  ENV_NAME: {{ $env | quote }}

  # APP
  APPLICATION_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "APPLICATION_NAME" "params" .Values.crm "field" "applicationName" "default" "crm") | quote }}
  SERVER_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SERVER_PORT" "params" .Values.crm.server "field" "port" "default" "4003") | quote }}
  SERVER_ADDRESS: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SERVER_ADDRESS" "params" .Values.crm.server "field" "address" "default" ":4003") | quote }}
  VERSION: {{ .Values.crm.image.tag | default .Chart.AppVersion | quote }}

  # Mongo DB
  MONGO_URI: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "MONGO_URI" "params" .Values.crm.mongo "field" "uri" "default" "mongodb") | quote }}
  MONGO_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.crm.datastores "configmap" .Values.crm.configmap "type" "mongo" "field" "host" "nativeKey" "MONGO_HOST" "default" "midaz-mongodb") | quote }}
  MONGO_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.crm.datastores "configmap" .Values.crm.configmap "type" "mongo" "field" "port" "nativeKey" "MONGO_PORT" "default" "27017") | quote }}
  MONGO_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "MONGO_NAME" "params" .Values.crm.mongo "field" "name" "default" "crm") | quote }}
  MONGO_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.crm.datastores "configmap" .Values.crm.configmap "type" "mongo" "field" "user" "nativeKey" "MONGO_USER" "default" "midaz") | quote }}
  MONGO_MAX_POOL_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "MONGO_MAX_POOL_SIZE" "params" .Values.crm.mongo "field" "maxPoolSize" "default" "1000") | quote }}
  MONGO_PARAMETERS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.crm.datastores "configmap" .Values.crm.configmap "type" "mongo" "field" "params" "nativeKey" "MONGO_PARAMETERS" "default" "") | quote }}
  MONGO_TLS_CA_CERT: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "MONGO_TLS_CA_CERT" "params" .Values.crm.mongo "field" "tlsCaCert" "default" "") | quote }}

  # SWAGGER
  SWAGGER_TITLE: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_TITLE" "params" .Values.crm.swagger "field" "title" "default" "CRM") | quote }}
  SWAGGER_DESCRIPTION: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_DESCRIPTION" "params" .Values.crm.swagger "field" "description" "default" "The CRM API provides a set of endpoints for managing holder data, including information related to their ledger accounts.") | quote }}
  SWAGGER_VERSION: {{ .Values.crm.image.tag | default .Chart.AppVersion | quote }}
  SWAGGER_HOST: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_HOST" "params" .Values.crm.swagger "field" "host" "default" ":4003") | quote }}
  SWAGGER_BASE_PATH: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_BASE_PATH" "params" .Values.crm.swagger "field" "basePath" "default" "/") | quote }}
  SWAGGER_SCHEMES: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_SCHEMES" "params" .Values.crm.swagger "field" "schemes" "default" "http") | quote }}
  SWAGGER_LEFT_DELIMITER: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_LEFT_DELIMITER" "params" .Values.crm.swagger "field" "leftDelim" "default" "{{") | quote }}
  SWAGGER_RIGHT_DELIMITER: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SWAGGER_RIGHT_DELIMITER" "params" .Values.crm.swagger "field" "rightDelim" "default" "}}") | quote }}

  # LOG LEVEL
  LOG_LEVEL: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "LOG_LEVEL" "params" .Values.crm "field" "logLevel" "default" "debug") | quote }}

  # OPEN TELEMETRY
  {{- include "lerian-common.otel.envFlat" (dict
        "configmap" .Values.crm.configmap
        "defaults" (dict
          "OTEL_RESOURCE_SERVICE_NAME" "midaz-crm"
          "OTEL_LIBRARY_NAME" "github.com/LerianStudio/plugin-crm"
          "OTEL_RESOURCE_SERVICE_VERSION" (.Values.crm.image.tag | default .Chart.AppVersion)
          "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" $env)) | nindent 2 }}
  ENABLE_TELEMETRY: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "ENABLE_TELEMETRY" "params" .Values.crm.telemetry "field" "enabled" "default" "true") | quote }}

  # AUTH
  PLUGIN_AUTH_ADDRESS: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" .Values.crm.configmap "block" "auth" "field" "host" "nativeKey" "PLUGIN_AUTH_ADDRESS" "default" "http://plugin-access-manager-auth:4000") | quote }}
  PLUGIN_AUTH_ENABLED: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" .Values.crm.configmap "block" "auth" "field" "enabled" "nativeKey" "PLUGIN_AUTH_ENABLED" "default" "false") | quote }}

  # MULTI-TENANT — crm exposes only the toggle (no MT client config on this component)
  # Legacy configmap.MULTI_TENANT_ENABLED wins over the grouped param (presence-based).
  MULTI_TENANT_ENABLED: {{ eq (include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "MULTI_TENANT_ENABLED" "params" .Values.crm.multiTenant "field" "enabled" "default" "false")) "true" | quote }}

  KMS_VAULT_ADDR: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "KMS_VAULT_ADDR" "params" .Values.crm.kms "field" "vaultAddr" "default" "http://midaz-hc-vault:8200") | quote }}
  KMS_VAULT_AUTH_METHOD: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "KMS_VAULT_AUTH_METHOD" "params" .Values.crm.kms "field" "vaultAuthMethod" "default" "token") | quote }}
  KMS_VENDOR: {{ include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "KMS_VENDOR" "params" .Values.crm.kms "field" "vendor" "default" "hashicorp-vault") | quote }}
  {{- /* Legacy configmap.SD_ENABLED wins over the grouped param (presence-based);
     compare to "true" so a legacy "false" string does not evaluate truthy. Same
     resolved bool gates both the env var and the helper. */ -}}
  {{- $sdEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "SD_ENABLED" "params" .Values.crm.serviceDiscovery "field" "enabled" "default" "false")) "true" }}
  SD_ENABLED: {{ $sdEnabled | quote }}
  {{- include "lerian-common.serviceDiscovery.env" (dict
        "context" $
        "enabled" $sdEnabled
        "configmap" .Values.crm.configmap
        "name" (include "midaz-crm.fullname" .)
        "port" .Values.crm.service.port
        "namespace" (include "global.namespace" .)
        "ingressHost" (include "lerian-common.firstIngressHost" (dict "ingress" .Values.crm.ingress))) | nindent 2 }}
  {{- /* Legacy configmap.STREAMING_ENABLED wins over the grouped param
     (presence-based); compare to "true" so a legacy "false" string does not
     evaluate truthy. Same resolved bool gates both the env var and the helper. */ -}}
  {{- $streamingEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "STREAMING_ENABLED" "params" .Values.crm.streaming "field" "enabled" "default" "false")) "true" }}
  STREAMING_ENABLED: {{ $streamingEnabled | quote }}
  {{- include "lerian-common.streaming.env" (dict
        "context" $
        "enabled" $streamingEnabled
        "configmap" .Values.crm.configmap
        "clientId" (include "midaz-crm.fullname" .)
        "cloudeventsSource" "lerian.midaz.crm") | nindent 2 }}
  # Extra Env Vars
  {{- with .Values.crm.extraEnvVars }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
