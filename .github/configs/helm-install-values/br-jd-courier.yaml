# The chart renders no Secret: every role and the pre-install migration Job read
# one operator-provisioned Secret and a PostgreSQL this kind cluster does not run.
# The hook stays off and every role runs zero replicas, so the gate applies every
# manifest server-side and exercises the install and in-place upgrade without
# starting a pod that could only fail on the missing Secret.
migrations:
  enabled: false
roles:
  spbConsumer:
    replicas: 0
  spbSender:
    replicas: 0
  pixIngress:
    replicas: 0
  admin:
    replicas: 0
