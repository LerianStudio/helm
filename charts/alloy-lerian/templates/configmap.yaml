{{- /*
Configuration for each role, rendered from semantic parameters. The processing
chain is not part of the values surface (see _config.tpl).

Names are fixed rather than release-derived: subchart values are static YAML and
cannot reference the release name, so an aliased subchart could not point at a
release-prefixed ConfigMap.
*/ -}}
{{- include "alloy-lerian.assertSingletonReplicas" . -}}
{{- include "alloy-lerian.assertNodeInfra" . -}}
{{- include "alloy-lerian.assertNodeExporterTarget" . -}}
{{- include "alloy-lerian.assertFleetEnv" . -}}
{{- include "alloy-lerian.assertCredentialEnv" . -}}
{{- include "alloy-lerian.assertClientIdEnv" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alloy-lerian.nodeConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy-lerian.labels" . | nindent 4 }}
    alloy-lerian.lerian.studio/role: node
data:
  config.alloy: |
    {{- include "alloy-lerian.config.node" . | nindent 4 }}
---
{{- /*
Variaveis de ambiente DERIVADAS, entregues por `envFrom` em vez de `extraEnv`.

⚠️ POR QUE NAO `extraEnv`: ele e LISTA, e lista de values nao faz merge — o
cliente que declara a sua SUBSTITUI a do chart inteira. MEDIDO: com o cliente
declarando apenas ALLOY_CLIENT_ID, o pod sobe com
`[ALLOY_DEPLOY_MODE HOSTNAME K8S_NODE_NAME ALLOY_CLIENT_ID]` — endpoint,
credencial e Fleet somem todos. Um default que desaparece quando o caso real
mexe na chave nao e default, e armadilha.

`envFrom` e uma chave SEPARADA no subchart (verificado no template do upstream,
containers/_agent.yaml), entao o cliente pode mexer em `extraEnv` sem derrubar
estas. E o valor sai de `origin.id` e `destination.endpoint`, que o chart ja
valida — nao ha o que divergir, porque e a MESMA fonte.

⚠️ LIMITE CONHECIDO — mudar estes valores EXIGE reinicio do pod. Variavel de
ambiente e fixada na criacao do processo: o kernel nao a reescreve, e o
config-reloader que acompanha o agente so recarrega o config.alloy montado como
volume. MEDIDO: o upstream calcula `checksum/config` sobre
`configMap.content`, que neste chart e vazio (`create: false`, o ConfigMap e
nosso), entao a annotation sai `None` e um `helm upgrade` que muda so estes
valores NAO rola os pods — o agente segue carimbando o id anterior, sem erro.

Nao e regressao: vale igualmente para o config.alloy, que este chart ja entrega
pelo mesmo caminho. E nao e caso corriqueiro — trocar `origin.id` de um ambiente
vivo e migracao de dado, nao ajuste de configuracao: o marcador faz parte da
identidade da serie no destino, entao o valor novo orfana toda serie existente.
Quem faz essa troca reinicia o workload de proposito.

  kubectl rollout restart daemonset/<release>-node deployment/<release>-singleton
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alloy-lerian.envConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy-lerian.labels" . | nindent 4 }}
data:
  ALLOY_CLIENT_ID: {{ include "alloy-lerian.originId" . | quote }}
  ALLOY_DESTINATION_ENDPOINT: {{ include "alloy-lerian.destinationEndpoint" . | quote }}
{{- if .Values.singleton.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alloy-lerian.singletonConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy-lerian.labels" . | nindent 4 }}
    alloy-lerian.lerian.studio/role: singleton
data:
  config.alloy: |
    {{- include "alloy-lerian.config.singleton" . | nindent 4 }}
{{- end }}
