{{- if .Values.global.externalRabbitmqDefinitions.enabled }}
{{- $conn := .Values.global.externalRabbitmqDefinitions.connection }}
{{- if not (has $conn.protocol (list "http" "https")) }}
{{- fail (printf "global.externalRabbitmqDefinitions.connection.protocol must be \"http\" or \"https\" (got %q)" $conn.protocol) }}
{{- end }}
{{- if and (eq $conn.protocol "http") (not $conn.allowInsecureHttp) }}
{{- fail "global.externalRabbitmqDefinitions: protocol \"http\" would send the RabbitMQ admin credentials in cleartext. Use protocol \"https\", or set connection.allowInsecureHttp=true to accept the risk (TLS-less in-cluster/dev brokers only)." }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "br-ccs.fullname" . }}-bootstrap-rabbitmq-definitions
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-ccs.labels" (dict "context" . "component" "bootstrap" "name" "rabbitmq") | nindent 4 }}
  annotations:
    # Hooked alongside the bootstrap Job (earlier weight so it exists first):
    # external RabbitMQ must be provisioned BEFORE the app rolls out.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-2"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
data:
  load_definitions.json: |
{{ .Files.Get "files/rabbitmq/load_definitions.json" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "br-ccs.fullname" . }}-bootstrap-rabbitmq
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-ccs.labels" (dict "context" . "component" "bootstrap" "name" "rabbitmq") | nindent 4 }}
  annotations:
    # Pre-install/pre-upgrade hook: the external RabbitMQ must hold the events
    # exchange and the br-ccs credentials BEFORE the app rolls out. Jobs are
    # immutable, so before-hook-creation replaces the previous run on upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-1"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          env:
            - name: RABBITMQ_HOST
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.portAmqp | quote }}
          command:
            - /bin/sh
            - -c
            - >
              TIMEOUT=300;
              ELAPSED=0;
              echo "Checking $RABBITMQ_HOST:$RABBITMQ_PORT...";
              while ! nc -z "$RABBITMQ_HOST" "$RABBITMQ_PORT"; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for $RABBITMQ_HOST:$RABBITMQ_PORT after ${TIMEOUT}s";
                  exit 1;
                fi;
                echo "$RABBITMQ_HOST:$RABBITMQ_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
                sleep 5;
                ELAPSED=$((ELAPSED + 5));
              done;
              echo "$RABBITMQ_HOST:$RABBITMQ_PORT is ready!";
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: apply-definitions
          # curlimages/curl ships /bin/sh + curl (the jq image is distroless —
          # no shell, so this script cannot run there). Matches the
          # midaz/fetcher/reporter bootstrap convention.
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              set -e

              umask 077
              printf 'user = "%s:%s"\n' "$RABBITMQ_ADMIN_USER" "$RABBITMQ_ADMIN_PASS" > /tmp/curlrc

              CURL_OPTS="-sS"
              if [ "$RABBITMQ_SKIP_TLS_VERIFY" = "true" ]; then
                CURL_OPTS="$CURL_OPTS -k"
                echo "Warning: TLS verification is disabled"
              fi

              if [ "$RABBITMQ_PROTOCOL" = "https" ] && [ "$RABBITMQ_PORT" = "443" ]; then
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST"
              elif [ "$RABBITMQ_PROTOCOL" = "http" ] && [ "$RABBITMQ_PORT" = "80" ]; then
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST"
              else
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST:$RABBITMQ_PORT"
              fi

              echo "=== br-ccs RabbitMQ Bootstrap ==="
              echo "API URL: $BASE_URL"
              echo ""

              # Definitions only carry topology (vhost + exchange). The br-ccs
              # user and its permissions are ensured unconditionally below via
              # idempotent PUTs, so a skipped import can never leave the user
              # without credentials or permissions.
              echo "Checking if the 'events' exchange already exists..."
              EXCHANGE_EXISTS=$(curl $CURL_OPTS -K /tmp/curlrc \
                "$BASE_URL/api/exchanges/%2F/events" 2>/dev/null || echo "not_found")

              if echo "$EXCHANGE_EXISTS" | grep -q '"name":"events"'; then
                echo "RabbitMQ definitions already applied (exchange exists). Skipping definitions import."
              else
                echo "Applying RabbitMQ definitions from file..."
                HTTP_CODE=$(curl $CURL_OPTS -o /tmp/response.txt -w "%{http_code}" \
                  -K /tmp/curlrc \
                  -H "content-type: application/json" \
                  -X POST \
                  --data-binary @/definitions/load_definitions.json \
                  "$BASE_URL/api/definitions")
                if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                  echo "Error applying definitions (HTTP $HTTP_CODE):"
                  cat /tmp/response.txt
                  exit 1
                fi
                echo "Definitions applied successfully."
              fi

              echo "Ensuring RabbitMQ user 'br-ccs' (create or update password)..."
              # JSON-escape the password (backslash + double quote) — no jq in
              # this image, and the value never touches the process list.
              PW_JSON=$(printf '%s' "$RABBITMQ_BR_CCS_PASS" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
              umask 077
              printf '{"password": "%s", "tags": ""}' "$PW_JSON" > /tmp/user.json
              HTTP_CODE=$(curl $CURL_OPTS -o /tmp/response.txt -w "%{http_code}" \
                -K /tmp/curlrc \
                -H "content-type: application/json" \
                -X PUT \
                --data-binary @/tmp/user.json \
                "$BASE_URL/api/users/br-ccs")
              rm -f /tmp/user.json
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "Error updating br-ccs user (HTTP $HTTP_CODE):"
                cat /tmp/response.txt
                exit 1
              fi
              echo "User ensured successfully."

              echo "Ensuring RabbitMQ permissions for 'br-ccs' on vhost '/'..."
              HTTP_CODE=$(curl $CURL_OPTS -o /tmp/response.txt -w "%{http_code}" \
                -K /tmp/curlrc \
                -H "content-type: application/json" \
                -X PUT \
                --data '{"configure":".*","write":".*","read":".*"}' \
                "$BASE_URL/api/permissions/%2F/br-ccs")
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "Error setting br-ccs permissions (HTTP $HTTP_CODE):"
                cat /tmp/response.txt
                exit 1
              fi
              echo "Permissions ensured successfully."

              echo ""
              echo "=== br-ccs RabbitMQ Bootstrap completed successfully ==="
          env:
            - name: RABBITMQ_PROTOCOL
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.protocol | quote }}
            - name: RABBITMQ_HOST
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.port | quote }}
            - name: RABBITMQ_SKIP_TLS_VERIFY
              value: {{ .Values.global.externalRabbitmqDefinitions.connection.skipTlsVerify | default false | quote }}
            - name: RABBITMQ_BR_CCS_PASS
              {{- if .Values.global.externalRabbitmqDefinitions.brCcsCredentials.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.externalRabbitmqDefinitions.brCcsCredentials.useExistingSecret.name | quote }}
                  key: RABBITMQ_BR_CCS_PASS
              {{- else }}
              value: {{ .Values.global.externalRabbitmqDefinitions.brCcsCredentials.password | quote }}
              {{- end }}
            - name: RABBITMQ_ADMIN_PASS
              {{- if .Values.global.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name | quote }}
                  key: RABBITMQ_ADMIN_PASS
              {{- else }}
              value: {{ .Values.global.externalRabbitmqDefinitions.rabbitmqAdminLogin.password | quote }}
              {{- end }}
            - name: RABBITMQ_ADMIN_USER
              {{- if .Values.global.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name | quote }}
                  key: RABBITMQ_ADMIN_USER
              {{- else }}
              value: {{ .Values.global.externalRabbitmqDefinitions.rabbitmqAdminLogin.username | quote }}
              {{- end }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: definitions
              mountPath: /definitions
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: definitions
          configMap:
            name: {{ include "br-ccs.fullname" . }}-bootstrap-rabbitmq-definitions
            items:
              - key: load_definitions.json
                path: load_definitions.json
        - name: tmp
          emptyDir: {}
{{- end }}
