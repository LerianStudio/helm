{{- /* The bundled datastores' passwords outlive the release, like their volumes, so a same-name
   reinstall opens the kept data. Same names and keys as the subcharts' Secrets; lookups run on the
   subchart's values, as theirs did (the parent's namespaceOverride is not the release's). */ -}}
{{- $pg := .Values.postgresql }}
{{- if and (ne (toString $pg.enabled) "false") (not (include "midaz.operatorSecret" (dict "context" $ "subchart" "postgresql"))) }}
{{- if and $pg.ldap.enabled (or $pg.ldap.bind_password $pg.ldap.bindpw) }}
{{- fail "postgresql LDAP needs postgresql.auth.existingSecret: the Secret this chart keeps holds no ldap-password" }}
{{- end }}
{{- $name := include "common.names.dependency.fullname" (dict "chartName" "postgresql" "chartValues" $pg "context" $) }}
{{- $ctx := dict "Values" $pg "Release" $.Release }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "midaz.labels" (dict "context" . "component" "postgresql" "name" "postgresql") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if or $pg.auth.enablePostgresUser $pg.auth.postgresPassword }}
  postgres-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "postgres-password" "providedValues" (list "auth.postgresPassword") "honorProvidedValues" true "chartName" "postgresql" "context" $ctx) }}
  {{- end }}
  {{- if and $pg.auth.username (ne $pg.auth.username "postgres") }}
  password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "password" "providedValues" (list "auth.password") "honorProvidedValues" true "chartName" "postgresql" "context" $ctx) }}
  {{- end }}
  {{- if eq $pg.architecture "replication" }}
  replication-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "replication-password" "providedValues" (list "auth.replicationPassword") "honorProvidedValues" true "chartName" "postgresql" "context" $ctx) }}
  {{- end }}
{{- end }}
{{- $mongo := .Values.mongodb }}
{{- if and (ne (toString $mongo.enabled) "false") $mongo.auth.enabled (not (include "midaz.operatorSecret" (dict "context" $ "subchart" "mongodb"))) }}
{{- if or $mongo.auth.username $mongo.auth.usernames (and $mongo.metrics.enabled $mongo.metrics.username) }}
{{- fail "mongodb custom users and a metrics user need mongodb.auth.existingSecret: the Secret this chart keeps holds the root password only" }}
{{- end }}
{{- $name := include "common.names.dependency.fullname" (dict "chartName" "mongodb" "chartValues" $mongo "context" $) }}
{{- $ctx := dict "Values" $mongo "Release" $.Release }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "midaz.labels" (dict "context" . "component" "mongodb" "name" "mongodb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongodb-root-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "mongodb-root-password" "providedValues" (list "auth.rootPassword") "honorProvidedValues" true "chartName" "mongodb" "context" $ctx) }}
  {{- if eq $mongo.architecture "replicaset" }}
  mongodb-replica-set-key: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "mongodb-replica-set-key" "providedValues" (list "auth.replicaSetKey") "honorProvidedValues" true "chartName" "mongodb" "context" $ctx) }}
  {{- end }}
{{- end }}
