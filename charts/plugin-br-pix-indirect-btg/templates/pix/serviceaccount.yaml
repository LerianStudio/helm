{{- /* Opt-in identity for the pix pod only (the one serving the antifraud credential route),
   so an IAM or Vault grant for the write reaches no other component. */ -}}
{{- if .Values.pix.serviceAccount.create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" .Values.pix.serviceAccount
      "name" (include "plugin-br-pix-indirect-btg.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "plugin-br-pix-indirect-btg.labels" (dict "context" . "name" .Values.pix.name))) }}
{{- end }}
