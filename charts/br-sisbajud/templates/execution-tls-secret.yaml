{{- if .Values.brSisbajud.enabled -}}
{{- $ex := include "br-sisbajud.execution" . | fromYaml -}}
{{- if and $ex.enabled $ex.generate -}}
{{- /* DEV ONLY (refused outside a development-class environment by
   br-sisbajud.validateMensageria): a chart-generated CA + server certificate for
   the execution API listener, reused across upgrades via lookup. Hand ca.crt to
   plugin-br-sisbajud as its Mensageria server CA. Use
   brSisbajud.execution.tls.existingSecret (cert-manager) anywhere else. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ex.tlsSecret }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sisbajud.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- include "br-sisbajud.executionTlsData" . | nindent 2 }}
{{- end -}}
{{- end -}}
