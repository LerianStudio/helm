# =============================================================================
# Plugin BR Pix Lerian — Multi-Component Helm Values
#
# This chart deploys all 14 components of the plugin-br-pix-lerian app:
#
#   spi/api                  Single Person Interface (PIX SPI)
#   spi/systemplane/api      Runtime config plane for SPI
#   adapter-provider-mock/api BTG provider mock (dev/staging only)
#   dict/hub/api             DICT hub (key directory operations)
#   dict/hub/vsync           DICT verification sync worker
#   dict/proxy/api           DICT proxy to BCB
#   dict/systemplane/api     Runtime config plane for DICT
#   cob/hub/api              COB hub (BR Code / charge operations)
#   cob/proxy/api            COB proxy to BCB
#   cob/systemplane/api      Runtime config plane for COB
#   adapter-lerian/api       Lerian provider adapter (br-sfn)
#   adapter-lerian/systemplane/api  Runtime config plane for adapter-lerian
#   pixauto/api              Pix Automático payer side (recurrence authorization)
#   pixauto/systemplane/api  Runtime config plane for Pix Automático
#
# Each component is independently enabled/disabled and configured.
# Each component publishes and pulls its OWN image: the helper
# plugin-br-pix-lerian.componentImage reads only that component's image block,
# and an empty image.tag falls back independently to .Chart.AppVersion. There
# is no shared image and no shared tag key - a global.image.tag set here is
# accepted by the schema and then silently ignored.
#
# Pattern adapted from helm/charts/plugin-access-manager and helm/charts/midaz.
# =============================================================================

# Override the chart name in resource names
nameOverride: ""
fullnameOverride: ""

# Override the namespace where resources are created. Defaults to
# .Release.Namespace (the -n flag passed to helm install).
namespaceOverride: ""

# =============================================================================
# GLOBAL DEFAULTS — applied to all components unless overridden in their block
# =============================================================================
global:
  # -- Image pull secrets propagated to every component when the component's
  # own `imagePullSecrets` list is empty.
  imagePullSecrets: []

  # ---------------------------------------------------------------------------
  # Shared dependency-connection contracts (lerian-common masks read these).
  # A component's own configmap.<KEY> wins; a per-component dedicated block
  # (e.g. spi.datastores.postgres / spi.datastores.redis) overrides the shared
  # value below. Leave empty to keep each component's in-template default.
  # ---------------------------------------------------------------------------
  # -- Datastores shared across components. postgres: consumed by spi/dict-hub
  #    (DB_HOST/DB_USER/DB_NAME/DB_PORT/DB_SSLMODE + replica*). redis: consumed by
  #    adapter-lerian/cob-hub/dict-hub/dict-hub-vsync/pixauto/spi (REDIS_HOST/PORT/
  #    USER/DB/TLS). Example:
  #    datastores:
  #      postgres: { host: "postgres.internal", user: "pixswitch", ssl: "require" }
  #      redis:    { host: "valkey.internal", port: "6379", tls: "true" }
  datastores: {}
  # -- Observability (OTel collector) shared by ALL components: enabled / otlpEndpoint
  #    / deploymentEnvironment -> ENABLE_TELEMETRY / OTEL_EXPORTER_OTLP_ENDPOINT /
  #    OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT. Example:
  #    observability: { enabled: true, otlpEndpoint: "otel-collector:4317" }
  observability: {}
  # -- Auth (plugin-access-manager) shared by ALL components -> PLUGIN_AUTH_ENABLED +
  #    PLUGIN_AUTH_HOST. Example: auth: { enabled: true, host: "http://plugin-access-manager-auth:4000" }
  auth: {}
  # -- Multi-tenant (tenant-manager). Emits MULTI_TENANT_URL + circuit breaker only
  #    when MULTI_TENANT_ENABLED=true. Example: multiTenant: { url: "http://tenant-manager:8080" }
  multiTenant: {}
  # -- Streaming (lib-streaming / RedPanda), consumed by cob-hub/dict-hub/pixauto/spi.
  #    Emits the STREAMING_* subset only when STREAMING_ENABLED=true. Example:
  #    streaming: { brokers: "redpanda:9092", saslMechanism: "SCRAM-SHA-512", saslUsername: "pix" }
  streaming: {}

  # ---------------------------------------------------------------------------
  # External PostgreSQL bootstrap
  # ---------------------------------------------------------------------------
  # When enabled, a Job runs for each database in `databases`, creating the
  # role + database + grants if they don't exist (idempotent).
  #
  # Use cases:
  #   - In-cluster Postgres subchart (postgresql.enabled=true) AND you want
  #     the chart to create the 5 Pix Lerian databases for you. Set
  #     connection.host to the subchart's Service, which is RELEASE-prefixed,
  #     not chart-prefixed: `<release-name>-postgresql`. A release named `pix`
  #     therefore gives `pix-postgresql`; `plugin-br-pix-lerian-postgresql`
  #     does not exist unless the release itself is named that. Only the
  #     subcharts follow the release name — this chart's own Services keep the
  #     `plugin-br-pix-lerian-*` prefix (e.g. plugin-br-pix-lerian-spi).
  #   - External Postgres (RDS, Cloud SQL, etc.) where the operator wants the
  #     chart to provision the role+databases. The admin credentials below
  #     must have privilege to CREATE ROLE / CREATE DATABASE on the target
  #     server.
  #
  # CREDENTIALS:
  #   - postgresAdminLogin: admin user used by the Job to provision objects.
  #     For production, store admin password in an external Secret and set
  #     useExistingSecret.name (the Job reads DB_USER_ADMIN + DB_ADMIN_PASSWORD
  #     from that Secret). Never put real admin passwords in values.yaml.
  #   - pixLerianCredentials: app user the Job creates. Provide the password
  #     through explicit values or an existing Secret. Component DATABASE_URL
  #     values live under component `secrets`, not `configmap`.
  externalPostgresDefinitions:
    enabled: false
    # -- Databases to create (one Job per database). Pix Lerian needs 5.
    databases:
      - pix-spi
      - pix-dict
      - pix-cob
      - pix-adapter-lerian
      - pix-pixauto
    connection:
      host: ""
      port: "5432"
    # -- Postgres admin credentials (used to create role+databases)
    postgresAdminLogin:
      useExistingSecret:
        name: ""   # PRODUCTION: set this, leave password empty
      username: "postgres"
      password: ""   # required when useExistingSecret.name is empty
    # -- Application credentials for the role created by the bootstrap Job
    pixLerianCredentials:
      useExistingSecret:
        name: ""   # PRODUCTION: set this, leave password empty
      username: "pixswitch"
      password: ""

# Port allocation: 4111 and 4112 are intentionally unused. Allocate new
# components from 4118 upward rather than filling the gap.
# =============================================================================
# COMPONENTS
# Each component renders its own Deployment, Service, ConfigMap, Secret, HPA,
# PDB, and (when ingress.enabled=true) Ingress.
# =============================================================================

# -----------------------------------------------------------------------------
# spi/api — PIX SPI service
# -----------------------------------------------------------------------------
spi:
  enabled: true
  name: "spi"
  description: "PIX SPI (Single Person Interface)"
  replicaCount: 1
  revisionHistoryLimit: 10

  image:
    # Defaults to the per-component image published from
    # apps/<path>/Dockerfile by the plugin-br-pix-lerian build pipeline.
    # Override only when pinning to a different registry or fork.
    repository: "ghcr.io/lerianstudio/plugin-br-pix-lerian-spi-api"
    pullPolicy: ""
    tag: ""

  imagePullSecrets: []

  # -- Override container entrypoint (e.g., to dispatch to a specific binary
  # inside a multi-binary image). When empty, the image's ENTRYPOINT is used.
  command: []
  # -- Container args
  args: []

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  pdb:
    enabled: true
    # Set EXACTLY ONE of minAvailable / maxUnavailable (0 is honoured; an
    # explicit null unsets a key). Setting both fails the render.
    # minAvailable: 1
    maxUnavailable: 1

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  service:
    type: ClusterIP
    port: 4101

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}

  readinessProbe:
    path: "/spi/readyz"
  livenessProbe:
    path: "/spi/health"

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  # -- Dedicated datastore connections for this component (override
  #    global.datastores.*). postgres: {host,user,name,port,ssl,replica*};
  #    redis: {host,port,user,db,tls}.
  datastores: {}
  # -- App configuration. PRODUCTIZED: every default now lives in
  #    templates/spi/configmap.yaml as `$cm.<KEY> | default "<value>"`.
  #    Set a KEY here ONLY to override a default; un-enumerated keys pass
  #    through too. Credentials are NOT configmap -- see `secrets` below.
  configmap: {}
  # -- Credentials (never rendered in the ConfigMap). Provide via a
  #    protected values source or useExistingSecret. DATABASE_URL and
  #    VALKEY_URL are composed URIs consumed by the migration Job and the
  #    wait-for-dependencies init container (NOT app-runtime config).
  secrets:
    COB_CLIENT_SECRET: ""
    CRM_CLIENT_SECRET: ""
    DATABASE_URL: ""
    DB_PASSWORD: ""
    DB_REPLICA_PASSWORD: ""
    DICT_CLIENT_SECRET: ""
    IDP_M2M_CLIENT_SECRET: ""
    LICENSE_KEY: ""
    MIDAZ_CLIENT_SECRET: ""
    MULTI_TENANT_SERVICE_API_KEY: ""
    REDIS_PASSWORD: ""
    STREAMING_SASL_PASSWORD: ""
    STREAMING_TLS_CA_CERT: ""
    SYSTEMPLANE_POSTGRES_DSN: ""
    VALKEY_URL: ""
  useExistingSecret: false
  existingSecretName: ""

  extraEnvVars: {}

  # -- golang-migrate Job that applies SQL migrations from the component's
  # /migrations directory against the database referenced by DATABASE_URL.
  # The migrate binary ships in the same image (plugin-br-pix-lerian#143);
  # the chart renders a Job with command [/migrate] overriding the default
  # ENTRYPOINT (/app). Runs as a Helm hook on pre-install + pre-upgrade.
  migrations:
    enabled: true
    # Image path holding the SQL files. Match the Dockerfile's COPY target.
    migrationsPath: /migrations
    ttlSecondsAfterFinished: 300
    backoffLimit: 3

