apiVersion: v2
name: matcher-helm
description: A Helm chart for the Matcher reconciliation service
type: application
annotations:
  lerian.studio/chart-type: multi-component
home: https://github.com/LerianStudio/matcher
sources:
  - https://github.com/LerianStudio/helm/tree/main/charts/matcher
  - https://github.com/LerianStudio/matcher
maintainers:
  - name: "Lerian Studio"
    email: "support@lerian.studio"
version: 3.3.0
appVersion: "6.1.0"
# The health preset's PDB uses unhealthyPodEvictionPolicy, available from Kubernetes 1.27.
kubeVersion: ">=1.27.0-0"
keywords:
  - matcher
  - reconciliation
  - lerian
  - ledger
  - transactions
icon: https://avatars.githubusercontent.com/u/148895005?s=200&v=4
dependencies:
  - name: lerian-common-helm
    version: "2.7.0"
    repository: "oci://ghcr.io/lerianstudio"
  - name: valkey
    version: "2.4.7"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled
  - name: postgresql
    version: "16.3.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: rabbitmq
    version: "2.1.11"
    repository: "https://groundhog2k.github.io/helm-charts"
    condition: rabbitmq.enabled
