# Generated from the CI render fixture plus the telemetry switch; covers the
# modeled ALLOW_INSECURE_OTEL setting resolved by lerian-common.
suite: modeled ALLOW_INSECURE_OTEL
set:
  streamingHub:
    configmap:
      STREAMING_HUB_KAFKA_TLS_ENABLED: 'true'
      STREAMING_HUB_KEK_REF: STREAMING_HUB_KEK
    secrets:
      STREAMING_HUB_POSTGRES_DSN: postgres://ci-only@postgresql:5432/streaming_hub?sslmode=disable
    telemetry:
      enabled: true
tests:
- it: emits the node-local reason by default
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
- it: takes global.observability.allowInsecureOtel env-wide
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
- it: the component configmap wins over the global
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: component reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
    streamingHub:
      configmap:
        ALLOW_INSECURE_OTEL: component reason
- it: an explicit refusal stands as the one entry
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
    streamingHub:
      configmap:
        ALLOW_INSECURE_OTEL: ''
- it: a null global is unset
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    global:
      observability:
        allowInsecureOtel: null
- it: a legacy extraEnvVars entry stands, with no duplicate
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: legacy reason
  set:
    streamingHub:
      extraEnvVars:
        ALLOW_INSECURE_OTEL: legacy reason
- it: a non-empty value in the chart Secret stands (legacy route), with no env entry
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    streamingHub:
      secrets:
        ALLOW_INSECURE_OTEL: secret reason
- it: an empty value in the chart Secret is not a route, so the modeled entry stays
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    streamingHub:
      secrets:
        ALLOW_INSECURE_OTEL: ''
- it: with an existing Secret the chart cannot see the value, so the modeled entry is emitted
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    streamingHub:
      secrets:
        ALLOW_INSECURE_OTEL: secret reason
      useExistingSecret: true
      existingSecretName: app-secret
- it: a refusal in the model wins over a Secret reason
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  set:
    streamingHub:
      secrets:
        ALLOW_INSECURE_OTEL: secret reason
      configmap:
        ALLOW_INSECURE_OTEL: ''
- it: a global value wins over a Secret refusal
  template: templates/all/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  set:
    streamingHub:
      secrets:
        ALLOW_INSECURE_OTEL: 'false'
    global:
      observability:
        allowInsecureOtel: env-wide reason
