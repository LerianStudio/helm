apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fetcher-helm.fullname" . }}-worker
  labels:
    {{- include "fetcher-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
data:
  LICENSE_KEY: {{ .Values.worker.secrets.LICENSE_KEY | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.worker.extraSecretVars }}
  {{- toYaml .Values.worker.extraSecretVars | nindent 2 }}
  {{- end }}
