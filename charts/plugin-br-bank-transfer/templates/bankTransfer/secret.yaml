apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-bank-transfer-helm.fullname" . }}-bankTransfer
  labels:
    {{- include "plugin-br-bank-transfer-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: bankTransfer
type: Opaque
data:
  COURIER_CLIENT_SECRET: {{ .Values.bankTransfer.secrets.COURIER_CLIENT_SECRET | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.bankTransfer.extraSecretVars }}
  {{- toYaml .Values.bankTransfer.extraSecretVars | nindent 2 }}
  {{- end }}
