{{- $h := include "schedule.health" . | fromYaml }}
{{- if $h.pdb }}
{{- include "lerian-common.pdb" (dict
      "pdb" $h.pdb
      "name" (include "schedule.fullname" .)
      "labels" (include "schedule.labels" (dict "context" . "name" .Values.schedule.name))
      "selector" (include "schedule.selectorLabels" (dict "context" . "name" .Values.schedule.name))
    ) }}
{{- end }}
