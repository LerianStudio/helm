{{- if and .Values.migrations.enabled (not .Values.migrations.useExistingSecret) (include "br-slc-migrations.chartOwnsPassword" .) }}
# Dedicated PreSync Secret carrying only the Postgres password for the migration
# Job. PreSync hooks run BEFORE the main sync wave, so on a first install the
# app Secret THIS CHART creates does not exist yet. This hook Secret (weight -2)
# is created before the migration Job (weight -1). hook-delete-policy is
# BeforeHookCreation ONLY (not HookSucceeded) so it survives the whole PreSync
# phase for the Job to read; it is replaced at the next sync.
#
# Minted ONLY when the chart actually holds a password to put in it — see
# br-slc-migrations.chartOwnsPassword. Two cases skip it, and the Job is pointed
# elsewhere by br-slc-migrations.secretName (same helper pair, so the mint
# condition and the Job's secretKeyRef cannot disagree):
#
#   migrations.useExistingSecret=true  -> migrations.existingSecretName
#   secrets.create=false (BYOC default) -> secrets.existingSecretName, which is
#       operator-managed and ALREADY EXISTS before PreSync, so the ordering
#       problem this hook Secret solves does not apply.
#
# That second case is why the guard exists: without it the chart minted this
# Secret with an EMPTY POSTGRES_PASSWORD at its own defaults (secrets.create is
# false, so secrets.data.POSTGRES_PASSWORD is ""), and the migration Job then
# authenticated with "" — failing PreSync and blocking the entire ArgoCD sync.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-slc-migrations.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-slc-migrations.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.migrations.postgres.password | default .Values.secrets.data.POSTGRES_PASSWORD | quote }}
{{- end }}
