# Default values for br-ccs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Env-var coverage note: every variable in the application's config/.env.example
# is mapped either into brCcs.configmap (non-secret) or brCcs.secrets
# (credentials / keys), or is provided by a bundled subchart. Operational tuning
# knobs that ship with lib-commons / systemplane defaults are exposed as
# optional entries and can be set under brCcs.configmap as needed.
nameOverride: "br-ccs"
fullnameOverride: ""
namespaceOverride: ""
global:
  # -- Bootstrap job for external PostgreSQL: creates databases, roles, and grants privileges
  externalPostgresDefinitions:
    # -- Enable or disable the PostgreSQL bootstrap job
    enabled: false
    # -- PostgreSQL connection settings
    connection:
      # -- PostgreSQL host
      host: "br-ccs-postgresql-primary"
      # -- PostgreSQL port
      port: "5432"
    # -- Admin credentials for PostgreSQL
    postgresAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing DB_USER_ADMIN and DB_ADMIN_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "postgres"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for the br-ccs role created by the job
    brCcsCredentials:
      useExistingSecret:
        # -- Name of existing secret containing DB_PASSWORD_BR_CCS key
        name: ""
      # -- Password for the br-ccs role (ignored if useExistingSecret.name is set)
      password: ""
  # -- Bootstrap job for external RabbitMQ: creates users, vhosts, and permissions
  externalRabbitmqDefinitions:
    # -- Enable or disable the RabbitMQ bootstrap job
    enabled: false
    # -- RabbitMQ connection settings
    connection:
      # -- RabbitMQ protocol (http or https)
      protocol: "http"
      # -- RabbitMQ host (management API endpoint)
      host: "br-ccs-rabbitmq"
      # -- RabbitMQ HTTP management port
      port: "15672"
      # -- RabbitMQ AMQP port (for connectivity check)
      portAmqp: "5672"
      # -- Skip TLS verification for self-signed certificates (not recommended for production)
      skipTlsVerify: false
    # -- Admin credentials for RabbitMQ management API
    rabbitmqAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing RABBITMQ_ADMIN_USER and RABBITMQ_ADMIN_PASS keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "admin"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for the br-ccs user created by the job
    brCcsCredentials:
      useExistingSecret:
        # -- Name of existing secret containing RABBITMQ_BR_CCS_PASS key
        name: ""
      # -- Password for the br-ccs user (ignored if useExistingSecret.name is set)
      password: ""
  # -- Env-wide observability, consumed by lerian-common.otel.env. Declare once at
  # the umbrella level; a component brCcs.configmap.<KEY> still overrides per-service.
  # Precedence: brCcs.configmap.<KEY> > global.observability.<field> > chart default.
  observability:
    # -- Enable telemetry export (ENABLE_TELEMETRY). Unset → chart default "false".
    enabled: false
    # -- OTLP collector endpoint (OTEL_EXPORTER_OTLP_ENDPOINT). Unset → chart default "".
    otlpEndpoint: ""
    # -- Deployment environment tag (OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT). Unset → "production".
    deploymentEnvironment: "production"
  # -- Env-wide datastore mask, consumed by lerian-common.datastore.value. Declare a
  # SHARED instance once here; a DEDICATED per-service instance goes under
  # brCcs.datastores; a component brCcs.configmap.<KEY> still overrides everything.
  # Precedence: brCcs.configmap.<KEY> > brCcs.datastores.<type>.<field>
  #             > global.datastores.<type>.<field> > chart default.
  # Leave empty ({}) to keep the bundled-subchart / native-key defaults.
  datastores: {}
    # postgres:
    #   host: ""          # POSTGRES_HOST (host only; required when the subchart is off)
    #   port: "5432"      # POSTGRES_PORT
    #   user: "br-ccs"    # POSTGRES_USER
    #   ssl: "require"    # POSTGRES_SSLMODE
    #   replicaHost: ""   # POSTGRES_REPLICA_HOST (enables the replica block when set)
    # redis:
    #   host: ""          # REDIS_HOST (host:port; required when the subchart is off)
    # broker:
    #   host: ""          # RABBITMQ_HOST
    #   port: "5672"      # RABBITMQ_PORT_AMQP
    #   user: "br-ccs"    # RABBITMQ_DEFAULT_USER
  # -- Env-wide multi-tenant infra (tenant-manager URL + its Redis), consumed by
  # lerian-common.multiTenant.env. Declare once; a component brCcs.configmap.<KEY>
  # still overrides. Only consulted when multi-tenancy is enabled (see
  # brCcs.multiTenant.enabled). Leave empty ({}) for the native-key / chart defaults.
  multiTenant: {}
    # url: ""             # MULTI_TENANT_URL (required when MT enabled)
    # redisHost: ""       # MULTI_TENANT_REDIS_HOST (required when MT enabled)
    # redisPort: "6379"   # MULTI_TENANT_REDIS_PORT
    # redisTls: "false"   # MULTI_TENANT_REDIS_TLS
brCcs:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- Multi-tenancy toggle (grouped API for MULTI_TENANT_ENABLED). The tenant-manager
  # URL + Redis infra come from global.multiTenant (or brCcs.configmap.MULTI_TENANT_*).
  # Precedence for the toggle: brCcs.configmap.MULTI_TENANT_ENABLED > brCcs.multiTenant.enabled > "false".
  multiTenant:
    # -- Enable multi-tenancy (MULTI_TENANT_ENABLED)
    enabled: false
  # -- Dedicated datastore mask for THIS service (see global.datastores for the shared
  # form + precedence). Same fields as global.datastores; wins over global, loses to
  # brCcs.configmap.<KEY>. Leave empty ({}) to keep the bundled-subchart / native defaults.
  datastores: {}
  # -- Service name
  name: br-ccs
  # -- Enable or disable the br-ccs service
  enabled: true
  # -- Number of replicas for the br-ccs service
  replicaCount: 2
  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10
  image:
    # -- Repository for the br-ccs service container image
    repository: ghcr.io/lerianstudio/br-ccs
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "1.0.0"
  # -- PostgreSQL migrations job (Helm hook; ArgoCD PreSync for external PG,
  # PostSync for the bundled subchart). Runs the dedicated br-ccs-migrations
  # image (golang-migrate runner; the app image never migrates). The
  # chart-managed Secret is rendered as an earlier hook so it exists before the
  # migration hook — migrations run against the chart-managed Secret with NO
  # pre-existing Secret required. Set useExistingSecret only to read
  # POSTGRES_PASSWORD from an operator-provisioned Secret instead.
  migrations:
    # -- Enable or disable the migrations job.
    enabled: true
    # -- Optional. When true, migrations read POSTGRES_PASSWORD from a pre-existing
    # Secret (existingSecretName) instead of the chart-managed Secret hook.
    useExistingSecret: false
    # -- Name of the pre-existing Secret containing POSTGRES_PASSWORD
    # (only used when useExistingSecret=true).
    existingSecretName: ""
    # -- MIGRATIONS_PATH inside the migrations image (embedded at /migrations).
    path: "/migrations"
    image:
      # -- Repository for the migrations runner image
      repository: ghcr.io/lerianstudio/br-ccs-migrations
      # -- Tag for the migrations image. Defaults to the app image tag
      # (brCcs.image.tag, or the chart appVersion) when left empty.
      tag: ""
      # -- Image pull policy
      pullPolicy: IfNotPresent
    # -- Maximum number of retries before the Job is considered failed
    backoffLimit: 3
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  # -- Pod annotations for additional metadata
  podAnnotations: {}
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    # -- Defines the group ID for the user running the process inside the container
    runAsGroup: 1000
    # -- Defines the user ID for the process running inside the container
    runAsUser: 1000
    # -- Ensures the process does not run as root
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
    # -- Defines the root filesystem as read-only
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
  # -- PodDisruptionBudget configuration
  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Minimum number of available pods
    minAvailable: 1
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Annotations for the PodDisruptionBudget
    annotations: {}
  # -- Deployment update strategy
  deploymentUpdate:
    # -- Type of deployment strategy
    type: RollingUpdate
    # -- Maximum number of pods that can be created over the desired number of pods
    maxSurge: 100%
    # -- Maximum number of pods that can be unavailable during the update
    maxUnavailable: 0
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Port for the HTTP API
    port: 4030
    annotations: {}
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 1500m
      memory: 512Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 2
    # -- Maximum number of replicas
    maxReplicas: 5
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: []
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Host aliases for custom DNS resolution inside the pod
  hostAliases: []
  # -- Raw ConfigMap env-var escape hatch. The clean, grouped API lives in the
  # brCcs.<group> blocks below (server, cors, postgres, redis, broker, outbox,
  # fetcher, sta, reporter, swagger, rateLimit, pagination, observability, m2m,
  # readiness, shutdown, objectStorage) — each key resolves via cfgValue:
  #   brCcs.configmap.<NATIVE_KEY> (here) > brCcs.<group>.<field> > chart default.
  # Set a raw NATIVE_KEY here only to override a value not exposed as a grouped
  # field, or to pass an optional/opt-in key (e.g. SERVER_TLS_CERT_FILE,
  # RABBITMQ_QUEUE, FETCHER_URL, *_OAUTH2_*, CCS_DETAIL_*). Defaults live in the
  # template, so leaving this {} renders the documented defaults.
  # @default -- templates/configmap.yaml
  configmap: {}
  # -- Application identity: name / env / version / logLevel / deploymentMode / runMode
  app: {}
  # -- HTTP server: address / port / grpcPort / bodyLimitBytes / tlsTerminatedUpstream / trustedProxies
  server: {}
  # -- CORS: allowedOrigins / allowedMethods / allowedHeaders / exposeHeaders / allowCredentials
  cors: {}
  # -- PostgreSQL tuning (host/port/user/ssl come from datastores): name / migrationsPath /
  #    systemplaneEnabled / maxOpenConns / maxIdleConns / connMaxLifetimeMins / connMaxIdleTimeMins /
  #    connectTimeoutSec / infraConnectTimeoutSec
  postgres: {}
  # -- Redis tuning (host from datastores): db / protocol / poolSize / minIdleConns / readTimeout /
  #    writeTimeout / dialTimeout / poolTimeout / maxRetries / minRetryBackoff / maxRetryBackoff
  redis: {}
  # -- RabbitMQ (host/port/user from datastores): enabled / circuitBreakerEnabled / portHost / vhost /
  #    exchange / requireHealthAllowedHosts / allowInsecureHealthCheck / allowInsecureTls /
  #    publisherConfirmTimeoutMs / publisherRecoveryInitialMs / publisherRecoveryMaxMs /
  #    publisherMaxRecoveries / staDlqTtlSeconds
  broker: {}
  # -- Outbox: enabled / tableName / dispatchIntervalSec / batchSize / publishMaxAttempts /
  #    publishBackoffMs / retryWindowSec / maxDispatchAttempts / processingTimeoutSec /
  #    maxFailedPerBatch / includeTenantMetrics / allowEmptyTenant
  outbox: {}
  # -- Fetcher integration: enabled / httpTimeoutSec / ccsOutboxDispatchIntervalMs /
  #    ccsOutboxBatchSize / ccsOutboxMaxAttempts / ccsOutboxDlqRoutingKey
  fetcher: {}
  # -- STA integration: enabled / httpTimeoutSec
  sta: {}
  # -- Reporter integration: enabled / httpTimeoutSec
  reporter: {}
  # -- Swagger: enabled / title / version / basePath / leftDelim / rightDelim
  swagger: {}
  # -- Rate limiting: enabled / max / windowSec / aggressiveMax / aggressiveWindowSec /
  #    relaxedMax / relaxedWindowSec / exportMax / exportWindowSec / dispatchMax /
  #    dispatchWindowSec / allowFailOpen
  rateLimit: {}
  # -- Pagination: limit / monthDateRange
  pagination: {}
  # -- Observability: dbMetricsIntervalSec / idempotencyRetryWindowSec
  observability: {}
  # -- M2M (non-secret): credentialCacheTtlSec / awsRegion
  m2m: {}
  # -- Readiness / startup probes: probeTimeoutSec / depSlowThresholdMs / startupMaxDurationSec /
  #    startupInitialDelayMs / startupMaxDelayMs
  readiness: {}
  # -- Graceful shutdown: drainGracePeriodSec / totalTimeoutSec
  shutdown: {}
  # -- Object storage (non-secret): seaweedfsS3Port / seaweedfsMasterPort / {sta,ccs,fetcher}{Endpoint,
  #    Region,Bucket,UsePathStyle,DisableSsl} / outboundRetentionDays / accs009RetentionDays
  objectStorage:
    staBucket: "sta-files"
    ccsBucket: "lerian-ccs"
    fetcherBucket: "lerian-fetcher"

  # -- Secrets for storing sensitive data. Provide real values via an existing
  # Secret (useExistingSecret) or a secrets manager — NEVER commit real values.
  # @default -- templates/secrets.yaml
  secrets:
    # PostgreSQL credentials
    POSTGRES_PASSWORD: ""
    # POSTGRES_REPLICA_PASSWORD: ""

    # Redis / Valkey password
    REDIS_PASSWORD: ""
    # REDIS_CA_CERT: ""

    # Multi-tenant (tenant-manager) secrets
    # MULTI_TENANT_SERVICE_API_KEY: ""
    # MULTI_TENANT_REDIS_PASSWORD: ""
    # MULTI_TENANT_REDIS_CA_CERT: ""

    # RabbitMQ credentials (when RABBITMQ_ENABLED=true)
    # RABBITMQ_DEFAULT_PASS: ""
    # RABBITMQ_URL — full amqp:// dial string (embeds the password; any '@' in
    # the password must be percent-encoded as %40). When set, the app dials via
    # this instead of assembling from RABBITMQ_HOST/PORT/USER/PASS.
    # RABBITMQ_URL: ""

    # Crypto keys (REQUIRED in production)
    # CCS_CRYPTO_MASTER_KEY — AES-256-GCM master key, 64 hex chars (openssl rand -hex 32).
    # FETCHER_CRYPTO_KEY — Fetcher snapshot decryption key (base64; same as Fetcher APP_ENC_KEY).
    CCS_CRYPTO_MASTER_KEY: ""
    FETCHER_CRYPTO_KEY: ""
    # STA_EVENT_HMAC_MASTER_KEYS — STA business-event HMAC master-key catalogue,
    # format "v1:<hex>,v2:<hex>" (hex per version; must match the key/version the
    # br-sta business publisher signs with). Only consumed when
    # STA_EVENT_HMAC_VERIFY_ENABLED=true; leave empty while verification is off.
    # STA_EVENT_HMAC_MASTER_KEYS: ""

    # License (lib-license-go) — validated at boot against the Lerian license
    # gateway (fail-closed). ORGANIZATION_IDS selects enforcement scope (e.g.
    # "global"). Held as a Secret; wire via a secrets manager or existing Secret.
    # LICENSE_KEY: ""
    # ORGANIZATION_IDS: ""

    # Object storage credentials (per bucket)
    OBJECT_STORAGE_STA_ACCESS_KEY: ""
    OBJECT_STORAGE_STA_SECRET_KEY: ""
    OBJECT_STORAGE_CCS_ACCESS_KEY: ""
    OBJECT_STORAGE_CCS_SECRET_KEY: ""
    OBJECT_STORAGE_FETCHER_ACCESS_KEY: ""
    OBJECT_STORAGE_FETCHER_SECRET_KEY: ""

    # Per-upstream M2M API keys (on-prem / local literal-Bearer fallback)
    # FETCHER_API_KEY: ""
    # REPORTER_API_KEY: ""
    # STA_API_KEY: ""

    # Per-upstream M2M OAuth2 client credentials (single-tenant) — the client_id/client_secret
    # pair that authenticates br-ccs to each upstream (Fetcher / Reporter / STA) via
    # the plugin-auth token endpoint. Multi-tenant (SaaS) resolves per-tenant credentials
    # from AWS Secrets Manager instead. Held as a Secret; wire via a secrets manager or
    # existing Secret.
    # FETCHER_CLIENT_ID: ""
    # FETCHER_CLIENT_SECRET: ""
    # REPORTER_CLIENT_ID: ""
    # REPORTER_CLIENT_SECRET: ""
    # STA_CLIENT_ID: ""
    # STA_CLIENT_SECRET: ""

  # -- Existing secrets name
  useExistingSecret: false
  existingSecretName: ""
  # -- Extra environment variables (map of key: value pairs) — escape hatch for
  # optional knobs not modeled above (e.g. RELATIONSHIP_SOURCE_*, CCS_REPORTER_POLL_*).
  extraEnvVars: {}
  serviceAccount:
    # -- Specifies whether a ServiceAccount should be created
    create: true
    # -- Annotations for the ServiceAccount
    annotations: {}
    # -- Name of the service account
    # @default -- `br-ccs.fullname`
    name: ""
# Valkey (Redis-compatible) configuration
valkey:
  enabled: true
  global:
    security:
      allowInsecureImages: false
  image:
    repository: bitnami/valkey
    tag: "8.0.2"
  external: false
  architecture: standalone
  auth:
    enabled: true
    password: ""
  primary:
    kind: Deployment
    resourcesPreset: "medium"
    persistence:
      enabled: false
    extraFlags:
      - "--maxmemory 640mb"
      - "--maxmemory-policy allkeys-lru"
      - "--hz 100"
      - "--maxclients 10000"
# PostgreSQL configuration
postgresql:
  enabled: true
  global:
    security:
      allowInsecureImages: false
  image:
    repository: bitnami/postgresql
    tag: "17.4.0"
  external: false
  architecture: standalone
  auth:
    enabled: true
    enablePostgresUser: true
    postgresPassword: ""
    username: "br-ccs"
    password: ""
    database: "br-ccs"
  primary:
    persistence:
      size: 8Gi
    resourcesPreset: large
    extraEnvVars:
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "500"
      - name: POSTGRESQL_TCP_KEEPALIVES_IDLE
        value: "30"
      - name: POSTGRESQL_TCP_KEEPALIVES_INTERVAL
        value: "10"
      - name: POSTGRESQL_TCP_KEEPALIVES_COUNT
        value: "5"
# RabbitMQ configuration (optional - disabled by default)
rabbitmq:
  enabled: false
  image:
    tag: "3.13.6"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  authentication:
    user:
      value: "br-ccs"
    password:
      value: ""
    erlangCookie:
      # Operators MUST supply a stable cookie (e.g. openssl rand -base64 32) when rabbitmq.enabled=true.
      value: ""
  extraSecrets:
    - name: "br-ccs-rabbitmq-load-definition"
      mountPath: /etc/rabbitmq/definitions
  customConfig: |
    management.load_definitions = /etc/rabbitmq/definitions/load_definition.json

