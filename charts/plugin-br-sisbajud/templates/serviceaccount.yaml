{{- if and .Values.sisbajud.enabled .Values.sisbajud.serviceAccount.create -}}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" .Values.sisbajud.serviceAccount
      "name" (include "plugin-br-sisbajud.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "plugin-br-sisbajud.labels" (dict "context" $ "component" "sisbajud"))) }}
automountServiceAccountToken: false
{{- end -}}
