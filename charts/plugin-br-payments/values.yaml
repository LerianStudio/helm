# Default values for plugin-br-payments.
# This is a YAML-formatted file.
#
# Runtime model: ONE Deployment, ONE pod, ONE process (the /app binary with
# SERVICE_TYPE=both, the default). HTTP server, reconciliation worker, outbox
# dispatcher, and webhook delivery all run as goroutines inside the same
# process. There is NO separate worker Deployment.

# -- Override the chart top-level name
nameOverride: "plugin-br-payments"
# -- Override the fully generated name
fullnameOverride: ""
# -- Override the namespace used by templates
namespaceOverride: ""

global:
  # ============================================================================
  # ENV-WIDE CONTRACT (lerian-common masks). Set a connection ONCE here; the
  # ConfigMap emits the application's native keys from it. Empty by default, so
  # every key falls through to the chart default. app.configmap.<KEY> always wins,
  # and `datastores:` (top level) overrides these for this chart only.
  # ============================================================================
  # -- Environment name (ENV_NAME). "production" when unset.
  env: {}
  #   name: "production"
  # -- Shared datastore masks. postgres: host / port / user / name / ssl / replicaHost.
  datastores: {}
  #   postgres: { host: "postgresql.internal", port: "5432", user: "plugin_br_payments", name: "plugin_br_payments", ssl: "require" }
  # -- plugin-access-manager: enabled / host (PLUGIN_AUTH_ENABLED / PLUGIN_AUTH_ADDRESS).
  auth: {}
  #   enabled: "true"
  #   host: "http://plugin-access-manager-auth.plugin-access-manager.svc.cluster.local:4000"
  # -- OpenTelemetry: enabled / otlpEndpoint / deploymentEnvironment.
  observability: {}
  #   enabled: "true"
  #   otlpEndpoint: "otel-collector-lerian:4317"
  #   deploymentEnvironment: "production"
  # -- Tenant-manager: enabled / url (MULTI_TENANT_ENABLED / MULTI_TENANT_URL).
  multiTenant: {}
  #   enabled: "true"
  #   url: "http://tenant-manager.tenant-manager.svc.cluster.local:4003"
  # -- Managed-cloud topology preset (aws | gcp | azure): TLS/SSL defaults for the masks.
  cloud: ""

  # -- Bootstrap job for external PostgreSQL: creates database and role
  externalPostgresDefinitions:
    # -- Enable or disable the PostgreSQL bootstrap job
    enabled: false
    # -- DEPRECATED / unused by any template: the bootstrap job
    # (templates/bootstrap-postgres.yaml) and the control-plane migrations
    # Job (templates/controlplane-migrations.yaml) both read the connection
    # endpoint from app.configmap.POSTGRES_HOST/POSTGRES_PORT instead — the
    # same source templates/deployment.yaml uses — so the two PreSync Jobs
    # can never provision against a different host than the app connects to.
    # Retained only for backward compatibility with existing overlays; set
    # app.configmap.POSTGRES_HOST/POSTGRES_PORT to your external instance.
    connection:
      # -- PostgreSQL host
      host: "plugin-br-payments-postgresql-primary"
      # -- PostgreSQL port
      port: "5432"
    # -- Admin (superuser) credentials used to create the application DB and role
    postgresAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing DB_USER_ADMIN and DB_ADMIN_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "postgres"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for the plugin_br_payments role created by the job
    paymentsCredentials:
      useExistingSecret:
        # -- Name of existing secret containing DB_PASSWORD_PLUGIN_BR_PAYMENTS key
        name: ""
      # -- Password for plugin_br_payments role (ignored if useExistingSecret.name is set)
      password: ""

# -- Datastore masks for THIS chart only (override global.datastores). Same fields.
datastores: {}
#   postgres: { host: "payments-db.internal", ssl: "require" }

# ==============================================================================
# APPLICATION
# Single Deployment running the /app binary with SERVICE_TYPE=both.
# Combines HTTP API + reconciliation worker + outbox dispatcher + webhook
# delivery in one process.
# ==============================================================================
app:
  # -- Service name
  name: "plugin-br-payments"
  # -- Number of replicas
  replicaCount: 2
  # -- Number of old ReplicaSets to retain for rollback
  revisionHistoryLimit: 10
  # -- Annotations applied to the Deployment resource
  annotations: {}
  # -- Annotations applied to the pods
  podAnnotations: {}
  image:
    # -- Repository for the plugin-br-payments image
    repository: ghcr.io/lerianstudio/plugin-br-payments
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag (defaults to Chart.appVersion if empty)
    tag: ""
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  # -- Override of the resource name
  nameOverride: ""
  # -- Override of the fully qualified resource name
  fullnameOverride: ""
  # -- Termination grace period.
  # The /readyz contract requires this to be 60 (drain grace + App.Shutdown budget).
  # See applications/plugins/plugin-br-payments/docs/readyz-guide.md
  terminationGracePeriodSeconds: 60
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context (Distroless nonroot UID/GID is 65532)
  securityContext:
    runAsGroup: 65532
    runAsUser: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
  # -- PodDisruptionBudget configuration
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""
    annotations: {}
  # -- Deployment strategy
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  # -- Ingress configuration
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
  # -- Resource requests and limits.
  # Reconciliation runs in-process so the limit accounts for both API + worker work.
  resources:
    limits:
      cpu: 1500m
      memory: 768Mi
    requests:
      cpu: 250m
      memory: 384Mi
  # -- HorizontalPodAutoscaler configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
  # -- Readiness probe configuration. Canonical values from
  # applications/plugins/plugin-br-payments/docs/readyz-guide.md
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 2
  # -- Liveness probe configuration. Canonical values from the same guide.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: []
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Host aliases for custom DNS resolution inside the pod
  hostAliases: []
  # -- ConfigMap (non-sensitive environment variables)
  # @default -- templates/configmap.yaml
  # -- Per-key overrides of the ConfigMap. The ConfigMap is TEMPLATE-OWNED
  # (templates/configmap.yaml): it renders every key plugin-br-payments reads, each
  # either with a chart default or only when set here, and values.schema.json
  # refuses a key the chart does not render. Connection endpoints are better set
  # once in the `global:` block (datastores / auth / observability / multiTenant);
  # a key here always wins over those masks. A null counts as unset. The full key
  # list, with defaults, is in README.md ("Configuration keys").
  #
  # Required: BTG_API_BASE_URL, BTG_AUTH_URL, MIDAZ_LEDGER_URL. With
  # MULTI_TENANT_ENABLED=true also MULTI_TENANT_URL and AWS_REGION.
  configmap: {}
    # BTG_API_BASE_URL: "https://api.btgpactual.com"
    # BTG_AUTH_URL: "https://id.btgpactual.com/oauth2/token"
    # MIDAZ_LEDGER_URL: "http://midaz-ledger.midaz.svc.cluster.local:3002/v1"
    # MIDAZ_CRM_URL: "http://midaz-crm.midaz.svc.cluster.local:4003/v1"
    # MIDAZ_DEFAULT_ORG_ID: ""
    # MIDAZ_DEFAULT_LEDGER_ID: ""
    # MULTI_TENANT_ENABLED: "true"
    # AWS_REGION: "us-east-2"
    # Bill consult route limit per (tenantId, sub), in-process. Not the AGGRESSIVE_*
    # tier; RATE_LIMIT_ENABLED does not turn it off. Unset = app default (100 / 60s).
    # CONSULT_RATE_LIMIT_MAX: "100"
    # CONSULT_RATE_LIMIT_WINDOW_SEC: "60"

  # -- Per-key Secret values, each rendered only when set (templates/secrets.yaml).
  # Required: POSTGRES_PASSWORD, INTERNAL_API_KEY (>= 32 chars) and
  # CREDENTIAL_ENCRYPTION_KEY when SERVICE_TYPE runs the worker ("both"/"worker");
  # PROVIDER_CLIENT_ID and PROVIDER_CLIENT_SECRET in single-tenant mode (resolved
  # per tenant otherwise); MULTI_TENANT_SERVICE_API_KEY in multi-tenant mode;
  # CONSULT_AUDIT_HMAC_KEY when SERVICE_TYPE serves the API ("both"/"api").
  # Also accepted: POSTGRES_REPLICA_PASSWORD, BTG_WEBHOOK_HMAC_SECRET,
  # INTERNAL_API_KEY_PREVIOUS, CREDENTIAL_ENCRYPTION_KEY_PREVIOUS, LICENSE_KEY,
  # PLUGIN_AUTH_CLIENT_ID, PLUGIN_AUTH_CLIENT_SECRET.
  secrets: {}
    # POSTGRES_PASSWORD: ""
    # PROVIDER_CLIENT_ID: ""
    # PROVIDER_CLIENT_SECRET: ""
    # INTERNAL_API_KEY: ""            # openssl rand -hex 32
    # CREDENTIAL_ENCRYPTION_KEY: ""   # openssl rand -base64 32
    # Bill consult audit: HMAC key of the line fingerprint (line_fp). REQUIRED for
    # SERVICE_TYPE "both"/"api": the app refuses to boot without it. >= 32 chars, no
    # leading/trailing whitespace; production refuses the published example
    # placeholders. Outside local, source it from the platform secret manager.
    # Rotating it is a restart, but older line_fp values stop correlating (there is
    # no _PREVIOUS key).
    # CONSULT_AUDIT_HMAC_KEY: ""      # openssl rand -hex 32

  # -- Use an externally managed Secret instead of generating one
  useExistingSecret: false
  # -- Name of the externally managed Secret
  existingSecretName: ""
  # -- Extra environment variables (map of key:value pairs)
  extraEnvVars: {}
  # -- ServiceAccount configuration
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  # -- Control-plane migrations PreSync Job (ADR-013, plugin-br-payments repo).
  # See templates/controlplane-migrations.yaml for the full render gate.
  # @default -- templates/controlplane-migrations.yaml
  controlplaneMigrations:
    # -- Enable the Job. Default OFF: app.image resolves to the currently
    # released plugin-br-payments image, which does NOT yet contain the
    # /controlplane-migrate binary (still on an unmerged branch). Do not set
    # true until a plugin-br-payments release containing the binary is
    # deployed — see CHANGELOG.md. The Job renders only when all three are
    # true: app.configmap.MULTI_TENANT_ENABLED=true, the chart's own
    # "postgresql.enabled" helper resolves to "false" (the bundled database
    # is disabled), and this controlplaneMigrations.enabled=true. It does not
    # depend on global.externalPostgresDefinitions.enabled: that separate flag
    # controls database/role bootstrap and may remain false for an existing
    # external database. See
    # templates/controlplane-migrations.yaml's header comment for why each
    # condition exists. Independently of this gate,
    # plugin-br-payments.validatePostgresExclusivity fails the whole render
    # with fail() if postgresql.enabled/postgresql.external are set to the
    # contradictory bundled-and-external combination.
    enabled: false
    # -- Resource requests and limits for the migrations Job. Deliberately
    # smaller than app.resources: this runs once, briefly, not steady-state
    # API/worker traffic.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# ==============================================================================
# POSTGRESQL SUB-CHART (Bitnami)
# Default: enabled with replication for in-cluster development/staging.
# Production: set postgresql.enabled=false and configure
#   global.externalPostgresDefinitions for an externally managed Postgres.
# ==============================================================================
postgresql:
  enabled: true
  external: false
  global:
    security:
      # Bitnami moved free images to bitnamisecure / bitnamilegacy in 2025;
      # the upstream Bitnami chart treats those repos as "non-standard" and
      # blocks them unless this flag is set. Required for fresh installs.
      allowInsecureImages: true
  image:
    repository: bitnamisecure/postgresql
    tag: "latest"
    # latest (PostgreSQL 18.6.0), pinned: PostgreSQL refuses a data directory of another major.
    digest: "sha256:7045d816bdf7e704f0f662fabf243f3c0a975aa380e73e4e881ee94740f60d4f"
  architecture: replication
  replication:
    numSynchronousReplicas: 1
  auth:
    enabled: true
    enablePostgresUser: true
    postgresPassword: ""
    username: "plugin_br_payments"
    password: ""
    database: "plugin_br_payments"
    replicationUsername: "replicator"
    replicationPassword: ""
  primary:
    persistence:
      size: 8Gi
    resourcesPreset: "medium"
    extendedConfiguration: |
      shared_buffers = 512MB
      max_wal_senders = 20
      wal_keep_size = 512MB
      max_replication_slots = 20
    extraEnvVars:
      - name: POSTGRESQL_WAL_LEVEL
        value: "logical"
      - name: POSTGRESQL_HOST_STANDBY
        value: "on"
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "200"
      - name: POSTGRESQL_TCP_KEEPALIVES_IDLE
        value: "30"
      - name: POSTGRESQL_TCP_KEEPALIVES_INTERVAL
        value: "10"
      - name: POSTGRESQL_TCP_KEEPALIVES_COUNT
        value: "5"
  readReplicas:
    name: replication
    replicaCount: 1
    persistence:
      size: 8Gi
    resourcesPreset: "medium"
    extendedConfiguration: |
      shared_buffers = 512MB
      max_wal_senders = 20
      max_replication_slots = 20
      wal_keep_size = 512MB
    extraEnvVars:
      - name: POSTGRESQL_WAL_LEVEL
        value: "logical"
      - name: POSTGRESQL_HOST_STANDBY
        value: "on"
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "200"
      - name: POSTGRESQL_TCP_KEEPALIVES_IDLE
        value: "40"
      - name: POSTGRESQL_TCP_KEEPALIVES_INTERVAL
        value: "10"
      - name: POSTGRESQL_TCP_KEEPALIVES_COUNT
        value: "5"

# ==============================================================================
# OPTIONAL OTEL COLLECTOR INTEGRATION
# Setting otel-collector-lerian.enabled=true causes the deployment to inject
# HOST_IP/OTEL_EXPORTER_OTLP_ENDPOINT pointing at the host node's collector.
# Mirrors the convention used by reporter, plugin-fees, and pix-indirect-btg.
# ==============================================================================
otel-collector-lerian:
  enabled: false

# ==============================================================================
# AWS AUTHENTICATION - IAM Roles Anywhere for non-AWS clusters (e.g. Proxmox)
# Enable when the deployment target has no native AWS credential mechanism
# (no IRSA, no static keys) but the app still needs to call AWS Secrets
# Manager for the per-tenant integrations bundle (MULTI_TENANT_CREDENTIAL_SOURCE=vault).
# An aws-signing-helper sidecar exchanges an X.509 client cert (provisioned by
# the GitOps deploy as a cert-manager Certificate, see helm-deploy docs) for
# temporary AWS credentials served on a local metadata endpoint the app reads.
# ==============================================================================
aws:
  rolesAnywhere:
    enabled: false
    trustAnchorArn: ""
    profileArn: ""
    roleArn: ""
    region: "us-east-2"
    sessionDuration: 3600
    certificateSecretName: "plugin-br-payments-iam-tls"
    sidecar:
      image:
        repository: public.ecr.aws/rolesanywhere/credential-helper
        # Pinned to an immutable version-platform-timestamp tag, not the
        # rolling `latest-amd64` (Issue #352 review finding, Gandalf
        # 2026-09-10 re-review): this sidecar is a credential-bearing
        # workload, so a mutable tag is a supply-chain risk this chart does
        # not accept for it even though other charts in this repo still use
        # `latest-amd64` for the same image. Verified live against the
        # public ECR registry API on 2026-09-10 — resolves to digest
        # sha256:56b03f3acba0bda06c94189ab62c4a497fd1912f3d08311fb99ab24e4e4c2f84.
        # Bump deliberately; do not revert to `latest-amd64`.
        tag: "1.8.5-amd64-2026.08.24.20.52"
        pullPolicy: IfNotPresent
      port: 9911
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi


