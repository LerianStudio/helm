apiVersion: v1
kind: Secret
metadata:
  name: {{ include "midaz-helm.fullname" . }}-ledger
  labels:
    {{- include "midaz-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger
type: Opaque
data:
  IDP_M2M_CLIENT_SECRET: {{ .Values.ledger.secrets.IDP_M2M_CLIENT_SECRET | default "" | b64enc | quote }}
  LCRYPTO_ENCRYPT_SECRET_KEY: {{ .Values.ledger.secrets.LCRYPTO_ENCRYPT_SECRET_KEY | default "my-encrypt-secret-key" | b64enc | quote }}
  LCRYPTO_HASH_SECRET_KEY: {{ .Values.ledger.secrets.LCRYPTO_HASH_SECRET_KEY | default "my-hash-secret-key" | b64enc | quote }}
  MONGO_CRM_PASSWORD: {{ .Values.ledger.secrets.MONGO_CRM_PASSWORD | default "lerian" | b64enc | quote }}
  MONGO_FEES_PASSWORD: {{ .Values.ledger.secrets.MONGO_FEES_PASSWORD | default "lerian" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.ledger.extraSecretVars }}
  {{- toYaml .Values.ledger.extraSecretVars | nindent 2 }}
  {{- end }}
