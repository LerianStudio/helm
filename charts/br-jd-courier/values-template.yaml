# Operator-provided values for br-jd-courier.
#
# Placeholders are empty on purpose: this file is a template, never a credential
# store. Not exhaustive; values.yaml carries the annotated surface.

jd-courier:
  image:
    # Pin the published tag in production. Registry tags have no leading `v`.
    tag: ""

# The IAM role that reads Secrets Manager (Pix engine credentials, per-tenant
# JD bundles). On EKS with IRSA: create: true and the annotation
# eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>.
serviceAccount:
  create: false
  name: ""
  annotations: {}

secrets:
  # The Secret every role and the migration Job read. It must exist before
  # install; the chart never renders one. Empty = the release fullname.
  # Keys: LICENSE_KEY, POSTGRES_PASSWORD, DATABASE_URL for the migration Job and,
  # single-tenant, IDP_M2M_CLIENT_SECRET and JD_PASSWORD.
  existingSecret: ""

# Non-secret environment, one ConfigMap shared by every role. Secret keys and
# COURIER_ROLES are refused here.
config:
  # Required; README "Environment".
  ENVIRONMENT_NAME: ""
  # byoc in the client's cloud, saas on Lerian Cloud (refuses non-TLS datastores).
  DEPLOYMENT_MODE: "byoc"
  # One organization per Courier deployment.
  ORGANIZATION_IDS: ""
  POSTGRES_HOST: ""
  POSTGRES_USER: ""
  POSTGRES_NAME: ""
  # verify-full in production.
  POSTGRES_SSLMODE: ""
  # The Access Manager's address; every role needs it with authentication on.
  PLUGIN_AUTH_HOST: ""
  # Single-tenant: the Courier publishes its Access Manager grants and JD's
  # partner opt-in at boot; IDP_M2M_CLIENT_SECRET goes in the Secret. README
  # "Access Manager".
  IDP_DECLARATION_ENABLED: "true"
  # The Access Manager identity address (port 4001), not PLUGIN_AUTH_HOST.
  IDP_HOST: ""
  IDP_M2M_CLIENT_ID: ""
  # The Secrets Manager region of the engine credentials (default us-east-1).
  AWS_REGION: ""
  # Single-tenant SPB roles: JD's SPB address (https in production) and codes;
  # JD_PASSWORD goes in the Secret. JD_SOAP_PATH defaults to /soap.
  JD_BASE_URL: ""
  JD_LEGACY_CODE: ""
  JD_USER_CODE: ""

# The spb-sender's SOAP listener needs TLS in production (it refuses to boot
# otherwise). Set at least one; Ingress plus existingSecret re-encrypts to the pod.
roles:
  spbSender:
    # TLS at an Ingress in front of the SOAP Service.
    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts:
        - host: ""
          paths:
            - path: /
              pathType: Prefix
      tls: []
    soapTls:
      # Or: an existing kubernetes.io/tls Secret, served by the pod itself.
      existingSecret: ""
      # Or: TLS terminated by a mesh or load balancer outside this chart.
      terminatedUpstream: false
