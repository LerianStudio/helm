# plugin-br-bank-transfer — values-template.yaml (the operator fill-in surface)
#
# Copy this file, fill the REQUIRED fields + CHANGE_ME credentials, and
# install: helm install bank-transfer lerian/plugin-br-bank-transfer -f values-template.yaml
#
# Documents every knob an operator sets, with safe defaults + empty credential
# placeholders. This is the ONLY starter file for this chart — the full
# power-user API (every knob, no curation) is values.yaml.
#
# STYLE (canonical, mirrors the reporter/plugin-access-manager productized
# charts): the whole env-wide typed contract lives in ONE `global:` block,
# FIRST — set each dependency connection ONCE with its typed mask; the chart
# emits the app's native env keys from it. Do NOT pin ENV_NAME/
# MULTI_TENANT_ENABLED/ENABLE_TELEMETRY or POSTGRES_*/REDIS_* connection keys
# under bankTransfer.configmap when a mask exists below — a native key WINS
# over its mask and defeats it.

# --- The env-wide typed contract (dependency connections + cross-cutting) ------
global:
  # -- Managed-cloud topology preset: aws | gcp | azure. Sets tls/ssl for the
  # masks below in one knob — e.g. "aws" turns on Redis TLS and RDS
  # sslmode=require. Leave "" for the bundled in-cluster infra (plaintext).
  # Endpoints (host/port/user) still come from global.datastores below.
  cloud: ""
  # -- Dependency connections — typed masks (one knob per field). Point at
  # your own Postgres/Redis here, or keep the bundled defaults and toggle
  # <dep>.enabled/.external below.
  datastores:
    postgres: { host: "", user: "bank_transfer" }   # <- REQUIRED: your PostgreSQL host
    redis:    { host: "" }                          # <- REQUIRED: your Redis/Valkey host:port
  # -- Env-wide environment name. Consumed by lerian-common.globalValue.
  env:
    name: ""   # <- REQUIRED, e.g. "production", "staging"
  # -- Env-wide multi-tenancy gate. When true, also set the MULTI_TENANT_* keys
  # documented under bankTransfer.configmap below.
  multiTenant:
    enabled: false
  # -- Env-wide telemetry gate. Leave disabled to keep the bundled default off.
  observability:
    enabled: false
    # otlpEndpoint: ""
    # deploymentEnvironment: ""
  # -- Env-wide auth (plugin-access-manager). Leave unset to keep the chart's
  # own default endpoint; point it at your access-manager instance otherwise.
  auth:
    host: ""   # <- e.g. "http://plugin-access-manager-auth:4000"

# --- Component config ------------------------------------------------------
bankTransfer:
  name: bank-transfer
  enabled: true
  replicaCount: 2

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ""  # Set your hostname (e.g., bank-transfer.example.com)
        paths:
          - path: /
            pathType: Prefix
    tls: []

  migrations:
    enabled: true

  configmap:
    # Chart scope (as of 1.6.0): infrastructure connection + multi-tenant
    # toggle + outbound URLs / auth toggles only. Operational tuning
    # (timeouts, retries, circuit breakers, polling cadence, rate limit,
    # idempotency, reconciliation, webhook config, usage limits, operating
    # hours, CORS, routing UUIDs) is managed via the systemplane admin API at
    # runtime or covered by lib-commons compiled defaults.

    # =================================================================
    # Multi-tenancy — only when global.multiTenant.enabled=true above
    # =================================================================
    # MULTI_TENANT_URL: ""
    # AWS_REGION: ""
    # MULTI_TENANT_REDIS_HOST: ""
    # MULTI_TENANT_REDIS_TLS: "false"
    # MULTI_TENANT_INTEGRATION_SECRET_NAME_TEMPLATE: "tenants/{env}/{tenantId}/{applicationName}/integration/configuration"

    # =================================================================
    # RabbitMQ (event bus, optional)
    # =================================================================
    RABBITMQ_ENABLED: "false"
    # RABBITMQ_URL: ""  # Required if RABBITMQ_ENABLED=true

    # =================================================================
    # Authentication (inbound)
    # =================================================================
    PLUGIN_AUTH_ADDRESS: ""  # REQUIRED — plugin-access-manager auth endpoint

    # =================================================================
    # Outbound adapters — URLs + auth toggles only
    # Timeouts, retries, circuit breakers, cache TTLs are
    # systemplane-managed at runtime.
    # =================================================================

    # Midaz — REQUIRED
    MIDAZ_BASE_URL: ""  # REQUIRED - Midaz API endpoint
    MIDAZ_TRANSACTION_URL: ""  # REQUIRED - Midaz transaction endpoint

    # CRM — REQUIRED
    CRM_BASE_URL: ""  # REQUIRED - CRM API endpoint

    # Fees — REQUIRED
    FEES_BASE_URL: ""  # REQUIRED - Fees API endpoint

    # JD-SPB
    JD_SANDBOX_MODE: "false"
    JD_BASE_URL: ""  # REQUIRED when JD_SANDBOX_MODE=false
    JD_ORIGIN_ISPB: ""  # REQUIRED when JD_SANDBOX_MODE=false

  secrets:
    # PostgreSQL / Redis / MongoDB — REQUIRED (bundled subcharts read these too)
    POSTGRES_PASSWORD: ""  # REQUIRED
    REDIS_PASSWORD: ""  # REQUIRED
    MONGO_PASSWORD: ""  # REQUIRED

    # Encryption keys — REQUIRED (hex-encoded 32-byte AES-256 keys, 64 hex chars)
    JD_INCOMING_RAW_XML_ENCRYPTION_KEY: ""  # REQUIRED
    RECIPIENT_DETAILS_ENCRYPTION_KEY: ""  # REQUIRED

    # JD SPB credentials — required for production (unless JD_SANDBOX_MODE=true)
    # JD_USER_CODE: ""
    # JD_PASSWORD: ""
    # JD_PRIVATE_KEY_PEM: ""
    # JD_PUBLIC_KEY_PEM: ""  # required for external_provided mode with signature validation

    # RabbitMQ credentials (if RABBITMQ_ENABLED=true)
    # RABBITMQ_PASSWORD: ""

  useExistingSecret: false
  existingSecretName: ""

# ==============================================================================
# INFRASTRUCTURE DEPENDENCIES
# ==============================================================================
# PostgreSQL: database "bank_transfer", user "bank_transfer" (full privileges)
# Redis/Valkey: rate limiting, idempotency keys, caching — no pre-config needed
# MongoDB (MANDATORY): database "plugin_br_bank_transfer_jd", user "bank_transfer"
#   — audit logs, event persistence, transfer tracking
# RabbitMQ (OPTIONAL — webhook delivery): exchange "bank_transfer.lifecycle" +
#   ".dlx", queue "transfer.webhook.delivery" + ".dlq"
# ==============================================================================

# Bundled dependencies. On a managed-cloud install (global.cloud set, or any
# external Postgres/Redis/Mongo/RabbitMQ), set enabled: false + external: true
# and point the masks under global.datastores above at it.
valkey:
  enabled: false
  external: true
postgresql:
  enabled: false
  external: true
mongodb:
  enabled: false
  external: true
rabbitmq:
  enabled: false
  external: true
