{{- $component := index .Values "bc-correios" -}}
{{- if $component.enabled }}
{{- if not $component.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bc-correios.fullname" . }}
  namespace: {{ include "global.namespace" . }}
type: Opaque
stringData:
  # PostgreSQL password is single-sourced from the postgresql subchart Secret
  # (<release>-postgresql, key "password") and read via secretKeyRef on the deployment; see
  # docs/helm-chart-standard.md "Single-Source Infra Secrets". It is only written here for an
  # EXTERNAL Postgres (postgresql.external=true) without postgresql.auth.existingSecret.
  {{- $pg := .Values.postgresql | default dict }}
  {{- $pgAuth := $pg.auth | default dict }}
  {{- if and (not (and (ne (toString $pg.enabled) "false") (not $pg.external))) (not $pgAuth.existingSecret) $component.secrets.POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ $component.secrets.POSTGRES_PASSWORD | quote }}
  {{- end }}

  # AES-256 encryption key (32 bytes)
  ENCRYPTION_KEY: {{ required "bc-correios.secrets.ENCRYPTION_KEY is required" $component.secrets.ENCRYPTION_KEY | quote }}

  # Cache (Valkey) credentials
  {{- /* With the bundled Valkey (auth enabled) or valkey.auth.existingSecret the password is read from the Valkey Secret via secretKeyRef on the deployment (bc-correios.valkeyPasswordFromSubchart); it is only written here otherwise. */}}
  {{- if not (include "bc-correios.valkeyPasswordFromSubchart" .) }}
  CACHE_PASSWORD: {{ $component.secrets.CACHE_PASSWORD | default "" | quote }}
  {{- end }}

  # Object storage credentials
  OBJECT_STORAGE_ACCESS_KEY: {{ $component.secrets.OBJECT_STORAGE_ACCESS_KEY | default "" | quote }}
  OBJECT_STORAGE_SECRET_KEY: {{ $component.secrets.OBJECT_STORAGE_SECRET_KEY | default "" | quote }}

  # Streaming broker SASL password (optional)
  {{- if $component.secrets.STREAMING_SASL_PASSWORD }}
  STREAMING_SASL_PASSWORD: {{ $component.secrets.STREAMING_SASL_PASSWORD | quote }}
  {{- end }}
{{- end }}
{{- end }}
