# =============================================================================
# streaming-hub — QUICKSTART values (the layperson layer)
# -----------------------------------------------------------------------------
# The full values.yaml is the power-user API. This file is the short list of
# DEPENDENCY-CONNECTION knobs a non-expert fills to get the hub running: where
# Kafka/RedPanda lives, the Postgres DSN, which topology to deploy, the image
# tag, the ingress host, and the operator-provided secrets. Everything else has
# a working default in the chart; reach it only via
# `streamingHub.configmap.<KEY>` (the escape hatch) when you must.
#
#   helm install streaming-hub charts/streaming-hub -f values-quickstart.yaml
#
# Anything with CHANGE_ME MUST be set. Kafka/RedPanda and PostgreSQL are EXTERNAL
# (no bundled subcharts) — point the hub at your cluster below.
# =============================================================================

global:
  # -- Kafka/RedPanda connection, declared ONCE (the hub emits its native
  #    STREAMING_HUB_KAFKA_* env from it). Leave a field out to keep the default.
  datastores:
    kafka:
      brokers: "redpanda:9092"          # STREAMING_HUB_KAFKA_BROKERS
      # saslMechanism: "SCRAM-SHA-512"  # STREAMING_HUB_KAFKA_SCRAM_MECHANISM
      # saslUsername: "streaming-hub"   # STREAMING_HUB_KAFKA_SCRAM_USERNAME
      # tls: "true"                     # STREAMING_HUB_KAFKA_TLS_ENABLED
      # caCert: ""                      # STREAMING_HUB_KAFKA_CA_CERT (base64 PEM)
  # -- plugin-access-manager auth, env-wide (per-service override via configmap).
  auth: {}
    # enabled: "true"                   # PLUGIN_AUTH_ENABLED
    # address: "http://plugin-access-manager-auth:4000" # PLUGIN_AUTH_ADDRESS

streamingHub:
  # -- Topology: `all` (one Deployment, ingest+delivery co-resident) or `split`
  #    (separate ingest/delivery Deployments). NEVER run both against one cluster.
  mode: all
  image:
    tag: ""                             # -- pin the hub image version (empty = chart appVersion)
  ingress:
    enabled: false
    # hosts: [{ host: "streaming-hub.example.com", paths: [{ path: "/", pathType: Prefix }] }]
  # -- OTLP telemetry to a node-local collector (HOST_IP:4317 via downward API).
  telemetry:
    enabled: false
  # -- Common overrides / env-wide feature toggles (the escape hatch). Examples:
  configmap: {}
    # STREAMING_HUB_ENV: "production"
    # MULTI_TENANT_ENABLED: "true"
    # STREAMING_HUB_TENANT_ID: "default"   # BYOC single-tenant allowlist
  # -- OUT-OF-BAND schema migration Job (the hub never migrates itself). Enable
  #    it once so ingest/dispatcher find their tables.
  migrations:
    enabled: true
  # -- Operator-provided secrets (or set useExistingSecret=true + existingSecretName
  #    to source them from Vault/gitops). Empty values are skipped at render.
  secrets:
    # -- REQUIRED: the single hub-owned Postgres DSN (password embedded).
    STREAMING_HUB_POSTGRES_DSN: "CHANGE_ME"   # postgres://user:pass@host:5432/db?sslmode=require
    # -- REQUIRED when the Kafka SCRAM mechanism is set:
    # STREAMING_HUB_KAFKA_SCRAM_PASSWORD: "CHANGE_ME"
    # -- KEK material for envelope encryption (>= 32 bytes). Prod injects via deploy layer.
    # STREAMING_HUB_DEV_KEK: "CHANGE_ME"
    # -- Only when MULTI_TENANT_ENABLED=true (SaaS tenant-manager):
    # STREAMING_HUB_TENANT_MANAGER_SERVICE_API_KEY: "CHANGE_ME"
    # STREAMING_HUB_MULTI_TENANT_REDIS_PASSWORD: "CHANGE_ME"
