{{- if and .Values.tracer.enabled .Values.tracer.pdb.enabled }}
{{- include "lerian-common.pdb" (dict
      "pdb" .Values.tracer.pdb
      "specStyle" "explicit"
      "name" (include "tracer.fullname" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "tracer.labels" (dict "context" . "component" .Values.tracer.name "name" .Values.tracer.name))
      "selector" (include "tracer.selectorLabels" (dict "context" . "name" .Values.tracer.name))
    ) }}
{{- end }}
