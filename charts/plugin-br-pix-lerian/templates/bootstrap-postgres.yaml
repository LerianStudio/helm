{{- if .Values.global.externalPostgresDefinitions.enabled }}
{{- /*
Plugin BR Pix Lerian — PostgreSQL bootstrap.

Creates one Job per database listed in .Values.global.externalPostgresDefinitions.databases.
Pix Lerian needs 5 separate Postgres databases: pix-spi, pix-dict, pix-cob,
pix-adapter-lerian and pix-pixauto. The list above is the source of truth; this
sentence is a summary of it and must move with it.
A single shared role (default: pixswitch) owns all of them.

Each Job is idempotent — it checks for existing role and database before
creating, and grants are safe to re-apply.
*/}}
{{- $admin := .Values.global.externalPostgresDefinitions.postgresAdminLogin -}}
{{- $creds := .Values.global.externalPostgresDefinitions.pixswitchCredentials -}}
{{- $conn := .Values.global.externalPostgresDefinitions.connection -}}
{{- /*
Resolve which Secret carries each credential. Inline values are written to the
chart-managed Secret rendered by bootstrap-postgres-secret.yaml; an operator
who names an existing Secret keeps using theirs. Either way the container reads
them through secretKeyRef — no credential is ever emitted as an env value.
*/ -}}
{{- $managedSecret := printf "%s-bootstrap-postgres" (include "plugin-br-pix-lerian.name" $) -}}
{{- $adminSecret := default $managedSecret $admin.useExistingSecret.name -}}
{{- $credsSecret := default $managedSecret $creds.useExistingSecret.name -}}
{{- range $db := .Values.global.externalPostgresDefinitions.databases }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "plugin-br-pix-lerian.name" $ }}-bootstrap-postgres-{{ $db }}
  namespace: {{ include "global.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-lerian.labels" (dict "context" $ "component" "bootstrap-postgres") | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          env:
            - name: DB_HOST
              value: {{ $conn.host | quote }}
            - name: DB_PORT
              value: {{ $conn.port | quote }}
          command:
            - /bin/sh
            - -c
            - >
              TIMEOUT=300; ELAPSED=0;
              echo "Checking $DB_HOST:$DB_PORT...";
              while ! nc -z "$DB_HOST" "$DB_PORT"; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for $DB_HOST:$DB_PORT after ${TIMEOUT}s"; exit 1;
                fi;
                echo "$DB_HOST:$DB_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
                sleep 5; ELAPSED=$((ELAPSED + 5));
              done;
              echo "$DB_HOST:$DB_PORT is ready!"
      containers:
        - name: psql
          image: postgres:17
          env:
            - name: DB_HOST
              value: {{ $conn.host | quote }}
            - name: DB_PORT
              value: {{ $conn.port | quote }}
            - name: DB_USER_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: DB_USER_ADMIN
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: DB_ADMIN_PASSWORD
            - name: DB_PASSWORD_PIXSWITCH
              valueFrom:
                secretKeyRef:
                  name: {{ $credsSecret | quote }}
                  key: DB_PASSWORD_PIXSWITCH
            - name: DB_ROLE
              value: {{ $creds.username | default "pixswitch" | quote }}
            - name: DB_NAME
              value: {{ $db | quote }}
            - name: DB_DATABASE
              value: postgres
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "=== Pix Lerian PostgreSQL Bootstrap (${DB_NAME}) ==="
              echo "Host: ${DB_HOST}:${DB_PORT}"
              echo "Role: ${DB_ROLE}"
              echo ""

              ROLE_EXISTS=0
              DB_EXISTS=0

              # psql interpolates :'var' only for stdin/-f input, NOT for -c, so
              # the lookups are fed on stdin. Capturing the output (instead of
              # piping into grep) preserves psql's exit status: a connection or
              # auth failure aborts the job here rather than being misread as
              # "object does not exist".
              ROLE_LOOKUP=$(printf '%s\n' "SELECT 1 FROM pg_roles WHERE rolname=:'role'" | PGPASSWORD="${DB_ADMIN_PASSWORD}" psql -At -v ON_ERROR_STOP=1 -v role="${DB_ROLE}" -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER_ADMIN}" -d "${DB_DATABASE}")
              if [ "${ROLE_LOOKUP}" = "1" ]; then
                ROLE_EXISTS=1
              fi
              DB_LOOKUP=$(printf '%s\n' "SELECT 1 FROM pg_database WHERE datname=:'db'" | PGPASSWORD="${DB_ADMIN_PASSWORD}" psql -At -v ON_ERROR_STOP=1 -v db="${DB_NAME}" -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER_ADMIN}" -d "${DB_DATABASE}")
              if [ "${DB_LOOKUP}" = "1" ]; then
                DB_EXISTS=1
              fi

              # ROLE CREATION. Three things have to hold at once here, and the
              # obvious spellings break at least one of them:
              #
              #   1. The five sibling Jobs share ONE role and run concurrently, so
              #      the check-then-create above is racy - two Jobs can both see the
              #      role as absent and both try to create it. Two conditions are
              #      swallowed and only these two: duplicate_object (42710), raised
              #      when the catalog check sees the role, and unique_violation
              #      (23505) on pg_authid_rolname_index, which is what a real race
              #      actually raises - verified against PostgreSQL 17 by running two
              #      copies of this script concurrently. Inside this block the only
              #      statement is CREATE ROLE, so a unique_violation here can only be
              #      that collision. ON_ERROR_STOP=1 still aborts on anything else:
              #      an auth, permission, connection or syntax failure still fails
              #      the Job.
              #
              #   2. The role is an IDENTIFIER and the password a LITERAL, so both go
              #      through format() %I / %L rather than any string concatenation.
              #
              #   3. Neither value may reach psql's argv (visible in `ps`) or be
              #      interpolated by the shell. They are read from the environment by
              #      psql itself with \getenv, and the heredoc is quoted (<<'SQL') so
              #      the shell expands nothing inside it.
              #
              # set_config/current_setting is the bridge: psql does NOT substitute
              # :'var' inside a dollar-quoted body, so the values are bound OUTSIDE
              # the DO block and read back inside it. The body is tagged $do$ so it
              # cannot collide with the $$ the shell would otherwise see.
              #
              # The heredoc terminator sits at column 0 of the RENDERED script - this
              # template line is at the block-scalar base indent. An indented
              # terminator is not recognised with <<'SQL' and the script dies with
              # "syntax error: unexpected end of file".
              if [ "${ROLE_EXISTS}" = "1" ]; then
                echo "Role '${DB_ROLE}' already exists. Skipping creation."
              else
                echo "Creating role '${DB_ROLE}'..."
                PGPASSWORD="${DB_ADMIN_PASSWORD}" psql -q -v ON_ERROR_STOP=1 -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER_ADMIN}" -d "${DB_DATABASE}" <<'SQL'
              -- terse suppresses psql's CONTEXT/DETAIL lines. On an UNHANDLED error
              -- PL/pgSQL reports the statement it was executing, and for CREATE ROLE
              -- that text carries the password literal - observed against PostgreSQL
              -- 17 as: CONTEXT: SQL statement "CREATE ROLE x LOGIN PASSWORD E'...'".
              -- The ERROR line itself still prints and the Job still fails.
              \set VERBOSITY terse
              \getenv bootstrap_role DB_ROLE
              \getenv bootstrap_pw DB_PASSWORD_PIXSWITCH
              \o /dev/null
              SELECT set_config('bootstrap.role', :'bootstrap_role', false);
              SELECT set_config('bootstrap.pw', :'bootstrap_pw', false);
              \o
              DO $do$
              BEGIN
                EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L',
                 current_setting('bootstrap.role'),
                 current_setting('bootstrap.pw'));
              EXCEPTION WHEN duplicate_object OR unique_violation THEN
                RAISE NOTICE 'Role % already exists (created concurrently by a sibling Job).', current_setting('bootstrap.role');
              END
              $do$;
              SQL
              fi

              if [ "${DB_EXISTS}" = "1" ]; then
                echo "Database '${DB_NAME}' already exists. Skipping creation."
              else
                echo "Creating database '${DB_NAME}'..."
                PGPASSWORD="${DB_ADMIN_PASSWORD}" psql -q -v ON_ERROR_STOP=1 -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER_ADMIN}" -d "${DB_DATABASE}" <<'SQL'
              \getenv bootstrap_role DB_ROLE
              \getenv bootstrap_db DB_NAME
              CREATE DATABASE :"bootstrap_db" OWNER :"bootstrap_role";
              SQL
              fi

              echo "Ensuring privileges on '${DB_NAME}'..."
              PGPASSWORD="${DB_ADMIN_PASSWORD}" psql -q -v ON_ERROR_STOP=1 -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER_ADMIN}" -d "${DB_DATABASE}" <<'SQL'
              \getenv bootstrap_role DB_ROLE
              \getenv bootstrap_db DB_NAME
              GRANT ALL PRIVILEGES ON DATABASE :"bootstrap_db" TO :"bootstrap_role";
              SQL
              PGPASSWORD="${DB_ADMIN_PASSWORD}" psql -q -v ON_ERROR_STOP=1 -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER_ADMIN}" -d "${DB_NAME}" <<'SQL'
              \getenv bootstrap_role DB_ROLE
              GRANT ALL ON SCHEMA public TO :"bootstrap_role";
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO :"bootstrap_role";
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO :"bootstrap_role";
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO :"bootstrap_role";
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO :"bootstrap_role";
              SQL

              echo ""
              echo "=== Pix Lerian PostgreSQL Bootstrap (${DB_NAME}) completed ==="
{{- end }}
{{- end }}
