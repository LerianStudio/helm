apiVersion: v2
name: br-sta-helm
description: A Helm chart for br-sta — the Lerian BACEN STA (Sistema de
  Transferência de Arquivos) service, a manager (HTTP API) plus its background
  worker (BACEN transfers, audit trail, scheduled jobs)

type: application
annotations:
  lerian.studio/chart-type: multi-component

home: https://github.com/LerianStudio/helm

sources:
  - https://github.com/LerianStudio/helm/tree/main/charts/br-sta

maintainers:
  - name: "Lerian Studio"
    email: "support@lerian.studio"

version: 1.0.1

# NOTE: appVersion is the default image tag for the manager, the worker and the
# migrations Job (the three images are released together under one tag). Override
# via manager.image.tag / worker.image.tag / migrations.image.tag when needed.
appVersion: "1.0.0"

keywords:
  - br-sta
  - sta
  - bacen
  - file-transfer
  - lerian

icon: https://avatars.githubusercontent.com/u/148895005?s=200&v=4

# lerian-common-helm is the shared library (env contracts, datastore / object
# storage / KMS masks). The infra subcharts are DECLARED (exact pins,
# condition-gated) so the chart can optionally bundle infra for dev/evaluation,
# but they default to disabled: in production PostgreSQL, Redis/Valkey, RabbitMQ
# and S3 object storage are EXTERNAL and pre-provisioned.
dependencies:
  - name: lerian-common-helm
    version: "2.1.2"
    repository: "oci://ghcr.io/lerianstudio"
  - name: postgresql
    version: "16.3.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: valkey
    version: "2.4.7"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: valkey.enabled
  - name: rabbitmq
    version: "2.1.11"
    repository: "https://groundhog2k.github.io/helm-charts"
    condition: rabbitmq.enabled
  - name: seaweedfs
    version: "4.0.393"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
  # DEV-ONLY bundle (the chart refuses it in a production-like environment).
  - name: redpanda
    version: "26.2.4"
    repository: "https://charts.redpanda.com"
    # The redpanda chart's values schema is closed (no `enabled` key), so the
    # toggle lives outside its values block.
    condition: redpandaBundle.enabled
