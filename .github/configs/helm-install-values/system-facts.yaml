# The chart defaults describe a production install, and the application refuses to
# boot with them on a cluster that has nothing behind it:
#   ASSERTION FAILED: POSTGRES_PASSWORD is required in production
# (the next refusals are the license gate, which is on by default, and the
# reference keys, which are required unless the environment is development).
# kind has no license, no external Postgres or Valkey, and no Access Manager, so the
# gate installs the chart's other supported topology: bundled Postgres and Valkey,
# with the workload running as a development-class environment and the license gate
# off. The production guards themselves are the application's contract, not the
# chart's.
#
# The chart pins `namespaceOverride: system-facts` while this gate installs with
# `-n it-system-facts`, which put the bundled Postgres and Valkey in one namespace
# and the workload in the other. A Secret cannot be read across namespaces, so the
# Deployment sat in CreateContainerConfigError (secret "system-facts-postgresql"
# not found) and the migrations Job waited on a host that does not resolve. Pointing
# the override at the gate's own namespace lands everything in one, which is the
# topology the README install command produces.
namespaceOverride: "it-system-facts"
system-facts:
  env: "development"
  allowInsecureTls: "true"
  # The bundled subcharts own both passwords (the Deployment reads them from the
  # subchart Secrets), and the chart refuses a POSTGRES_PASSWORD it would ignore.
migrations:
  enabled: true
postgresql:
  enabled: true
  external: false
valkey:
  enabled: true
  external: false
  architecture: standalone
