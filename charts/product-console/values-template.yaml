# Template values for product-console
# This file contains the minimum required configuration for deployment
# Copy this file and customize for your environment

global:
  # -- Env-wide MongoDB connection mask (global.datastores.mongo). Uncomment and
  # fill only the fields you need to point at an external instance; a native
  # configmap.<KEY> pin would override these, so don't duplicate them there.
  # Leave a field COMMENTED OUT rather than empty: an empty string here counts
  # as a value and wins over the chart's own default, so `host: ""` would erase
  # the bundled MongoDB's address and `uri: ""` the "mongodb" connection scheme.
  datastores: {}
  # datastores:
  #   mongo:
  #     uri: "mongodb"                       # the SCHEME, not a URI
  #     host: "my-mongo.db.svc.cluster.local"
  #     port: "27017"
  #     user: "midaz"
  #     params: "tls=true&authSource=admin"
  # -- Env-wide Access Manager gate/host (global.auth). Do NOT also pin
  # configmap.PLUGIN_AUTH_ENABLED/PLUGIN_AUTH_HOST — a native key wins over
  # this mask and defeats it.
  # The chart default for enabled is "false" (authorization OFF), and this
  # template keeps it so the file renders as-is. The published console image
  # refuses to start in production with authorization off (exit 1), so set
  # "true" for any real install, and then fill the PLUGIN_AUTH_CLIENT_* values
  # below. Leave host COMMENTED OUT unless you point at a different Access
  # Manager: an empty string here wins over the chart's own default host.
  auth:
    enabled: "false"
    # host: "plugin-access-manager-auth.plugin-access-manager.svc.cluster.local"
  # -- Env-wide telemetry gate (global.observability). Do NOT also pin
  # configmap.ENABLE_TELEMETRY — a native key wins over this mask.
  observability:
    enabled: "false"

replicaCount: 1

image:
  # -- Repository for the product-console container image
  repository: lerianstudio/product-console
  # -- Image pull policy (chart default in values.yaml is IfNotPresent;
  # Always here is a template choice, not the chart default)
  pullPolicy: Always
  # -- Image tag used for deployment. Empty means Chart.AppVersion; the chart's
  # own pin is image.tag in values.yaml.
  tag: ""

imagePullSecrets: []

ingress:
  # -- Enable or disable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Additional ingress annotations
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- ConfigMap for environment variables and configurations
configmap:
  # Application Configuration
  NODE_ENV: "production"
  MIDAZ_CONSOLE_PORT: "8081"

  # OpenTelemetry Configuration
  # ENABLE_TELEMETRY is set via global.observability.enabled above — do not pin it here.
  # OTEL_HOST and OTEL_URL_METRICS/TRACES/LOGS are NOT configmap keys: the
  # ConfigMap template drops them silently. The Deployment injects them when
  # otel.enabled or otel.external is true, built from the top-level otel.host
  # and otel.port values (see values.yaml). Telemetry on without one of those
  # two switches fails the render.
  OTEL_RECEIVER_HTTP_PORT: "4318"

  # NextAuth Configuration
  NEXTAUTH_URL: ""

  # Midaz API Configuration
  MIDAZ_API_HOST: ""
  MIDAZ_API_PORT: "3002"
  MIDAZ_BASE_PATH: ""
  MIDAZ_TRANSACTION_BASE_HOST: ""
  MIDAZ_TRANSACTION_BASE_PORT: "3002"
  MIDAZ_TRANSACTION_BASE_PATH: ""

  # Plugin Auth Configuration
  # PLUGIN_AUTH_ENABLED/PLUGIN_AUTH_HOST are set via global.auth above — do not pin them here.
  PLUGIN_AUTH_CLIENT_ID: ""
  PLUGIN_AUTH_PORT: "4000"
  PLUGIN_AUTH_BASE_PATH: ""

  # Plugin Identity Configuration
  PLUGIN_IDENTITY_HOST: ""
  PLUGIN_IDENTITY_PORT: "4001"
  PLUGIN_IDENTITY_BASE_PATH: ""

  # MongoDB Configuration
  # MONGODB_URI/MONGO_HOST/MONGO_PORT/MONGODB_USER/MONGO_PARAMETERS are set via
  # global.datastores.mongo above — do not pin them here.
  MONGODB_DB_NAME: "midaz-console"

  # CRM Plugin Configuration
  CRM_BASE_PATH: ""

  # Reporter Configuration
  REPORTER_BASE_PATH: ""

  # Address of the midaz ledger's /v2 contract, where fees live (packages,
  # billing packages, billing runs, statement). Same host and port as
  # MIDAZ_BASE_PATH above, with /v1 swapped for /v2. Canonical form ends in a
  # slash. Unset, every fees screen fails.
  # MIDAZ_V2_BASE_PATH: "http://midaz-ledger.midaz.svc.cluster.local:3002/v2/"

  # Optional sibling services. Set only the ones you deployed; an unset key is
  # written nowhere, which is what keeps "not installed" from reading as a
  # connection error on the page. TRACER_BASE_PATH and MATCHER_BASE_PATH are
  # bare origins, no /v1; LENDER_BASE_PATH ends in /api/v1.
  # FLOWKER_BASE_PATH: "http://flowker.flowker.svc.cluster.local:4021/v1"
  # LENDER_BASE_PATH: "http://lender.lender.svc.cluster.local:4017/api/v1"
  # MATCHER_BASE_PATH: "http://matcher.matcher.svc.cluster.local:8080"
  # TRACER_BASE_PATH: "http://midaz-tracer.midaz.svc.cluster.local:4020"

  # Client IP resolution. Comma list of CIDRs the console trusts as its own
  # hops while reading X-Forwarded-For, so it can tell which address is the
  # real caller. Set it to the ingress / load-balancer addresses actually in
  # front of this service, never the pod or service CIDR. Left unset, the
  # console names no caller at all and a tenant IP allowlist has nothing to
  # judge. Read the README section "Client IP resolution" before choosing a
  # range: an entry wider than /8 (IPv4) or /48 (IPv6) is refused, and a range
  # that covers real callers hides them.
  # TRUSTED_PROXIES: "198.51.100.0/24"

  # Browser-facing address of the Access Manager, used for the SSO redirect —
  # PLUGIN_AUTH_BASE_PATH above is the cluster-internal one and the browser
  # cannot resolve it. Absolute, https, ending in /v1.
  # PLUGIN_AUTH_PUBLIC_BASE_PATH: "https://auth.example.com/v1"

  # Deployment-level assertion that the Access Manager in front of this console
  # may answer a correct password with an MFA challenge. It does not enable MFA
  # for any user — that is per user, in the Access Manager. Unset where MFA is
  # off; set where it is on, or a user with MFA cannot sign in at all.
  # MFA_ENABLED: "true"

  # Account Type Validation
  MIDAZ_ACCOUNT_TYPE_VALIDATION_ENABLED: "false"
  MIDAZ_ACCOUNT_TYPE_VALIDATION: ""

  # NextJS Public Configuration
  NEXT_PUBLIC_MIDAZ_CONSOLE_AVATAR_ALLOWED_FORMAT: "jpeg,jpg,png,svg"
  # NEXT_PUBLIC_PLUGIN_AUTH_ENABLED is left unset on purpose: the chart then
  # copies the server value (global.auth.enabled above). Pinning it here would
  # be used verbatim and could split the browser from the server.
  NEXT_PUBLIC_MIDAZ_VERSION: ""

# -- Extra environment variables
# This is the passthrough for any console variable the chart does not declare
# under 'configmap' above: every key here is added to the same ConfigMap the
# pod loads, so a key set here reaches the container. A key set under
# 'configmap' that the chart does not declare is accepted and silently dropped.
# A key the chart DOES declare must be set in one place only: supplying it here
# and under 'configmap' is refused at render time.
# Internal presentation configuration, not customer surface, has no named key
# and is set here:
#   NEXT_PUBLIC_DEMO_MODE: "false"  # demo presentation mode; off where data is real
extraEnvVars: {}

# -- Secrets for storing sensitive data
secrets:
  PLUGIN_AUTH_CLIENT_ID: ""
  PLUGIN_AUTH_CLIENT_SECRET: ""
  NEXTAUTH_SECRET: ""
  MONGODB_PASS: ""

# -- Use existing secret instead of creating one
useExistingSecret: false
# -- Name of the existing secret to use
existingSecretName: ""

# =============================================================================
# Optional Dependencies
# =============================================================================

mongodb:
  # -- Enable or disable the bundled MongoDB subchart.
  # Set to false when using an external MongoDB (e.g. DocumentDB).
  # When disabled, configure the external MongoDB connection settings in
  # configmap/secrets (for example `MONGODB_URI` and `MONGODB_PASS`) to point
  # to your external instance.
  enabled: true
