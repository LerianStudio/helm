{{- if .Values.agent.enabled }}
{{- /*
Where an enrolled agent keeps the identity the control plane issued it, so a
replacement pod reuses it instead of presenting a spent enrollment token. The
agent finds it as <its own Deployment>-identity, and the RBAC grant is pinned
to that one name.

Created empty, and kept identical in every revision: Helm's three-way patch
then has no data change to apply on upgrade or rollback, so the keys the agent
writes into the live object survive. It also outlives the release, so a later
install sees the old fingerprint instead of adopting the previous agent.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lerian-agent.fullname" . }}-identity
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "lerian-agent.labels" (dict "context" . "component" .Values.agent.name "name" .Values.agent.name) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data: {}
{{- end }}
