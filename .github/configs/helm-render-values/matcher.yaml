# CI-ONLY render fixture for charts/matcher.
#
# NOT a production example and NOT a credential store. The values below are
# self-describing placeholders that satisfy the chart's fail-loud gates:
#   matcher.configmap.DEPLOYMENT_MODE — required, no chart default.
#   matcher.secrets.RABBITMQ_PASSWORD — required for the bundled RabbitMQ.
#   matcher.secrets.LICENSE_KEY — matcher does not boot without a license.
#
# namespaceOverride is cleared because the chart default pins the workload to
# "matcher" while the bundled subcharts follow the release namespace; every
# deployment sets the override to its release namespace, which is what an empty
# override reproduces here (same as plugin-br-ted-lerian.yaml).
namespaceOverride: ""

matcher:
  configmap:
    DEPLOYMENT_MODE: "local"
  secrets:
    RABBITMQ_PASSWORD: "IT_RABBITMQ_PASSWORD" # CI placeholder (README)
    LICENSE_KEY: "IT_LICENSE_KEY" # CI license placeholder (README)
