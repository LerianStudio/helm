{{- $component := index .Values "br-sta" -}}
{{- if $component.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "br-sta.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sta.labels" (dict "context" .) | nindent 4 }}
  {{- with $component.pdb.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- /* Key-presence check (not truthiness): an explicit maxUnavailable: 0 must
       render as maxUnavailable, not silently fall back to minAvailable. An empty
       string ("", the values.yaml default) still means "unset". */}}
  {{- if and (hasKey $component.pdb "maxUnavailable") (not (kindIs "invalid" $component.pdb.maxUnavailable)) (ne (toString $component.pdb.maxUnavailable) "") }}
  maxUnavailable: {{ $component.pdb.maxUnavailable }}
  {{- else if and (hasKey $component.pdb "minAvailable") (not (kindIs "invalid" $component.pdb.minAvailable)) (ne (toString $component.pdb.minAvailable) "") }}
  minAvailable: {{ $component.pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "br-sta.selectorLabels" (dict "context" .) | nindent 6 }}
{{- end }}
