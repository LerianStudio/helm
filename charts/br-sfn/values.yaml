# =============================================================================
# cockpit — the br-sfn operations SPA (nginx-unprivileged serving the Vite
# bundle). BUILD-ARG-ONLY: every VITE_* (auth/identity/rail URLs, FI ISPB,
# floors) is inlined by `vite build` at IMAGE BUILD time (Dockerfile ARG->ENV);
# the image ships NO runtime-config injection (no entrypoint envsubst, no
# config.js) — confirmed in cockpit/.env.example + cockpit/deploy/nginx.conf.
# So cockpit has NO runtime config surface to productize: there are zero typed
# knobs, zero datastores, zero secrets, and zero runtime observability env. The
# configmap/secrets maps below stay ONLY as the standard escape-hatch contract
# (left OPEN — no propertyNames.enum — since there is no runtime env vocabulary
# to allowlist; a future one-image runtime-config variant would add keys here).
# Environments that need real URLs build/pin an environment-specific image with
# --build-arg VITE_*=... (out of chart scope).
# =============================================================================
cockpit:
  enabled: false
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: ghcr.io/lerianstudio/br-sfn-cockpit
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  deploymentUpdate:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  service:
    type: ClusterIP
    # Matches nginx-unprivileged EXPOSE 8080.
    port: 8080
  # -- BUILD-ARG-ONLY rail: no runtime env. These stay as the OPEN escape-hatch
  # contract (no schema enum) — the SPA reads no runtime env; VITE_* are image
  # build args. Only set configmap here if a future runtime-config image variant
  # introduces runtime keys.
  configmap: {}
  secrets: {}
  useExistingSecret: false
  existingSecretName: ""
  extraEnvVars: []
  # nginx-unprivileged needs a writable /tmp (pid file + proxy/cache dirs)
  # under readOnlyRootFilesystem.
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  # The SPA has no /health endpoints; nginx serves / for both probes.
  livenessProbe:
    path: /
  readinessProbe:
    path: /
  # nginx-unprivileged runs as uid 101.
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
