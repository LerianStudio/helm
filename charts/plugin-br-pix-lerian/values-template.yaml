    # across upgrades and rollbacks, because it is re-checked at every boot.
    SYSTEMPLANE_SECRET_MASTER_KEY: ""

# ------------------------------------------------------------
# adapter-lerian (api) — Lerian provider adapter HTTP entry
# ------------------------------------------------------------
# DEVELOPMENT ONLY IN THIS RELEASE: this component fails to boot when
# DEPLOYMENT_MODE is anything other than "local", so it must stay disabled in a
# byoc or saas deployment -- enabling it there crash-loops the pod. The mode
# below is deliberately "local"; do not copy "byoc" or "saas" here from the
# components above.
adapterLerian:
  enabled: false
  configmap:
    DEPLOYMENT_MODE: "local"
    PLUGIN_AUTH_ENABLED: "true"
    PLUGIN_AUTH_URL: "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000"
    ORGANIZATION_IDS: "global"
  secrets:
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-adapter-lerian?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-adapter-lerian?sslmode=require"
    LICENSE_KEY: ""

# ------------------------------------------------------------
# adapter-lerian (systemplane) — runtime config plane
# ------------------------------------------------------------
# Pairs with adapterLerian above: development only in this release.
adapterLerianSystemplane:
  enabled: false
  # Seeds the adapter_lerian.* configuration store. Only relevant where the
  # adapter-lerian pair runs, which this release supports for development only.
  # Its seed mappings live in the shared adapter-lerian key package, which this
  # component forwards; the identity/integration subset is below.
  configmap:
    DICT_BASE_URL: "http://plugin-br-pix-lerian-dict-hub:4104"
    SPI_BASE_URL: "http://plugin-br-pix-lerian-spi:4101"
    COB_BASE_URL: "http://plugin-br-pix-lerian-cob-hub:4108"
    BRSFN_BASE_URL: "<brsfn-base-url>"
  secrets:
    BRSFN_CLIENT_ID: "<brsfn-client-id>"
    DICT_CLIENT_ID: "<dict-client-id>"
    SPI_CLIENT_ID: "<spi-client-id>"
    COB_CLIENT_ID: "<cob-client-id>"
    BRSFN_CLIENT_SECRET: ""
    DICT_CLIENT_SECRET: ""
    SPI_CLIENT_SECRET: ""
    COB_CLIENT_SECRET: ""
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-adapter-lerian?sslmode=require"
    LICENSE_KEY: ""
    # REQUIRED and must be NON-EMPTY whenever DEPLOYMENT_MODE is not "local"
    # -- this workload's gate is DEPLOYMENT_MODE, not ENV_NAME, so the chart
    # default ("byoc") already requires it. Deliberately empty here: supply it
    # from your secret manager through useExistingSecret / existingSecretName
    # instead of committing a value to this file. No format or length is
    # validated; keep the SAME value across upgrades and rollbacks, because it
    # is re-checked at every boot.
    SYSTEMPLANE_SECRET_MASTER_KEY: ""

# ------------------------------------------------------------
# pixauto/api — Pix Automático payer side
# IDP_DECLARATION_ENABLED stays "false" until an M2M application is registered
# for the plugin-br-pix-lerian-pixauto slug; STREAMING_ENABLED stays "false" until
# the br-sfn rail carries the recurrence message family (GAP-BRSFN-001).
# ------------------------------------------------------------
pixauto:
  enabled: false
  configmap:
    DEPLOYMENT_MODE: "byoc"
    PLUGIN_AUTH_ENABLED: "true"
    PLUGIN_AUTH_URL: "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000"
    ORGANIZATION_IDS: "global"
    # Single-tenant business identity, and a DIFFERENT key from
    # ORGANIZATION_IDS above (that one is the license allow-list). The
    # tenant-config resolver reads pixauto.organization_id from the Systemplane
    # store first and falls back to this value; with neither set every request
    # answers 403 TENANT_CONFIG_NOT_FOUND. Leave it EMPTY when
    # MULTI_TENANT_ENABLED is true -- a value there refuses the boot.
    ORGANIZATION_ID: "<your-org-id>"
    IDP_DECLARATION_ENABLED: "false"
    STREAMING_ENABLED: "false"
  secrets:
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-pixauto?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-pixauto?sslmode=require"
    VALKEY_URL: "redis://default:<password>@valkey-host:6379/0"
    LICENSE_KEY: ""

# ------------------------------------------------------------
# pixauto/systemplane/api — runtime config plane for Pix Automático
# ------------------------------------------------------------
pixautoSystemplane:
  enabled: false
  configmap: {}
  secrets:
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-pixauto?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-pixauto?sslmode=require"
    LICENSE_KEY: ""
    # REQUIRED and must be NON-EMPTY whenever ENV_NAME is not "local" or
    # "development" -- with the ENV_NAME above this workload refuses to start
    # without it. Deliberately empty here: supply it from your secret manager
    # through useExistingSecret / existingSecretName instead of committing a
    # value to this file. No format or length is validated; keep the SAME value
    # across upgrades and rollbacks, because it is re-checked at every boot.
    SYSTEMPLANE_SECRET_MASTER_KEY: ""

# ------------------------------------------------------------
# Disable in-cluster subcharts (use external infra in production)
# ------------------------------------------------------------
postgresql:
  enabled: false
valkey:
  enabled: false
rabbitmq:
  enabled: false
otel-collector-lerian:
  enabled: false
