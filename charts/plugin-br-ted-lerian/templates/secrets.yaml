{{- if and (index .Values "plugin-br-ted-lerian").enabled (not (index .Values "plugin-br-ted-lerian").useExistingSecret) }}
{{/*
When a datastore subchart is bundled, its password lives in ITS OWN Secret and
is referenced directly by the Deployment (see boilerplate.infraSecretRef). Do
not copy it in here: a duplicate would silently go stale the moment the subchart
rotated or generated its own password.
*/}}
{{- $pg := .Values.postgresql | default dict -}}
{{- $pgAuth := $pg.auth | default dict -}}
{{- $pgInternal := and (ne (toString $pg.enabled) "false") (not $pg.external) -}}
{{- $vk := .Values.valkey | default dict -}}
{{- $vkAuth := $vk.auth | default dict -}}
{{- $vkInternal := and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-ted-lerian.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-ted-lerian.labels" (dict "context" . "component" (index .Values "plugin-br-ted-lerian").name "name" (index .Values "plugin-br-ted-lerian").name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := (index .Values "plugin-br-ted-lerian").secrets }}
  {{- if not (or (and $pgInternal (eq $key "POSTGRES_PASSWORD")) (and $vkInternal (eq $key "REDIS_PASSWORD"))) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
