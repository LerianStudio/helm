{{- if .Values.auth.ingress.enabled -}}
{{- $h := include "plugin-auth.health" . | fromYaml -}}
{{- include "lerian-common.ingress" (dict
      "context" .
      "ingress" (include "plugin-access-manager.ingress" (dict "ingress" .Values.auth.ingress "global" (.Values.global).ingress) | fromYaml)
      "global" (.Values.global).ingress
      "subdomain" "auth"
      "name" (include "plugin-auth.fullname" .)
      "labels" (printf "%s " (include "plugin-auth.labels" (dict "context" . "name" .Values.auth.name)))
      "svcPort" .Values.auth.service.port
      "healthcheck" $h.alb
    ) }}
{{- end }}
