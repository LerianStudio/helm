name: Access Manager startup contract

on:
  pull_request:
    paths:
      - 'charts/plugin-access-manager/**'
      - '.github/configs/helm-render-values/plugin-access-manager.yaml'
      - '.github/workflows/access-manager-startup-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-contract:
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Build locked dependencies
        run: helm dependency build charts/plugin-access-manager
      - name: Lint chart
        run: helm lint charts/plugin-access-manager --strict -f .github/configs/helm-render-values/plugin-access-manager.yaml
      - name: Test startup validation
        run: |
          python3 -m venv "${RUNNER_TEMP}/pam-startup-tests"
          "${RUNNER_TEMP}/pam-startup-tests/bin/pip" install 'PyYAML==6.0.2'
          "${RUNNER_TEMP}/pam-startup-tests/bin/python" -m unittest discover -s charts/plugin-access-manager/tests -p 'test_*.py' -v
