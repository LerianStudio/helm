{{- if .Values.api.enabled }}
{{- $h := include "plugin-br-pix-jd.api.health" . | fromYaml }}
{{- $lic := include "plugin-br-pix-jd.licenseFileSecret" .Values.api }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-br-pix-jd.componentFullname" (dict "root" $ "name" "api") }}
  namespace: {{ include "plugin-br-pix-jd.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "api") | nindent 4 }}
  {{- with (include "plugin-br-pix-jd.commonAnnotations" (dict "root" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- /* The preset drops replicas when the HPA owns the count: leaving it set makes
     every `helm upgrade` reset the scale the autoscaler just decided. */ -}}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit }}
  strategy:
    {{- toYaml $h.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "plugin-br-pix-jd.componentSelectorLabels" (dict "root" $ "name" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the pods when env changes. Without this a ConfigMap-only edit
           leaves the running pods on the old values with no visible signal. */}}
        checksum/config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        {{- if include "plugin-br-pix-jd.rendersOwnSecret" (dict "comp" .Values.api) }}
        checksum/secret: {{ include (print $.Template.BasePath "/api/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with (include "plugin-br-pix-jd.commonAnnotations" (dict "root" $)) }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "plugin-br-pix-jd.componentPodLabels" (dict "root" $ "name" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plugin-br-pix-jd.serviceAccountName" . }}
      {{- with (.Values.api.imagePullSecrets | default (.Values.global).imagePullSecrets) }}
      {{- include "lerian-common.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      {{- /* Self-contained if/else in the helper: fsGroup 65532 when Roles Anywhere is
         on, so the sidecar (runAsUser 65532) can read the 0440 cert volume; otherwise
         the chart's own podSecurityContext. Deliberately NOT wrapped in a guard —
         the helper owns both branches. */}}
      {{- include "lerian-common.rolesAnywhere.podSecurityContext" (dict "aws" .Values.aws "podSecurityContext" .Values.podSecurityContext) | nindent 6 }}
      {{- /* Above the lib-streaming close timeout so an in-flight CloudEvent flush
         completes instead of being cut off mid-close. */}}
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
      {{- /* Migrations are NOT run from this pod. They are a segregated Job
         (templates/common/migrations-job.yaml), which is the repository convention —
         see plugin-br-bank-transfer, notifications, plugin-access-manager,
         plugin-br-pix-switch. A per-pod init container would re-run the migration on
         every replica start and couple the schema to the rollout. */}}
      containers:
        - name: api
          image: {{ include "plugin-br-pix-jd.componentImage" (dict "root" $ "comp" .Values.api) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- /* No command/args: the image's own ENTRYPOINT is /service (cmd/app).
             The worker is the component that overrides it. */}}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "plugin-br-pix-jd.componentFullname" (dict "root" $ "name" "api") }}
            - secretRef:
                name: {{ include "plugin-br-pix-jd.componentSecretName" (dict "root" $ "name" "api" "comp" .Values.api) }}
          env:
            {{- toYaml $h.env | nindent 12 }}
            {{- /* Single-sourced Postgres password: read straight from the bundled
               subchart's own Secret (or the operator's existingSecret), never
               duplicated into this chart's Secret. */ -}}
            {{- include "plugin-br-pix-jd.dbPasswordEnv" . | nindent 12 }}
            {{- /* `with` em vez de include direto: no caminho externo o helper é vazio e
               um nindent sobre string vazia deixa uma linha só de espaços no manifest
               renderizado. Assim o render de todo install que NÃO usa o Valkey embarcado
               fica byte-idêntico ao de antes desta mudança. */}}
            {{- with (include "plugin-br-pix-jd.redisPasswordEnv" .) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- /* Points the AWS SDK inside the app at the sidecar's loopback IMDS
               instead of the (absent) instance metadata service. */}}
            {{- if include "plugin-br-pix-jd.rolesAnywhereEnabled" . }}
            {{- include "lerian-common.rolesAnywhere.imdsEnv" (dict "aws" .Values.aws) | nindent 12 }}
            {{- end }}
            {{- if $lic }}
            - name: LICENSE_FILE_PATH
              value: /etc/lerian/license/license
            {{- end }}
            {{- with .Values.api.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $h.readinessProbe | nindent 12 }}
          {{- if $lic }}
          volumeMounts:
            - name: license-file
              mountPath: /etc/lerian/license
              readOnly: true
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if include "plugin-br-pix-jd.rolesAnywhereEnabled" . }}
        {{- include "lerian-common.rolesAnywhere.sidecar" (dict "aws" .Values.aws) | nindent 8 }}
        {{- end }}
      {{- if or $lic (include "plugin-br-pix-jd.rolesAnywhereEnabled" .) }}
      volumes:
        {{- with $lic }}
        - name: license-file
          secret:
            secretName: {{ . | quote }}
            items:
              - key: license
                path: license
        {{- end }}
        {{- if include "plugin-br-pix-jd.rolesAnywhereEnabled" . }}
        {{- include "lerian-common.rolesAnywhere.volume" (dict "aws" .Values.aws "iamTlsDefault" (printf "%s-iam-tls" (include "plugin-br-pix-jd.fullname" .))) | trimPrefix "volumes:\n" | nindent 6 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.api.nodeSelector .Values.api.affinity .Values.api.tolerations }}
      {{- include "lerian-common.scheduling" .Values.api | nindent 6 }}
      {{- end }}
{{- end }}
