{{- $h := include "inbound.health" . | fromYaml }}
{{- if $h.pdb }}
{{- include "lerian-common.pdb" (dict
      "pdb" $h.pdb
      "name" (include "inbound.fullname" .)
      "labels" (include "inbound.labels" (dict "context" . "name" .Values.inbound.name))
      "selector" (include "inbound.selectorLabels" (dict "context" . "name" .Values.inbound.name))
    ) }}
{{- end }}
