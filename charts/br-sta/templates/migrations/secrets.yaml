{{- $pgAuth := (.Values.postgresql | default dict).auth | default dict -}}
{{- $pgFromSubchart := or (eq (include "br-sta.postgresInternal" .) "true") $pgAuth.existingSecret -}}
{{- if and .Values.migrations.enabled (ne (include "br-sta.multiTenantEnabled" .) "true") (not .Values.migrations.useExistingSecret) (not .Values.common.useExistingSecret) (not $pgFromSubchart) }}
{{- $pw := .Values.migrations.postgres.password | default (.Values.common.secrets | default dict).POSTGRES_PASSWORD | default "" -}}
{{- if not $pw -}}
{{- fail "\n\nERROR: br-sta: POSTGRES_PASSWORD is required for the migrations Job (the runner refuses to start without it).\n  set: common.secrets.POSTGRES_PASSWORD (or migrations.postgres.password / migrations.useExistingSecret), or disable it with migrations.enabled=false\n" -}}
{{- end }}
# Dedicated PreSync Secret carrying only the Postgres password for the migration
# Job. PreSync hooks run BEFORE the main sync wave, so on a first install the
# app Secret does not exist yet. This hook Secret (weight -2) is created before
# the migration Job (weight -1). hook-delete-policy is BeforeHookCreation ONLY
# (not HookSucceeded) so it survives the whole PreSync phase for the Job to read.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-sta.componentFullname" (dict "root" . "component" "migrations") }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sta.jobLabels" (dict "root" . "name" (include "br-sta.componentFullname" (dict "root" . "component" "migrations")) "component" "migrations") | nindent 4 }}
  annotations:
    {{- include "br-sta.presyncAnnotations" (dict "weight" "-2" "deletePolicy" "BeforeHookCreation") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
{{- end }}
