{{/*
Outbound BTG client mTLS Secret — created ONLY when the operator supplies the
cert material inline via `mtls.tls.crt` (chart-managed mode). When `mtls.tls.crt`
is empty, this renders nothing and `mtls.secretName` is expected to already exist
(externally managed: cert-manager, External Secrets, Vault CSI, manual, ...).

`stringData` is used so a literal PEM works directly AND a GitOps placeholder
(e.g. AVP `<path:secret/...#tls.crt>`, resolved to plaintext at render time) works
without manual base64. Consumed read-only at 0440 via the mtls volume (see the
deployment templates).
*/}}
{{- if and .Values.mtls.enabled (index .Values.mtls "tls.crt") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mtls.secretName | required "mtls.secretName is required when mtls.enabled=true" }}
  labels:
    {{- include "plugin-br-pix-indirect-btg.labels" (dict "context" . "name" .Values.pix.name) | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mtls.certFileName | default "tls.crt" }}: {{ index .Values.mtls "tls.crt" | quote }}
  {{ .Values.mtls.keyFileName | default "tls.key" }}: {{ required "mtls.tls.key is required when mtls.tls.crt is set" (index .Values.mtls "tls.key") | quote }}
  {{- with (index .Values.mtls "ca.crt") }}
  {{ $.Values.mtls.caFileName | default "ca.crt" }}: {{ . | quote }}
  {{- end }}
{{- end }}
