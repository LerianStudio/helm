{{- if .Values.manager.enabled }}
{{- /* Merged legacy override map: component `manager.configmap` WINS over the
   shared `common.configmap` (reproduces the old range order: common first,
   then component). Passed as the `configmap` (native-key, top precedence) to
   every cfgValue/datastore/otel helper so both legacy locations keep working. */ -}}
{{- $cm := merge (deepCopy (.Values.manager.configmap | default dict)) (.Values.common.configmap | default dict) -}}
{{- $app := .Values.manager.app | default dict -}}
{{- $auth := .Values.manager.auth | default dict -}}
{{- $swagger := .Values.manager.swagger | default dict -}}
{{- $pdf := .Values.manager.pdf | default dict -}}
{{- $rl := .Values.manager.rateLimit | default dict -}}
{{- $otel := .Values.common.otel | default dict -}}
{{- $mgrOtel := .Values.manager.otel | default dict -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plugin-manager.fullname" . }}
  labels:
    {{- include "plugin-manager.labels" (dict "context" . "name" .Values.manager.name ) | nindent 4 }}
  {{- with .Values.manager.configmap.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
data:
  # =============================================================================
  # SHARED CONFIG (manager + worker) — grouped params under `common.*`; legacy
  # `common.configmap.<KEY>` / `manager.configmap.<KEY>` still override.
  # =============================================================================
  {{- include "reporter.commonConfigData" (dict "context" . "cm" $cm) | nindent 2 }}
  # =============================================================================
  # OPEN TELEMETRY (flat passthrough; SERVICE_VERSION + VERSION come from image tag)
  # =============================================================================
  {{- include "lerian-common.otel.envFlat" (dict
        "configmap" $cm
        "keys" (list
          "OTEL_RESOURCE_SERVICE_NAME"
          "OTEL_LIBRARY_NAME"
          "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT"
          "OTEL_EXPORTER_OTLP_ENDPOINT_PORT"
          "OTEL_EXPORTER_OTLP_ENDPOINT")
        "defaults" (dict
          "OTEL_RESOURCE_SERVICE_NAME" ($mgrOtel.serviceName | default "reporter-manager")
          "OTEL_LIBRARY_NAME" ($otel.libraryName | default "github.com/LerianStudio/reporter")
          "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" ($otel.deploymentEnvironment | default "production")
          "OTEL_EXPORTER_OTLP_ENDPOINT_PORT" ($otel.otlpEndpointPort | default "4317")
          "OTEL_EXPORTER_OTLP_ENDPOINT" ($otel.otlpEndpoint | default "otlp://midaz-otel-lgtm:4317"))) | nindent 2 }}
  ENABLE_TELEMETRY: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ENABLE_TELEMETRY" "params" $otel "field" "enableTelemetry" "default" "true") | quote }}
  OTEL_INSECURE_EXPORTER: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OTEL_INSECURE_EXPORTER" "params" $otel "field" "insecureExporter" "default" "false") | quote }}
  # =============================================================================
  # MANAGER-SPECIFIC CONFIG
  # =============================================================================
  APP_CONTEXT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "APP_CONTEXT" "params" $app "field" "appContext" "default" "/manager/v1") | quote }}
  SERVER_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SERVER_PORT" "params" $app "field" "serverPort" "default" "4005") | quote }}
  SERVER_ADDRESS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SERVER_ADDRESS" "params" $app "field" "serverAddress" "default" ":4005") | quote }}
  LOG_LEVEL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "LOG_LEVEL" "params" $app "field" "logLevel" "default" "debug") | quote }}
  # AUTH
  PLUGIN_AUTH_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "PLUGIN_AUTH_ENABLED" "params" $auth "field" "enabled" "default" "false") | quote }}
  PLUGIN_AUTH_ADDRESS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "PLUGIN_AUTH_ADDRESS" "params" $auth "field" "address" "default" "http://plugin-access-manager-auth:4000") | quote }}
  # SWAGGER
  SWAGGER_TITLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_TITLE" "params" $swagger "field" "title" "default" "Reporter") | quote }}
  SWAGGER_DESCRIPTION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_DESCRIPTION" "params" $swagger "field" "description" "default" "Documentation for reporter") | quote }}
  SWAGGER_VERSION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_VERSION" "params" $swagger "field" "version" "default" "v4.0.0") | quote }}
  SWAGGER_HOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_HOST" "params" $swagger "field" "host" "default" ":4005") | quote }}
  SWAGGER_BASE_PATH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_BASE_PATH" "params" $swagger "field" "basePath" "default" "/") | quote }}
  SWAGGER_SCHEMES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_SCHEMES" "params" $swagger "field" "schemes" "default" "http") | quote }}
  SWAGGER_LEFT_DELIMITER: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_LEFT_DELIMITER" "params" $swagger "field" "leftDelimiter" "default" "{{") | quote }}
  SWAGGER_RIGHT_DELIMITER: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_RIGHT_DELIMITER" "params" $swagger "field" "rightDelimiter" "default" "}}") | quote }}
  # PDF RENDERING
  PDF_POOL_WORKERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "PDF_POOL_WORKERS" "params" $pdf "field" "poolWorkers" "default" "3") | quote }}
  PDF_TIMEOUT_SECONDS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "PDF_TIMEOUT_SECONDS" "params" $pdf "field" "timeoutSeconds" "default" "60") | quote }}
  # =============================================================================
  # RATE LIMITING — Three-tier system with Redis backend
  # Set RATE_LIMIT_ENABLED=false to disable (requires ALLOW_RATELIMIT_DISABLED in strict tier)
  # ALLOW_RATELIMIT_DISABLED: reason message explaining why rate limiting is disabled
  # ALLOW_RATELIMIT_FAIL_OPEN: reason message to allow fail-open mode in production
  # =============================================================================
  RATE_LIMIT_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_ENABLED" "params" $rl "field" "enabled" "default" "true") | quote }}
  RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_MAX" "params" $rl "field" "max" "default" "500") | quote }}
  RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "windowSec" "default" "60") | quote }}
  AGGRESSIVE_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AGGRESSIVE_RATE_LIMIT_MAX" "params" $rl "field" "aggressiveMax" "default" "100") | quote }}
  AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AGGRESSIVE_RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "aggressiveWindowSec" "default" "60") | quote }}
  RELAXED_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RELAXED_RATE_LIMIT_MAX" "params" $rl "field" "relaxedMax" "default" "1000") | quote }}
  RELAXED_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RELAXED_RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "relaxedWindowSec" "default" "60") | quote }}
  RATE_LIMIT_REDIS_TIMEOUT_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_REDIS_TIMEOUT_MS" "params" $rl "field" "redisTimeoutMs" "default" "500") | quote }}
  ALLOW_RATELIMIT_DISABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ALLOW_RATELIMIT_DISABLED" "params" $rl "field" "allowDisabled" "default" "") | quote }}
  ALLOW_RATELIMIT_FAIL_OPEN: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ALLOW_RATELIMIT_FAIL_OPEN" "params" $rl "field" "allowFailOpen" "default" "") | quote }}
  # Always set VERSION and OTEL_RESOURCE_SERVICE_VERSION from the image tag
  VERSION: {{ .Values.manager.image.tag | quote }}
  OTEL_RESOURCE_SERVICE_VERSION: {{ .Values.manager.image.tag | quote }}
  # =============================================================================
  # LEGACY PASSTHROUGH — any raw configmap key not covered above (e.g.
  # DATASOURCE_EXTERNAL_*) stays supported. Empty by default.
  # =============================================================================
  {{- $reserved := printf "%s APP_CONTEXT SERVER_PORT SERVER_ADDRESS LOG_LEVEL PLUGIN_AUTH_ENABLED PLUGIN_AUTH_ADDRESS SWAGGER_TITLE SWAGGER_DESCRIPTION SWAGGER_VERSION SWAGGER_HOST SWAGGER_BASE_PATH SWAGGER_SCHEMES SWAGGER_LEFT_DELIMITER SWAGGER_RIGHT_DELIMITER PDF_POOL_WORKERS PDF_TIMEOUT_SECONDS RATE_LIMIT_ENABLED RATE_LIMIT_MAX RATE_LIMIT_WINDOW_SEC AGGRESSIVE_RATE_LIMIT_MAX AGGRESSIVE_RATE_LIMIT_WINDOW_SEC RELAXED_RATE_LIMIT_MAX RELAXED_RATE_LIMIT_WINDOW_SEC RATE_LIMIT_REDIS_TIMEOUT_MS ALLOW_RATELIMIT_DISABLED ALLOW_RATELIMIT_FAIL_OPEN" (include "reporter.commonConfigKeys" .) -}}
  {{- include "reporter.legacyConfigPassthrough" (dict "cm" $cm "reserved" $reserved) | nindent 2 }}
  # Extra Env Vars
  {{- with .Values.manager.extraEnvVars }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
