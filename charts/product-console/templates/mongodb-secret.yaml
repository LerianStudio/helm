{{- /* The bundled MongoDB's root password outlives the release, like its volume, so a same-name
   reinstall opens the kept data. Same name, namespace and keys as the subchart's own Secret; its
   old value is read where this Secret lives, else (a namespace move) where the subchart read it. */ -}}
{{- $mongo := .Values.mongodb }}
{{- if and $mongo.enabled $mongo.auth.enabled (empty $mongo.auth.existingSecret) }}
{{- fail "mongodb.auth.existingSecret is empty: leave it unset to use the Secret this chart keeps, or name your own Secret" }}
{{- end }}
{{- if and $mongo.enabled $mongo.auth.enabled $mongo.auth.existingSecret (not (tpl ($mongo.auth.existingSecret | toString) .)) }}
{{- if or $mongo.auth.username $mongo.auth.usernames (and $mongo.metrics.enabled $mongo.metrics.username) }}
{{- fail "mongodb custom users and a metrics user need mongodb.auth.existingSecret: the Secret this chart keeps holds the root password only" }}
{{- end }}
{{- $name := include "product-console.mongodb.fullname" . }}
{{- $ns := include "product-console.mongodb.namespace" . }}
{{- $ctx := dict "Values" $mongo "Release" .Release }}
{{- if lookup "v1" "Secret" $ns $name }}
{{- $ctx = dict "Values" (merge (dict "namespaceOverride" $ns) $mongo) "Release" .Release }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "product-console.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongodb-root-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "mongodb-root-password" "providedValues" (list "auth.rootPassword") "honorProvidedValues" true "context" $ctx) }}
  {{- if eq $mongo.architecture "replicaset" }}
  mongodb-replica-set-key: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "mongodb-replica-set-key" "providedValues" (list "auth.replicaSetKey") "honorProvidedValues" true "context" $ctx) }}
  {{- end }}
{{- end }}
