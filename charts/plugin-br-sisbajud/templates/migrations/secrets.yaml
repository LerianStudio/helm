{{- /*
Migration-only Secret (hook, weight -10): carries ONLY POSTGRES_PASSWORD copied
from sisbajud.secrets, because the pre-install Job runs before the app Secret
(a normal resource) exists on the first sync. Rendered only on the external
PostgreSQL path when the password comes from values. before-hook-creation only:
a hook-succeeded Secret would be deleted before the Job at -5 reads it.
*/ -}}
{{- $s := .Values.sisbajud -}}
{{- $extra := $s.extraEnvVars | default dict -}}
{{- if and $s.enabled (eq (include "plugin-br-sisbajud.migrationsOn" .) "true") (ne (include "plugin-br-sisbajud.postgresBundled" .) "true") (ne (include "plugin-br-sisbajud.postgresPasswordFromRef" .) "true") (not .Values.migrations.existingSecret) (not $s.useExistingSecret) (not (hasKey $extra "POSTGRES_PASSWORD")) ($s.secrets | default dict).POSTGRES_PASSWORD -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-sisbajud.migrationsFullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-sisbajud.labels" (dict "context" $ "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $s.secrets.POSTGRES_PASSWORD | toString | quote }}
{{- end -}}
