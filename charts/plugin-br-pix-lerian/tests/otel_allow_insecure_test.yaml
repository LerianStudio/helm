suite: node-local OTEL hop in production (ALLOW_INSECURE_OTEL)
release: {name: test, namespace: test}
templates:
  - templates/spi/deployment.yaml
  - templates/spi/configmap.yaml
  - templates/spi/secrets.yaml
  - templates/spi-systemplane/deployment.yaml
  - templates/spi-systemplane/configmap.yaml
  - templates/spi-systemplane/secrets.yaml
  - templates/dict-hub/deployment.yaml
  - templates/dict-hub/configmap.yaml
  - templates/dict-hub/secrets.yaml
  - templates/dict-hub-vsync/deployment.yaml
  - templates/dict-hub-vsync/configmap.yaml
  - templates/dict-hub-vsync/secrets.yaml
  - templates/dict-proxy/deployment.yaml
  - templates/dict-proxy/configmap.yaml
  - templates/dict-proxy/secrets.yaml
  - templates/dict-systemplane/deployment.yaml
  - templates/dict-systemplane/configmap.yaml
  - templates/dict-systemplane/secrets.yaml
  - templates/cob-hub/deployment.yaml
  - templates/cob-hub/configmap.yaml
  - templates/cob-hub/secrets.yaml
  - templates/cob-proxy/deployment.yaml
  - templates/cob-proxy/configmap.yaml
  - templates/cob-proxy/secrets.yaml
  - templates/cob-systemplane/deployment.yaml
  - templates/cob-systemplane/configmap.yaml
  - templates/cob-systemplane/secrets.yaml
  - templates/pixauto/deployment.yaml
  - templates/pixauto/configmap.yaml
  - templates/pixauto/secrets.yaml
  - templates/pixauto-systemplane/deployment.yaml
  - templates/pixauto-systemplane/configmap.yaml
  - templates/pixauto-systemplane/secrets.yaml
  - templates/adapter-lerian/deployment.yaml
  - templates/adapter-lerian/configmap.yaml
  - templates/adapter-lerian/secrets.yaml
  - templates/adapter-lerian-systemplane/deployment.yaml
  - templates/adapter-lerian-systemplane/configmap.yaml
  - templates/adapter-lerian-systemplane/secrets.yaml
  - templates/adapter-provider-mock/deployment.yaml
  - templates/adapter-provider-mock/configmap.yaml
  - templates/adapter-provider-mock/secrets.yaml
set:
  global.observability.enabled: true
  spi.enabled: true
  spiSystemplane.enabled: true
  dictHub.enabled: true
  dictHubVsync.enabled: true
  dictProxy.enabled: true
  dictSystemplane.enabled: true
  cobHub.enabled: true
  cobProxy.enabled: true
  cobSystemplane.enabled: true
  pixauto.enabled: true
  pixautoSystemplane.enabled: true
  adapterLerian.enabled: true
  adapterLerianSystemplane.enabled: true
  adapterProviderMock.enabled: true
  dictHubVsync.secrets.RABBITMQ_URI: amqp://guest:fixture@rabbitmq.example.invalid:5672/
tests:
  - it: 'spi: the plaintext node-local endpoint carries the default reason'
    template: templates/spi/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi: global.observability.allowInsecureOtel sets the value env-wide'
    template: templates/spi/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi: the component configmap wins over the global'
    template: templates/spi/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
      spi.configmap.ALLOW_INSECURE_OTEL: 'component reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'component reason'}
  - it: 'spi: an explicit refusal stands as the one entry'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.ALLOW_INSECURE_OTEL: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi: a false global is a refusal too'
    template: templates/spi/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'false'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'false'}
  - it: 'spi: a null component value falls through to the global'
    template: templates/spi/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
      spi.configmap.ALLOW_INSECURE_OTEL: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi: a null global leaves the node-local reason'
    template: templates/spi/deployment.yaml
    set:
      global.observability.allowInsecureOtel: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi: an operator value in extraEnvVars stands as the only entry'
    template: templates/spi/deployment.yaml
    set:
      spi.extraEnvVars.ALLOW_INSECURE_OTEL: 'operator reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'operator reason'}
  - it: 'spi: an operator HOST_IP is not the node-local hop: no default entry'
    template: templates/spi/deployment.yaml
    set:
      spi.extraEnvVars.HOST_IP: '10.0.0.1'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: an operator HOST_IP with a global value leaves it to the ConfigMap'
    template: templates/spi/deployment.yaml
    set:
      spi.extraEnvVars.HOST_IP: '10.0.0.1'
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: an operator HOST_IP with a Secret value lets the model refusal win'
    template: templates/spi/deployment.yaml
    set:
      spi.extraEnvVars.HOST_IP: '10.0.0.1'
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      global.observability.allowInsecureOtel: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
  - it: 'spi: a YAML false in the Secret stands (no chart entry)'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: a YAML 0 in the Secret stands (no chart entry)'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: 0
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: operator endpoint: a global refusal wins over a Secret reason'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      global.observability.allowInsecureOtel: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
  - it: 'spi: operator endpoint: a component value wins over a Secret reason'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      spi.configmap.ALLOW_INSECURE_OTEL: 'component reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'component reason'}
  - it: 'spi: operator endpoint: a Secret reason stands while the model is unset'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: operator endpoint: a global value without a Secret value stays in the ConfigMap'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: operator endpoint: extraEnvVars stays the only entry over Secret and model'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      global.observability.allowInsecureOtel: ''
      spi.extraEnvVars.ALLOW_INSECURE_OTEL: 'operator reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'operator reason'}
  - it: 'spi: operator HOST_IP + existing Secret: a model refusal wins via env'
    template: templates/spi/deployment.yaml
    set:
      spi.extraEnvVars.HOST_IP: '10.0.0.1'
      spi.useExistingSecret: true
      spi.existingSecretName: 'pix-existing'
      global.observability.allowInsecureOtel: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
  - it: 'spi: operator endpoint + existing Secret: the global reason wins via env'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.useExistingSecret: true
      spi.existingSecretName: 'pix-existing'
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi: operator endpoint + an empty Secret key: the global reason wins via env'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.secrets.ALLOW_INSECURE_OTEL: ''
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi: telemetry off + existing Secret: the component value wins via env'
    template: templates/spi/deployment.yaml
    set:
      global.observability.enabled: false
      spi.useExistingSecret: true
      spi.existingSecretName: 'pix-existing'
      spi.configmap.ALLOW_INSECURE_OTEL: 'component reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'component reason'}
  - it: 'spi: operator endpoint + existing Secret, model unset: no entry'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
      spi.useExistingSecret: true
      spi.existingSecretName: 'pix-existing'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: node-local + an empty Secret key: the default entry overrides it'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi: telemetry off: a model refusal still wins over a Secret reason'
    template: templates/spi/deployment.yaml
    set:
      global.observability.enabled: false
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      global.observability.allowInsecureOtel: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
  - it: 'spi: an explicit endpoint in the component configmap emits nothing'
    template: templates/spi/deployment.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel.example.invalid:4317'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: an explicit global endpoint emits nothing'
    template: templates/spi/deployment.yaml
    set:
      global.observability.otlpEndpoint: 'https://otel.example.invalid:4317'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: an operator endpoint in extraEnvVars emits nothing'
    template: templates/spi/deployment.yaml
    set:
      spi.extraEnvVars.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: telemetry off emits nothing'
    template: templates/spi/deployment.yaml
    set:
      global.observability.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: a non-empty Secret value stands while the model is unset'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: 'spi: the model wins over the Secret, a refusal included'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      spi.configmap.ALLOW_INSECURE_OTEL: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
  - it: 'spi: a global value wins over the Secret'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi: an empty Secret value is no legacy route'
    template: templates/spi/deployment.yaml
    set:
      spi.secrets.ALLOW_INSECURE_OTEL: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi: an existing Secret is invisible to the chart, so the entry is emitted'
    template: templates/spi/deployment.yaml
    set:
      spi.useExistingSecret: true
      spi.existingSecretName: 'pix-existing'
      spi.secrets.ALLOW_INSECURE_OTEL: 'secret reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi-systemplane: the plaintext node-local endpoint carries the default reason'
    template: templates/spi-systemplane/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi-systemplane: global.observability.allowInsecureOtel sets the value env-wide'
    template: templates/spi-systemplane/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi-systemplane: the component configmap wins over the global'
    template: templates/spi-systemplane/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
      spiSystemplane.configmap.ALLOW_INSECURE_OTEL: 'component reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'component reason'}
  - it: 'spi-systemplane: an explicit refusal stands as the one entry'
    template: templates/spi-systemplane/deployment.yaml
    set:
      spiSystemplane.configmap.ALLOW_INSECURE_OTEL: ''
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ''}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi-systemplane: a false global is a refusal too'
    template: templates/spi-systemplane/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'false'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'false'}
  - it: 'spi-systemplane: a null component value falls through to the global'
    template: templates/spi-systemplane/deployment.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
      spiSystemplane.configmap.ALLOW_INSECURE_OTEL: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'env-wide reason'}
  - it: 'spi-systemplane: a null global leaves the node-local reason'
    template: templates/spi-systemplane/deployment.yaml
    set:
      global.observability.allowInsecureOtel: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: 'node-local collector on the pod''s own node'}
  - it: 'spi-systemplane: an operator value in extraEnvVars stands as the only entry'
    template: templates/spi-systemplane/deployment.yaml
    set:
      spiSystemplane.extraEnvVars.ALLOW_INSECURE_OTEL: 'operator reason'
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
