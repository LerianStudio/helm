suite: API deployment shutdown grace
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
release:
  name: system-facts
  namespace: system-facts
tests:
  - it: gives the API pod 55s to shut down
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 55
        template: templates/deployment.yaml

  - it: honours an override
    set:
      system-facts.terminationGracePeriodSeconds: 90
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90
        template: templates/deployment.yaml

  - it: sets a 15s drain delay on the API pod
    asserts:
      - equal:
          path: data.SHUTDOWN_DRAIN_DELAY
          value: "15s"
        template: templates/configmap.yaml

  - it: keeps an explicit 0 grace period
    set:
      system-facts.terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
        template: templates/deployment.yaml

  - it: never renders LICENSE_ENABLED from extraEnvVars
    set:
      system-facts.extraEnvVars:
        - name: LICENSE_ENABLED
          value: "false"
    asserts:
      - notExists:
          path: data.LICENSE_ENABLED
        template: templates/configmap.yaml

  - it: leaves REDIS_TLS unset under a cloud preset
    set:
      global.cloud: aws
    asserts:
      - notExists:
          path: data.REDIS_TLS
        template: templates/configmap.yaml

  - it: renders REDIS_TLS from global.datastores.redis.tls
    set:
      global.datastores.redis.tls: true
    asserts:
      - equal:
          path: data.REDIS_TLS
          value: "true"
        template: templates/configmap.yaml

  - it: never renders LICENSE_ENABLED from secrets
    set:
      system-facts.secrets.LICENSE_ENABLED: "false"
    asserts:
      - notExists:
          path: stringData.LICENSE_ENABLED
        template: templates/secrets.yaml

  - it: renders no SD_ keys
    asserts:
      - notExists:
          path: data.SD_ENABLED
        template: templates/configmap.yaml

  - it: mounts no licence file with licenseFile null
    set:
      system-facts.licenseFile: null
    asserts:
      - notExists:
          path: spec.template.spec.volumes
        template: templates/deployment.yaml

  - it: mounts the licence Secret as a directory in file mode
    set:
      system-facts.licenseFile.existingSecret: sf-license
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: sf-license
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LICENSE_FILE_PATH
            value: /etc/lerian/license/license
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: license-file
            mountPath: /etc/lerian/license
            readOnly: true
        template: templates/deployment.yaml
