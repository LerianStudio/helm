# ClusterIP service exposing the agent's health/metrics endpoints
# internally. The agent does not serve external traffic - it only polls the
# control plane outbound.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lerian-agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lerian-agent.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: {{ include "lerian-agent.name" . }}
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP
