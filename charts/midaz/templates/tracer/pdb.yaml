{{- if and .Values.tracer.enabled .Values.tracer.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
  {{- with .Values.tracer.pdb.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if hasKey .Values.tracer.pdb "maxUnavailable" }}
  maxUnavailable: {{ .Values.tracer.pdb.maxUnavailable }}
  {{- else if hasKey .Values.tracer.pdb "minAvailable" }}
  minAvailable: {{ .Values.tracer.pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "midaz-tracer.selectorLabels" (dict "context" . "name" .Values.tracer.name) | nindent 6 }}
{{- end }}
