{{- if and .Values.bankTransfer.enabled .Values.bankTransfer.pdb.enabled }}
{{- $h := include "bank-transfer.health" . | fromYaml }}
{{- include "lerian-common.pdb" (dict
      "pdb" (merge (dict "annotations" .Values.bankTransfer.pdb.annotations) $h.pdb)
      "name" (include "bank-transfer.fullname" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "bank-transfer.labels" (dict "context" . "component" .Values.bankTransfer.name "name" .Values.bankTransfer.name))
      "selector" (include "bank-transfer.selectorLabels" (dict "context" . "component" .Values.bankTransfer.name "name" .Values.bankTransfer.name))
    ) }}
{{- end }}
