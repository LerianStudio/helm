{{- if and (or .Values.manager.enabled .Values.worker.enabled) (not .Values.common.useExistingSecret) -}}
{{- /* The SHARED app Secret (manager + worker; the bundled rabbitmq reads its
   credentials from it too). Chart-modeled credentials (templates/_helpers.tpl
   br-sta.secretData), then any other common.secrets key verbatim, except keys
   the app no longer reads (br-sta.removedKeys) and the bundled-infra
   passwords, which are single-sourced from the subchart Secrets. */ -}}
{{- $body := include "br-sta.secretData" . -}}
{{- $emitted := fromYaml $body | default dict -}}
{{- $removed := include "br-sta.removedKeys" . | fromJsonArray -}}
{{- $infra := list "POSTGRES_PASSWORD" "REDIS_PASSWORD" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-sta.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sta.sharedLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $line := splitList "\n" $body }}
  {{- if trim $line }}
  {{ $line }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := (.Values.common.secrets | default dict) }}
  {{- if and $v (not (hasKey $emitted $k)) (not (has $k $removed)) (not (has $k $infra)) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
{{- end -}}
