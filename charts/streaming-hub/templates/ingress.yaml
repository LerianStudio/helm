{{- if .Values.streamingHub.ingress.enabled }}
{{/*
Control-plane API ingress (default OFF; opt-in per env in gitops).
Backend Service is the active role's component Service:
  - mode=all    -> the `all` Service.
  - mode=split  -> the `ingest` Service (the control API is served on EVERY role,
                   so ingest is an arbitrary-but-stable default; override the
                   backend by editing this template if delivery is preferred).
*/}}
{{- $component := ternary "all" "ingest" (eq .Values.streamingHub.mode "all") -}}
{{- $svcName := include "streaming-hub.componentFullname" (dict "context" . "component" $component) -}}
{{- /* On ALB the target-group health check comes from the health preset and wins over user annotations. */ -}}
{{- $annotations := deepCopy (.Values.streamingHub.ingress.annotations | default dict) -}}
{{- if eq (toString .Values.streamingHub.ingress.className) "alb" -}}
{{- $alb := (include "streaming-hub.health" (dict "root" . "component" $component) | fromYaml).alb -}}
{{- $annotations = mergeOverwrite $annotations (dict
      "alb.ingress.kubernetes.io/healthcheck-path" $alb.path
      "alb.ingress.kubernetes.io/healthcheck-port" (toString $alb.port)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "streaming-hub.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "streaming-hub.labels" (dict "context" . "component" $component) | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.streamingHub.ingress.className }}
  ingressClassName: {{ .Values.streamingHub.ingress.className }}
  {{- end }}
  {{- if .Values.streamingHub.ingress.tls }}
  tls:
    {{- range .Values.streamingHub.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.streamingHub.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- /* pathType is REQUIRED by networking.k8s.io/v1 — an omitted one
                 renders `pathType: null` and the API server rejects the whole
                 Ingress, failing the release. Quote the path so "/" stays a
                 string rather than being re-parsed by the YAML loader. */}}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $.Values.streamingHub.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
