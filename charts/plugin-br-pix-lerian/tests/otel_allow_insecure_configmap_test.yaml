suite: ALLOW_INSECURE_OTEL in the ConfigMap (collector off / operator endpoint)
release: {name: test, namespace: test}
templates:
  - templates/spi/configmap.yaml
  - templates/spi-systemplane/configmap.yaml
  - templates/dict-hub/configmap.yaml
  - templates/dict-hub-vsync/configmap.yaml
  - templates/dict-proxy/configmap.yaml
  - templates/dict-systemplane/configmap.yaml
  - templates/cob-hub/configmap.yaml
  - templates/cob-proxy/configmap.yaml
  - templates/cob-systemplane/configmap.yaml
  - templates/pixauto/configmap.yaml
  - templates/pixauto-systemplane/configmap.yaml
  - templates/adapter-lerian/configmap.yaml
  - templates/adapter-lerian-systemplane/configmap.yaml
  - templates/adapter-provider-mock/configmap.yaml
set:
  global.observability.enabled: true
  spi.enabled: true
  spiSystemplane.enabled: true
  dictHub.enabled: true
  dictHubVsync.enabled: true
  dictProxy.enabled: true
  dictSystemplane.enabled: true
  cobHub.enabled: true
  cobProxy.enabled: true
  cobSystemplane.enabled: true
  pixauto.enabled: true
  pixautoSystemplane.enabled: true
  adapterLerian.enabled: true
  adapterLerianSystemplane.enabled: true
  adapterProviderMock.enabled: true
  dictHubVsync.secrets.RABBITMQ_URI: amqp://guest:fixture@rabbitmq.example.invalid:5672/
tests:
  - it: 'spi: an operator endpoint carries the global value'
    template: templates/spi/configmap.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: 'env-wide reason'
  - it: 'spi: the node-local default carries the global value too'
    template: templates/spi/configmap.yaml
    set:
      global.observability.allowInsecureOtel: 'env-wide reason'
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: 'env-wide reason'
  - it: 'spi: a global refusal reaches the ConfigMap as is'
    template: templates/spi/configmap.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
      global.observability.allowInsecureOtel: ''
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: ''
  - it: 'spi: the component configmap value wins over the global'
    template: templates/spi/configmap.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
      global.observability.allowInsecureOtel: 'env-wide reason'
      spi.configmap.ALLOW_INSECURE_OTEL: 'component reason'
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: 'component reason'
  - it: 'spi: an extraEnvVars key keeps the global out of the ConfigMap'
    template: templates/spi/configmap.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
      global.observability.allowInsecureOtel: 'env-wide reason'
      spi.extraEnvVars.ALLOW_INSECURE_OTEL: 'operator reason'
    asserts:
      - notExists:
          path: data.ALLOW_INSECURE_OTEL
  - it: 'spi: nothing set renders no key'
    template: templates/spi/configmap.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
    asserts:
      - notExists:
          path: data.ALLOW_INSECURE_OTEL
  - it: 'spi: a null global renders no key'
    template: templates/spi/configmap.yaml
    set:
      spi.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.example.invalid:4317'
      global.observability.allowInsecureOtel: null
    asserts:
      - notExists:
          path: data.ALLOW_INSECURE_OTEL
  - it: 'spi: a null component value falls through to the global'
    template: templates/spi/configmap.yaml
