name: Generate Changelog

# This workflow generates CHANGELOG.md using GPTChangelog
# Triggered on tag pushes to generate AI-powered release notes
#
# Features:
# - Generates CHANGELOG.md with AI-powered summaries for each chart
# - Updates GitHub Release notes
# - Creates PR with changelog updates
# - Supports monorepo structure (charts/)

on:
  push:
    tags:
      - '**-v*'  # Matches: midaz-v1.0.0, fetcher-v1.0.0, reporter-v2.1.0, etc.

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    uses: LerianStudio/shared-workflows-public/.github/workflows/gptchangelog.yml@tier-1
    with:
      runner_type: "blacksmith-4vcpu-ubuntu-2404"
      filter_paths: |-
        charts/agent
        charts/alloy-lerian
        charts/br-jd-courier
        charts/br-sisbajud
        charts/br-sta
        charts/fetcher
        charts/lerian-common
        charts/lerian-consul
        charts/midaz
        charts/notifications
        charts/otel-collector-lerian
        charts/plugin-access-manager
        charts/plugin-bc-correios
        charts/plugin-br-bank-transfer
        charts/plugin-br-payments
        charts/plugin-br-pix-indirect-btg
        charts/plugin-br-pix-jd
        charts/plugin-br-pix-lerian
        charts/plugin-br-sisbajud
        charts/plugin-br-ted-lerian
        charts/plugin-fees
        charts/product-console
        charts/reporter
        charts/streaming-hub
        charts/system-facts
        charts/tracer
      path_level: '2'
    secrets: inherit
