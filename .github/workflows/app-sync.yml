name: Update Helm Chart from Dispatch

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload with chart, components, and metadata'
        required: true
        type: string

jobs:
  update:
    # v1.74.3 adds root-image handling for single-service charts: product-console keeps
    # its image at the values root (.image.tag), so older versions wrote a bogus top-level
    # `product-console:` block instead of the real tag (had to be hand-fixed on every bump —
    # LerianStudio/helm #2157/#2187/#2193). Contract is unchanged for this caller: the inputs
    # passed here (payload, base_branch, legacy_branch_prefix, slack_notification) and all
    # secrets still exist, with `payload` the only required input.
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/helm-update-chart.yml@v1.74.3
    with:
      payload: ${{ inputs.payload }}
      # develop is retired for this repo (see the PR template): mainline updates belong on main.
      base_branch: main
      # Chart line branches use the same prefix as the app repos' maintenance lines,
      # instead of the action's `hotfix` default. Every existing chart line branch must
      # be renamed to this prefix: the resolver looks the branch up by <prefix>/<chart>-<line>.x
      # and would otherwise create a second, duplicate line off main.
      legacy_branch_prefix: maintenance
      slack_notification: true
    secrets:
      APP_ID: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}
      GPG_KEY: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
      GPG_KEY_PASSWORD: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
      GIT_USER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
      GIT_USER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
      SLACK_BOT_TOKEN_HELM: ${{ secrets.SLACK_BOT_TOKEN_HELM }}
      SLACK_CHANNEL_DEVOPS: ${{ secrets.SLACK_CHANNEL_DEVOPS }}
      SLACK_GROUP_DEVOPS_SRE: ${{ secrets.SLACK_GROUP_DEVOPS_SRE }}
      SLACK_BOT_SEVERINO: ${{ secrets.SLACK_BOT_SEVERINO }}