{{- if .Values.app.enabled -}}
{{- include "br-spi-mock-bacen.validateEnvironment" . -}}
{{- include "br-spi-mock-bacen.validateService" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "br-spi-mock-bacen.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-spi-mock-bacen.labels" . | nindent 4 }}
  {{- with (.Values.global | default dict).commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  revisionHistoryLimit: {{ .Values.app.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.app.updateStrategy.type }}
    {{- if eq .Values.app.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.app.updateStrategy.maxSurge }}
      maxUnavailable: {{ .Values.app.updateStrategy.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "br-spi-mock-bacen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the Pods when the rendered configuration changes. */}}
        checksum/config: {{ include "br-spi-mock-bacen.configmapData" . | sha256sum }}
        {{- with (.Values.global | default dict).commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "br-spi-mock-bacen.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $pullSecrets := concat ((.Values.global | default dict).imagePullSecrets | default list) (.Values.app.imagePullSecrets | default list) }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "br-spi-mock-bacen.serviceAccountName" . }}
      {{- /* The mock never calls the Kubernetes API, so the Pod gets no token. */}}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "br-spi-mock-bacen.name" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "br-spi-mock-bacen.image" . | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- /* Distroless image: no shell, no command override. */}}
          envFrom:
            - configMapRef:
                name: {{ include "br-spi-mock-bacen.fullname" . }}
          ports:
            - name: http
              containerPort: {{ include "br-spi-mock-bacen.containerPort" . }}
              protocol: TCP
          {{- if .Values.app.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.app.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.app.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.app.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.app.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.app.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.app.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.app.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.app.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
