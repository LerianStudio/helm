# Default values for the br-sfn (Brazilian SFN rails) chart.
#
# MODULARITY CONTRACT: every component defaults to enabled: false. This is a
# monorepo of independent rails — SPB (STR/TED), SPI (Pix, 4 runtime binaries),
# SILOC, SCR, desk (cockpit operator-state), slc-edge (Cabine SLC passthrough)
# and the cockpit SPA — and no deployment runs all of them. Enable exactly the
# rails the environment operates.
#
# INFRA CONTRACT: Postgres / Valkey(Redis) / RabbitMQ / RedPanda / IBM MQ are
# EXTERNAL pre-provisioned services. This chart ships no infra subcharts; every
# connection string arrives via each component's configmap/secrets maps, which
# are emitted VERBATIM (no fixed allowlist) so new env vars never need a chart
# change.
#
# RedPanda topics: spb and spi expect their topics to exist (the compose
# redpanda-topics one-shot is a dev-only convenience). Topic provisioning is an
# environment concern, not this chart's.
nameOverride: "br-sfn"
fullnameOverride: ""
namespaceOverride: ""

# @section Global (shared across all components)
global:
  # -- Container image registry prefix shared by every component (umbrella-wide).
  imageRegistry: ""
  # -- Image pull secrets shared by every component and migration Job (umbrella-wide).
  imagePullSecrets: []
  # =============================================================================
  # TIERED DEPENDENCY-CONNECTION SURFACE (env-wide masks / contracts).
  # Set a connection ONCE here and every wired component emits its native env keys
  # from it. Empty by default -> each component falls through to its own template
  # default (render-identical to the un-productized chart). Per-component overrides
  # live under `<component>.datastores`, and each component's `configmap.<KEY>`
  # still wins over everything (the escape hatch). See values-quickstart.yaml.
  #
  # PILOT NOTE: `spi` and `spb` read these today (first lerian-common consumers).
  # The remaining 6 rails are still bespoke escape-hatch and ignore global.* until
  # migrated; the blocks are introduced now so those later passes just wire to them.
  # =============================================================================
  # -- Shared datastore masks. Keys per type: postgres / redis / broker (RabbitMQ).
  # Each accepts host / port / user / name / ssl / replicaHost (spi uses postgres +
  # redis; spb adds broker).
  datastores: {}
  # example (uncomment & fill; comments render nothing = default stays empty):
  #   postgres: { host: "postgresql.internal", port: "5432", user: "brspi", name: "brspi", ssl: "require" }
  #   redis:    { host: "valkey.internal:6379" }
  #   broker:   { host: "rabbitmq.internal", port: "5672", user: "br_spb" }
  # -- Env-wide observability (OTel collector): enabled / otlpEndpoint / deploymentEnvironment.
  observability: {}
  #   enabled: "true"
  #   otlpEndpoint: "otel-collector-lerian:4317"
  #   deploymentEnvironment: "production"
  # -- Env-wide auth (plugin-access-manager): enabled / host. Per-component override
  # via `<component>.configmap.AUTH_ENABLED` / `PLUGIN_AUTH_ADDRESS`.
  auth: {}
  #   enabled: "true"
  #   host: "https://plugin-access-manager:4000"
  # -- Env-wide multi-tenant (tenant-manager). Read by scr (MULTI_TENANT_URL) via
  # lerian-common.multiTenant.env; keys: url (+ redisHost/redisPort/redisTls for
  # rails that emit the redis group). Per-component gate via configmap.MULTI_TENANT_ENABLED.
  multiTenant: {}
  #   url: "https://tenant-manager.internal"
  # -- Env-wide service discovery (Consul). Reserved; no br-sfn component wires it yet.
  serviceDiscovery: {}
  # -- Env-wide streaming (lib-streaming / RedPanda). Reserved as a GAP: spi's settlement
  # topics and scr's SCR_STREAMING_* are app-prefixed and do NOT match lib-streaming's
  # canonical STREAMING_* env contract, so no component wires streaming.env yet.
  streaming: {}
  # -- Env-wide object storage (S3 / SeaweedFS), keyed by backend name. Read by
  # correios (backend `default`) via lerian-common.objectStorage.value; fields:
  # <name>.{endpoint,region,bucket,disableSSL,usePathStyle}. Credentials -> secrets.
  objectStorage: {}
  #   default: { endpoint: "https://s3.amazonaws.com", region: "us-east-1" }
  # -- Env-wide KMS / Vault (envelope encryption). Reserved; spi custody is BACEN signer-kind, not this.
  kms: {}

# -- Default pull secret for every component and migration Job (single GHCR
# credential). Override per component via <component>.imagePullSecrets.
imagePullSecrets:
  - name: ghcr-credential

serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Pod-level security context (all components)
podSecurityContext: {}

# -- Container security context (alpine/debian nonroot images — UID/GID 65532;
# the cockpit overrides runAsUser/runAsGroup via cockpit.securityContext because
# nginx-unprivileged runs as uid 101).
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Image used by wait-for-dependency initContainers.
waitImage: busybox:1.36

# -- golang-migrate image for components whose migrations run from their baked
# /migrations tree (spb, scr, desk). spi and siloc ship dedicated migrator
# images instead (see their migrations blocks).
migrateImage: migrate/migrate:v4.18.1

# =============================================================================
# spb — SPB/STR rail (TED). CGO + IBM MQ runtime (debian-based image).
# =============================================================================
spb:
  enabled: false
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: ghcr.io/lerianstudio/br-spb
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  deploymentUpdate:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  service:
    type: ClusterIP
    # Matches the Dockerfile EXPOSE 3000.
    port: 3000
  # -- Dedicated datastore masks for SPB (Postgres + Redis + RabbitMQ). Overrides
  # global.datastores; each configmap.<KEY> still wins. postgres: host/port/user/name/
  # ssl/replicaHost; redis: host/port; broker (RabbitMQ): host/port/user.
  datastores: {}
  #   postgres: { host: "spb-postgresql", port: "5432", user: "br_spb", name: "br_bank_transfer_jota", ssl: "verify-full" }
  #   redis:    { host: "spb-valkey", port: "6379" }
  #   broker:   { host: "spb-rabbitmq", port: "5672", user: "br_spb" }
  # -- SPB ConfigMap escape hatch: set/override ANY native env KEY here (wins over
  # the template default). Credentials NEVER go here — use secrets.
  configmap: {}
  # -- SPB Secret map (emit-when-set). Holds POSTGRES/REDIS/RABBITMQ/STR_MQ passwords,
  # WEBHOOK_SECRET_KEY, STR_PAYLOAD_ENCRYPTION_KEY, SPB_KMIP_CRYPTO_USER_TOKEN, DEV_DEBUG_TOKEN.
  # Use useExistingSecret/existingSecretName to bring your own.
  secrets: {}
  useExistingSecret: false
  existingSecretName: ""
  extraEnvVars: []
  extraVolumes: []
  extraVolumeMounts: []
  livenessProbe: {}
  readinessProbe: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # PreSync migration Job — golang-migrate over the migrations tree baked into
  # the app image at /app/migrations (default schema_migrations table).
  migrations:
    enabled: true
    # Baked flavor: copies the tree out of the app image and runs migrateImage.
    sourcePath: /app/migrations
    # x-migrations-table; empty = golang-migrate default (schema_migrations).
    table: ""
    postgres:
      host: ""
      port: ""
      user: ""
      database: ""
      sslMode: ""
    # Defaults to this component's Secret and POSTGRES_PASSWORD key.
    passwordSecret:
      name: ""
      key: POSTGRES_PASSWORD
    imagePullSecrets: []
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 600
    resources: {}

# =============================================================================
