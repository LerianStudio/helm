          any: true

  - it: "worker ScaledJob: an explicit endpoint in the configmap is still overridden by the node-local hop, so the entry stays"
    template: templates/worker/keda-scaled-job.yaml
    set:
      keda.enabled: true
      common.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel.example.com:4317"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
          count: 1

  - it: "worker ScaledJob: a non-empty secrets.ALLOW_INSECURE_OTEL in the chart Secret stands (no entry)"
    template: templates/worker/keda-scaled-job.yaml
    set:
      keda.enabled: true
      secrets.ALLOW_INSECURE_OTEL: "secret reason"
    asserts:
      - notContains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true

  - it: "worker ScaledJob: a model refusal wins over the Secret value"
    template: templates/worker/keda-scaled-job.yaml
    set:
      keda.enabled: true
      secrets.ALLOW_INSECURE_OTEL: "secret reason"
      worker.configmap.ALLOW_INSECURE_OTEL: ""
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
          count: 1
      - notContains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "secret reason"}

  - it: "worker ScaledJob: a global value wins over the Secret value"
    template: templates/worker/keda-scaled-job.yaml
    set:
      keda.enabled: true
      secrets.ALLOW_INSECURE_OTEL: "secret reason"
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
          count: 1

  - it: "worker ScaledJob: an empty secrets.ALLOW_INSECURE_OTEL is no legacy route"
    template: templates/worker/keda-scaled-job.yaml
    set:
      keda.enabled: true
      secrets.ALLOW_INSECURE_OTEL: ""
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
          count: 1

  - it: "worker ScaledJob: with useExistingSecret the chart cannot see the Secret and emits the entry"
    template: templates/worker/keda-scaled-job.yaml
    set:
      keda.enabled: true
      secrets.ALLOW_INSECURE_OTEL: "secret reason"
      worker.useExistingSecret: true
      worker.existingSecretName: "ext-secret"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
          count: 1
