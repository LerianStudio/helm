
global:
  # -- Managed-cloud topology preset: aws | gcp | azure (unset = bundled
  # in-cluster infra, plaintext). Sets the TOPOLOGY defaults (tls/scheme/ports/
  # ssl/object-storage path-style) for the masks below — see
  # lerian-common.cloud.table. Only ENDPOINTS (host/port/user) stay
  # client-supplied via global.datastores; a cloud can't know your RDS host.
  # Precedence: native configmap key > dedicated > shared (global.*) > this
  # cloud preset > hardcoded default.
  # Example: cloud: "aws"
  cloud: ""
  # -- Env-wide SHARED datastore masks (set once per environment; a dedicated
  # <release>.datastores or a native {auth,identity}.configmap.<KEY> overrides these).
  # Fields: postgres.{host,port,user,ssl}, redis.{host,port,user,tls,caCert}.
  # Example:
  #   datastores:
  #     postgres: { host: "my-rds.example.com", user: "access_manager" }
  #     redis: { host: "my-elasticache.example.com", port: "6379", tls: "true" }
  datastores: {}
  # -- Env-wide environment name. Consumed by lerian-common.globalValue (block "env").
  # Fields: name. (configmap.ENV_NAME overrides.)
  # Example: env: { name: "production" }
  env: {}
  # -- Env-wide multi-tenancy gate. Consumed by lerian-common.globalValue (block
  # "multiTenant"). Fields: enabled. (configmap.MULTI_TENANT_ENABLED overrides.)
  # Example: multiTenant: { enabled: true }
  multiTenant: {}
  # -- Env-wide service discovery (Consul) tuning, consumed by
  # lerian-common.serviceDiscovery.env. Per-component activation stays with
  # {auth,identity}.configmap.SD_ENABLED; every derived SD_* sibling (address,
  # tls, internal/external endpoint) comes from here unless a legacy
  # configmap.SD_* key is set. Fields: address, tls, tlsSkipVerify, workload,
  # preferView, internalScheme, externalPort.
  # Example: serviceDiscovery: { address: "consul.internal:8500", tls: "true" }
  serviceDiscovery: {}
  # -- Env-wide telemetry gate. Consumed by lerian-common.globalValue (block
  # "observability"). Fields: enabled. (configmap.ENABLE_TELEMETRY overrides.)
  # Example: observability: { enabled: true }
  observability: {}

# Common configuration shared between components
common:
  # Common secrets and configurations
  authorizer:
    # -- Caradhras application client id, shared by the identity and auth components.
    # Consumed by templates/{identity,auth}/configmap.yaml — values.yaml is NOT
    # templated by Helm, so components must never self-reference this with `{{ }}`.
    # Per-component override: {identity,auth}.configmap.AUTHORIZER_CLIENT_ID.
    clientId: "ac56c81d4d6d95c0ac12"
identity:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- Startup probe configuration. Disabled by default; enable to give slow-starting
  # pods more time before liveness/readiness probes take over. All fields override chart defaults.
  startupProbe:
    enabled: false
    failureThreshold: 5
    periodSeconds: 10
    timeoutSeconds: 10
  # Default values
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.
  replicaCount: 1
  revisionHistoryLimit: 10
  # -- Component name. Empty derives it from the release name (<release>-identity),
  # which is what the cross-component DNS defaults resolve to. Set it only to pin a
  # legacy name, and remember every other component reference must then be pinned too.
  name: ""
  description: "Identity plugin for Midaz"
  image:
    # -- Repository for the container image
    repository: ghcr.io/lerianstudio/plugin-identity
    # -- Image pull policy
    pullPolicy: Always
    # -- Image tag used for deployment
    tag: "3.1.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 4001
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    # -- Defines the group ID for the user running the process inside the container
    runAsGroup: 1000
    # -- Defines the user ID for the process running inside the container
    runAsUser: 1000
    # -- Ensures the process does not run as root
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    # -- Defines the root filesystem as read-only
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Minimum number of available pods
    minAvailable: 0
    # -- Annotations for PodDisruptionBudget
    annotations: {}
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 200m
      memory: 256Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 3
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostname

  # -- ConfigMap for environment variables and configurations
  # -- All environment variables are declared in the templates/configmap.yaml
  # @default -- templates/identity/configmap.yaml
  configmap:
    ALLOW_INSECURE_TLS: "true"
    # Environment name is resolved via the global mask (global.env.name) — same
    # rule as the datastore masks: do NOT pin ENV_NAME here, it WINS over the
    # mask and defeats it. The default ("development") lives in
    # templates/identity/configmap.yaml.
    # AUTH_ENABLED/AUTH_PORT are NOT pinned here — the chart already defaults
    # them ("true"/"4000") in templates/identity/configmap.yaml; no mask reads
    # them, so duplicating the value here was pure noise.
    # AUTH_ADDRESS defaults to http://<auth component>:4000 (templates/identity/configmap.yaml).
    # Set it only to point identity at an auth outside this release.
  # -- Extra environment variables
  extraEnvVars: {}
  # -- Secrets for storing sensitive data
  # -- All secrets are declared in the templates/secrets.yaml
  # @default -- templates/identity/secrets.yaml
  secrets:
    AUTHORIZER_CLIENT_SECRET: ""
    LICENSE_KEY: ""
    ORGANIZATION_IDS: ""
    # -- Consul ACL token for service discovery (empty = no ACL)
    SD_TOKEN: ""
  useExistingSecret: false
  existingSecretName: ""
auth:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- Startup probe configuration. Disabled by default; enable to give slow-starting
  # pods more time before liveness/readiness probes take over. All fields override chart defaults.
  startupProbe:
    enabled: false
    failureThreshold: 5
    periodSeconds: 10
    timeoutSeconds: 10
  # Default values
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.
  replicaCount: 3
  revisionHistoryLimit: 10
  # -- Component name. Empty derives it from the release name (<release>-auth).
  name: ""
  image:
    # -- Repository for the console service container image
    repository: ghcr.io/lerianstudio/plugin-auth
    # -- Image pull policy
    pullPolicy: Always
    # -- Image tag used for deployment
    tag: "3.1.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  # -- Overrides the full name generated by Helm
  namespaceOverride: ""
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 4000
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Minimum number of available pods
    minAvailable: 0
    # -- Annotations for PodDisruptionBudget
    annotations: {}
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 1
      memory: 756Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 3
    # -- Maximum number of replicas
    maxReplicas: 9
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostname

  # -- ConfigMap for environment variables and configurations
  # @default -- templates/auth/configmap.yaml
  configmap:
    ALLOW_INSECURE_TLS: "true"
    # DB connection (host/port/user/ssl) is resolved via the postgres datastore mask
    # (global.datastores.postgres / dedicated .Values.datastores). Defaults live in
    # templates/auth/configmap.yaml so a shared/managed profile can override them —
    # do NOT pin them here (a native configmap.<KEY> WINS over the mask and defeats it).
    # DB_NAME is NOT pinned either — it has no mask (deliberately native/per-module),
    # and the chart already defaults it ("casdoor") in templates/auth/configmap.yaml.
    # Redis connection (host/port/user/tls/caCert) is resolved via the redis datastore
    # mask (global.datastores.redis) — same rule: do NOT pin the connection keys here.
    # ENV_NAME is resolved via the global mask (global.env.name) — same rule:
    # do NOT pin it here, it WINS over the mask and defeats it. The default
    # ("development") lives in templates/auth/configmap.yaml.
  # -- Extra environment variables
  extraEnvVars: {}
  # -- Secrets for storing sensitive data
  # @default -- templates/auth/secrets.yaml
  secrets:
    # DB_PASSWORD is single-sourced from the auth-database subchart Secret
    # (<release>-auth-database, key "password"), read via secretKeyRef. Leave empty with
    # the bundled subchart. Only set this for an EXTERNAL database (auth-database.external=true)
    # without auth-database.auth.existingSecret. See docs/helm-chart-standard.md.
    DB_PASSWORD: ""
    AUTHORIZER_CLIENT_SECRET: ""
    REDIS_PASSWORD: ""
    LICENSE_KEY: ""
    ORGANIZATION_IDS: ""
    # -- TOTP/MFA signing secret (empty = feature dormant)
    MFA_SECRET: ""
    # -- Consul ACL token for service discovery (empty = no ACL)
    SD_TOKEN: ""
  useExistingSecret: false
  existingSecretName: ""
  # -- Init User Job configuration
  # -- Creates admin user on FIRST INSTALL ONLY (not on upgrades)
  # -- If the admin user is deleted by the customer, it will NOT be recreated
  initUser:
    # -- Enable or disable the init user job
    enabled: true
    image:
      # -- Repository for the caradhras-user-init container image
      repository: ghcr.io/lerianstudio/caradhras-user-init
      # -- Image pull policy
      pullPolicy: Always
      # -- Image tag used for deployment
      tag: "3.2.0-beta.67"
    # -- Admin user email (default: admin@midaz.tech)
    adminEmail: "admin@midaz.tech"
    # -- Admin user display name
    adminDisplayName: "Admin"
    # -- Admin password (will be stored in a secret). REQUIRED when initUser is
    # -- enabled and useExistingSecret is false — the install fails loud if it is
    # -- empty. The chart ships no default on purpose: a published default password
    # -- on the platform admin account is a live credential in every install that
    # -- never overrode it.
    adminPassword: ""
    # -- Use existing secret for admin password instead of creating one
    # -- IMPORTANT: If set to true, adminPasswordSecretName MUST be specified
    useExistingSecret: false
    # -- Name of the existing secret containing ADMIN_PASSWORD
    # -- REQUIRED when useExistingSecret is true
    # -- The secret must exist in the same namespace and contain the key specified in adminPasswordSecretKey
    adminPasswordSecretName: ""
    # -- Key in the secret containing the admin password
    adminPasswordSecretKey: "ADMIN_PASSWORD"
    # -- Timeout waiting for caradhras backend to be ready (in seconds)
    casdoorTimeout: 120
    # -- Timeout waiting for user table to exist (in seconds)
    tableTimeout: 60
    # -- Resources for the init user job
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# -- Caradhras: the auth backend/authorization service, promoted to a
# top-level component sibling of `identity`/`auth` (formerly nested as
# `auth.backend`, which ran the legacy Casdoor image). Lerian's Caradhras
# product replaces Casdoor; the image family is renamed accordingly
# (casdoor -> caradhras, casdoor-migrations -> caradhras-migrations).
#
# Backward-compat: `image.repository`, `image.tag`, `image.pullPolicy`,
# `service.port`, and `replicaCount` below ship EMPTY on purpose. They are
# resolved through _helpers.tpl helpers (caradhras.imageRepository/.imageTag/
# .imagePullPolicy/.servicePort/.replicaCount) using "new key wins, old key
# is a fallback alias" precedence:
#   1. caradhras.<field>       (this block, if set)
#   2. auth.backend.<field>    (legacy path — only relevant for installs that
#                               still set it in THEIR OWN values overrides;
#                               this chart's own values.yaml no longer ships
#                               a real `auth.backend` block)
#   3. hardcoded chart default (see the helper in _helpers.tpl)
caradhras:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- See "Backward-compat" note above — resolved via caradhras.replicaCount.
  replicaCount: ""
  revisionHistoryLimit: 10
  # -- Component name. Empty derives it from the release name (<release>-caradhras).
  name: ""
  # -- Whether to create database on startup (requires CREATEDB permission)
  createDatabase: true
  service:
    # -- Kubernetes service type for the caradhras component
    type: ClusterIP
    # -- See "Backward-compat" note above — resolved via caradhras.servicePort.
    port: ""
    annotations: {}
  pdb:
    # -- Enable or disable PodDisruptionBudget for the caradhras component.
    # -- Own toggle: caradhras is now an independent top-level component, so
    # -- it no longer shares (or is affected by) auth.pdb.
    enabled: true
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Minimum number of available pods
    minAvailable: 0
    # -- Annotations for PodDisruptionBudget
    annotations: {}
  image:
    # -- See "Backward-compat" note above — resolved via caradhras.imageRepository.
    repository: ""
    # -- See "Backward-compat" note above — resolved via caradhras.imagePullPolicy.
    pullPolicy: ""
    # -- See "Backward-compat" note above — resolved via caradhras.imageTag.
    tag: ""
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 1
      memory: 1024Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 3
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  migrations:
    image:
      # -- Repository for the caradhras-migrations container image. NOTE: the
      # -- GHCR repo `caradhras-migrations` carries TWO unrelated version
      # -- trains — 1.2.0-beta.x (caradhras's own migrations, correct) and
      # -- 3.2.0-beta.x (a different, legacy plugin-access-manager applier).
      # -- Always pin the 1.2.0-beta.x train here.
      repository: ghcr.io/lerianstudio/caradhras-migrations
      # -- Image pull policy
      pullPolicy: Always
      # -- Image tag used for deployment — must stay on the 1.2.0-beta.x train.
      tag: "1.2.0-beta.59"
  # -- Caradhras UI (SPA console): nginx serving the SPA, reverse-proxying
  # -- same-origin to the caradhras backend Service. Disabled by default.
  # -- Caradhras console (SPA), disabled by default and intentionally not
  # -- advertised here. All defaults (image, service port, resources, probes,
  # -- ingress shape) live in templates/caradhras/ui-*.yaml — set
  # -- caradhras.ui.enabled=true and any of the fields those templates read
  # -- (image, service, ingress, resources, autoscaling, ...) to turn it on.
  ui:
    enabled: false

auth-database:
  # Database dependency for identity and access management.
  # For more details, refer to the documentation:
  # https://docs.lerian.studio/docs/midaz-security#identity-management-with-casdoor
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/postgresql
    tag: "latest"
  auth:
    enabled: true
    enablePostgresUser: false
    username: "auth"
    password: ""
    database: "casdoor"
  primary:
    persistence:
      size: 8Gi
    resourcesPreset: large
    extendedConfiguration: |
      shared_buffers = 2GB
      max_wal_senders = 20
      wal_keep_size = 512MB
      max_replication_slots = 20
    extraEnvVars:
      - name: POSTGRESQL_WAL_LEVEL
        value: "logical"
      - name: POSTGRESQL_HOST_STANDBY
        value: "on"
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "500"
      - name: POSTGRESQL_TCP_KEEPALIVES_IDLE
        value: "30"
      - name: POSTGRESQL_TCP_KEEPALIVES_INTERVAL
        value: "10"
      - name: POSTGRESQL_TCP_KEEPALIVES_COUNT
        value: "5"
valkey:
  # Redis is used to handle scenarios where real-time performance and fast data retrieval are essential.
  # This component is responsible for providing an in-memory data store
  # For more details, refer to the documentation:
  # https://docs.lerian.studio/docs/midaz-components#why-redis
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/valkey
    tag: "latest"
  architecture: standalone
  auth:
    enabled: false
otel-collector-lerian:
  enabled: true
