{{- $mig := .Values.migrations | default dict -}}
{{- if $mig.enabled }}
{{- /* MULTI-TENANT SKIPS THIS JOB, and does so silently rather than failing.

   In MT the Tenant Manager creates and migrates every per-tenant database. This Job
   targets the single-tenant database that MT never uses, so running it would migrate
   the wrong schema — it would report success having touched nothing a tenant reads.

   The first cut made the combination a hard render failure, which meant every MT
   install had to carry `migrations.enabled: false` just to tell the chart something
   the chart can already see. Inferring it is the better contract: the operator states
   the tenancy mode once, in MULTI_TENANT_ENABLED, and the chart derives the rest.
   NOTES.txt reports the skip so it is visible, not silent-and-surprising. */ -}}
{{- if eq (index (fromYaml (include "plugin-br-pix-jd.effectiveConfig" .)) "MULTI_TENANT_ENABLED" | default "false" | toString) "true" -}}
{{- /* no-op: the Tenant Manager owns per-tenant migrations */ -}}
{{- else -}}
{{- $bundled := include "plugin-br-pix-jd.postgresRenders" . -}}
{{- $fullname := printf "%s-migrations" (include "plugin-br-pix-jd.fullname" .) | trunc 63 | trimSuffix "-" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}
  namespace: {{ include "plugin-br-pix-jd.namespace" . }}
  labels:
    {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "migrations") | nindent 4 }}
  annotations:
    {{- if $bundled }}
    {{- /* The bundled Postgres is provisioned DURING Sync (bitnami StatefulSet), so a
       pre-hook would race a database that does not exist yet. Running post-Sync also
       means the chart's own Secrets already exist, so no migration-only hook Secret is
       needed on this path. The cost: the api rolls out before the schema lands and
       returns errors on PIX routes until this Job finishes. */}}
    "helm.sh/hook": post-install,post-upgrade
    "argocd.argoproj.io/hook": PostSync
    {{- else }}
    {{- /* External Postgres already exists, so migrate BEFORE the app rolls out —
       schema-first, no window where the api serves against an old schema. */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "argocd.argoproj.io/hook": PreSync
    {{- end }}
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    {{- with $mig.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ $mig.backoffLimit | default 3 }}
  activeDeadlineSeconds: {{ $mig.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ $mig.ttlSecondsAfterFinished | default 600 }}
  template:
    metadata:
      labels:
        {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (.Values.api.imagePullSecrets | default (.Values.global).imagePullSecrets) }}
      {{- include "lerian-common.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      {{- if $bundled }}
      initContainers:
        {{- /* Bounded wait, not an infinite loop: an unreachable datastore should fail the
           Job with a clear timeout rather than sit in Init forever until someone notices. */}}
        - name: wait-for-postgres
          image: {{ $mig.waitImage | default "busybox:1.37" | quote }}
          command:
            - /bin/sh
            - -c
            - >
              echo "waiting for $POSTGRES_HOST:$POSTGRES_PORT...";
              ELAPSED=0;
              while ! nc -z "$POSTGRES_HOST" "$POSTGRES_PORT"; do
                if [ $ELAPSED -ge {{ $mig.waitTimeoutSeconds | default 300 }} ]; then echo "timeout after {{ $mig.waitTimeoutSeconds | default 300 }}s"; exit 1; fi;
                echo "not ready, waiting (${ELAPSED}s)"; sleep 5; ELAPSED=$((ELAPSED + 5));
              done;
              echo "postgres is ready"
          env:
            - name: POSTGRES_HOST
              value: {{ include "plugin-br-pix-jd.postgresHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ include "plugin-br-pix-jd.cfg" (dict "configmap" (.Values.api.configmap | default dict) "key" "POSTGRES_PORT" "default" "5432") | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        {{- /* THE DEDICATED MIGRATIONS IMAGE, not the app image.

           Until 0.3.0 this Job extracted /migrations out of the APP image with an
           initContainer running `/bin/sh -c cp`, then applied it from a generic
           migrate/migrate container over a shared emptyDir. That could never work: the
           app image is gcr.io/distroless/static-debian12, which ships no shell and no
           cp, so the initContainer died with
             exec: "/bin/sh": stat /bin/sh: no such file or directory
           The bug stayed invisible because the only two installs were MULTI-TENANT,
           where this whole Job is skipped (see the note above). The first single-tenant
           install hit it immediately.

           The app now publishes ghcr.io/lerianstudio/plugin-br-pix-jd-migrations —
           FROM migrate/migrate with migrations/ baked in — which is also what every
           sibling chart consumes (br-ccs, br-sisbajud, br-sfn, matcher,
           plugin-access-manager, plugin-br-bank-transfer, streaming-hub). No shell, no
           emptyDir, no initContainer: the image's ENTRYPOINT assembles the DSN from the
           POSTGRES_* env below and applies the schema.

           NO `command:` HERE ON PURPOSE. Overriding it would bypass the entrypoint's
           password percent-encoding, which is the thing that lets the password contain
           @ : / ? # & + or a space without breaking URL parsing — the old in-shell DSN
           could not, and that constraint used to leak all the way out to whoever
           generated the credential. */}}
        {{- $migImage := $mig.image | default dict -}}
        {{- /* An empty repository renders ":<tag>", which the API server rejects with
           InvalidImageName — on a PreSync hook, so it blocks the entire sync. Fail at
           render naming the value, the same way componentImage does for the app. */ -}}
        {{- $migRepo := required "\n\nERROR: migrations.image.repository is empty.\nAn empty repository renders as \":<tag>\", which the API server rejects with\nInvalidImageName — and this Job is a PreSync hook, so it blocks the whole sync.\nSet migrations.image.repository (default: ghcr.io/lerianstudio/plugin-br-pix-jd-migrations).\n" ($migImage.repository | default "") }}
        - name: migrations
          image: {{ printf "%s:%s" $migRepo ($migImage.tag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ ($migImage.pullPolicy | default $mig.imagePullPolicy) | default "IfNotPresent" }}
          env:
            - name: POSTGRES_HOST
              value: {{ include "plugin-br-pix-jd.postgresHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ include "plugin-br-pix-jd.cfg" (dict "configmap" (.Values.api.configmap | default dict) "key" "POSTGRES_PORT" "default" "5432") | quote }}
            - name: POSTGRES_USER
              value: {{ include "plugin-br-pix-jd.cfg" (dict "configmap" (.Values.api.configmap | default dict) "key" "POSTGRES_USER" "default" "plugin-br-pix-jd") | quote }}
            - name: POSTGRES_NAME
              value: {{ include "plugin-br-pix-jd.cfg" (dict "configmap" (.Values.api.configmap | default dict) "key" "POSTGRES_NAME" "default" "plugin-br-pix-jd") | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ include "plugin-br-pix-jd.cfg" (dict "configmap" (.Values.api.configmap | default dict) "key" "POSTGRES_SSLMODE" "default" "disable") | quote }}
            {{- with $mig.table }}
            - name: POSTGRES_MIGRATIONS_TABLE
              value: {{ . | quote }}
            {{- end }}
            {{- include "plugin-br-pix-jd.migrationPasswordEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml ($mig.resources | default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "250m" "memory" "256Mi"))) | nindent 12 }}
      {{- if or .Values.api.nodeSelector .Values.api.affinity .Values.api.tolerations }}
      {{- include "lerian-common.scheduling" .Values.api | nindent 6 }}
      {{- end }}
{{- end }}
{{- end }}
