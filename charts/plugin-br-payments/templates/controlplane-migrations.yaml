{{- /*
Control-plane migrations Job (ADR-013, plugin-br-payments repo). Runs the
/controlplane-migrate binary (Task 2.1.1) against migrations/controlplane/,
which never applies at app boot — the control-plane inventory is declared,
not a silent svc.DB fallback.

Gated directly on the app configmap's canonical MULTI_TENANT_ENABLED key (no
values-key of its own — same inline-read pattern every chart in this repo
uses for that flag; see charts/lerian-common/templates/_multi_tenant.tpl for
why plugin-br-payments stays outside the shared helper). Runs ONLY under
multi-tenancy: single-tenant already applies every migration automatically
at boot (internal/bootstrap/service.go, applyStartupMigrationsIfOwned), so
running this Job too would be redundant, not incorrect — it stays gated out.

plugin-br-payments is always-external Postgres (templates/bootstrap-postgres.yaml
only provisions role/database via psql, gated by
.Values.global.externalPostgresDefinitions.enabled, and carries no hook — it
is not this Job and it is not the app's own migration path). Unlike
plugin-br-bank-transfer, there is no bundled-Postgres PostSync branch here:
always PreSync.
*/}}
{{- if eq (lower (toString (get .Values.app.configmap "MULTI_TENANT_ENABLED" | default "false"))) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-controlplane-migrations" (include "plugin-br-payments.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 4 }}
    app.kubernetes.io/component: controlplane-migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "argocd.argoproj.io/hook": PreSync
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 8 }}
        app.kubernetes.io/component: controlplane-migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controlplane-migrations
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Same image as the app Deployment (templates/deployment.yaml) — the
          # control-plane migrate binary ships alongside /app in that image
          # (repo plugin-br-payments, Task 2.1.1). Only the entrypoint changes.
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default (include "plugin-br-payments.defaultTag" .) }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["/controlplane-migrate"]
          # Same ConfigMap/Secret env refs as templates/deployment.yaml — no
          # new Postgres connection definition.
          envFrom:
            - configMapRef:
                name: {{ include "plugin-br-payments.fullname" . }}
            - secretRef:
                name: {{ if .Values.app.useExistingSecret }}{{ .Values.app.existingSecretName }}{{ else }}{{ include "plugin-br-payments.fullname" . }}{{ end }}
          env:
            {{- $pg := .Values.postgresql | default dict }}
            {{- $pgAuth := $pg.auth | default dict }}
            {{- if or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
            {{- include "plugin-br-payments.infraSecretRef" (dict "context" $ "subchart" "postgresql" "key" "password" "envName" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- else if .Values.app.secrets.POSTGRES_PASSWORD }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.useExistingSecret }}{{ .Values.app.existingSecretName }}{{ else }}{{ include "plugin-br-payments.fullname" . }}{{ end }}
                  key: POSTGRES_PASSWORD
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
