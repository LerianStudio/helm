{{- if .Values.worker.enabled -}}
{{- $w := .Values.worker -}}
{{- $fullname := include "br-sta.componentFullname" (dict "root" . "component" "worker") -}}
{{- $shared := include "br-sta.fullname" . -}}
{{- $pullSecrets := $w.imagePullSecrets | default .Values.imagePullSecrets -}}
{{- $tag := $w.image.tag | default .Values.manager.image.tag | default .Chart.AppVersion -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sta.labels" (dict "root" . "component" "worker") | nindent 4 }}
  {{- with .Values.worker.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  revisionHistoryLimit: {{ $w.revisionHistoryLimit | default 10 }}
  # Background jobs without leader election for every loop: exactly ONE replica,
  # and Recreate so an upgrade never runs two workers side by side.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "br-sta.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        # The worker loads the shared ConfigMap + Secret AND its own ConfigMap:
        # a change to any of them rolls it.
        checksum/config: {{ include (print $.Template.BasePath "/common/configmap.yaml") . | sha256sum }}
        {{- if not .Values.common.useExistingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/common/secrets.yaml") . | sha256sum }}
        {{- end }}
        checksum/worker-config: {{ include (print $.Template.BasePath "/worker/configmap.yaml") . | sha256sum }}
        {{- with $w.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "br-sta.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "br-sta.serviceAccountName" . }}
      automountServiceAccountToken: false
      # SIGTERM drains the outbox publisher and the consumers (the regulatory-trail guarantee).
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds | default 60 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-dependencies
          image: {{ .Values.waitImage | default "busybox:1.36" }}
          envFrom:
            - configMapRef:
                name: {{ $shared }}
          command:
            - /bin/sh
            - -c
            - |
              {{- include "br-sta.waitScript" . | nindent 14 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ $w.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ $w.image.pullPolicy | default "IfNotPresent" }}
          # Shared ConfigMap < shared Secret < worker ConfigMap (worker-only keys win).
          envFrom:
            - configMapRef:
                name: {{ $shared }}
            - secretRef:
                name: {{ include "br-sta.secretName" . }}
            - configMapRef:
                name: {{ $fullname }}
          {{- $env := include "br-sta.appEnv" (dict "root" . "component" "worker") | trim }}
          {{- if or $env $w.extraEnvVars }}
          env:
            {{- with $env }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with $w.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $w.port | default 4029 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ $w.livenessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ $w.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ $w.livenessProbe.periodSeconds | default 20 }}
            timeoutSeconds: {{ $w.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ $w.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ $w.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ $w.readinessProbe.path | default "/readyz" }}
              port: http
            initialDelaySeconds: {{ $w.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $w.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $w.readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ $w.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ $w.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
      {{- if or $w.nodeSelector $w.affinity $w.tolerations }}
      {{- include "lerian-common.scheduling" $w | nindent 6 }}
      {{- end }}
{{- end -}}
