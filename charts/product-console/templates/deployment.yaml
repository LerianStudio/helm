{{- /* ENABLE_TELEMETRY can now also flip to "true" via the global.observability.enabled
   mask (see templates/configmap.yaml) without a native configmap key — resolve it the
   same way here so this guard doesn't miss that case. */ -}}
{{- $enableTelemetry := include "lerian-common.globalValue" (dict "context" $ "configmap" .Values.configmap "block" "observability" "field" "enabled" "nativeKey" "ENABLE_TELEMETRY" "default" "false") }}
{{- if and (eq $enableTelemetry "true") (not (or .Values.otel.enabled .Values.otel.external)) }}
{{- fail "ENABLE_TELEMETRY is 'true' but no OTEL exporter is configured. Set either otel.enabled=true or otel.external=true to configure OTEL endpoints." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "product-console.fullname" . }}
  namespace: {{ include "product-console.namespace" . }}
  labels:
    {{- include "product-console.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deploymentStrategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "product-console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "product-console.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "product-console.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: copy-public-files
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ['sh', '-c', 'cp -r /app/public/* /public-writable/']
          volumeMounts:
            - name: public-runtime
              mountPath: /public-writable
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /* The bundled MongoDB generates a random root password into its own
             Secret, while the console's own Secret carries MONGODB_PASS "" until
             somebody fills it in, so a default install used to bring up a console
             that could reach its database and not authenticate to it. Read the
             password from the subchart's Secret instead: an explicit env entry
             overrides the same name coming from envFrom, so this fills the blank
             without an operator copying a generated password by hand.
             Skipped, deliberately, when:
               - the operator set secrets.MONGODB_PASS or useExistingSecret, so
                 their own value is the one that must reach the container;
               - mongodb.auth.enabled is false, so no Secret exists to read;
               - the subchart lands in a different namespace from these pods
                 (global.namespaceOverride, or an install whose -n differs from
                 namespaceOverride), because a secretKeyRef never crosses
                 namespaces. NOTES.txt says what to do in that case. */}}
          {{- $mongoSecretReadable := and .Values.mongodb.enabled .Values.mongodb.auth.enabled (not .Values.secrets.MONGODB_PASS) (not .Values.useExistingSecret) (eq (include "product-console.namespace" .) (include "product-console.mongodb.namespace" .)) }}
          {{- if or .Values.otel.enabled .Values.otel.external $mongoSecretReadable }}
          env:
            {{- if $mongoSecretReadable }}
            {{- include "lerian-common.infraSecretRef" (dict "context" . "subchart" "mongodb" "key" "mongodb-root-password" "envName" "MONGODB_PASS") | nindent 12 }}
            {{- end }}
            {{- if or .Values.otel.enabled .Values.otel.external }}
            {{- if .Values.otel.host }}
            - name: OTEL_HOST
              value: {{ .Values.otel.host | quote }}
            - name: OTEL_URL_METRICS
              value: "http://{{ .Values.otel.host }}:{{ .Values.otel.port }}/v1/metrics"
            - name: OTEL_URL_TRACES
              value: "http://{{ .Values.otel.host }}:{{ .Values.otel.port }}/v1/traces"
            - name: OTEL_URL_LOGS
              value: "http://{{ .Values.otel.host }}:{{ .Values.otel.port }}/v1/logs"
            {{- else }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_HOST
              value: "$(HOST_IP)"
            - name: OTEL_URL_METRICS
              value: "http://$(HOST_IP):{{ .Values.otel.port }}/v1/metrics"
            - name: OTEL_URL_TRACES
              value: "http://$(HOST_IP):{{ .Values.otel.port }}/v1/traces"
            - name: OTEL_URL_LOGS
              value: "http://$(HOST_IP):{{ .Values.otel.port }}/v1/logs"
            {{- end }}
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "product-console.fullname" . }}
            - secretRef:
                name: {{ include "product-console.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path | default "/api/admin/health/alive" }}
              port: {{ .Values.livenessProbe.port | default "http" }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          {{- /* Readiness defaults to the Mongo-INDEPENDENT endpoint because the
             image this chart pins connects to MongoDB on the first request that
             needs it, not at startup. With readiness on /api/admin/health/readyz
             a fresh pod deadlocks: it is not Ready, so the Service sends it no
             traffic, so it never opens the connection, so readyz never returns
             200 and the pod is never Ready. Measured on lerianstudio/product-
             console:1.12.0: readyz answers 503 (readyState=0) for as long as the
             pod is left alone, and 200 within three seconds of the first request
             to a Mongo-backed route. 4.0.1 is the release that made readyz the
             readiness default; 4.0.3 is the release that first described the
             deadlock, written into docs/UPGRADE-4.0.1.md and NOTES.txt by one
             commit, and both prescribe this arm. 4.0.1 shipped that default
             with nothing written down; 4.0.2 documented it at length in
             docs/UPGRADE-4.0.1.md, as an improvement, and mentions the deadlock
             nowhere. Point readinessProbe.path back at
             "/api/admin/health/readyz" once the image connects eagerly, to have
             readiness gate on the database again. */}}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path | default "/api/admin/health/alive" }}
              port: {{ .Values.readinessProbe.port | default "http" }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            successThreshold: {{ .Values.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nextjs-cache
              mountPath: /app/.next/cache
            - name: public-runtime
              mountPath: /app/public
      volumes:
        - name: nextjs-cache
          emptyDir: {}
        - name: public-runtime
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
