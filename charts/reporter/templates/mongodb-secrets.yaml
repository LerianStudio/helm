{{- /* The bundled MongoDB's password outlives the release, like its volume, so a same-name reinstall
   opens the kept data. Same name and keys as the subchart's Secret; lookups run on the subchart's values. */ -}}
{{- $mongo := .Values.mongodb }}
{{- if and (ne (toString $mongo.enabled) "false") $mongo.auth.enabled (not (include "reporter.operatorSecret" (dict "context" $ "subchart" "mongodb"))) }}
{{- if or $mongo.auth.username $mongo.auth.usernames (and $mongo.metrics.enabled $mongo.metrics.username) }}
{{- fail "mongodb custom users and a metrics user need mongodb.auth.existingSecret: the Secret this chart keeps holds the root password only" }}
{{- end }}
{{- $name := include "common.names.dependency.fullname" (dict "chartName" "mongodb" "chartValues" $mongo "context" $) }}
{{- $ctx := dict "Values" $mongo "Release" $.Release }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongodb-root-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "mongodb-root-password" "providedValues" (list "auth.rootPassword") "honorProvidedValues" true "chartName" "mongodb" "context" $ctx) }}
  {{- if eq $mongo.architecture "replicaset" }}
  mongodb-replica-set-key: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "mongodb-replica-set-key" "providedValues" (list "auth.replicaSetKey") "honorProvidedValues" true "chartName" "mongodb" "context" $ctx) }}
  {{- end }}
{{- end }}
