{{- $h := include "reconciliation.health" . | fromYaml }}
{{- if $h.pdb }}
{{- include "lerian-common.pdb" (dict
      "pdb" $h.pdb
      "name" (include "reconciliation.fullname" .)
      "labels" (include "reconciliation.labels" (dict "context" . "name" .Values.reconciliation.name))
      "selector" (include "reconciliation.selectorLabels" (dict "context" . "name" .Values.reconciliation.name))
    ) }}
{{- end }}
