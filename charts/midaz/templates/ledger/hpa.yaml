{{- if and .Values.ledger.enabled .Values.ledger.autoscaling.enabled }}
{{- $migrationSyncWave := dig "deploymentSyncWave" "1" (.Values.ledger.migrations | default dict) | toString }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "midaz-ledger.fullname" . }}
  {{- if and (include "midaz.ledgerMigrationsEnabled" .) $migrationSyncWave }}
  {{- /* Match the Deployment sync-wave so the HPA is applied in the same wave as
         its target (never an earlier wave): otherwise a wave-0 HPA waits on a
         target Deployment that only lands in a later wave, and the wave never
         goes healthy — a bootstrap deadlock on first install. */}}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $migrationSyncWave | quote }}
  {{- end }}
  labels:
    {{- include "midaz.labels" (dict "context" . "component" .Values.ledger.name "name" .Values.ledger.name ) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "midaz-ledger.fullname" . }}
  minReplicas: {{ .Values.ledger.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ledger.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.ledger.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ledger.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.ledger.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.ledger.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
