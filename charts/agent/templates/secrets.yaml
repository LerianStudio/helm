{{- if and .Values.agent.enabled (not .Values.agent.useExistingSecret) }}
{{- $token := required "agent.secrets.AGENT_TOKEN is required unless agent.useExistingSecret is true (a per-agent token from POST /api/tenants/:id/agents, or an enrollment token from POST /api/tenants/:id/agents/enrollments)" .Values.agent.secrets.AGENT_TOKEN }}
{{- /*
A per-agent token only authenticates paired with the exact agent ID it was
issued for. An enrollment token (lerian_enroll_...) is traded by the agent for
both halves on its first call, so it is the one case where AGENT_ID is empty.
*/}}
{{- if and (not .Values.agent.secrets.AGENT_ID) (not (hasPrefix "lerian_enroll_" $token)) }}
{{- fail "agent.secrets.AGENT_ID is required when AGENT_TOKEN is a PER-AGENT token: get both from the same POST /api/tenants/:id/agents response. Omit it only for a single-use ENROLLMENT token (lerian_enroll_...)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lerian-agent.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "lerian-agent.labels" (dict "context" . "component" .Values.agent.name "name" .Values.agent.name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.agent.secrets }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
