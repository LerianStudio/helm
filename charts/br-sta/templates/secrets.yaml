{{- $component := index .Values "br-sta" -}}
{{- if not $component.useExistingSecret }}
{{- $s := $component.secrets | default dict -}}
{{- $cm := $component.configmap | default dict -}}
{{- $mtEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_ENABLED" "params" ($component.multiTenant | default dict) "field" "enabled" "default" "false")) "true" -}}
{{- $rmqEnabled := eq (toString ($cm.RABBITMQ_ENABLED | default "false")) "true" -}}
{{- $streamingEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_ENABLED" "params" ($component.streaming | default dict) "field" "enabled" "default" "false")) "true" -}}
{{- $gStream := (.Values.global | default dict).streaming | default dict -}}
{{- $streamMech := $gStream.saslMechanism | default "" }}{{- if hasKey $cm "STREAMING_SASL_MECHANISM" }}{{- $streamMech = index $cm "STREAMING_SASL_MECHANISM" }}{{- end }}
{{- $streamUser := $gStream.saslUsername | default "" }}{{- if hasKey $cm "STREAMING_SASL_USERNAME" }}{{- $streamUser = index $cm "STREAMING_SASL_USERNAME" }}{{- end }}
{{- /* Secret keys emitted with fail-fast semantics below — excluded from the generic
   passthrough range so they are single-sourced (and gated by feature enablement). */ -}}
{{- $managed := dict -}}
{{- range $k := (list "MULTI_TENANT_SERVICE_API_KEY" "MULTI_TENANT_REDIS_PASSWORD" "RABBITMQ_DEFAULT_PASS" "STREAMING_SASL_PASSWORD") -}}
{{- $_ := set $managed $k true -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-sta.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sta.labels" (dict "context" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    {{- $warns := include "br-sta.secretWarnings" . }}
    {{- if $warns }}
    {{ $warns | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := $s }}
  {{- if and $value (not (hasKey $managed $key)) }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
  {{- /* Multi-tenant secrets (lerian-common.multiTenant.secret): SERVICE_API_KEY
     required + REDIS_PASSWORD optional, emitted only when MT is enabled; fails fast
     when enabled but the API key is empty. */ -}}
  {{- with (include "lerian-common.multiTenant.secret" (dict
        "context" . "secrets" $s
        "secretName" (include "br-sta.fullname" .)
        "valuesPrefix" "br-sta.secrets." "mode" "stringData"
        "enabled" $mtEnabled
        "useExistingSecret" $component.useExistingSecret)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- /* RabbitMQ password: required when the broker is on and no full RABBITMQ_URL
     (which embeds the password) is supplied; optional otherwise. */ -}}
  {{- if and $rmqEnabled (not $s.RABBITMQ_URL) }}
  RABBITMQ_DEFAULT_PASS: {{ required "br-sta.secrets.RABBITMQ_DEFAULT_PASS is required when RABBITMQ_ENABLED=true (or provide br-sta.secrets.RABBITMQ_URL instead)" $s.RABBITMQ_DEFAULT_PASS | quote }}
  {{- else if $s.RABBITMQ_DEFAULT_PASS }}
  RABBITMQ_DEFAULT_PASS: {{ $s.RABBITMQ_DEFAULT_PASS | quote }}
  {{- end }}
  {{- /* Streaming SASL credentials (lerian-common.streaming.secret): PASSWORD required
     when streaming is enabled with a SASL mechanism; fails fast otherwise. */ -}}
  {{- with (include "lerian-common.streaming.secret" (dict
        "context" . "secrets" $s
        "secretName" (include "br-sta.fullname" .)
        "valuesPrefix" "br-sta.secrets." "mode" "stringData"
        "enabled" $streamingEnabled
        "useExistingSecret" $component.useExistingSecret
        "saslMechanism" $streamMech "saslUsername" $streamUser)) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
