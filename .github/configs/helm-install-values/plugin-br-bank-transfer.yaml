# The gate runs the workload as a non-production environment, because the app
# accepts plugin auth off (below) only outside production. ENV_NAME goes through
# the global mask (global.env.name), the same path an operator uses.
global:
  env:
    name: "development"
  # kind runs no Access Manager (its images need a license), and /readyz reports auth
  # down while plugin auth is on; the app accepts it off outside production.
  auth:
    enabled: false

# Since app 3.1.0 a non-empty encryption key must be 64 hex characters (AES-256),
# and the render values' "sample" refuses boot. Test-only keys, never a real secret.
# The bundled Postgres serves no TLS, and the chart default sslmode is "require".
# kind runs no Midaz, so the app's DNS probe finds no private upstream and refuses the
# render values' plaintext MIDAZ_BASE_URL; in a cluster with Midaz the probe allows it.
bankTransfer:
  # The app adds 2 x 500m (HPA min 2) next to the bundled datastores on the 4 vCPU kind
  # node, so the Postgres replica stayed Pending even with the trim below. One replica proves the gate.
  replicaCount: 1
  autoscaling:
    minReplicas: 1
  resources:
    requests:
      cpu: 250m
  configmap:
    POSTGRES_SSLMODE: "disable"
    ALLOW_PRIVATE_UPSTREAMS: "true"
    # Since app 3.2.0 the license is required in every environment:
    #   config validation: assertion failed: LICENSE_KEY is required
    ORGANIZATION_IDS: "global"
  secrets:
    LICENSE_KEY: "IT_LICENSE_KEY" # CI license placeholder (README)
    JD_INCOMING_RAW_XML_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    RECIPIENT_DETAILS_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"

# The default "large" Postgres preset requests 1 CPU per pod: primary + read replica + app
# (HPA min 2) + Valkey + Mongo asked ~4.3 CPU, the replica stayed Pending ("Insufficient
# cpu") and the app never went Ready. Requests only; limits and production defaults unchanged.
postgresql:
  primary:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
  readReplicas:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

