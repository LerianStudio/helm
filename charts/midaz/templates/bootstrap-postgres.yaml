{{- if .Values.global.externalPostgresDefinitions.enabled }}
{{- /* DB names via the SAME datastore masks the ledger/tracer configmaps + migration jobs use,
   so bootstrap CREATEs exactly the databases the apps connect to (an operator who customizes a
   name via the mask no longer gets 'onboarding'/'transaction'/'tracer' created out from under them). */ -}}
{{- $dvb := "lerian-common.datastore.value" }}
{{- $onbName := include $dvb (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" (.Values.ledger.configmap | default dict) "type" "postgresOnboarding" "field" "name" "nativeKey" "DB_ONBOARDING_NAME" "default" "onboarding") }}
{{- $txName := include $dvb (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" (.Values.ledger.configmap | default dict) "type" "postgresTransaction" "field" "name" "nativeKey" "DB_TRANSACTION_NAME" "default" "transaction") }}
{{- $tracerName := include $dvb (dict "context" $ "dedicated" .Values.tracer.datastores "configmap" (.Values.tracer.configmap | default dict) "type" "postgres" "field" "name" "nativeKey" "DB_NAME" "default" "tracer") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: midaz-bootstrap-postgres
  namespace: {{ .Release.Namespace }}
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.37
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalPostgresDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalPostgresDefinitions.connection.port | quote }}
        command:
        - /bin/sh
        - -c
        - >
          TIMEOUT=300;
          ELAPSED=0;
          echo "Checking $DB_HOST:$DB_PORT...";
          while ! nc -z "$DB_HOST" "$DB_PORT"; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for $DB_HOST:$DB_PORT after ${TIMEOUT}s";
              exit 1;
            fi;
            echo "$DB_HOST:$DB_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
            sleep 5;
            ELAPSED=$((ELAPSED + 5));
          done;
          echo "$DB_HOST:$DB_PORT is ready!";
      containers:
      - name: psql
        image: postgres:16
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalPostgresDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalPostgresDefinitions.connection.port | quote }}
        - name: DB_USER_ADMIN
          {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
              key: DB_USER_ADMIN
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.username | quote }}
          {{- end }}
        - name: DB_PASSWORD_MIDAZ
          {{- if .Values.global.externalPostgresDefinitions.midazCredentials.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.midazCredentials.useExistingSecret.name | quote }}
              key: DB_PASSWORD_MIDAZ
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.midazCredentials.password | quote }}
          {{- end }}
        - name: DB_ADMIN_PASSWORD
          {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
              key: DB_ADMIN_PASSWORD
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.password | quote }}
          {{- end }}
        - name: DB_DATABASE
          value: postgres
        - name: DB_ONBOARDING_NAME
          value: {{ $onbName | quote }}
        - name: DB_TRANSACTION_NAME
          value: {{ $txName | quote }}
        - name: DB_TRACER_NAME
          value: {{ $tracerName | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail
          echo "Checking existing Postgres objects..."
          ONB_EXISTS=0
          TRX_EXISTS=0
          ROLE_EXISTS=0
          {{- if .Values.tracer.enabled }}
          TRACER_EXISTS=0
          {{- end }}

          if printf '%s\n' "SELECT 1 FROM pg_database WHERE datname = :'db_name'" | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -v db_name="$DB_ONBOARDING_NAME" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" | grep -q 1; then
            ONB_EXISTS=1
          fi
          if printf '%s\n' "SELECT 1 FROM pg_database WHERE datname = :'db_name'" | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -v db_name="$DB_TRANSACTION_NAME" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" | grep -q 1; then
            TRX_EXISTS=1
          fi
          if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_roles WHERE rolname='midaz'" | grep -q 1; then
            ROLE_EXISTS=1
          fi
          {{- if .Values.tracer.enabled }}
          if printf '%s\n' "SELECT 1 FROM pg_database WHERE datname = :'db_name'" | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -v db_name="$DB_TRACER_NAME" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" | grep -q 1; then
            TRACER_EXISTS=1
          fi
          {{- end }}

          if [ "$ONB_EXISTS" = "1" ] && [ "$TRX_EXISTS" = "1" ] && [ "$ROLE_EXISTS" = "1" ]{{ if .Values.tracer.enabled }} && [ "$TRACER_EXISTS" = "1" ]{{ end }}; then
            echo "Postgres bootstrap config already exists. Skipping."
            exit 0
          fi

          # Databases
          if [ "$ONB_EXISTS" = "1" ]; then
            echo "Onboarding database already exists. Skipping creation."
          else
            echo "Creating onboarding database..."
            printf '%s\n' 'CREATE DATABASE :"db_name"' | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -v db_name="$DB_ONBOARDING_NAME" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE"
          fi

          if [ "$TRX_EXISTS" = "1" ]; then
            echo "Transaction database already exists. Skipping creation."
          else
            echo "Creating transaction database..."
            printf '%s\n' 'CREATE DATABASE :"db_name"' | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -v db_name="$DB_TRANSACTION_NAME" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE"
          fi
          {{- if .Values.tracer.enabled }}

          # Tracer runs as the same 'midaz' role, so only its database is created here.
          if [ "$TRACER_EXISTS" = "1" ]; then
            echo "Tracer database already exists. Skipping creation."
          else
            echo "Creating tracer database..."
            printf '%s\n' 'CREATE DATABASE :"db_name"' | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -v db_name="$DB_TRACER_NAME" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE"
          fi
          {{- end }}

          # Role
          if [ "$ROLE_EXISTS" = "1" ]; then
            echo "Role 'midaz' already exists. Skipping creation."
          else
            echo "Creating role 'midaz'..."
            PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "CREATE ROLE midaz LOGIN PASSWORD '$DB_PASSWORD_MIDAZ'"
          fi

          # Privileges (safe to run repeatedly)
          echo "Ensuring privileges and schema permissions..."
          printf '%s\n' 'GRANT ALL PRIVILEGES ON DATABASE :"db_name" TO midaz' | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -v db_name="$DB_ONBOARDING_NAME" -d "$DB_DATABASE"
          printf '%s\n' 'GRANT ALL PRIVILEGES ON DATABASE :"db_name" TO midaz' | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -v db_name="$DB_TRANSACTION_NAME" -d "$DB_DATABASE"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_ONBOARDING_NAME" -c "GRANT ALL ON SCHEMA public TO midaz"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_TRANSACTION_NAME" -c "GRANT ALL ON SCHEMA public TO midaz"
          {{- if .Values.tracer.enabled }}
          printf '%s\n' 'GRANT ALL PRIVILEGES ON DATABASE :"db_name" TO midaz' | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -v db_name="$DB_TRACER_NAME" -d "$DB_DATABASE"
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_TRACER_NAME" -c "GRANT ALL ON SCHEMA public TO midaz"
          {{- end }}
{{- end }}
