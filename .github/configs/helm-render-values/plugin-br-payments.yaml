app:
  configmap:
    BTG_API_BASE_URL: "https://example.test"
    BTG_AUTH_URL: "https://example.test/oauth"
    MIDAZ_LEDGER_URL: "http://midaz-ledger:3002/v1"
  secrets:
    # Renamed from BTG_CLIENT_ID / BTG_CLIENT_SECRET. These sample values exercise
    # the SINGLE-TENANT branch of validateRequired, which is the only branch that
    # requires the pair — in multi-tenant the app resolves it per tenant.
    PROVIDER_CLIENT_ID: "sample"
    PROVIDER_CLIENT_SECRET: "sample"
    BTG_WEBHOOK_HMAC_SECRET: "sample-webhook-hmac-secret-32-characters"
    INTERNAL_API_KEY: "0123456789abcdef0123456789abcdef"
    CREDENTIAL_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
