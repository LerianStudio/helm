# Default values
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # -- Managed-cloud topology preset: aws | gcp | azure (unset = bundled
  # in-cluster infra, plaintext). Sets the TOPOLOGY defaults (tls/scheme/ports/
  # ssl/telemetry/object-storage path-style) for every lerian-common mask below —
  # see lerian-common.cloud.table. Only ENDPOINTS (host/port/user) stay
  # client-supplied via global.datastores/objectStorage; a cloud can't know your
  # RDS host. Precedence: native configmap key > dedicated > shared (global.*) >
  # this cloud preset > hardcoded default — an explicit global.datastores.<type>.
  # <field> still overrides the preset.
  # Example: cloud: "aws"
  cloud: ""
  # -- Env-wide SHARED datastore masks (set once per environment; a dedicated
  # <release>.datastores or a native common.configmap.<KEY> overrides these).
  # Same sub-keys as the dedicated block: mongo / redis / broker / postgres.
  # Example:
  #   datastores:
  #     mongo: { host: "my-documentdb.example.com", port: "27017", user: "reporter" }
  #     redis: { host: "my-elasticache.example.com:6379", tls: "true" }
  #     broker: { host: "my-amazonmq.example.com", scheme: "amqps", amqpPort: "5671" }
  datastores: {}
  # -- Env-wide object storage (S3/SeaweedFS) mask, consumed by
  # lerian-common.objectStorage.value (name "s3"). Non-secret fields only —
  # access keys go in secrets.OBJECT_STORAGE_ACCESS_KEY_ID/SECRET_KEY.
  # Example:
  #   objectStorage:
  #     s3: { endpoint: "https://s3.us-east-1.amazonaws.com", region: "us-east-1", bucket: "my-bucket" }
  objectStorage: {}
  # -- Env-wide environment name. Consumed by lerian-common.globalValue (block "env"),
  # single-sourcing ENV_NAME and OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT so they can't drift.
  # Fields: name. (configmap.ENV_NAME overrides.)
  # Example: env: { name: "production" }
  env: {}
  # -- Env-wide observability. Consumed by lerian-common.globalValue (block "observability").
  # Fields: enabled, otlpEndpoint, deploymentEnvironment. (configmap.<KEY> overrides.)
  # Example: observability: { enabled: true, otlpEndpoint: "otel-collector:4317" }
  observability: {}
  # -- Env-wide auth (access-manager). Consumed by lerian-common.globalValue (block "auth").
  # Fields: enabled, host. (configmap.PLUGIN_AUTH_* overrides.)
  # Example: auth: { host: "http://plugin-access-manager-auth:4000" }
  auth: {}
  # -- Env-wide streaming (lib-streaming). Consumed by lerian-common.streaming.env when
  # streaming is enabled. Fields: enabled, brokers, saslUsername, tlsEnabled, compression,
  # requiredAcks, ... (brokers gates emission). Per-app identity (client-id / cloudevents-source)
  # keeps its service-level default unless overridden via common.configmap.
  # The operator sets the connection here: `enabled` + `brokers`. (reporter's transport is
  # RabbitMQ+outbox, so STREAMING_BROKERS is validated-non-empty by lib-streaming but not used
  # to connect — set it explicitly anyway; no placeholder default is baked in.)
  # Example: streaming: { enabled: true, brokers: "redpanda:9092" }
  streaming: {}
  # -- Env-wide service discovery (Consul). Placeholder block: reporter keeps SD_* as
  # configmap passthrough because its lib-service-discovery contract (SD_ADDRESS /
  # SD_ADVERTISE_*) differs from lerian-common.serviceDiscovery.env (SD_INTERNAL_*/EXTERNAL_*).
  # Example: set common.configmap.SD_ENABLED/SD_ADDRESS directly (not this block).
  serviceDiscovery: {}
  # -- Env-wide multi-tenant infra (reserved). Reporter emits only the MULTI_TENANT_ENABLED
  # gate today; other MULTI_TENANT_* keys are set via common.configmap.<KEY>.
  # Example: multiTenant: { enabled: true }
  multiTenant: {}
  # -- Bootstrap job for external MongoDB: creates users and grants privileges
  externalMongoDefinitions:
    # -- Enable or disable the MongoDB bootstrap job
    enabled: false
    # -- MongoDB connection settings
    connection:
      # -- MongoDB host
      host: "reporter-mongodb"
      # -- MongoDB port
      port: "27017"
    # -- Admin credentials for MongoDB (rootUser from bitnami subchart)
    mongoAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_ROOT_USER and MONGO_ROOT_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "reporter"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for reporter user created by the job
    reporterCredentials:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_APP_USER and MONGO_APP_PASSWORD keys
        name: ""
      # -- App username (ignored if useExistingSecret.name is set)
      username: "reporter"
      # -- Password for reporter user (ignored if useExistingSecret.name is set)
      password: ""
      # -- List of roles to grant to the user. Each item is a {role, db} pair.
      roles:
        - role: "readWrite"
          db: "reporter-db"
manager:
  name: "reporter-manager"
  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10
  # -- Annotations for the manager deployment resource
  annotations: {}
  # -- Annotations for the manager pods
  podAnnotations: {}
  replicaCount: 1
  # -- Readiness probe configuration
  readinessProbe:
    initialDelaySeconds: 25
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- Liveness probe configuration
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  image:
    # -- Repository for the console service container image
    repository: ghcr.io/lerianstudio/reporter-manager
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "2.4.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: "nginx"
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 4005
    # -- Annotations for the service
    annotations: {}
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 200m
      memory: 1000Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 256Mi
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: []
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostnamex

  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Minimum number of available pods
    minAvailable: 0
    # -- Annotations for PodDisruptionBudget
    annotations: {}
  useExistingSecret: false
  existingSecretName: ""
  clusterRole:
    # -- Enable or disable ClusterRole and ClusterRoleBinding creation
    create: true
  # -- ServiceAccount configuration for manager
  serviceAccount:
    # -- Enable or disable ServiceAccount creation
    create: true
    # -- Annotations to add to the ServiceAccount (e.g., for IRSA)
    annotations: {}
    # Example for AWS IRSA:
    # annotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
  configmap:
    # -- Annotations for the configmap
    annotations: {}
    # APP (VERSION emitted from .Chart.AppVersion by the configmap template)
    APP_CONTEXT: "/manager/v1"
    SERVER_PORT: "4005"
    SERVER_ADDRESS: ":4005" #":{{ .Values.manager.configmap.SERVER_PORT }}"
    # CORS — no chart default: the app itself requires a non-empty,
    # non-wildcard CORS_ALLOWED_ORIGINS in production (config validation,
    # not a chart mask). Set common.configmap.CORS_ALLOWED_ORIGINS (and
    # optionally CORS_ALLOWED_METHODS/CORS_ALLOWED_HEADERS) to your real
    # consumer origin(s).
    # LOG LEVEL
    LOG_LEVEL: info
    # AUTH — PLUGIN_AUTH_ENABLED/_ADDRESS now emitted by lerian-common.auth.env (global.auth);
    # default host http://plugin-access-manager-auth:4000. Override via global.auth.host or
    # common.configmap.PLUGIN_AUTH_ADDRESS.
    # OPEN TELEMETRY
    OTEL_RESOURCE_SERVICE_NAME: reporter-manager
    # OTEL_RESOURCE_SERVICE_VERSION emitted from image.tag by the configmap template
    # SWAGGER
    SWAGGER_TITLE: 'Reporter'
    SWAGGER_DESCRIPTION: 'Documentation for reporter'
    SWAGGER_VERSION: "v4.0.0" #"{{ .Values.manager.configmap.VERSION }}"
    SWAGGER_HOST: ":4005" #"{{ .Values.manager.configmap.SERVER_ADDRESS }}"
    SWAGGER_BASE_PATH: /
    SWAGGER_SCHEMES: http
    SWAGGER_LEFT_DELIMITER: "{{"
    SWAGGER_RIGHT_DELIMITER: "}}"
    PDF_POOL_WORKERS: "3"
    PDF_TIMEOUT_SECONDS: "60"
    # Rate Limiting - Three-tier system with Redis backend
    # Set RATE_LIMIT_ENABLED=false to disable (requires ALLOW_RATELIMIT_DISABLED in strict tier)
    # ALLOW_RATELIMIT_DISABLED: Set a detailed reason message explaining why rate limiting is disabled
    # ALLOW_RATELIMIT_FAIL_OPEN: Set a detailed reason message to allow fail-open mode in production
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_MAX: "500"
    RATE_LIMIT_WINDOW_SEC: "60"
    AGGRESSIVE_RATE_LIMIT_MAX: "100"
    AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: "60"
    RELAXED_RATE_LIMIT_MAX: "1000"
    RELAXED_RATE_LIMIT_WINDOW_SEC: "60"
    RATE_LIMIT_REDIS_TIMEOUT_MS: "500"
    ALLOW_RATELIMIT_DISABLED: ""
    ALLOW_RATELIMIT_FAIL_OPEN: ""
    # -- Comma-separated proxy IPs/CIDRs that front the manager. From app 3.x (lib-auth
    # v3.4.0) the client IP is derived EXCLUSIVELY from this list: leaving it empty means
    # no client IP is forwarded, so any tenant configured with an IP allowlist denies every
    # request. Set it to the ingress / load-balancer addresses actually in front of this
    # service.
    TRUSTED_PROXIES: ""
  # Extra Env Vars
  extraEnvVars: {}
  # -- HPA configuration (used when KEDA is disabled)
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
  keda:
    scaledObject:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10
      pollingInterval: 30
      cooldownPeriod: 300
      triggers:
        - type: cpu
          metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          metadata:
            value: "80"
            containerName: "reporter-manager"
        - type: memory
          metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          metadata:
            value: "80"
            containerName: "reporter-manager"
# Worker configuration
worker:
  name: "reporter-worker"
  # -- Annotations for worker job resources
  annotations: {}
  # -- Number of replicas (used when KEDA is disabled and worker runs as a Deployment)
  replicaCount: 2
  image:
    # -- Repository for the console service container image
    repository: ghcr.io/lerianstudio/reporter-worker
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "2.4.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 80
    # -- Annotations for the service
    annotations: {}
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 200m
      memory: 256Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 128Mi
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: []
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostname

  useExistingSecret: false
  existingSecretName: ""
  # -- ServiceAccount configuration for worker
  serviceAccount:
    # -- Enable or disable ServiceAccount creation
    create: true
    # -- Annotations to add to the ServiceAccount (e.g., for IRSA)
    annotations: {}
    # Example for AWS IRSA:
    # annotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
  configmap:
    # -- Annotations for the configmap
    annotations: {}
    # APP (VERSION emitted from .Chart.AppVersion by the configmap template)
    # HEALTH SERVER
    HEALTH_PORT: "4006"
    # LOG LEVEL
    LOG_LEVEL: info
    # OPEN TELEMETRY
    OTEL_RESOURCE_SERVICE_NAME: reporter-worker
    # OTEL_RESOURCE_SERVICE_VERSION emitted from image.tag by the configmap template
    PDF_POOL_WORKERS: "3"
    PDF_TIMEOUT_SECONDS: "90"
    # Rate Limiting - Three-tier system with Redis backend
    # Set RATE_LIMIT_ENABLED=false to disable (requires ALLOW_RATELIMIT_DISABLED in strict tier)
    # ALLOW_RATELIMIT_DISABLED: Set a detailed reason message explaining why rate limiting is disabled
    # ALLOW_RATELIMIT_FAIL_OPEN: Set a detailed reason message to allow fail-open mode in production
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_MAX: "500"
    RATE_LIMIT_WINDOW_SEC: "60"
    AGGRESSIVE_RATE_LIMIT_MAX: "100"
    AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: "60"
    RELAXED_RATE_LIMIT_MAX: "1000"
    RELAXED_RATE_LIMIT_WINDOW_SEC: "60"
    RATE_LIMIT_REDIS_TIMEOUT_MS: "500"
    ALLOW_RATELIMIT_DISABLED: ""
    ALLOW_RATELIMIT_FAIL_OPEN: ""
  # -- Pod annotations for the worker deployment (used when KEDA is disabled)
  podAnnotations: {}
  # -- Deployment strategy (used when KEDA is disabled)
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- Readiness probe configuration (used when KEDA is disabled)
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- Liveness probe configuration (used when KEDA is disabled)
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- HPA configuration (used when KEDA is disabled)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
  # Extra Env Vars
  extraEnvVars: {}
  # -- KEDA configuration for worker auto-scaling (default mode)
  keda:
    scaledJob:
      enabled: true
      name: "reporter-worker-scaler"
      pollingInterval: 10
      minReplicaCount: 0
      backoffLimit: 3
      ttlSecondsAfterFinished: 30
      # -- Maximum time in seconds for a job to run before it is terminated
      activeDeadlineSeconds: 300
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      maxReplicaCount: 5
      triggers:
        - type: rabbitmq
          metadata:
            queueLength: "1"
            protocol: "amqp"
            vhost: "/"
common:
  # -- Shared (common) application config for BOTH the manager and worker surfaces.
  # Defaults for every shared key live in the templates (reporter.commonConfigmapData):
  # dependency CONNECTIONS resolve through lerian-common typed masks/helpers, everything
  # else is an escape-hatch passthrough. Set common.configmap.<KEY> here to override any
  # shared key; add any other key and it flows through as-is.
  configmap: {}
# -- Dedicated datastore masks for THIS release (override global.datastores). Both the
# manager and worker surfaces share these connections. Sub-keys (each host/port/user/ssl):
#   mongo:    { host, port, user }         # MongoDB (report store + tenant cache)
#   redis:    { host }                     # Valkey/Redis (host carries host:port)
#   broker:   { host, port }               # RabbitMQ (the generate-report queue)
#   postgres: { host, port, user, ssl }    # external midaz datasource (direct-query mode)
# The native common.configmap.<KEY> still wins over these; these win over global.datastores.
datastores: {}
secrets:
  # -- Credentials for the reporter workloads.
  #
  # useExistingSecret path (recommended for production): set
  # `manager.useExistingSecret: true` + `manager.existingSecretName: <name>` (and the
  # same for `worker`) and provide a Kubernetes Secret whose KEYS match the env-var
  # names below. The workloads mount it via `envFrom.secretRef`, so every credential
  # is referenceable from your own secret manager without ever templating a value here.
  # Required keys in that existing Secret:
  #   - RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS  (broker credentials)
  #   - RABBITMQ_ERLANG_COOKIE                          (bundled broker only; stable value)
  #   - DATASOURCE_ONBOARDING_PASSWORD                  (only when a direct datasource is configured)
  #   - OBJECT_STORAGE_ACCESS_KEY_ID / OBJECT_STORAGE_SECRET_KEY (external S3 only)
  #   - MONGO_PASSWORD                                  (external MongoDB only; bundled is single-sourced)
  #   - APP_ENC_KEY                                     (fetcher integration; base64 32-byte key)
  #   - DATASOURCE_CRED_ENC_KEY                         (app >= 3.0.0 only; hex AES key)
  #
  # Chart-managed path (default): leave `useExistingSecret: false` and set the values
  # below; the chart renders them into the `<manager.name>` Secret.
  #
  # MONGO_PASSWORD is single-sourced from the Bitnami mongodb subchart Secret
  # (<release>-mongodb, key mongodb-root-password) and read via secretKeyRef — leave empty
  # with the bundled subchart; only set for an external MongoDB without
  # mongodb.auth.existingSecret. See docs/helm-chart-standard.md "Single-Source Infra Secrets".
  MONGO_PASSWORD: ""
  # REDIS_PASSWORD intentionally omitted: the bundled valkey runs with auth.enabled=false, so
  # nothing authenticates with it. Reintroduce this key if valkey.auth is ever enabled.
  # RabbitMQ is single-sourced here (Pattern B): the broker is pointed at this Secret via
  # rabbitmq.authentication.existingSecret, so these are the only copies of the broker creds.
  RABBITMQ_DEFAULT_USER: reporter
  RABBITMQ_DEFAULT_PASS: ""
  # Erlang cookie for the bundled RabbitMQ. REQUIRED when rabbitmq.enabled (the broker reads
  # it from this Secret). Must be a STABLE value — changing it across upgrades breaks the
  # cluster. Generate once with: openssl rand -hex 32
  RABBITMQ_ERLANG_COOKIE: ""
  DATASOURCE_ONBOARDING_PASSWORD: ""
  #DATASOURCE_EXTERNAL_PASSWORD: db_password
  # -- Service discovery (lib-service-discovery) Consul ACL token. Operator-provided;
  # only needed when common.configmap.SD_ENABLED=true and the Consul server enforces
  # ACLs. Left empty (and rendered empty) otherwise.
  SD_TOKEN: ""
  OBJECT_STORAGE_ACCESS_KEY_ID: ""
  OBJECT_STORAGE_SECRET_KEY: ""
  # Fetcher Integration - Base64 encoded 32-byte encryption key
  APP_ENC_KEY: ""
  # -- At-rest encryption key for registered data-source credentials. REQUIRED by the
  # reporter app from 3.0.0 on: BOTH the manager and the worker refuse to boot without it,
  # and a request that needs it while unconfigured fails with RPT-0074. Ignored by app 2.4.x
  # (the chart's default appVersion), so it is empty by default and the render only fails
  # once an image tag >= 3.0.0 is pinned.
  # Hex-encoded AES key of 16, 24 or 32 bytes (32/48/64 hex chars): openssl rand -hex 32
  # MUST be byte-identical for the manager and the worker — they encrypt and decrypt the
  # same records.
  # NO ROTATION in this release: changing the value makes every already-registered data
  # source undecryptable (they must be re-registered).
  DATASOURCE_CRED_ENC_KEY: ""
seaweedfs:
  enabled: true
  # -- Subchart-wide settings. createClusterRole is disabled by default: the bundled
  # seaweedfs chart otherwise creates a FIXED-NAME cluster-scoped ClusterRole
  # ("<serviceAccountName>-rw-cr") and ClusterRoleBinding that collide when more than
  # one release is installed on the same cluster (different namespaces). The role only
  # backs an optional pod-deletion hack after volume migration, so it is off by default.
  # To re-enable, set createClusterRole=true AND a release-unique serviceAccountName.
  global:
    createClusterRole: false
    serviceAccountName: "reporter-seaweedfs"
  master:
    enabled: true
    replicas: 1
    extraArgs:
      - "master"
      - "-port=9333"
      - "-mdir=/data"
    service:
      type: ClusterIP
      ports:
        http: 9333
        ui: 9334
    # Persistent storage for the master node
    data:
      type: "persistentVolumeClaim"
      size: "5Gi"
      storageClass: null # Use cluster default or set a specific StorageClass
  volume:
    enabled: true
    replicas: 1
    extraArgs:
      - "volume"
      - "-port=9080"
      - "-mserver=seaweedfs-master:9333"
      - "-dir=/data"
      - "-max=0"
    service:
      type: ClusterIP
      ports:
        http: 9080
    # Persistent storage for volume servers
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        storageClass: null # Use default or specify your StorageClass
        maxVolumes: 0 # 0 = let SeaweedFS decide, or set a limit
  filer:
    enabled: true
    extraArgs:
      - "filer"
      - "-port=8888"
      - "-master=seaweedfs-master:9333"
    service:
      type: ClusterIP
      ports:
        http: 8888
    # Persistent storage for filer
    data:
      type: "persistentVolumeClaim"
      size: "25Gi"
      storageClass: null
  s3:
    enabled: true
    port: 8333
    grpcPort: 18333
    # Allow empty access key for development (disable auth)
    # In production, use Kubernetes secrets for credentials
    allowEmptyAccessKey: true
    # Enable path-style URLs (required for most S3 clients with non-AWS endpoints)
    enableAuth: false
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    logs:
      type: "emptyDir"
# KEDA configuration
keda:
  enabled: true
  # Set to true when using an externally installed KEDA operator (e.g., installed via separate helm chart)
  # When external is true, the chart will still create ScaledJob and TriggerAuthentication resources
  # but will not install the KEDA operator itself
  external: false
  # TriggerAuthentication configuration for RabbitMQ credentials
  triggerAuthentication:
    # -- Secret name containing RabbitMQ credentials (defaults to reporter-manager secret)
    secretName: ""
    # -- Key in secret for RabbitMQ username
    usernameKey: "RABBITMQ_DEFAULT_USER"
    # -- Key in secret for RabbitMQ password
    passwordKey: "RABBITMQ_DEFAULT_PASS"
  crds:
    install: true
  webhookCerts:
    generate: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  operator:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  webhooks:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  metricsApiServer:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
mongodb:
  # MongoDB’s flexibility and scalability make it the perfect choice for managing evolving and less structured data.
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/mongodb
    tag: "latest"
  external: false
  auth:
    enabled: true
    rootUser: reporter
    rootPassword: ""
  persistence:
    size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 512Mi
  resourcesPreset: small
  service:
    type: ClusterIP
    port: 27017
externalRabbitmqDefinitions:
  # -- Enable or disable the RabbitMQ bootstrap job
  enabled: false
  # -- RabbitMQ connection settings
  connection:
    # -- RabbitMQ protocol (http or https)
    protocol: "http"
    # -- RabbitMQ host (management API endpoint)
    host: "reporter-rabbitmq"
    # -- RabbitMQ HTTP management port
    port: "15672"
    # -- RabbitMQ AMQP port (for connectivity check)
    portAmqp: "5672"
  # -- Admin credentials for RabbitMQ management API
  rabbitmqAdminLogin:
    useExistingSecret:
      # -- Name of existing secret containing RABBITMQ_ADMIN_USER and RABBITMQ_ADMIN_PASS keys
      name: ""
    # -- Admin username (ignored if useExistingSecret.name is set)
    username: "midaz"
    # -- Admin password (ignored if useExistingSecret.name is set)
    password: ""
  # -- Credentials for the reporter application user created by the job
  appCredentials:
    useExistingSecret:
      # -- Name of existing secret containing RABBITMQ_DEFAULT_PASS key
      name: ""
    # -- Password for reporter user (ignored if useExistingSecret.name is set)
    reporterPassword: ""
rabbitmq:
  enabled: true
  image:
    tag: "3.13.6"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  # Single-source (Pattern B): the broker reads its credentials from the application
  # manager Secret (reporter-manager) instead of keeping its own copy. The RabbitMQ
  # password therefore lives in exactly one place — secrets.RABBITMQ_DEFAULT_PASS — and
  # the latent user mismatch (broker "midaz" vs app "reporter") is removed. Setting
  # existingSecret suppresses the inline cookie, so RABBITMQ_ERLANG_COOKIE is required
  # in the app Secret (see secrets + reporter.rabbitmqErlangCookieRequired).
  # If the manager Secret name is overridden (manager.name / manager.existingSecretName),
  # update authentication.existingSecret to match.
  # See docs/helm-chart-standard.md "Single-Source Infra Secrets".
  authentication:
    existingSecret: "reporter-manager"
    user:
      secretKey: RABBITMQ_DEFAULT_USER
    password:
      secretKey: RABBITMQ_DEFAULT_PASS
    erlangCookie:
      secretKey: RABBITMQ_ERLANG_COOKIE
  extraSecrets:
    - name: "reporter-manager-load-definitions"
      mountPath: /etc/rabbitmq/definitions
  customConfig: |
    management.load_definitions = /etc/rabbitmq/definitions/load_definition.json
valkey:
  # Redis is used to handle scenarios where real-time performance and fast data retrieval are essential.
  # This component is responsible for providing an in-memory data store
  # For more details, refer to the documentation:
  # https://docs.lerian.studio/docs/midaz-components#why-redis
  enabled: true
  auth:
    enabled: false
otel-collector-lerian:
  enabled: true
# -- AWS Authentication - IAM Roles Anywhere for non-AWS clusters (e.g. Clotilde/Proxmox)
aws:
  rolesAnywhere:
    enabled: false
    trustAnchorArn: ""
    profileArn: ""
    roleArn: ""
    region: "us-east-2"
    sessionDuration: 3600
    certificateSecretName: "reporter-iam-tls"
    sidecar:
      image:
        repository: public.ecr.aws/rolesanywhere/credential-helper
        tag: "latest-amd64"
        pullPolicy: IfNotPresent
      port: 9911
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
