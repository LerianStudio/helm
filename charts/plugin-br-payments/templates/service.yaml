{{- $h := include "plugin-br-payments.health" . | fromYaml }}
{{- include "lerian-common.service" (dict
      "service" .Values.app.service
      "name" (include "plugin-br-payments.fullname" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "plugin-br-payments.labels" (dict "context" .))
      "selector" (include "plugin-br-payments.selectorLabels" (dict "context" .))
      "ports" (ternary $h.servicePorts (list) (eq (include "plugin-br-payments.multiTenantEnabled" .) "true"))
    ) }}
