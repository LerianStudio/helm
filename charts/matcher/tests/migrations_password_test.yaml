suite: migration Job reads the PostgreSQL password from a single source
templates:
  - templates/migrations/job.yaml
  - templates/migrations/secrets.yaml
release:
  name: matcher
  namespace: matcher
set:
  matcher.configmap.DEPLOYMENT_MODE: byoc
  matcher.secrets.RABBITMQ_PASSWORD: x
  migrations.enabled: true
tests:
  - it: bundled PostgreSQL feeds the Job from the subchart Secret
    template: templates/migrations/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: matcher-postgresql
                key: password

  - it: bundled PostgreSQL renders no migration password Secret
    template: templates/migrations/secrets.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: postgresql.auth.existingSecret wins over the derived subchart Secret
    template: templates/migrations/job.yaml
    set:
      postgresql.auth.existingSecret: pg-auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pg-auth
                key: password

  - it: external PostgreSQL reads the PreSync Secret the chart mints
    template: templates/migrations/job.yaml
    set:
      postgresql.enabled: false
      migrations.postgres.password: placeholder-pg-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: matcher-migrations
                key: POSTGRES_PASSWORD

  - it: external PostgreSQL mints the PreSync Secret from migrations.postgres.password
    template: templates/migrations/secrets.yaml
    set:
      postgresql.enabled: false
      migrations.postgres.password: placeholder-pg-password
    asserts:
      - equal:
          path: stringData.POSTGRES_PASSWORD
          value: placeholder-pg-password

  - it: external PostgreSQL without a password fails the render
    template: templates/migrations/secrets.yaml
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "migrations.postgres.password \\(or matcher.secrets.POSTGRES_PASSWORD\\) is required"

  - it: useExistingSecret reads POSTGRES_PASSWORD from the operator Secret
    template: templates/migrations/job.yaml
    set:
      postgresql.enabled: false
      matcher.useExistingSecret: true
      matcher.existingSecretName: matcher-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: matcher-secrets
                key: POSTGRES_PASSWORD
