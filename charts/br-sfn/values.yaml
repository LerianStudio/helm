  objectStorage: {}
  #   default: { endpoint: "https://s3.amazonaws.com", region: "us-east-1", bucket: "bc-correios-attachments", usePathStyle: "false" }
  # -- CORREIOS ConfigMap escape hatch: set/override ANY native env KEY (POSTGRES_*,
  # CACHE_*, OBJECT_STORAGE_*, MULTI_TENANT_*, AI_*, BC_CORREIO_*, ...); wins over the
  # template default. Credentials NEVER go here — use secrets.
  configmap: {}
  # -- CORREIOS Secret map (emit-when-set). Holds POSTGRES_PASSWORD, CACHE_PASSWORD,
  # RABBITMQ_URL (embeds creds) + RABBITMQ_PASS, OBJECT_STORAGE_ACCESS_KEY/SECRET_KEY,
  # ENCRYPTION_KEY, LICENSE_KEY, PLUGIN_AUTH_CLIENT_SECRET,
  # MULTI_TENANT_SERVICE_API_KEY, MULTI_TENANT_REDIS_PASSWORD.
  secrets: {}
  useExistingSecret: false
  existingSecretName: ""
