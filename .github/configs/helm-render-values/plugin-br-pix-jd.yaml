# CI-ONLY render fixture for charts/plugin-br-pix-jd.
#
# NOT a production example and NOT a credential store. Every value here exists so
# the repository render gate can satisfy the chart's fail-loud gates; the strings
# are deliberately self-describing placeholders, never real secrets.
#
# Gates this file satisfies:
#   api.secrets.LICENSE_KEY   — required whenever the api renders its own Secret
#   api.configmap.REDIS_HOST  — required because the rate limiter is fail-closed
#   api.configmap.ENVIRONMENT_NAME — required so the production gates are deliberate
#   api.configmap.MIDAZ_ASSET_ID   — required; empty silently backfills a fake asset
#   api.configmap.POSTGRES_HOST    — required desde que o default de
#     postgresql.enabled virou `false` (alinhando ao go-boilerplate-ddd-helm e ao
#     bloco valkey). Antes o host era DERIVADO do Service do subchart embarcado, que
#     o default renderizava; com o Postgres externo por default não há de onde
#     derivar e o chart falha o render nomeando a chave. Esta fixture representa o
#     caminho EXTERNO, que é o default — o caminho embarcado é exercido pelos values
#     reais do anacleto/chaos.
#   api.secrets.POSTGRES_PASSWORD  — requerida pelo mesmo motivo: o Job de migrations
#     roda como pre-install hook, ANTES de o Secret normal do chart existir, então no
#     caminho externo ele precisa da senha declarada. No caminho embarcado ela vem do
#     Secret do próprio subchart e esta chave é dispensável.
api:
  configmap:
    REDIS_HOST: "valkey:6379"
    POSTGRES_HOST: "postgresql"
    # Required gate: an empty value would resolve to "development" in the app and
    # silently disable every production security check.
    ENVIRONMENT_NAME: "development"
    # Required gate: an empty value is NOT inert — the app backfills "1" and posts
    # against a fabricated asset instead of failing closed.
    MIDAZ_ASSET_ID: "BRL"
  secrets:
    LICENSE_KEY: "ci-only-not-a-real-license"
    POSTGRES_PASSWORD: "ci-only-not-a-real-password"
