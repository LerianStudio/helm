# Default values
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # -- Bootstrap job for external MongoDB: creates users and grants privileges
  externalMongoDefinitions:
    # -- Enable or disable the MongoDB bootstrap job
    enabled: false
    # -- MongoDB connection settings
    connection:
      # -- MongoDB host
      host: "reporter-mongodb"
      # -- MongoDB port
      port: "27017"
    # -- Admin credentials for MongoDB (rootUser from bitnami subchart)
    mongoAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_ROOT_USER and MONGO_ROOT_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "reporter"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for reporter user created by the job
    reporterCredentials:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_APP_USER and MONGO_APP_PASSWORD keys
        name: ""
      # -- App username (ignored if useExistingSecret.name is set)
      username: "reporter"
      # -- Password for reporter user (ignored if useExistingSecret.name is set)
      password: ""
      # -- List of roles to grant to the user. Each item is a {role, db} pair.
      roles:
        - role: "readWrite"
          db: "reporter-db"
  # -- Datastore host/connection mask (lerian-common). Set a field ONCE here to
  #    override the in-cluster default host/port/user/ssl for every component
  #    (SHARED mode). A raw `common.configmap.<KEY>` still wins over the mask.
  #    Leave empty to keep the shipped in-cluster defaults. Example:
  #    datastores:
  #      broker: { host: "my-rabbit.example.com" }        # → RABBITMQ_HOST
  #      mongo:  { host: "my-mongo", user: "app", port: "27017", params: "" }
  #      redis:  { host: "my-redis:6379" }                # → REDIS_HOST
  #      postgres: { host: "pg", port: "5432", user: "app", ssl: "require" }  # DATASOURCE_ONBOARDING_*
  #      objectStorage: { endpoint: "https://s3.example.com" }  # → OBJECT_STORAGE_ENDPOINT
  datastores: {}
  # -- Service discovery (lib-service-discovery) — env-wide, shared by manager +
  #    worker. Opt in via `common.serviceDiscovery.enabled`. The per-app SD_* block
  #    is INERT until enabled AND `address` is set, so a default install (SD off)
  #    renders unchanged. `address` defaults to the bundled Consul Service
  #    (`reporter-consul-server:8500`, see the top-level `consul` block) so the
  #    self-contained SD stack works with no extra wiring — analogous to the reporter
  #    infra compose injecting `reporter-consul:8500`.
  serviceDiscovery:
    address: "reporter-consul-server:8500"  # Consul host:port → SD_ADDRESS
    tls: false                              # → SD_TLS
    tlsSkipVerify: false                    # → SD_TLS_SKIP_VERIFY (true only to opt out of TLS verification)
    workload: ""                            # per-env isolation key → SD_WORKLOAD
    preferView: "internal"                  # internal|external → SD_PREFER_VIEW
  # -- Streaming (lib-streaming) — env-wide broker/SASL/TLS config, shared by
  #    manager + worker. Opt in via `common.streaming.enabled`. INERT until enabled
  #    AND `brokers` is set, so a default install (streaming off) renders unchanged.
  streaming:
    brokers: ""                             # host:port → STREAMING_BROKERS
    tlsEnabled: false                       # → STREAMING_TLS_ENABLED
    saslMechanism: ""                       # e.g. SCRAM-SHA-256 → STREAMING_SASL_MECHANISM
    saslUsername: ""                        # → STREAMING_SASL_USERNAME
  # -- Multi-tenant (lib-commons/multitenancy) — env-wide tenant-manager endpoint +
  #    its redis, shared by manager + worker. Consumed by lerian-common.multiTenant.env
  #    ONLY when a component enables MT (common.multiTenant.enabled=true). The remaining
  #    MT knobs (timeout/cache/pool/circuit-breaker/environment/allowInsecure) use the
  #    helper's canonical defaults (which match reporter's .env) and are overridable via
  #    the raw common.configmap.MULTI_TENANT_* keys.
  multiTenant:
    url: ""                                 # → MULTI_TENANT_URL (required when MT enabled)
    redisHost: ""                           # → MULTI_TENANT_REDIS_HOST (required when MT enabled)
    redisPort: "6379"                       # → MULTI_TENANT_REDIS_PORT
    redisTls: false                         # → MULTI_TENANT_REDIS_TLS
manager:
  name: "reporter-manager"
  # -- Enable or disable the manager (API) component
  enabled: true
  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10
  # -- Annotations for the manager deployment resource
  annotations: {}
  # -- Annotations for the manager pods
  podAnnotations: {}
  replicaCount: 1
  # -- Readiness probe configuration
  readinessProbe:
    initialDelaySeconds: 25
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- Liveness probe configuration
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  image:
    # -- Repository for the console service container image
    repository: ghcr.io/lerianstudio/reporter-manager
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "2.3.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: "nginx"
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 4005
    # -- Annotations for the service
    annotations: {}
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 200m
      memory: 1000Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 256Mi
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostnamex

  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Minimum number of available pods
    minAvailable: 0
    # -- Annotations for PodDisruptionBudget
    annotations: {}
  useExistingSecret: false
  existingSecretName: ""
  clusterRole:
    # -- Enable or disable ClusterRole and ClusterRoleBinding creation
    create: true
  # -- ServiceAccount configuration for manager
  serviceAccount:
    # -- Enable or disable ServiceAccount creation
    create: true
    # -- Annotations to add to the ServiceAccount (e.g., for IRSA)
    annotations: {}
    # Example for AWS IRSA:
    # annotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
  # ===========================================================================
  # PRODUCTIZED CONFIG (manager) — clean, grouped params for the knobs clients
  # tune most. Backward-compatible: the raw `configmap.<KEY>` (and shared
  # `common.configmap.<KEY>`) still work and OVERRIDE these
  # (precedence: configmap.<KEY> > these params > default). Defaults here match
  # the legacy template defaults, so existing installs render unchanged.
  # ===========================================================================
  # --- App -------------------------------------------------------------------
  app:
    appContext: "/manager/v1"          # → APP_CONTEXT
    serverPort: "4005"                 # → SERVER_PORT
    serverAddress: ":4005"             # → SERVER_ADDRESS
    logLevel: "debug"                  # → LOG_LEVEL
    trustedProxies: ""                 # → TRUSTED_PROXIES (comma-separated IPs/CIDRs for X-Forwarded-For)
  # --- CORS (API surface) — wildcard origins only in development -------------
  cors:
    allowedOrigins: "*"                # → CORS_ALLOWED_ORIGINS
    allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"                  # → CORS_ALLOWED_METHODS
    allowedHeaders: "Origin,Content-Type,Accept,Authorization,X-Request-ID"  # → CORS_ALLOWED_HEADERS
  # --- Auth (plugin-access-manager) ------------------------------------------
  auth:
    enabled: "false"                   # → PLUGIN_AUTH_ENABLED
    address: "http://plugin-access-manager-auth:4000"  # → PLUGIN_AUTH_ADDRESS
  # --- OpenTelemetry identity (service name; version comes from image.tag) ---
  otel:
    serviceName: "reporter-manager"    # → OTEL_RESOURCE_SERVICE_NAME
  # --- Swagger ---------------------------------------------------------------
  swagger:
    enabled: "true"                    # → SWAGGER_ENABLED
    title: "Reporter"                  # → SWAGGER_TITLE
    description: "Documentation for reporter"  # → SWAGGER_DESCRIPTION
    version: "v4.0.0"                  # → SWAGGER_VERSION
    host: ":4005"                      # → SWAGGER_HOST
    basePath: "/"                      # → SWAGGER_BASE_PATH
    schemes: "http"                    # → SWAGGER_SCHEMES
    leftDelimiter: "{{"                # → SWAGGER_LEFT_DELIMITER
    rightDelimiter: "}}"               # → SWAGGER_RIGHT_DELIMITER
  # --- PDF rendering ---------------------------------------------------------
  pdf:
    poolWorkers: "3"                   # → PDF_POOL_WORKERS
    timeoutSeconds: "60"               # → PDF_TIMEOUT_SECONDS
  # --- Rate limiting (three-tier, Redis-backed) ------------------------------
  rateLimit:
    enabled: "true"                    # → RATE_LIMIT_ENABLED
    max: "500"                         # → RATE_LIMIT_MAX
    windowSec: "60"                    # → RATE_LIMIT_WINDOW_SEC
    aggressiveMax: "100"               # → AGGRESSIVE_RATE_LIMIT_MAX
    aggressiveWindowSec: "60"          # → AGGRESSIVE_RATE_LIMIT_WINDOW_SEC
    relaxedMax: "1000"                 # → RELAXED_RATE_LIMIT_MAX
    relaxedWindowSec: "60"             # → RELAXED_RATE_LIMIT_WINDOW_SEC
    redisTimeoutMs: "500"              # → RATE_LIMIT_REDIS_TIMEOUT_MS
    allowDisabled: ""                  # → ALLOW_RATELIMIT_DISABLED
    allowFailOpen: ""                  # → ALLOW_RATELIMIT_FAIL_OPEN
  # -- ConfigMap for environment variables (raw/legacy format; still fully
  #    supported and takes PRECEDENCE over the productized params above).
  #    Empty by default. Use `annotations` here to annotate the ConfigMap.
  configmap: {}
  # Extra Env Vars
  extraEnvVars: {}
  # -- HPA configuration (used when KEDA is disabled)
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
  keda:
    scaledObject:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 10
      pollingInterval: 30
      cooldownPeriod: 300
      triggers:
        - type: cpu
          metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          metadata:
            value: "80"
            containerName: "reporter-manager"
        - type: memory
          metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          metadata:
            value: "80"
            containerName: "reporter-manager"
# Worker configuration
worker:
  name: "reporter-worker"
  # -- Enable or disable the worker component
  enabled: true
  # -- Annotations for worker job resources
  annotations: {}
  # -- Number of replicas (used when KEDA is disabled and worker runs as a Deployment)
  replicaCount: 2
  image:
    # -- Repository for the console service container image
    repository: ghcr.io/lerianstudio/reporter-worker
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "2.3.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 80
    # -- Annotations for the service
    annotations: {}
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 200m
      memory: 256Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 128Mi
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1000
    runAsUser: 1000
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostname

  useExistingSecret: false
  existingSecretName: ""
  # -- ServiceAccount configuration for worker
  serviceAccount:
    # -- Enable or disable ServiceAccount creation
    create: true
    # -- Annotations to add to the ServiceAccount (e.g., for IRSA)
    annotations: {}
    # Example for AWS IRSA:
    # annotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/my-role"
  # ===========================================================================
  # PRODUCTIZED CONFIG (worker) — same precedence rules as the manager block:
  # configmap.<KEY> (and shared common.configmap.<KEY>) > these params > default.
  # ===========================================================================
  # --- App -------------------------------------------------------------------
  app:
    healthPort: "4006"                 # → HEALTH_PORT
    logLevel: "debug"                  # → LOG_LEVEL
  # --- OpenTelemetry identity (service name; version comes from image.tag) ---
  otel:
    serviceName: "reporter-worker"     # → OTEL_RESOURCE_SERVICE_NAME
  # --- PDF rendering ---------------------------------------------------------
  pdf:
    poolWorkers: "5"                   # → PDF_POOL_WORKERS
    timeoutSeconds: "30"               # → PDF_TIMEOUT_SECONDS
  # --- Rate limiting (three-tier, Redis-backed) ------------------------------
  rateLimit:
    enabled: "true"                    # → RATE_LIMIT_ENABLED
    max: "500"                         # → RATE_LIMIT_MAX
    windowSec: "60"                    # → RATE_LIMIT_WINDOW_SEC
    aggressiveMax: "100"               # → AGGRESSIVE_RATE_LIMIT_MAX
    aggressiveWindowSec: "60"          # → AGGRESSIVE_RATE_LIMIT_WINDOW_SEC
    relaxedMax: "1000"                 # → RELAXED_RATE_LIMIT_MAX
    relaxedWindowSec: "60"             # → RELAXED_RATE_LIMIT_WINDOW_SEC
    redisTimeoutMs: "500"              # → RATE_LIMIT_REDIS_TIMEOUT_MS
    allowDisabled: ""                  # → ALLOW_RATELIMIT_DISABLED
    allowFailOpen: ""                  # → ALLOW_RATELIMIT_FAIL_OPEN
  # -- ConfigMap for environment variables (raw/legacy format; still fully
  #    supported and takes PRECEDENCE over the productized params above).
  #    Empty by default. Use `annotations` here to annotate the ConfigMap.
  configmap: {}
  # -- Pod annotations for the worker deployment (used when KEDA is disabled)
  podAnnotations: {}
  # -- Deployment strategy (used when KEDA is disabled)
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # -- Readiness probe configuration (used when KEDA is disabled)
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- Liveness probe configuration (used when KEDA is disabled)
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  # -- HPA configuration (used when KEDA is disabled)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    scaleDownStabilizationSeconds: 300
  # Extra Env Vars
  extraEnvVars: {}
  # -- KEDA configuration for worker auto-scaling (default mode)
  keda:
    scaledJob:
      enabled: true
      name: "reporter-worker-scaler"
      pollingInterval: 10
      minReplicaCount: 0
      backoffLimit: 3
      ttlSecondsAfterFinished: 30
      # -- Maximum time in seconds for a job to run before it is terminated
      activeDeadlineSeconds: 300
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      maxReplicaCount: 5
      triggers:
        - type: rabbitmq
          metadata:
            queueLength: "1"
            protocol: "amqp"
            vhost: "/"
# ===========================================================================
# SHARED CONFIG (manager + worker) — PRODUCTIZED grouped params.
# Both components consume this block. Backward-compatible: the raw
# `common.configmap.<KEY>` (and per-component `<component>.configmap.<KEY>`)
# still work and OVERRIDE these params (precedence: configmap.<KEY> > these
# params > default). Connection hosts/users/ports come from the
# `global.datastores` mask (see `global.datastores` below) with the legacy
# in-cluster FQDNs as defaults, so a default install renders unchanged.
# ===========================================================================
common:
  # -- ENV_NAME
  env: "development"
  # -- DEPLOYMENT_MODE (local|byoc|saas) — drives boot TLS enforcement + /readyz.
  #    Default "local" matches the app .env and the self-contained plaintext infra.
  deploymentMode: "local"              # → DEPLOYMENT_MODE
  # -- ALLOW_INSECURE_TLS — bypass SaaS/production TLS enforcement. Default "true"
  #    so the bundled plaintext infra (rabbitmq/mongo/valkey/seaweedfs) connects,
  #    matching the app .env local default. NEVER set true in production.
  allowInsecureTls: "true"             # → ALLOW_INSECURE_TLS
  # --- Broker (RabbitMQ) — host via global.datastores.broker; passwords via secrets
  broker:
    uri: "amqp"                        # → RABBITMQ_URI
    portHost: "15672"                  # → RABBITMQ_PORT_HOST
    portAmqp: "5672"                   # → RABBITMQ_PORT_AMQP
    workers: "5"                       # → RABBITMQ_NUMBERS_OF_WORKERS
    exchange: "reporter.generate-report.exchange"          # → RABBITMQ_EXCHANGE
    generateReportQueue: "reporter.generate-report.queue"  # → RABBITMQ_GENERATE_REPORT_QUEUE
    generateReportKey: "reporter.generate-report.key"      # → RABBITMQ_GENERATE_REPORT_KEY
    # healthCheckUrl default "http://reporter-rabbitmq.reporter.svc.cluster.local:15672" # → RABBITMQ_HEALTH_CHECK_URL
    tls: "false"                       # → RABBITMQ_TLS
    dlqQueue: "reporter.dlq"           # → RABBITMQ_DLQ_QUEUE (worker surface only)
    reportEventsExchange: "reporter.events"  # → RABBITMQ_REPORT_EVENTS_EXCHANGE (lib-streaming business events)
    multiTenantDiscoveryTimeout: "500" # → RABBITMQ_MULTI_TENANT_DISCOVERY_TIMEOUT
    multiTenantSyncInterval: "30"      # → RABBITMQ_MULTI_TENANT_SYNC_INTERVAL
  # --- Redis / Valkey — host via global.datastores.redis
  redis:
    masterName: ""                     # → REDIS_MASTER_NAME
    db: "0"                            # → REDIS_DB
    protocol: "3"                      # → REDIS_PROTOCOL
    tls: "false"                       # → REDIS_TLS
    caCert: ""                         # → REDIS_CA_CERT
    serviceAccount: ""                 # → REDIS_SERVICE_ACCOUNT
    googleAppCredentials: ""           # → GOOGLE_APPLICATION_CREDENTIALS
    useGcpIam: "false"                 # → REDIS_USE_GCP_IAM
  # --- Object storage (SeaweedFS by default) — endpoint via global.datastores.objectStorage
  objectStorage:
    region: "us-east-1"                # → OBJECT_STORAGE_REGION
    usePathStyle: "true"               # → OBJECT_STORAGE_USE_PATH_STYLE
    disableSsl: "true"                 # → OBJECT_STORAGE_DISABLE_SSL
    bucket: "reporter-storage"         # → OBJECT_STORAGE_BUCKET
  # --- MongoDB — host/user/port/params via global.datastores.mongo; password via secrets
  mongo:
    uri: "mongodb"                     # → MONGO_URI
    name: "reporter-db"                # → MONGO_NAME
    maxPoolSize: "1000"                # → MONGO_MAX_POOL_SIZE
    tlsCaCert: ""                      # → MONGO_TLS_CA_CERT
  # --- OpenTelemetry (shared; per-component service name lives under manager/worker.otel)
  otel:
    libraryName: "github.com/LerianStudio/reporter"  # → OTEL_LIBRARY_NAME
    deploymentEnvironment: "production"              # → OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT
    otlpEndpointPort: "4317"                         # → OTEL_EXPORTER_OTLP_ENDPOINT_PORT
    otlpEndpoint: "otlp://midaz-otel-lgtm:4317"      # → OTEL_EXPORTER_OTLP_ENDPOINT
    enableTelemetry: "true"                          # → ENABLE_TELEMETRY
    insecureExporter: "false"                        # → OTEL_INSECURE_EXPORTER
  # --- Fetcher integration
  fetcher:
    enabled: "false"                   # → FETCHER_ENABLED
    url: ""                            # → FETCHER_URL
  # --- Multi-tenant — full block wired via lerian-common.multiTenant.env, gated on
  #     `enabled`. When enabled, MULTI_TENANT_URL + MULTI_TENANT_REDIS_HOST come from
  #     global.multiTenant (required); the rest use the helper's canonical defaults
  #     (match reporter's .env). Secrets: MULTI_TENANT_SERVICE_API_KEY (required),
  #     MULTI_TENANT_REDIS_PASSWORD (optional) — set under `secrets` (see below).
  multiTenant:
    enabled: "false"                   # → MULTI_TENANT_ENABLED
    redisCaCert: ""                    # → MULTI_TENANT_REDIS_CA_CERT (base64 PEM; used when MULTI_TENANT_REDIS_TLS=true)
  # --- Datasources (direct single-tenant query mode)
  datasource:
    # -- Midaz onboarding datasource — host/port/user/ssl via global.datastores.postgres
    onboarding:
      configName: "midaz_onboarding"   # → DATASOURCE_ONBOARDING_CONFIG_NAME
      database: "onboarding"           # → DATASOURCE_ONBOARDING_DATABASE
      type: "postgresql"               # → DATASOURCE_ONBOARDING_TYPE
      sslRootCert: ""                  # → DATASOURCE_ONBOARDING_SSLROOTCERT
    # -- External datasource — a distinct Postgres (NOT the shared cluster infra).
    #    OFF by default: when disabled the DATASOURCE_EXTERNAL_* keys are NOT emitted
    #    (so the app registers no external datasource), and legacy flat
    #    common.configmap.DATASOURCE_EXTERNAL_* still passes through. Set enabled=true
    #    to emit the grouped block below. Password → secrets.DATASOURCE_EXTERNAL_PASSWORD.
    external:
      enabled: false                   # gate (chart-only; NOT emitted as an env var)
      configName: "external_db"        # → DATASOURCE_EXTERNAL_CONFIG_NAME
      host: "external-postgres"        # → DATASOURCE_EXTERNAL_HOST
      port: "5432"                     # → DATASOURCE_EXTERNAL_PORT
      user: "db_user"                  # → DATASOURCE_EXTERNAL_USER
      database: "external_database"    # → DATASOURCE_EXTERNAL_DATABASE
      type: "postgresql"               # → DATASOURCE_EXTERNAL_TYPE
      sslMode: "disable"               # → DATASOURCE_EXTERNAL_SSLMODE
      sslRootCert: ""                  # → DATASOURCE_EXTERNAL_SSLROOTCERT
      dbSchemas: "sales,inventory,reporting"  # → DATASOURCE_EXTERNAL_DB_SCHEMAS (comma-separated)
  # --- Service discovery (lib-service-discovery) — SHARED by manager + worker.
  #     enabled=false (default) => only `SD_ENABLED: "false"` is emitted; the derived
  #     SD_* block stays INERT until enabled AND global.serviceDiscovery.address is set.
  #     Legacy raw `common.configmap.SD_ENABLED` (or `<component>.configmap.SD_ENABLED`)
  #     still WINS. Env-wide server config comes from global.serviceDiscovery; the
  #     advertise endpoints (SD_INTERNAL_*/SD_EXTERNAL_*, which lib-service-discovery
  #     accepts in place of legacy SD_ADVERTISE_*) derive from the reporter API
  #     (manager) Service + ingress — reporter registers under that identity.
  serviceDiscovery:
    enabled: "false"                   # → SD_ENABLED
  # --- Streaming (lib-streaming) — SHARED by manager + worker.
  #     enabled=false (default) => only `STREAMING_ENABLED: "false"` is emitted; the
  #     derived STREAMING_* block stays INERT until enabled AND global.streaming.brokers
  #     is set. Legacy raw `common.configmap.STREAMING_ENABLED` still WINS. Client
  #     identity below is shared across both components.
  streaming:
    enabled: "false"                   # → STREAMING_ENABLED
    clientId: "reporter"               # → STREAMING_CLIENT_ID
    cloudeventsSource: "//lerian.reporter"  # → STREAMING_CLOUDEVENTS_SOURCE
    compression: "lz4"                 # → STREAMING_COMPRESSION (reporter-specific; not in the generic helper)
    requiredAcks: "all"                # → STREAMING_REQUIRED_ACKS (reporter-specific; not in the generic helper)
  # -- Shared raw/legacy ConfigMap. Still fully supported and takes PRECEDENCE
  #    over the grouped params above. Empty by default. Any arbitrary key set here
  #    is passed through to both components' ConfigMaps — this is where external
  #    datasources with multiple schemas are still configured, e.g.:
  #    DATASOURCE_EXTERNAL_CONFIG_NAME: external_db
  #    DATASOURCE_EXTERNAL_HOST: external-postgres
  #    DATASOURCE_EXTERNAL_PORT: "5432"
  #    DATASOURCE_EXTERNAL_USER: db_user
  #    DATASOURCE_EXTERNAL_DATABASE: external_database
  #    DATASOURCE_EXTERNAL_TYPE: postgresql
  #    DATASOURCE_EXTERNAL_SSLMODE: disable
  #    DATASOURCE_EXTERNAL_DB_SCHEMAS: sales,inventory,reporting
  configmap: {}
secrets:
  # MONGO_PASSWORD is single-sourced from the Bitnami mongodb subchart Secret
  # (<release>-mongodb, key mongodb-root-password) and read via secretKeyRef — leave empty
  # with the bundled subchart; only set for an external MongoDB without
  # mongodb.auth.existingSecret. See docs/helm-chart-standard.md "Single-Source Infra Secrets".
  MONGO_PASSWORD: ""
  # REDIS_PASSWORD intentionally omitted: the bundled valkey runs with auth.enabled=false, so
  # nothing authenticates with it. Reintroduce this key if valkey.auth is ever enabled.
  # RabbitMQ is single-sourced here (Pattern B): the broker is pointed at this Secret via
  # rabbitmq.authentication.existingSecret, so these are the only copies of the broker creds.
  RABBITMQ_DEFAULT_USER: plugin
  RABBITMQ_DEFAULT_PASS: ""
  # Erlang cookie for the bundled RabbitMQ. REQUIRED when rabbitmq.enabled (the broker reads
  # it from this Secret). Must be a STABLE value — changing it across upgrades breaks the
  # cluster. Generate once with: openssl rand -hex 32
  RABBITMQ_ERLANG_COOKIE: ""
  DATASOURCE_ONBOARDING_PASSWORD: ""
  # External datasource password — used only when common.datasource.external.enabled=true.
  DATASOURCE_EXTERNAL_PASSWORD: ""
  OBJECT_STORAGE_ACCESS_KEY_ID: ""
  OBJECT_STORAGE_SECRET_KEY: ""
  # Fetcher Integration - Base64 encoded 32-byte encryption key
  APP_ENC_KEY: ""
  # REDIS_PASSWORD — the bundled valkey runs with auth.enabled=false so nothing
  # authenticates with it; kept as an (empty) key for env parity. Set it when
  # valkey.auth (or an external Redis) is enabled.
  REDIS_PASSWORD: ""
  # Service Discovery — Consul ACL token. Empty for the ACL-less local dev Consul;
  # MANDATORY in any real environment with SD enabled. Inject from your secrets manager.
  SD_TOKEN: ""
  # CRM crypto — decryption keys for the crm datasource. OPTIONAL: only needed when a
  # crm datasource is configured; leave empty otherwise (empty = feature inactive).
  CRYPTO_HASH_SECRET_KEY_CRM: ""
  CRYPTO_ENCRYPT_SECRET_KEY_CRM: ""
  # Multi-Tenant secrets — emitted by lerian-common.multiTenant.secret ONLY when
  # common.multiTenant.enabled=true. MULTI_TENANT_SERVICE_API_KEY is then REQUIRED
  # (render fails if empty); MULTI_TENANT_REDIS_PASSWORD is optional. Left unset here
  # so a default (MT-off) install emits neither; set them when enabling multi-tenancy:
  #   --set secrets.MULTI_TENANT_SERVICE_API_KEY=<value>
  #   --set secrets.MULTI_TENANT_REDIS_PASSWORD=<value>   # optional
seaweedfs:
  enabled: true
  master:
    enabled: true
    replicas: 1
    extraArgs:
      - "master"
      - "-port=9333"
      - "-mdir=/data"
    service:
      type: ClusterIP
      ports:
        http: 9333
        ui: 9334
    # Persistent storage for the master node
    data:
      type: "persistentVolumeClaim"
      size: "5Gi"
      storageClass: null # Use cluster default or set a specific StorageClass
  volume:
    enabled: true
    replicas: 1
    extraArgs:
      - "volume"
      - "-port=9080"
      - "-mserver=seaweedfs-master:9333"
      - "-dir=/data"
      - "-max=0"
    service:
      type: ClusterIP
      ports:
        http: 9080
    # Persistent storage for volume servers
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        storageClass: null # Use default or specify your StorageClass
        maxVolumes: 0 # 0 = let SeaweedFS decide, or set a limit
  filer:
    enabled: true
    extraArgs:
      - "filer"
      - "-port=8888"
      - "-master=seaweedfs-master:9333"
    service:
      type: ClusterIP
      ports:
        http: 8888
    # Persistent storage for filer
    data:
      type: "persistentVolumeClaim"
      size: "25Gi"
      storageClass: null
  s3:
    enabled: true
    port: 8333
    grpcPort: 18333
    # Allow empty access key for development (disable auth)
    # In production, use Kubernetes secrets for credentials
    allowEmptyAccessKey: true
    # Enable path-style URLs (required for most S3 clients with non-AWS endpoints)
    enableAuth: false
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    logs:
      type: "emptyDir"
# KEDA configuration
keda:
  enabled: true
  # Set to true when using an externally installed KEDA operator (e.g., installed via separate helm chart)
  # When external is true, the chart will still create ScaledJob and TriggerAuthentication resources
  # but will not install the KEDA operator itself
  external: false
  # TriggerAuthentication configuration for RabbitMQ credentials
  triggerAuthentication:
    # -- Secret name containing RabbitMQ credentials (defaults to reporter-manager secret)
    secretName: ""
    # -- Key in secret for RabbitMQ username
    usernameKey: "RABBITMQ_DEFAULT_USER"
    # -- Key in secret for RabbitMQ password
    passwordKey: "RABBITMQ_DEFAULT_PASS"
  crds:
    install: true
  webhookCerts:
    generate: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  operator:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  webhooks:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  metricsApiServer:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
mongodb:
  # MongoDB’s flexibility and scalability make it the perfect choice for managing evolving and less structured data.
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/mongodb
    tag: "latest"
  external: false
  auth:
    enabled: true
    rootUser: reporter
    rootPassword: ""
  persistence:
    size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 512Mi
  resourcesPreset: small
  service:
    type: ClusterIP
    port: 27017
externalRabbitmqDefinitions:
  # -- Enable or disable the RabbitMQ bootstrap job
  enabled: false
  # -- RabbitMQ connection settings
  connection:
    # -- RabbitMQ protocol (http or https)
    protocol: "http"
    # -- RabbitMQ host (management API endpoint)
    host: "reporter-rabbitmq"
    # -- RabbitMQ HTTP management port
    port: "15672"
    # -- RabbitMQ AMQP port (for connectivity check)
    portAmqp: "5672"
  # -- Admin credentials for RabbitMQ management API
  rabbitmqAdminLogin:
    useExistingSecret:
      # -- Name of existing secret containing RABBITMQ_ADMIN_USER and RABBITMQ_ADMIN_PASS keys
      name: ""
    # -- Admin username (ignored if useExistingSecret.name is set)
    username: "midaz"
    # -- Admin password (ignored if useExistingSecret.name is set)
    password: ""
  # -- Credentials for the plugin application user created by the job
  appCredentials:
    useExistingSecret:
      # -- Name of existing secret containing RABBITMQ_DEFAULT_PASS key
      name: ""
    # -- Password for plugin user (ignored if useExistingSecret.name is set)
    pluginPassword: ""
rabbitmq:
  enabled: true
  image:
    tag: "3.13.6"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  # Single-source (Pattern B): the broker reads its credentials from the application
  # manager Secret (reporter-manager) instead of keeping its own copy. The RabbitMQ
  # password therefore lives in exactly one place — secrets.RABBITMQ_DEFAULT_PASS — and
  # the latent user mismatch (broker "midaz" vs app "plugin") is removed. Setting
  # existingSecret suppresses the inline cookie, so RABBITMQ_ERLANG_COOKIE is required
  # in the app Secret (see secrets + reporter.rabbitmqErlangCookieRequired).
  # If the manager Secret name is overridden (manager.name / manager.existingSecretName),
  # update authentication.existingSecret to match.
  # See docs/helm-chart-standard.md "Single-Source Infra Secrets".
  authentication:
    existingSecret: "reporter-manager"
    user:
      secretKey: RABBITMQ_DEFAULT_USER
    password:
      secretKey: RABBITMQ_DEFAULT_PASS
    erlangCookie:
      secretKey: RABBITMQ_ERLANG_COOKIE
  extraSecrets:
    - name: "reporter-manager-load-definitions"
      mountPath: /etc/rabbitmq/definitions
  customConfig: |
    management.load_definitions = /etc/rabbitmq/definitions/load_definition.json
valkey:
  # Redis is used to handle scenarios where real-time performance and fast data retrieval are essential.
  # This component is responsible for providing an in-memory data store
  # For more details, refer to the documentation:
  # https://docs.lerian.studio/docs/midaz-components#why-redis
  enabled: true
  auth:
    enabled: false
# ===========================================================================
# CONSUL (service-discovery backend) — OPTIONAL, DISABLED BY DEFAULT.
# Bundles a minimal single-node HashiCorp Consul server so the free / self-contained
# stack can run lib-service-discovery, mirroring the reporter infra compose's
# `reporter-consul` service. OFF by default (SD is opt-in) so an idle Consul does not
# run. Mirrors the midaz productization's bundled Vault: an upstream HashiCorp chart,
# condition-gated, with the Service name PINNED so the app's default SD_ADDRESS
# resolves with no extra wiring.
#
# To turn on a working self-contained SD stack:
#   --set consul.enabled=true \
#   --set common.serviceDiscovery.enabled=true
# The server Service renders as `reporter-consul-server` (from global.name below);
# `global.serviceDiscovery.address` defaults to `reporter-consul-server:8500` to match
# (analogous to compose's `reporter-consul:8500`). Dev posture: ACLs + TLS disabled and
# a single non-HA server, matching reporter's docs ("the local dev Consul runs ACL-less
# and plaintext on purpose"). For a real environment, front SD with an external Consul
# (leave consul.enabled=false, point global.serviceDiscovery.address at it, set SD_TLS
# + SD_TOKEN).
# ===========================================================================
consul:
  enabled: false
  global:
    # -- Pins the Consul resource names; the server Service becomes
    #    `reporter-consul-server` (matches global.serviceDiscovery.address default).
    name: reporter-consul
    datacenter: dc1
    # -- Dev posture: no TLS, no ACLs (local/self-contained only).
    tls:
      enabled: false
    acls:
      manageSystemACLs: false
    metrics:
      enabled: false
  server:
    # -- Single non-HA server for the self-contained dev stack.
    replicas: 1
    bootstrapExpect: 1
    # -- Small footprint (shares the node with mongo/rabbit/valkey/seaweedfs).
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  # -- No client DaemonSet: apps dial the server Service directly on :8500.
  client:
    enabled: false
  # -- No service mesh / sidecar injection (discovery-only).
  connectInject:
    enabled: false
  # -- No UI / DNS service in the minimal dev stack.
  ui:
    enabled: false
  dns:
    enabled: false
otel-collector-lerian:
  enabled: true
# -- AWS Authentication - IAM Roles Anywhere for non-AWS clusters (e.g. Clotilde/Proxmox)
aws:
  rolesAnywhere:
    enabled: false
    trustAnchorArn: ""
    profileArn: ""
    roleArn: ""
    region: "us-east-2"
    sessionDuration: 3600
    certificateSecretName: "reporter-iam-tls"
    sidecar:
      image:
        repository: public.ecr.aws/rolesanywhere/credential-helper
        tag: "latest-amd64"
        pullPolicy: IfNotPresent
      port: 9911
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
