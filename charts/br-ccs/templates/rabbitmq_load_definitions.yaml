{{- if .Values.rabbitmq.enabled }}
{{- /*
The bundled broker imports these definitions over the user the subchart creates,
so the br-ccs user carries the broker password here: without it the import
leaves a password-less user and the app's login is refused (403). The password
comes from values, never from the repo.

br-ccs binds its queues to sta.business.events at boot but never declares it
(br-sta owns it). A bundled broker has no br-sta, so the exchange is declared
here with the exact arguments br-sta declares it with (topic, durable,
alternate-exchange sta.business.dlq); a later br-sta declare then matches
instead of failing with PRECONDITION_FAILED.
*/}}
{{- $defs := .Files.Get "files/rabbitmq/load_definitions.json" | fromJson }}
{{- $password := required "rabbitmq.authentication.password.value is required when rabbitmq.enabled=true (the br-ccs broker user's password)" .Values.rabbitmq.authentication.password.value }}
{{- $users := list }}
{{- range $u := $defs.users }}
{{- $users = append $users (merge (dict "password" $password) $u) }}
{{- end }}
{{- $_ := set $defs "users" $users }}
{{- $staBusiness := dict "name" "sta.business.events" "vhost" "/" "type" "topic" "durable" true "auto_delete" false "internal" false "arguments" (dict "alternate-exchange" "sta.business.dlq") }}
{{- $_ := set $defs "exchanges" (append $defs.exchanges $staBusiness) }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "br-ccs.fullname" . }}-rabbitmq-load-definition
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-ccs.labels" (dict "context" . "component" "rabbitmq" "name" "load-definition") | nindent 4 }}
data:
  load_definition.json: {{ $defs | toJson | b64enc | quote }}
{{- end }}
