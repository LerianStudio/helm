{{- if and .Values.crm.enabled .Values.crm.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "midaz-crm.fullname" . }}
  labels:
    {{- include "midaz-crm.labels" (dict "context" . "name" .Values.crm.name ) | nindent 4 }}
  {{- with .Values.crm.pdb.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- /* Presence-based so an explicit 0 (maxUnavailable: 0 = block all disruptions,
     minAvailable: 0 = allow all) is honored; a PDB must carry exactly one of the two. */ -}}
  {{- if hasKey .Values.crm.pdb "maxUnavailable" }}
  maxUnavailable: {{ .Values.crm.pdb.maxUnavailable }}
  {{- else if hasKey .Values.crm.pdb "minAvailable" }}
  minAvailable: {{ .Values.crm.pdb.minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "midaz-crm.selectorLabels" (dict "context" . "name" .Values.crm.name) | nindent 6 }}
{{- end }}
