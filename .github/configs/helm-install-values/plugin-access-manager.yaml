# Since app 3.9.0 auth (and identity) refuse to boot without at least one
# organization ID:
#   Invalid configuration: at least one organization ID is required
# The chart defaults ORGANIZATION_IDS to "" (operator-provided), so the gate
# supplies the single-tenant value the internal environments use.
# Both images then refuse to boot without a license the gateway accepts
# (LCS-1007); both present the application "plugin-access-manager", so one CI
# license placeholder (README) serves the two.
# The HPAs keep auth at 3 x 500m and identity at 2 replicas, next to the bundled
# Postgres (1 vCPU) and Valkey on the single-node kind cluster: the third auth pod
# stayed Pending on "Insufficient cpu". One replica of each proves the gate.
auth:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
  secrets:
    ORGANIZATION_IDS: "global"
    LICENSE_KEY: "IT_LICENSE_KEY"
identity:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
  secrets:
    ORGANIZATION_IDS: "global"
    LICENSE_KEY: "IT_LICENSE_KEY"
caradhras:
  secrets:
    LICENSE_KEY: "IT_LICENSE_KEY_CARADHRAS"
