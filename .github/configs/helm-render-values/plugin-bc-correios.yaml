# Render-only fixture: ENV_NAME development skips the production checks on the PostgreSQL TLS mode
# and the CORS origins; the license and the streaming broker are required in every environment.
bc-correios:
  configmap:
    ENV_NAME: "development"
    LICENSE_KEY: "sample"
    STREAMING_BROKERS: "broker.example.com:9092"
  secrets:
    POSTGRES_PASSWORD: "sample"
    ENCRYPTION_KEY: "sample"
