# reporter — values-template.yaml (the operator fill-in surface)
#
# Documents every knob an operator sets, with safe defaults + empty credential
# placeholders. The minimal copy-and-run subset is values-quickstart.yaml; the
# full power-user API is values.yaml.
#
# STYLE (canonical, mirrors the midaz productized chart): the whole env-wide
# typed contract lives in ONE `global:` block, FIRST — set each dependency
# connection ONCE with its typed mask; the chart emits the app's native env keys
# from it. Do NOT scatter *_HOST keys into common.configmap when a mask exists,
# and do NOT keep `datastores:` as a sibling top-level block.

# --- The env-wide typed contract (dependency connections + cross-cutting) ------
global:
  # -- Dependency connections — typed masks (one knob per field). Point at your
  # infra here, or keep the bundled defaults and toggle <dep>.enabled below.
  datastores:
    broker: { host: "reporter-rabbitmq", port: "15672" }   # RabbitMQ management port
    redis:  { host: "reporter-valkey:6379" }
    mongo:  { host: "reporter-mongodb", port: "27017", user: "reporter" }
  # -- Object storage (S3/SeaweedFS) — non-secret fields via the mask (name
  # "reporter"); access keys go in `secrets`. (lerian-common >= 1.5.0.)
  objectStorage:
    reporter:
      endpoint: "http://seaweedfs-s3:8333"
      region: "us-east-1"
      bucket: "reporter-storage"
      usePathStyle: "true"
      disableSSL: "true"
  # -- OTel collector. Leave empty to keep telemetry off / the bundled endpoint;
  # per-service OTEL identity (library/service name) stays in common.configmap.
  observability: {}
    # enabled: "true"
    # otlpEndpoint: "otel-collector:4317"
    # deploymentEnvironment: "production"
  # -- plugin-access-manager auth, env-wide (per-component override via configmap).
  auth: {}
    # enabled: "true"
    # host: "http://plugin-access-manager-auth:4000"
  # -- Streaming backend (only when STREAMING_ENABLED=true; the worker needs it
  # for Fetcher job-event notifications since fetcher 2.0.0-beta.5).
  streaming: {}
    # brokers: "redpanda:9092"

# --- Component knobs -----------------------------------------------------------
manager:
  image:
    tag: ""                 # <- pin the application version
  ingress:
    enabled: false
    className: "nginx"
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
  useExistingSecret: false
  existingSecretName: ""
  clusterRole:
    create: true

worker:
  image:
    tag: ""
  useExistingSecret: false
  existingSecretName: ""

# --- App config shared by both components (passthrough; override via configmap) -
common:
  configmap:
    ENV_NAME: "development"
    # -- TLS enforcement bypass. "true" for bundled plaintext infra; NEVER prod=true.
    ALLOW_INSECURE_TLS: "true"

    # RabbitMQ — non-connection tuning (host/mgmt-port via global.datastores.broker)
    RABBITMQ_URI: "amqp"
    RABBITMQ_PORT_AMQP: "5672"
    RABBITMQ_NUMBERS_OF_WORKERS: "5"
    RABBITMQ_EXCHANGE: "reporter.generate-report.exchange"
    RABBITMQ_GENERATE_REPORT_QUEUE: "reporter.generate-report.queue"
    RABBITMQ_GENERATE_REPORT_KEY: "reporter.generate-report.key"

    # MongoDB — name/pool/params (host/port/user via global.datastores.mongo)
    MONGO_URI: "mongodb"
    MONGO_NAME: "reporter-db"
    MONGO_MAX_POOL_SIZE: "1000"
    MONGO_TLS_CA_CERT: ""
    MONGO_PARAMETERS: ""

    # OpenTelemetry — per-service identity (endpoint/enable via global.observability)
    OTEL_LIBRARY_NAME: "github.com/LerianStudio/plugin-template-engine"
    OTEL_RESOURCE_SERVICE_NAME: "reporter"

    # Multi-tenant — the gate (url/redis via global.multiTenant when enabled)
    MULTI_TENANT_ENABLED: "false"

    # Open datasources (DATASOURCE_<name>_*) — the report SOURCES reporter reads
    # from; deployment-named passthrough (not a mask). *_PASSWORD goes in `secrets`.
    DATASOURCE_ONBOARDING_CONFIG_NAME: "midaz_onboarding"
    DATASOURCE_ONBOARDING_HOST: "midaz-postgresql-replication.midaz.svc.cluster.local"
    DATASOURCE_ONBOARDING_PORT: "5432"
    DATASOURCE_ONBOARDING_USER: "midaz"
    DATASOURCE_ONBOARDING_DATABASE: "onboarding"
    DATASOURCE_ONBOARDING_TYPE: "postgresql"
    DATASOURCE_ONBOARDING_SSLMODE: "disable"

# --- Credentials — placeholders only (operator fills; never a concrete value) ---
secrets:
  RABBITMQ_DEFAULT_USER: "plugin"
  # Required (fail-fast guard) — operator fills before install.
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  # Required when rabbitmq.enabled=true (single-sourced to the broker); do not rotate.
  RABBITMQ_ERLANG_COOKIE: "CHANGE_ME"
  # Required (fail-fast) whenever the DATASOURCE_ONBOARDING_* source above is set:
  DATASOURCE_ONBOARDING_PASSWORD: "CHANGE_ME"
  # External S3 only (bundled SeaweedFS runs auth-less):
  OBJECT_STORAGE_ACCESS_KEY_ID: ""
  OBJECT_STORAGE_SECRET_KEY: ""
  # Fetcher integration — base64-encoded 32-byte encryption key:
  APP_ENC_KEY: ""

# --- Bundled dependencies (set enabled: false to use external infra) -----------
seaweedfs:
  enabled: true
mongodb:
  enabled: true
valkey:
  enabled: true
rabbitmq:
  enabled: true
keda:
  enabled: true
otel-collector-lerian:
  enabled: true

# -- Bootstrap job for external RabbitMQ (users/vhosts/permissions).
externalRabbitmqDefinitions:
  enabled: false
  connection:
    protocol: "http"
    host: "reporter-rabbitmq"
    port: "15672"
    portAmqp: "5672"
  rabbitmqAdminLogin:
    useExistingSecret:
      name: ""
    username: "midaz"
    password: ""
  appCredentials:
    useExistingSecret:
      name: ""
    pluginPassword: ""
