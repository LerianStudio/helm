# install-test.sh grants the GHCR pull secret to the namespace's default ServiceAccount
# only; the chart's own ServiceAccount would pull the private image anonymously (401).
# kind runs no Access Manager (its images need a license). The app accepts plugin auth
# off only when ENV_NAME is a development name, so the gate sets it.
bc-correios:
  serviceAccount:
    create: false
  configmap:
    PLUGIN_AUTH_ENABLED: "false"
    # The license is required in every environment; the placeholder keeps the config complete
    # (README). install-test.sh replaces it with the CI license.
    LICENSE_KEY: "IT_LICENSE_KEY"
