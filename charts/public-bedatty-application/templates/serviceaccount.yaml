{{- if and (index .Values "public-bedatty-application").enabled (index .Values "public-bedatty-application").serviceAccount.create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" (index .Values "public-bedatty-application").serviceAccount
      "name" (include "public-bedatty-application.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "public-bedatty-application.labels" (dict "context" . "component" (index .Values "public-bedatty-application").name "name" (index .Values "public-bedatty-application").name))
    ) }}
{{- end }}
