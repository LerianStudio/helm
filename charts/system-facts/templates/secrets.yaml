{{- if and (index .Values "system-facts").enabled (not (index .Values "system-facts").useExistingSecret) }}
{{/*
When a datastore subchart is bundled, its password lives in ITS OWN Secret and
is referenced directly by the Deployment (see boilerplate.infraSecretRef). Do
not copy it in here: a duplicate would silently go stale the moment the subchart
rotated or generated its own password.
*/}}
{{- $pg := .Values.postgresql | default dict -}}
{{- $pgAuth := $pg.auth | default dict -}}
{{- $pgInternal := and (ne (toString $pg.enabled) "false") (not $pg.external) -}}
{{- $vk := .Values.valkey | default dict -}}
{{- $vkAuth := $vk.auth | default dict -}}
{{- $vkInternal := and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "system-facts.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "system-facts.labels" (dict "context" . "component" (index .Values "system-facts").name "name" (index .Values "system-facts").name) | nindent 4 }}
type: Opaque
stringData:
  {{- $idpSecretKeys := include "lerian-common.idp.keys" (dict "kind" "secret") | fromJsonArray }}
  {{- range $key, $value := (index .Values "system-facts").secrets }}
  {{- if not (or (and $pgInternal (eq $key "POSTGRES_PASSWORD")) (and $vkInternal (eq $key "REDIS_PASSWORD")) (has $key $idpSecretKeys)) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- /* Permission declaration (RI) client pair — lerian-common.idp.secret, each
     key only when non-empty, so it is emitted once and never as an empty value. */}}
  {{- with (include "lerian-common.idp.secret" (dict "secrets" (index .Values "system-facts").secrets "mode" "stringData")) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
