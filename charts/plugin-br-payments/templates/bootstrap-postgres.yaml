{{- /*
Renders only when Postgres is genuinely external:
global.externalPostgresDefinitions.enabled=true AND the chart's own
"postgresql.enabled" helper (_helpers.tpl) resolves to "false".
externalPostgresDefinitions.enabled alone is not a reliable stand-in for
"external Postgres" — it is independent of postgresql.enabled/
postgresql.external, and the chart's own default is a BUNDLED Postgres
(postgresql.enabled: true, postgresql.external: false). Gating on
externalPostgresDefinitions.enabled alone let a caller leave
postgresql.enabled at its default true while also setting
externalPostgresDefinitions.enabled true, in which case this Job's psql
CREATE ROLE/CREATE DATABASE ran against a host that has nothing to do with
the bundled subchart's own Service — and raced the bundled StatefulSet
(an ordinary Sync-phase resource) with zero ordering guarantee against this
PreSync hook. The extra "postgresql.enabled" != "true" check (same helper
templates/configmap.yaml, templates/deployment.yaml, and
templates/controlplane-migrations.yaml already use to tell bundled from
external) closes that gap.

That helper-based check is still not sufficient on its own: it is an OR of
postgresql.enabled/postgresql.external, but Chart.yaml's dependency condition
(`condition: postgresql.enabled`) reads only the literal postgresql.enabled,
so postgresql.external=true with postgresql.enabled left at its default true
still renders the bundled subchart even though the helper above would call
that combination "external". plugin-br-payments.validatePostgresExclusivity
(_helpers.tpl) fails the whole render on that literal combination — checking
BOTH postgresql.external and global.externalPostgresDefinitions.enabled —
independently of this render gate, so this Job never races the bundled
StatefulSet no matter which of the two flags an operator sets.

DB_HOST/DB_PORT are read from app.configmap.POSTGRES_HOST/POSTGRES_PORT — the
SAME source templates/controlplane-migrations.yaml and templates/deployment.yaml
(via templates/configmap.yaml's envFrom) already use — NOT from
global.externalPostgresDefinitions.connection.host/.port. Those two Jobs used
to read from different sources: this one from connection.host/.port (whose
non-empty chart defaults name the BUNDLED subchart's own Service), the
migrations Job from app.configmap.POSTGRES_HOST/POSTGRES_PORT. Nothing forced
the two to agree, and the README's own "Production layout" instructions only
asked operators to keep them in sync by hand — if they diverged, this Job
provisioned the role/database on one server while the app and the migrations
Job connected to another, so the install/upgrade failed (or worse, silently
succeeded against the wrong host). Reading app.configmap.POSTGRES_HOST/
POSTGRES_PORT here instead removes the two-source class of bug entirely
rather than just detecting it: there is exactly one place that says which
Postgres this release talks to. Admin credentials (DB_USER_ADMIN/
DB_ADMIN_PASSWORD/DB_PASSWORD_PLUGIN_BR_PAYMENTS below) stay sourced from
global.externalPostgresDefinitions.postgresAdminLogin/.paymentsCredentials —
those are a genuinely separate concern (this Job provisions BEFORE the app's
own role/database exist, so it legitimately needs elevated credentials the
app itself never holds); only the connection endpoint is unified.
global.externalPostgresDefinitions.connection.host/.port remain in values.yaml
for backward compatibility but are no longer read by any template — see
values.yaml's comment on that field.
*/}}
{{- include "plugin-br-payments.validatePostgresExclusivity" . }}
{{- if and .Values.global.externalPostgresDefinitions.enabled (ne (include "postgresql.enabled" .) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "plugin-br-payments.fullname" . }}-bootstrap-postgres
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 4 }}
    app.kubernetes.io/component: bootstrap-postgres
  annotations:
    # PreSync hook at the FRONT of the chain (weight -10 / sync-wave -10):
    # creates the role+database BEFORE templates/controlplane-migrations.yaml
    # (-1) can run against them, and before the app rolls out. Idempotent —
    # only creates the role/db when absent — so re-running on every sync is
    # safe. Mirrors charts/streaming-hub's own bootstrap-postgres Job.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-10"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          env:
            - name: DB_HOST
              value: {{ .Values.app.configmap.POSTGRES_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.app.configmap.POSTGRES_PORT | quote }}
          command:
            - /bin/sh
            - -c
            - >
              TIMEOUT=300;
              ELAPSED=0;
              echo "Checking $DB_HOST:$DB_PORT...";
              while ! nc -z "$DB_HOST" "$DB_PORT"; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for $DB_HOST:$DB_PORT after ${TIMEOUT}s";
                  exit 1;
                fi;
                echo "$DB_HOST:$DB_PORT not ready, waiting (${ELAPSED}s/${TIMEOUT}s)";
                sleep 5;
                ELAPSED=$((ELAPSED + 5));
              done;
              echo "$DB_HOST:$DB_PORT is ready!";
      containers:
        - name: psql
          image: postgres:17
          env:
            - name: DB_HOST
              value: {{ .Values.app.configmap.POSTGRES_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.app.configmap.POSTGRES_PORT | quote }}
            - name: DB_USER_ADMIN
              {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
                  key: DB_USER_ADMIN
              {{- else }}
              value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.username | quote }}
              {{- end }}
            - name: DB_ADMIN_PASSWORD
              {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
                  key: DB_ADMIN_PASSWORD
              {{- else }}
              value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.password | quote }}
              {{- end }}
            - name: DB_PASSWORD_PLUGIN_BR_PAYMENTS
              {{- if .Values.global.externalPostgresDefinitions.paymentsCredentials.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.externalPostgresDefinitions.paymentsCredentials.useExistingSecret.name | quote }}
                  key: DB_PASSWORD_PLUGIN_BR_PAYMENTS
              {{- else }}
              value: {{ .Values.global.externalPostgresDefinitions.paymentsCredentials.password | quote }}
              {{- end }}
            - name: DB_DATABASE
              value: postgres
            - name: APP_DB
              value: plugin_br_payments
            - name: APP_ROLE
              value: plugin_br_payments
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              echo "=== plugin-br-payments PostgreSQL Bootstrap ==="
              echo "Host: $DB_HOST:$DB_PORT"
              echo ""

              echo "Checking existing PostgreSQL objects..."
              DB_EXISTS=0
              ROLE_EXISTS=0

              if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -v db="$APP_DB" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_database WHERE datname=:'db'" | grep -q 1; then
                DB_EXISTS=1
              fi
              if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -v role="$APP_ROLE" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_roles WHERE rolname=:'role'" | grep -q 1; then
                ROLE_EXISTS=1
              fi

              if [ "$DB_EXISTS" = "1" ] && [ "$ROLE_EXISTS" = "1" ]; then
                echo "Bootstrap already complete (database '$APP_DB' and role '$APP_ROLE' exist). Skipping creation."
              else
                if [ "$ROLE_EXISTS" = "1" ]; then
                  echo "Role '$APP_ROLE' already exists. Skipping creation."
                else
                  echo "Creating role '$APP_ROLE'..."
                  PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -v pw="$DB_PASSWORD_PLUGIN_BR_PAYMENTS" -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "CREATE ROLE plugin_br_payments LOGIN PASSWORD :'pw'"
                fi

                if [ "$DB_EXISTS" = "1" ]; then
                  echo "Database '$APP_DB' already exists. Skipping creation."
                else
                  echo "Creating database '$APP_DB'..."
                  PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "CREATE DATABASE plugin_br_payments OWNER plugin_br_payments"
                fi
              fi

              # Privileges (idempotent)
              echo "Ensuring privileges and schema permissions..."
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "GRANT ALL PRIVILEGES ON DATABASE plugin_br_payments TO plugin_br_payments"
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d plugin_br_payments -c "GRANT ALL ON SCHEMA public TO plugin_br_payments"
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d plugin_br_payments -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO plugin_br_payments"
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d plugin_br_payments -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO plugin_br_payments"
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d plugin_br_payments -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO plugin_br_payments"
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d plugin_br_payments -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO plugin_br_payments"

              echo ""
              echo "=== plugin-br-payments PostgreSQL Bootstrap completed successfully ==="
{{- end }}
