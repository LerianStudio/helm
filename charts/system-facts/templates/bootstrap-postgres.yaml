{{- if .Values.global.externalPostgresDefinitions.enabled }}
{{- $cred := .Values.global.externalPostgresDefinitions.boilerplateCredentials }}
{{- if and (not $cred.useExistingSecret.name) (not $cred.password) }}
{{- fail "system-facts: global.externalPostgresDefinitions.enabled=true needs the role password. Set global.externalPostgresDefinitions.boilerplateCredentials.password or .useExistingSecret.name (key DB_PASSWORD_BOILERPLATE); an empty value would create a role nobody can log in to." }}
{{- end }}
{{- /* The Job creates the fixed "system-facts" database and role. Refuse to render when the
       application resolves other names (same helpers as the ConfigMap), so the bootstrap can
       never report success for a database or role the application does not use. */}}
{{- $sf := index .Values "system-facts" }}
{{- $appUser := include "lerian-common.datastore.value" (dict "context" $ "configmap" $sf.configmap "type" "postgres" "field" "user" "nativeKey" "POSTGRES_USER" "default" "system-facts") }}
{{- $appDB := include "lerian-common.cfgValue" (dict "configmap" $sf.configmap "nativeKey" "POSTGRES_NAME" "params" $sf.database "field" "name" "default" "system-facts") }}
{{- if or (ne $appUser "system-facts") (ne $appDB "system-facts") }}
{{- fail (printf "system-facts: the bootstrap Job only creates the database and role \"system-facts\", but the application uses database %q and user %q. Keep both as \"system-facts\" or create them yourself and leave global.externalPostgresDefinitions.enabled=false." $appDB $appUser) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "system-facts.fullname" . }}-bootstrap-postgres
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "system-facts.labels" (dict "context" . "component" "bootstrap" "name" "postgres") | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    {{- with .Values.commonLabels }}
    metadata:
      labels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.37
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalPostgresDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalPostgresDefinitions.connection.port | quote }}
        command:
        - /bin/sh
        - -c
        - >
          TIMEOUT=300;
          ELAPSED=0;
          echo "Checking $DB_HOST:$DB_PORT...";
          while ! nc -z "$DB_HOST" "$DB_PORT"; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for $DB_HOST:$DB_PORT after ${TIMEOUT}s";
              exit 1;
            fi;
            echo "$DB_HOST:$DB_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
            sleep 5;
            ELAPSED=$((ELAPSED + 5));
          done;
          echo "$DB_HOST:$DB_PORT is ready!";
      containers:
      - name: psql
        image: postgres:17
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalPostgresDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalPostgresDefinitions.connection.port | quote }}
        - name: DB_USER_ADMIN
          {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
              key: DB_USER_ADMIN
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.username | quote }}
          {{- end }}
        - name: DB_ADMIN_PASSWORD
          {{- if .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.useExistingSecret.name | quote }}
              key: DB_ADMIN_PASSWORD
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.postgresAdminLogin.password | quote }}
          {{- end }}
        - name: DB_PASSWORD_BOILERPLATE
          {{- if .Values.global.externalPostgresDefinitions.boilerplateCredentials.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalPostgresDefinitions.boilerplateCredentials.useExistingSecret.name | quote }}
              key: DB_PASSWORD_BOILERPLATE
          {{- else }}
          value: {{ .Values.global.externalPostgresDefinitions.boilerplateCredentials.password | quote }}
          {{- end }}
        - name: DB_DATABASE
          value: postgres
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail
          # The template only sees the Secret name; an empty DB_PASSWORD_BOILERPLATE in it would
          # create a role with a NULL password, and later runs skip role creation.
          if [ -z "${DB_PASSWORD_BOILERPLATE:-}" ]; then
            echo "DB_PASSWORD_BOILERPLATE is empty: refusing to create the role 'system-facts' without a password." >&2
            exit 1
          fi
          echo "=== System Facts PostgreSQL Bootstrap ==="
          echo "Host: $DB_HOST:$DB_PORT"
          echo ""

          echo "Checking existing PostgreSQL objects..."
          DB_EXISTS=0
          ROLE_EXISTS=0

          if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_database WHERE datname='system-facts'" | grep -q 1; then
            DB_EXISTS=1
          fi
          if PGPASSWORD="$DB_ADMIN_PASSWORD" psql -At -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "SELECT 1 FROM pg_roles WHERE rolname='system-facts'" | grep -q 1; then
            ROLE_EXISTS=1
          fi

          if [ "$DB_EXISTS" = "1" ] && [ "$ROLE_EXISTS" = "1" ]; then
            echo "PostgreSQL bootstrap already complete (database 'system-facts' and role 'system-facts' exist). Skipping creation."
          else
            # Create role if not exists
            if [ "$ROLE_EXISTS" = "1" ]; then
              echo "Role 'system-facts' already exists. Skipping creation."
            else
              echo "Creating role 'system-facts'..."
              printf '%s\n' '\getenv pw DB_PASSWORD_BOILERPLATE' "CREATE ROLE \"system-facts\" LOGIN PASSWORD :'pw';" | PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE"
            fi

            # Create database if not exists
            if [ "$DB_EXISTS" = "1" ]; then
              echo "Database 'system-facts' already exists. Skipping creation."
            else
              echo "Creating database 'system-facts'..."
              PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "CREATE DATABASE \"system-facts\" OWNER \"system-facts\""
            fi
          fi

          # Privileges (safe to run repeatedly)
          echo "Ensuring privileges and schema permissions..."
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "ALTER USER \"system-facts\" CREATEDB" || true
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "$DB_DATABASE" -c "GRANT ALL PRIVILEGES ON DATABASE \"system-facts\" TO \"system-facts\""
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "system-facts" -c "GRANT ALL ON SCHEMA public TO \"system-facts\""
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "system-facts" -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"system-facts\""
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "system-facts" -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO \"system-facts\""
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "system-facts" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"system-facts\""
          PGPASSWORD="$DB_ADMIN_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER_ADMIN" -d "system-facts" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO \"system-facts\""

          echo ""
          echo "=== System Facts PostgreSQL Bootstrap completed successfully ==="
{{- end }}
