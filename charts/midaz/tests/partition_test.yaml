suite: ledger partition runner
templates:
  - templates/ledger/partition-cronjob.yaml
  - templates/ledger/partition-reconcile-job.yaml
  - templates/ledger/partition-build-cronjob.yaml
release:
  name: midaz
  namespace: midaz
tests:
  - it: renders neither workload on a 4.4 tag
    set:
      ledger.image.tag: 4.4.3
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ledger/partition-cronjob.yaml
      - hasDocuments:
          count: 0
        template: templates/ledger/partition-reconcile-job.yaml
  - it: renders both workloads on stable 4.5.x
    set:
      ledger.image.tag: 4.5.2
    asserts:
      - hasDocuments:
          count: 1
        template: templates/ledger/partition-cronjob.yaml
      - hasDocuments:
          count: 1
        template: templates/ledger/partition-reconcile-job.yaml
  - it: renders neither workload when disabled
    set:
      ledger.partition.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ledger/partition-cronjob.yaml
      - hasDocuments:
          count: 0
        template: templates/ledger/partition-reconcile-job.yaml
  - it: renders scheduled ensure and reconcile hook with existing identity
    set:
      ledger.partition.enabled: true
      ledger.image.tag: 4.5.0-beta.119
    asserts:
      - equal:
          path: metadata.name
          value: midaz-ledger-partition
        template: templates/ledger/partition-cronjob.yaml
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
        template: templates/ledger/partition-cronjob.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [ensure, --reconcile-indexes]
        template: templates/ledger/partition-cronjob.yaml
      - equal:
          path: spec.template.spec.containers[0].args
          value: [reconcile-indexes, --tolerate-unavailable]
        template: templates/ledger/partition-reconcile-job.yaml
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_TRANSACTION_PASSWORD
            valueFrom:
              secretKeyRef:
                name: midaz-postgresql
                key: password
        template: templates/ledger/partition-reconcile-job.yaml
  - it: inherits tenant settings and existing ledger secret
    set:
      ledger.partition.enabled: true
      ledger.useExistingSecret: true
      ledger.existingSecretName: ledger-credentials
      ledger.configmap.MULTI_TENANT_ENABLED: "true"
      ledger.configmap.MULTI_TENANT_URL: http://tenant-manager
      ledger.configmap.MULTI_TENANT_REDIS_HOST: valkey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: ledger-credentials
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MULTI_TENANT_ENABLED
            value: "true"
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MULTI_TENANT_URL
            value: http://tenant-manager
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: midaz-ledger
        template: templates/ledger/partition-reconcile-job.yaml
  - it: does not require a static transaction password for multi-tenant runners
    set:
      ledger.partition.enabled: true
      ledger.useExistingSecret: true
      ledger.existingSecretName: tenant-credentials
      ledger.configmap.MULTI_TENANT_ENABLED: "true"
      ledger.configmap.MULTI_TENANT_URL: http://tenant-manager
      ledger.configmap.MULTI_TENANT_REDIS_HOST: valkey
      postgresql.enabled: false
      postgresql.external: true
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name == "DB_TRANSACTION_PASSWORD")]
        template: templates/ledger/partition-cronjob.yaml
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "DB_TRANSACTION_PASSWORD")]
        template: templates/ledger/partition-reconcile-job.yaml
  - it: keeps the transaction host default when only onboarding is customized
    set:
      ledger.partition.enabled: true
      ledger.configmap.DB_ONBOARDING_HOST: onboarding.example
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DB_TRANSACTION_HOST
            value: midaz-postgresql-primary
        template: templates/ledger/partition-cronjob.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_TRANSACTION_HOST
            value: midaz-postgresql-primary
        template: templates/ledger/partition-reconcile-job.yaml
  - it: applies the CronJob in the last Argo CD wave
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/ledger/partition-cronjob.yaml
  - it: follows the highest hook or Deployment wave
    set:
      ledger.partition.reconcile.syncWave: "5"
      tracer.migrations.deploymentSyncWave: "7"
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "8"
        template: templates/ledger/partition-cronjob.yaml
  - it: bounds the name label of both ledger workloads under a 56-character nameOverride
    set:
      nameOverride: acme-banking-core-platform-production-eu1-sao-paulo-blue
      ledger.image.tag: 4.5.2
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: acme-banking-core-platform-3704cc2d-aulo-blue-ledger-partition
        template: templates/ledger/partition-cronjob.yaml
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/name"]
          value: acme-banking-core-platform-3704cc2d-aulo-blue-ledger-partition
        template: templates/ledger/partition-cronjob.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: acme-banking-core-platform-29f75ff9-ledger-partition-reconcile
        template: templates/ledger/partition-reconcile-job.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: acme-banking-core-platform-29f75ff9-ledger-partition-reconcile
        template: templates/ledger/partition-reconcile-job.yaml
  - it: bounds the index builds of the hook and the CronJob by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "2147483648"
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "60"
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "12884901888"
        template: templates/ledger/partition-cronjob.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "600"
        template: templates/ledger/partition-cronjob.yaml
  - it: keeps the bounds on an image older than the runner that reads them
    set:
      ledger.image.tag: 4.5.2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "2147483648"
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "600"
        template: templates/ledger/partition-cronjob.yaml
  - it: takes the bounds from values
    set:
      ledger.partition.maxBuildBytes: 21474836480
      ledger.partition.buildWindowSeconds: 1200
      ledger.partition.reconcile.maxBuildBytes: 10737418240
      ledger.partition.reconcile.buildWindowSeconds: 900
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "10737418240"
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "900"
        template: templates/ledger/partition-reconcile-job.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "21474836480"
        template: templates/ledger/partition-cronjob.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "1200"
        template: templates/ledger/partition-cronjob.yaml
  - it: renders a zero bound as "0"
    set:
      ledger.partition.maxBuildBytes: 0
      ledger.partition.reconcile.buildWindowSeconds: 0
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "0"
        template: templates/ledger/partition-cronjob.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "0"
        template: templates/ledger/partition-reconcile-job.yaml
  - it: refuses a negative bound
    set:
      ledger.partition.reconcile.maxBuildBytes: -1
    asserts:
      - failedTemplate:
          errorPattern: "ledger/partition/reconcile/maxBuildBytes.*minimum"
        template: templates/ledger/partition-reconcile-job.yaml
  - it: renders no build CronJob by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ledger/partition-build-cronjob.yaml
  - it: renders no build CronJob with the runner off
    set:
      ledger.partition.enabled: false
      ledger.partition.build.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ledger/partition-build-cronjob.yaml
  - it: renders a suspended unbounded build CronJob on demand
    set:
      ledger.partition.build.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: templates/ledger/partition-build-cronjob.yaml
      - isKind:
          of: CronJob
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: metadata.name
          value: midaz-ledger-partition-build
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.suspend
          value: true
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.schedule
          value: "0 6 * * *"
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 1
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 0
        template: templates/ledger/partition-build-cronjob.yaml
      - notExists:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.jobTemplate.spec.ttlSecondsAfterFinished
          value: 259200
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [reconcile-indexes]
        template: templates/ledger/partition-build-cronjob.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_MAX_BYTES
            value: "0"
        template: templates/ledger/partition-build-cronjob.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PARTITION_INDEX_BUILD_WINDOW_SECONDS
            value: "0"
        template: templates/ledger/partition-build-cronjob.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: midaz-ledger
        template: templates/ledger/partition-build-cronjob.yaml
  - it: sets the build deadline and retention from values
    set:
      ledger.partition.build.enabled: true
      ledger.partition.build.activeDeadlineSeconds: 86400
      ledger.partition.build.ttlSecondsAfterFinished: 3600
    asserts:
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 86400
        template: templates/ledger/partition-build-cronjob.yaml
      - equal:
          path: spec.jobTemplate.spec.ttlSecondsAfterFinished
          value: 3600
        template: templates/ledger/partition-build-cronjob.yaml
  - it: keeps the existing deadlines of the CronJob and the hook
    asserts:
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 1800
        template: templates/ledger/partition-cronjob.yaml
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1800
        template: templates/ledger/partition-reconcile-job.yaml
