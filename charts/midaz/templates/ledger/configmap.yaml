{{- if .Values.ledger.enabled }}
{{- $cm := .Values.ledger.configmap | default dict }}
{{- $dv := "lerian-common.datastore.value" }}
{{- $ded := .Values.ledger.datastores | default dict }}
{{- /* Single-sourced env name so ENV_NAME/OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT
   can't drift from one another; resolved once via global.env, consumed below
   both directly (ENV_NAME) and as the default for the observability block's
   own deploymentEnvironment field. */ -}}
{{- $envName := include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "env" "field" "name" "nativeKey" "ENV_NAME" "default" "production") }}
{{- /* RABBITMQ_PORT_HOST/RABBITMQ_PORT_AMQP are swapped from the generic broker
   mask vocabulary in THIS chart specifically (PORT_HOST=5672 is actually the
   real AMQP transport port, PORT_AMQP=15672 is actually the management API
   port) — native key names stay unchanged; mapped to the cloud/mask fields by
   VALUE (amqpPort=true AMQP port, port=management port), not by name, so a
   `global.cloud` preset (aws: amqpPort=5671, port=443) still lands on the
   right rendered key. */ -}}
{{- $rabbitHost := include $dv (dict "context" $ "dedicated" $ded "configmap" $cm "type" "broker" "field" "host" "nativeKey" "RABBITMQ_HOST" "default" "midaz-rabbitmq") }}
{{- $rabbitPort := include $dv (dict "context" $ "dedicated" $ded "configmap" $cm "type" "broker" "field" "amqpPort" "nativeKey" "RABBITMQ_PORT_HOST" "default" "5672") }}
{{- $rabbitProtocol := $cm.RABBITMQ_PROTOCOL | default "http" }}
{{- $rabbitAmqpPort := include $dv (dict "context" $ "dedicated" $ded "configmap" $cm "type" "broker" "field" "port" "nativeKey" "RABBITMQ_PORT_AMQP" "default" "15672") }}

{{- $rabbitHealthCheckURL := "" }}

{{- if eq $rabbitProtocol "http" }}
  {{- $rabbitHealthCheckURL = printf "%s://%s:%s" $rabbitProtocol $rabbitHost $rabbitAmqpPort }}
{{- else if eq $rabbitProtocol "https" }}
  {{- $rabbitHealthCheckURL = printf "%s://%s" $rabbitProtocol $rabbitHost }}
{{- end }}

kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "midaz-ledger.fullname" . }}
data:
  # =============================================================================
  # APP CONFIGURATION
  # =============================================================================
  ALLOW_INSECURE_TLS: {{ $cm.ALLOW_INSECURE_TLS | default "true" | quote }}
  ENV_NAME: {{ $envName | quote }}
  VERSION: {{ .Values.ledger.image.tag | default .Chart.AppVersion | quote }}
  DEPLOYMENT_MODE: {{ $cm.DEPLOYMENT_MODE | default "local" | quote }}
  LOG_LEVEL: {{ $cm.LOG_LEVEL | default "debug" | quote }}

  SERVER_PORT: {{ $cm.SERVER_PORT | default "3002" | quote }}
  SERVER_ADDRESS: {{ $cm.SERVER_ADDRESS | default ":3002" | quote }}

  # =============================================================================
  # SWAGGER
  # =============================================================================
  SWAGGER_TITLE: {{ $cm.SWAGGER_TITLE | default "" | quote }}
  SWAGGER_DESCRIPTION: {{ $cm.SWAGGER_DESCRIPTION | default "" | quote }}
  SWAGGER_VERSION: {{ $cm.SWAGGER_VERSION | default (.Values.ledger.image.tag | default .Chart.AppVersion) | quote }}
  SWAGGER_HOST: {{ $cm.SWAGGER_HOST | default "" | quote }}
  SWAGGER_BASE_PATH: {{ $cm.SWAGGER_BASE_PATH | default "" | quote }}
  SWAGGER_SCHEMES: {{ $cm.SWAGGER_SCHEMES | default "" | quote }}
  SWAGGER_LEFT_DELIM: {{ $cm.SWAGGER_LEFT_DELIM | default "" | quote }}
  SWAGGER_RIGHT_DELIM: {{ $cm.SWAGGER_RIGHT_DELIM | default "" | quote }}

  # =============================================================================
  # AUTH CONFIGS (shared) — via lerian-common.auth.env (global.auth contract)
  # =============================================================================
  {{- include "lerian-common.auth.env" (dict "context" $ "configmap" $cm "hostKey" "PLUGIN_AUTH_HOST") | nindent 2 }}

  # =============================================================================
  # MULTI-TENANT — knob inline; gated block via lerian-common.multiTenant.env
  # (URL + redis host come from global.multiTenant or configmap.MULTI_TENANT_*)
  # =============================================================================
  {{- $mtEnabled := eq (include "midaz.isTrue" ($cm.MULTI_TENANT_ENABLED | default "false")) "true" }}
  MULTI_TENANT_ENABLED: {{ $cm.MULTI_TENANT_ENABLED | default "false" | quote }}
  {{- include "lerian-common.multiTenant.env" (dict
        "context" $
        "configmap" $cm
        "enabled" $mtEnabled
        "serviceName" "ledger"
        "emitRedis" true
        "requiredUrl" true
        "requiredRedisHost" true) | nindent 2 }}

  # =============================================================================
  # ACCOUNTING CONFIG
  # =============================================================================
  ACCOUNT_TYPE_VALIDATION: {{ $cm.ACCOUNT_TYPE_VALIDATION | default "" | quote }}
  TRANSACTION_ROUTE_VALIDATION: {{ $cm.TRANSACTION_ROUTE_VALIDATION | default "" | quote }}

  # =============================================================================
  # DB POSTGRESQL - ONBOARDING MODULE (host/user/port/ssl/replicaHost via datastore mask)
  # =============================================================================
  # Primary
  DB_ONBOARDING_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "host" "nativeKey" "DB_ONBOARDING_HOST" "default" "midaz-postgresql-primary") | quote }}
  DB_ONBOARDING_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "user" "nativeKey" "DB_ONBOARDING_USER" "default" "midaz") | quote }}
  DB_ONBOARDING_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "name" "nativeKey" "DB_ONBOARDING_NAME" "default" "onboarding") | quote }}
  DB_ONBOARDING_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "port" "nativeKey" "DB_ONBOARDING_PORT" "default" "5432") | quote }}
  # ssl is a TOPOLOGY field (TLS requirement), not a per-module identity field —
  # resolved through the generic "postgres" type (not "postgresOnboarding") so a
  # global.cloud preset (e.g. aws: ssl=require) and a plain global.datastores.
  # postgres.ssl both reach it; onboarding/transaction share one physical
  # Postgres engine in the overwhelming majority of real deployments.
  DB_ONBOARDING_SSLMODE: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgres" "field" "ssl" "nativeKey" "DB_ONBOARDING_SSLMODE" "default" "disable") | quote }}
  # Replica
  DB_ONBOARDING_REPLICA_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "replicaHost" "nativeKey" "DB_ONBOARDING_REPLICA_HOST" "default" "midaz-postgresql-replication") | quote }}
  DB_ONBOARDING_REPLICA_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "user" "nativeKey" "DB_ONBOARDING_REPLICA_USER" "default" "midaz") | quote }}
  DB_ONBOARDING_REPLICA_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "name" "nativeKey" "DB_ONBOARDING_REPLICA_NAME" "default" "onboarding") | quote }}
  DB_ONBOARDING_REPLICA_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresOnboarding" "field" "port" "nativeKey" "DB_ONBOARDING_REPLICA_PORT" "default" "5432") | quote }}
  DB_ONBOARDING_REPLICA_SSLMODE: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgres" "field" "ssl" "nativeKey" "DB_ONBOARDING_REPLICA_SSLMODE" "default" "disable") | quote }}
  # Connection pool
  DB_ONBOARDING_MAX_OPEN_CONNS: {{ $cm.DB_ONBOARDING_MAX_OPEN_CONNS | default "3000" | quote }}
  DB_ONBOARDING_MAX_IDLE_CONNS: {{ $cm.DB_ONBOARDING_MAX_IDLE_CONNS | default "3000" | quote }}

  # =============================================================================
  # MONGO DB - ONBOARDING MODULE (host/user/port via datastore mask)
  # =============================================================================
  MONGO_ONBOARDING_URI: {{ $cm.MONGO_ONBOARDING_URI | default "mongodb" | quote }}
  MONGO_ONBOARDING_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoOnboarding" "field" "host" "nativeKey" "MONGO_ONBOARDING_HOST" "default" "midaz-mongodb") | quote }}
  MONGO_ONBOARDING_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoOnboarding" "field" "name" "nativeKey" "MONGO_ONBOARDING_NAME" "default" "onboarding") | quote }}
  MONGO_ONBOARDING_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoOnboarding" "field" "user" "nativeKey" "MONGO_ONBOARDING_USER" "default" "midaz") | quote }}
  MONGO_ONBOARDING_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoOnboarding" "field" "port" "nativeKey" "MONGO_ONBOARDING_PORT" "default" "27017") | quote }}
  MONGO_ONBOARDING_MAX_POOL_SIZE: {{ $cm.MONGO_ONBOARDING_MAX_POOL_SIZE | default "1000" | quote }}
  # params is a TOPOLOGY field (connection-string flags, e.g. DocumentDB's
  # tls/tlsInsecure/directConnection/retryWrites) — resolved through the generic
  # "mongo" type so a global.cloud preset reaches it uniformly across every
  # Mongo-backed module.
  MONGO_ONBOARDING_PARAMETERS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongo" "field" "params" "nativeKey" "MONGO_ONBOARDING_PARAMETERS" "default" "") | quote }}
  MONGO_ONBOARDING_TLS_CA_CERT: {{ $cm.MONGO_ONBOARDING_TLS_CA_CERT | default "" | quote }}

  # =============================================================================
  # DB POSTGRESQL - TRANSACTION MODULE (host/user/port/ssl/replicaHost via datastore mask)
  # =============================================================================
  # Primary
  DB_TRANSACTION_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "host" "nativeKey" "DB_TRANSACTION_HOST" "default" "midaz-postgresql-primary") | quote }}
  DB_TRANSACTION_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "user" "nativeKey" "DB_TRANSACTION_USER" "default" "midaz") | quote }}
  DB_TRANSACTION_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "name" "nativeKey" "DB_TRANSACTION_NAME" "default" "transaction") | quote }}
  DB_TRANSACTION_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "port" "nativeKey" "DB_TRANSACTION_PORT" "default" "5432") | quote }}
  DB_TRANSACTION_SSLMODE: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgres" "field" "ssl" "nativeKey" "DB_TRANSACTION_SSLMODE" "default" "disable") | quote }}
  # Replica
  DB_TRANSACTION_REPLICA_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "replicaHost" "nativeKey" "DB_TRANSACTION_REPLICA_HOST" "default" "midaz-postgresql-replication") | quote }}
  DB_TRANSACTION_REPLICA_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "user" "nativeKey" "DB_TRANSACTION_REPLICA_USER" "default" "midaz") | quote }}
  DB_TRANSACTION_REPLICA_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "name" "nativeKey" "DB_TRANSACTION_REPLICA_NAME" "default" "transaction") | quote }}
  DB_TRANSACTION_REPLICA_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgresTransaction" "field" "port" "nativeKey" "DB_TRANSACTION_REPLICA_PORT" "default" "5432") | quote }}
  DB_TRANSACTION_REPLICA_SSLMODE: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "postgres" "field" "ssl" "nativeKey" "DB_TRANSACTION_REPLICA_SSLMODE" "default" "disable") | quote }}
  # Connection pool
  DB_TRANSACTION_MAX_OPEN_CONNS: {{ $cm.DB_TRANSACTION_MAX_OPEN_CONNS | default "3000" | quote }}
  DB_TRANSACTION_MAX_IDLE_CONNS: {{ $cm.DB_TRANSACTION_MAX_IDLE_CONNS | default "3000" | quote }}

  # =============================================================================
  # MONGO DB - TRANSACTION MODULE (host/user/port via datastore mask)
  # =============================================================================
  MONGO_TRANSACTION_URI: {{ $cm.MONGO_TRANSACTION_URI | default "mongodb" | quote }}
  MONGO_TRANSACTION_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoTransaction" "field" "host" "nativeKey" "MONGO_TRANSACTION_HOST" "default" "midaz-mongodb") | quote }}
  MONGO_TRANSACTION_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoTransaction" "field" "name" "nativeKey" "MONGO_TRANSACTION_NAME" "default" "transaction") | quote }}
  MONGO_TRANSACTION_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoTransaction" "field" "user" "nativeKey" "MONGO_TRANSACTION_USER" "default" "midaz") | quote }}
  MONGO_TRANSACTION_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoTransaction" "field" "port" "nativeKey" "MONGO_TRANSACTION_PORT" "default" "27017") | quote }}
  MONGO_TRANSACTION_MAX_POOL_SIZE: {{ $cm.MONGO_TRANSACTION_MAX_POOL_SIZE | default "1000" | quote }}
  MONGO_TRANSACTION_PARAMETERS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongo" "field" "params" "nativeKey" "MONGO_TRANSACTION_PARAMETERS" "default" "") | quote }}
  MONGO_TRANSACTION_TLS_CA_CERT: {{ $cm.MONGO_TRANSACTION_TLS_CA_CERT | default "" | quote }}

  # =============================================================================
  # MONGO DB - CRM MODULE (folded into the unified ledger binary; host/user/port via mask)
  # =============================================================================
  MONGO_CRM_URI: {{ $cm.MONGO_CRM_URI | default "mongodb" | quote }}
  MONGO_CRM_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoCrm" "field" "host" "nativeKey" "MONGO_CRM_HOST" "default" "midaz-mongodb") | quote }}
  MONGO_CRM_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoCrm" "field" "name" "nativeKey" "MONGO_CRM_NAME" "default" "crm") | quote }}
  MONGO_CRM_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoCrm" "field" "user" "nativeKey" "MONGO_CRM_USER" "default" "midaz") | quote }}
  MONGO_CRM_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoCrm" "field" "port" "nativeKey" "MONGO_CRM_PORT" "default" "27017") | quote }}
  # MONGO_CRM_PASSWORD lives in the ledger Secret (see templates/ledger/secrets.yaml)
  MONGO_CRM_MAX_POOL_SIZE: {{ $cm.MONGO_CRM_MAX_POOL_SIZE | default "1000" | quote }}
  MONGO_CRM_PARAMETERS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongo" "field" "params" "nativeKey" "MONGO_CRM_PARAMETERS" "default" "") | quote }}
  MONGO_CRM_TLS_CA_CERT: {{ $cm.MONGO_CRM_TLS_CA_CERT | default "" | quote }}

  # =============================================================================
  # MONGO DB - FEES MODULE (folded into the unified ledger binary; host/user/port via mask)
  # =============================================================================
  MONGO_FEES_URI: {{ $cm.MONGO_FEES_URI | default "mongodb" | quote }}
  MONGO_FEES_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoFees" "field" "host" "nativeKey" "MONGO_FEES_HOST" "default" "midaz-mongodb") | quote }}
  MONGO_FEES_NAME: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoFees" "field" "name" "nativeKey" "MONGO_FEES_NAME" "default" "fees") | quote }}
  MONGO_FEES_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoFees" "field" "user" "nativeKey" "MONGO_FEES_USER" "default" "midaz") | quote }}
  MONGO_FEES_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongoFees" "field" "port" "nativeKey" "MONGO_FEES_PORT" "default" "27017") | quote }}
  # MONGO_FEES_PASSWORD lives in the ledger Secret (see templates/ledger/secrets.yaml)
  MONGO_FEES_MAX_POOL_SIZE: {{ $cm.MONGO_FEES_MAX_POOL_SIZE | default "100" | quote }}
  MONGO_FEES_PARAMETERS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "mongo" "field" "params" "nativeKey" "MONGO_FEES_PARAMETERS" "default" "") | quote }}
  MONGO_FEES_TLS_CA_CERT: {{ $cm.MONGO_FEES_TLS_CA_CERT | default "" | quote }}

  # =============================================================================
  # LCRYPTO — key material lives in the ledger Secret, never here.
  # LCRYPTO_HASH_SECRET_KEY and LCRYPTO_ENCRYPT_SECRET_KEY protect CRM holder
  # fields (PII); see templates/ledger/secrets.yaml.
  # =============================================================================

  # =============================================================================
  # KMS (encryption vendor selector; see midaz pkg/crypto/resolver.go)
  # KMS_VAULT_SECRET_ID is the AppRole credential and lives in the Secret.
  # =============================================================================
  KMS_VENDOR: {{ $cm.KMS_VENDOR | default "none" | quote }}
  # Vault fields required only when KMS_VENDOR=hashicorp-vault (envelope encryption)
  {{- if eq ($cm.KMS_VENDOR | default "none") "hashicorp-vault" }}
  KMS_VAULT_ADDR: {{ required "ledger.configmap.KMS_VAULT_ADDR is required when KMS_VENDOR=hashicorp-vault" $cm.KMS_VAULT_ADDR | quote }}
  KMS_VAULT_ROLE_ID: {{ required "ledger.configmap.KMS_VAULT_ROLE_ID is required when KMS_VENDOR=hashicorp-vault" $cm.KMS_VAULT_ROLE_ID | quote }}
  KMS_VAULT_AUTH_METHOD: {{ required "ledger.configmap.KMS_VAULT_AUTH_METHOD is required when KMS_VENDOR=hashicorp-vault" $cm.KMS_VAULT_AUTH_METHOD | quote }}
  {{- else }}
  KMS_VAULT_ADDR: {{ $cm.KMS_VAULT_ADDR | default "" | quote }}
  KMS_VAULT_ROLE_ID: {{ $cm.KMS_VAULT_ROLE_ID | default "" | quote }}
  KMS_VAULT_AUTH_METHOD: {{ $cm.KMS_VAULT_AUTH_METHOD | default "" | quote }}
  {{- end }}

  # =============================================================================
  # TRACER RESERVATION SEAM (ledger -> tracer client side)
  # TRACER_BASE_URL empty disables the integration (nil reserver).
  # =============================================================================
  TRACER_BASE_URL: {{ $cm.TRACER_BASE_URL | default "" | quote }}
  {{- /* The seam accepts "grpc" or "rest". The bundled tracer only serves gRPC
         when TRACER_GRPC_PORT is set, so selecting grpc against an in-chart
         tracer that has it unset would dial a port nothing listens on. */ -}}
  {{- $tracerTransport := $cm.TRACER_TRANSPORT | default "rest" }}
  {{- if and $cm.TRACER_BASE_URL (eq (lower $tracerTransport) "grpc") .Values.tracer.enabled (not .Values.tracer.configmap.TRACER_GRPC_PORT) }}
  {{- fail "ledger.configmap.TRACER_TRANSPORT=grpc requires tracer.configmap.TRACER_GRPC_PORT to be set: the bundled tracer keeps its gRPC seam off and its Service exposes only HTTP. Set the port, or use TRACER_TRANSPORT=rest" }}
  {{- end }}
  TRACER_TRANSPORT: {{ $tracerTransport | quote }}
  TRACER_TLS_MODE: {{ $cm.TRACER_TLS_MODE | default "" | quote }}
  TRACER_TIMEOUT_MS: {{ $cm.TRACER_TIMEOUT_MS | default "250" | quote }}
  TRACER_TLS_CERT_FILE: {{ $cm.TRACER_TLS_CERT_FILE | default "" | quote }}
  TRACER_TLS_KEY_FILE: {{ $cm.TRACER_TLS_KEY_FILE | default "" | quote }}
  TRACER_TLS_CA_FILE: {{ $cm.TRACER_TLS_CA_FILE | default "" | quote }}

  # =============================================================================
  # REDIS (shared between modules; host via datastore mask, tuning via passthrough)
  # =============================================================================
  {{- /* REDIS_HOST is historically a single combined "host:port" native key — an
     explicit native override is used verbatim (it already carries its own port).
     Otherwise host/port are resolved independently through the mask (so
     global.datastores.redis.port / a dedicated ledger.datastores.redis.port
     actually take effect, instead of being silently ignored behind a
     host-only default) and combined here. */ -}}
  {{- $redisHostField := include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "redis" "field" "host" "nativeKey" "REDIS_HOST" "default" "midaz-valkey-primary") }}
  {{- $redisPortField := include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "redis" "field" "port" "nativeKey" "REDIS_PORT" "default" "6379") }}
  {{- $redisHost := $redisHostField }}
  {{- if not (hasKey $cm "REDIS_HOST") }}
    {{- $redisHost = printf "%s:%s" $redisHostField $redisPortField }}
  {{- end }}
  REDIS_HOST: {{ $redisHost | quote }}
  REDIS_MASTER_NAME: {{ $cm.REDIS_MASTER_NAME | default "" | quote }}
  REDIS_TLS: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "redis" "field" "tls" "nativeKey" "REDIS_TLS" "default" "false") | quote }}
  REDIS_CA_CERT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "redis" "field" "caCert" "nativeKey" "REDIS_CA_CERT" "default" "") | quote }}
  REDIS_USE_GCP_IAM: {{ $cm.REDIS_USE_GCP_IAM | default "false" | quote }}
  REDIS_SERVICE_ACCOUNT: {{ $cm.REDIS_SERVICE_ACCOUNT | default "" | quote }}
  GOOGLE_APPLICATION_CREDENTIALS: {{ $cm.GOOGLE_APPLICATION_CREDENTIALS | default "" | quote }}
  REDIS_TOKEN_LIFETIME: {{ $cm.REDIS_TOKEN_LIFETIME | default "60" | quote }}
  REDIS_TOKEN_REFRESH_DURATION: {{ $cm.REDIS_TOKEN_REFRESH_DURATION | default "45" | quote }}
  REDIS_DB: {{ $cm.REDIS_DB | default "0" | quote }}
  REDIS_PROTOCOL: {{ $cm.REDIS_PROTOCOL | default "3" | quote }}
  REDIS_POOL_SIZE: {{ $cm.REDIS_POOL_SIZE | default "10" | quote }}
  REDIS_MIN_IDLE_CONNS: {{ $cm.REDIS_MIN_IDLE_CONNS | default "0" | quote }}
  REDIS_READ_TIMEOUT: {{ $cm.REDIS_READ_TIMEOUT | default "3" | quote }}
  REDIS_WRITE_TIMEOUT: {{ $cm.REDIS_WRITE_TIMEOUT | default "3" | quote }}
  REDIS_DIAL_TIMEOUT: {{ $cm.REDIS_DIAL_TIMEOUT | default "5" | quote }}
  REDIS_POOL_TIMEOUT: {{ $cm.REDIS_POOL_TIMEOUT | default "2" | quote }}
  REDIS_MAX_RETRIES: {{ $cm.REDIS_MAX_RETRIES | default "3" | quote }}
  REDIS_MIN_RETRY_BACKOFF: {{ $cm.REDIS_MIN_RETRY_BACKOFF | default "8" | quote }}
  REDIS_MAX_RETRY_BACKOFF: {{ $cm.REDIS_MAX_RETRY_BACKOFF | default "1" | quote }}

  # =============================================================================
  # OPEN TELEMETRY (identity inline; shared endpoint/env/enable via global.observability)
  # =============================================================================
  OTEL_RESOURCE_SERVICE_NAME: {{ $cm.OTEL_RESOURCE_SERVICE_NAME | default "ledger" | quote }}
  OTEL_LIBRARY_NAME: {{ $cm.OTEL_LIBRARY_NAME | default "github.com/LerianStudio/midaz/v4/components/ledger" | quote }}
  OTEL_RESOURCE_SERVICE_VERSION: {{ .Values.ledger.image.tag | default .Chart.AppVersion | quote }}
  OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "observability" "field" "deploymentEnvironment" "nativeKey" "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" "default" $envName) | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT_PORT: {{ $cm.OTEL_EXPORTER_OTLP_ENDPOINT_PORT | default "4317" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "observability" "field" "otlpEndpoint" "nativeKey" "OTEL_EXPORTER_OTLP_ENDPOINT" "default" "midaz-grafana:4317") | quote }}
  # Mask fallback default is "false" — matching ledger's true historical
  # default before this chart was productized. This component ships with
  # telemetry ON by default (see ledger.configmap.ENABLE_TELEMETRY="true" in
  # values.yaml), which still wins as the native key; only the MASK's OWN
  # fallback (reached when neither a native key nor global.observability.enabled
  # is set) must not silently default to "true" underneath an operator who
  # never opted in.
  ENABLE_TELEMETRY: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "observability" "field" "enabled" "nativeKey" "ENABLE_TELEMETRY" "default" "false") | quote }}

  # =============================================================================
  # RABBITMQ (used by transaction module; host via datastore mask)
  # =============================================================================
  RABBITMQ_URI: {{ include $dv (dict "context" $ "dedicated" $ded "configmap" $cm "type" "broker" "field" "scheme" "nativeKey" "RABBITMQ_URI" "default" "amqp") | quote }}
  RABBITMQ_PROTOCOL: {{ $rabbitProtocol | quote }}
  RABBITMQ_HOST: {{ $rabbitHost | quote }}
  RABBITMQ_PORT_HOST: {{ $rabbitPort | quote }}
  RABBITMQ_PORT_AMQP: {{ $rabbitAmqpPort | quote }}
  RABBITMQ_DEFAULT_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" .Values.ledger.datastores "configmap" $cm "type" "broker" "field" "user" "nativeKey" "RABBITMQ_DEFAULT_USER" "default" "transaction") | quote }}
  RABBITMQ_CONSUMER_USER: {{ $cm.RABBITMQ_CONSUMER_USER | default "consumer" | quote }}
  RABBITMQ_NUMBERS_OF_WORKERS: {{ $cm.RABBITMQ_NUMBERS_OF_WORKERS | default "5" | quote }}
  RABBITMQ_NUMBERS_OF_PREFETCH: {{ $cm.RABBITMQ_NUMBERS_OF_PREFETCH | default "10" | quote }}
  RABBITMQ_HEALTH_CHECK_URL: {{ $cm.RABBITMQ_HEALTH_CHECK_URL | default $rabbitHealthCheckURL | quote }}
  RABBITMQ_BALANCE_CREATE_QUEUE: {{ $cm.RABBITMQ_BALANCE_CREATE_QUEUE | default "transaction.balance_create.queue" | quote }}
  RABBITMQ_TRANSACTION_BALANCE_OPERATION_EXCHANGE: {{ $cm.RABBITMQ_TRANSACTION_BALANCE_OPERATION_EXCHANGE | default "transaction.transaction_balance_operation.exchange" | quote }}
  RABBITMQ_TRANSACTION_BALANCE_OPERATION_KEY: {{ $cm.RABBITMQ_TRANSACTION_BALANCE_OPERATION_KEY | default "transaction.transaction_balance_operation.key" | quote }}
  RABBITMQ_TRANSACTION_BALANCE_OPERATION_QUEUE: {{ $cm.RABBITMQ_TRANSACTION_BALANCE_OPERATION_QUEUE | default "transaction.transaction_balance_operation.queue" | quote }}
  RABBITMQ_TRANSACTION_ASYNC: {{ $cm.RABBITMQ_TRANSACTION_ASYNC | default "false" | quote }}
  RABBITMQ_VHOST: {{ $cm.RABBITMQ_VHOST | default "" | quote }}

  # =============================================================================
  # RABBITMQ CIRCUIT BREAKER
  # =============================================================================
  RABBITMQ_CIRCUIT_BREAKER_CONSECUTIVE_FAILURES: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_CONSECUTIVE_FAILURES | default "15" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_FAILURE_RATIO: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_FAILURE_RATIO | default "50" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_INTERVAL: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_INTERVAL | default "120" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_MAX_REQUESTS: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_MAX_REQUESTS | default "3" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_MIN_REQUESTS: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_MIN_REQUESTS | default "10" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_TIMEOUT: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_TIMEOUT | default "30" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_HEALTH_CHECK_INTERVAL: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_HEALTH_CHECK_INTERVAL | default "30" | quote }}
  RABBITMQ_CIRCUIT_BREAKER_HEALTH_CHECK_TIMEOUT: {{ $cm.RABBITMQ_CIRCUIT_BREAKER_HEALTH_CHECK_TIMEOUT | default "10" | quote }}
  RABBITMQ_OPERATION_TIMEOUT: {{ $cm.RABBITMQ_OPERATION_TIMEOUT | default "30s" | quote }}

  # =============================================================================
  # BULK RECORDER
  # =============================================================================
  BULK_RECORDER_ENABLED: {{ $cm.BULK_RECORDER_ENABLED | default "true" | quote }}
  BULK_RECORDER_SIZE: {{ $cm.BULK_RECORDER_SIZE | default "0" | quote }}
  BULK_RECORDER_FLUSH_TIMEOUT_MS: {{ $cm.BULK_RECORDER_FLUSH_TIMEOUT_MS | default "100" | quote }}
  BULK_RECORDER_MAX_ROWS_PER_INSERT: {{ $cm.BULK_RECORDER_MAX_ROWS_PER_INSERT | default "1000" | quote }}

  # TRANSACTION EXCHANGE EVENTS
  RABBITMQ_TRANSACTION_EVENTS_ENABLED: {{ $cm.RABBITMQ_TRANSACTION_EVENTS_ENABLED | default "false" | quote }}
  RABBITMQ_TRANSACTION_EVENTS_EXCHANGE: {{ $cm.RABBITMQ_TRANSACTION_EVENTS_EXCHANGE | default "transaction.transaction_events.exchange" | quote }}

  # OVERDRAFT EVENTS
  RABBITMQ_OVERDRAFT_EVENTS_ENABLED: {{ $cm.RABBITMQ_OVERDRAFT_EVENTS_ENABLED | default "false" | quote }}
  RABBITMQ_OVERDRAFT_EVENTS_EXCHANGE: {{ $cm.RABBITMQ_OVERDRAFT_EVENTS_EXCHANGE | default "transaction.overdraft_events.exchange" | quote }}

  # AUDIT
  AUDIT_LOG_ENABLED: {{ $cm.AUDIT_LOG_ENABLED | default "false" | quote }}
  RABBITMQ_AUDIT_EXCHANGE: {{ $cm.RABBITMQ_AUDIT_EXCHANGE | default "audit.append_log.exchange" | quote }}
  RABBITMQ_AUDIT_KEY: {{ $cm.RABBITMQ_AUDIT_KEY | default "audit.append_log.key" | quote }}

  # =============================================================================
  # PAGINATION
  # =============================================================================
  MAX_PAGINATION_LIMIT: {{ $cm.MAX_PAGINATION_LIMIT | default "100" | quote }}
  MAX_PAGINATION_MONTH_DATE_RANGE: {{ $cm.MAX_PAGINATION_MONTH_DATE_RANGE | default "3" | quote }}

  # =============================================================================
  # BALANCE SYNC WORKER
  # =============================================================================
  BALANCE_SYNC_WORKER_ENABLED: {{ $cm.BALANCE_SYNC_WORKER_ENABLED | default "false" | quote }}
  BALANCE_SYNC_MAX_WORKERS: {{ $cm.BALANCE_SYNC_MAX_WORKERS | default "5" | quote }}
  BALANCE_SYNC_BATCH_SIZE: {{ $cm.BALANCE_SYNC_BATCH_SIZE | default "50" | quote }}
  BALANCE_SYNC_FLUSH_TIMEOUT_MS: {{ $cm.BALANCE_SYNC_FLUSH_TIMEOUT_MS | default "500" | quote }}
  BALANCE_SYNC_POLL_INTERVAL_MS: {{ $cm.BALANCE_SYNC_POLL_INTERVAL_MS | default "50" | quote }}

  # =============================================================================
  # RATE LIMITING
  # =============================================================================
  # Three-tier system with Redis backend
  # Set RATE_LIMIT_ENABLED=false to disable (requires ALLOW_RATELIMIT_DISABLED in strict tier)
  # ALLOW_RATELIMIT_DISABLED: Set a detailed reason message explaining why rate limiting is disabled (e.g., "Service processes batch jobs only, no user-facing API endpoints")
  # ALLOW_RATELIMIT_FAIL_OPEN: Set a detailed reason message to allow fail-open mode in production
  RATE_LIMIT_ENABLED: {{ $cm.RATE_LIMIT_ENABLED | default "true" | quote }}
  RATE_LIMIT_MAX: {{ $cm.RATE_LIMIT_MAX | default "500" | quote }}
  RATE_LIMIT_WINDOW_SEC: {{ $cm.RATE_LIMIT_WINDOW_SEC | default "60" | quote }}
  AGGRESSIVE_RATE_LIMIT_MAX: {{ $cm.AGGRESSIVE_RATE_LIMIT_MAX | default "100" | quote }}
  AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: {{ $cm.AGGRESSIVE_RATE_LIMIT_WINDOW_SEC | default "60" | quote }}
  RELAXED_RATE_LIMIT_MAX: {{ $cm.RELAXED_RATE_LIMIT_MAX | default "1000" | quote }}
  RELAXED_RATE_LIMIT_WINDOW_SEC: {{ $cm.RELAXED_RATE_LIMIT_WINDOW_SEC | default "60" | quote }}
  RATE_LIMIT_REDIS_TIMEOUT_MS: {{ $cm.RATE_LIMIT_REDIS_TIMEOUT_MS | default "500" | quote }}
  ALLOW_RATELIMIT_DISABLED: {{ $cm.ALLOW_RATELIMIT_DISABLED | default "" | quote }}
  ALLOW_RATELIMIT_FAIL_OPEN: {{ $cm.ALLOW_RATELIMIT_FAIL_OPEN | default "" | quote }}

  # =============================================================================
  # SERVICE DISCOVERY — knob inline; server config from global.serviceDiscovery,
  # endpoints derived from this chart's own service/ingress (gated via helper).
  # =============================================================================
  {{- /* enabled precedence: configmap.SD_ENABLED (this component) > global.serviceDiscovery.enabled
     (env-wide toggle) > false. Emit the RESOLVED value so the app's SD_ENABLED reflects the
     env-wide toggle, and pass it to the helper. */ -}}
  {{- /* hasKey (not `| default`): a per-component SD_ENABLED=false must WIN over a global true —
     sprig `default` treats a YAML false as empty and would fall through to the global. */ -}}
  {{- $sdGlobalEnabled := toString (((.Values.global | default dict).serviceDiscovery | default dict).enabled | default false) }}
  {{- $sdRaw := $sdGlobalEnabled }}{{- if hasKey $cm "SD_ENABLED" }}{{- $sdRaw = toString (index $cm "SD_ENABLED") }}{{- end }}
  {{- $sdEnabled := eq (include "midaz.isTrue" $sdRaw) "true" }}
  SD_ENABLED: {{ $sdEnabled | quote }}
  {{- include "lerian-common.serviceDiscovery.env" (dict
        "context" $
        "enabled" $sdEnabled
        "configmap" $cm
        "name" (include "midaz-ledger.fullname" .)
        "port" .Values.ledger.service.port
        "namespace" (include "global.namespace" .)
        "ingressHost" (include "lerian-common.firstIngressHost" (dict "ingress" .Values.ledger.ingress))) | nindent 2 }}

  # =============================================================================
  # STREAMING — knob inline; brokers/SASL/TLS from global.streaming (gated via helper).
  # =============================================================================
  {{- /* enabled precedence: configmap.STREAMING_ENABLED > global.streaming.enabled > false. */ -}}
  {{- $streamingGlobalEnabled := toString (((.Values.global | default dict).streaming | default dict).enabled | default false) }}
  {{- $streamingRaw := $streamingGlobalEnabled }}{{- if hasKey $cm "STREAMING_ENABLED" }}{{- $streamingRaw = toString (index $cm "STREAMING_ENABLED") }}{{- end }}
  {{- $streamingEnabled := eq (include "midaz.isTrue" $streamingRaw) "true" }}
  STREAMING_ENABLED: {{ $streamingEnabled | quote }}
  # Billing events use the Schema Registry independently of the Kafka broker endpoint.
  # Empty is intentional: billing emission stays disabled until an operator configures it.
  STREAMING_SCHEMA_REGISTRY_URL: {{ $cm.STREAMING_SCHEMA_REGISTRY_URL | default "" | quote }}
  {{- include "lerian-common.streaming.env" (dict
        "context" $
        "enabled" $streamingEnabled
        "configmap" $cm
        "clientId" (include "midaz-ledger.fullname" .)
        "cloudeventsSource" "ledger") | nindent 2 }}

  # =============================================================================
  # FEE ENGINE
  # =============================================================================
  DEFAULT_CURRENCY: {{ $cm.DEFAULT_CURRENCY | default "USD" | quote }}

  # =============================================================================
  # CASDOOR
  # =============================================================================
  CASDOOR_JWK_ADDRESS: {{ $cm.CASDOOR_JWK_ADDRESS | default "" | quote }}
  # Extra Env Vars
  {{- with .Values.ledger.extraEnvVars }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
