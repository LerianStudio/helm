{{- if .Values.brCcs.enabled }}
{{- $cm := .Values.brCcs.configmap | default dict }}
{{- /* Grouped param blocks (clean API). Each config key resolves via cfgValue:
   configmap.<NATIVE_KEY> (escape hatch) > brCcs.<group>.<field> > chart default.
   Unset groups fall through to the chart default → render stays byte-identical. */ -}}
{{- $app := .Values.brCcs.app | default dict }}
{{- $srv := .Values.brCcs.server | default dict }}
{{- $cors := .Values.brCcs.cors | default dict }}
{{- $mt := .Values.brCcs.multiTenant | default dict }}
{{- $pgp := .Values.brCcs.postgres | default dict }}
{{- $rds := .Values.brCcs.redis | default dict }}
{{- $brk := .Values.brCcs.broker | default dict }}
{{- $ob := .Values.brCcs.outbox | default dict }}
{{- $fet := .Values.brCcs.fetcher | default dict }}
{{- $sta := .Values.brCcs.sta | default dict }}
{{- $rep := .Values.brCcs.reporter | default dict }}
{{- $swg := .Values.brCcs.swagger | default dict }}
{{- $rl := .Values.brCcs.rateLimit | default dict }}
{{- $pag := .Values.brCcs.pagination | default dict }}
{{- $obs := .Values.brCcs.observability | default dict }}
{{- $m2m := .Values.brCcs.m2m | default dict }}
{{- $rdy := .Values.brCcs.readiness | default dict }}
{{- $shd := .Values.brCcs.shutdown | default dict }}
{{- $os := .Values.brCcs.objectStorage | default dict }}
{{- $sd := .Values.brCcs.serviceDiscovery | default dict }}
{{- $strm := .Values.brCcs.streaming | default dict }}
{{- $multiTenantEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_ENABLED" "params" $mt "field" "enabled" "default" "false")) "true" }}
{{- $sdEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SD_ENABLED" "params" $sd "field" "enabled" "default" "false")) "true" }}
{{- $streamingEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_ENABLED" "params" $strm "field" "enabled" "default" "false")) "true" }}
{{- $pg := .Values.postgresql | default dict }}
{{- $vk := .Values.valkey | default dict }}
{{- $ds := .Values.brCcs.datastores | default dict }}
{{- $pgInternal := and (ne (toString $pg.enabled) "false") (not $pg.external) }}
{{- $vkInternal := and (ne (toString $vk.enabled) "false") (not $vk.external) }}
{{- $namespace := include "global.namespace" . }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "br-ccs.fullname" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "br-ccs.labels" (dict "context" . "component" .Values.brCcs.name "name" .Values.brCcs.name ) | nindent 4 }}
data:
  # =====================================================================
  # APPLICATION IDENTITY
  # =====================================================================
  APPLICATION_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "APPLICATION_NAME" "params" $app "field" "name" "default" "br-ccs") | quote }}
  ENV_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ENV_NAME" "params" $app "field" "env" "default" "production") | quote }}
  VERSION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "VERSION" "params" $app "field" "version" "default" .Chart.AppVersion) | quote }}
  LOG_LEVEL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "LOG_LEVEL" "params" $app "field" "logLevel" "default" "info") | quote }}
  DEPLOYMENT_MODE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DEPLOYMENT_MODE" "params" $app "field" "deploymentMode" "default" "byoc") | quote }}
  CCS_RUN_MODE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_RUN_MODE" "params" $app "field" "runMode" "default" "all") | quote }}

  # =====================================================================
  # HTTP SERVER
  # SERVER_PORT is consumed by the in-container /healthcheck binary.
  # =====================================================================
  SERVER_ADDRESS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SERVER_ADDRESS" "params" $srv "field" "address" "default" ":4030") | quote }}
  SERVER_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SERVER_PORT" "params" $srv "field" "port" "default" "4030") | quote }}
  GRPC_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "GRPC_PORT" "params" $srv "field" "grpcPort" "default" "7001") | quote }}
  HTTP_BODY_LIMIT_BYTES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "HTTP_BODY_LIMIT_BYTES" "params" $srv "field" "bodyLimitBytes" "default" "104857600") | quote }}
  {{- if $cm.SERVER_TLS_CERT_FILE }}
  SERVER_TLS_CERT_FILE: {{ $cm.SERVER_TLS_CERT_FILE | quote }}
  {{- end }}
  {{- if $cm.SERVER_TLS_KEY_FILE }}
  SERVER_TLS_KEY_FILE: {{ $cm.SERVER_TLS_KEY_FILE | quote }}
  {{- end }}
  TLS_TERMINATED_UPSTREAM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TLS_TERMINATED_UPSTREAM" "params" $srv "field" "tlsTerminatedUpstream" "default" "true") | quote }}
  TRUSTED_PROXIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "TRUSTED_PROXIES" "params" $srv "field" "trustedProxies" "default" "") | quote }}

  # =====================================================================
  # CORS POLICY
  # =====================================================================
  CORS_ALLOWED_ORIGINS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOWED_ORIGINS" "params" $cors "field" "allowedOrigins" "default" "") | quote }}
  CORS_ALLOWED_METHODS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOWED_METHODS" "params" $cors "field" "allowedMethods" "default" "GET,POST,PUT,PATCH,DELETE,OPTIONS") | quote }}
  CORS_ALLOWED_HEADERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOWED_HEADERS" "params" $cors "field" "allowedHeaders" "default" "Authorization,Content-Type,X-Tenant-ID,X-Idempotency,X-Request-ID") | quote }}
  CORS_EXPOSE_HEADERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_EXPOSE_HEADERS" "params" $cors "field" "exposeHeaders" "default" "") | quote }}
  CORS_ALLOW_CREDENTIALS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CORS_ALLOW_CREDENTIALS" "params" $cors "field" "allowCredentials" "default" "false") | quote }}

  # =====================================================================
  # MULTI-TENANCY
  # Toggle + DEFAULT_TENANT_ID always render. MT infra endpoints render
  # only when MULTI_TENANT_ENABLED=true.
  # =====================================================================
  DEFAULT_TENANT_ID: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DEFAULT_TENANT_ID" "params" $mt "field" "defaultTenantId" "default" "11111111-1111-1111-1111-111111111111") | quote }}
  MULTI_TENANT_ENABLED: {{ $multiTenantEnabled | quote }}
  {{- /* Multi-tenant infra endpoints derive from global.multiTenant (env-wide) with a
     component configmap.MULTI_TENANT_* override; emitted only when enabled. URL and
     REDIS_HOST are required when enabled (fail-fast). */ -}}
  {{- include "lerian-common.multiTenant.env" (dict
        "context" $ "configmap" $cm "enabled" $multiTenantEnabled
        "emitRedis" true "emitPool" true "emitCache" true
        "requiredUrl" true "requiredRedisHost" true) | nindent 2 }}

  # =====================================================================
  # POSTGRESQL (primary + control-plane)
  # HOST/PORT/USER/SSL via the datastore mask; tuning via brCcs.postgres.
  # =====================================================================
  {{- if $pgInternal }}
  POSTGRES_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "host" "nativeKey" "POSTGRES_HOST" "default" (printf "%s-postgresql-primary.%s.svc.cluster.local" .Release.Name $namespace)) | quote }}
  {{- else }}
  POSTGRES_HOST: {{ required "brCcs.configmap.POSTGRES_HOST (or brCcs.datastores.postgres.host / global.datastores.postgres.host) is required when the bundled postgresql subchart is disabled (external infra)" (include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "host" "nativeKey" "POSTGRES_HOST")) | quote }}
  {{- end }}
  POSTGRES_PORT: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "port" "nativeKey" "POSTGRES_PORT" "default" "5432") | quote }}
  POSTGRES_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "user" "nativeKey" "POSTGRES_USER" "default" "br-ccs") | quote }}
  POSTGRES_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_NAME" "params" $pgp "field" "name" "default" "br-ccs") | quote }}
  POSTGRES_SSLMODE: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "ssl" "nativeKey" "POSTGRES_SSLMODE" "default" "require") | quote }}
  MIGRATIONS_PATH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MIGRATIONS_PATH" "params" $pgp "field" "migrationsPath" "default" "migrations") | quote }}
  SYSTEMPLANE_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SYSTEMPLANE_ENABLED" "params" $pgp "field" "systemplaneEnabled" "default" "false") | quote }}
  POSTGRES_MAX_OPEN_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_MAX_OPEN_CONNS" "params" $pgp "field" "maxOpenConns" "default" "25") | quote }}
  POSTGRES_MAX_IDLE_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_MAX_IDLE_CONNS" "params" $pgp "field" "maxIdleConns" "default" "5") | quote }}
  POSTGRES_CONN_MAX_LIFETIME_MINS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_CONN_MAX_LIFETIME_MINS" "params" $pgp "field" "connMaxLifetimeMins" "default" "30") | quote }}
  POSTGRES_CONN_MAX_IDLE_TIME_MINS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_CONN_MAX_IDLE_TIME_MINS" "params" $pgp "field" "connMaxIdleTimeMins" "default" "5") | quote }}
  POSTGRES_CONNECT_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "POSTGRES_CONNECT_TIMEOUT_SEC" "params" $pgp "field" "connectTimeoutSec" "default" "10") | quote }}
  INFRA_CONNECT_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "INFRA_CONNECT_TIMEOUT_SEC" "params" $pgp "field" "infraConnectTimeoutSec" "default" "30") | quote }}
  {{- $replicaHost := include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "postgres" "field" "replicaHost" "nativeKey" "POSTGRES_REPLICA_HOST") }}
  {{- if $replicaHost }}
  POSTGRES_REPLICA_HOST: {{ $replicaHost | quote }}
  POSTGRES_REPLICA_PORT: {{ $cm.POSTGRES_REPLICA_PORT | default "5432" | quote }}
  POSTGRES_REPLICA_USER: {{ $cm.POSTGRES_REPLICA_USER | quote }}
  POSTGRES_REPLICA_NAME: {{ $cm.POSTGRES_REPLICA_NAME | quote }}
  POSTGRES_REPLICA_SSLMODE: {{ $cm.POSTGRES_REPLICA_SSLMODE | default "require" | quote }}
  {{- end }}

  # =====================================================================
  # REDIS / VALKEY (app-level). HOST via mask; tuning via brCcs.redis.
  # =====================================================================
  {{- if $vkInternal }}
  REDIS_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "redis" "field" "host" "nativeKey" "REDIS_HOST" "default" (printf "%s-valkey-primary.%s.svc.cluster.local:6379" .Release.Name $namespace)) | quote }}
  {{- else }}
  REDIS_HOST: {{ required "brCcs.configmap.REDIS_HOST (or brCcs.datastores.redis.host / global.datastores.redis.host) is required when the bundled valkey subchart is disabled (external infra)" (include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "redis" "field" "host" "nativeKey" "REDIS_HOST")) | quote }}
  {{- end }}
  REDIS_DB: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_DB" "params" $rds "field" "db" "default" "0") | quote }}
  REDIS_PROTOCOL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_PROTOCOL" "params" $rds "field" "protocol" "default" "3") | quote }}
  REDIS_POOL_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_POOL_SIZE" "params" $rds "field" "poolSize" "default" "10") | quote }}
  REDIS_MIN_IDLE_CONNS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MIN_IDLE_CONNS" "params" $rds "field" "minIdleConns" "default" "2") | quote }}
  REDIS_READ_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_READ_TIMEOUT" "params" $rds "field" "readTimeout" "default" "3") | quote }}
  REDIS_WRITE_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_WRITE_TIMEOUT" "params" $rds "field" "writeTimeout" "default" "3") | quote }}
  REDIS_DIAL_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_DIAL_TIMEOUT" "params" $rds "field" "dialTimeout" "default" "5") | quote }}
  REDIS_POOL_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_POOL_TIMEOUT" "params" $rds "field" "poolTimeout" "default" "2") | quote }}
  REDIS_MAX_RETRIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MAX_RETRIES" "params" $rds "field" "maxRetries" "default" "3") | quote }}
  REDIS_MIN_RETRY_BACKOFF: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MIN_RETRY_BACKOFF" "params" $rds "field" "minRetryBackoff" "default" "8") | quote }}
  REDIS_MAX_RETRY_BACKOFF: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REDIS_MAX_RETRY_BACKOFF" "params" $rds "field" "maxRetryBackoff" "default" "1") | quote }}
  {{- if $cm.REDIS_TLS }}
  REDIS_TLS: {{ $cm.REDIS_TLS | quote }}
  {{- end }}
  {{- if $cm.REDIS_MASTER_NAME }}
  REDIS_MASTER_NAME: {{ $cm.REDIS_MASTER_NAME | quote }}
  {{- end }}

  # =====================================================================
  # CIRCUIT BREAKER (prerequisite for object storage adapters)
  # =====================================================================
  CIRCUIT_BREAKER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CIRCUIT_BREAKER_ENABLED" "params" $brk "field" "circuitBreakerEnabled" "default" "true") | quote }}

  # =====================================================================
  # RABBITMQ (optional). HOST/PORT/USER via mask; rest via brCcs.broker.
  # =====================================================================
  RABBITMQ_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ENABLED" "params" $brk "field" "enabled" "default" "false") | quote }}
  {{- if eq (toString (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ENABLED" "params" $brk "field" "enabled" "default" "false"))) "true" }}
  {{- /* RABBITMQ_URL carries the password and is rendered as a Secret (see
         templates/secrets.yaml), never as a ConfigMap value. */}}
  RABBITMQ_HOST: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "broker" "field" "host" "nativeKey" "RABBITMQ_HOST" "default" (printf "%s-rabbitmq.%s.svc.cluster.local" .Release.Name $namespace)) | quote }}
  RABBITMQ_PORT_AMQP: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "broker" "field" "port" "nativeKey" "RABBITMQ_PORT_AMQP" "default" "5672") | quote }}
  RABBITMQ_PORT_HOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PORT_HOST" "params" $brk "field" "portHost" "default" "15672") | quote }}
  RABBITMQ_DEFAULT_USER: {{ include "lerian-common.datastore.value" (dict "context" $ "dedicated" $ds "configmap" $cm "type" "broker" "field" "user" "nativeKey" "RABBITMQ_DEFAULT_USER" "default" "br-ccs") | quote }}
  RABBITMQ_VHOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_VHOST" "params" $brk "field" "vhost" "default" "/") | quote }}
  RABBITMQ_EXCHANGE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_EXCHANGE" "params" $brk "field" "exchange" "default" "events") | quote }}
  RABBITMQ_REQUIRE_HEALTH_ALLOWED_HOSTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_REQUIRE_HEALTH_ALLOWED_HOSTS" "params" $brk "field" "requireHealthAllowedHosts" "default" "false") | quote }}
  RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ALLOW_INSECURE_HEALTH_CHECK" "params" $brk "field" "allowInsecureHealthCheck" "default" "false") | quote }}
  RABBITMQ_ALLOW_INSECURE_TLS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_ALLOW_INSECURE_TLS" "params" $brk "field" "allowInsecureTls" "default" "false") | quote }}
  RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT_MS" "params" $brk "field" "publisherConfirmTimeoutMs" "default" "5000") | quote }}
  RABBITMQ_PUBLISHER_RECOVERY_INITIAL_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_RECOVERY_INITIAL_MS" "params" $brk "field" "publisherRecoveryInitialMs" "default" "1000") | quote }}
  RABBITMQ_PUBLISHER_RECOVERY_MAX_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_RECOVERY_MAX_MS" "params" $brk "field" "publisherRecoveryMaxMs" "default" "30000") | quote }}
  RABBITMQ_PUBLISHER_MAX_RECOVERIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RABBITMQ_PUBLISHER_MAX_RECOVERIES" "params" $brk "field" "publisherMaxRecoveries" "default" "10") | quote }}
  CCS_STA_DLQ_TTL_SECONDS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_STA_DLQ_TTL_SECONDS" "params" $brk "field" "staDlqTtlSeconds" "default" "30") | quote }}
  {{- if $cm.RABBITMQ_QUEUE }}
  RABBITMQ_QUEUE: {{ $cm.RABBITMQ_QUEUE | quote }}
  {{- end }}
  {{- if $cm.RABBITMQ_HEALTH_CHECK_URL }}
  RABBITMQ_HEALTH_CHECK_URL: {{ $cm.RABBITMQ_HEALTH_CHECK_URL | quote }}
  {{- end }}
  {{- if $cm.RABBITMQ_HEALTH_CHECK_ALLOWED_HOSTS }}
  RABBITMQ_HEALTH_CHECK_ALLOWED_HOSTS: {{ $cm.RABBITMQ_HEALTH_CHECK_ALLOWED_HOSTS | quote }}
  {{- end }}
  {{- end }}

  # =====================================================================
  # OUTBOX (brCcs.outbox)
  # =====================================================================
  OUTBOX_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_ENABLED" "params" $ob "field" "enabled" "default" "false") | quote }}
  OUTBOX_TABLE_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_TABLE_NAME" "params" $ob "field" "tableName" "default" "outbox_events") | quote }}
  OUTBOX_DISPATCH_INTERVAL_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_DISPATCH_INTERVAL_SEC" "params" $ob "field" "dispatchIntervalSec" "default" "2") | quote }}
  OUTBOX_BATCH_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_BATCH_SIZE" "params" $ob "field" "batchSize" "default" "50") | quote }}
  OUTBOX_PUBLISH_MAX_ATTEMPTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_PUBLISH_MAX_ATTEMPTS" "params" $ob "field" "publishMaxAttempts" "default" "3") | quote }}
  OUTBOX_PUBLISH_BACKOFF_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_PUBLISH_BACKOFF_MS" "params" $ob "field" "publishBackoffMs" "default" "200") | quote }}
  OUTBOX_RETRY_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_RETRY_WINDOW_SEC" "params" $ob "field" "retryWindowSec" "default" "300") | quote }}
  OUTBOX_MAX_DISPATCH_ATTEMPTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_MAX_DISPATCH_ATTEMPTS" "params" $ob "field" "maxDispatchAttempts" "default" "10") | quote }}
  OUTBOX_PROCESSING_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_PROCESSING_TIMEOUT_SEC" "params" $ob "field" "processingTimeoutSec" "default" "600") | quote }}
  OUTBOX_MAX_FAILED_PER_BATCH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_MAX_FAILED_PER_BATCH" "params" $ob "field" "maxFailedPerBatch" "default" "25") | quote }}
  OUTBOX_INCLUDE_TENANT_METRICS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_INCLUDE_TENANT_METRICS" "params" $ob "field" "includeTenantMetrics" "default" "false") | quote }}
  OUTBOX_ALLOW_EMPTY_TENANT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OUTBOX_ALLOW_EMPTY_TENANT" "params" $ob "field" "allowEmptyTenant" "default" "true") | quote }}
  {{- if $cm.OUTBOX_PRIORITY_EVENT_TYPES }}
  OUTBOX_PRIORITY_EVENT_TYPES: {{ $cm.OUTBOX_PRIORITY_EVENT_TYPES | quote }}
  {{- end }}

  # =====================================================================
  # FETCHER INTEGRATION (brCcs.fetcher)
  # =====================================================================
  FETCHER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "FETCHER_ENABLED" "params" $fet "field" "enabled" "default" "false") | quote }}
  {{- if $cm.FETCHER_URL }}
  FETCHER_URL: {{ $cm.FETCHER_URL | quote }}
  {{- end }}
  FETCHER_HTTP_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "FETCHER_HTTP_TIMEOUT_SEC" "params" $fet "field" "httpTimeoutSec" "default" "30") | quote }}
  CCS_OUTBOX_DISPATCH_INTERVAL_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_OUTBOX_DISPATCH_INTERVAL_MS" "params" $fet "field" "ccsOutboxDispatchIntervalMs" "default" "500") | quote }}
  CCS_OUTBOX_BATCH_SIZE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_OUTBOX_BATCH_SIZE" "params" $fet "field" "ccsOutboxBatchSize" "default" "50") | quote }}
  CCS_OUTBOX_MAX_ATTEMPTS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_OUTBOX_MAX_ATTEMPTS" "params" $fet "field" "ccsOutboxMaxAttempts" "default" "10") | quote }}
  CCS_OUTBOX_DLQ_ROUTING_KEY: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_OUTBOX_DLQ_ROUTING_KEY" "params" $fet "field" "ccsOutboxDlqRoutingKey" "default" "ccs.outbox.dlq") | quote }}
  CCS_FETCHER_MAX_REDELIVERIES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_FETCHER_MAX_REDELIVERIES" "params" $fet "field" "maxRedeliveries" "default" "5") | quote }}
  CCS_FETCHER_RETRY_BACKOFF_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_FETCHER_RETRY_BACKOFF_MS" "params" $fet "field" "retryBackoffMs" "default" "5000") | quote }}

  # =====================================================================
  # STA INTEGRATION (brCcs.sta)
  # =====================================================================
  STA_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STA_ENABLED" "params" $sta "field" "enabled" "default" "false") | quote }}
  {{- if $cm.STA_BASE_URL }}
  STA_BASE_URL: {{ $cm.STA_BASE_URL | quote }}
  {{- end }}
  STA_HTTP_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STA_HTTP_TIMEOUT_SEC" "params" $sta "field" "httpTimeoutSec" "default" "30") | quote }}

  # =====================================================================
  # REPORTER INTEGRATION (optional — brCcs.reporter)
  # =====================================================================
  REPORTER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REPORTER_ENABLED" "params" $rep "field" "enabled" "default" "false") | quote }}
  {{- if eq (toString (include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REPORTER_ENABLED" "params" $rep "field" "enabled" "default" "false"))) "true" }}
  REPORTER_URL: {{ required "brCcs.configmap.REPORTER_URL is required when REPORTER_ENABLED=true" $cm.REPORTER_URL | quote }}
  REPORTER_HTTP_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "REPORTER_HTTP_TIMEOUT_SEC" "params" $rep "field" "httpTimeoutSec" "default" "30") | quote }}
  {{- end }}

  # =====================================================================
  # AUTHENTICATION (inbound). ENABLED + HOST resolve via global.auth
  # (globalValue: configmap.<KEY> > global.auth.<field> > default). HOST is
  # emitted only when non-empty (preserves the pre-contract render).
  # =====================================================================
  PLUGIN_AUTH_ENABLED: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "auth" "field" "enabled" "nativeKey" "PLUGIN_AUTH_ENABLED" "default" "false") | quote }}
  {{- $pluginAuthHost := include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "auth" "field" "host" "nativeKey" "PLUGIN_AUTH_HOST" "default" "") }}
  {{- if $pluginAuthHost }}
  PLUGIN_AUTH_HOST: {{ $pluginAuthHost | quote }}
  {{- end }}

  # =====================================================================
  # SWAGGER (brCcs.swagger)
  # =====================================================================
  SWAGGER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_ENABLED" "params" $swg "field" "enabled" "default" "true") | quote }}
  SWAGGER_TITLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_TITLE" "params" $swg "field" "title" "default" "br-ccs") | quote }}
  SWAGGER_VERSION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_VERSION" "params" $swg "field" "version" "default" .Chart.AppVersion) | quote }}
  SWAGGER_BASE_PATH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_BASE_PATH" "params" $swg "field" "basePath" "default" "/") | quote }}
  SWAGGER_LEFT_DELIM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_LEFT_DELIM" "params" $swg "field" "leftDelim" "default" "{{") | quote }}
  SWAGGER_RIGHT_DELIM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SWAGGER_RIGHT_DELIM" "params" $swg "field" "rightDelim" "default" "}}") | quote }}
  {{- if $cm.SWAGGER_DESCRIPTION }}
  SWAGGER_DESCRIPTION: {{ $cm.SWAGGER_DESCRIPTION | quote }}
  {{- end }}

  # =====================================================================
  # OPENTELEMETRY (global.observability + per-component identity)
  # =====================================================================
  {{- include "lerian-common.otel.env" (dict
        "context" $ "configmap" $cm
        "enabledDefault" "false"
        "endpointDefault" ""
        "deploymentEnvironmentDefault" "production") | nindent 2 }}
  {{- include "lerian-common.otel.envFlat" (dict
        "configmap" $cm
        "keys" (list "OTEL_RESOURCE_SERVICE_NAME" "OTEL_LIBRARY_NAME" "OTEL_RESOURCE_SERVICE_VERSION")
        "defaults" (dict
          "OTEL_RESOURCE_SERVICE_NAME" "br-ccs"
          "OTEL_LIBRARY_NAME" "br-ccs"
          "OTEL_RESOURCE_SERVICE_VERSION" (.Values.brCcs.image.tag | default .Chart.AppVersion))) | nindent 2 }}

  # =====================================================================
  # SERVICE DISCOVERY (lerian-common.serviceDiscovery.env + global.serviceDiscovery).
  # Toggle via brCcs.serviceDiscovery.enabled; SD_TOKEN (ACL) is a Secret. The full
  # SD_* sibling block derives only when enabled.
  # =====================================================================
  SD_ENABLED: {{ $sdEnabled | quote }}
  {{- include "lerian-common.serviceDiscovery.env" (dict
        "context" $
        "enabled" $sdEnabled
        "configmap" $cm
        "name" (include "br-ccs.fullname" .)
        "port" .Values.brCcs.service.port
        "namespace" $namespace
        "ingressHost" (include "lerian-common.firstIngressHost" (dict "ingress" .Values.brCcs.ingress))) | nindent 2 }}

  # =====================================================================
  # STREAMING (lerian-common.streaming.env + global.streaming). Toggle via
  # brCcs.streaming.enabled; the full SASL/broker block derives only when enabled.
  # STREAMING_SASL_PASSWORD is a Secret (see templates/secrets.yaml).
  # =====================================================================
  STREAMING_ENABLED: {{ $streamingEnabled | quote }}
  {{- include "lerian-common.streaming.env" (dict
        "context" $
        "enabled" $streamingEnabled
        "configmap" $cm
        "clientId" (include "br-ccs.fullname" .)
        "cloudeventsSource" "lerian.br-ccs") | nindent 2 }}

  # =====================================================================
  # RATE LIMITING (brCcs.rateLimit). br-ccs has a bespoke surface (EXPORT/
  # DISPATCH tiers, no REDIS_TIMEOUT_MS), so each knob resolves via cfgValue
  # rather than the fixed rateLimit.env bundle — same commons precedence.
  # =====================================================================
  RATE_LIMIT_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_ENABLED" "params" $rl "field" "enabled" "default" "true") | quote }}
  RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_MAX" "params" $rl "field" "max" "default" "500") | quote }}
  RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "windowSec" "default" "60") | quote }}
  AGGRESSIVE_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AGGRESSIVE_RATE_LIMIT_MAX" "params" $rl "field" "aggressiveMax" "default" "100") | quote }}
  AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AGGRESSIVE_RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "aggressiveWindowSec" "default" "60") | quote }}
  RELAXED_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RELAXED_RATE_LIMIT_MAX" "params" $rl "field" "relaxedMax" "default" "1000") | quote }}
  RELAXED_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "RELAXED_RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "relaxedWindowSec" "default" "60") | quote }}
  EXPORT_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "EXPORT_RATE_LIMIT_MAX" "params" $rl "field" "exportMax" "default" "60") | quote }}
  EXPORT_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "EXPORT_RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "exportWindowSec" "default" "60") | quote }}
  DISPATCH_RATE_LIMIT_MAX: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DISPATCH_RATE_LIMIT_MAX" "params" $rl "field" "dispatchMax" "default" "30") | quote }}
  DISPATCH_RATE_LIMIT_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DISPATCH_RATE_LIMIT_WINDOW_SEC" "params" $rl "field" "dispatchWindowSec" "default" "60") | quote }}
  # Empty (default) keeps the safe fail-closed posture; "true" permits fail-open.
  ALLOW_RATELIMIT_FAIL_OPEN: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ALLOW_RATELIMIT_FAIL_OPEN" "params" $rl "field" "allowFailOpen" "default" "") | quote }}

  # =====================================================================
  # OBSERVABILITY / IDEMPOTENCY / PAGINATION
  # =====================================================================
  DB_METRICS_INTERVAL_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "DB_METRICS_INTERVAL_SEC" "params" $obs "field" "dbMetricsIntervalSec" "default" "15") | quote }}
  IDEMPOTENCY_RETRY_WINDOW_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "IDEMPOTENCY_RETRY_WINDOW_SEC" "params" $obs "field" "idempotencyRetryWindowSec" "default" "300") | quote }}
  MAX_PAGINATION_LIMIT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MAX_PAGINATION_LIMIT" "params" $pag "field" "limit" "default" "100") | quote }}
  MAX_PAGINATION_MONTH_DATE_RANGE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MAX_PAGINATION_MONTH_DATE_RANGE" "params" $pag "field" "monthDateRange" "default" "3") | quote }}

  # =====================================================================
  # M2M CREDENTIALS (non-secret portion — target service / OAuth2 / scope)
  # API keys live in the Secret; SaaS uses AWS Secrets Manager.
  # =====================================================================
  M2M_CREDENTIAL_CACHE_TTL_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "M2M_CREDENTIAL_CACHE_TTL_SEC" "params" $m2m "field" "credentialCacheTtlSec" "default" "300") | quote }}
  AWS_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "AWS_REGION" "params" $m2m "field" "awsRegion" "default" "us-east-1") | quote }}
  {{- range $k := (list "FETCHER_M2M_TARGET_SERVICE" "FETCHER_OAUTH2_TOKEN_URL" "FETCHER_OAUTH2_SCOPE" "REPORTER_M2M_TARGET_SERVICE" "REPORTER_OAUTH2_TOKEN_URL" "REPORTER_OAUTH2_SCOPE" "STA_M2M_TARGET_SERVICE" "STA_OAUTH2_TOKEN_URL" "STA_OAUTH2_SCOPE") }}
  {{- if index $cm $k }}
  {{ $k }}: {{ index $cm $k | quote }}
  {{- end }}
  {{- end }}

  # =====================================================================
  # DETAIL RESPONSE TUNING (optional)
  # =====================================================================
  {{- range $k := (list "CCS_DETAIL_MESSAGE_EMIT_ENABLED" "CCS_DETAIL_MESSAGE_VALIDATION_ENABLED" "CCS_BACEN_DESTINATARIO_CNPJ_BASE" "CCS_ACCS005_OVERFLOW_THRESHOLD" "CCS_ACCS005_SECRECY_SITUACAO") }}
  {{- if index $cm $k }}
  {{ $k }}: {{ index $cm $k | quote }}
  {{- end }}
  {{- end }}

  # =====================================================================
  # FETCHER SNAPSHOT QUARANTINE (optional — br-ccs-140 Phase 2)
  # Opt-in: skip + classify invalid CRM records instead of aborting the
  # whole batch, up to an invalid/total ceiling above which it fails HIGH.
  # Unset = app defaults (disabled; ceiling 0.05). Render only when set so
  # the chart never overrides the app's fail-closed default.
  # =====================================================================
  {{- range $k := (list "CCS_SNAPSHOT_QUARANTINE_INVALID_ENABLED" "CCS_SNAPSHOT_QUARANTINE_MAX_INVALID_RATIO") }}
  {{- if index $cm $k }}
  {{ $k }}: {{ index $cm $k | quote }}
  {{- end }}
  {{- end }}

  # =====================================================================
  # READINESS PROBE + GRACEFUL SHUTDOWN (brCcs.readiness / brCcs.shutdown)
  # =====================================================================
  READYZ_PROBE_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "READYZ_PROBE_TIMEOUT_SEC" "params" $rdy "field" "probeTimeoutSec" "default" "5") | quote }}
  READYZ_DEP_SLOW_THRESHOLD_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "READYZ_DEP_SLOW_THRESHOLD_MS" "params" $rdy "field" "depSlowThresholdMs" "default" "500") | quote }}
  STARTUP_SELF_PROBE_MAX_DURATION_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STARTUP_SELF_PROBE_MAX_DURATION_SEC" "params" $rdy "field" "startupMaxDurationSec" "default" "120") | quote }}
  STARTUP_SELF_PROBE_INITIAL_DELAY_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STARTUP_SELF_PROBE_INITIAL_DELAY_MS" "params" $rdy "field" "startupInitialDelayMs" "default" "1000") | quote }}
  STARTUP_SELF_PROBE_MAX_DELAY_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STARTUP_SELF_PROBE_MAX_DELAY_MS" "params" $rdy "field" "startupMaxDelayMs" "default" "30000") | quote }}
  SHUTDOWN_DRAIN_GRACE_PERIOD_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SHUTDOWN_DRAIN_GRACE_PERIOD_SEC" "params" $shd "field" "drainGracePeriodSec" "default" "15") | quote }}
  SHUTDOWN_TOTAL_TIMEOUT_SEC: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SHUTDOWN_TOTAL_TIMEOUT_SEC" "params" $shd "field" "totalTimeoutSec" "default" "30") | quote }}

  # =====================================================================
  # OBJECT STORAGE (non-secret — endpoints/region/bucket/flags — brCcs.objectStorage)
  # Access + secret keys live in the Secret.
  # =====================================================================
  SEAWEEDFS_S3_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SEAWEEDFS_S3_PORT" "params" $os "field" "seaweedfsS3Port" "default" "8342") | quote }}
  SEAWEEDFS_MASTER_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "SEAWEEDFS_MASTER_PORT" "params" $os "field" "seaweedfsMasterPort" "default" "9343") | quote }}
  OBJECT_STORAGE_STA_ENDPOINT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_STA_ENDPOINT" "params" $os "field" "staEndpoint" "default" "") | quote }}
  OBJECT_STORAGE_STA_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_STA_REGION" "params" $os "field" "staRegion" "default" "us-east-1") | quote }}
  OBJECT_STORAGE_STA_BUCKET: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_STA_BUCKET" "params" $os "field" "staBucket" "default" "") | quote }}
  OBJECT_STORAGE_STA_USE_PATH_STYLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_STA_USE_PATH_STYLE" "params" $os "field" "staUsePathStyle" "default" "true") | quote }}
  OBJECT_STORAGE_STA_DISABLE_SSL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_STA_DISABLE_SSL" "params" $os "field" "staDisableSsl" "default" "true") | quote }}
  OBJECT_STORAGE_CCS_ENDPOINT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_CCS_ENDPOINT" "params" $os "field" "ccsEndpoint" "default" "") | quote }}
  OBJECT_STORAGE_CCS_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_CCS_REGION" "params" $os "field" "ccsRegion" "default" "us-east-1") | quote }}
  OBJECT_STORAGE_CCS_BUCKET: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_CCS_BUCKET" "params" $os "field" "ccsBucket" "default" "") | quote }}
  OBJECT_STORAGE_CCS_USE_PATH_STYLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_CCS_USE_PATH_STYLE" "params" $os "field" "ccsUsePathStyle" "default" "true") | quote }}
  OBJECT_STORAGE_CCS_DISABLE_SSL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_CCS_DISABLE_SSL" "params" $os "field" "ccsDisableSsl" "default" "true") | quote }}
  OBJECT_STORAGE_FETCHER_ENDPOINT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_FETCHER_ENDPOINT" "params" $os "field" "fetcherEndpoint" "default" "") | quote }}
  OBJECT_STORAGE_FETCHER_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_FETCHER_REGION" "params" $os "field" "fetcherRegion" "default" "us-east-1") | quote }}
  OBJECT_STORAGE_FETCHER_BUCKET: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_FETCHER_BUCKET" "params" $os "field" "fetcherBucket" "default" "") | quote }}
  OBJECT_STORAGE_FETCHER_USE_PATH_STYLE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_FETCHER_USE_PATH_STYLE" "params" $os "field" "fetcherUsePathStyle" "default" "true") | quote }}
  OBJECT_STORAGE_FETCHER_DISABLE_SSL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OBJECT_STORAGE_FETCHER_DISABLE_SSL" "params" $os "field" "fetcherDisableSsl" "default" "true") | quote }}
  CCS_OUTBOUND_RETENTION_DAYS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_OUTBOUND_RETENTION_DAYS" "params" $os "field" "outboundRetentionDays" "default" "30") | quote }}
  CCS_ACCS009_RETENTION_DAYS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "CCS_ACCS009_RETENTION_DAYS" "params" $os "field" "accs009RetentionDays" "default" "30") | quote }}

  # =====================================================================
  # EXTRA OVERRIDES (escape hatch for optional knobs not modeled above)
  # =====================================================================
  {{- range $key, $value := .Values.brCcs.extraEnvVars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
