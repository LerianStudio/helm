# plugin-br-sisbajud — production template (external infrastructure).
#
# Copy, fill every <...> and keep credentials out of git: prefer
# sisbajud.useExistingSecret + existingSecretName (ESO / Vault) over inline
# sisbajud.secrets. Everything not listed here keeps the chart default.

global:
  # -- aws | gcp | azure: TLS/ssl defaults for PostgreSQL and Redis.
  cloud: ""
  datastores:
    postgres:
      host: "<postgres-host>"
      port: "5432"
      user: "sisbajud"
      name: "sisbajud"
      ssl: "require"
    redis:
      host: "<redis-host>"
      port: "6379"
      tls: "true"
  auth:
    enabled: true
    # The executor mints its Mensageria token here (required even when inbound auth is off).
    host: "http://plugin-access-manager-auth.plugin-access-manager.svc.cluster.local:4000"
  kms:
    vendor: "hashicorp-vault"          # or "aws" (+ awsRegion)
    vaultAddr: "https://<vault-host>:8200"
    vaultAuthMethod: "approle"
    vaultRoleId: "<approle-role-id>"
    vaultMount: "transit"
  observability:
    enabled: true

sisbajud:
  app:
    environmentName: "production"
    deploymentMode: "byoc"
    defaultTenantId: "<tenant-uuid>"

  mensageria:
    baseUrl: "https://<mensageria-host>"
    tls:
      # kubectl create secret generic sisbajud-mensageria-mtls \
      #   --from-file=ca.crt=<mensageria-ca.pem> --from-file=tls.crt=<client.pem> --from-file=tls.key=<client-key.pem>
      existingSecret: "sisbajud-mensageria-mtls"

  executor:
    m2mSubject: "<executor-m2m-token-sub>"
    heartbeatEvery: "1m"
    # SAME value as the Sisbajud Mensageria.
    responseDeadlineMargin: "2h"
    transport: "webhook"
    webhook:
      # TLS terminated (and validated) by the ingress in front of the listener.
      upstreamTlsValidated: true
      ingress:
        enabled: true
        className: "nginx"
        hosts:
          - host: "<sisbajud-webhook-host>"
            paths:
              - path: /v1/webhooks/hub
                pathType: Prefix
        tls:
          - hosts: ["<sisbajud-webhook-host>"]
            secretName: "<tls-secret>"

  # Production: an external Secret carrying the keys below.
  useExistingSecret: true
  existingSecretName: "plugin-br-sisbajud-secrets"
  # Inline alternative (development only):
  secrets:
    LICENSE_KEY: ""
    MENSAGERIA_CLIENT_ID: ""
    MENSAGERIA_CLIENT_SECRET: ""
    EXECUTOR_HUB_WEBHOOK_SECRET: ""
    POSTGRES_PASSWORD: ""
    REDIS_PASSWORD: ""
    VAULT_APPROLE_SECRET_ID: ""

migrations:
  enabled: true
