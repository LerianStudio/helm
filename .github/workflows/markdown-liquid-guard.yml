name: Markdown Liquid Guard

# Blocks a pull request whose markdown would break or blank out charts.lerian.studio.
#
# GitHub Pages builds the site with Jekyll, which runs Liquid over every published
# .md. Helm template snippets ({{ ... }}) outside a raw block fail the whole Pages
# build when malformed, and render as nothing when they happen to parse — the site
# went undeployed for weeks over one unterminated `{{` in an upgrade guide, and the
# Pages build only reports it after the merge. See .github/scripts/liquid-guard.py.
#
# NO `paths:` FILTER, DELIBERATELY: a required check that does not run leaves the pull
# request pending forever. The job always runs; what changes is the scope.
#
# SCOPE FOLLOWS THE BASE BRANCH. Pages publishes main only (repo settings: legacy build,
# source main /). Into main: every tracked .md, because that is what the site builds.
# Into anything else (maintenance/<chart>-<X.Y>.x lines): only the .md files the pull
# request adds, modifies or renames. Those lines are seeded from an old chart tag that
# predates the raw-wrapping, so a full scan fails every pull request on docs it never
# touched (LerianStudio/helm#3093). If Pages ever publishes from another branch, that
# branch needs the full scan too: update PAGES_BRANCH below.

on:
  pull_request:
    # `edited` is the event GitHub sends when a pull request is retargeted. The scope
    # depends on the base, so a pull request checked in changed-files mode against a
    # maintenance line and then moved to main must be scanned again in full; without
    # `edited` it would keep its green result. Title and body edits rerun it too, which
    # costs seconds.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: markdown-liquid-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Markdown Liquid Guard
    runs-on: ${{ vars.GENERAL_RUNNERS || vars.FALLBACK_RUNNERS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull request's head, not the merge ref: on an `edited` (retarget) run the merge
          # ref can still be the merge with the OLD base (actions/checkout#919), and a pull
          # request moved from a maintenance line to main would be scanned on the line's tree.
          # The head is enough for both modes: main itself always passes the full scan, and the
          # changed-files scan diffs against the merge base.
          ref: ${{ github.event.pull_request.head.sha }}
          # The changed-files scan diffs BASE_SHA...HEAD, which needs the merge base.
          fetch-depth: 0

      - name: Test the changed-files selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check markdown for Liquid outside raw blocks
        env:
          PAGES_BRANCH: main
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$BASE_REF" = "$PAGES_BRANCH" ]; then
            python3 .github/scripts/liquid-guard.py
          else
            python3 .github/scripts/liquid-guard.py --changed-since "$BASE_SHA"
          fi
