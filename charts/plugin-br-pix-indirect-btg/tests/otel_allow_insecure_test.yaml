suite: node-local OTEL hop in production
templates:
  - templates/pix/deployment.yaml
  - templates/pix/configmap.yaml
  - templates/pix/secrets.yaml
  - templates/inbound/deployment.yaml
  - templates/inbound/configmap.yaml
  - templates/inbound/secrets.yaml
  - templates/outbound/deployment.yaml
  - templates/outbound/configmap.yaml
  - templates/outbound/secrets.yaml
  - templates/reconciliation/deployment.yaml
  - templates/reconciliation/configmap.yaml
  - templates/reconciliation/secrets.yaml
  - templates/schedule/deployment.yaml
  - templates/schedule/configmap.yaml
  - templates/schedule/secrets.yaml
set:
  pix.configmap.BTG_BASE_URL: https://btg.example.test
  pix.configmap.PIX_ISPB: "12345678"
  pix.configmap.MIDAZ_ORGANIZATION_ID: org
  pix.configmap.MIDAZ_LEDGER_ID: ledger
  pix.secrets.BTG_CLIENT_ID: x
  pix.secrets.BTG_CLIENT_SECRET: x
  pix.secrets.INTERNAL_WEBHOOK_SECRET: "0123456789abcdef0123456789abcdef"
  pix.secrets.MIDAZ_CLIENT_ID: x
  pix.secrets.MIDAZ_CLIENT_SECRET: x
  pix.secrets.LICENSE_KEY: x
tests:
  - it: "pix: the plaintext node-local endpoint carries ALLOW_INSECURE_OTEL"
    template: templates/pix/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
  - it: "pix: global.observability.allowInsecureOtel sets the value env-wide"
    template: templates/pix/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
  - it: "pix: the component configmap wins over the global"
    template: templates/pix/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      pix.configmap.ALLOW_INSECURE_OTEL: "component reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "component reason"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
  - it: "pix: an explicit refusal stands as the one entry"
    template: templates/pix/deployment.yaml
    set:
      pix.configmap.ALLOW_INSECURE_OTEL: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
  - it: "pix: \"false\" is a refusal too and stops the chain"
    template: templates/pix/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      pix.configmap.ALLOW_INSECURE_OTEL: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "false"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
  - it: "pix: a null component value is unset and falls through to the global"
    template: templates/pix/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      pix.configmap.ALLOW_INSECURE_OTEL: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
  - it: "pix: a null global is unset and leaves the node-local reason"
    template: templates/pix/deployment.yaml
    set:
      global.observability.allowInsecureOtel: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
  - it: "pix: an operator value in extraEnvVars stands (no chart entry, no duplicate)"
    template: templates/pix/deployment.yaml
    set:
      pix.extraEnvVars.ALLOW_INSECURE_OTEL: "operator reason"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: "pix: with the node-local collector off nothing is emitted on the container"
    template: templates/pix/deployment.yaml
    set:
      otel-collector-lerian.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
  - it: "pix: an existing Secret is not visible, so the entry is still emitted"
    template: templates/pix/deployment.yaml
    set:
      pix.useExistingSecrets: true
      pix.existingSecretName: my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
  - it: "pix: the ConfigMap renders configmap.ALLOW_INSECURE_OTEL (reaches the app with the collector off)"
    template: templates/pix/configmap.yaml
    set:
      pix.configmap.ALLOW_INSECURE_OTEL: "component reason"
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: "component reason"
  - it: "pix: the ConfigMap takes global.observability.allowInsecureOtel when the component is unset"
    template: templates/pix/configmap.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
