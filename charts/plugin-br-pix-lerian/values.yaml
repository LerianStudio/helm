    requests: { cpu: 100m, memory: 128Mi }

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1   # vsync is a singleton worker

  readinessProbe:
    path: "/readyz"
  livenessProbe:
    path: "/health"
  nodeSelector: {}
  tolerations: []
  affinity: {}

  serviceAccount:
    create: true
