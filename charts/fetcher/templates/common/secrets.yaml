apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fetcher.fullname" . }}-common
  labels:
    {{- include "fetcher.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Empty keys are skipped so an unset shared value never masks the app
         default. envFrom loads this Secret BEFORE the component Secret /
         existingSecret, so those always win on a key both define. */}}
  {{- range $key, $value := .Values.secrets }}
  {{- if not (eq (toString $value) "") }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
