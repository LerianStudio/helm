{{- if .Values.global.externalPostgresDefinitions.enabled }}
{{- /*
Credentials for the bootstrap Jobs.

WHY THIS EXISTS. The Jobs used to carry DB_ADMIN_PASSWORD and
DB_PASSWORD_PIX_LERIAN as literal `env.value` whenever the operator supplied
them inline instead of naming an existing Secret. That put the Postgres
SUPERUSER password into the Job spec, into the Helm release Secret, into
`kubectl describe job` output and into any audit trail that records object
bodies — readable by every principal holding `get job` in the namespace.

The values are now written once into this Secret and referenced by
`secretKeyRef`, so both supply paths — external Secret or inline values —
reach the container the same way and no credential is ever inlined into a
Job manifest.

Only the halves that are actually inline are rendered. The admin login and the
application role each have their own `useExistingSecret.name`, so an operator
can put one in an external Secret and leave the other inline; this Secret then
carries just the inline half, and nothing is duplicated.

HOOK ORDERING. This Secret and the bootstrap Jobs that read it are hooks, at
weights -30 and -20. They used to be plain resources, which was fine only for
as long as the migration Job ran post-install: the Jobs and the migrations then
sat on opposite sides of the release, and the bootstrap happened to come first
by virtue of being a normal resource.

The migration Job is now a pre-install hook (see _migrations.tpl), so a plain
bootstrap resource would run AFTER the migrations that need the role and the
databases it creates, and a fresh install against a server the chart is meant
to provision would fail on the first /migrate. Both bootstrap resources
therefore moved into the same pre-install/pre-upgrade phase, one weight band
ahead of the migration pair:

  -30 this Secret   ->  -20 bootstrap Jobs  ->  -10 migration Secret  ->  -5 migration Job

DELETE POLICY is before-hook-creation ONLY, not hook-succeeded, for the same
reason as the migration Secret: a Secret counts as succeeded the moment it
applies, so hook-succeeded would remove the admin credentials before the Jobs
at weight -20 could read them. Helm does not track hook resources as release
resources, so `helm uninstall` leaves this Secret behind and removing it is a
manual `kubectl delete secret <name>-bootstrap-postgres`; Argo CD deletes it
with the rest of the Application. It carries no credential the operator did not
already put in values or in their own Secret.
*/}}
{{- $defs := .Values.global.externalPostgresDefinitions -}}
{{- $admin := $defs.postgresAdminLogin -}}
{{- $creds := $defs.pixLerianCredentials -}}
{{- $inlineAdmin := not (default "" $admin.useExistingSecret.name) -}}
{{- $inlineCreds := not (default "" $creds.useExistingSecret.name) -}}
{{- /*
An inline credential left empty is rejected HERE, before the Secret is written.
Rendering it as an empty string would produce a Secret the bootstrap Jobs then
authenticate with, and the mistake would surface as an opaque PostgreSQL
authentication error inside a Job instead of at render time. Only the halves
that are actually inline are demanded: an operator who points one half at an
external Secret is not asked for the other's inline value.

The check is a `fail` here rather than a `required` on each data line below.
`required` inline on a `DB_*PASSWORD*` key is the shape the repo's
`dual-secret-infra-password` rule flags whenever the bundled `postgresql`
subchart is declared, because that combination normally means the chart keeps
its own copy of a password the subchart already owns. It does not mean that
here - these credentials belong to `global.externalPostgresDefinitions`, the
EXTERNAL Postgres path, which is mutually exclusive with the bundled subchart -
but the rule matches on the text of the data line. Validating up front keeps
the guard's behaviour identical (render fails, message names the key) without
asserting a single-sourcing claim the rule cannot verify.
*/}}
{{- if $inlineAdmin }}
{{- if not $admin.username }}
{{- fail "plugin-br-pix-lerian: global.externalPostgresDefinitions.postgresAdminLogin.username is required when postgresAdminLogin.useExistingSecret.name is empty. Set the admin username, or point useExistingSecret.name at a Secret carrying DB_USER_ADMIN and DB_ADMIN_PASSWORD." }}
{{- end }}
{{- if not $admin.password }}
{{- fail "plugin-br-pix-lerian: global.externalPostgresDefinitions.postgresAdminLogin.password is required when postgresAdminLogin.useExistingSecret.name is empty. Set the admin password, or point useExistingSecret.name at a Secret carrying DB_USER_ADMIN and DB_ADMIN_PASSWORD." }}
{{- end }}
{{- end }}
{{- if $inlineCreds }}
{{- if not $creds.password }}
{{- fail "plugin-br-pix-lerian: global.externalPostgresDefinitions.pixLerianCredentials.password is required when pixLerianCredentials.useExistingSecret.name is empty. Set the application role password, or point useExistingSecret.name at a Secret carrying DB_PASSWORD_PIX_LERIAN." }}
{{- end }}
{{- end }}
{{- if or $inlineAdmin $inlineCreds }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-pix-lerian.name" $ }}-bootstrap-postgres
  namespace: {{ include "global.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-lerian.labels" (dict "context" $ "component" "bootstrap-postgres") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  {{- /* Non-empty by the guard above; no key is written as an empty string. */}}
  {{- if $inlineAdmin }}
  DB_USER_ADMIN: {{ $admin.username | quote }}
  DB_ADMIN_PASSWORD: {{ $admin.password | quote }}
  {{- end }}
  {{- if $inlineCreds }}
  DB_PASSWORD_PIX_LERIAN: {{ $creds.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
