name: Helm Release

on:
  push:
    branches:
      - main
      # Chart line branches for legacy patches, e.g. maintenance/midaz-5.7.x.
      # maintenance/* is the convention; hotfix/* stays accepted so lines created
      # under the old prefix keep releasing until they are renamed.
      - 'maintenance/*.x'
      - 'hotfix/*.x'
    paths-ignore:
      - 'README.md'
      - '**/CHANGELOG.md'
      - '.github/workflows/**'
      - '.github/configs/**'
      - '.gitignore'
      - '**/docs/**'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  get-changed-paths:
    if: github.actor != 'lerian-studio-midaz-push-bot[bot]'
    name: Get Changed Paths
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.restrict.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed paths
        id: changed-paths
        uses: LerianStudio/github-actions-shared-workflows/src/config/changed-paths@tier-2
        with:
          # No trailing slash. This composite matches "<filter>" or "<filter>/*",
          # where the archived action did a plain prefix match, so "charts/"
          # would match nothing here and empty the matrix without saying so.
          filter-paths: charts
          get-app-name: true
          path-level: 2

      # On a chart line the range comes from the branch's own committed .releaserc,
      # written by whoever cut the line (Severino's create_chart_line) and reviewable
      # like any other file. The branch name is only checked against it: a name alone
      # never decides what gets published, and a line whose .releaserc was never
      # edited for it is refused rather than released under main's config.
      - name: Restrict matrix on chart line branches
        id: restrict
        env:
          MATRIX: ${{ steps.changed-paths.outputs.matrix }}
          REF_NAME: ${{ github.ref_name }}
          RELEASERC: .github/configs/.releaserc.json
        run: |
          set -euo pipefail

          CHART=""
          RANGE=""

          case "${REF_NAME}" in
            maintenance/*.x|hotfix/*.x)
              STEM="${REF_NAME#*/}"
              # Leading zeros are rejected: semver reads 01.02.x as an invalid range
              CHART=$(printf '%s' "${STEM}" | sed -nE 's/^(.+)-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.x$/\1/p')
              RANGE=$(printf '%s' "${STEM}" | sed -nE 's/^.+-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.x)$/\1/p')

              # The trigger glob is looser than this parser, so a branch such as
              # maintenance/foo.x or maintenance/midaz-5.x reaches here unparsed.
              # Falling through would release every changed chart without a range.
              if [ -z "${CHART}" ] || [ -z "${RANGE}" ]; then
                echo "::error::'${REF_NAME}' looks like a chart line branch but does not match <chart>-<major>.<minor>.x — refusing to release"
                exit 1
              fi
              ;;
          esac

          if [ -z "${CHART}" ]; then
            echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exactly one entry: semantic-release would take the first of two, and which
          # one that is should not be a question anybody has to answer.
          DECLARED=$(jq -r --arg branch "${REF_NAME}" \
            '[.branches[] | objects | select(.name == $branch) | .range // ""] | if length == 1 then .[0] else "" end' \
            "${RELEASERC}")
          if [ -z "${DECLARED}" ]; then
            echo "::error::${RELEASERC} does not declare '${REF_NAME}' exactly once with a range — this chart line's .releaserc was never set up for it, refusing to release"
            exit 1
          fi
          if [ "${DECLARED}" != "${RANGE}" ]; then
            echo "::error::${RELEASERC} declares range ${DECLARED} for '${REF_NAME}', but the branch name says ${RANGE} — refusing to release until they agree"
            exit 1
          fi

          echo "::notice::Chart line branch — restricting the release matrix to '${CHART}' in range ${DECLARED}"

          # A chart line branch releases only its own chart. Anything else that
          # changed on the branch would be released with the wrong version range.
          RESTRICTED=$(printf '%s' "${MATRIX}" | jq -c --arg chart "${CHART}" '[.[] | select(.name == $chart)]')

          if [ "${RESTRICTED}" = "[]" ]; then
            echo "::notice::No change to charts/${CHART} in this push — nothing to release"
          fi

          echo "matrix=${RESTRICTED}" >> "$GITHUB_OUTPUT"

  release-helm-chart:
    needs: get-changed-paths
    name: Release Helm Chart
    if: needs.get-changed-paths.outputs.matrix != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.get-changed-paths.outputs.matrix) }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private-key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Last Changes
        run: git pull origin ${{ github.ref_name }}

      - name: Set up Helm
        id: setup-helm
        continue-on-error: true
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Homebrew
        id: setup-homebrew
        if: ${{ steps.setup-helm.outcome == 'failure' }}
        uses: Homebrew/actions/setup-homebrew@f119db709c0cd61731df77f0dd22c87511ee9b6a

      - name: Install Helm
        id: install-helm
        if: ${{ steps.setup-helm.outcome == 'failure' }}
        shell: bash
        run: |
          brew install helm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.21'
          cache-dependency-path: .github/scripts/go.sum

      - name: Helm Dependency Update
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: helm dependency update "$CHART_WORKING_DIR"

      - name: Helm Lint
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: helm lint "$CHART_WORKING_DIR"

      - name: Render Helm Chart
        working-directory: .github/scripts
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: |
          chart_name="$(basename "$CHART_WORKING_DIR")"
          go run ./validate-helm-charts --root ../.. --render-gate --charts "$chart_name"

      #- name: Run helm unittest
      #  id: unittest
      #  run: |
      #    helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false
      #    helm unittest ${{ matrix.chart.working_dir }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u lerianstudio --password-stdin

      # `helm registry login` writes to Helm's own registry config, which the Docker
      # CLI never reads. The image gate below inspects manifests through the Docker
      # CLI, so GHCR needs a login there as well.
      - name: Log in to GitHub Container Registry (Docker CLI)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: lerianstudio
          password: ${{ secrets.GITHUB_TOKEN }}

      # Last gate before the release runs. `helm lint` and the render gate above prove
      # the chart is well-formed; neither one looks at whether the images it points to
      # were ever published. A migration image whose tag is inherited from the app tag
      # is the recurring case: the chart renders perfectly and the install fails on
      # ImagePullBackOff. Failing here leaves the chart unpublished, because the tag,
      # the changelog and the `helm push` all happen inside the semantic-release step
      # further down.
      - name: Verify referenced images exist
        uses: LerianStudio/github-actions-shared-workflows/src/validate/helm-image-refs@develop
        with:
          chart-path: ${{ matrix.chart.working_dir }}
          values-file: .github/configs/helm-render-values/${{ matrix.chart.name }}.yaml

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_committer_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          git_committer_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build scripts
        run: |
          cd .github/scripts
          go build -o update-chart-version-readme-bin ./update-chart-version-readme

      # The committed .github/configs/.releaserc.json is the whole config, used as it
      # is. It is placed in the chart dir only because semantic-release (cosmiconfig 9,
      # searchStrategy "none") reads its config from the cwd and nowhere above it — the
      # copy is byte-identical, nothing is filled in here.
      #
      # Everything in it is relative to the chart dir, so one file serves every chart:
      # chartPath ".", the git assets, and the exec commands, which read the chart name
      # off $PWD. The tag format comes from semantic-release-monorepo, which the file
      # extends: `<package.json name>-v${version}`, hence the package.json below.
      #
      # On a chart line the file is the line's own, edited once when the line was cut;
      # get-changed-paths has already refused a line whose file does not declare it.
      - name: Place the committed .releaserc
        env:
          CHART_PATH: ${{ matrix.chart.working_dir }}
        run: |
          set -euo pipefail

          # cosmiconfig reads .releaserc before .releaserc.json, so a config committed
          # inside the chart would silently win over the one this step places.
          for existing in "$CHART_PATH"/.releaserc "$CHART_PATH"/.releaserc.*; do
            if [ -e "$existing" ]; then
              echo "::error::${existing} exists — the release config is .github/configs/.releaserc.json, a chart may not carry its own"
              exit 1
            fi
          done

          cp .github/configs/.releaserc.json "$CHART_PATH/.releaserc.json"
          jq . "$CHART_PATH/.releaserc.json"

      # The name is the chart directory, written rather than left to `npm init -y`: npm
      # rewrites some names (it strips a leading "node-" and a trailing ".js"/"-js"),
      # and the name IS the tag prefix, so a rewrite would cut tags nothing reads.
      - name: Init ephemeral package.json
        working-directory: ${{ matrix.chart.working_dir }}
        env:
          CHART_NAME: ${{ matrix.chart.name }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            jq -n --arg name "$CHART_NAME" '{name: $name, version: "0.0.0", private: true}' > package.json
          fi
          NAME=$(jq -r '.name // ""' package.json)
          if [ "$NAME" != "$CHART_NAME" ]; then
            echo "::error::package.json names '${NAME}', not '${CHART_NAME}' — the tags would be cut as ${NAME}-v*"
            exit 1
          fi

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        id: semantic_changelog
        with:
          working_directory: ${{ matrix.chart.working_dir }}
          ci: false
          semantic_version: 23.0.8
          extra_plugins: |
            conventional-changelog-conventionalcommits@v7.0.2
            semantic-release-monorepo@8.0.2
            semantic-release-helm3
            @semantic-release/exec@6.0.3
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}

      # What this leg published, recorded by the leg itself. A matrix cannot
      # report a value per leg — every leg writes the same job output and the
      # last one wins — so each leg leaves its result as an artifact instead.
      - name: Record what this leg published
        if: steps.semantic_changelog.outputs.new_release_published == 'true'
        env:
          CHART: ${{ matrix.chart.name }}
          WORKING_DIR: ${{ matrix.chart.working_dir }}
          VERSION: ${{ steps.semantic_changelog.outputs.new_release_version }}
        run: |
          set -euo pipefail

          # The published artifact is the Chart.yaml `name`, which carries a
          # -helm suffix the directory does not: charts/midaz publishes as
          # midaz-helm. The deployment matrix in the GitOps repository, on the
          # other hand, is keyed by the directory.
          artifact=$(awk '
            /^name:/ {
              sub(/^name:[ \t]*/, ""); sub(/[ \t]*#.*$/, "")
              gsub(/^["'"'"']|["'"'"']$/, ""); sub(/[ \t]+$/, "")
              print; exit
            }' "${WORKING_DIR}/Chart.yaml")

          if [ -z "$artifact" ]; then
            echo "::error::Could not read the chart name from ${WORKING_DIR}/Chart.yaml"
            exit 1
          fi

          mkdir -p published
          jq -n --arg name "$CHART" --arg artifact "$artifact" --arg version "$VERSION" \
            '{name: $name, artifact: $artifact, version: $version}' \
            | tee "published/${CHART}.json"

      - name: Upload what this leg published
        if: steps.semantic_changelog.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.chart.name }}
          path: published/${{ matrix.chart.name }}.json
          retention-days: 1



      # Only deployable Lerian PRODUCTS/PLUGINS belong in the Plugin Lifecycle
      # Management. Two chart kinds are exempt and must NOT be registered there:
      #   1. Library charts (type: library) — consumed by other charts, not deployable.
      #   2. Dependency wrappers (annotation lerian.studio/chart-type: dependency-wrapper,
      #      e.g. lerian-consul) — they deploy third-party infra we curate, not a Lerian
      #      product to register/announce as a release.
      - name: Detect lifecycle-exempt chart
        id: chart-kind
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: |
          # YAML-aware: read the parsed .type and .annotations["lerian.studio/chart-type"]
          # so quoted scalars, inline comments and flow mappings are handled and the match is
          # scoped to the real keys (a grep could match the same text in a comment/other scalar).
          SKIP=$(python3 -c 'import yaml,sys; c=yaml.safe_load(open(sys.argv[1])) or {}; print("true" if (str(c.get("type","")).lower()=="library" or (c.get("annotations") or {}).get("lerian.studio/chart-type")=="dependency-wrapper") else "false")' "$CHART_WORKING_DIR/Chart.yaml")
          echo "skip_lifecycle=$SKIP" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" = "true" ]; then
            echo "::notice::$CHART_WORKING_DIR is lifecycle-exempt (library or dependency-wrapper) — skipping Plugin Lifecycle Management."
          fi

      - name: Publish Release in Plugin Lifecycle Management
        if: github.ref == 'refs/heads/main' && steps.chart-kind.outputs.skip_lifecycle != 'true'
        uses: LerianStudio/github-actions-shared-workflows/src/deploy/lifecycle-management-publish@v1.57.0
        with:
          chart-name: "${{ matrix.chart.name }}"
          application-ids: ${{ vars.APPLICATION_IDS }}
          lifecycle-api-token: ${{ secrets.LIFECYCLE_API_TOKEN }}
          working-directory: ${{ matrix.chart.working_dir }}

  notify-release:
    needs:
      - get-changed-paths
      - release-helm-chart
    name: 📢 Release Notification
    if: needs.get-changed-paths.outputs.matrix != '[]' && github.ref == 'refs/heads/main'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.get-changed-paths.outputs.matrix) }}
    uses: ./.github/workflows/release-notification.yml
    with:
      chart_name: ${{ matrix.chart.name }}
      chart_path: ${{ matrix.chart.working_dir }}
    secrets:
      SLACK_BOT_TOKEN_HELM: ${{ secrets.SLACK_BOT_TOKEN_HELM }}
      SLACK_CHANNEL_OPS: ${{ secrets.SLACK_CHANNEL_OPS }}
      SLACK_GROUP_TECH_SUPPORT: ${{ secrets.SLACK_GROUP_TECH_SUPPORT }}

  # ---------------------------------------------------------------------------
  # Pin the freshly published charts into the GitOps repository.
  #
  # Only from the default branch. The maintenance/*.x lines also release, but
  # their versions are not what the internal tier should track: a maintenance
  # release of an older line would pin the environments *backwards*.
  # ---------------------------------------------------------------------------
  collect-published-charts:
    name: Collect Published Charts
    needs: [get-changed-paths, release-helm-chart]
    if: >-
      needs.get-changed-paths.outputs.matrix != '[]' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ vars.GENERAL_RUNNERS || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      # No checkout: every version comes from the leg that published it, so
      # there is no working tree to read and no token to persist.
      - name: Download what each leg published
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*
          path: published
          merge-multiple: true

      - name: Collect them into one matrix
        id: collect
        run: |
          set -euo pipefail

          # download-artifact does not create the directory when its pattern
          # matches nothing, which is a legitimate outcome rather than an error.
          mkdir -p published

          # Empty when no chart in this run produced a release — semantic-release
          # finds nothing releasable on a docs-only or chore-only change.
          MATRIX=$(find published -name '*.json' -type f -print0 2>/dev/null \
            | sort -z \
            | xargs -0 --no-run-if-empty jq -s -c '.' \
            || echo '[]')
          MATRIX=${MATRIX:-[]}

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          printf '%s' "$MATRIX" | jq .

  update-gitops:
    name: Update GitOps
    needs: collect-published-charts
    if: needs.collect-published-charts.outputs.matrix != '[]'
    strategy:
      # Serial: every leg commits to the same GitOps repository, and racing
      # pushes would spend the composite's single rebase retry on each other.
      max-parallel: 1
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.collect-published-charts.outputs.matrix) }}
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/gitops-chart-update.yml@tier-2
    with:
      chart_name: ${{ matrix.chart.name }}
      chart_version: ${{ matrix.chart.version }}
      # Environments pinned to a different OCI repository — the alpha/ and
      # alpha-internal/ channels — are left alone: the composite only edits
      # releases whose chart matches this reference exactly.
      chart_ref: oci://ghcr.io/lerianstudio/${{ matrix.chart.artifact }}
    # Named rather than inherited: this job hands credentials to another
    # repository's workflow, and `inherit` would pass everything this release
    # holds — the Slack tokens, the App key — not the six it needs.
    secrets:
      MANAGE_TOKEN: ${{ secrets.MANAGE_TOKEN }}
      ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
      LERIAN_CI_CD_USER_GPG_KEY: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
      LERIAN_CI_CD_USER_GPG_KEY_PASSWORD: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
      LERIAN_CI_CD_USER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
      LERIAN_CI_CD_USER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
