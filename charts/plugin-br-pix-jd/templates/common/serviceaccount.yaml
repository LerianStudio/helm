{{- /* Shared by api and worker — a genuinely common resource, which is why it lives
   under templates/common/ per the repository chart standard. The annotations slot
   is where an IRSA / Roles Anywhere role ARN goes for the AWS Secrets Manager
   access the multi-tenant profile needs. */ -}}
{{- if .Values.serviceAccount.create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" (fromYaml (include "plugin-br-pix-jd.withCommonAnnotations" (dict "root" $ "block" .Values.serviceAccount)))
      "name" (include "plugin-br-pix-jd.serviceAccountName" .)
      "namespace" (include "plugin-br-pix-jd.namespace" $)
      "labels" (include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "common"))) }}
{{- end }}
