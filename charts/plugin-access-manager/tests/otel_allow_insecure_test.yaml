    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: env-wide reason

  - it: 'auth: a refusal renders in the ConfigMap as is'
    template: templates/auth/configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      auth.configmap.ALLOW_INSECURE_OTEL: ""
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: ""

  - it: 'auth: the ConfigMap carries nothing when both are unset'
    template: templates/auth/configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notExists:
          path: data.ALLOW_INSECURE_OTEL

  - it: 'auth: the legacy extraEnvVars key renders it in the ConfigMap instead'
    template: templates/auth/configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      auth.extraEnvVars.ALLOW_INSECURE_OTEL: "operator reason"
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: operator reason

