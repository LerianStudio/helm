{{- if and .Values.tracer.enabled (not .Values.tracer.useExistingSecret) }}
{{- /*
Multi-tenant validation: when MULTI_TENANT_ENABLED=true the app refuses to start
without MULTI_TENANT_SERVICE_API_KEY. Fail the helm render with a clear message
instead of letting the pod crashloop on missing config.
*/ -}}
{{- if eq (.Values.tracer.configmap.MULTI_TENANT_ENABLED | default "false" | toString) "true" }}
{{- if not .Values.tracer.secrets.MULTI_TENANT_SERVICE_API_KEY }}
{{- fail "tracer.secrets.MULTI_TENANT_SERVICE_API_KEY is required when MULTI_TENANT_ENABLED=true" }}
{{- end }}
{{- end }}
{{- $pg := .Values.postgresql | default dict }}
{{- $pgAuth := $pg.auth | default dict }}
{{- $pgInternal := or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
type: Opaque
data:
  # -- Default sensitive variables for Tracer

  # PostgreSQL Secrets
  # DB_PASSWORD is single-sourced from the Bitnami postgresql subchart Secret
  # (<release>-postgresql, key `password`) and injected via secretKeyRef on the
  # Tracer Deployment. It is only emitted here when PostgreSQL is EXTERNAL
  # (postgresql disabled or .external=true) without an existingSecret override,
  # and the operator supplied tracer.secrets.DB_PASSWORD.
  {{- if and (not $pgInternal) .Values.tracer.secrets.DB_PASSWORD }}
  DB_PASSWORD: {{ .Values.tracer.secrets.DB_PASSWORD | b64enc | quote }}
  {{- end }}

  # API KEY (read by the app as $API_KEY when API_KEY_ENABLED=true)
  {{- if .Values.tracer.secrets.API_KEY }}
  API_KEY: {{ .Values.tracer.secrets.API_KEY | b64enc | quote }}
  {{- end }}

  # MULTI-TENANT SECRETS (operator-provided when MULTI_TENANT_ENABLED=true)
  {{- if .Values.tracer.secrets.MULTI_TENANT_SERVICE_API_KEY }}
  MULTI_TENANT_SERVICE_API_KEY: {{ .Values.tracer.secrets.MULTI_TENANT_SERVICE_API_KEY | b64enc | quote }}
  {{- end }}
  {{- if .Values.tracer.secrets.MULTI_TENANT_REDIS_PASSWORD }}
  MULTI_TENANT_REDIS_PASSWORD: {{ .Values.tracer.secrets.MULTI_TENANT_REDIS_PASSWORD | b64enc | quote }}
  {{- end }}
{{- end }}
