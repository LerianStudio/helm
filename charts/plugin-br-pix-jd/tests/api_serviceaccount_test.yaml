suite: the api's own service account
templates:
  - templates/api/configmap.yaml
  - templates/api/deployment.yaml
  - templates/api/serviceaccount.yaml
  - templates/worker/configmap.yaml
  - templates/worker/deployment.yaml
  - templates/api/secrets.yaml
  - templates/worker/secrets.yaml
release:
  name: pix-jd
  namespace: pix-jd
set:
  api.configmap.REDIS_HOST: "valkey:6379"
  api.configmap.POSTGRES_HOST: postgresql
  api.configmap.ENVIRONMENT_NAME: development
  api.secrets.LICENSE_KEY: x
  api.secrets.POSTGRES_PASSWORD: x
  worker.enabled: true
tests:
  - it: keeps the shared account for the api by default
    template: templates/api/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: plugin-br-pix-jd
  - it: renders no api account by default
    template: templates/api/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: gives only the api its own account when created
    set:
      api.serviceAccount.create: true
      api.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::1:role/api
    asserts:
      - equal:
          path: metadata.name
          value: plugin-br-pix-jd-api
        template: templates/api/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: plugin-br-pix-jd-api
        template: templates/api/deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: plugin-br-pix-jd
        template: templates/worker/deployment.yaml
  - it: uses a named existing account for the api without creating one
    set:
      api.serviceAccount.name: existing-api
    asserts:
      - hasDocuments:
          count: 0
        template: templates/api/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-api
        template: templates/api/deployment.yaml
