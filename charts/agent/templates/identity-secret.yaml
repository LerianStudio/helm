{{- $name := include "lerian-agent.name" . -}}
{{- $identityName := printf "%s-identity" $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $identityName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lerian-agent.labels" . | nindent 4 }}
  annotations:
    # The identity outlives the release that first enrolled it. A later install
    # carrying another enrollment token sees the old fingerprint and replaces
    # the payload instead of adopting the previous agent.
    helm.sh/resource-policy: keep
type: Opaque
# Keep every release revision's declared payload identical. Helm's three-way
# patch then has no data change to apply on upgrade or rollback, so keys written
# by the agent in the live object are preserved instead of becoming release
# history that an older revision can restore over them.
data: {}
