{{- if .Values.global.externalPostgresDefinitions.enabled }}
{{- $defs := .Values.global.externalPostgresDefinitions -}}
{{- $adminManaged := not $defs.postgresAdminLogin.useExistingSecret.name -}}
{{- $hubManaged := not $defs.hubCredentials.useExistingSecret.name -}}
{{- if or $adminManaged $hubManaged }}
{{/*
Chart-managed credential Secret for the bootstrap-postgres Job. When no existing
Secret is supplied for the admin / hub credentials, the raw passwords MUST NOT be
inlined as `value:` on the Job (they would be persisted verbatim in the rendered
Job manifest and the Helm release / ArgoCD state, readable via `kubectl get job
-o yaml`). This Secret holds them so bootstrap-postgres can reference them via
secretKeyRef — the same posture as migration-secret.yaml and the app Secret.

PreSync hook at weight -15 / sync-wave -15 so it exists BEFORE the bootstrap Job
(-10) that reads it. Delete policy is before-hook-creation ONLY (NOT
hook-succeeded): the Secret is consumed by a LATER hook, and Helm/ArgoCD mark a
Secret "succeeded" the instant it applies, so hook-succeeded would delete it
before the -10 Job can read it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streaming-hub.fullname" . }}-bootstrap
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "streaming-hub.labels" (dict "context" . "component" "bootstrap") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-15"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
type: Opaque
data:
  {{- if $adminManaged }}
  DB_ADMIN_PASSWORD: {{ required "global.externalPostgresDefinitions.postgresAdminLogin.password is required when the bootstrap Job runs without postgresAdminLogin.useExistingSecret.name" $defs.postgresAdminLogin.password | b64enc | quote }}
  {{- end }}
  {{- if $hubManaged }}
  DB_PASSWORD_HUB: {{ required "global.externalPostgresDefinitions.hubCredentials.password is required when the bootstrap Job runs without hubCredentials.useExistingSecret.name" $defs.hubCredentials.password | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
