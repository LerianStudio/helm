apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-payments-helm.fullname" . }}-app
  labels:
    {{- include "plugin-br-payments-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
type: Opaque
data:
  COLLECTIONS_CURSOR_HMAC_KEY: {{ .Values.app.secrets.COLLECTIONS_CURSOR_HMAC_KEY | default "" | b64enc | quote }}
  COLLECTIONS_PCR_CLIENT_SECRET: {{ .Values.app.secrets.COLLECTIONS_PCR_CLIENT_SECRET | default "" | b64enc | quote }}
  COLLECTIONS_POSTGRES_PASSWORD: {{ .Values.app.secrets.COLLECTIONS_POSTGRES_PASSWORD | default "" | b64enc | quote }}
  SANDBOX_FAKEBTG_ADMIN_KEY: {{ .Values.app.secrets.SANDBOX_FAKEBTG_ADMIN_KEY | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.app.extraSecretVars }}
  {{- toYaml .Values.app.extraSecretVars | nindent 2 }}
  {{- end }}
