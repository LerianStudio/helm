{{- /*
  Keys the chart renders itself: computed defaults (hosts derived from the
  release name), `| default` fallbacks and conditional groups. Parsed back into
  a map below so it can be merged with matcher.configmap.
*/}}
{{- define "matcher.configmapExplicit" -}}
# Application Settings
DEPLOYMENT_MODE: {{ required "matcher.configmap.DEPLOYMENT_MODE is required: set it to saas, byoc or local" .Values.matcher.configmap.DEPLOYMENT_MODE | quote }}
ALLOW_INSECURE_TLS: {{ .Values.matcher.configmap.ALLOW_INSECURE_TLS | default "true" | quote }}
ENV_NAME: {{ .Values.matcher.configmap.ENV_NAME | default "production" | quote }}
LOG_LEVEL: {{ .Values.matcher.configmap.LOG_LEVEL | default "info" | quote }}
SERVER_ADDRESS: {{ .Values.matcher.configmap.SERVER_ADDRESS | default ":8080" | quote }}
HTTP_BODY_LIMIT_BYTES: {{ .Values.matcher.configmap.HTTP_BODY_LIMIT_BYTES | default "104857600" | quote }}
{{- if .Values.matcher.configmap.GOMEMLIMIT }}
# Go soft memory limit. Set explicitly (~85% of pod memory limit): Go 1.26 does
# not auto-detect cgroup memory limits. Only emitted when set (opt-in knob).
GOMEMLIMIT: {{ .Values.matcher.configmap.GOMEMLIMIT | quote }}
{{- end }}

# CORS Configuration
CORS_ALLOWED_ORIGINS: {{ .Values.matcher.configmap.CORS_ALLOWED_ORIGINS | default "*" | quote }}
CORS_ALLOWED_METHODS: {{ .Values.matcher.configmap.CORS_ALLOWED_METHODS | default "GET,POST,PUT,PATCH,DELETE,OPTIONS" | quote }}
CORS_ALLOWED_HEADERS: {{ .Values.matcher.configmap.CORS_ALLOWED_HEADERS | default "Origin,Content-Type,Accept,Authorization,X-Request-ID" | quote }}

# TLS Configuration
TLS_TERMINATED_UPSTREAM: {{ .Values.matcher.configmap.TLS_TERMINATED_UPSTREAM | default "true" | quote }}

# Multi-Tenancy
DEFAULT_TENANT_ID: {{ .Values.matcher.configmap.DEFAULT_TENANT_ID | default "11111111-1111-1111-1111-111111111111" | quote }}
DEFAULT_TENANT_SLUG: {{ .Values.matcher.configmap.DEFAULT_TENANT_SLUG | default "default" | quote }}
MULTI_TENANT_ENABLED: {{ .Values.matcher.configmap.MULTI_TENANT_ENABLED | default "false" | quote }}
{{- if eq (.Values.matcher.configmap.MULTI_TENANT_ENABLED | default "false" | toString) "true" }}
MULTI_TENANT_URL: {{ .Values.matcher.configmap.MULTI_TENANT_URL | quote }}
MULTI_TENANT_ENVIRONMENT: {{ .Values.matcher.configmap.MULTI_TENANT_ENVIRONMENT | quote }}
MULTI_TENANT_MAX_TENANT_POOLS: {{ .Values.matcher.configmap.MULTI_TENANT_MAX_TENANT_POOLS | default "100" | quote }}
MULTI_TENANT_IDLE_TIMEOUT_SEC: {{ .Values.matcher.configmap.MULTI_TENANT_IDLE_TIMEOUT_SEC | default "300" | quote }}
MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD: {{ .Values.matcher.configmap.MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD | default "5" | quote }}
MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC: {{ .Values.matcher.configmap.MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC | default "30" | quote }}
{{- end }}

# PostgreSQL Primary
POSTGRES_HOST: {{ .Values.matcher.configmap.POSTGRES_HOST | default (printf "%s-%s.%s.svc.cluster.local." (include "common.names.dependency.fullname" (dict "chartName" "postgresql" "chartValues" .Values.postgresql "context" .)) (.Values.postgresql.primary.name | default "primary") .Release.Namespace) | quote }}
POSTGRES_PORT: {{ .Values.matcher.configmap.POSTGRES_PORT | default "5432" | quote }}
POSTGRES_USER: {{ .Values.matcher.configmap.POSTGRES_USER | default "matcher" | quote }}
POSTGRES_DB: {{ .Values.matcher.configmap.POSTGRES_DB | default "matcher" | quote }}
POSTGRES_SSLMODE: {{ .Values.matcher.configmap.POSTGRES_SSLMODE | default "disable" | quote }}
POSTGRES_MAX_OPEN_CONNS: {{ .Values.matcher.configmap.POSTGRES_MAX_OPEN_CONNS | default "25" | quote }}
POSTGRES_MAX_IDLE_CONNS: {{ .Values.matcher.configmap.POSTGRES_MAX_IDLE_CONNS | default "5" | quote }}
POSTGRES_CONN_MAX_LIFETIME_MINS: {{ .Values.matcher.configmap.POSTGRES_CONN_MAX_LIFETIME_MINS | default "30" | quote }}
POSTGRES_CONN_MAX_IDLE_TIME_MINS: {{ .Values.matcher.configmap.POSTGRES_CONN_MAX_IDLE_TIME_MINS | default "5" | quote }}
POSTGRES_CONNECT_TIMEOUT_SEC: {{ .Values.matcher.configmap.POSTGRES_CONNECT_TIMEOUT_SEC | default "10" | quote }}
POSTGRES_QUERY_TIMEOUT_SEC: {{ .Values.matcher.configmap.POSTGRES_QUERY_TIMEOUT_SEC | default "30" | quote }}

# PostgreSQL Replica
POSTGRES_REPLICA_HOST: {{ .Values.matcher.configmap.POSTGRES_REPLICA_HOST | default (printf "%s-%s.%s.svc.cluster.local." (include "common.names.dependency.fullname" (dict "chartName" "postgresql" "chartValues" .Values.postgresql "context" .)) (.Values.postgresql.readReplicas.name | default "replication") .Release.Namespace) | quote }}
POSTGRES_REPLICA_PORT: {{ .Values.matcher.configmap.POSTGRES_REPLICA_PORT | default "5432" | quote }}
POSTGRES_REPLICA_USER: {{ .Values.matcher.configmap.POSTGRES_REPLICA_USER | default "matcher" | quote }}
POSTGRES_REPLICA_DB: {{ .Values.matcher.configmap.POSTGRES_REPLICA_DB | default "matcher" | quote }}
POSTGRES_REPLICA_SSLMODE: {{ .Values.matcher.configmap.POSTGRES_REPLICA_SSLMODE | default "disable" | quote }}

# Infrastructure Boot Timeout
INFRA_CONNECT_TIMEOUT_SEC: {{ .Values.matcher.configmap.INFRA_CONNECT_TIMEOUT_SEC | default "30" | quote }}

# Redis/Valkey Configuration
REDIS_HOST: {{ .Values.matcher.configmap.REDIS_HOST | default (printf "%s-primary.%s.svc.cluster.local.:6379" (include "common.names.dependency.fullname" (dict "chartName" "valkey" "chartValues" .Values.valkey "context" .)) .Release.Namespace) | quote }}
REDIS_DB: {{ .Values.matcher.configmap.REDIS_DB | default "0" | quote }}
REDIS_POOL_SIZE: {{ .Values.matcher.configmap.REDIS_POOL_SIZE | default "10" | quote }}
REDIS_MIN_IDLE_CONNS: {{ .Values.matcher.configmap.REDIS_MIN_IDLE_CONNS | default "2" | quote }}
REDIS_READ_TIMEOUT_MS: {{ .Values.matcher.configmap.REDIS_READ_TIMEOUT_MS | default "3000" | quote }}
REDIS_WRITE_TIMEOUT_MS: {{ .Values.matcher.configmap.REDIS_WRITE_TIMEOUT_MS | default "3000" | quote }}
REDIS_DIAL_TIMEOUT_MS: {{ .Values.matcher.configmap.REDIS_DIAL_TIMEOUT_MS | default "5000" | quote }}
REDIS_TLS: {{ .Values.matcher.configmap.REDIS_TLS | default "false" | quote }}
{{- if .Values.matcher.configmap.REDIS_MASTER_NAME }}
REDIS_MASTER_NAME: {{ .Values.matcher.configmap.REDIS_MASTER_NAME | quote }}
{{- end }}
{{- if .Values.matcher.configmap.REDIS_CA_CERT }}
REDIS_CA_CERT: {{ .Values.matcher.configmap.REDIS_CA_CERT | quote }}
{{- end }}

# RabbitMQ Configuration
RABBITMQ_URI: {{ .Values.matcher.configmap.RABBITMQ_URI | default "amqp" | quote }}
RABBITMQ_HOST: {{ .Values.matcher.configmap.RABBITMQ_HOST | default (printf "%s.%s.svc.cluster.local." (include "common.names.dependency.fullname" (dict "chartName" "rabbitmq" "chartValues" .Values.rabbitmq "context" .)) .Release.Namespace) | quote }}
RABBITMQ_PORT: {{ .Values.matcher.configmap.RABBITMQ_PORT | default "5672" | quote }}
RABBITMQ_USER: {{ .Values.matcher.configmap.RABBITMQ_USER | default "matcher" | quote }}
RABBITMQ_VHOST: {{ .Values.matcher.configmap.RABBITMQ_VHOST | default "/" | quote }}
RABBITMQ_HEALTH_URL: {{ .Values.matcher.configmap.RABBITMQ_HEALTH_URL | default (printf "http://%s.%s.svc.cluster.local.:15672" (include "common.names.dependency.fullname" (dict "chartName" "rabbitmq" "chartValues" .Values.rabbitmq "context" .)) .Release.Namespace) | quote }}

# Authentication (delegated to plugin-auth in app v4). Canonical names are
# PLUGIN_AUTH_*; the legacy AUTH_ENABLED / AUTH_SERVICE_ADDRESS values are still
# honored as a fallback so consumers can migrate their values without a lockstep
# break. The app also accepts both aliases at runtime.
PLUGIN_AUTH_ENABLED: {{ .Values.matcher.configmap.PLUGIN_AUTH_ENABLED | default .Values.matcher.configmap.AUTH_ENABLED | default "false" | quote }}
PLUGIN_AUTH_ADDRESS: {{ .Values.matcher.configmap.PLUGIN_AUTH_ADDRESS | default .Values.matcher.configmap.AUTH_SERVICE_ADDRESS | default "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local.:4000" | quote }}

# Public base URL
PUBLIC_BASE_HOST: {{ .Values.matcher.configmap.PUBLIC_BASE_HOST | default "" | quote }}
PUBLIC_BASE_SCHEMES: {{ .Values.matcher.configmap.PUBLIC_BASE_SCHEMES | default "https" | quote }}

# Swagger Documentation
SWAGGER_ENABLED: {{ .Values.matcher.configmap.SWAGGER_ENABLED | default "false" | quote }}

# OpenTelemetry
ENABLE_TELEMETRY: {{ .Values.matcher.configmap.ENABLE_TELEMETRY | default "false" | quote }}
OTEL_LIBRARY_NAME: {{ .Values.matcher.configmap.OTEL_LIBRARY_NAME | default "github.com/LerianStudio/matcher" | quote }}
OTEL_RESOURCE_SERVICE_NAME: {{ .Values.matcher.configmap.OTEL_RESOURCE_SERVICE_NAME | default "matcher" | quote }}
OTEL_RESOURCE_SERVICE_VERSION: {{ .Values.matcher.image.tag | default .Chart.AppVersion | quote }}
OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.matcher.configmap.OTEL_EXPORTER_OTLP_ENDPOINT | default "" | quote }}
OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT: {{ .Values.matcher.configmap.OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT | default "production" | quote }}

# Rate Limiting
RATE_LIMIT_ENABLED: {{ .Values.matcher.configmap.RATE_LIMIT_ENABLED | default "true" | quote }}
RATE_LIMIT_MAX: {{ .Values.matcher.configmap.RATE_LIMIT_MAX | default "100" | quote }}
RATE_LIMIT_EXPIRY_SEC: {{ .Values.matcher.configmap.RATE_LIMIT_EXPIRY_SEC | default "60" | quote }}
EXPORT_RATE_LIMIT_MAX: {{ .Values.matcher.configmap.EXPORT_RATE_LIMIT_MAX | default "10" | quote }}
EXPORT_RATE_LIMIT_EXPIRY_SEC: {{ .Values.matcher.configmap.EXPORT_RATE_LIMIT_EXPIRY_SEC | default "60" | quote }}
DISPATCH_RATE_LIMIT_MAX: {{ .Values.matcher.configmap.DISPATCH_RATE_LIMIT_MAX | default "50" | quote }}
DISPATCH_RATE_LIMIT_EXPIRY_SEC: {{ .Values.matcher.configmap.DISPATCH_RATE_LIMIT_EXPIRY_SEC | default "60" | quote }}

# Database Metrics
DB_METRICS_INTERVAL_SEC: {{ .Values.matcher.configmap.DB_METRICS_INTERVAL_SEC | default "15" | quote }}

# Idempotency & Deduplication
IDEMPOTENCY_RETRY_WINDOW_SEC: {{ .Values.matcher.configmap.IDEMPOTENCY_RETRY_WINDOW_SEC | default "300" | quote }}
IDEMPOTENCY_SUCCESS_TTL_HOURS: {{ .Values.matcher.configmap.IDEMPOTENCY_SUCCESS_TTL_HOURS | default "168" | quote }}
DEDUPE_TTL_SEC: {{ .Values.matcher.configmap.DEDUPE_TTL_SEC | default "3600" | quote }}

# Object Storage (S3-compatible)
OBJECT_STORAGE_ENDPOINT: {{ .Values.matcher.configmap.OBJECT_STORAGE_ENDPOINT | default (printf "http://matcher-seaweedfs.%s.svc.cluster.local.:8333" .Release.Namespace) | quote }}
OBJECT_STORAGE_REGION: {{ .Values.matcher.configmap.OBJECT_STORAGE_REGION | default "us-east-1" | quote }}
OBJECT_STORAGE_BUCKET: {{ .Values.matcher.configmap.OBJECT_STORAGE_BUCKET | default "matcher-exports" | quote }}
OBJECT_STORAGE_USE_PATH_STYLE: {{ .Values.matcher.configmap.OBJECT_STORAGE_USE_PATH_STYLE | default "true" | quote }}

# Export Worker (runs as goroutine in same process)
EXPORT_WORKER_ENABLED: {{ .Values.matcher.configmap.EXPORT_WORKER_ENABLED | default "true" | quote }}
EXPORT_WORKER_POLL_INTERVAL_SEC: {{ .Values.matcher.configmap.EXPORT_WORKER_POLL_INTERVAL_SEC | default "5" | quote }}
EXPORT_WORKER_PAGE_SIZE: {{ .Values.matcher.configmap.EXPORT_WORKER_PAGE_SIZE | default "1000" | quote }}
EXPORT_PRESIGN_EXPIRY_SEC: {{ .Values.matcher.configmap.EXPORT_PRESIGN_EXPIRY_SEC | default "3600" | quote }}

# Webhook Configuration
WEBHOOK_TIMEOUT_SEC: {{ .Values.matcher.configmap.WEBHOOK_TIMEOUT_SEC | default "30" | quote }}

# Callback Rate Limiting
CALLBACK_RATE_LIMIT_PER_MIN: {{ .Values.matcher.configmap.CALLBACK_RATE_LIMIT_PER_MIN | default "60" | quote }}

# Cleanup Worker
CLEANUP_WORKER_ENABLED: {{ .Values.matcher.configmap.CLEANUP_WORKER_ENABLED | default "true" | quote }}
CLEANUP_WORKER_INTERVAL_SEC: {{ .Values.matcher.configmap.CLEANUP_WORKER_INTERVAL_SEC | default "3600" | quote }}
CLEANUP_WORKER_BATCH_SIZE: {{ .Values.matcher.configmap.CLEANUP_WORKER_BATCH_SIZE | default "100" | quote }}
CLEANUP_WORKER_GRACE_PERIOD_SEC: {{ .Values.matcher.configmap.CLEANUP_WORKER_GRACE_PERIOD_SEC | default "3600" | quote }}

# Scheduler
SCHEDULER_INTERVAL_SEC: {{ .Values.matcher.configmap.SCHEDULER_INTERVAL_SEC | default "60" | quote }}

# Archival Worker
ARCHIVAL_WORKER_ENABLED: {{ .Values.matcher.configmap.ARCHIVAL_WORKER_ENABLED | default "false" | quote }}
{{- if eq (.Values.matcher.configmap.ARCHIVAL_WORKER_ENABLED | default "false" | toString) "true" }}
ARCHIVAL_WORKER_INTERVAL_HOURS: {{ .Values.matcher.configmap.ARCHIVAL_WORKER_INTERVAL_HOURS | default "24" | quote }}
ARCHIVAL_HOT_RETENTION_DAYS: {{ .Values.matcher.configmap.ARCHIVAL_HOT_RETENTION_DAYS | default "90" | quote }}
ARCHIVAL_WARM_RETENTION_MONTHS: {{ .Values.matcher.configmap.ARCHIVAL_WARM_RETENTION_MONTHS | default "24" | quote }}
ARCHIVAL_COLD_RETENTION_MONTHS: {{ .Values.matcher.configmap.ARCHIVAL_COLD_RETENTION_MONTHS | default "84" | quote }}
ARCHIVAL_BATCH_SIZE: {{ .Values.matcher.configmap.ARCHIVAL_BATCH_SIZE | default "5000" | quote }}
ARCHIVAL_STORAGE_BUCKET: {{ .Values.matcher.configmap.ARCHIVAL_STORAGE_BUCKET | quote }}
ARCHIVAL_STORAGE_CLASS: {{ .Values.matcher.configmap.ARCHIVAL_STORAGE_CLASS | default "GLACIER" | quote }}
ARCHIVAL_PARTITION_LOOKAHEAD: {{ .Values.matcher.configmap.ARCHIVAL_PARTITION_LOOKAHEAD | default "3" | quote }}
ARCHIVAL_PRESIGN_EXPIRY_SEC: {{ .Values.matcher.configmap.ARCHIVAL_PRESIGN_EXPIRY_SEC | default "3600" | quote }}
{{- end }}

# Application Version (for logs/telemetry)
VERSION: {{ .Values.matcher.image.tag | default .Chart.AppVersion | quote }}
{{- end }}

{{- if .Values.matcher.enabled }}
{{- /*
  Precedence, lowest to highest: every key under matcher.configmap (so keys the
  explicit block does not name still reach the pod), then the explicit block
  (it already reflects the operator value or its default), then
  matcher.extraEnvVars (verbatim overrides, as before).
*/}}
{{- $explicit := include "matcher.configmapExplicit" . | fromYaml }}
{{- if hasKey $explicit "Error" }}
{{- fail (printf "matcher configmap explicit block did not parse: %s" $explicit.Error) }}
{{- end }}
{{- $extra := .Values.matcher.extraEnvVars | default dict }}
{{- if not (kindIs "map" $extra) }}
{{- fail "matcher.extraEnvVars must be a map of NAME: value" }}
{{- end }}
{{- /* Ordered set, not mergeOverwrite: mergo's empty-value rules must never decide
  whether an operator's `false` or "" reaches the pod. Each layer replaces the last. */}}
{{- $data := deepCopy (.Values.matcher.configmap | default dict) }}
{{- range $k, $v := $explicit }}{{- $_ := set $data $k $v }}{{- end }}
{{- range $k, $v := $extra }}{{- $_ := set $data $k $v }}{{- end }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "matcher.fullname" . }}
  namespace: {{ include "global.namespace" . }}
data:
  {{- range $k, $v := $data }}
  {{- if kindIs "float64" $v }}
  {{- /* values files parse numbers as float64: keep 104857600 out of 1.048576e+08 */}}
  {{- if eq $v (floor $v) }}{{ $v = int64 $v }}{{ end }}
  {{- end }}
  {{- /* null (an unset gated key such as MULTI_TENANT_URL) renders empty, as before */}}
  {{- if kindIs "invalid" $v }}{{ $v = "" }}{{ end }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
