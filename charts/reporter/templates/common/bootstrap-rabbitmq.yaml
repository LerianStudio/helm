{{- if .Values.externalRabbitmqDefinitions.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reporter-bootstrap-rabbitmq-definitions
  namespace: {{ .Release.Namespace }}
data:
  load_definitions.json: |
{{ .Files.Get "files/rabbitmq/load_definitions.json" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reporter-bootstrap-rabbitmq
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- /* Fixed name — a Job's spec.template is immutable, so ANY chart bump (e.g. the
       helm.sh/chart label) makes a plain `helm upgrade` fail outright without this.
       Hook annotations for BOTH delivery paths: each controller reads only its own,
       safe to coexist. */}}
    # PostSync (not Sync): this Job mounts the load_definitions.json ConfigMap
    # rendered by THIS release — Sync-phase hooks can run before the normal
    # resource batch is applied, same reasoning as post-upgrade below.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    # post-upgrade (not pre-upgrade): this Job mounts the load_definitions.json
    # ConfigMap rendered by THIS release — pre-upgrade would run against the
    # PREVIOUS revision's ConfigMap content, since hook resources apply before
    # the normal resource batch on upgrade.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          env:
            - name: RABBITMQ_HOST
              value: {{ .Values.externalRabbitmqDefinitions.connection.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.externalRabbitmqDefinitions.connection.portAmqp | quote }}
          command:
            - /bin/sh
            - -c
            - >
              TIMEOUT=300;
              ELAPSED=0;
              echo "Checking $RABBITMQ_HOST:$RABBITMQ_PORT...";
              while ! nc -z "$RABBITMQ_HOST" "$RABBITMQ_PORT"; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for $RABBITMQ_HOST:$RABBITMQ_PORT after ${TIMEOUT}s";
                  exit 1;
                fi;
                echo "$RABBITMQ_HOST:$RABBITMQ_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
                sleep 5;
                ELAPSED=$((ELAPSED + 5));
              done;
              echo "$RABBITMQ_HOST:$RABBITMQ_PORT is ready!";
      containers:
        - name: apply-definitions
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              set -u
              FAILED=0

              # jq builds the user-update JSON body safely (handles quotes, backslashes,
              # control characters) — curlimages/curl ships no jq by default, but the
              # underlying alpine base does carry apk, so install it once here rather
              # than hand-roll JSON string escaping.
              apk add --no-cache jq >/dev/null 2>&1

              # Build base URL - omit port for default HTTPS (443) or HTTP (80)
              if [ "$RABBITMQ_PROTOCOL" = "https" ] && [ "$RABBITMQ_PORT" = "443" ]; then
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST"
              elif [ "$RABBITMQ_PROTOCOL" = "http" ] && [ "$RABBITMQ_PORT" = "80" ]; then
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST"
              else
                BASE_URL="$RABBITMQ_PROTOCOL://$RABBITMQ_HOST:$RABBITMQ_PORT"
              fi

              echo "=== RabbitMQ Bootstrap ==="
              echo "API URL: $BASE_URL"
              echo ""

              # The three steps below (definitions import, user PUT, permissions PUT) are each
              # idempotent on RabbitMQ's side and run UNCONDITIONALLY — no "already exists ->
              # skip everything" check (would leave stale credentials/permissions in place after
              # the first successful run) and no early exit on a prior step's failure (RabbitMQ's
              # POST /api/definitions is NOT atomic — a mid-import failure must not skip
              # reconciling the reporter user/permissions, which no longer live in the bulk
              # definitions file precisely so they can be reconciled independently of it).
              echo "Applying RabbitMQ definitions (queues/exchanges/bindings) from file..."
              HTTP_CODE=$(curl -sSk -o /tmp/response.txt -w "%{http_code}" \
                -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" \
                -H "content-type: application/json" \
                -X POST \
                --data-binary @/definitions/load_definitions.json \
                "$BASE_URL/api/definitions")
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "Error applying definitions (HTTP $HTTP_CODE):"
                cat /tmp/response.txt
                FAILED=1
              else
                echo "Done."
              fi

              echo "Updating RabbitMQ user: reporter..."
              jq -n --arg password "$RABBITMQ_APP_PASS" '{password: $password, tags: "administrator"}' > /tmp/user-body.json
              HTTP_CODE=$(curl -sSk -o /tmp/response.txt -w "%{http_code}" \
                -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" \
                -H "content-type: application/json" \
                -X PUT \
                --data @/tmp/user-body.json \
                "$BASE_URL/api/users/reporter")
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "Error updating reporter user (HTTP $HTTP_CODE):"
                cat /tmp/response.txt
                FAILED=1
              else
                echo "Done."
              fi

              echo "Setting permissions for RabbitMQ user: reporter..."
              HTTP_CODE=$(curl -sSk -o /tmp/response.txt -w "%{http_code}" \
                -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" \
                -H "content-type: application/json" \
                -X PUT \
                --data '{"configure":".*","write":".*","read":".*"}' \
                "$BASE_URL/api/permissions/%2F/reporter")
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "Error setting reporter permissions (HTTP $HTTP_CODE):"
                cat /tmp/response.txt
                FAILED=1
              else
                echo "Done."
              fi

              if [ "$FAILED" -ne 0 ]; then
                echo "One or more bootstrap steps failed — see errors above."
                exit 1
              fi

              echo ""
              echo "=== RabbitMQ Bootstrap completed successfully ==="
          env:
            - name: RABBITMQ_PROTOCOL
              value: {{ .Values.externalRabbitmqDefinitions.connection.protocol | quote }}
            - name: RABBITMQ_HOST
              value: {{ .Values.externalRabbitmqDefinitions.connection.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.externalRabbitmqDefinitions.connection.port | quote }}
            - name: RABBITMQ_APP_PASS
              {{- if .Values.externalRabbitmqDefinitions.appCredentials.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRabbitmqDefinitions.appCredentials.useExistingSecret.name | quote }}
                  key: RABBITMQ_DEFAULT_PASS
              {{- else }}
              value: {{ .Values.externalRabbitmqDefinitions.appCredentials.reporterPassword | quote }}
              {{- end }}
            - name: RABBITMQ_ADMIN_PASS
              {{- if .Values.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name | quote }}
                  key: RABBITMQ_ADMIN_PASS
              {{- else }}
              value: {{ .Values.externalRabbitmqDefinitions.rabbitmqAdminLogin.password | quote }}
              {{- end }}
            - name: RABBITMQ_ADMIN_USER
              {{- if .Values.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRabbitmqDefinitions.rabbitmqAdminLogin.useExistingSecret.name | quote }}
                  key: RABBITMQ_ADMIN_USER
              {{- else }}
              value: {{ .Values.externalRabbitmqDefinitions.rabbitmqAdminLogin.username | quote }}
              {{- end }}
          volumeMounts:
            - name: definitions
              mountPath: /definitions
      volumes:
        - name: definitions
          configMap:
            name: reporter-bootstrap-rabbitmq-definitions
            items:
              - key: load_definitions.json
                path: load_definitions.json
{{- end }}
