{{- if and .Values.agent.token .Values.agent.existingSecret }}
{{- fail "set agent.token or agent.existingSecret, not both" }}
{{- end }}
{{- if not .Values.agent.existingSecret }}
{{- if and .Values.agent.token (not .Values.agent.id) (not (hasPrefix "lerian_enroll_" .Values.agent.token)) }}
{{- fail "agent.id is required when agent.token is a PER-AGENT token: it only authenticates paired with the exact agent ID it was issued for - get both from the same POST /api/tenants/:id/agents response. Omit agent.id only when agent.token is a single-use ENROLLMENT token (lerian_enroll_...), which the control plane trades for both halves on the agent's first call." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lerian-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lerian-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Either a per-agent bearer token, or a single-use enrollment token the agent
  # redeems for one on its first call. The agent tells them apart by the
  # lerian_enroll_ prefix - see the fail above, and the agent's
  # bootstrap.EnrollmentTokenPrefix.
  token: {{ required "agent.token is required when agent.existingSecret is not set (a per-agent token from POST /api/tenants/:id/agents, or an enrollment token from POST /api/tenants/:id/agents/enrollments)" .Values.agent.token | quote }}
  {{- if .Values.agent.id }}
  agent-id: {{ .Values.agent.id | quote }}
  {{- end }}
{{- end }}
