{{- if not .Values.app.useExistingSecret }}
{{- /* Template-owned Secret: the keys below, each emitted only when set. The same
   spec generates values.schema.json's allowlist for app.secrets. */ -}}
{{- $sec := .Values.app.secrets | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-payments.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    {{- $warns := include "plugin-br-payments.secretWarnings" . }}
    {{- if $warns }}
    {{ $warns | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- range $key := list "POSTGRES_PASSWORD" "POSTGRES_REPLICA_PASSWORD" "PROVIDER_CLIENT_ID" "PROVIDER_CLIENT_SECRET" "BTG_WEBHOOK_HMAC_SECRET" "INTERNAL_API_KEY" "INTERNAL_API_KEY_PREVIOUS" "CREDENTIAL_ENCRYPTION_KEY" "CREDENTIAL_ENCRYPTION_KEY_PREVIOUS" "LICENSE_KEY" "PLUGIN_AUTH_CLIENT_ID" "PLUGIN_AUTH_CLIENT_SECRET" "MULTI_TENANT_SERVICE_API_KEY" "CONSULT_AUDIT_HMAC_KEY" }}
  {{- with (index $sec $key) }}
  {{ $key }}: {{ . | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
