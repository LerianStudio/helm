{{- if and .Values.tracer.enabled (not .Values.tracer.useExistingSecret) }}
{{- /*
Boot-contract validation (API key, CORS, multi-tenant, existing secret) lives in
the midaz-tracer.validate helper, included from the ConfigMap so it also runs on
the useExistingSecret path this template skips.
*/ -}}
{{- $pg := .Values.postgresql | default dict }}
{{- $pgAuth := $pg.auth | default dict }}
{{- $pgInternal := or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
type: Opaque
data:
  # -- Default sensitive variables for Tracer

  # PostgreSQL Secrets
  # DB_PASSWORD is single-sourced from the Bitnami postgresql subchart Secret
  # (<release>-postgresql, key `password`) and injected via secretKeyRef on the
  # Tracer Deployment. It is only emitted here when PostgreSQL is EXTERNAL
  # (postgresql disabled or .external=true) without an existingSecret override,
  # and the operator supplied tracer.secrets.DB_PASSWORD.
  {{- if and (not $pgInternal) .Values.tracer.secrets.DB_PASSWORD }}
  DB_PASSWORD: {{ .Values.tracer.secrets.DB_PASSWORD | b64enc | quote }}
  {{- end }}

  # API KEY (read by the app as $API_KEY when API_KEY_ENABLED=true)
  {{- if .Values.tracer.secrets.API_KEY }}
  API_KEY: {{ .Values.tracer.secrets.API_KEY | b64enc | quote }}
  {{- end }}

  # MULTI-TENANT SECRETS (operator-provided when MULTI_TENANT_ENABLED=true)
  {{- if .Values.tracer.secrets.MULTI_TENANT_SERVICE_API_KEY }}
  MULTI_TENANT_SERVICE_API_KEY: {{ .Values.tracer.secrets.MULTI_TENANT_SERVICE_API_KEY | b64enc | quote }}
  {{- end }}
  {{- if .Values.tracer.secrets.MULTI_TENANT_REDIS_PASSWORD }}
  MULTI_TENANT_REDIS_PASSWORD: {{ .Values.tracer.secrets.MULTI_TENANT_REDIS_PASSWORD | b64enc | quote }}
  {{- end }}

  # SERVICE DISCOVERY (lib-service-discovery — Consul ACL token, operator-provided;
  # emitted only when set, so the default render is unchanged)
  {{- if .Values.tracer.secrets.SD_TOKEN }}
  SD_TOKEN: {{ .Values.tracer.secrets.SD_TOKEN | b64enc | quote }}
  {{- end }}

  # RI PERMISSION DECLARATION (IdP M2M client secret; operator-provided, emitted
  # only when set so the default render is unchanged)
  {{- if .Values.tracer.secrets.IDP_M2M_CLIENT_SECRET }}
  IDP_M2M_CLIENT_SECRET: {{ .Values.tracer.secrets.IDP_M2M_CLIENT_SECRET | b64enc | quote }}
  {{- end }}

  # =============================================================================
  # STREAMING SECRETS (lerian-common.streaming.secret — SASL password required when
  # a SASL mechanism is configured; TLS CA optional; both operator-provided)
  # =============================================================================
  {{- /* Same enable precedence as the ConfigMap so this secret gate tracks the env-wide toggle:
     configmap.STREAMING_ENABLED (per-component) > global.streaming.enabled > false. hasKey (not
     `| default`) so a per-component false wins. Otherwise moving the toggle to global.streaming
     would silently drop STREAMING_SASL_PASSWORD/TLS_CA_CERT from the Secret. */ -}}
  {{- $streamingRawSec := toString (((.Values.global | default dict).streaming | default dict).enabled | default false) }}
  {{- if hasKey .Values.tracer.configmap "STREAMING_ENABLED" }}{{- $streamingRawSec = toString (index .Values.tracer.configmap "STREAMING_ENABLED") }}{{- end }}
  {{- $streamingEnabled := eq (include "midaz.isTrue" $streamingRawSec) "true" }}
  {{- $saslMech := (((.Values.global | default dict).streaming | default dict).saslMechanism | default "") }}
  {{- if hasKey .Values.tracer.configmap "STREAMING_SASL_MECHANISM" }}{{- $saslMech = index .Values.tracer.configmap "STREAMING_SASL_MECHANISM" }}{{- end }}
  {{- $saslUser := (((.Values.global | default dict).streaming | default dict).saslUsername | default "") }}
  {{- if hasKey .Values.tracer.configmap "STREAMING_SASL_USERNAME" }}{{- $saslUser = index .Values.tracer.configmap "STREAMING_SASL_USERNAME" }}{{- end }}
  {{- with (include "lerian-common.streaming.secret" (dict "context" $ "enabled" $streamingEnabled "useExistingSecret" .Values.tracer.useExistingSecret "secrets" .Values.tracer.secrets "mode" "data" "saslMechanism" $saslMech "saslUsername" $saslUser "valuesPrefix" "tracer.secrets." "secretName" (include "midaz-tracer.fullname" .))) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
