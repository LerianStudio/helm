suite: node-local OTEL hop in production
templates:
  - templates/auth/deployment.yaml
  - templates/auth/configmap.yaml
  - templates/identity/deployment.yaml
  - templates/identity/configmap.yaml
  - templates/caradhras/deployment.yaml
  - templates/caradhras/configmap.yaml
  - templates/auth/secrets.yaml
  - templates/identity/secrets.yaml
  - templates/caradhras/secrets.yaml
  - templates/caradhras/app-client-secret.yaml
  - templates/auth-database/secrets.yaml
  - templates/auth/init_user.yaml
release:
  name: pam
  namespace: pam
set:
  identity.secrets.LICENSE_KEY: x
  auth.secrets.AUTHORIZER_CLIENT_SECRET: x
  auth.secrets.LICENSE_KEY: x
  caradhras.secrets.LICENSE_KEY: x
tests:

  - it: 'auth: the plaintext node-local endpoint carries ALLOW_INSECURE_OTEL'
    template: templates/auth/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: global.observability.allowInsecureOtel sets the value env-wide'
    template: templates/auth/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: the component configmap wins over the global'
    template: templates/auth/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      auth.configmap.ALLOW_INSECURE_OTEL: "component reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "component reason"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: an explicit refusal stands as the one entry'
    template: templates/auth/deployment.yaml
    set:
      auth.configmap.ALLOW_INSECURE_OTEL: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: a false refusal is emitted as is'
    template: templates/auth/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "false"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: a null component value is unset and falls through to the global'
    template: templates/auth/deployment.yaml
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      auth.configmap.ALLOW_INSECURE_OTEL: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: a null global is unset and leaves the node-local reason'
    template: templates/auth/deployment.yaml
    set:
      global.observability.allowInsecureOtel: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true
          count: 1

  - it: 'auth: an operator value in extraEnvVars stands (no chart entry)'
    template: templates/auth/deployment.yaml
    set:
      auth.extraEnvVars.ALLOW_INSECURE_OTEL: "operator reason"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true

  - it: 'auth: the collector off emits neither the node hop nor the variable'
    template: templates/auth/deployment.yaml
    set:
      otel-collector-lerian.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true

  - it: 'auth: the ConfigMap renders configmap.ALLOW_INSECURE_OTEL'
    template: templates/auth/configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
      auth.configmap.ALLOW_INSECURE_OTEL: "component reason"
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: component reason

  - it: 'auth: the ConfigMap takes global.observability.allowInsecureOtel when the component is unset'
    template: templates/auth/configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: env-wide reason

  - it: 'auth: a null component value falls through to the global in the ConfigMap'
    template: templates/auth/configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      global.observability.allowInsecureOtel: "env-wide reason"
