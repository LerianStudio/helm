{{- if .Values.brSisbajud.enabled -}}
{{- $fullname := include "br-sisbajud.fullname" . -}}
{{- if and .Values.brSisbajud.useExistingSecret (not .Values.brSisbajud.existingSecretName) -}}
{{- fail (printf "br-sisbajud: existingSecretName must be set when useExistingSecret is true") -}}
{{- end -}}
{{- $secretName := ternary .Values.brSisbajud.existingSecretName $fullname .Values.brSisbajud.useExistingSecret -}}
{{- $pullSecrets := .Values.brSisbajud.imagePullSecrets | default .Values.imagePullSecrets -}}
{{- $cm := .Values.brSisbajud.configmap | default dict -}}
{{- $x := include "br-sisbajud.extraEnv" . | fromYaml -}}
{{- /* Telemetry: same global.observability mask the ConfigMap resolves. With
   telemetry on and NO explicit endpoint (configmap / global.observability /
   extraEnvVars), the pod ships to the node-local collector at
   http://$(HOST_IP):4317 (lerian-common.otel.podEnv) — the 1.1.x behavior. */ -}}
{{- $telemetry := eq (include "br-sisbajud.isTrue" (include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "observability" "field" "enabled" "nativeKey" "ENABLE_TELEMETRY" "default" "false"))) "true" -}}
{{- $obs := (.Values.global | default dict).observability | default dict -}}
{{- $explicitEndpoint := or (hasKey $cm "OTEL_EXPORTER_OTLP_ENDPOINT") $obs.otlpEndpoint (hasKey $x "OTEL_EXPORTER_OTLP_ENDPOINT") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sisbajud.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.brSisbajud.revisionHistoryLimit | default 10 }}
  {{- if not .Values.brSisbajud.autoscaling.enabled }}
  {{- /* hasKey, not `default`: an explicit 0 (scale to zero) must not coerce to 1. */}}
  replicas: {{ ternary .Values.brSisbajud.replicaCount 1 (hasKey .Values.brSisbajud "replicaCount") }}
  {{- end }}
  strategy:
    type: {{ .Values.brSisbajud.deploymentUpdate.type | default "RollingUpdate" }}
    {{- if eq (.Values.brSisbajud.deploymentUpdate.type | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.brSisbajud.deploymentUpdate.maxSurge | default "100%" }}
      maxUnavailable: {{ .Values.brSisbajud.deploymentUpdate.maxUnavailable | default 0 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "br-sisbajud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the rendered env changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.brSisbajud.useExistingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.brSisbajud.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "br-sisbajud.selectorLabels" . | nindent 8 }}
    spec:
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "br-sisbajud.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-dependencies
          image: {{ .Values.brSisbajud.waitImage | default "busybox:1.36" }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
          command:
            - /bin/sh
            - -c
            - >
              if [ -n "$POSTGRES_HOST" ]; then
                echo "waiting for postgres $POSTGRES_HOST:${POSTGRES_PORT:-5432}...";
                until nc -z "$POSTGRES_HOST" "${POSTGRES_PORT:-5432}"; do
                  echo "postgres not ready, waiting..."; sleep 5;
                done;
                echo "postgres is ready";
              fi;
              if [ -n "$REDIS_HOST" ]; then
                RH=$(echo "$REDIS_HOST" | cut -d: -f1);
                RP=$(echo "$REDIS_HOST" | cut -d: -f2);
                [ -z "$RP" ] && RP=6379;
                echo "waiting for redis $RH:$RP...";
                until nc -z "$RH" "$RP"; do
                  echo "redis not ready, waiting..."; sleep 5;
                done;
                echo "redis is ready";
              fi;
              echo "dependencies ready"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: {{ $fullname }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.brSisbajud.image.repository }}:{{ .Values.brSisbajud.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.brSisbajud.image.pullPolicy | default "IfNotPresent" }}
          # ConfigMap first, Secret second: on a duplicate key the later source
          # wins, so a credential in the Secret is never shadowed by a ConfigMap
          # default. Explicit `env:` below wins over both.
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
            - secretRef:
                name: {{ $secretName }}
          env:
            {{- /* Bundled (or existingSecret) infra passwords are single-sourced from the
               subchart Secret; the external path reads them from the app Secret via envFrom. */}}
            {{- $pgAuth := (.Values.postgresql | default dict).auth | default dict }}
            {{- if or (eq (include "br-sisbajud.postgresInternal" .) "true") $pgAuth.existingSecret }}
            {{- include "lerian-common.infraSecretRef" (dict "context" . "subchart" "postgresql" "key" "password" "envName" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- end }}
            {{- $vkAuth := (.Values.valkey | default dict).auth | default dict }}
            {{- if or (eq (include "br-sisbajud.valkeyInternal" .) "true") $vkAuth.existingSecret }}
            {{- include "lerian-common.infraSecretRef" (dict "context" . "subchart" "valkey" "key" "valkey-password" "envName" "REDIS_PASSWORD") | nindent 12 }}
            {{- end }}
            {{- if and $telemetry (not $explicitEndpoint) }}
            {{- include "lerian-common.otel.podEnv" (dict "port" 4317) | nindent 12 }}
            {{- end }}
            {{- with .Values.brSisbajud.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.brSisbajud.service.port | default 4029 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.brSisbajud.livenessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.brSisbajud.livenessProbe.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.brSisbajud.livenessProbe.periodSeconds | default 20 }}
            timeoutSeconds: {{ .Values.brSisbajud.livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.brSisbajud.livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.brSisbajud.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.brSisbajud.readinessProbe.path | default "/readyz" }}
              port: http
            initialDelaySeconds: {{ .Values.brSisbajud.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.brSisbajud.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.brSisbajud.readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ .Values.brSisbajud.readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ .Values.brSisbajud.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.brSisbajud.resources | nindent 12 }}
      {{- if or .Values.brSisbajud.nodeSelector .Values.brSisbajud.affinity .Values.brSisbajud.tolerations }}
      {{- include "lerian-common.scheduling" .Values.brSisbajud | nindent 6 }}
      {{- end }}
{{- end -}}
