# Generated from the CI render fixture plus the telemetry switch; covers the
# modeled ALLOW_INSECURE_OTEL setting resolved by lerian-common.
suite: modeled ALLOW_INSECURE_OTEL
set:
  global:
    observability:
      enabled: true
  system-facts:
    otel:
      enabled: true
tests:
- it: emits the node-local reason by default
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
- it: takes global.observability.allowInsecureOtel env-wide
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
- it: the component configmap wins over the global
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: component reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
    system-facts:
      configmap:
        ALLOW_INSECURE_OTEL: component reason
- it: an explicit refusal stands as the one entry
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
    system-facts:
      configmap:
        ALLOW_INSECURE_OTEL: ''
- it: a null global is unset
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    global:
      observability:
        allowInsecureOtel: null
- it: a legacy extraEnvVars entry stands, with no duplicate
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    system-facts:
      extraEnvVars:
      - name: ALLOW_INSECURE_OTEL
        value: legacy reason
- it: a non-empty value in the chart Secret stands (legacy route), with no env entry
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    system-facts:
      secrets:
        ALLOW_INSECURE_OTEL: secret reason
- it: an empty value in the chart Secret is not a route, so the modeled entry stays
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    system-facts:
      secrets:
        ALLOW_INSECURE_OTEL: ''
- it: with an existing Secret the chart cannot see the value, so the modeled entry is emitted
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  set:
    system-facts:
      secrets:
        ALLOW_INSECURE_OTEL: secret reason
      useExistingSecret: true
- it: 'system-facts: the ConfigMap renders configmap.ALLOW_INSECURE_OTEL (reaches the app with the collector off)'
  template: templates/configmap.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - equal:
      path: data.ALLOW_INSECURE_OTEL
      value: component reason
  set:
    system-facts:
      configmap:
        ALLOW_INSECURE_OTEL: component reason
    global:
      observability:
        allowInsecureOtel: env-wide reason
- it: 'system-facts: the ConfigMap takes global.observability.allowInsecureOtel when the component is unset'
  template: templates/configmap.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - equal:
      path: data.ALLOW_INSECURE_OTEL
      value: env-wide reason
  set:
    global:
      observability:
        allowInsecureOtel: env-wide reason
- it: 'system-facts: a null component value falls through to the global in the ConfigMap'
  template: templates/configmap.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - equal:
      path: data.ALLOW_INSECURE_OTEL
      value: env-wide reason
  set:
    system-facts:
      configmap:
        ALLOW_INSECURE_OTEL: null
    global:
      observability:
        allowInsecureOtel: env-wide reason
- it: 'system-facts: an explicit refusal renders as the empty value'
  template: templates/configmap.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - equal:
      path: data.ALLOW_INSECURE_OTEL
      value: ''
  set:
    system-facts:
      configmap:
        ALLOW_INSECURE_OTEL: ''
    global:
      observability:
        allowInsecureOtel: env-wide reason
- it: 'system-facts: nothing renders in the ConfigMap when neither is set'
  template: templates/configmap.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - notExists:
      path: data.ALLOW_INSECURE_OTEL
- it: 'system-facts: a legacy extraEnvVars entry renders once, from extraEnvVars'
  template: templates/configmap.yaml
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - equal:
      path: data.ALLOW_INSECURE_OTEL
      value: legacy reason
  set:
    system-facts:
      configmap:
        ALLOW_INSECURE_OTEL: component reason
      extraEnvVars:
      - name: ALLOW_INSECURE_OTEL
        value: legacy reason
- it: a refusal in the model wins over a Secret reason
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  set:
    system-facts:
      secrets:
        ALLOW_INSECURE_OTEL: secret reason
      configmap:
        ALLOW_INSECURE_OTEL: ''
- it: a global value wins over a Secret refusal
  template: templates/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  set:
    system-facts:
      secrets:
        ALLOW_INSECURE_OTEL: 'false'
    global:
      observability:
        allowInsecureOtel: env-wide reason
