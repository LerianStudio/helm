{{- if not .Values.manager.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fetcher-manager.fullname" . }}
  labels:
    {{- include "fetcher-manager.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Empty keys are skipped so an unset component value never masks the same
         key from the shared <release>-common Secret (loaded earlier in envFrom). */}}
  {{- $idpSecretKeys := include "lerian-common.idp.keys" (dict "kind" "secret") | fromJsonArray }}
  {{- range $key, $value := .Values.manager.secrets }}
  {{- if not (or (eq (toString $value) "") (has $key $idpSecretKeys)) }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- /* Access Manager permission declaration (RI) client pair — lerian-common.idp.secret,
     each key only when set (same rule as the range above). */}}
  {{- with (include "lerian-common.idp.secret" (dict "secrets" .Values.manager.secrets "mode" "data")) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
