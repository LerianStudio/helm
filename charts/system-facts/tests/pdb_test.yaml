suite: API PodDisruptionBudget selector
templates:
  - templates/pdb.yaml
  - templates/deployment.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
  - templates/migrations-job.yaml
release:
  name: system-facts
  namespace: system-facts
set:
  migrations.enabled: true
  migrations.image.repository: ghcr.io/lerianstudio/system-facts-migrations
  migrations.image.tag: 1.0.0
  global.datastores.postgres.host: pg.example
tests:
  # The migrations Job pod shares name+instance with the API pods. A PDB that
  # selects it fails with SyncFailed ("jobs.batch does not implement the scale
  # subresource"), degrades the ArgoCD app and blocks node drains.
  - it: selects the API component, as the Deployment pods are labelled
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: system-facts
            app.kubernetes.io/instance: system-facts
            app.kubernetes.io/component: system-facts
        template: templates/pdb.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: system-facts
        template: templates/deployment.yaml

  - it: does not select the migrations Job pod
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migrations
        template: templates/migrations-job.yaml
      - notEqual:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: migrations
        template: templates/pdb.yaml
