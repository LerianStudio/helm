      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: ""
  - it: "pix: nothing set renders no ConfigMap key"
    template: templates/pix/configmap.yaml
    asserts:
      - notExists:
          path: data.ALLOW_INSECURE_OTEL
  - it: "pix: a key in extraEnvVars renders once, from extraEnvVars"
