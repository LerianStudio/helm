{{- if and .Values.flowker.enabled .Values.flowker.serviceAccount.create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" .Values.flowker.serviceAccount
      "name" (include "flowker.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "flowker.labels" (dict "context" . "component" .Values.flowker.name "name" .Values.flowker.name))
    ) }}
{{- end }}
