{{- if .Values.rabbitmq.enabled }}
{{- /* The broker imports this at every boot; its only login is plugin with the manager's password. */}}
{{- $s := .Values.manager.secrets }}
{{- $from := "manager.secrets" }}
{{- if .Values.manager.useExistingSecret }}
{{- $s = dict }}
{{- $from = printf "Secret %q (read at render, which needs cluster access: helm install or upgrade, not helm template or Argo CD)" .Values.manager.existingSecretName }}
{{- range $k, $v := (lookup "v1" "Secret" .Release.Namespace .Values.manager.existingSecretName).data }}{{ $_ := set $s $k (b64dec $v) }}{{ end }}
{{- end }}
{{- $pass := toString ($s.RABBITMQ_DEFAULT_PASS | default "") }}
{{- if or (ne (toString $s.RABBITMQ_DEFAULT_USER) "plugin") (not $pass) }}
{{- fail (printf "rabbitmq.enabled: the bundled broker's only login is user plugin with the manager's RABBITMQ_DEFAULT_PASS, and %s has no RABBITMQ_DEFAULT_USER plugin with a RABBITMQ_DEFAULT_PASS. Set both there, and the same two keys in the worker's secrets." $from) }}
{{- end }}
{{- if eq $pass "Lerian@123" }}
{{- fail (printf "rabbitmq.enabled: RABBITMQ_DEFAULT_PASS is Lerian@123, the public password earlier versions of this chart gave user plugin. Set another in the manager's and the worker's secrets and upgrade, then restart the broker, which keeps the old password until its pod restarts: kubectl -n %s rollout restart statefulset/%s-rabbitmq" .Release.Namespace .Release.Name) }}
{{- end }}
{{- $defs := .Files.Get "files/rabbitmq/load_definitions.json" | fromJson }}
{{- $_ := set $defs "users" (list (dict "name" "plugin" "password" $pass "tags" "")) }}
apiVersion: v1
kind: Secret
metadata:
  name: "fetcher-manager-load-definitions"
  labels:
    {{- include "fetcher-manager.labels" . | nindent 4 }}
type: Opaque
data:
  load_definition.json: {{ $defs | toJson | b64enc | quote }}
{{- end }}
