{{- /* app-lerian's client secret, one source for caradhras, auth and identity. Kept on uninstall: a same-name
   reinstall reopens the kept database, whose app row still holds the old secret. */ -}}
{{- if not .Values.auth.useExistingSecret }}
{{- $name := include "plugin-access-manager.appClientSecretName" . }}
{{- $provided := .Values.auth.secrets.AUTHORIZER_CLIENT_SECRET }}
{{- $kept := dig "data" "AUTHORIZER_CLIENT_SECRET" "" (lookup "v1" "Secret" .Release.Namespace $name | default dict) }}
{{- $value := $kept }}
{{- if $provided }}{{ $value = b64enc $provided }}
{{- else if not $kept }}{{ include "plugin-access-manager.appClientSecretGate" . }}{{ $value = b64enc (randAlphaNum 40) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "plugin-auth.labels" (dict "context" . "name" .Values.auth.name ) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  AUTHORIZER_CLIENT_SECRET: {{ $value | quote }}
{{- end }}
