{{- $h := include "notifications.api.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notifications.fullname" . }}
  namespace: {{ include "notifications.namespace" . }}
  labels:
    {{- include "notifications.labels" (dict "context" . "name" .Values.api.name) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit | default 10 }}
  strategy:
    {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "notifications.selectorLabels" (dict "context" . "name" .Values.api.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notifications.podLabels" (dict "context" . "name" .Values.api.name) | nindent 8 }}
      annotations:
        # Force pod restart on ConfigMap/Secret change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secretRef.name }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "notifications.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
      {{- with (concat .Values.imagePullSecrets .Values.api.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.api.name }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "notifications.configMapName" . }}
            - secretRef:
                name: {{ include "notifications.secretName" . }}
          env:
            {{- toYaml $h.env | nindent 12 }}
            {{- with (include "notifications.licenseFileEnv" . | trim) }}{{ . | nindent 12 }}{{ end }}
            {{- range $key, $value := .Values.api.extraEnvVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with (include "notifications.licenseFileVolumeMount" . | trim) }}{{ . | nindent 10 }}{{ end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            {{- toYaml $h.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $h.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $h.livenessProbe | nindent 12 }}
      {{- with (include "notifications.licenseFileVolume" . | trim) }}{{ . | nindent 6 }}{{ end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
