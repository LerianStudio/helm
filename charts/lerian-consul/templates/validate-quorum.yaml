{{- /*
Render-time guardrail for the Consul Raft quorum. The upstream chart renders a
broken cluster without complaint: bootstrapExpect != replicas never forms
quorum, and an even replica count tolerates zero failures while risking
split-brain. Fail fast with a clear message instead. Emits nothing on success.
*/ -}}
{{- $server := (.Values.consul | default dict).server | default dict -}}
{{- /* `int (X | default 1)` would turn an explicit 0 into 1 (default treats 0 as
   empty), and a negative value would slip past the even-count check — either
   renders an invalid / zero-server StatefulSet. Reject < 1 from the RAW value. */ -}}
{{- if and (hasKey $server "replicas") (lt (int $server.replicas) 1) -}}
{{-   fail (printf "\nlerian-consul: consul.server.replicas (%d) must be >= 1 (an ODD count: 1, 3 or 5)." (int $server.replicas)) -}}
{{- end -}}
{{- $replicas := int ($server.replicas | default 1) -}}
{{- if hasKey $server "bootstrapExpect" -}}
{{-   $expect := int $server.bootstrapExpect -}}
{{-   if lt $expect 1 -}}
{{-     fail (printf "\nlerian-consul: consul.server.bootstrapExpect (%d) must be >= 1." $expect) -}}
{{-   end -}}
{{-   if ne $replicas $expect -}}
{{-     fail (printf "\nlerian-consul: consul.server.bootstrapExpect (%d) must equal consul.server.replicas (%d) — Raft quorum requires them to match. Set both (e.g. --set consul.server.replicas=3 --set consul.server.bootstrapExpect=3)." $expect $replicas) -}}
{{-   end -}}
{{- end -}}
{{- if and (gt $replicas 1) (eq (mod $replicas 2) 0) -}}
{{-   fail (printf "\nlerian-consul: consul.server.replicas (%d) must be ODD (1, 3 or 5) for a sane Raft quorum — 2 tolerates zero failures and risks split-brain." $replicas) -}}
{{- end -}}
{{- /* Multi-server (replicas > 1) means real server-to-server gossip. It MUST be
   encrypted; the single-node default ships gossipEncryption.autoGenerate=false
   (nothing to encrypt at 1 member). Fail unless the operator enabled auto-generate
   OR supplied an existing gossip key Secret. */ -}}
{{- $gossip := (($.Values.consul | default dict).global | default dict).gossipEncryption | default dict -}}
{{- if and (gt $replicas 1) (not $gossip.autoGenerate) (not $gossip.secretName) -}}
{{-   fail (printf "\nlerian-consul: consul.server.replicas is %d (multi-server) but gossip encryption is OFF. Server-to-server gossip would be unencrypted. Set consul.global.gossipEncryption.autoGenerate=true (or provide .secretName/.secretKey) before scaling past 1." $replicas) -}}
{{- end -}}
