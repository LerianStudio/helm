{{- if and .Values.tracer.enabled .Values.tracer.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "midaz-tracer.selectorLabels" (dict "context" . "name" .Values.tracer.name) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.tracer.service.port }}
      {{- with .Values.tracer.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if or .Values.ledger.enabled .Values.tracer.networkPolicy.grpcExtraFrom }}
    - ports:
        - protocol: TCP
          port: {{ include "midaz-tracer.grpcPort" . }}
      from:
        {{- if .Values.ledger.enabled }}
        - podSelector:
            matchLabels:
              {{- include "midaz.selectorLabels" (dict "context" . "name" .Values.ledger.name) | nindent 14 }}
        {{- end }}
        {{- with .Values.tracer.networkPolicy.grpcExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- end }}
    {{- with .Values.tracer.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
