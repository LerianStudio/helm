{{- if .Values.workerWebhook.enabled }}
{{- $h := include "notifications.health" (dict "context" . "key" "workerWebhook" "name" .Values.workerWebhook.name) | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workerWebhook.fullname" . }}
  namespace: {{ include "notifications.namespace" . }}
  labels:
    {{- include "notifications.labels" (dict "context" . "name" .Values.workerWebhook.name) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.workerWebhook.revisionHistoryLimit | default 10 }}
  strategy:
    {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "notifications.selectorLabels" (dict "context" . "name" .Values.workerWebhook.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notifications.podLabels" (dict "context" . "name" .Values.workerWebhook.name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secretRef.name }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.workerWebhook.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "notifications.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
      {{- with (concat .Values.imagePullSecrets .Values.workerWebhook.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerWebhook.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.workerWebhook.name }}
          image: "{{ .Values.workerWebhook.image.repository }}:{{ .Values.workerWebhook.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.workerWebhook.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.workerWebhook.securityContext | nindent 12 }}
          ports:
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "notifications.configMapName" . }}
            - secretRef:
                name: {{ include "notifications.secretName" . }}
          env:
            {{- toYaml $h.env | nindent 12 }}
            {{- with (include "notifications.licenseFileEnv" . | trim) }}{{ . | nindent 12 }}{{ end }}
            {{- range $key, $value := .Values.workerWebhook.extraEnvVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with (include "notifications.licenseFileVolumeMount" . | trim) }}{{ . | nindent 10 }}{{ end }}
          resources:
            {{- toYaml .Values.workerWebhook.resources | nindent 12 }}
          startupProbe:
            {{- toYaml $h.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $h.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $h.livenessProbe | nindent 12 }}
      {{- with (include "notifications.licenseFileVolume" . | trim) }}{{ . | nindent 6 }}{{ end }}
      {{- with .Values.workerWebhook.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerWebhook.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.workerWebhook.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
