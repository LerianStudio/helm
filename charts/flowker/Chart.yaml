apiVersion: v2
name: flowker-helm
description: A Helm chart for Flowker - Workflow orchestration platform for
  financial validation
type: application
annotations:
  lerian.studio/chart-type: multi-component
home: https://github.com/LerianStudio/flowker
sources:
  - https://github.com/LerianStudio/helm/tree/main/charts/flowker
  - https://github.com/LerianStudio/flowker
maintainers:
  - name: "Lerian Studio"
    email: "support@lerian.studio"
# version is a PLACEHOLDER. semantic-release in the `helm` repo owns the real
# chart version on merge (the last flowker release here was 3.1.1) — do NOT hand-pick it.
version: 1.5.0
appVersion: "1.7.0"
# The health preset's PDB uses unhealthyPodEvictionPolicy, available from Kubernetes 1.27.
kubeVersion: ">=1.27.0-0"
keywords:
  - flowker
  - workflow
  - orchestration
  - financial-validation
  - lerian
icon: https://avatars.githubusercontent.com/u/148895005?s=200&v=4
dependencies:
  # Library chart — renders nothing on its own. Pulled from the published OCI
  # registry, the same form the other charts in this repo use.
  - name: lerian-common-helm
    version: "2.7.0"
    repository: "oci://ghcr.io/lerianstudio"
  - name: mongodb
    version: "16.4.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
  - name: valkey
    version: "0.7.4"
    repository: "https://valkey.io/valkey-helm"
    condition: valkey.enabled
