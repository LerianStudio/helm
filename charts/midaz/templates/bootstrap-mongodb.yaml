{{- if .Values.global.externalMongoDefinitions.enabled }}
{{- $creds := .Values.global.externalMongoDefinitions.midazCredentials -}}
{{- $rolesJSON := toJson $creds.roles -}}
{{- /* TLS is opt-in (default off, matching the un-productized chart's plaintext
   bundled MongoDB) but REQUIRED for managed TLS-only Mongo-API services like
   AWS DocumentDB — mongosh has no TLS flags below without this, so bootstrap
   would fail outright against them. tlsInsecure skips hostname/CA verification
   (DocumentDB doesn't ship its CA in every client trust store by default). */ -}}
{{- $mongoTLS := .Values.global.externalMongoDefinitions.tls | default dict -}}
{{- $mongoshTLSArgs := "" -}}
{{- if $mongoTLS.enabled }}
  {{- $mongoshTLSArgs = "--tls" -}}
  {{- if ne (toString $mongoTLS.insecure) "false" }}
    {{- $mongoshTLSArgs = printf "%s --tlsInsecure" $mongoshTLSArgs -}}
  {{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "midaz.name" . }}-bootstrap-mongodb
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- /* Fixed name — a Job's spec.template is immutable, so ANY chart bump
       (e.g. the helm.sh/chart label) makes a plain `helm upgrade` fail
       outright without this. Hook annotations for BOTH delivery paths: each
       controller reads only its own, safe to coexist. */}}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.37
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalMongoDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalMongoDefinitions.connection.port | quote }}
        command:
        - /bin/sh
        - -c
        - >
          TIMEOUT=300;
          ELAPSED=0;
          echo "Checking $DB_HOST:$DB_PORT...";
          while ! nc -z "$DB_HOST" "$DB_PORT"; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timeout waiting for $DB_HOST:$DB_PORT after ${TIMEOUT}s";
              exit 1;
            fi;
            echo "$DB_HOST:$DB_PORT is not ready yet, waiting... (${ELAPSED}s/${TIMEOUT}s)";
            sleep 5;
            ELAPSED=$((ELAPSED + 5));
          done;
          echo "$DB_HOST:$DB_PORT is ready!";
      containers:
      - name: mongosh
        image: mongo:8
        env:
        - name: DB_HOST
          value: {{ .Values.global.externalMongoDefinitions.connection.host | quote }}
        - name: DB_PORT
          value: {{ .Values.global.externalMongoDefinitions.connection.port | quote }}
        - name: MONGO_ROOT_USER
          {{- if .Values.global.externalMongoDefinitions.mongoAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalMongoDefinitions.mongoAdminLogin.useExistingSecret.name | quote }}
              key: MONGO_ROOT_USER
          {{- else }}
          value: {{ .Values.global.externalMongoDefinitions.mongoAdminLogin.username | quote }}
          {{- end }}
        - name: MONGO_ROOT_PASSWORD
          {{- if .Values.global.externalMongoDefinitions.mongoAdminLogin.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.externalMongoDefinitions.mongoAdminLogin.useExistingSecret.name | quote }}
              key: MONGO_ROOT_PASSWORD
          {{- else }}
          value: {{ .Values.global.externalMongoDefinitions.mongoAdminLogin.password | quote }}
          {{- end }}
        - name: MONGO_APP_USER
          {{- if $creds.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ $creds.useExistingSecret.name | quote }}
              key: MONGO_APP_USER
          {{- else }}
          value: {{ $creds.username | quote }}
          {{- end }}
        - name: MONGO_APP_PASSWORD
          {{- if $creds.useExistingSecret.name }}
          valueFrom:
            secretKeyRef:
              name: {{ $creds.useExistingSecret.name | quote }}
              key: MONGO_APP_PASSWORD
          {{- else }}
          value: {{ $creds.password | quote }}
          {{- end }}
        - name: ROLES_JSON
          value: {{ $rolesJSON | quote }}
        - name: MONGOSH_TLS_ARGS
          value: {{ $mongoshTLSArgs | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          echo "=== Midaz MongoDB Bootstrap ==="
          echo "Host: $DB_HOST:$DB_PORT"
          echo "App user: $MONGO_APP_USER"
          echo ""

          echo "Checking existing MongoDB objects..."
          USER_EXISTS=0

          if mongosh --host "$DB_HOST" --port "$DB_PORT" -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin $MONGOSH_TLS_ARGS --quiet --eval 'if (db.getSiblingDB("admin").getUser(process.env.MONGO_APP_USER) !== null) { print("EXISTS"); }' | grep -q "EXISTS"; then
            USER_EXISTS=1
          fi

          if [ "$USER_EXISTS" = "1" ]; then
            echo "User '$MONGO_APP_USER' already exists. Updating password and replacing roles..."
            mongosh --host "$DB_HOST" --port "$DB_PORT" -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin $MONGOSH_TLS_ARGS --quiet --eval 'db.getSiblingDB("admin").updateUser(process.env.MONGO_APP_USER, {pwd: process.env.MONGO_APP_PASSWORD, roles: JSON.parse(process.env.ROLES_JSON)})'
          else
            echo "Creating user '$MONGO_APP_USER'..."
            mongosh --host "$DB_HOST" --port "$DB_PORT" -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin $MONGOSH_TLS_ARGS --quiet --eval 'db.getSiblingDB("admin").createUser({user: process.env.MONGO_APP_USER, pwd: process.env.MONGO_APP_PASSWORD, roles: JSON.parse(process.env.ROLES_JSON)})'
          fi

          echo ""
          echo "=== Midaz MongoDB Bootstrap completed successfully ==="
{{- end }}
