{{- /* The identity database's password outlives the release, like its volume, so a same-name
   reinstall opens the kept data. Same name, keys and value sources as the subchart's Secret, rendered
   only where the subchart would render its own; the lookup runs on the subchart's values, as its did. */ -}}
{{- $db := index .Values "auth-database" }}
{{- $g := dig "global" "postgresql" "auth" dict $db }}
{{- if and (ne (toString $db.enabled) "false") (not $g.existingSecret) (not (include "plugin-access-manager.operatorDbSecret" .)) }}
{{- $defaultKeys := dict "adminPasswordKey" "postgres-password" "userPasswordKey" "password" "replicationPasswordKey" "replication-password" }}
{{- if or (and $db.ldap.enabled (or $db.ldap.bind_password $db.ldap.bindpw)) (ne (toJson $db.auth.secretKeys) (toJson $defaultKeys)) (compact (values (dig "secretKeys" dict $g))) }}
{{- fail "auth-database LDAP and custom secretKeys need auth-database.auth.existingSecret: the Secret this chart keeps holds the passwords under the default keys only" }}
{{- end }}
{{- if empty $db.auth.existingSecret }}
{{- fail "auth-database.auth.existingSecret is empty: leave it unset to use the Secret this chart keeps, or name your own Secret" }}
{{- end }}
{{- $name := include "common.names.dependency.fullname" (dict "chartName" "auth-database" "chartValues" $db "context" $) }}
{{- $ctx := dict "Values" $db "Release" $.Release }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: auth-database
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if or $db.auth.enablePostgresUser $db.auth.postgresPassword $g.postgresPassword }}
  postgres-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "postgres-password" "providedValues" (list "global.postgresql.auth.postgresPassword" "auth.postgresPassword") "honorProvidedValues" true "chartName" "auth-database" "context" $ctx) }}
  {{- end }}
  {{- if and $db.auth.username (ne $db.auth.username "postgres") }}
  password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "password" "providedValues" (list "global.postgresql.auth.password" "auth.password") "honorProvidedValues" true "chartName" "auth-database" "context" $ctx) }}
  {{- end }}
  {{- if eq $db.architecture "replication" }}
  replication-password: {{ include "common.secrets.passwords.manage" (dict "secret" $name "key" "replication-password" "providedValues" (list "auth.replicationPassword") "honorProvidedValues" true "chartName" "auth-database" "context" $ctx) }}
  {{- end }}
{{- end }}
