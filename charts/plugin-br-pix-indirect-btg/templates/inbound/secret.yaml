apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-pix-indirect-btg-helm.fullname" . }}-inbound
  labels:
    {{- include "plugin-br-pix-indirect-btg-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: inbound
type: Opaque
data:
  LICENSE_KEY: {{ .Values.inbound.secrets.LICENSE_KEY | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.inbound.extraSecretVars }}
  {{- toYaml .Values.inbound.extraSecretVars | nindent 2 }}
  {{- end }}
