{{- if .Values.bankTransfer.enabled }}
{{- $h := include "bank-transfer.health" . | fromYaml }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bank-transfer.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "bank-transfer.labels" (dict "context" . "component" .Values.bankTransfer.name "name" .Values.bankTransfer.name ) | nindent 4 }}
  {{- with .Values.bankTransfer.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.bankTransfer.service.type }}
  ports:
    - port: {{ .Values.bankTransfer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if eq (lower (toString (include "lerian-common.globalValue" (dict "context" $ "configmap" .Values.bankTransfer.configmap "block" "multiTenant" "field" "enabled" "nativeKey" "MULTI_TENANT_ENABLED" "default" "false")))) "true" }}
    {{- toYaml $h.servicePorts | nindent 4 }}
    {{- end }}
  selector:
    {{- include "bank-transfer.selectorLabels" (dict "context" . "name" .Values.bankTransfer.name) | nindent 4 }}
{{- end }}
