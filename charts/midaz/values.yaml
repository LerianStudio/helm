
# Default values for midaz components.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
nameOverride: "midaz"
fullnameOverride: ""
namespaceOverride: "midaz"
global:
  # -- Bootstrap job for external RabbitMQ: creates users, vhosts, and permissions
  externalRabbitmqDefinitions:
    # -- Enable or disable the RabbitMQ bootstrap job
    enabled: false
    # -- RabbitMQ connection settings
    connection:
      # -- RabbitMQ protocol (http or https)
      protocol: "http"
      # -- RabbitMQ host (management API endpoint)
      host: "midaz-rabbitmq"
      # -- RabbitMQ HTTP management port
      port: "15672"
      # -- RabbitMQ AMQP port (for connectivity check)
      portAmqp: "5672"
    # -- Admin credentials for RabbitMQ management API
    rabbitmqAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing RABBITMQ_ADMIN_USER and RABBITMQ_ADMIN_PASS keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "midaz"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for application users created by the job
    appCredentials:
      useExistingSecret:
        # -- Name of existing secret containing RABBITMQ_DEFAULT_PASS and RABBITMQ_CONSUMER_PASS keys
        name: ""
      # -- Password for transaction user (ignored if useExistingSecret.name is set)
      transactionPassword: ""
      # -- Password for consumer user (ignored if useExistingSecret.name is set)
      consumerPassword: ""
  # -- Bootstrap job for external PostgreSQL: creates databases, roles, and grants privileges
  externalPostgresDefinitions:
    # -- Enable or disable the PostgreSQL bootstrap job
    enabled: false
    # -- PostgreSQL connection settings
    connection:
      # -- PostgreSQL host
      host: "midaz-postgresql-primary"
      # -- PostgreSQL port
      port: "5432"
    # -- Admin credentials for PostgreSQL
    postgresAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing DB_USER_ADMIN and DB_ADMIN_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "postgres"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for midaz role created by the job
    midazCredentials:
      useExistingSecret:
        # -- Name of existing secret containing DB_PASSWORD_MIDAZ key
        name: ""
      # -- Password for midaz role (ignored if useExistingSecret.name is set)
      password: ""
  # -- Bootstrap job for external MongoDB: creates users and grants privileges
  externalMongoDefinitions:
    # -- Enable or disable the MongoDB bootstrap job
    enabled: false
    # -- MongoDB connection settings
    connection:
      # -- MongoDB host
      host: "midaz-mongodb"
      # -- MongoDB port
      port: "27017"
    # -- Admin credentials for MongoDB (rootUser from bitnami subchart)
    mongoAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_ROOT_USER and MONGO_ROOT_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "midaz"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for midaz user created by the job
    midazCredentials:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_APP_USER and MONGO_APP_PASSWORD keys
        name: ""
      # -- App username (ignored if useExistingSecret.name is set)
      username: "midaz"
      # -- Password for midaz user (ignored if useExistingSecret.name is set)
      password: ""
      # -- List of roles to grant to the user. Each item is a {role, db} pair.
      roles:
        - role: "readWrite"
          db: "onboarding"
        - role: "readWrite"
          db: "transaction"
        - role: "readWrite"
          db: "crm"
        - role: "readWrite"
          db: "fees"
  # =============================================================================
  # TIERED DEPENDENCY-CONNECTION SURFACE (env-wide masks / contracts)
  # Set a connection ONCE here and every component emits its native env keys from
  # it. Empty by default → each component falls through to its own default
  # (render-identical to the un-productized chart). Per-component overrides live
  # under `<component>.datastores` and each component's `configmap.<KEY>` still
  # wins over everything (the escape hatch). See values-quickstart.yaml.
  # =============================================================================
  # -- Shared datastore masks. Keys: postgresOnboarding / postgresTransaction /
  # mongoOnboarding / mongoTransaction / mongoCrm / mongoFees / mongo / redis /
  # broker. Each accepts host/port/user/ssl/replicaHost.
  datastores: {}
  # -- Env-wide observability (OTel collector): enabled / otlpEndpoint / deploymentEnvironment.
  observability: {}
  # -- Env-wide multi-tenant (tenant-manager): url / redisHost / redisPort / redisTls / ...
  multiTenant: {}
  # -- Env-wide streaming (lib-streaming / RedPanda): brokers / saslMechanism / saslUsername / tlsEnabled / ...
  streaming: {}
  # -- Env-wide auth (plugin-access-manager): enabled / host.
  auth: {}
  # -- Env-wide service discovery (Consul): see lerian-common.serviceDiscovery.env.
  serviceDiscovery: {}
ledger:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- Service name
  name: ledger
  # -- Enable or disable the ledger service (unified onboarding + transaction)
  # -- When enabled, onboarding and transaction services will not be deployed unless migration.allowAllServices is true
  # -- NOTE: migration.allowAllServices is not in the public values.yaml - set it in your override values for internal testing
  enabled: true
  # -- Number of replicas for the ledger service
  replicaCount: 2
  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10
  image:
    # -- Repository for the ledger service container image
    repository: lerianstudio/midaz-ledger
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag used for deployment
    tag: "4.0.0-beta.26"
  # -- Dedicated migration runner (`midaz-ledger-migrations`, built FROM
  # migrate/migrate) applying the onboarding and transaction migration sets.
  migrations:
    # -- Run the migration Job. Unset means auto: on for 4.x ledger tags, which
    # removed in-process migration, off for 3.x, which still migrates at
    # startup. Set false to keep it off when the schema is applied out-of-band.
    enabled:
    image:
      # -- Repository for the ledger migration-runner image
      repository: lerianstudio/midaz-ledger-migrations
      # -- Image pull policy
      pullPolicy: IfNotPresent
      # -- Migration image tag. Empty tracks `ledger.image.tag` so the schema and
      # the binary reading it cannot drift.
      tag: ""
    # -- Extra Job annotations. The Job is a plain Sync-phase resource by
    # default because the bundled PostgreSQL Secret it reads is only created
    # during Sync; against a pre-provisioned database, set
    # `argocd.argoproj.io/hook: PreSync` here to order it ahead of the Deployment.
    annotations: {}
    # -- Argo CD sync wave stamped on the ledger Deployment while this Job
    # renders, so the Deployment is applied only once the Job reports Complete
    # (the Job itself stays in the default wave, with the bundled PostgreSQL
    # Secret it reads). Set to "" to drop the annotation and let both apply
    # together. Ignored by plain `helm install`.
    deploymentSyncWave: "1"
    # -- Retries before the Job is marked failed
    backoffLimit: 6
    # -- Hard timeout for the whole Job
    activeDeadlineSeconds: 600
    # -- How long the finished Job is kept for inspection
    ttlSecondsAfterFinished: 259200
    # -- Wait for the PostgreSQL endpoint before running migrate
    waitForPostgres:
      # -- Enable or disable the wait-for-postgres init container
      enabled: true
      image:
        # -- Repository for the wait-for-postgres init container image
        repository: busybox
        # -- Image tag for the wait-for-postgres init container image
        tag: "1.37"
    resources:
      # -- CPU and memory limits for the migration Job
      limits:
        cpu: 500m
        memory: 256Mi
      # -- Minimum CPU and memory requests for the migration Job
      requests:
        cpu: 50m
        memory: 64Mi
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  # -- Pod annotations for additional metadata
  podAnnotations: {}
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    # -- Defines the group ID for the user running the process inside the container
    runAsGroup: 1000
    # -- Defines the user ID for the process running inside the container
    runAsUser: 1000
    # -- Ensures the process does not run as root
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    # -- Defines the root filesystem as read-only
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  # -- PodDisruptionBudget configuration
  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Minimum number of available pods
    minAvailable: 1
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Annotations for the PodDisruptionBudget
    annotations: {}
  # -- Deployment update strategy
  deploymentUpdate:
    # -- Type of deployment strategy
    type: RollingUpdate
    # -- Maximum number of pods that can be created over the desired number of pods
    maxSurge: 100%
    # -- Maximum number of pods that can be unavailable during the update
    maxUnavailable: 0
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Port for the HTTP API (all APIs on single port)
    port: 3002
    annotations: {}
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 2000m
      memory: 512Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 1500m
      memory: 256Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 2
    # -- Maximum number of replicas
    maxReplicas: 9
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Node affinity rules
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz

  # -- ConfigMap for environment variables and configurations
  # @default -- templates/ledger/configmap.yaml
  # -- Dedicated datastore masks for this component (override global.datastores).
  # Sub-keys: postgresOnboarding / postgresTransaction / mongoOnboarding /
  # mongoTransaction / mongoCrm / mongoFees / redis / broker (host/port/user/ssl/replicaHost).
  datastores: {}
  # -- Escape hatch: any native env var (e.g. DB_ONBOARDING_MAX_OPEN_CONNS) overrides the template default.
  configmap: {}
  # -- Existing secrets name
  useExistingSecret: false
  existingSecretName: ""
  # -- Extra environment variables
  extraEnvVars: {}
  # -- Secrets for storing sensitive data
  # @default -- templates/ledger/secrets.yaml
  secrets:
    # -- Onboarding module passwords.
    # DB_ONBOARDING_PASSWORD / DB_ONBOARDING_REPLICA_PASSWORD are single-sourced from
    # the Bitnami postgresql subchart Secret (keys `password` / `replication-password`)
    # and MONGO_ONBOARDING_PASSWORD from the mongodb subchart Secret
    # (key `mongodb-root-password`). Only set these for an EXTERNAL backend
    # (subchart disabled / .external=true) without an existingSecret override.
    DB_ONBOARDING_PASSWORD: ""
    DB_ONBOARDING_REPLICA_PASSWORD: ""
    MONGO_ONBOARDING_PASSWORD: ""
    # -- Transaction module passwords (same single-source rule as onboarding;
    # both DB_* authenticate as role `midaz`, both MONGO_* as the mongo root user).
    DB_TRANSACTION_PASSWORD: ""
    DB_TRANSACTION_REPLICA_PASSWORD: ""
    MONGO_TRANSACTION_PASSWORD: ""
    # -- CRM and Fees module passwords. The unified ledger binary (midaz v4)
    # opens these Mongo databases in-process; same single-source rule as the
    # modules above. Rendered into the ledger Secret, never the ConfigMap.
    MONGO_CRM_PASSWORD: ""
    MONGO_FEES_PASSWORD: ""
    # -- CRM holder-field crypto (lib-crypto). Operator-provided key material
    # protecting PII at rest. Required when the ledger serves CRM and
    # KMS_VENDOR is unset or "none" (legacy mode, local symmetric keys).
    LCRYPTO_HASH_SECRET_KEY: ""
    LCRYPTO_ENCRYPT_SECRET_KEY: ""
    # -- Vault AppRole SecretID, the credential half of the KMS auth pair.
    # Only set when ledger.configmap.KMS_VENDOR="hashicorp-vault" (envelope
    # encryption). The RoleID counterpart is not secret and stays in the
    # ConfigMap.
    KMS_VAULT_SECRET_ID: ""
    # -- Shared passwords.
    # REDIS_PASSWORD is single-sourced from the Bitnami valkey subchart Secret
    # (key `valkey-password`); only set it for an EXTERNAL Valkey/Redis without an
    # existingSecret override. RABBITMQ_* remain operator-provided (see README
    # "Known limitation" — RabbitMQ is not yet single-sourced).
    REDIS_PASSWORD: ""
    RABBITMQ_DEFAULT_PASS: ""
    RABBITMQ_CONSUMER_PASS: ""
    # -- Service discovery (lib-service-discovery) Consul ACL token. Operator-provided;
    # only set when the Consul server enforces ACLs. Rendered into the ledger Secret.
    SD_TOKEN: ""
    # -- Streaming (lib-streaming) SASL/TLS material. Operator-provided; only set
    # when the streaming backend uses SASL auth and/or a private TLS CA. When set,
    # they are rendered into the ledger Secret (never the ConfigMap).
    STREAMING_SASL_PASSWORD: ""
    STREAMING_TLS_CA_CERT: ""
  serviceAccount:
    # -- Specifies whether a ServiceAccount should be created
    create: true
    # -- Annotations for the ServiceAccount
    annotations: {}
    # -- Name of the service account
    # @default -- `midaz-ledger.fullname`
    name: ""
tracer:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  # -- Service name
  name: tracer
  # -- Enable or disable the Tracer service (disabled by default; opt-in per env)
  enabled: false
  # -- Number of replicas for the Tracer service
  replicaCount: 1
  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10
  image:
    # -- Repository for the Tracer service container image. In midaz v4 tracer
    # ships from the monorepo (`components/tracer`) and the release pipeline
    # publishes it as `midaz-tracer`; the standalone `lerianstudio/tracer` 1.x
    # image predates the configuration contract this chart renders.
    repository: lerianstudio/midaz-tracer
    # -- Image pull policy
    pullPolicy: Always
    # -- Image tag used for deployment
    tag: "4.0.0-beta.25"
  # -- Dedicated migration runner (`midaz-tracer-migrations`, built FROM
  # migrate/migrate). The v4 tracer no longer migrates at startup: it boots
  # against an already-migrated schema, so this Job has to apply it.
  migrations:
    # -- Enable or disable the tracer migration Job
    enabled: true
    image:
      # -- Repository for the tracer migration-runner image
      repository: lerianstudio/midaz-tracer-migrations
      # -- Image pull policy
      pullPolicy: IfNotPresent
      # -- Migration image tag. Empty tracks `tracer.image.tag` so the schema and
      # the binary reading it cannot drift.
      tag: ""
    # -- Extra Job annotations. The Job is a plain Sync-phase resource by
    # default because the bundled PostgreSQL Secret it reads is only created
    # during Sync; against a pre-provisioned database, set
    # `argocd.argoproj.io/hook: PreSync` here to order it ahead of the Deployment.
    annotations: {}
    # -- Argo CD sync wave stamped on the tracer Deployment while this Job
    # renders, so the Deployment is applied only once the Job reports Complete
    # (the Job itself stays in the default wave, with the bundled PostgreSQL
    # Secret it reads). Set to "" to drop the annotation and let both apply
    # together. Ignored by plain `helm install`.
    deploymentSyncWave: "1"
    # -- Retries before the Job is marked failed (also absorbs a database that
    # is reachable but not yet provisioned by the bootstrap Job)
    backoffLimit: 6
    # -- Hard timeout for the whole Job
    activeDeadlineSeconds: 600
    # -- How long the finished Job is kept for inspection
    ttlSecondsAfterFinished: 259200
    # -- Wait for the PostgreSQL endpoint before running migrate
    waitForPostgres:
      # -- Enable or disable the wait-for-postgres init container
      enabled: true
      image:
        # -- Repository for the wait-for-postgres init container image
        repository: busybox
        # -- Image tag for the wait-for-postgres init container image
        tag: "1.37"
    resources:
      # -- CPU and memory limits for the migration Job
      limits:
        cpu: 500m
        memory: 256Mi
      # -- Minimum CPU and memory requests for the migration Job
      requests:
        cpu: 50m
        memory: 64Mi
  # -- Secrets for pulling images from a private registry
  imagePullSecrets: []
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  # -- Pod annotations for additional metadata
  podAnnotations: {}
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    # -- Defines the group ID for the user running the process inside the container
    runAsGroup: 1000
    # -- Defines the user ID for the process running inside the container
    runAsUser: 1000
    # -- Ensures the process does not run as root
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    # -- Defines the root filesystem as read-only
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  # -- PodDisruptionBudget configuration
  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Minimum number of available pods. Setting `maxUnavailable` in an
    # override takes precedence over this value.
    minAvailable: 1
    # -- Annotations for the PodDisruptionBudget
    annotations: {}
  # -- Deployment update strategy
  deploymentUpdate:
    # -- Type of deployment strategy
    type: RollingUpdate
    # -- Maximum number of pods that can be created over the desired number of pods
    maxSurge: 1
    # -- Maximum number of pods that can be unavailable during the update
    maxUnavailable: 1
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port (HTTP API)
    port: 4020
    # -- gRPC reservation seam port. Only exposed when
    # `tracer.configmap.TRACER_GRPC_PORT` is set; the seam is off in the app
    # until then, so the port would otherwise route to a closed socket.
    grpcPort: 4021
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 500m
      memory: 512Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 5
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- ConfigMap for environment variables and configurations
  # @default -- templates/tracer/configmap.yaml
  # -- Dedicated datastore mask (override global.datastores). Sub-key: postgres (host/port/user/ssl).
  datastores: {}
  # -- Escape hatch: any native env var overrides the template default.
  configmap: {}
  # -- Extra environment variables
  extraEnvVars: {}
  # -- Secrets for storing sensitive data
  # @default -- templates/tracer/secrets.yaml
  secrets:
    # -- PostgreSQL password. Single-sourced from the Bitnami postgresql subchart
    # Secret (key `password`) when internal; only set for an EXTERNAL PostgreSQL
    # (subchart disabled / .external=true) without an existingSecret override.
    DB_PASSWORD: ""
    # -- API Key value (read by the app as $API_KEY when API_KEY_ENABLED=true).
    API_KEY: ""
    # -- Tenant Manager service API key (required when MULTI_TENANT_ENABLED=true).
    # MULTI_TENANT_SERVICE_API_KEY: ""
    # -- Optional Redis password for the tenant connection-pool registry.
    # MULTI_TENANT_REDIS_PASSWORD: ""
  # -- Existing secrets name
    # -- Service discovery (lib-service-discovery) Consul ACL token. Operator-provided;
    # only set when the Consul server enforces ACLs. Emitted into the tracer Secret only when set.
    SD_TOKEN: ""
  useExistingSecret: false
  existingSecretName: ""
grafana:
  # OpenTelemetry (OTel) dependency for observability.
  # This component is responsible for collecting and exporting telemetry data
  # such as traces and metrics, enhancing the monitoring of the application.
  # For more details, refer to the documentation:
  # https://docs.lerian.studio/docs/observability-in-midaz#midaz-observability-stack
  enabled: false
  name: grafana
  # -- Configure the ingress for Access Grafana Dashboard
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
valkey:
  # Valkey is used to handle scenarios where real-time performance and fast data retrieval are essential.
  # This component is responsible for providing an in-memory data store
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/valkey
    tag: "latest"
  external: false
  architecture: standalone
  auth:
    enabled: true
    password: ""
    username: midaz
  primary:
    kind: Deployment
    resourcesPreset: "medium"
    persistence:
      enabled: false
    extraFlags:
      - "--maxmemory 640mb" # Controls the memory usage limit to prevent OOM (never leave this unset).
      - "--maxmemory-policy allkeys-lru" # Eviction policy when memory limit is reached (LRU works well for caching). Smart eviction strategy for rotating cache.
      - "--hz 100" # Improves responsiveness of internal events and increases the frequency of internal tasks such as memory cleanup, key expiration checks, etc.
      - "--maxclients 10000" # Supports a large number of simultaneous connections
postgresql:
  # PostgreSQL is the backbone of Midaz for managing structured data that demands transactional reliability and consistency.
  # This component is responsible for providing a robust relational database
  # For more details, refer to the documentation:
  # https://docs.lerian.studio/docs/midaz-components#why-postgresql
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/postgresql
    tag: "latest"
  external: false
  architecture: replication
  replication:
    numSynchronousReplicas: 1
  auth:
    enabled: true
    enablePostgresUser: true
    postgresPassword: ""
    username: "midaz"
    password: ""
    database: "onboarding"
    replicationUsername: "replicator"
    replicationPassword: ""
  primary:
    extraVolumes:
      - name: init-script
        configMap:
          name: midaz-init-sql
          items:
            - key: init.sql
              path: init.sql
    extraVolumeMounts:
      - name: init-script
        mountPath: /docker-entrypoint-initdb.d/init.sql
        subPath: init.sql
    persistence:
      size: 8Gi
    resourcesPreset: large
    extendedConfiguration: |
      shared_buffers = 2GB
      max_wal_senders = 20
      wal_keep_size = 512MB
      max_replication_slots = 20
    extraEnvVars:
      - name: POSTGRESQL_WAL_LEVEL
        value: "logical"
      - name: POSTGRESQL_HOST_STANDBY
        value: "on"
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "500"
      - name: POSTGRESQL_TCP_KEEPALIVES_IDLE
        value: "30"
      - name: POSTGRESQL_TCP_KEEPALIVES_INTERVAL
        value: "10"
      - name: POSTGRESQL_TCP_KEEPALIVES_COUNT
        value: "5"
  readReplicas:
    name: replication
    replicaCount: 1
    persistence:
      size: 8Gi
    resourcesPreset: large
    extendedConfiguration: |
      shared_buffers = 2GB
      max_wal_senders = 20
      max_replication_slots = 20
      wal_keep_size = 512MB
    extraEnvVars:
      - name: POSTGRESQL_WAL_LEVEL
        value: "logical"
      - name: POSTGRESQL_HOST_STANDBY
        value: "on"
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "500"
      - name: POSTGRESQL_TCP_KEEPALIVES_IDLE
        value: "40"
      - name: POSTGRESQL_TCP_KEEPALIVES_INTERVAL
        value: "10"
      - name: POSTGRESQL_TCP_KEEPALIVES_COUNT
        value: "5"
mongodb:
  # MongoDB’s flexibility and scalability make it the perfect choice for managing evolving and less structured data.
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/mongodb
    tag: "latest"
  external: false
  auth:
    enabled: true
    rootUser: midaz
    rootPassword: ""
  resourcesPreset: "medium"
  persistence:
    size: 8Gi
rabbitmq:
  enabled: true
  image:
    tag: "3.13.6"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  authentication:
    user:
      value: "midaz"
    password:
      value: ""
    erlangCookie:
      value: ""
  extraSecrets:
    - name: "midaz-rabbitmq-load-definition"
      mountPath: /etc/rabbitmq/definitions
  customConfig: |
    management.load_definitions = /etc/rabbitmq/definitions/load_definition.json
# -- OTEL exporter configuration for midaz services.
# When enabled, HOST_IP, POD_IP, OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_RESOURCE_ATTRIBUTES
# are injected into the `ledger` and `crm` deployments only. Port is fixed at 4317.
# If you need a different collector endpoint, leave enabled=false and configure
# OTEL env vars directly in the application configmap (ledger.configmap / crm.configmap).
otel-collector-lerian:
  # -- Inject OTEL env vars into the midaz ledger and crm deployments
  enabled: true
