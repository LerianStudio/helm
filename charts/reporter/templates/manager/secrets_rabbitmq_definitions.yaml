{{- /* BUNDLED broker only. The groundhog2k rabbitmq subchart mounts this Secret at
   /etc/rabbitmq/definitions and imports it at boot (rabbitmq.customConfig →
   management.load_definitions). Gated on rabbitmq.enabled: the external-broker path
   (externalRabbitmqDefinitions) never reads this Secret — it reads the pristine
   files/rabbitmq/load_definitions.json via the topology bootstrap Job — so emitting it
   there would be dead, and injecting a user hash into a Secret the external path ignores
   would be misleading.

   WHY THE USER LIVES HERE AND NOT IN files/rabbitmq/load_definitions.json: configuring a
   definitions import makes RabbitMQ SKIP seeding the default user from
   RABBITMQ_DEFAULT_USER/PASS, so a users-less file leaves the broker with ZERO users and
   every login is rejected 403. The user must be declared in the imported definitions. It
   is injected HERE (not into the shared file) so the external bootstrap Job keeps reading
   a topology-only file — its render-time guard rejects a top-level "users" key, and the
   external broker provisions its user per tier. See templates/_helpers.tpl
   (reporter.rabbitmqBundledDevPass / rabbitmqLoadDefinitionConsistent). */ -}}
{{- if .Values.rabbitmq.enabled }}
{{- include "reporter.rabbitmqLoadDefinitionConsistent" . }}
{{- $defs := .Files.Get "files/rabbitmq/load_definitions.json" | fromJson }}
{{- $user := .Values.secrets.RABBITMQ_DEFAULT_USER | default "reporter" }}
{{- $hash := (default dict .Values.rabbitmq.loadDefinition).passwordHash }}
{{- $_ := set $defs "users" (list (dict "name" $user "password_hash" $hash "hashing_algorithm" "rabbit_password_hashing_sha256" "tags" "administrator")) }}
{{- $_ := set $defs "permissions" (list (dict "user" $user "vhost" "/" "configure" ".*" "write" ".*" "read" ".*")) }}
apiVersion: v1
kind: Secret
metadata:
  name: "reporter-manager-load-definitions"
type: Opaque
data:
  load_definition.json: {{ toJson $defs | b64enc | quote }}
{{- end }}
