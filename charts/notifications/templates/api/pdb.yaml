{{- $pdb := (include "notifications.api.health" . | fromYaml).pdb }}
{{- if and .Values.api.pdb.enabled $pdb }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "notifications.fullname" . }}
  namespace: {{ include "notifications.namespace" . }}
  labels:
    {{- include "notifications.labels" (dict "context" . "name" .Values.api.name) | nindent 4 }}
  {{- with .Values.api.pdb.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- toYaml $pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "notifications.selectorLabels" (dict "context" . "name" .Values.api.name) | nindent 6 }}
{{- end }}
