{{/*
ONE shared ConfigMap — role-INVARIANT, non-sensitive env. Identical across all
roles, so it is NOT duplicated per role (DRY). The role-specific vars
(STREAMING_HUB_ROLE, the Postgres pool sizes) are deliberately ABSENT here —
they are injected as explicit per-Deployment env in templates/<role>/deployment.yaml
(see templates/_deployment.tpl), which wins over this envFrom layer.

Productized onto lerian-common (cfgValue precedence): every key resolves
  common.configmap.<NATIVE_KEY> (escape hatch) > streamingHub.<group>.<field> > chart default.
Unset groups fall through to the chart default. Grouped params give a typed,
schema-validated API; common.configmap stays as the native per-key escape hatch and
streamingHub.extraEnvVars carries unmodeled keys. Every emitted key exists verbatim
in streaming-hub/.env.reference (the env-parity cross-check) EXCEPT the OTEL
identity keys OTEL_RESOURCE_* and OTEL_LIBRARY_NAME (lib-observability passthrough)
and ENVIRONMENT_NAME (lib-commons SaaS var). PLUGIN_AUTH_* resolve via global.auth
so the env-wide auth endpoint is shared across services.
*/}}
{{- $cm := .Values.streamingHub.common.configmap | default dict }}
{{- $app := .Values.streamingHub.app | default dict }}
{{- $srv := .Values.streamingHub.server | default dict }}
{{- $kafka := .Values.streamingHub.kafka | default dict }}
{{- $kek := .Values.streamingHub.kek | default dict }}
{{- $disp := .Values.streamingHub.dispatch | default dict }}
{{- $pull := .Values.streamingHub.pull | default dict }}
{{- $dlq := .Values.streamingHub.dlq | default dict }}
{{- $mani := .Values.streamingHub.manifest | default dict }}
{{- $rec := .Values.streamingHub.reconciler | default dict }}
{{- $part := .Values.streamingHub.partition | default dict }}
{{- $idem := .Values.streamingHub.idempotency | default dict }}
{{- $auto := .Values.streamingHub.autodisable | default dict }}
{{- $ten := .Values.streamingHub.multiTenant | default dict }}
{{- $sec := .Values.streamingHub.security | default dict }}
{{- $aws := .Values.streamingHub.aws | default dict }}
{{- $obs := .Values.streamingHub.observability | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streaming-hub.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "streaming-hub.labels" (dict "context" . "component" "all") | nindent 4 }}
data:
  # =====================================================================
  # APPLICATION / LIFECYCLE
  # =====================================================================
  STREAMING_HUB_ENV: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_ENV" "params" $app "field" "env" "default" "production") | quote }}
  STREAMING_HUB_LOG_LEVEL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_LOG_LEVEL" "params" $app "field" "logLevel" "default" "info") | quote }}
  STREAMING_HUB_HEALTH_WINDOW: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_HEALTH_WINDOW" "params" $app "field" "healthWindow" "default" "720h") | quote }}
  STREAMING_HUB_SWAGGER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_SWAGGER_ENABLED" "params" $app "field" "swaggerEnabled" "default" "false") | quote }}
  STREAMING_HUB_SHUTDOWN_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_SHUTDOWN_TIMEOUT" "params" $app "field" "shutdownTimeout" "default" "30s") | quote }}
  STREAMING_HUB_PRE_STOP_DRAIN_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PRE_STOP_DRAIN_TIMEOUT" "params" $app "field" "preStopDrainTimeout" "default" "5s") | quote }}

  # =====================================================================
  # HTTP SERVER / METRICS
  # =====================================================================
  STREAMING_HUB_HTTP_LISTEN_ADDR: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_HTTP_LISTEN_ADDR" "params" $srv "field" "httpListenAddr" "default" ":8080") | quote }}
  STREAMING_HUB_METRICS_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_METRICS_ENABLED" "params" $srv "field" "metricsEnabled" "default" "true") | quote }}

  # =====================================================================
  # KAFKA / REDPANDA (external). SCRAM password lives in the Secret.
  # =====================================================================
  STREAMING_HUB_KAFKA_BROKERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KAFKA_BROKERS" "params" $kafka "field" "brokers" "default" "localhost:19092") | quote }}
  STREAMING_HUB_KAFKA_SCRAM_MECHANISM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KAFKA_SCRAM_MECHANISM" "params" $kafka "field" "scramMechanism" "default" "") | quote }}
  STREAMING_HUB_KAFKA_SCRAM_USERNAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KAFKA_SCRAM_USERNAME" "params" $kafka "field" "scramUsername" "default" "") | quote }}
  STREAMING_HUB_KAFKA_TLS_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KAFKA_TLS_ENABLED" "params" $kafka "field" "tlsEnabled" "default" "false") | quote }}
  STREAMING_HUB_KAFKA_CA_CERT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KAFKA_CA_CERT" "params" $kafka "field" "caCert" "default" "") | quote }}

  # =====================================================================
  # CRYPTO / KEK (the material itself is a Secret; source/ref are config)
  # =====================================================================
  STREAMING_HUB_KEK_SOURCE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KEK_SOURCE" "params" $kek "field" "source" "default" "env") | quote }}
  STREAMING_HUB_KEK_REF: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_KEK_REF" "params" $kek "field" "ref" "default" "") | quote }}

  # =====================================================================
  # DISPATCH / POISON (delivery worker pool)
  # =====================================================================
  STREAMING_HUB_DISPATCH_WORKERS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_DISPATCH_WORKERS" "params" $disp "field" "workers" "default" "8") | quote }}
  STREAMING_HUB_DISPATCH_CLAIM_BATCH: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_DISPATCH_CLAIM_BATCH" "params" $disp "field" "claimBatch" "default" "16") | quote }}
  STREAMING_HUB_DISPATCH_IDLE_INTERVAL_MS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_DISPATCH_IDLE_INTERVAL_MS" "params" $disp "field" "idleIntervalMs" "default" "250") | quote }}
  STREAMING_HUB_POISON_THRESHOLD: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_POISON_THRESHOLD" "params" $disp "field" "poisonThreshold" "default" "5") | quote }}

  # =====================================================================
  # PULL RATE LIMIT (source consumption)
  # =====================================================================
  STREAMING_HUB_PULL_RATE: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PULL_RATE" "params" $pull "field" "rate" "default" "100") | quote }}
  STREAMING_HUB_PULL_BURST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PULL_BURST" "params" $pull "field" "burst" "default" "200") | quote }}

  # =====================================================================
  # DLQ VISIBILITY
  # =====================================================================
  STREAMING_HUB_DLQ_GROUP: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_DLQ_GROUP" "params" $dlq "field" "group" "default" "streaming-hub-dlq.local") | quote }}
  STREAMING_HUB_DLQ_RETENTION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_DLQ_RETENTION" "params" $dlq "field" "retention" "default" "168h") | quote }}
  STREAMING_HUB_DLQ_PRUNE_INTERVAL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_DLQ_PRUNE_INTERVAL" "params" $dlq "field" "pruneInterval" "default" "1h") | quote }}

  # =====================================================================
  # MANIFEST (event manifest sources)
  # =====================================================================
  STREAMING_HUB_MANIFEST_SOURCES: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MANIFEST_SOURCES" "params" $mani "field" "sources" "default" "") | quote }}
  STREAMING_HUB_MANIFEST_REFRESH_INTERVAL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MANIFEST_REFRESH_INTERVAL" "params" $mani "field" "refreshInterval" "default" "300") | quote }}

  # =====================================================================
  # RECONCILER (topic-drift detection; dark-ship, defaults on)
  # =====================================================================
  STREAMING_HUB_RECONCILER_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_RECONCILER_ENABLED" "params" $rec "field" "enabled" "default" "true") | quote }}
  STREAMING_HUB_RECONCILER_INTERVAL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_RECONCILER_INTERVAL" "params" $rec "field" "interval" "default" "300") | quote }}

  # =====================================================================
  # PARTITION LIFECYCLE CRON
  # =====================================================================
  STREAMING_HUB_PARTITION_CRON_INTERVAL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PARTITION_CRON_INTERVAL" "params" $part "field" "cronInterval" "default" "6h") | quote }}
  STREAMING_HUB_PARTITION_FUTURE_BUFFER_WEEKS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PARTITION_FUTURE_BUFFER_WEEKS" "params" $part "field" "futureBufferWeeks" "default" "4") | quote }}
  STREAMING_HUB_PARTITION_RETENTION_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PARTITION_RETENTION_ENABLED" "params" $part "field" "retentionEnabled" "default" "false") | quote }}
  STREAMING_HUB_PARTITION_RETENTION_HORIZON: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_PARTITION_RETENTION_HORIZON" "params" $part "field" "retentionHorizon" "default" "0") | quote }}

  # =====================================================================
  # IDEMPOTENCY
  # =====================================================================
  STREAMING_HUB_IDEMPOTENCY_TTL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_IDEMPOTENCY_TTL" "params" $idem "field" "ttl" "default" "24h") | quote }}
  STREAMING_HUB_IDEMPOTENCY_REAP_INTERVAL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_IDEMPOTENCY_REAP_INTERVAL" "params" $idem "field" "reapInterval" "default" "5m") | quote }}

  # =====================================================================
  # AUTO-DISABLE (subscriber failure circuit)
  # =====================================================================
  STREAMING_HUB_AUTODISABLE_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_AUTODISABLE_ENABLED" "params" $auto "field" "enabled" "default" "true") | quote }}
  STREAMING_HUB_AUTODISABLE_FAILURE_WINDOW: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_AUTODISABLE_FAILURE_WINDOW" "params" $auto "field" "failureWindow" "default" "120h") | quote }}
  STREAMING_HUB_AUTODISABLE_FAILURE_SPREAD: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_AUTODISABLE_FAILURE_SPREAD" "params" $auto "field" "failureSpread" "default" "12h") | quote }}

  # =====================================================================
  # TENANCY (F4). Bare MULTI_TENANT_ENABLED is the lib-commons request-tenancy
  # toggle; the STREAMING_HUB_MULTI_TENANT_* block is the hub's SaaS tenant-manager
  # roster (a distinct concern). Default = BYOC single-tenant. A non-default
  # TENANT_ID quarantines all other ce-tenantid events — confirm the producer.
  # =====================================================================
  MULTI_TENANT_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "MULTI_TENANT_ENABLED" "params" $ten "field" "libEnabled" "default" "false") | quote }}
  STREAMING_HUB_TENANT_ID: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_TENANT_ID" "params" $ten "field" "tenantId" "default" "default") | quote }}
  STREAMING_HUB_MULTI_TENANT_ENABLED: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_ENABLED" "params" $ten "field" "enabled" "default" "false") | quote }}
  STREAMING_HUB_MULTI_TENANT_AWS_REGION: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_AWS_REGION" "params" $ten "field" "awsRegion" "default" "") | quote }}
  # Source SELECTOR for tenant secrets (env|secretsmanager reference), NOT secret
  # material — the `| default ""` marks it as intentional config for the standard's
  # secret-in-configmap gate. The actual secrets live in the app Secret.
  STREAMING_HUB_MULTI_TENANT_SECRETS_ENV: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_SECRETS_ENV" "params" $ten "field" "secretsEnv" "default" "") | default "" | quote }}
  STREAMING_HUB_TENANT_MANAGER_URL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_TENANT_MANAGER_URL" "params" $ten "field" "tenantManagerUrl" "default" "") | quote }}
  STREAMING_HUB_MULTI_TENANT_ALLOW_INSECURE_TM: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_ALLOW_INSECURE_TM" "params" $ten "field" "allowInsecureTm" "default" "false") | quote }}
  STREAMING_HUB_MULTI_TENANT_TM_STALENESS_THRESHOLD: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_TM_STALENESS_THRESHOLD" "params" $ten "field" "tmStalenessThreshold" "default" "12h") | quote }}
  STREAMING_HUB_MULTI_TENANT_LISTENER_STALENESS_THRESHOLD: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_LISTENER_STALENESS_THRESHOLD" "params" $ten "field" "listenerStalenessThreshold" "default" "12h") | quote }}
  STREAMING_HUB_MULTI_TENANT_RECONCILE_INTERVAL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_RECONCILE_INTERVAL" "params" $ten "field" "reconcileInterval" "default" "6h") | quote }}
  STREAMING_HUB_MULTI_TENANT_CACHE_TTL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_CACHE_TTL" "params" $ten "field" "cacheTtl" "default" "12h") | quote }}
  STREAMING_HUB_TENANT_MANAGER_CB_THRESHOLD: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_TENANT_MANAGER_CB_THRESHOLD" "params" $ten "field" "cbThreshold" "default" "0") | quote }}
  STREAMING_HUB_TENANT_MANAGER_CB_TIMEOUT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_TENANT_MANAGER_CB_TIMEOUT" "params" $ten "field" "cbTimeout" "default" "30s") | quote }}
  STREAMING_HUB_MULTI_TENANT_REDIS_HOST: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_REDIS_HOST" "params" $ten "field" "redisHost" "default" "") | quote }}
  STREAMING_HUB_MULTI_TENANT_REDIS_PORT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_REDIS_PORT" "params" $ten "field" "redisPort" "default" "") | quote }}
  STREAMING_HUB_MULTI_TENANT_REDIS_TLS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_REDIS_TLS" "params" $ten "field" "redisTls" "default" "false") | quote }}
  STREAMING_HUB_MULTI_TENANT_REDIS_CA_CERT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_MULTI_TENANT_REDIS_CA_CERT" "params" $ten "field" "redisCaCert" "default" "") | quote }}
  ENVIRONMENT_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "ENVIRONMENT_NAME" "params" $ten "field" "environmentName" "default" "") | quote }}

  # =====================================================================
  # SECURITY POSTURE (fail-closed insecure opt-ins; MUST stay false in prod)
  # =====================================================================
  STREAMING_HUB_ALLOW_INSECURE_KAFKA: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_ALLOW_INSECURE_KAFKA" "params" $sec "field" "allowInsecureKafka" "default" "false") | quote }}
  STREAMING_HUB_ALLOW_INSECURE_DB_TLS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_ALLOW_INSECURE_DB_TLS" "params" $sec "field" "allowInsecureDbTls" "default" "false") | quote }}
  STREAMING_HUB_ALLOW_PRIVATE_SINKS: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_ALLOW_PRIVATE_SINKS" "params" $sec "field" "allowPrivateSinks" "default" "false") | quote }}

  # =====================================================================
  # AWS (SaaS setup metadata)
  # =====================================================================
  STREAMING_HUB_AWS_HUB_PRINCIPAL_ARN: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_AWS_HUB_PRINCIPAL_ARN" "params" $aws "field" "hubPrincipalArn" "default" "") | quote }}
  STREAMING_HUB_AWS_SETUP_TEMPLATE_URL: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "STREAMING_HUB_AWS_SETUP_TEMPLATE_URL" "params" $aws "field" "setupTemplateUrl" "default" "") | quote }}

  # =====================================================================
  # AUTHENTICATION (lib-auth / plugin-auth JWT). ENABLED + ADDRESS resolve via
  # global.auth (globalValue: configmap.<KEY> > global.auth.<field> > default) so
  # the env-wide auth endpoint is shared across services.
  # =====================================================================
  PLUGIN_AUTH_ENABLED: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "auth" "field" "enabled" "nativeKey" "PLUGIN_AUTH_ENABLED" "default" "true") | quote }}
  PLUGIN_AUTH_ADDRESS: {{ include "lerian-common.globalValue" (dict "context" $ "configmap" $cm "block" "auth" "field" "address" "nativeKey" "PLUGIN_AUTH_ADDRESS" "default" "http://plugin-access-manager-auth:4000") | quote }}

  # =====================================================================
  # OBSERVABILITY (OTEL_*). OTEL_EXPORTER_OTLP_ENDPOINT is overridden per-pod with
  # $(HOST_IP):4317 via the downward API when streamingHub.telemetry.enabled=true
  # (a CHART-level toggle — not an app env var; see templates/_deployment.tpl).
  # OTEL_LIBRARY_NAME / OTEL_RESOURCE_* are lib-observability identity passthrough.
  # =====================================================================
  OTEL_LIBRARY_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OTEL_LIBRARY_NAME" "params" $obs "field" "libraryName" "default" "github.com/LerianStudio/streaming-hub") | quote }}
  OTEL_RESOURCE_SERVICE_NAME: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OTEL_RESOURCE_SERVICE_NAME" "params" $obs "field" "serviceName" "default" "streaming-hub") | quote }}
  OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT" "params" $obs "field" "deploymentEnvironment" "default" "production") | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OTEL_EXPORTER_OTLP_ENDPOINT" "params" $obs "field" "exporterOtlpEndpoint" "default" "") | quote }}
  OTEL_INSECURE_EXPORTER: {{ include "lerian-common.cfgValue" (dict "configmap" $cm "nativeKey" "OTEL_INSECURE_EXPORTER" "params" $obs "field" "insecureExporter" "default" "false") | quote }}

  # =====================================================================
  # EXTRA OVERRIDES (escape hatch for optional knobs not modeled above)
  # =====================================================================
  {{- range $key, $value := .Values.streamingHub.extraEnvVars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
