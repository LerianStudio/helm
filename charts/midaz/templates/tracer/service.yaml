{{- if .Values.tracer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "midaz-tracer.fullname" . }}
  labels:
    {{- include "midaz-tracer.labels" (dict "context" . "name" .Values.tracer.name ) | nindent 4 }}
  {{- with .Values.tracer.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.tracer.service.type }}
  ports:
    - port: {{ .Values.tracer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.tracer.configmap.TRACER_GRPC_PORT }}
    - port: {{ include "midaz-tracer.grpcPort" . }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
  selector:
    {{- include "midaz-tracer.selectorLabels" (dict "context" . "name" .Values.tracer.name) | nindent 4 }}
{{- end }}
