      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - equal:
          path: data.ALLOW_INSECURE_OTEL
          value: "env-wide reason"
  - it: "pix: an explicit refusal renders as is in the ConfigMap"
    template: templates/pix/configmap.yaml
    set:
