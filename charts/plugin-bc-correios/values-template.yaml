# Template values for plugin-bc-correios deployment
# Copy this file and fill in the required values for your environment
# REQUIRED fields must be set before deployment

bc-correios:
  name: bc-correios
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/lerianstudio/plugin-bc-correios
    pullPolicy: IfNotPresent
    tag: "1.1.0"  # REQUIRED - Set the image version

  imagePullSecrets: []

  ingress:
    enabled: false
    className: "alb"
    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
    hosts:
      - host: ""  # REQUIRED - Set your hostname (e.g., bc-correios.example.com)
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # -- Liveness probe configuration
  livenessProbe:
    # -- HTTP path to probe for liveness
    path: "/health"
    # -- Seconds to wait before the first liveness probe
    initialDelaySeconds: 15
    # -- Seconds between liveness probes
    periodSeconds: 20
    # -- Seconds before the probe times out
    timeoutSeconds: 5
    # -- Number of consecutive successes required to mark the container healthy
    successThreshold: 1
    # -- Number of consecutive failures required to mark the container unhealthy
    failureThreshold: 3

  # -- Readiness probe configuration
  readinessProbe:
    # -- HTTP path to probe for readiness
    path: "/readyz"
    # -- Seconds to wait before the first readiness probe
    initialDelaySeconds: 5
    # -- Seconds between readiness probes
    periodSeconds: 10
    # -- Seconds before the probe times out
    timeoutSeconds: 5
    # -- Number of consecutive successes required to mark the container ready
    successThreshold: 1
    # -- Number of consecutive failures required to mark the container not ready
    failureThreshold: 3

  # -- Startup probe configuration
  startupProbe:
    # -- HTTP path to probe during startup
    path: "/health"
    # -- Seconds to wait before the first startup probe
    initialDelaySeconds: 0
    # -- Seconds between startup probes
    periodSeconds: 10
    # -- Seconds before the probe times out
    timeoutSeconds: 1
    # -- Number of consecutive successes required to mark startup complete
    successThreshold: 1
    # -- Number of consecutive failures required before the container is restarted
    failureThreshold: 30

  configmap:
    # Application Settings
    ALLOW_INSECURE_TLS: "true"
    ENV_NAME: "production"   # "development" skips the production checks on POSTGRES_SSLMODE and ALLOWED_ORIGINS
    APP_NAME: "plugin-bc-correios"
    LOG_LEVEL: "info"
    SERVER_PORT: "9090"
    SERVER_READ_TIMEOUT_SEC: "30"
    SERVER_WRITE_TIMEOUT_SEC: "30"
    SERVER_SHUTDOWN_TIMEOUT_SEC: "30"

    # CORS / Proxy
    ALLOWED_ORIGINS: "*"   # explicit origins are required unless ENV_NAME is "development"; "*" is refused
    TRUSTED_PROXIES: "127.0.0.1,::1"

    # PostgreSQL - REQUIRED
    POSTGRES_HOST: ""       # REQUIRED - PostgreSQL host
    POSTGRES_PORT: "5432"
    POSTGRES_USER: "plugin-bc-correios"
    POSTGRES_NAME: "plugin-bc-correios"
    POSTGRES_SSLMODE: "require"   # Use "require" in production
    POSTGRES_MAX_CONNS: "50"
    POSTGRES_MIN_CONNS: "5"

    # Streaming broker (Kafka API) - REQUIRED
    STREAMING_BROKERS: ""   # REQUIRED - e.g., broker.example.com:9092
    STREAMING_TLS_ENABLED: "false"
    # STREAMING_SASL_MECHANISM: "SCRAM-SHA-512"
    # STREAMING_SASL_USERNAME: ""

    # Cache (Valkey) - REQUIRED
    CACHE_ADDR: ""    # REQUIRED - e.g., bc-correios-valkey:6379
    CACHE_TTL_SEC: "60"

    # Object Storage - REQUIRED
    OBJECT_STORAGE_PROVIDER: "s3"
    OBJECT_STORAGE_ENDPOINT: ""   # REQUIRED - e.g., http://bc-correios-seaweedfs:8333 or AWS S3 URL
    OBJECT_STORAGE_BUCKET: "bc-correios-attachments"
    OBJECT_STORAGE_PATH_STYLE: "true"

    # BC Correio integration - REQUIRED
    BC_CORREIO_ENVIRONMENT: ""    # REQUIRED - homologation or production
    BC_CORREIO_RATE_LIMIT_PER_MINUTE: "50"
    BC_CORREIO_RATE_LIMIT_PER_HOUR: "2700"
    BC_CORREIO_TLS_MIN_VERSION: "TLSv1.2"
    RATE_LIMIT_ENABLED: "true"
    ALLOW_RATELIMIT_FAIL_OPEN: "false"

    # Plugin Auth
    PLUGIN_AUTH_ENABLED: "true"   # "false" is refused unless ENV_NAME is a development name (development, develop, dev, local, test)
    PLUGIN_AUTH_ADDRESS: "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000"

    # License
    LICENSE_KEY: ""   # REQUIRED in every environment

    # AI Insights
    FEATURE_AI_INSIGHTS_ENABLED: "true"
    AI_RATE_LIMIT_PER_MIN: "50"
    AI_MAX_CONCURRENT: "3"

    # Observability
    TRACING_ENABLED: "false"
    METRICS_ENABLED: "false"
    OTEL_EXPORTER_OTLP_ENDPOINT: ""  # REQUIRED when TRACING_ENABLED=true or METRICS_ENABLED=true

  secrets:
    # PostgreSQL - REQUIRED
    POSTGRES_PASSWORD: ""  # REQUIRED - PostgreSQL password

    # Encryption - REQUIRED (AES-256, exactly 32 bytes)
    ENCRYPTION_KEY: ""     # REQUIRED - override dev placeholder

    # Cache (Valkey) credentials, for the external Valkey below (required when its auth is enabled).
    # Alternatively set valkey.auth.existingSecret (+ existingSecretPasswordKey, default
    # "valkey-password"), which takes precedence and is read via secretKeyRef.
    CACHE_PASSWORD: ""

    # Object storage - REQUIRED when using S3 or SeaweedFS with auth
    OBJECT_STORAGE_ACCESS_KEY: ""
    OBJECT_STORAGE_SECRET_KEY: ""

    # Streaming broker SASL password (optional)
    # STREAMING_SASL_PASSWORD: ""

  useExistingSecret: false
  existingSecretName: ""

# ==============================================================================
# INFRASTRUCTURE DEPENDENCIES
# ==============================================================================
# These are pre-configured resources that plugin-bc-correios expects:
#
# PostgreSQL:
#   - Database: plugin-bc-correios
#   - User: plugin-bc-correios (with full privileges)
#   - Schema: public
#
# Streaming broker (Kafka API):
#   - The app publishes to the topic lerian.streaming.br-correios and its dead-letter topic
#     lerian.streaming.br-correios.dlq. Provision both.
#
# Valkey (Redis-compatible):
#   - Used for: caching, rate limiting
#
# SeaweedFS or S3:
#   - Used for: mail attachment storage
#   - Bucket: bc-correios-attachments
# ==============================================================================

# Disable internal dependencies for external infrastructure
valkey:
  enabled: false
  external: true

postgresql:
  enabled: false
  external: true

seaweedfs:
  enabled: false
