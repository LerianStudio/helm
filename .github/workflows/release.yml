name: Helm Release

on:
  push:
    branches:
      - main
      - develop
      # Chart line branches for legacy patches, e.g. hotfix/midaz-5.7.x
      - 'hotfix/*.x'
    paths-ignore:
      - 'README.md'
      - '**/CHANGELOG.md'
      - '.github/workflows/**'
      - '.github/configs/**'
      - '.gitignore'
      - '**/docs/**'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  get-changed-paths:
    if: github.actor != 'lerian-studio-midaz-push-bot[bot]'
    name: Get Changed Paths
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.restrict.outputs.matrix }}
      chart_line_chart: ${{ steps.restrict.outputs.chart_line_chart }}
      chart_line_range: ${{ steps.restrict.outputs.chart_line_range }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed paths
        id: changed-paths
        uses: LerianStudio/github-actions-changed-paths@main
        with:
          filter_paths: charts/
          get_app_name: true
          path_level: 2

      - name: Restrict matrix on chart line branches
        id: restrict
        env:
          MATRIX: ${{ steps.changed-paths.outputs.matrix }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          CHART=""
          RANGE=""

          case "${REF_NAME}" in
            hotfix/*.x)
              STEM="${REF_NAME#hotfix/}"
              CHART=$(printf '%s' "${STEM}" | sed -nE 's/^(.+)-[0-9]+\.[0-9]+\.x$/\1/p')
              RANGE=$(printf '%s' "${STEM}" | sed -nE 's/^.+-([0-9]+\.[0-9]+\.x)$/\1/p')
              ;;
          esac

          if [ -z "${CHART}" ]; then
            {
              echo "matrix=${MATRIX}"
              echo "chart_line_chart="
              echo "chart_line_range="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Chart line branch — restricting the release matrix to '${CHART}' in range ${RANGE}"

          # A chart line branch releases only its own chart. Anything else that
          # changed on the branch would be released with the wrong version range.
          RESTRICTED=$(printf '%s' "${MATRIX}" | jq -c --arg chart "${CHART}" '[.[] | select(.name == $chart)]')

          if [ "${RESTRICTED}" = "[]" ]; then
            echo "::notice::No change to charts/${CHART} in this push — nothing to release"
          fi

          {
            echo "matrix=${RESTRICTED}"
            echo "chart_line_chart=${CHART}"
            echo "chart_line_range=${RANGE}"
          } >> "$GITHUB_OUTPUT"

  release-helm-chart:
    needs: get-changed-paths
    name: Release Helm Chart
    if: needs.get-changed-paths.outputs.matrix != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.get-changed-paths.outputs.matrix) }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private-key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Last Changes
        run: git pull origin ${{ github.ref_name }}

      - name: Set up Helm
        continue-on-error: true
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Homebrew
        id: setup-homebrew
        if: ${{ steps.setup-helm.outcome == 'failure' }}
        uses: Homebrew/actions/setup-homebrew@f119db709c0cd61731df77f0dd22c87511ee9b6a

      - name: Install Helm
        id: install-helm
        if: ${{ steps.setup-helm.outcome == 'failure' }}
        shell: bash
        run: |
          brew install helm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.21'
          cache-dependency-path: .github/scripts/go.sum

      - name: Helm Dependency Update
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: helm dependency update "$CHART_WORKING_DIR"

      - name: Helm Lint
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: helm lint "$CHART_WORKING_DIR"

      - name: Render Helm Chart
        working-directory: .github/scripts
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: |
          chart_name="$(basename "$CHART_WORKING_DIR")"
          go run ./validate-helm-charts --root ../.. --render-gate --charts "$chart_name"

      #- name: Run helm unittest
      #  id: unittest
      #  run: |
      #    helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false
      #    helm unittest ${{ matrix.chart.working_dir }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u lerianstudio --password-stdin

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_committer_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          git_committer_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build scripts
        run: |
          cd .github/scripts
          go build -o update-chart-version-readme-bin ./update-chart-version-readme

      - name: Generate .releaserc file
        env:
          CHART_LINE_RANGE: ${{ needs.get-changed-paths.outputs.chart_line_range }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          CHART_NAME="${{ matrix.chart.name }}"
          CHART_PATH="${{ matrix.chart.working_dir }}"

          if [ "$CHART_NAME" == "plugin-access-manager" ] || [ "$CHART_NAME" == "otel-collector-lerian" ]; then
            PUSH_FILE="$CHART_NAME-\${nextRelease.version}.tgz"
          else
            PUSH_FILE="$CHART_NAME-helm-\${nextRelease.version}.tgz"
          fi

          jq \
            --arg chartPath "$CHART_PATH" \
            --arg tagFormat "$CHART_NAME-v\${version}" \
            --arg successCmd "helm package $CHART_PATH && helm push $PUSH_FILE oci://ghcr.io/lerianstudio" \
            --arg prepareCmd "./.github/scripts/update-chart-version-readme-bin --chart $CHART_NAME --version \${nextRelease.version}" \
            '.plugins[2][1].chartPath = $chartPath |
              .plugins[4][1].assets = [($chartPath + "/Chart.yaml"), "README.md"] |
              .tagFormat = $tagFormat |
              .plugins[3][1].successCmd = $successCmd |
              .plugins[3][1].prepareCmd = $prepareCmd' \
            .github/configs/.releaserc.json > .releaserc

          # On a chart line branch, register it as a semantic-release maintenance
          # branch so the next version stays inside its range (e.g. 5.7.x -> 5.7.1)
          if [ -n "${CHART_LINE_RANGE}" ]; then
            jq \
              --arg name "${BRANCH_NAME}" \
              --arg range "${CHART_LINE_RANGE}" \
              '.branches += [{name: $name, range: $range, channel: $range}]' \
              .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc
          fi

          jq . .releaserc

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic_changelog
        with:
          ci: false
          semantic_version: 23.0.8
          extra_plugins: |
            conventional-changelog-conventionalcommits@v7.0.2
            semantic-release-helm3
            @semantic-release/exec@6.0.3
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}



      # Library charts (type: library) are consumed by other charts and are not
      # deployable applications, so they must not be registered in the Plugin
      # Lifecycle Management. Detect the chart kind to gate the step below.
      - name: Detect library chart
        id: chart-kind
        env:
          CHART_WORKING_DIR: ${{ matrix.chart.working_dir }}
        run: |
          if grep -qiE '^type:[[:space:]]*library([[:space:]]|$)' "$CHART_WORKING_DIR/Chart.yaml"; then
            echo "is_library=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$CHART_WORKING_DIR is a library chart — skipping Plugin Lifecycle Management."
          else
            echo "is_library=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release in Plugin Lifecycle Management
        if: github.ref == 'refs/heads/main' && steps.chart-kind.outputs.is_library != 'true'
        uses: LerianStudio/github-actions-lifecycle-management@main
        with:
          chart_name: "${{ matrix.chart.name }}"
          application_ids: ${{ vars.APPLICATION_IDS }}
          lifecycle_api_token: ${{ secrets.LIFECYCLE_API_TOKEN }}
          working_directory: ${{ matrix.chart.working_dir }}

  notify-release:
    needs:
      - get-changed-paths
      - release-helm-chart
    name: 📢 Release Notification
    if: needs.get-changed-paths.outputs.matrix != '[]' && github.ref == 'refs/heads/main'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.get-changed-paths.outputs.matrix) }}
    uses: ./.github/workflows/release-notification.yml
    with:
      chart_name: ${{ matrix.chart.name }}
      chart_path: ${{ matrix.chart.working_dir }}
    secrets:
      SLACK_BOT_TOKEN_HELM: ${{ secrets.SLACK_BOT_TOKEN_HELM }}
      SLACK_CHANNEL_OPS: ${{ secrets.SLACK_CHANNEL_OPS }}
      SLACK_GROUP_TECH_SUPPORT: ${{ secrets.SLACK_GROUP_TECH_SUPPORT }}
