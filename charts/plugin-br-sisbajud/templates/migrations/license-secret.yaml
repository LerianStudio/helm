{{- /*
Licence hook Secret (PreSync, weight -10): the gated migrator runs before the app Secret
exists, so it gets its own copy of LICENSE_KEY when the key comes from values.
*/ -}}
{{- $s := .Values.sisbajud -}}
{{- $key := include "plugin-br-sisbajud.licenseKeyValue" . -}}
{{- if and $s.enabled $key (not $s.useExistingSecret) (eq (include "plugin-br-sisbajud.migrationsOn" .) "true") (ne (include "plugin-br-sisbajud.postgresBundled" .) "true") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-br-sisbajud.licenseHookName" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-sisbajud.labels" (dict "context" $ "component" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  LICENSE_KEY: {{ $key | quote }}
{{- end -}}
