{{- if and .Values.brSisbajud.enabled (not .Values.brSisbajud.useExistingSecret) -}}
{{- /* Chart-modeled credentials (templates/_helpers.tpl br-sisbajud.secretData),
   then any other brSisbajud.secrets key verbatim, except keys app 1.0.x no
   longer reads (br-sisbajud.removedKeys) and the bundled-infra passwords, which
   are single-sourced from the subchart Secrets. */ -}}
{{- $body := include "br-sisbajud.secretData" . -}}
{{- $emitted := fromYaml $body | default dict -}}
{{- $removed := include "br-sisbajud.removedKeys" . | fromJsonArray -}}
{{- $infra := list "POSTGRES_PASSWORD" "REDIS_PASSWORD" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "br-sisbajud.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "br-sisbajud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $line := splitList "\n" $body }}
  {{- if trim $line }}
  {{ $line }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := (.Values.brSisbajud.secrets | default dict) }}
  {{- if and $v (not (hasKey $emitted $k)) (not (has $k $removed)) (not (has $k $infra)) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
{{- end -}}
