{{- /*
  Keys the chart renders itself, already base64-encoded: subchart-gated
  passwords, `| default` fallbacks and render-if-set keys. Parsed back into a
  map below and written verbatim.
*/}}
{{- define "matcher.secretsExplicit" -}}
# PostgreSQL Secrets
# Single-sourced from the postgresql subchart Secret (<release>-postgresql / password,
# replication-password) when postgresql is internal or an existingSecret is set. Only emitted
# here for external PostgreSQL without an existingSecret (operator-provided password).
{{- $pg := .Values.postgresql | default dict }}
{{- $pgAuth := $pg.auth | default dict }}
{{- if and (not (and (ne (toString $pg.enabled) "false") (not $pg.external))) (not $pgAuth.existingSecret) .Values.matcher.secrets.POSTGRES_PASSWORD }}
POSTGRES_PASSWORD: {{ .Values.matcher.secrets.POSTGRES_PASSWORD | b64enc | quote }}
{{- end }}
{{- if and (not (and (ne (toString $pg.enabled) "false") (not $pg.external))) (not $pgAuth.existingSecret) .Values.matcher.secrets.POSTGRES_REPLICA_PASSWORD }}
POSTGRES_REPLICA_PASSWORD: {{ .Values.matcher.secrets.POSTGRES_REPLICA_PASSWORD | b64enc | quote }}
{{- end }}

# Redis/Valkey Secrets
# Single-sourced from the valkey subchart Secret (<release>-valkey / valkey-password) when
# valkey is internal with auth enabled or an existingSecret is set. Only emitted here for
# external Valkey without an existingSecret (operator-provided password).
{{- $vk := .Values.valkey | default dict }}
{{- $vkAuth := $vk.auth | default dict }}
{{- if and (not (and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled)) (not $vkAuth.existingSecret) .Values.matcher.secrets.REDIS_PASSWORD }}
REDIS_PASSWORD: {{ .Values.matcher.secrets.REDIS_PASSWORD | b64enc | quote }}
{{- end }}

# RabbitMQ Secrets
# Operator-provided and required (fail loud) in both paths. For the bundled
# RabbitMQ the same value is injected into the imported load definitions (the
# matcher user's password), so emitting it here keeps the app credential and
# the broker provisioning in sync; without it Matcher would start with no
# password for RABBITMQ_USER=matcher. For external RabbitMQ it is required
# unless an existingSecret provides it.
{{- $rmq := .Values.rabbitmq | default dict }}
{{- $rmqAuth := $rmq.authentication | default dict }}
{{- if and (ne (toString $rmq.enabled) "false") (not $rmq.external) }}
RABBITMQ_PASSWORD: {{ required "matcher.secrets.RABBITMQ_PASSWORD is required for the bundled RabbitMQ (it provisions the matcher user in the imported load definitions and is the password Matcher connects with)" .Values.matcher.secrets.RABBITMQ_PASSWORD | b64enc | quote }}
{{- else if not $rmqAuth.existingSecret }}
RABBITMQ_PASSWORD: {{ required "matcher.secrets.RABBITMQ_PASSWORD is required for external RabbitMQ without an existingSecret" .Values.matcher.secrets.RABBITMQ_PASSWORD | b64enc | quote }}
{{- end }}

# Object Storage Secrets
OBJECT_STORAGE_ACCESS_KEY_ID: {{ .Values.matcher.secrets.OBJECT_STORAGE_ACCESS_KEY_ID | default "" | b64enc | quote }}
OBJECT_STORAGE_SECRET_ACCESS_KEY: {{ .Values.matcher.secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY | default "" | b64enc | quote }}

{{- /*
  APP_ENC_KEY: engine credential master key (base64 32-byte). REQUIRED in
  production per app init_engine.go. First-class as of 3.2.0 — emitted only when
  set (opt-in), so a default render stays byte-identical. Provide via values or
  an existing Secret. ACTOR_PII_ENCRYPTION_KEY (base64 32-byte) is optional.
*/}}
{{- if .Values.matcher.secrets.APP_ENC_KEY }}
APP_ENC_KEY: {{ .Values.matcher.secrets.APP_ENC_KEY | b64enc | quote }}
{{- end }}
{{- if .Values.matcher.secrets.ACTOR_PII_ENCRYPTION_KEY }}
ACTOR_PII_ENCRYPTION_KEY: {{ .Values.matcher.secrets.ACTOR_PII_ENCRYPTION_KEY | b64enc | quote }}
{{- end }}

# Idempotency Secrets (optional)
{{- if .Values.matcher.secrets.IDEMPOTENCY_HMAC_SECRET }}
IDEMPOTENCY_HMAC_SECRET: {{ .Values.matcher.secrets.IDEMPOTENCY_HMAC_SECRET | b64enc | quote }}
{{- end }}

# Multi-Tenant Secrets (optional)
{{- if .Values.matcher.secrets.MULTI_TENANT_SERVICE_API_KEY }}
MULTI_TENANT_SERVICE_API_KEY: {{ .Values.matcher.secrets.MULTI_TENANT_SERVICE_API_KEY | b64enc | quote }}
{{- end }}

{{- /*
  Streaming (lib-streaming) broker credentials. The non-secret STREAMING_* knobs
  ride matcher.extraEnvVars into the ConfigMap; these three are the only ones
  that must never land there. Emitted only when set, so a default render stays
  byte-identical.
*/}}
{{- if .Values.matcher.secrets.STREAMING_SASL_USERNAME }}
STREAMING_SASL_USERNAME: {{ .Values.matcher.secrets.STREAMING_SASL_USERNAME | b64enc | quote }}
{{- end }}
{{- if .Values.matcher.secrets.STREAMING_SASL_PASSWORD }}
STREAMING_SASL_PASSWORD: {{ .Values.matcher.secrets.STREAMING_SASL_PASSWORD | b64enc | quote }}
{{- end }}
{{- if .Values.matcher.secrets.STREAMING_TLS_CA_CERT }}
STREAMING_TLS_CA_CERT: {{ .Values.matcher.secrets.STREAMING_TLS_CA_CERT | b64enc | quote }}
{{- end }}
{{- end }}

{{- if and .Values.matcher.enabled (not .Values.matcher.useExistingSecret) }}
{{- /*
  Every other non-empty key under matcher.secrets passes through, base64-encoded here.
  The four passwords below are never passed through: whether they belong in
  this Secret depends on the subchart / existingSecret gates above, and the
  Deployment reads them through explicit secretKeyRef entries.
*/}}
{{- $explicit := include "matcher.secretsExplicit" . | fromYaml }}
{{- if hasKey $explicit "Error" }}
{{- fail (printf "matcher secrets explicit block did not parse: %s" $explicit.Error) }}
{{- end }}
{{- $data := deepCopy $explicit }}
{{- range $k, $v := omit (.Values.matcher.secrets | default dict) "POSTGRES_PASSWORD" "POSTGRES_REPLICA_PASSWORD" "REDIS_PASSWORD" "RABBITMQ_PASSWORD" }}
{{- /* An empty value is skipped, not written as an empty key: the chart's own
  "" defaults for render-if-set keys (APP_ENC_KEY, IDEMPOTENCY_HMAC_SECRET, ...)
  must stay absent, exactly as their gates render them. */}}
{{- if and (not (hasKey $explicit $k)) (not (kindIs "invalid" $v)) (ne (toString $v) "") }}
{{- if kindIs "float64" $v }}{{ if eq $v (floor $v) }}{{ $v = int64 $v }}{{ end }}{{ end }}
{{- $_ := set $data $k ($v | toString | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matcher.fullname" . }}
  namespace: {{ include "global.namespace" . }}
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
