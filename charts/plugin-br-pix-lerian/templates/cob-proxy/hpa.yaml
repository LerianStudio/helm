{{- if and .Values.cobProxy.enabled .Values.cobProxy.autoscaling.enabled }}
{{- $component := "cob-proxy" }}
{{- $values := .Values.cobProxy }}
{{- include "lerian-common.hpa" (dict
      "autoscaling" $values.autoscaling
      "name" (include "plugin-br-pix-lerian.componentFullname" (dict "context" $ "component" $component))
      "namespace" (include "global.namespace" $)
      "labels" (include "plugin-br-pix-lerian.labels" (dict "context" $ "component" $component))) }}
{{- end }}
