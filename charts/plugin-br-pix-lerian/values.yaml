# =============================================================================
# OPTIONAL DEPENDENCIES (subcharts) — all disabled by default
#
# Per-component dependency usage (from source audit):
#
#   postgres   spi, spi-systemplane, dict-hub, dict-hub-vsync,
#              dict-systemplane, cob-hub, cob-systemplane (7 components)
#   valkey     spi (optional), dict-hub (optional), dict-hub-vsync (optional)
#   rabbitmq   dict-hub-vsync only
#
# -----------------------------------------------------------------------------
# CREDENTIALS
# -----------------------------------------------------------------------------
# This chart intentionally keeps credential-bearing DSNs in component `secrets`
# blocks, never in `configmap` blocks. Operators must provide dependency
# passwords and DSNs through explicit values or existing Kubernetes Secrets.
#
# IMPORTANT — for external databases (RDS, DocumentDB, ElastiCache,
# AmazonMQ, etc.):
#
#   1. Set `<subchart>.enabled: false` for every external dependency.
#   2. Provide real credentials via a Kubernetes Secret created out-of-band
#      (Vault, AWS Secrets Manager + ESO, sealed-secrets, etc.) and reference
#      it from each component's configmap/secrets override:
#
#        spi:
#          useExistingSecret: true
#          existingSecretName: "pix-lerian-spi-credentials"
#          secrets:
#            DATABASE_URL: "postgres://<user>:<password>@managed.example.com:5432/pix-spi?sslmode=require"
#            VALKEY_URL: "redis://default:<password>@managed.example.com:6379/0"
#
#   3. Override `global.externalPostgresDefinitions.pixLerianCredentials.useExistingSecret.name`
#      when running the bootstrap Job against external infra — never put real
#      passwords in values.yaml.
#
# Image: Bitnami moved free images to bitnamisecure / bitnamilegacy in 2025;
# the upstream subchart points at the now-removed bitnami/* tags by default.
# Override repository to bitnamisecure/* and tolerate the unsigned-image flag.
# =============================================================================

# PostgreSQL (Bitnami chart)
# Used by 7 components for DATABASE_URL / SYSTEMPLANE_POSTGRES_DSN.
# =============================================================================
# SHARED INGRESSES
#
# Two ingress objects, both routed by path prefix:
#
#   appsIngress         — user-facing traffic (SPI, DICT/COB hub+proxy). Single
#                         hostname. adapter-provider-mock is routed separately
#                         under providersIngress, below.
#   systemplaneIngress  — admin/runtime-config traffic (SPI/DICT/COB systemplanes).
#                         Separate hostname so operators can apply stricter
#                         annotations (auth, IP allowlist, WAF) than the apps
#                         ingress without coupling them.
#
# Each `routes` entry maps a path prefix to a component's Service. The chart
# silently skips paths whose target component is disabled.
#
# NO path rewriting is performed at the ingress — apps own their /<component>
# path namespace (e.g. SPI's router registers /spi/health, /spi/keys/lookup).
# =============================================================================

appsIngress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []
  # -- Path-to-component mapping. Each route renders one path rule on every
  # host in `hosts`. The chart skips routes whose `component` is disabled.
  #
  # Each route has:
  #   - `path`         (string, required): URL path prefix
  #   - `pathType`     (string, optional, default "Prefix"): K8s Ingress pathType
  #   - `component`    (string, required): values-key of the component
  #                     (camelCase, e.g. dictHub) — the single source of the
  #                     enabled flag, the Service name AND the backend port
  #   - `serviceName`  (string, optional): kebab-case Service name suffix
  #                     (e.g. dict-hub). Derived from `component` when omitted;
  #                     when set it MUST equal `kebabcase component`, otherwise
  #                     the render fails. The two spellings always describe the
  #                     same component — letting them diverge would pair one
  #                     component's Service with another component's port.
  routes:
    - path: /spi
      pathType: Prefix
      component: spi
      serviceName: spi
    - path: /v1/streaming/manifest
      pathType: Exact
      component: spi
      serviceName: spi
    - path: /dict-hub
      pathType: Prefix
      component: dictHub
      serviceName: dict-hub
    - path: /dict-proxy
      pathType: Prefix
      component: dictProxy
      serviceName: dict-proxy
    - path: /cob-hub
      pathType: Prefix
      component: cobHub
      serviceName: cob-hub
    - path: /cob-proxy
      pathType: Prefix
      component: cobProxy
      serviceName: cob-proxy
    # -- Pix Automatico is published as TWO narrow routes instead of the bare
    # /pixauto prefix it used to carry. The bare prefix also published the M2M
    # group /pixauto/internal/v1/* — the inbound BACEN-derived recurrence
    # callbacks and the scheduler execution sweep — on the apps host.
    #
    # /pixauto/v1 covers everything a client needs: the payer surface
    # (authorization requests, authorizations, scheduled payments), the
    # notification-outbox reprocess endpoint, and the streaming manifest, which
    # the app mounts at {prefix}/v1/streaming/manifest.
    #
    # /pixauto/readyz is kept as an Exact route because the gethomepage.dev/href
    # dashboard annotation targets it. Exact, so it cannot widen into a prefix.
    #
    # /pixauto/internal/v1/* is deliberately absent and must stay absent.
    # templates/ingress-apps.yaml fails the render if a route reintroduces it.
    - path: /pixauto/v1
      pathType: Prefix
      component: pixauto
      serviceName: pixauto
    - path: /pixauto/readyz
      pathType: Exact
      component: pixauto
      serviceName: pixauto

