{{- $mig := .Values.migrations | default dict -}}
{{- /* Minimal, migration-ONLY Secret. Rendered only on the path that needs it: migrations
   enabled, EXTERNAL Postgres (so the Job is a PRE hook that runs before this chart's
   normal Secrets exist), and no operator-supplied existing Secret to read from.

   It carries POSTGRES_PASSWORD and nothing else. The full application Secret stays a
   NORMAL resource on purpose — making it a hook would leave runtime credentials behind
   as orphaned hook objects after an uninstall. Same split as plugin-br-bank-transfer. */ -}}
{{- $mtOn := eq (index (fromYaml (include "plugin-br-pix-jd.effectiveConfig" .)) "MULTI_TENANT_ENABLED" | default "false" | toString) "true" -}}
{{- /* Same skip as the Job: no Job in MT means no hook Secret for it either. */ -}}
{{- if and $mig.enabled (not $mtOn) (not (include "plugin-br-pix-jd.postgresRenders" .)) (not ((.Values.api.existingSecret | default dict).name | default "")) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ printf "%s-migrations" (include "plugin-br-pix-jd.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "plugin-br-pix-jd.namespace" . }}
  labels:
    {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "migrations") | nindent 4 }}
  annotations:
    # Weight -5 so it exists before the migration Job at -1.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-5"
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
stringData:
  POSTGRES_PASSWORD: {{ include "plugin-br-pix-jd.migrationPostgresPassword" . | quote }}
{{- end }}
