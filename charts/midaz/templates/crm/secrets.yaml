{{- if and .Values.crm.enabled (not .Values.crm.useExistingSecret) }}
{{- $mongo := .Values.mongodb | default dict }}
{{- $mongoAuth := $mongo.auth | default dict }}
{{- $mongoInternal := or (and (ne (toString $mongo.enabled) "false") (not $mongo.external)) $mongoAuth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "midaz-crm.fullname" . }}
  labels:
    {{- include "midaz-crm.labels" (dict "context" . "name" .Values.crm.name ) | nindent 4 }}
type: Opaque
data:
  # -- Default sensitive variables for CRM

  # DATA SECURITY (app crypto material — operator-provided, external boundary)
  LCRYPTO_HASH_SECRET_KEY: {{ required "crm.secrets.LCRYPTO_HASH_SECRET_KEY is required" .Values.crm.secrets.LCRYPTO_HASH_SECRET_KEY | b64enc | quote }}
  LCRYPTO_ENCRYPT_SECRET_KEY: {{ required "crm.secrets.LCRYPTO_ENCRYPT_SECRET_KEY is required" .Values.crm.secrets.LCRYPTO_ENCRYPT_SECRET_KEY | b64enc | quote }}
  # MONGO Secrets
  # MONGO_PASSWORD is single-sourced from the Bitnami mongodb subchart Secret
  # (<release>-mongodb, key mongodb-root-password) and injected via secretKeyRef on
  # the CRM Deployment. It is NOT written here for the internal/default case. It is
  # only emitted when MongoDB is EXTERNAL (mongodb disabled or .external=true) without
  # an existingSecret override, and the operator supplied crm.secrets.MONGO_PASSWORD.
  {{- if and (not $mongoInternal) .Values.crm.secrets.MONGO_PASSWORD }}
  MONGO_PASSWORD: {{ .Values.crm.secrets.MONGO_PASSWORD | b64enc | quote }}
  {{- end }}

  # =============================================================================
  # SERVICE DISCOVERY (lib-service-discovery — Consul ACL token, operator-provided)
  # =============================================================================
  SD_TOKEN: {{ .Values.crm.secrets.SD_TOKEN | default "" | b64enc | quote }}

  # =============================================================================
  # STREAMING SECRETS (lib-streaming — SASL password + TLS CA, operator-provided)
  # =============================================================================
  {{- /* SASL password is REQUIRED when a SASL mechanism is configured; the helper
     fails the render otherwise (lib-streaming needs username+password for SASL), so a
     boot-crashing config is caught at deploy time. Mechanism precedence mirrors the
     ConfigMap: configmap.STREAMING_SASL_MECHANISM -> global.streaming.saslMechanism. */ -}}
  {{- $streamingEnabled := eq (include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "STREAMING_ENABLED" "params" .Values.crm.streaming "field" "enabled" "default" "false")) "true" }}
  {{- $saslMech := (((.Values.global | default dict).streaming | default dict).saslMechanism | default "") }}
  {{- if hasKey .Values.crm.configmap "STREAMING_SASL_MECHANISM" }}{{- $saslMech = index .Values.crm.configmap "STREAMING_SASL_MECHANISM" }}{{- end }}
  {{- with (include "lerian-common.streaming.secret" (dict "context" $ "enabled" $streamingEnabled "useExistingSecret" .Values.crm.useExistingSecret "secrets" .Values.crm.secrets "mode" "data" "saslMechanism" $saslMech "valuesPrefix" "crm.secrets." "secretName" (include "midaz-crm.fullname" .))) }}
  {{- . | nindent 2 }}
  {{- end }}

  # =============================================================================
  # KMS — HashiCorp Vault AppRole secret id (operator-provided)
  # =============================================================================
  {{- /* AppRole auth needs both KMS_VAULT_ROLE_ID (ConfigMap) and KMS_VAULT_SECRET_ID
     (Secret). The app fails closed without them, and token auth is rejected in
     saas/byoc — so fail the render fast when vendor=hashicorp-vault + approle and
     either is missing, instead of shipping a boot-crashing config. */ -}}
  {{- $kmsVendor := include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "KMS_VENDOR" "params" .Values.crm.kms "field" "vendor" "default" "hashicorp-vault") }}
  {{- $kmsAuth := include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "KMS_VAULT_AUTH_METHOD" "params" .Values.crm.kms "field" "vaultAuthMethod" "default" "token") }}
  {{- if and (eq $kmsVendor "hashicorp-vault") (eq $kmsAuth "approle") }}
  {{- $kmsRoleId := include "lerian-common.cfgValue" (dict "configmap" .Values.crm.configmap "nativeKey" "KMS_VAULT_ROLE_ID" "params" .Values.crm.kms "field" "vaultRoleId" "default" "") }}
  {{- if not $kmsRoleId }}{{ fail "\n[midaz-crm] KMS_VAULT_ROLE_ID is required when KMS_VENDOR=hashicorp-vault and KMS_VAULT_AUTH_METHOD=approle (set crm.kms.vaultRoleId or crm.configmap.KMS_VAULT_ROLE_ID)" }}{{- end }}
  {{- if not .Values.crm.secrets.KMS_VAULT_SECRET_ID }}{{ fail "\n[midaz-crm] Secret value required but empty: KMS_VAULT_SECRET_ID (KMS AppRole auth) — set crm.secrets.KMS_VAULT_SECRET_ID or configure an existingSecret" }}{{- end }}
  KMS_VAULT_SECRET_ID: {{ .Values.crm.secrets.KMS_VAULT_SECRET_ID | b64enc | quote }}
  {{- end }}
{{- end }}
