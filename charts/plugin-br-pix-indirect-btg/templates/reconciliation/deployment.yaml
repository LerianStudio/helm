{{- $h := include "reconciliation.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reconciliation.fullname" . }}
  labels:
    {{- include "reconciliation.labels" (dict "context" . "name" .Values.reconciliation.name ) | nindent 4 }} 
spec:
  revisionHistoryLimit: {{ .Values.reconciliation.revisionHistoryLimit | default 10 }}
  strategy: {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "reconciliation.selectorLabels" (dict "context" . "name" .Values.reconciliation.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/reconciliation/configmap.yaml") . | sha256sum }}
        {{- if not .Values.reconciliation.useExistingSecrets }}
        checksum/secret: {{ include (print $.Template.BasePath "/reconciliation/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.mtls.enabled (index .Values.mtls "tls.crt") }}
        # Roll the pods when the chart-managed mTLS cert changes (app snapshots it at startup).
        checksum/mtls: {{ include "plugin-br-pix-indirect-btg.mtlsChecksum" . }}
        {{- end }}
      labels:
        {{- omit (include "reconciliation.labels" (dict "context" . "name" .Values.reconciliation.name ) | fromYaml) "helm.sh/chart" | toYaml | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
    {{- with .Values.reconciliation.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- $psc := .Values.reconciliation.podSecurityContext | default dict }}
        {{- if .Values.mtls.enabled }}
        {{- $psc = mergeOverwrite (dict "fsGroup" (.Values.mtls.fsGroup | default 1000)) (deepCopy $psc) }}
        {{- end }}
        {{- toYaml $psc | nindent 8 }}
      containers:
        - name: {{ include "reconciliation.fullname" . }}
          securityContext:
            {{- toYaml .Values.reconciliation.securityContext | nindent 12 }}
          image: {{ .Values.reconciliation.image.repository }}:{{ .Values.reconciliation.image.tag | default (include "plugin.version" .) }}
          imagePullPolicy: {{ .Values.reconciliation.image.pullPolicy }}
          ports:
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
          - secretRef:
              name: {{ if .Values.reconciliation.useExistingSecrets }}{{ .Values.reconciliation.existingSecretName }}{{ else }}{{ include "reconciliation.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "reconciliation.fullname" . }}
          {{- include "plugin-br-pix-indirect-btg.dbPasswordRequired" (dict "context" . "component" "reconciliation") }}
          {{- include "plugin-br-pix-indirect-btg.dbHostRequired" (dict "context" . "component" "reconciliation") }}
          {{- $infraEnv := include "plugin-br-pix-indirect-btg.infraEnv" (dict "context" . "component" "reconciliation" "secretName" (include "reconciliation.fullname" .)) }}
          {{- $otelEnabled := (index .Values "otel-collector-lerian").enabled }}
          env:
          {{- toYaml $h.env | nindent 10 }}
          {{- with $infraEnv }}{{ . | nindent 10 }}{{- end }}
          {{- if $otelEnabled }}
          - name: "HOST_IP"
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
            value: "$(HOST_IP):4317"
          {{- end }}
          resources:
            {{- toYaml .Values.reconciliation.resources | nindent 12 }}
          startupProbe: {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe: {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $h.readinessProbe | nindent 12 }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            {{- include "plugin-br-pix-indirect-btg.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- with .Values.reconciliation.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.reconciliation.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.reconciliation.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        {{- include "plugin-br-pix-indirect-btg.mtlsVolume" . | nindent 8 }}
      {{- end }}