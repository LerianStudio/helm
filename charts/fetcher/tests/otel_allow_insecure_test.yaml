suite: node-local OTEL hop in production (ALLOW_INSECURE_OTEL)
templates:
- templates/manager/deployment.yaml
- templates/worker/deployment.yaml
- templates/manager/configmap.yaml
- templates/manager/secrets.yaml
- templates/worker/configmap.yaml
- templates/worker/secrets.yaml
- templates/common/configmap.yaml
- templates/common/secrets.yaml
release:
  name: fetcher
  namespace: fetcher
tests:
- it: 'manager: emits the node-local reason with telemetry on and the $(HOST_IP) endpoint'
  template: templates/manager/deployment.yaml
  set:
    global.observability.enabled: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(HOST_IP):4317
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: 'false'
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: shared reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: component reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: secret reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: operator reason
- it: 'manager: the legacy common.configmap.ENABLE_TELEMETRY switch emits it too'
  template: templates/manager/deployment.yaml
  set:
    common.configmap.ENABLE_TELEMETRY: 'true'
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: 'false'
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: shared reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: component reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: secret reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: operator reason
- it: 'manager: takes global.observability.allowInsecureOtel env-wide'
  template: templates/manager/deployment.yaml
  set:
    global.observability.enabled: true
    global.observability.allowInsecureOtel: env-wide reason
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: 'false'
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: shared reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: component reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: secret reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: operator reason
- it: 'manager: common.configmap wins over the global'
  template: templates/manager/deployment.yaml
  set:
    global.observability.enabled: true
    global.observability.allowInsecureOtel: env-wide reason
    common.configmap.ALLOW_INSECURE_OTEL: shared reason
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: shared reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: node-local collector on the pod's own node
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: ''
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: 'false'
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: env-wide reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: component reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: secret reason
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: ALLOW_INSECURE_OTEL
        value: operator reason
- it: 'manager: the component configmap wins over common.configmap and the global'
  template: templates/manager/deployment.yaml
  set:
    global.observability.enabled: true
    global.observability.allowInsecureOtel: env-wide reason
