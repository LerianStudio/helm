# br-consignado-gw is a multi-component release: an API, same-origin operator
# console, and a detached PreSync migrations Job. Every component is OFF by
# default so operators explicitly choose what to install.
nameOverride: "br-consignado-gw"
fullnameOverride: ""
namespaceOverride: ""

imagePullSecrets:
  - name: ghcr-credential

serviceAccount:
  create: true
  annotations: {}
  name: ""

api:
  enabled: false
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: ghcr.io/lerianstudio/br-consignado-gw
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  livenessProbe:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # ConfigMap values are emitted verbatim. Add new non-secret API settings here
  # without changing the chart; sensitive values belong in api.secrets.
  configmap:
    ENV_NAME: "development"
    SERVER_ADDRESS: "0.0.0.0:8080"
    POSTGRES_HOST: ""
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ""
    POSTGRES_NAME: ""
    POSTGRES_SSLMODE: ""
    REDIS_HOST: ""
    LOG_LEVEL: "info"
  secrets:
    POSTGRES_PASSWORD: ""
  useExistingSecret: false
  existingSecretName: ""
  extraEnvVars: []
  # Extra pod volumes / container mounts for file-shaped credentials the API
  # reads from disk (Kafka SASL_SSL CA + SCRAM files via STREAMING_KAFKA_*_FILE,
  # ICP-Brasil A1 client certificate via DATAPREV_CERT_FILE/DATAPREV_KEY_FILE).
  # The operator supplies the Secret (e.g. an AVP-rendered raw resource).
  extraVolumes: []
  extraVolumeMounts: []

# The Vite SPA is intentionally separate from the API but shares its ingress
# host. Runtime API_BASE_URL must remain empty (same origin): the console
# rejects a cross-origin API URL to avoid leaking its bearer token.
ui:
  enabled: false
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: ghcr.io/lerianstudio/br-consignado-gw-ui
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  livenessProbe:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /healthz
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # All keys are public browser runtime configuration and rendered at pod boot.
  # CASDOOR_CSP_ORIGIN must be the issuer origin only, never a path.
  configmap:
    API_BASE_URL: ""
    CASDOOR_CSP_ORIGIN: ""
    CASDOOR_ENDPOINT: ""
    CASDOOR_CLIENT_ID: ""
    CASDOOR_ORG_NAME: ""
    CASDOOR_APP_NAME: ""
    AUTH_DISABLED: "false"

# One host serves the SPA at / and proxies the API's public routes on the same
# origin. `/v1` is the product API; platform health/version routes remain
# explicit for external operational checks.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
  apiPaths:
    - path: /v1
      pathType: Prefix
    - path: /health
      pathType: Exact
    - path: /readyz
      pathType: Exact
    - path: /version
      pathType: Exact
    - path: /metrics
      pathType: Exact
  uiPath:
    path: /
    pathType: Prefix
  tls: []

# The API image carries SQL under /migrations, but is distroless. A dedicated
# migrator image is built from migrations/Dockerfile and executes it as an
# ArgoCD PreSync Job. It defaults off with the API, avoiding a no-op install.
migrations:
  enabled: false
  image:
    repository: ghcr.io/lerianstudio/br-consignado-gw-migrations
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  postgres:
    host: ""
    port: ""
    user: ""
    database: ""
    sslMode: ""
    password: ""
    passwordSecret:
      name: ""
      key: POSTGRES_PASSWORD
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Distroless API + nginx-unprivileged UI settings. The UI mounts /tmp as an
# emptyDir because nginx needs temporary paths while the root filesystem stays
# read-only. The UI image pins worker_processes=1 for high-core cluster nodes.
apiSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
uiSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
