{{- if .Values.bankTransfer.enabled }}
{{- if not .Values.bankTransfer.useExistingSecret }}
{{- $configmap := .Values.bankTransfer.configmap | default dict }}
{{- /* A required key already supplied through extraEnvVars (ConfigMap) satisfies its gate below. */}}
{{- $extra := .Values.bankTransfer.extraEnvVars | default dict }}
{{- /* Same global.multiTenant mask configmap.yaml resolves MULTI_TENANT_ENABLED through —
   reading the native key alone here missed global.multiTenant.enabled (CodeRabbit finding),
   same bug already fixed in migrations.yaml. */ -}}
{{- $multiTenantEnabledRaw := include "lerian-common.globalValue" (dict "context" $ "configmap" $configmap "block" "multiTenant" "field" "enabled" "nativeKey" "MULTI_TENANT_ENABLED" "default" "false") -}}
{{- $multiTenantEnabled := eq (lower (toString $multiTenantEnabledRaw)) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bank-transfer.fullname" . }}
  namespace: {{ include "global.namespace" . }}
type: Opaque
stringData:
  # Infra passwords (PostgreSQL / Valkey / MongoDB) are single-sourced from the bundled Bitnami
  # subchart Secrets and read via secretKeyRef on the deployment; see
  # docs/helm-chart-standard.md "Single-Source Infra Secrets". They are written here only for an
  # EXTERNAL infra component without an <subchart>.auth.existingSecret.
  {{- $pg := .Values.postgresql | default dict }}
  {{- $pgAuth := $pg.auth | default dict }}
  {{- if and (not (and (ne (toString $pg.enabled) "false") (not $pg.external))) (not $pgAuth.existingSecret) .Values.bankTransfer.secrets.POSTGRES_PASSWORD }}
  POSTGRES_PASSWORD: {{ .Values.bankTransfer.secrets.POSTGRES_PASSWORD | quote }}
  {{- if .Values.bankTransfer.secrets.POSTGRES_REPLICA_PASSWORD }}
  POSTGRES_REPLICA_PASSWORD: {{ .Values.bankTransfer.secrets.POSTGRES_REPLICA_PASSWORD | quote }}
  {{- end }}
  {{- end }}

  # Redis/Valkey Password (external-only; bundled valkey is read from its subchart Secret)
  {{- $vk := .Values.valkey | default dict }}
  {{- $vkAuth := $vk.auth | default dict }}
  {{- if and (not (and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled)) (not $vkAuth.existingSecret) .Values.bankTransfer.secrets.REDIS_PASSWORD }}
  REDIS_PASSWORD: {{ .Values.bankTransfer.secrets.REDIS_PASSWORD | quote }}
  {{- end }}

  # Multi-Tenant Secrets: MULTI_TENANT_SERVICE_API_KEY (required) + MULTI_TENANT_REDIS_PASSWORD
  {{- with (include "lerian-common.multiTenant.secret" (dict "context" $ "enabled" $multiTenantEnabled "useExistingSecret" .Values.bankTransfer.useExistingSecret "secrets" .Values.bankTransfer.secrets "mode" "stringData" "valuesPrefix" "bankTransfer.secrets." "secretName" (include "bank-transfer.fullname" .))) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.MULTI_TENANT_REDIS_CA_CERT }}
  # -- Optional CA for MULTI_TENANT_REDIS_TLS=true when the cluster's CA isn't
  # in the system trust pool (e.g. AWS ElastiCache/managed Valkey).
  MULTI_TENANT_REDIS_CA_CERT: {{ .Values.bankTransfer.secrets.MULTI_TENANT_REDIS_CA_CERT | quote }}
  {{- end }}
  
  # MongoDB: the app reads only MONGO_URI. With the bundled subchart the deployment assembles it
  # from the subchart Secret (bank-transfer.mongoEnv). An external MongoDB in single-tenant mode
  # needs bankTransfer.secrets.MONGO_URI; multi-tenant resolves Mongo per tenant. A URI that holds
  # $(MONGO_PASSWORD) goes on the deployment instead (Secret values are never expanded), and an
  # external MongoDB without mongodb.auth.existingSecret then takes the password from here.
  {{- $mongoInternal := eq (include "bank-transfer.mongoInternal" .) "true" }}
  {{- $mongoRef := contains "$(" (.Values.bankTransfer.secrets.MONGO_URI | default "") }}
  {{- if and $mongoRef (not $mongoInternal) (not (.Values.mongodb.auth).existingSecret) .Values.bankTransfer.secrets.MONGO_PASSWORD }}
  MONGO_PASSWORD: {{ .Values.bankTransfer.secrets.MONGO_PASSWORD | quote }}
  {{- end }}
  {{- if and (not $mongoRef) (or .Values.bankTransfer.secrets.MONGO_URI (and (not $multiTenantEnabled) (not $mongoInternal) (not (hasKey $extra "MONGO_URI")))) }}
  MONGO_URI: {{ required "bankTransfer.secrets.MONGO_URI is required for an external MongoDB in single-tenant mode (the app reads only MONGO_URI)" .Values.bankTransfer.secrets.MONGO_URI | quote }}
  {{- end }}
  {{- if and (not $multiTenantEnabled) .Values.bankTransfer.secrets.MONGO_TLS_CA_CERT }}
  MONGO_TLS_CA_CERT: {{ .Values.bankTransfer.secrets.MONGO_TLS_CA_CERT | quote }}
  {{- end }}

  # License Key
  {{- if .Values.bankTransfer.secrets.LICENSE_KEY }}
  LICENSE_KEY: {{ .Values.bankTransfer.secrets.LICENSE_KEY | quote }}
  {{- end }}
  # Organization IDs — alternative to configmap.ORGANIZATION_IDS for operators
  # who source it from the same secret store as LICENSE_KEY.
  {{- if .Values.bankTransfer.secrets.ORGANIZATION_IDS }}
  ORGANIZATION_IDS: {{ .Values.bankTransfer.secrets.ORGANIZATION_IDS | quote }}
  {{- end }}

  # CRM Outbound M2M Credentials (optional - when CRM_AUTH_ENABLED=true)
  {{- if .Values.bankTransfer.secrets.CRM_CLIENT_ID }}
  CRM_CLIENT_ID: {{ .Values.bankTransfer.secrets.CRM_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.CRM_CLIENT_SECRET }}
  CRM_CLIENT_SECRET: {{ .Values.bankTransfer.secrets.CRM_CLIENT_SECRET | quote }}
  {{- end }}

  # Fees Outbound M2M Credentials (optional - when FEES_AUTH_ENABLED=true)
  {{- if .Values.bankTransfer.secrets.FEES_CLIENT_ID }}
  FEES_CLIENT_ID: {{ .Values.bankTransfer.secrets.FEES_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.FEES_CLIENT_SECRET }}
  FEES_CLIENT_SECRET: {{ .Values.bankTransfer.secrets.FEES_CLIENT_SECRET | quote }}
  {{- end }}

  # JD SPB Credentials. Single-tenant outside sandbox the app refuses to boot without the
  # user code, password and key info, plus the private key in local_pem signing mode.
  {{- $jdLive := and (not $multiTenantEnabled) (ne (toString $configmap.JD_SANDBOX_MODE) "true") }}
  {{- $jdLocalPem := and $jdLive (eq (lower (trim (toString ($configmap.JD_SIGNING_MODE | default "local_pem")))) "local_pem") }}
  {{- if or (and $jdLive (not (hasKey $extra "JD_USER_CODE"))) .Values.bankTransfer.secrets.JD_USER_CODE }}
  JD_USER_CODE: {{ required "bankTransfer.secrets.JD_USER_CODE is required when JD_SANDBOX_MODE is not true and MULTI_TENANT_ENABLED is not true" .Values.bankTransfer.secrets.JD_USER_CODE | quote }}
  {{- end }}
  {{- if or (and $jdLive (not (hasKey $extra "JD_PASSWORD"))) .Values.bankTransfer.secrets.JD_PASSWORD }}
  JD_PASSWORD: {{ required "bankTransfer.secrets.JD_PASSWORD is required when JD_SANDBOX_MODE is not true and MULTI_TENANT_ENABLED is not true" .Values.bankTransfer.secrets.JD_PASSWORD | quote }}
  {{- end }}
  {{- if or (and $jdLocalPem (not (hasKey $extra "JD_PRIVATE_KEY_PEM"))) .Values.bankTransfer.secrets.JD_PRIVATE_KEY_PEM }}
  JD_PRIVATE_KEY_PEM: {{ required "bankTransfer.secrets.JD_PRIVATE_KEY_PEM is required in JD_SIGNING_MODE=local_pem when JD_SANDBOX_MODE is not true and MULTI_TENANT_ENABLED is not true" .Values.bankTransfer.secrets.JD_PRIVATE_KEY_PEM | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.JD_PUBLIC_KEY_PEM }}
  JD_PUBLIC_KEY_PEM: {{ .Values.bankTransfer.secrets.JD_PUBLIC_KEY_PEM | quote }}
  {{- end }}
  {{- if or (and $jdLive (not (hasKey $extra "JD_PRIVATE_KEY_KEYINFO"))) .Values.bankTransfer.secrets.JD_PRIVATE_KEY_KEYINFO }}
  JD_PRIVATE_KEY_KEYINFO: {{ required "bankTransfer.secrets.JD_PRIVATE_KEY_KEYINFO is required when JD_SANDBOX_MODE is not true and MULTI_TENANT_ENABLED is not true" .Values.bankTransfer.secrets.JD_PRIVATE_KEY_KEYINFO | quote }}
  {{- end }}
  {{- with .Values.bankTransfer.secrets.JD_EXTERNAL_SIGNER_AUTH_TOKEN }}
  JD_EXTERNAL_SIGNER_AUTH_TOKEN: {{ . | quote }}
  {{- end }}

  # Encryption Keys
  # The application expects hex-encoded 32-byte AES-256 keys (64 hex characters).
  # Values.bankTransfer.secrets should provide hex-encoded keys directly.
  JD_INCOMING_RAW_XML_ENCRYPTION_KEY: {{ required "bankTransfer.secrets.JD_INCOMING_RAW_XML_ENCRYPTION_KEY is required" .Values.bankTransfer.secrets.JD_INCOMING_RAW_XML_ENCRYPTION_KEY | quote }}
  RECIPIENT_DETAILS_ENCRYPTION_KEY: {{ required "bankTransfer.secrets.RECIPIENT_DETAILS_ENCRYPTION_KEY is required" .Values.bankTransfer.secrets.RECIPIENT_DETAILS_ENCRYPTION_KEY | quote }}

  # Midaz M2M Credentials (optional)
  {{- if .Values.bankTransfer.secrets.MIDAZ_CLIENT_ID }}
  MIDAZ_CLIENT_ID: {{ .Values.bankTransfer.secrets.MIDAZ_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.MIDAZ_CLIENT_SECRET }}
  MIDAZ_CLIENT_SECRET: {{ .Values.bankTransfer.secrets.MIDAZ_CLIENT_SECRET | quote }}
  {{- end }}

  # RabbitMQ connection URL (when RABBITMQ_ENABLED=true, both modes)
  {{- if and (eq (toString $configmap.RABBITMQ_ENABLED) "true") (not $configmap.RABBITMQ_URL) (not (hasKey $extra "RABBITMQ_URL")) }}
  RABBITMQ_URL: {{ required "bankTransfer.secrets.RABBITMQ_URL is required when RABBITMQ_ENABLED=true (amqps:// outside development/test/local)" .Values.bankTransfer.secrets.RABBITMQ_URL | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.RABBITMQ_EVENT_SIGNING_SECRET }}
  RABBITMQ_EVENT_SIGNING_SECRET: {{ .Values.bankTransfer.secrets.RABBITMQ_EVENT_SIGNING_SECRET | quote }}
  {{- end }}

  # Streaming Credentials (optional - only when a SASL mechanism is configured
  # via global.streaming.saslMechanism/configmap.STREAMING_SASL_MECHANISM)
  {{- if .Values.bankTransfer.secrets.STREAMING_SASL_PASSWORD }}
  STREAMING_SASL_PASSWORD: {{ .Values.bankTransfer.secrets.STREAMING_SASL_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.STREAMING_TLS_CA_CERT }}
  STREAMING_TLS_CA_CERT: {{ .Values.bankTransfer.secrets.STREAMING_TLS_CA_CERT | quote }}
  {{- end }}

  # Webhook Secrets (optional - when WEBHOOK_ENABLED=true)
  {{- if .Values.bankTransfer.secrets.WEBHOOK_SIGNING_SECRET }}
  WEBHOOK_SIGNING_SECRET: {{ .Values.bankTransfer.secrets.WEBHOOK_SIGNING_SECRET | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.WEBHOOK_BROKER_EVENT_SIGNING_SECRET }}
  WEBHOOK_BROKER_EVENT_SIGNING_SECRET: {{ .Values.bankTransfer.secrets.WEBHOOK_BROKER_EVENT_SIGNING_SECRET | quote }}
  {{- end }}

  {{- /* System Facts client pair (optional unless SYSTEM_FACTS_ENABLED=true). Exchanged for
     a bearer at PLUGIN_AUTH_ADDRESS. Single-tenant: delivers AND registers the contract.
     Multi-tenant: the SERVICE credential that registers the contract at boot (each tenant
     still delivers with its own M2M credential); the app requires it there. Both or
     neither: a partial pair is refused by the app. */}}
  {{- $sfEnabled := eq (lower (toString (index $configmap "SYSTEM_FACTS_ENABLED" | default "false"))) "true" }}
  {{- $sfID := .Values.bankTransfer.secrets.SYSTEM_FACTS_CLIENT_ID | default "" }}
  {{- $sfSecret := .Values.bankTransfer.secrets.SYSTEM_FACTS_CLIENT_SECRET | default "" }}
  {{- if and $sfEnabled (or $sfID $sfSecret) (not (and $sfID $sfSecret)) }}
  {{- fail "\n\nERROR: bankTransfer.secrets.SYSTEM_FACTS_CLIENT_ID and SYSTEM_FACTS_CLIENT_SECRET go together: set both or neither.\nA partial pair counts as no pair in the app, so the producer would refuse to boot.\n" }}
  {{- end }}
  {{- if and $sfEnabled $multiTenantEnabled (not (and $sfID $sfSecret)) }}
  {{- fail "\n\nERROR: bankTransfer.secrets.SYSTEM_FACTS_CLIENT_ID and SYSTEM_FACTS_CLIENT_SECRET are required when SYSTEM_FACTS_ENABLED=true and MULTI_TENANT_ENABLED=true.\nThey are the service credential that registers the contract at boot; the app refuses to boot without them.\n" }}
  {{- end }}
  {{- if $sfEnabled }}
  {{- with $sfID }}
  SYSTEM_FACTS_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with $sfSecret }}
  SYSTEM_FACTS_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Courier Outbound M2M Credentials (optional - courier integration, added in app 2.2.0)
  {{- if .Values.bankTransfer.secrets.COURIER_CLIENT_ID }}
  COURIER_CLIENT_ID: {{ .Values.bankTransfer.secrets.COURIER_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.bankTransfer.secrets.COURIER_CLIENT_SECRET }}
  COURIER_CLIENT_SECRET: {{ .Values.bankTransfer.secrets.COURIER_CLIENT_SECRET | quote }}
  {{- end }}

  {{- /* Access Manager permission declaration (RI) client pair — lerian-common.idp.secret,
     each key only when set. Read by lib-auth's declaration.WireFromEnv only when
     IDP_DECLARATION_ENABLED="true" (ConfigMap, lerian-common.idp.env). With the flag on,
     the app refuses to boot without this pair. */}}
  {{- with (include "lerian-common.idp.secret" (dict "secrets" .Values.bankTransfer.secrets "mode" "stringData" "useExistingSecret" .Values.bankTransfer.useExistingSecret)) }}
  {{- . | nindent 2 }}
  {{- end }}

{{- end }}
{{- end }}
