{{- /*
Control-plane migrations Job (ADR-013, plugin-br-payments repo). Runs the
/controlplane-migrate binary (Task 2.1.1) against migrations/controlplane/,
which never applies at app boot — the control-plane inventory is declared,
not a silent svc.DB fallback.

Renders ONLY when all four are true:
  - app.configmap.MULTI_TENANT_ENABLED=true. Single-tenant already applies
    every migration automatically at boot (internal/bootstrap/service.go,
    applyStartupMigrationsIfOwned), so running this Job too would be
    redundant, not incorrect — it stays gated out. Gate reads the same way
    _helpers.tpl and NOTES.txt already do (no `lower`/`get`/`default` of its
    own — an absent key renders "<nil>" via toString, not "", but that still
    never equals "true", which is all the comparison needs).
  - global.externalPostgresDefinitions.enabled=true AND the chart's own
    "postgresql.enabled" helper (_helpers.tpl) resolves to "false" — i.e.
    Postgres is genuinely external, not just flagged as such.
    externalPostgresDefinitions.enabled alone is NOT a reliable stand-in for
    "external Postgres": it is independent of postgresql.enabled/
    postgresql.external, and the chart's own default is a BUNDLED Postgres
    (postgresql.enabled: true, postgresql.external: false). Gating on
    externalPostgresDefinitions.enabled alone let a caller set it to true
    while leaving postgresql.enabled at its default true — the Job then
    rendered and resolved its POSTGRES_HOST to the bundled subchart's own
    Sync-phase Secret, which does not exist yet when this PreSync hook runs,
    deadlocking the release. The extra "postgresql.enabled" != "true" check
    (same helper templates/configmap.yaml and templates/deployment.yaml
    already use to tell bundled from external) closes that gap: in the
    bundled mode the Bitnami StatefulSet/Service/Secret are ordinary
    Sync-phase resources with zero ordering guarantee relative to this
    PreSync Job, and there is no wait-for-postgres init container here. This
    Job only supports, and is only tested against, the external-Postgres
    mode bootstrap-postgres.yaml provisions into (that template now carries
    its own PreSync hook at weight -10, so the role/database is guaranteed
    to exist before this Job runs at weight -1, and now shares the identical
    exclusivity gate) — so it stays gated out of the bundled-Postgres path
    entirely rather than pretend to support it.

    That "postgresql.enabled" helper is itself only an OR of two flags
    (postgresql.enabled/postgresql.external) and does not track Chart.yaml's
    actual dependency condition (`condition: postgresql.enabled`, the literal
    value alone) — so postgresql.external=true with postgresql.enabled left
    at its default true still renders the bundled subchart while this helper
    reports "external", passing the render gate below straight into a double
    render. plugin-br-payments.validatePostgresExclusivity (_helpers.tpl,
    included unconditionally below, before the render gate) fails the whole
    render on that literal combination regardless of which of the two flags
    is set, closing that gap independently of this gate.
  - app.controlplaneMigrations.enabled=true (default false) — app.image
    resolves to the currently released plugin-br-payments image today, which
    does NOT contain /controlplane-migrate; that binary exists only on an
    still-unmerged plugin-br-payments branch. Do not flip this on until a
    plugin-br-payments release containing the binary is deployed — see
    CHANGELOG.md.

Postgres connection env vars are inlined rather than envFrom-ing the app
ConfigMap (templates/configmap.yaml): that ConfigMap carries no hook
annotation and is a normal Sync-phase resource, so on a first
install/first ArgoCD sync it does not exist yet when this PreSync hook runs —
envFrom against it produced CreateContainerConfigError and a release that
could never complete. Mirrors charts/plugin-br-bank-transfer/templates/migrations.yaml
and charts/br-slc, which avoid the same trap the same way.

POSTGRES_HOST/POSTGRES_PORT read from app.configmap.POSTGRES_HOST/
POSTGRES_PORT — the SAME source templates/deployment.yaml's app container
resolves via its envFrom of templates/configmap.yaml — NOT from
global.externalPostgresDefinitions.connection.host/.port. This Job's
migrations must land on the exact database the app is about to connect to,
and that is never guaranteed to be the same value: connection.host/.port only
default to the BUNDLED subchart's own Service name/port
("plugin-br-payments-postgresql-primary" / "5432" in values.yaml) and exist
to tell templates/bootstrap-postgres.yaml (weight -10) which external host to
provision a role/database on — an operator following this chart's own README
"Production layout" sets app.configmap.POSTGRES_HOST to the real external
host but is never required to touch connection.host to the same value, so
reading connection.host here rendered this Job against the bundled Service
name while the app's ConfigMap correctly resolved to the real host: two
templates, two different hosts, from the exact same values. Reading
app.configmap.POSTGRES_HOST/POSTGRES_PORT here instead keeps this Job and the
app Deployment in agreement by construction. configmap.yaml's resolution has
a second branch — deriving a host dynamically from the bundled subchart's own
name helper when postgresql.enabled is genuinely true — but the render gate
above already requires "postgresql.enabled" to resolve to "false" before this
Job renders at all, so that branch can never apply here and is intentionally
not reproduced; app.configmap.POSTGRES_HOST is the only live source in this
Job's own external-only context, exactly as it is for the app in that same
context. POSTGRES_PORT is never derived in configmap.yaml either — it is a
straight copy of app.configmap.POSTGRES_PORT (chart default "5432") — so this
Job copies it the same way.

POSTGRES_PASSWORD stays a secretRef (unchanged) — templates/secrets.yaml IS
already a pre-install hook at weight -5, so it lands safely before this Job
(-1).

activeDeadlineSeconds is kept at or below Helm's default 300s release
timeout (`helm upgrade --timeout`) on purpose: a PreSync hook Job that can
run longer than the release timeout risks `helm upgrade` giving up while the
Job is still in flight. Deployments that need a longer migration budget must
pass a matching `--timeout` explicitly.
*/}}
{{- $defaultMigrationResources := dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "250m" "memory" "256Mi") }}
{{- include "plugin-br-payments.validatePostgresExclusivity" . }}
{{- if and (eq (.Values.app.configmap.MULTI_TENANT_ENABLED | toString) "true") .Values.global.externalPostgresDefinitions.enabled (ne (include "postgresql.enabled" .) "true") .Values.app.controlplaneMigrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-controlplane-migrations" (include "plugin-br-payments.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 4 }}
    app.kubernetes.io/component: controlplane-migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "argocd.argoproj.io/hook": PreSync
    "helm.sh/hook-weight": "-1"
    "argocd.argoproj.io/sync-wave": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      # Deliberately WITHOUT plugin-br-payments.selectorLabels
      # (app.kubernetes.io/name + app.kubernetes.io/instance): pdb.yaml's
      # minAvailable and service.yaml's selector both key on exactly those
      # two labels, and this Job's pod is transient (Never restartPolicy,
      # gone once the migration completes) — it must never be counted
      # toward the app's PodDisruptionBudget or receive live Service
      # traffic. Mirrors plugin-br-bank-transfer's component-scoped
      # selector labels, which exclude its own migration pod the same way.
      labels:
        helm.sh/chart: {{ include "plugin-br-payments.chart" . }}
        app.kubernetes.io/version: {{ include "plugin-br-payments.versionLabelValue" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/part-of: plugin-br-payments
        app.kubernetes.io/component: controlplane-migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controlplane-migrations
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Same image as the app Deployment (templates/deployment.yaml) — the
          # control-plane migrate binary ships alongside /app in that image
          # (repo plugin-br-payments, Task 2.1.1). Only the entrypoint changes.
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default (include "plugin-br-payments.defaultTag" .) }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["/controlplane-migrate"]
          # Inlined connection settings — NOT envFrom the app ConfigMap. See
          # the file header comment: that ConfigMap is a plain Sync-phase
          # resource and does not exist yet when this PreSync hook runs on a
          # first install. POSTGRES_HOST/POSTGRES_PORT read from
          # app.configmap.POSTGRES_HOST/POSTGRES_PORT — the same source
          # templates/deployment.yaml's app container resolves via its
          # envFrom of templates/configmap.yaml — so this Job's migrations
          # always target the exact host/port the app itself will connect
          # to, rather than global.externalPostgresDefinitions.connection.host/
          # .port, whose non-empty chart defaults name the BUNDLED subchart's
          # own Service and exist only to tell templates/bootstrap-postgres.yaml
          # which external host to provision a role/database on.
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.app.configmap.POSTGRES_HOST | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.app.configmap.POSTGRES_PORT | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.app.configmap.POSTGRES_USER | default "plugin_br_payments" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.app.configmap.POSTGRES_DB | default "plugin_br_payments" | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.app.configmap.POSTGRES_SSLMODE | default "require" | quote }}
            - name: POSTGRES_CONNECT_TIMEOUT_SEC
              value: {{ .Values.app.configmap.POSTGRES_CONNECT_TIMEOUT_SEC | default "10" | quote }}
            {{- $pg := .Values.postgresql | default dict }}
            {{- $pgAuth := $pg.auth | default dict }}
            {{- if or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
            {{- include "plugin-br-payments.infraSecretRef" (dict "context" $ "subchart" "postgresql" "key" "password" "envName" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- else if .Values.app.secrets.POSTGRES_PASSWORD }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.useExistingSecret }}{{ .Values.app.existingSecretName }}{{ else }}{{ include "plugin-br-payments.fullname" . }}{{ end }}
                  key: POSTGRES_PASSWORD
            {{- end }}
          resources:
            {{- toYaml (.Values.app.controlplaneMigrations.resources | default $defaultMigrationResources) | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
