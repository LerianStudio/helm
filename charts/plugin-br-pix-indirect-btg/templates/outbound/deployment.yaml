{{- $h := include "outbound.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "outbound.fullname" . }}
  labels:
    {{- include "outbound.labels" (dict "context" . "name" .Values.outbound.name ) | nindent 4 }} 
spec:
  revisionHistoryLimit: {{ .Values.outbound.revisionHistoryLimit | default 10 }}
  strategy: {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "outbound.selectorLabels" (dict "context" . "name" .Values.outbound.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/outbound/configmap.yaml") . | sha256sum }}
        {{- if not .Values.outbound.useExistingSecrets }}
        checksum/secret: {{ include (print $.Template.BasePath "/outbound/secrets.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- omit (include "outbound.labels" (dict "context" . "name" .Values.outbound.name ) | fromYaml) "helm.sh/chart" | toYaml | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
    {{- with .Values.outbound.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.outbound.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "outbound.fullname" . }}
          securityContext:
            {{- toYaml .Values.outbound.securityContext | nindent 12 }}
          image: {{ .Values.outbound.image.repository }}:{{ .Values.outbound.image.tag | default (include "plugin.version" .) }}
          imagePullPolicy: {{ .Values.outbound.image.pullPolicy }}
          ports:
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
          - secretRef:
              name: {{ if .Values.outbound.useExistingSecrets }}{{ .Values.outbound.existingSecretName }}{{ else }}{{ include "outbound.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "outbound.fullname" . }}
          {{- include "plugin-br-pix-indirect-btg.dbPasswordRequired" (dict "context" . "component" "outbound") }}
          {{- include "plugin-br-pix-indirect-btg.mongoPasswordRequired" (dict "context" . "component" "outbound") }}
          {{- include "plugin-br-pix-indirect-btg.dbHostRequired" (dict "context" . "component" "outbound") }}
          {{- include "plugin-br-pix-indirect-btg.mongoHostRequired" (dict "context" . "component" "outbound") }}
          {{- $infraEnv := include "plugin-br-pix-indirect-btg.infraEnv" (dict "context" . "component" "outbound" "secretName" (include "outbound.fullname" .)) }}
          {{- $otelEnabled := (index .Values "otel-collector-lerian").enabled }}
          env:
          {{- toYaml $h.env | nindent 10 }}
          {{- with (include "plugin-br-pix-indirect-btg.licenseFileEnv" . | trim) }}{{ . | nindent 10 }}{{- end }}
          {{- with $infraEnv }}{{ . | nindent 10 }}{{- end }}
          {{- if $otelEnabled }}
          - name: "HOST_IP"
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
            value: "$(HOST_IP):4317"
          {{- end }}
          resources:
            {{- toYaml .Values.outbound.resources | nindent 12 }}
          startupProbe: {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe: {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $h.readinessProbe | nindent 12 }}
          {{- with (include "plugin-br-pix-indirect-btg.licenseFileMount" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with .Values.outbound.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.outbound.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.outbound.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "plugin-br-pix-indirect-btg.licenseFileVolume" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
