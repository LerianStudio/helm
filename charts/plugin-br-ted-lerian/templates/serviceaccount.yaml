{{- if and (index .Values "plugin-br-ted-lerian").enabled (index .Values "plugin-br-ted-lerian").serviceAccount.create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" (index .Values "plugin-br-ted-lerian").serviceAccount
      "name" (include "plugin-br-ted-lerian.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "plugin-br-ted-lerian.labels" (dict "context" . "component" (index .Values "plugin-br-ted-lerian").name "name" (index .Values "plugin-br-ted-lerian").name))
    ) }}
{{- end }}
