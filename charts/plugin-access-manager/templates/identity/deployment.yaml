{{- $h := include "plugin-identity.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-identity.fullname" . }}
  labels:
    {{- include "plugin-identity.labels" (dict "context" . "name" .Values.identity.name ) | nindent 4 }} 
spec:
  revisionHistoryLimit: {{ .Values.identity.revisionHistoryLimit | default 10 }}
  strategy:
    {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plugin-identity.selectorLabels" (dict "context" . "name" .Values.identity.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/identity/secrets.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/identity/configmap.yaml") . | sha256sum }}
        checksum/init-user: {{ include (print $.Template.BasePath "/auth/init_user.yaml") . | sha256sum }}
      labels:
       {{- include "plugin-identity.labels" (dict "context" . "name" .Values.identity.name "pod" true) | nindent 8 }} 
    spec:
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
    {{- with .Values.identity.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.identity.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "plugin-identity.fullname" . }}
          image: {{ .Values.identity.image.repository }}:{{ .Values.identity.image.tag | default (include "plugin.version" .) }}
          imagePullPolicy: {{ .Values.identity.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.identity.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.identity.service.port }}
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
          - secretRef:
              name: {{ if .Values.identity.useExistingSecret }}{{ required "\n\nERROR: identity.useExistingSecret is true but identity.existingSecretName is empty.\n   Set identity.existingSecretName to the name of the Secret holding the identity environment (AUTHORIZER_CLIENT_SECRET, LICENSE_KEY, ORGANIZATION_IDS, ...), or set identity.useExistingSecret=false.\n" .Values.identity.existingSecretName }}{{ else }}{{ include "plugin-identity.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "plugin-identity.fullname" . }}
          env:
            {{- toYaml $h.env | nindent 12 }}
            {{- with (include "plugin-access-manager.licenseFileEnv" .Values.identity | trim) }}{{ . | nindent 12 }}{{ end }}
          {{- if (index .Values "otel-collector-lerian").enabled }}
            - name: "HOST_IP"
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: "$(HOST_IP):4317"
          {{- end }}
          {{- if .Values.auth.initUser.enabled }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "plugin-access-manager.initUserSecretName" . | quote }}
                  key: {{ .Values.auth.initUser.adminPasswordSecretKey | default "ADMIN_PASSWORD" | quote }}
                  optional: true
            - name: ADMIN_EMAIL
              value: {{ .Values.auth.initUser.adminEmail | default "admin@midaz.tech" | quote }}
            - name: ADMIN_DISPLAY_NAME
              value: {{ .Values.auth.initUser.adminDisplayName | default "Admin" | quote }}
          {{- end }}
          {{- with (include "plugin-access-manager.licenseFileMount" .Values.identity | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          startupProbe:
            {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $h.readinessProbe | nindent 12 }}
      {{- with (include "plugin-access-manager.licenseFileVolume" .Values.identity | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- /* nodeSelector / affinity / tolerations + topologySpreadConstraints
             (global.scheduling.spread preset, identity.spread, identity.topologySpreadConstraints).
             selectorLabels MUST equal spec.selector.matchLabels above. */}}
      {{- with (include "lerian-common.scheduling" (dict
            "component" .Values.identity
            "global" .Values.global
            "selectorLabels" (include "plugin-identity.selectorLabels" (dict "context" . "name" .Values.identity.name))) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
