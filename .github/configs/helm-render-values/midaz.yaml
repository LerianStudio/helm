crm:
  secrets:
    # App crypto material — operator-provided (external boundary).
    LCRYPTO_HASH_SECRET_KEY: "sample"
    LCRYPTO_ENCRYPT_SECRET_KEY: "sample"
ledger:
  secrets:
    # RabbitMQ — operator-provided; not yet single-sourced (see chart README
    # "Known limitation"). The infra passwords (Postgres/Mongo/Valkey) are now
    # single-sourced from the Bitnami subchart Secrets, so they are intentionally
    # omitted here.
    RABBITMQ_DEFAULT_PASS: "sample"
    RABBITMQ_CONSUMER_PASS: "sample"
  # Regression guard: on-prem service-discovery WITHOUT an Ingress. The legacy
  # flat configmap.SD_EXTERNAL_* keys must survive to the rendered ConfigMap even
  # though ledger.ingress.enabled=false (no derivable external host). Exercises
  # the lerian-common external-endpoint precedence fix through this consumer.
  configmap:
    SD_ENABLED: "true"
    SD_ADDRESS: "consul.onprem:8500"
    SD_EXTERNAL_ADDRESS: "https://ledger.onprem.local"
    SD_EXTERNAL_PORT: "8443"
