{{- $h := include "plugin-auth.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-auth.fullname" . }}
  labels:
    {{- include "plugin-auth.labels" (dict "context" . "name" .Values.auth.name ) | nindent 4 }} 
spec:
  revisionHistoryLimit: {{ .Values.auth.revisionHistoryLimit | default 10 }}
  strategy:
    {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plugin-auth.selectorLabels" (dict "context" . "name" .Values.auth.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/auth/secrets.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/auth/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "plugin-auth.labels" (dict "context" . "name" .Values.auth.name "pod" true) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
    {{- with .Values.auth.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.auth.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "plugin-auth.fullname" . }}
          securityContext:
            {{- toYaml .Values.auth.securityContext | nindent 12 }}
          image: {{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag | default (include "plugin.version" .) }}
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.service.port }}
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
          - secretRef:
              name: {{ if .Values.auth.useExistingSecret }}{{ required "\n\nERROR: auth.useExistingSecret is true but auth.existingSecretName is empty.\n   Set auth.existingSecretName to the name of the Secret holding the auth environment (AUTHORIZER_CLIENT_SECRET, LICENSE_KEY, ORGANIZATION_IDS, ...), or set auth.useExistingSecret=false.\n" .Values.auth.existingSecretName }}{{ else }}{{ include "plugin-auth.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "plugin-auth.fullname" . }}
          env:
            {{- toYaml $h.env | nindent 12 }}
            {{- with (include "plugin-access-manager.licenseFileEnv" .Values.auth | trim) }}{{ . | nindent 12 }}{{ end }}
          {{- if (index .Values "otel-collector-lerian").enabled }}
            - name: "HOST_IP"
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: "OTEL_EXPORTER_OTLP_ENDPOINT"
              value: "$(HOST_IP):4317"
          {{- end }}
          {{- with (include "plugin-access-manager.licenseFileMount" .Values.auth | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          startupProbe:
            {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $h.readinessProbe | nindent 12 }}
      {{- with (include "plugin-access-manager.licenseFileVolume" .Values.auth | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- /* nodeSelector / affinity / tolerations + topologySpreadConstraints
             (global.scheduling.spread preset, auth.spread, auth.topologySpreadConstraints).
             selectorLabels MUST equal spec.selector.matchLabels above. */}}
      {{- with (include "lerian-common.scheduling" (dict
            "component" .Values.auth
            "global" .Values.global
            "selectorLabels" (include "plugin-auth.selectorLabels" (dict "context" . "name" .Values.auth.name))) | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
