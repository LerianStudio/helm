{{- if not .Values.manager.useExistingSecret }}
{{- $_ := required "secrets.RABBITMQ_DEFAULT_PASS is required" .Values.secrets.RABBITMQ_DEFAULT_PASS }}
{{- $_ := required "secrets.DATASOURCE_ONBOARDING_PASSWORD is required" .Values.secrets.DATASOURCE_ONBOARDING_PASSWORD }}
{{- include "reporter.rabbitmqErlangCookieRequired" . }}
{{- include "reporter.rabbitmqExistingSecretConsistent" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plugin-manager.fullname" . }}
  labels:
    {{- include "plugin-manager.labels" (dict "context" . "name" .Values.manager.name ) | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
type: Opaque
data:
  # MONGO_PASSWORD is single-sourced from the Bitnami mongodb subchart Secret
  # (<release>-mongodb, key mongodb-root-password) and read via secretKeyRef on each
  # workload; it is NOT ranged in here. It is only written for an EXTERNAL MongoDB
  # (mongodb.external=true) without mongodb.auth.existingSecret. The RabbitMQ password
  # stays here as the single source: the broker is pointed at this Secret via
  # rabbitmq.authentication.existingSecret. See docs/helm-chart-standard.md.
  {{- include "reporter.mongoExternalSecretData" . | nindent 2 }}
  {{- /* MULTI_TENANT_SERVICE_API_KEY / MULTI_TENANT_REDIS_PASSWORD are emitted by the
     lerian-common.multiTenant.secret helper below (gated on MULTI_TENANT_ENABLED, with the
     required-key validation), so exclude them from the generic passthrough to avoid a
     duplicate key. MONGO_PASSWORD stays single-sourced via secretKeyRef as before. */ -}}
  {{- $skip := list "MONGO_PASSWORD" "MULTI_TENANT_SERVICE_API_KEY" "MULTI_TENANT_REDIS_PASSWORD" -}}
  {{- range $key, $value := .Values.secrets }}
  {{- if not (has $key $skip) }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
  # Multi-Tenant Secrets (emitted only when MULTI_TENANT_ENABLED=true and not using an
  # external Secret; MULTI_TENANT_SERVICE_API_KEY required, MULTI_TENANT_REDIS_PASSWORD optional)
  {{- $mtCm := merge (deepCopy (.Values.manager.configmap | default dict)) (.Values.common.configmap | default dict) -}}
  {{- with (include "lerian-common.multiTenant.secret" (dict
        "context" . "secrets" .Values.secrets
        "secretName" (include "plugin-manager.fullname" .)
        "valuesPrefix" "secrets." "mode" "data"
        "enabled" (eq (include "reporter.mtEnabled" (dict "context" . "cm" $mtCm)) "true")
        "useExistingSecret" .Values.manager.useExistingSecret)) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
