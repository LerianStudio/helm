## Reference: https://github.com/amannn/action-semantic-pull-request
name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  main:
    permissions:
      pull-requests: read
      statuses: write
    name: Validate PR title
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # pull_request_target runs on every pull request, forks included, so this job
      # holds nothing beyond the GITHUB_TOKEN scoped above. The Lerian App bypasses
      # the main ruleset; handing its token to a third-party action here would turn a
      # compromise of that action into a direct push to main. Pinned by SHA for the
      # same reason: a moved tag cannot swap the code that runs.
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        if: github.actor != 'lerian-studio-midaz-push-bot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            midaz
            plugin-access-manager
            plugin-crm
            reporter
            plugin-fees
            plugin-br-pix-jd
            br-jd-courier
            plugin-br-pix-indirect-btg
            plugin-br-pix-lerian
            plugin-br-sisbajud
            plugin-br-ted-lerian
            plugin-br-bank-transfer
            lerian-notification
            plugin-br-bank-transfer-jd
            templates
            dependencies
            otel-collector
            alloy-lerian
            plugins
            pipe
            doc
            product-console
            fetcher
            lender
            tracer
            br-sta
            br-ccs
            br-slc
            br-sisbajud
            agent
            streaming-hub
            new
            charts
            common
          requireScope: true