{{- if and .Values.migrations.enabled (not .Values.matcher.useExistingSecret) (include "matcher.licenseKeyFromValues" .) }}
# PreSync Secret with only LICENSE_KEY: the app Secret does not exist yet on a first install.
# A separate name, so an operator Secret is never shadowed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matcher.fullname" . }}-license-hook
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "matcher-migrations.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  LICENSE_KEY: {{ include "matcher.licenseKeyFromValues" . | quote }}
{{- end }}
