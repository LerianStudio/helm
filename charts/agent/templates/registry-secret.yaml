{{- $registry := .Values.agent.chartRegistry | default dict }}
{{- if and $registry.existingSecret (or $registry.host $registry.username $registry.password) }}
{{- fail "set agent.chartRegistry.existingSecret, or agent.chartRegistry.host/username/password, never both. An existingSecret is a kubernetes.io/dockerconfigjson Secret and already names the registries it speaks for, so a host beside it would be a value nothing reads." }}
{{- end }}
{{- if and (or $registry.username $registry.password) (not (and $registry.username $registry.password)) }}
{{- fail "agent.chartRegistry.username and agent.chartRegistry.password go together: with only one of them the agent refuses to start, because a credential missing half of itself produces an Authorization header the registry answers with the same flat 'unauthorized' it answers an anonymous request with." }}
{{- end }}
{{- if and $registry.host (not $registry.username) (not $registry.existingSecret) }}
{{- fail "agent.chartRegistry.host on its own configures nothing: with no username/password and no existingSecret there is no credential to key to it, so the chart renders an agent that mounts nothing and pulls every chart anonymously - which against a private registry is a bare 'unauthorized' from the one registry the operator is certain they configured. Set agent.chartRegistry.username and password, or agent.chartRegistry.existingSecret." }}
{{- end }}
{{- if and $registry.username (not $registry.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lerian-agent.chartRegistrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lerian-agent.labels" . | nindent 4 }}
# The standard pull-secret shape - what `kubectl create secret docker-registry`
# writes and what External Secrets Operator syncs - rather than a shape of this
# chart's own. It is the type the client already has a process for, and it is
# the type agent.chartRegistry.existingSecret must be, so the two paths hand the
# agent the same file and there is only one thing to document.
type: kubernetes.io/dockerconfigjson
stringData:
  # The credential the agent presents when pulling a chart from the host below,
  # and from no other registry. It buys read access to charts; it grants nothing
  # inside this cluster.
  #
  # All three fields, exactly as `kubectl create secret docker-registry` writes
  # them: the explicit pair AND the base64 "user:token". Dropping "auth" would
  # make this Secret a shape of this chart's own, and the point of the standard
  # shape is that the client's existing process produces it.
  #
  # The two cannot disagree here - one template writes both from one pair - and
  # the agent gives "auth" precedence when they do, which is what the kubelet
  # does with the very same Secret. See registry.credentialOf.
  {{- $host := include "lerian-agent.chartRegistryHost" . }}
  {{- $auth := printf "%s:%s" $registry.username $registry.password | b64enc }}
  .dockerconfigjson: {{ dict "auths" (dict $host (dict "username" $registry.username "password" $registry.password "auth" $auth)) | toJson | quote }}
{{- end }}
