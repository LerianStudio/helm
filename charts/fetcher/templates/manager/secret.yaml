apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fetcher-helm.fullname" . }}-manager
  labels:
    {{- include "fetcher-helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
type: Opaque
data:
  LICENSE_KEY: {{ .Values.manager.secrets.LICENSE_KEY | default "" | b64enc | quote }}
  # Extra Secret Vars
  {{- if .Values.manager.extraSecretVars }}
  {{- toYaml .Values.manager.extraSecretVars | nindent 2 }}
  {{- end }}
