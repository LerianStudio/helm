# =============================================================================
# cockpit — the br-sfn operations SPA (nginx-unprivileged serving the Vite
# bundle). VITE_* URLs are BAKED at image build time; the published baseline
# image carries honest-degrade defaults, so environments that need real URLs
# build/pin an environment-specific image. No configmap/secrets by default.
# =============================================================================
cockpit:
  enabled: false
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: ghcr.io/lerianstudio/br-sfn-cockpit
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  deploymentUpdate:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  service:
    type: ClusterIP
    # Matches nginx-unprivileged EXPOSE 8080.
    port: 8080
  configmap: {}
  secrets: {}
  useExistingSecret: false
  existingSecretName: ""
  extraEnvVars: []
  # nginx-unprivileged needs a writable /tmp (pid file + proxy/cache dirs)
  # under readOnlyRootFilesystem.
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  # The SPA has no /health endpoints; nginx serves / for both probes.
  livenessProbe:
    path: /
  readinessProbe:
    path: /
  # nginx-unprivileged runs as uid 101.
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  nodeSelector: {}
  affinity: {}
  tolerations: []
