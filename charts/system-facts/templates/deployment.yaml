{{- if (index .Values "system-facts").enabled }}
{{- $h := include "system-facts.api.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "system-facts.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "system-facts.labels" (dict "context" . "component" (index .Values "system-facts").name "name" (index .Values "system-facts").name) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ (index .Values "system-facts").revisionHistoryLimit | default 10 }}
  strategy:
    {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "system-facts.selectorLabels" (dict "context" . "name" (index .Values "system-facts").name) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not (index .Values "system-facts").useExistingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with (index .Values "system-facts").podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "system-facts.podLabels" (dict "context" . "component" (index .Values "system-facts").name "name" (index .Values "system-facts").name) | nindent 8 }}
    spec:
      {{- with (index .Values "system-facts").imagePullSecrets }}
      {{- include "lerian-common.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "system-facts.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
      {{- include "lerian-common.rolesAnywhere.podSecurityContext" (dict "aws" .Values.aws "podSecurityContext" (index .Values "system-facts").podSecurityContext) | nindent 6 }}
      containers:
        - name: {{ include "system-facts.fullname" . }}
          securityContext:
            {{- toYaml (index .Values "system-facts").securityContext | nindent 12 }}
          image: "{{ (index .Values "system-facts").image.repository }}:{{ (index .Values "system-facts").image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ (index .Values "system-facts").image.pullPolicy }}
          {{- $otelEnabled := eq (dig "otel" "enabled" false (index .Values "system-facts") | toString) "true" }}
          {{- $rolesAnywhereEnabled := and .Values.aws .Values.aws.rolesAnywhere .Values.aws.rolesAnywhere.enabled }}
          {{- /*
          Bundled-infra passwords come from the subchart's own Secret, never from
          this chart's. Emitted as `env` (not `envFrom`) on purpose: `env` wins
          for the same variable name, so the subchart's value takes precedence
          over anything the app Secret might still carry.
          */}}
          {{- $pg := .Values.postgresql | default dict }}
          {{- $pgAuth := $pg.auth | default dict }}
          {{- $pgInternal := and (ne (toString $pg.enabled) "false") (not $pg.external) }}
          {{- $vk := .Values.valkey | default dict }}
          {{- $vkAuth := $vk.auth | default dict }}
          {{- $vkInternal := and (ne (toString $vk.enabled) "false") (not $vk.external) $vkAuth.enabled }}
          {{- $licenseSecret := include "system-facts.licenseFileSecret" (index .Values "system-facts") }}
          envFrom:
          - secretRef:
              name: {{ if (index .Values "system-facts").useExistingSecret }}{{ (index .Values "system-facts").existingSecretName }}{{ else }}{{ include "system-facts.fullname" . }}{{ end }}
          - configMapRef:
              name: {{ include "system-facts.fullname" . }}
          env:
          {{- toYaml $h.env | nindent 10 }}
          {{- if $licenseSecret }}
          {{- include "system-facts.licenseFileEnv" . | nindent 10 }}
          {{- end }}
          {{- if $pgInternal }}
          {{- include "system-facts.infraSecretRef" (dict "context" . "subchart" "postgresql" "key" "password" "envName" "POSTGRES_PASSWORD") | nindent 10 }}
          {{- end }}
          {{- if $vkInternal }}
          {{- include "system-facts.infraSecretRef" (dict "context" . "subchart" "valkey" "key" "valkey-password" "envName" "REDIS_PASSWORD") | nindent 10 }}
          {{- end }}
          {{- if $otelEnabled }}
          {{- include "lerian-common.otel.podEnv" (dict "port" 4317 "scheme" "http://") | nindent 10 }}
          {{- end }}
          {{- if $rolesAnywhereEnabled }}
          {{- include "lerian-common.rolesAnywhere.imdsEnv" (dict "aws" .Values.aws) | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ (index .Values "system-facts").service.port }}
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          startupProbe:
            {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $h.readinessProbe | nindent 12 }}
          {{- if $licenseSecret }}
          {{- include "system-facts.licenseFileVolumeMount" . | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml (index .Values "system-facts").resources | nindent 12 }}
        {{- if $rolesAnywhereEnabled }}
        {{- include "lerian-common.rolesAnywhere.sidecar" (dict "aws" .Values.aws) | nindent 8 }}
        {{- end }}
      {{- if $rolesAnywhereEnabled }}
      {{- include "lerian-common.rolesAnywhere.volume" (dict "aws" .Values.aws "iamTlsDefault" "system-facts-iam-tls") | nindent 6 }}
      {{- else if $licenseSecret }}
      volumes:
      {{- end }}
      {{- if $licenseSecret }}
      {{- include "system-facts.licenseFileVolume" $licenseSecret | nindent 8 }}
      {{- end }}
      {{- if or (index .Values "system-facts").nodeSelector (index .Values "system-facts").affinity (index .Values "system-facts").tolerations }}
      {{- include "lerian-common.scheduling" (index .Values "system-facts") | nindent 6 }}
      {{- end }}
{{- end }}
