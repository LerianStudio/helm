# Default values
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # -- Env-wide SHARED datastore mask (set once per environment; a native
  # fees.configmap.<KEY> overrides it). Consumed by lerian-common.datastore.value.
  # Fields: mongo.{host,port,user,params}.
  # Example: datastores: { mongo: { host: "my-docdb.example.com", user: "plugin-fees" } }
  datastores: {}
  # -- Env-wide environment name. Consumed by lerian-common.globalValue (block
  # "env"). Fields: name. (configmap.ENV_NAME overrides.)
  # Example: env: { name: "production" }
  env: {}
  # -- Env-wide multi-tenancy gate. Consumed by lerian-common.globalValue
  # (block "multiTenant"). Fields: enabled. (configmap.MULTI_TENANT_ENABLED
  # overrides.)
  # Example: multiTenant: { enabled: true }
  multiTenant: {}
  # -- Env-wide telemetry gate. Consumed by lerian-common.globalValue (block
  # "observability"). Fields: enabled, otlpEndpoint, deploymentEnvironment.
  # (configmap.ENABLE_TELEMETRY/OTEL_EXPORTER_OTLP_ENDPOINT/
  # OTEL_RESOURCE_DEPLOYMENT_ENVIRONMENT override.)
  # Example: observability: { enabled: true, otlpEndpoint: "otel-collector:4317" }
  observability: {}
  # -- Env-wide auth (plugin-access-manager). Consumed by lerian-common.globalValue
  # (block "auth"). Fields: enabled, host. (configmap.PLUGIN_AUTH_* overrides.)
  # Example: auth: { host: "http://plugin-access-manager-auth:4000" }
  auth: {}
  # -- Env-wide streaming (lib-streaming v3 / RedPanda) gate. `enabled` is
  # consumed by lerian-common.globalValue (block "streaming"), same pattern as
  # multiTenant/observability above (configmap.STREAMING_ENABLED overrides).
  # The remaining fields (brokers, tlsEnabled, saslMechanism, saslUsername,
  # saslAllowPlaintext, compression, requiredAcks, batchLingerMs) are consumed
  # by lerian-common.streaming.env directly, once enabled=true AND brokers is
  # set. STREAMING_SASL_PASSWORD/STREAMING_TLS_CA_CERT are secrets, set via
  # fees.secrets, never here.
  # Example: streaming: { enabled: true, brokers: "redpanda:9092" }
  streaming: {}
  # -- Managed-cloud topology preset: aws | gcp | azure. Leave "" for the
  # bundled in-cluster infra (plaintext).
  # Example: cloud: "aws"
  cloud: ""
  # -- Bootstrap job for external MongoDB: creates users and grants privileges
  externalMongoDefinitions:
    # -- Enable or disable the MongoDB bootstrap job
    enabled: false
    # -- Connect mongosh with --tls --tlsAllowInvalidCertificates
    # --tlsAllowInvalidHostnames (needed for managed MongoDB like AWS
    # DocumentDB, which requires TLS on every connection). Ignored when
    # caCert.secretName is set — a real CA bundle takes precedence over the
    # insecure bypass flags.
    tls: false
    # -- Optional real CA bundle for TLS verification, mounted into the
    # bootstrap Job and passed as mongosh --tlsCAFile instead of the
    # insecure bypass flags.
    caCert:
      # -- Name of an existing Secret containing the CA bundle
      secretName: ""
      # -- Key within that Secret holding the PEM-encoded CA bundle
      secretKey: "ca.crt"
    # -- MongoDB connection settings
    connection:
      # -- MongoDB host
      host: "plugin-fees-mongodb"
      # -- MongoDB port
      port: "27017"
    # -- Admin credentials for MongoDB (rootUser from bitnami subchart)
    mongoAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_ROOT_USER and MONGO_ROOT_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "plugin-fees"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for plugin-fees user created by the job
    pluginFeesCredentials:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_APP_USER and MONGO_APP_PASSWORD keys
        name: ""
      # -- App username (ignored if useExistingSecret.name is set)
      username: "plugin-fees"
      # -- Password for plugin-fees user (ignored if useExistingSecret.name is set)
      password: ""
      # -- List of roles to grant to the user. Each item is a {role, db} pair.
      roles:
        - role: "readWrite"
          db: "plugin-fees-db"
fees:
  # -- Readiness probe configuration. All fields override chart defaults.
  readinessProbe: {}
  # -- Liveness probe configuration. All fields override chart defaults.
  livenessProbe: {}
  replicaCount: 1
  name: "plugin-fees"
  description: "Plugin Fees for Midaz"
  # -- Number of old ReplicaSets to retain for deployment rollback
  revisionHistoryLimit: 10
  image:
    # -- Repository for the container image
    repository: ghcr.io/lerianstudio/plugin-fees
    # -- Image pull policy
    pullPolicy: Always
    # -- Image tag used for deployment
    tag: "3.4.0"
  # -- Secrets for pulling images from a private registry
  imagePullSecrets:
    - name: regcred
  # -- Overrides the default generated name by Helm
  nameOverride: ""
  # -- Overrides the full name generated by Helm
  fullnameOverride: ""
  ingress:
    # -- Enable or disable ingress
    enabled: false
    # -- Ingress class name
    className: ""
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls: []
    #  - secretName: chart-example-tls
    #  hosts:
    #      - chart-example.local
  service:
    # -- Kubernetes service type
    type: ClusterIP
    # -- Service port
    port: 4002
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  podSecurityContext: {}
  # fsGroup: 2000

  securityContext:
    # -- Defines the group ID for the user running the process inside the container
    runAsGroup: 1000
    # -- Defines the user ID for the process running inside the container
    runAsUser: 1000
    # -- Ensures the process does not run as root
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    # -- Defines the root filesystem as read-only
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  pdb:
    # -- Enable or disable PodDisruptionBudget
    enabled: true
    # -- Maximum number of unavailable pods
    maxUnavailable: 1
    # -- Minimum number of available pods
    minAvailable: 0
    # -- Annotations for PodDisruptionBudget
    annotations: {}
  resources:
    # -- CPU and memory limits for pods
    limits:
      cpu: 200m
      memory: 256Mi
    # -- Minimum CPU and memory requests
    requests:
      cpu: 100m
      memory: 128Mi
  autoscaling:
    # -- Enable or disable horizontal pod autoscaling
    enabled: true
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 3
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  # -- Node selector for scheduling pods on specific nodes
  nodeSelector: {}
  # -- Tolerations for scheduling on tainted nodes
  tolerations: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: midaz.io/owner
  #         operator: In
  #         values:
  #         - midaz
  # podAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #   - labelSelector:
  #       matchExpressions: []
  #     topologyKey: kubernetes.io/hostname

  # -- ConfigMap for environment variables and configurations
  # -- All environment variables are declared in the templates/configmap.yaml
  # @default -- templates/configmap.yaml
  configmap:
    ALLOW_INSECURE_TLS: "true"
    # -- ENV_NAME is NOT pinned — consumed by lerian-common.globalValue (block
    # "env"); the chart already defaults it ("development") and picks up
    # global.env.name when set. Pinning it here would make global.env.name
    # unable to ever take effect (native key always wins over the mask).
    # ENV_NAME: ""
    # -- Application name used for service identification in logs/tracing
    APPLICATION_NAME: "plugin-fees"
    # -- PLUGIN_AUTH_ENABLED/PLUGIN_AUTH_ADDRESS are NOT pinned — consumed by
    # lerian-common.globalValue (block "auth"); same reasoning as ENV_NAME
    # above. The chart already defaults them ("false" /
    # "http://plugin-access-manager-auth:4000").
    # PLUGIN_AUTH_ENABLED: ""
    # PLUGIN_AUTH_ADDRESS: ""
    # -- MongoDB host/port/user/params are NOT pinned — consumed by
    # lerian-common.datastore.value (type "mongo"); pinning them here would
    # make global.datastores.mongo.* unable to ever take effect. The chart
    # already defaults them to the bundled subchart Service name/27017/
    # "plugin-fees"/"" respectively. Set only for a non-standard override.
    # MONGO_HOST: ""
    MONGO_NAME: "plugin-fees-db"
    # MONGO_PORT: ""
    # MONGO_USER: ""
    # MONGO_PARAMETERS: ""
    MONGO_TLS_CA_CERT: ""
    MONGO_MIN_POOL_SIZE: "10"
    MONGO_MAX_CONN_IDLE_TIME_SECONDS: "300"
    # CLIENT_ID moved to fees.secrets (paired with CLIENT_SECRET) — see below.
    # MIDAZ_ONBOARDING_URL/MIDAZ_TRANSACTION_URL are NOT pinned — the chart
    # already defaults them to the standard in-cluster midaz-ledger service.
    CORS_ALLOW_ORIGINS: "http://localhost:3000"
    RATE_LIMIT_MAX: "100"
    RATE_LIMIT_WINDOW_SECONDS: "60"
    DEFAULT_CURRENCY: "BRL"
    PACKAGE_CACHE_ENABLED: "true"
    PACKAGE_CACHE_TTL_SECONDS: "180"
    BILLING_PACKAGE_CACHE_ENABLED: "true"
    BILLING_PACKAGE_CACHE_TTL_SECONDS: "180"
    ACCOUNT_CACHE_ENABLED: "true"
    ACCOUNT_CACHE_TTL_SECONDS: "300"
    TRUSTED_PROXIES: ""
    # -- Target service name for M2M (machine-to-machine) authentication
    M2M_TARGET_SERVICE: ""
    # -- TTL in seconds for cached M2M credentials
    M2M_CREDENTIAL_CACHE_TTL_SEC: "30"
    # -- AWS region for IAM Roles Anywhere and other AWS integrations
    AWS_REGION: ""
    # -- MULTI_TENANT_ENABLED is NOT pinned — consumed by lerian-common.globalValue
    # (block "multiTenant"), same reasoning as ENV_NAME above. The chart
    # already defaults it to "false" and picks up global.multiTenant.enabled.
    # MULTI_TENANT_ENABLED: ""
    # -- URL of the tenant-manager service (required when MULTI_TENANT_ENABLED=true)
    MULTI_TENANT_URL: ""
    # -- Environment label sent to tenant-manager for tenant scoping
    MULTI_TENANT_ENVIRONMENT: ""
    # -- Maximum number of per-tenant MongoDB connection pools
    MULTI_TENANT_MAX_TENANT_POOLS: "100"
    # -- Seconds before an idle tenant connection pool is released
    MULTI_TENANT_IDLE_TIMEOUT_SEC: "300"
    # -- Number of failures before the circuit breaker opens
    MULTI_TENANT_CIRCUIT_BREAKER_THRESHOLD: "5"
    # -- Seconds the circuit breaker stays open before retrying
    MULTI_TENANT_CIRCUIT_BREAKER_TIMEOUT_SEC: "30"
    # -- Interval in seconds to re-check tenant-manager settings
    # -- Hostname of the Redis/Valkey instance used for tenant cache
    MULTI_TENANT_REDIS_HOST: ""
    # -- Port of the Redis/Valkey instance
    MULTI_TENANT_REDIS_PORT: "6379"
    # -- Enable TLS for the Redis/Valkey connection
    MULTI_TENANT_REDIS_TLS: "false"
    # -- HTTP client timeout in seconds for tenant-manager requests
    MULTI_TENANT_TIMEOUT: "30"
    # -- TTL in seconds for local tenant config cache (0 = disabled)
    MULTI_TENANT_CACHE_TTL_SEC: "120"
  extraEnvVars: {}
  # -- Secrets for storing sensitive data
  # -- All secrets are declared in the templates/secrets.yaml
  # @default -- templates/secrets.yaml
  useExistingSecret: false
  existingSecretName: ""
  serviceAccount:
    # -- Specifies whether a ServiceAccount should be created
    create: false
    # -- Annotations for the ServiceAccount
    annotations: {}
    # -- Name of the service account
    # @default -- `plugin-fees-frontend.fullname`
    name: ""
  # -- Default sensitive variables for the plugin-fees
  # MONGO_PASSWORD is not listed here: with the bundled Bitnami mongodb subchart it is
  # auto-generated into the plugin-fees-mongodb Secret and read via secretKeyRef. For an
  # external MongoDB, set mongodb.external=true and either mongodb.auth.existingSecret or
  # provide MONGO_PASSWORD here. See docs/helm-chart-standard.md "Single-Source Infra Secrets".
  secrets:
    # -- CLIENT_ID paired with CLIENT_SECRET below (not the ConfigMap) — same
    # split as MIDAZ_CLIENT_ID/SECRET in other charts. Defaults to
    # app-lerian's known client when unset.
    # CLIENT_ID: ""
    CLIENT_SECRET: ""
    LICENSE_KEY: ""
    ORGANIZATION_IDS: ""
    # -- API key used to authenticate with the tenant-manager service (required when MULTI_TENANT_ENABLED=true)
    MULTI_TENANT_SERVICE_API_KEY: ""
    # -- Password for the Redis/Valkey instance used by the multi-tenant cache (required when MULTI_TENANT_ENABLED=true)
    MULTI_TENANT_REDIS_PASSWORD: ""
    # -- Service discovery (lib-service-discovery) Consul ACL token. Operator-provided;
    # only set when the Consul server enforces ACLs. Rendered into the plugin-fees Secret.
    SD_TOKEN: ""
    # -- Streaming (lib-streaming) SASL/TLS material. Operator-provided; only set
    # when the streaming backend uses SASL auth and/or a private TLS CA. When set,
    # they are rendered into the plugin-fees Secret (never the ConfigMap).
    STREAMING_SASL_PASSWORD: ""
    STREAMING_TLS_CA_CERT: ""
mongodb:
  # MongoDB’s flexibility and scalability make it the perfect choice for managing evolving and less structured data.
  enabled: true
  external: false
  auth:
    enabled: true
    rootUser: "plugin-fees"
    rootPassword: ""
  persistence:
    size: 8Gi
  resourcesPreset: "medium"
otel-collector-lerian:
  enabled: true
# AWS Authentication - IAM Roles Anywhere for non-AWS clusters (e.g. Proxmox)
aws:
  rolesAnywhere:
    enabled: false
    trustAnchorArn: ""
    profileArn: ""
    roleArn: ""
    region: "us-east-2"
    sessionDuration: 3600
    certificateSecretName: "plugin-fees-iam-tls"
    sidecar:
      image:
        repository: public.ecr.aws/rolesanywhere/credential-helper
        tag: "latest-amd64"
        pullPolicy: IfNotPresent
      port: 9911
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
