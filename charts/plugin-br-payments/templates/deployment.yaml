{{- include "plugin-br-payments.validateRequired" . }}
{{- $h := include "plugin-br-payments.health" . | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-br-payments.fullname" . }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 4 }}
  {{- with .Values.app.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  revisionHistoryLimit: {{ .Values.app.revisionHistoryLimit | default 10 }}
  strategy: {{- toYaml $h.strategy | nindent 4 }}
  {{- if hasKey $h "replicas" }}
  replicas: {{ $h.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plugin-br-payments.selectorLabels" (dict "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugin-br-payments.labels" (dict "context" .) | nindent 8 }}
      annotations:
        {{- /* Roll the pods when their configuration changes (the ConfigMap and
               Secret are read through envFrom, which Kubernetes does not re-read). */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.app.useExistingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- range $key, $value := (.Values.app.podAnnotations | default dict) }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "plugin-br-payments.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ $h.terminationGracePeriodSeconds }}
      {{- if and .Values.aws .Values.aws.rolesAnywhere .Values.aws.rolesAnywhere.enabled }}
      securityContext:
        {{/* fsGroup: 65532 wins over any operator-configured fsGroup — the
             iam-certs volume mount needs the credential-helper's UID/GID —
             but every OTHER field of app.podSecurityContext still applies. */}}
        {{- toYaml (merge (dict "fsGroup" 65532) .Values.app.podSecurityContext) | nindent 8 }}
      {{- else }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- with .Values.app.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
      Render whenever a real Postgres host is actually going to be reachable:
      the bundled subchart (postgresql.enabled helper resolves "true", host
      derived dynamically in templates/configmap.yaml and always non-empty),
      OR an external host explicitly configured via
      app.configmap.POSTGRES_HOST — the exact same value
      templates/configmap.yaml resolves POSTGRES_HOST to for this container's
      own envFrom in that mode (see templates/controlplane-migrations.yaml's
      header comment for the same resolution). Gating on the
      "postgresql.enabled" helper alone silently dropped this init container
      for every external-Postgres production install (this chart's own
      documented README "Production layout": postgresql.enabled=false,
      app.configmap.POSTGRES_HOST=<external host>) once that helper's
      pre-existing Sprig `default` bug was fixed — pods then started racing a
      Postgres that might not be reachable yet instead of waiting for it.
      */}}
      {{- if include "plugin-br-payments.pgHost" . }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          envFrom:
            - configMapRef:
                name: {{ include "plugin-br-payments.fullname" . }}
          command:
            - /bin/sh
            - -c
            - >
              echo "Waiting for $POSTGRES_HOST:$POSTGRES_PORT...";
              until nc -z "$POSTGRES_HOST" "$POSTGRES_PORT"; do
                echo "$POSTGRES_HOST:$POSTGRES_PORT not ready, sleeping 5s";
                sleep 5;
              done;
              echo "$POSTGRES_HOST:$POSTGRES_PORT is ready";
      {{- end }}
      containers:
        - name: {{ include "plugin-br-payments.fullname" . }}
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default (include "plugin-br-payments.defaultTag" .) }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
              protocol: TCP
            {{- toYaml $h.ports | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "plugin-br-payments.fullname" . }}
            - secretRef:
                name: {{ if .Values.app.useExistingSecret }}{{ .Values.app.existingSecretName }}{{ else }}{{ include "plugin-br-payments.fullname" . }}{{ end }}
          env:
            {{- toYaml $h.env | nindent 12 }}
            {{- $pg := .Values.postgresql | default dict }}
            {{- $pgAuth := $pg.auth | default dict }}
            {{- if or (and (ne (toString $pg.enabled) "false") (not $pg.external)) $pgAuth.existingSecret }}
            {{- include "plugin-br-payments.infraSecretRef" (dict "context" $ "subchart" "postgresql" "key" "password" "envName" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- else if .Values.app.secrets.POSTGRES_PASSWORD }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.useExistingSecret }}{{ .Values.app.existingSecretName }}{{ else }}{{ include "plugin-br-payments.fullname" . }}{{ end }}
                  key: POSTGRES_PASSWORD
            {{- end }}
          {{- if (index .Values "otel-collector-lerian").enabled }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "$(HOST_IP):4317"
            # The node-local collector is plaintext; lib-observability refuses that in production without a reason.
            - name: ALLOW_INSECURE_OTEL
              value: "true"
          {{- end }}
          {{- if and .Values.aws .Values.aws.rolesAnywhere .Values.aws.rolesAnywhere.enabled }}
            - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
              value: "http://127.0.0.1:{{ .Values.aws.rolesAnywhere.sidecar.port | default 9911 }}"
            - name: AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE
              value: "IPv4"
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          startupProbe: {{- toYaml $h.startupProbe | nindent 12 }}
          livenessProbe: {{- toYaml $h.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml $h.readinessProbe | nindent 12 }}
        {{- if and .Values.aws .Values.aws.rolesAnywhere .Values.aws.rolesAnywhere.enabled }}
        - name: aws-signing-helper
          image: "{{ .Values.aws.rolesAnywhere.sidecar.image.repository }}:{{ .Values.aws.rolesAnywhere.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.aws.rolesAnywhere.sidecar.image.pullPolicy | default "IfNotPresent" }}
          args:
            - serve
            - --certificate
            - /certs/tls.crt
            - --private-key
            - /certs/tls.key
            {{/* trim BEFORE required: `required` only rejects nil/empty-string,
                 so a whitespace-only value like " " would otherwise pass here
                 and reach aws-signing-helper as a malformed ARN argument. */}}
            - --trust-anchor-arn
            - "{{ required "aws.rolesAnywhere.trustAnchorArn is required when rolesAnywhere is enabled" (trim (.Values.aws.rolesAnywhere.trustAnchorArn | toString)) }}"
            - --profile-arn
            - "{{ required "aws.rolesAnywhere.profileArn is required when rolesAnywhere is enabled" (trim (.Values.aws.rolesAnywhere.profileArn | toString)) }}"
            - --role-arn
            - "{{ required "aws.rolesAnywhere.roleArn is required when rolesAnywhere is enabled" (trim (.Values.aws.rolesAnywhere.roleArn | toString)) }}"
            - --region
            - "{{ .Values.aws.rolesAnywhere.region | default "us-east-2" }}"
            - --session-duration
            - "{{ .Values.aws.rolesAnywhere.sessionDuration | default 3600 }}"
            - --port
            - "{{ .Values.aws.rolesAnywhere.sidecar.port | default 9911 }}"
          ports:
            - name: imds
              containerPort: {{ .Values.aws.rolesAnywhere.sidecar.port | default 9911 }}
              protocol: TCP
          volumeMounts:
            - name: iam-certs
              mountPath: /certs
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.aws.rolesAnywhere.sidecar.resources | nindent 12 }}
        {{- end }}
      {{- if and .Values.aws .Values.aws.rolesAnywhere .Values.aws.rolesAnywhere.enabled }}
      volumes:
        - name: iam-certs
          secret:
            secretName: {{ .Values.aws.rolesAnywhere.certificateSecretName | default "plugin-br-payments-iam-tls" }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
