# CI-only render fixture for br-slc. Dummy values, NOT a production example and
# NOT real credentials. Exercises the external-infra path (Postgres/Redis are
# external in BYOC) with the app + signer Secrets and the migration Job all
# rendered in-release, so the render gate's dangling-secret-ref assertion has
# every referenced Secret present.
secrets:
  create: true
  data:
    POSTGRES_PASSWORD: "dummy-ci-password"
    REDIS_PASSWORD: "dummy-ci-redis"
    # Exercise the productized fail-fasts (lerian-common): MT API key + rmq pass.
    MULTI_TENANT_SERVICE_API_KEY: "dummy-ci-mt-api-key"
    RABBITMQ_DEFAULT_PASS: "dummy-ci-rmq-pass"

configmap:
  data:
    POSTGRES_HOST: "pg.example.svc"
    REDIS_HOST: "redis.example.svc:6379"
    PLUGIN_AUTH_HOST: "http://access-manager.example.svc:4000"
    CORS_ALLOWED_ORIGINS: "https://app.example.com"
    # Exercise the broker datastore mask + RABBITMQ_DEFAULT_PASS fail-fast.
    RABBITMQ_ENABLED: "true"

# Exercise the productized lerian-common paths in their ENABLED state:
# multiTenant.env (+ multiTenant.secret fail-fast) and otel.env via global.*.
multiTenant:
  enabled: true
global:
  observability:
    enabled: true
    otlpEndpoint: "otel-collector-lerian:4317"
    deploymentEnvironment: "staging"
  multiTenant:
    url: "http://tenant-manager.example.svc:8080"
    redisHost: "tenant-manager-redis.example.svc"

signer:
  secrets:
    create: true
    data:
      SIGNER_SOFTKEY_PFX_PASSPHRASE: "dummy-ci-passphrase"

migrations:
  enabled: true
  postgres:
    host: "pg.example.svc"
    password: "dummy-ci-password"
