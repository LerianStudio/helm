suite: fetcher refuses pdb and rollout overrides owned by the health preset
templates:
  - templates/manager/pdb.yaml
  - templates/worker/deployment.yaml
  # loaded so the deployments can include and hash them
  - templates/manager/configmap.yaml
  - templates/manager/secrets.yaml
  - templates/worker/configmap.yaml
  - templates/worker/secrets.yaml
  - templates/common/configmap.yaml
  - templates/common/secrets.yaml
release:
  name: fetcher
  namespace: fetcher
tests:
  - it: default render succeeds
    template: templates/manager/pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
  - it: refuses manager.pdb.minAvailable
    template: templates/manager/pdb.yaml
    set: {manager.pdb.minAvailable: 1}
    asserts:
      - failedTemplate: {errorPattern: "manager.pdb.minAvailable is owned by the health preset"}
  - it: refuses manager.pdb.maxUnavailable
    template: templates/manager/pdb.yaml
    set: {manager.pdb.maxUnavailable: 0}
    asserts:
      - failedTemplate: {errorPattern: "manager.pdb.maxUnavailable is owned by the health preset"}
  - it: refuses manager.deploymentStrategy
    template: templates/manager/pdb.yaml
    set: {manager.deploymentStrategy.type: Recreate}
    asserts:
      - failedTemplate: {errorPattern: "manager.deploymentStrategy is owned by the health preset"}
  - it: refuses worker.pdb.minAvailable
    template: templates/worker/deployment.yaml
    set: {worker.pdb.minAvailable: 1}
    asserts:
      - failedTemplate: {errorPattern: "worker.pdb.minAvailable is owned by the health preset"}
  - it: refuses worker.pdb.maxUnavailable
    template: templates/worker/deployment.yaml
    set: {worker.pdb.maxUnavailable: 0}
    asserts:
      - failedTemplate: {errorPattern: "worker.pdb.maxUnavailable is owned by the health preset"}
  - it: refuses worker.deploymentStrategy
    template: templates/worker/deployment.yaml
    set: {worker.deploymentStrategy.type: Recreate}
    asserts:
      - failedTemplate: {errorPattern: "worker.deploymentStrategy is owned by the health preset"}
  - it: refuses manager.pdb.enabled
    template: templates/manager/pdb.yaml
    set: {manager.pdb.enabled: false}
    asserts:
      - failedTemplate: {errorPattern: "manager.pdb.enabled is owned by the health preset"}
  - it: refuses worker.pdb.enabled
    template: templates/worker/deployment.yaml
    set: {worker.pdb.enabled: false}
    asserts:
      - failedTemplate: {errorPattern: "worker.pdb.enabled is owned by the health preset"}
  - it: refuses manager.terminationGracePeriodSeconds even when 0
    template: templates/manager/pdb.yaml
    set: {manager.terminationGracePeriodSeconds: 0}
    asserts:
      - failedTemplate: {errorPattern: "manager.terminationGracePeriodSeconds is owned by the health preset"}
  - it: refuses worker.terminationGracePeriodSeconds even when 0
    template: templates/worker/deployment.yaml
    set: {worker.terminationGracePeriodSeconds: 0}
    asserts:
      - failedTemplate: {errorPattern: "worker.terminationGracePeriodSeconds is owned by the health preset"}
  - it: common configmap emits REDIS_TLS from the redis datastore mask
    template: templates/common/configmap.yaml
    set: {global.datastores.redis.tls: "true"}
    asserts:
      - equal: {path: data.REDIS_TLS, value: "true"}
  - it: common configmap emits REDIS_TLS from the cloud preset
    template: templates/common/configmap.yaml
    set: {global.cloud: aws}
    asserts:
      - equal: {path: data.REDIS_TLS, value: "true"}
  - it: common configmap no longer renders the unread SeaweedFS keys
    template: templates/common/configmap.yaml
    asserts:
      - notExists: {path: data.SEAWEEDFS_HOST}
      - notExists: {path: data.SEAWEEDFS_FILER_PORT}
      - notExists: {path: data.SEAWEEDFS_TTL}
  - it: worker no longer renders unread storage keys
    template: templates/worker/configmap.yaml
    asserts:
      - notExists: {path: data.STORAGE_PROVIDER}
  - it: worker and common secrets no longer render unread keys
    template: templates/worker/secrets.yaml
    set: {secrets.ORGANIZATION_IDS: ""}
    asserts:
      - notExists: {path: data.CRYPTO_ENCRYPT_FILE_STORAGE}
      - notExists: {path: data.CRYPTO_HASH_SECRET_KEY_FILE_STORAGE}
