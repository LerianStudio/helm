suite: node-local OTEL hop in production (ALLOW_INSECURE_OTEL)
templates:
  - templates/manager/deployment.yaml
  - templates/worker/deployment.yaml
  - templates/worker/keda-scaled-job.yaml
  - templates/manager/configmap.yaml
  - templates/manager/secrets.yaml
  - templates/worker/configmap.yaml
  - templates/worker/secrets.yaml
release:
  name: reporter
  namespace: reporter
set:
  rabbitmq.enabled: false
  secrets.RABBITMQ_DEFAULT_PASS: x
  secrets.DATASOURCE_ONBOARDING_PASSWORD: x
  secrets.DATASOURCE_CRED_ENC_KEY: "46071cab3c0a47d43400741cb2a1aab25951f0d3509f373d150e96860ace057a"
  secrets.LICENSE_KEY: x
  otel-collector-lerian.enabled: true
tests:

  - it: "manager: the plaintext node-local endpoint carries the default reason"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
          count: 1

  - it: "manager: global.observability.allowInsecureOtel sets the value env-wide"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: "env-wide reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}

  - it: "manager: common.configmap wins over the global"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: "env-wide reason"
      common.configmap.ALLOW_INSECURE_OTEL: "common reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "common reason"}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}

  - it: "manager: the component configmap wins over the global"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: "env-wide reason"
      manager.configmap.ALLOW_INSECURE_OTEL: "component reason"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "component reason"}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}

  - it: "manager: a common.configmap refusal stands over the global"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: "env-wide reason"
      common.configmap.ALLOW_INSECURE_OTEL: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}

  - it: "manager: an explicit refusal stands as the one entry"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      manager.configmap.ALLOW_INSECURE_OTEL: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}

  - it: "manager: a false refusal in the global stands as the one entry"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "false"}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}

  - it: "manager: a null component value falls through to the global"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: "env-wide reason"
      manager.configmap.ALLOW_INSECURE_OTEL: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "env-wide reason"}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}

  - it: "manager: a null global leaves the node-local reason"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      global.observability.allowInsecureOtel: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: ""}

  - it: "manager: a key in extraEnvVars (legacy) stands, so the chart adds no entry"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      manager.extraEnvVars.ALLOW_INSECURE_OTEL: "operator reason"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true

  - it: "manager: telemetry off (collector disabled) emits nothing"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      otel-collector-lerian.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL}
          any: true

  - it: "manager: an explicit endpoint in the configmap is still overridden by the node-local hop, so the entry stays"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      common.configmap.OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel.example.com:4317"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "$(HOST_IP):4317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOW_INSECURE_OTEL, value: "node-local collector on the pod's own node"}
          count: 1

  - it: "manager: a non-empty secrets.ALLOW_INSECURE_OTEL in the chart Secret stands (no entry)"
    template: templates/manager/deployment.yaml
    set:
      keda.enabled: false
      secrets.ALLOW_INSECURE_OTEL: "secret reason"
    asserts:
      - notContains:
