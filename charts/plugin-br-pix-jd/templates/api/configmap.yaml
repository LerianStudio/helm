{{- if .Values.api.enabled }}
{{- include "plugin-br-pix-jd.consistencyGates" . }}
{{- /* BUILT AS A DICT, EMITTED ONCE.

   The first cut concatenated YAML text from several helpers plus a `range` over
   extraConfigmap, which had two defects a text pipeline cannot avoid: the escape
   hatch emitted a SECOND `POSTGRES_HOST:` line (last-wins in Kubernetes, rejected
   by a strict YAML loader, and the opposite of what values.yaml promised), and a
   right-trimmed comment above a literal line could swallow the newline that
   terminated the key above it — which once turned `data:` into a string.

   Merging into one dict and rendering it with a single toYaml removes both by
   construction: a key can only appear once, and precedence is explicit in the
   merge order rather than implicit in line order. */ -}}
{{- $platform := fromYaml (include "plugin-br-pix-jd.platformEnv" (dict "root" $ "configmap" .Values.api.configmap "serviceName" "plugin-br-pix-jd")) -}}
{{- /* Rate limiting is api-only: the three tiers guard HTTP routes and the worker
   has none. NOTE: this helper also emits ALLOW_RATELIMIT_DISABLED (removed from
   lib-commons in v5.8.0) and RATE_LIMIT_REDIS_TIMEOUT_MS. The first is genuinely
   dead; the second is LIVE — read by ratelimit.New in lib-commons — so do not
   describe it as inert. The helper is shared, so it is used as-is. */ -}}
{{- $rateLimit := fromYaml (include "lerian-common.rateLimit.env" (dict "configmap" .Values.api.configmap "params" .Values.api.rateLimit)) -}}
{{- $domain := fromYaml (include "plugin-br-pix-jd.domainEnv" (dict "root" $ "configmap" .Values.api.configmap)) -}}
{{- $qrcode := fromYaml (include "plugin-br-pix-jd.qrcodeEnv" (dict "root" $ "configmap" .Values.api.configmap)) -}}
{{- $mt := fromYaml (include "plugin-br-pix-jd.multiTenantEnv" (dict "root" $ "configmap" .Values.api.configmap)) -}}
{{- $streaming := fromYaml (include "plugin-br-pix-jd.streamingEnv" (dict "root" $ "configmap" .Values.api.configmap "graceSeconds" .Values.api.terminationGracePeriodSeconds)) -}}
{{- $cfg := .Values.api.configmap | default dict -}}
{{- $cors := .Values.api.cors | default dict -}}
{{- /* CORS — the live variable names are ACCESS_CONTROL_*, NOT CORS_*.
   The app parses CORS_ALLOWED_ORIGINS into ServerConfig and re-exports it to the
   SAME name, but the only CORS installer (commonhttp.AllowFullOptionsWithCORS)
   reads ACCESS_CONTROL_ALLOW_ORIGIN and siblings from lib-commons. With origins
   unset, lib-commons defaults to "*", refuses the wildcard unless
   ALLOW_CORS_WILDCARD is set (which this chart deliberately never sets), and
   applies a DENY-ALL fallback at LevelError. So emitting only CORS_* — as the
   chart's first cut did, faithfully mirroring the app's own .env.example — left
   every browser cross-origin call failing with no operator-reachable knob.
   Both families are emitted from one source of truth: ACCESS_CONTROL_* because it
   is what runs today, CORS_* so the chart keeps working if the app ever wires its
   own struct through. Fixing the app's false contract is tracked separately. */ -}}
{{- $origins := $cors.allowedOrigins | default (index $cfg "CORS_ALLOWED_ORIGINS" | default "") -}}
{{- $methods := $cors.allowedMethods | default (index $cfg "CORS_ALLOWED_METHODS" | default "GET,POST,PUT,PATCH,DELETE,OPTIONS") -}}
{{- $headers := $cors.allowedHeaders | default (index $cfg "CORS_ALLOWED_HEADERS" | default "Origin,Content-Type,Accept,Authorization,X-Request-ID") -}}
{{- $expose := $cors.exposeHeaders | default (index $cfg "CORS_EXPOSE_HEADERS" | default "") -}}
{{- $credentials := $cors.allowCredentials | default (index $cfg "CORS_ALLOW_CREDENTIALS" | default "false") | toString -}}
{{- $corsEnv := dict
      "ACCESS_CONTROL_ALLOW_ORIGIN" $origins
      "ACCESS_CONTROL_ALLOW_METHODS" $methods
      "ACCESS_CONTROL_ALLOW_HEADERS" $headers
      "ACCESS_CONTROL_EXPOSE_HEADERS" $expose
      "ACCESS_CONTROL_ALLOW_CREDENTIALS" $credentials
      "CORS_ALLOWED_ORIGINS" $origins
      "CORS_ALLOWED_METHODS" $methods
      "CORS_ALLOWED_HEADERS" $headers
      "CORS_EXPOSE_HEADERS" $expose
      "CORS_ALLOW_CREDENTIALS" $credentials -}}
{{- /* HTTP surface — api only; the worker has no listener. */ -}}
{{- $http := dict
      "SERVER_ADDRESS" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "SERVER_ADDRESS" "default" ":8080"))
      "HTTP_BODY_LIMIT_BYTES" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "HTTP_BODY_LIMIT_BYTES" "default" "104857600"))
      "TLS_TERMINATED_UPSTREAM" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "TLS_TERMINATED_UPSTREAM" "default" "true"))
      "MAX_PAGINATION_LIMIT" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "MAX_PAGINATION_LIMIT" "default" "100"))
      "MAX_PAGINATION_MONTH_DATE_RANGE" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "MAX_PAGINATION_MONTH_DATE_RANGE" "default" "3"))
      "SWAGGER_ENABLED" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "SWAGGER_ENABLED" "default" "false")) -}}
{{- if eq (index $http "SWAGGER_ENABLED" | toString) "true" -}}
{{- /* SWAGGER_HOST has no default: openapi.go short-circuits on an empty host and
   emits an empty `servers` list, so a Swagger UI that renders but cannot issue a
   request. Required once the route is wired. */ -}}
{{- $_ := set $http "SWAGGER_TITLE" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "SWAGGER_TITLE" "default" "plugin-br-pix-jd")) -}}
{{- $_ := set $http "SWAGGER_VERSION" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "SWAGGER_VERSION" "default" .Chart.AppVersion)) -}}
{{- $_ := set $http "SWAGGER_BASE_PATH" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "SWAGGER_BASE_PATH" "default" "/")) -}}
{{- $_ := set $http "SWAGGER_HOST" (required "\n\nERROR: api.configmap.SWAGGER_HOST is required when SWAGGER_ENABLED=true.\nThe app short-circuits on an empty host and emits an empty `servers` list, so the\ndocument renders but no request can be issued from it.\n" (index $cfg "SWAGGER_HOST" | default "")) -}}
{{- $_ := set $http "SWAGGER_SCHEMES" (include "plugin-br-pix-jd.cfg" (dict "configmap" $cfg "key" "SWAGGER_SCHEMES" "default" "https")) -}}
{{- end -}}
{{- /* Merge order IS the precedence contract: platform < rate-limit < CORS < http
   < extraConfigmap. The escape hatch merges last and therefore wins — stated
   plainly in values.yaml rather than claimed otherwise. */ -}}
{{- $data := mergeOverwrite $platform $domain $qrcode $mt $streaming $rateLimit $corsEnv $http (.Values.api.extraConfigmap | default dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plugin-br-pix-jd.componentFullname" (dict "root" $ "name" "api") }}
  namespace: {{ include "plugin-br-pix-jd.namespace" $ }}
  labels:
    {{- include "plugin-br-pix-jd.componentLabels" (dict "root" $ "name" "api") | nindent 4 }}
  {{- with (include "plugin-br-pix-jd.commonAnnotations" (dict "root" $)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
