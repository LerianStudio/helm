# Default values for fetcher
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""
namespaceOverride: "fetcher"
global:
  # -- Managed-cloud topology preset: aws | gcp | azure (unset = bundled
  # in-cluster infra, plaintext). Sets TOPOLOGY defaults (tls/scheme/ports/
  # object-storage path-style) for every lerian-common mask below — see
  # lerian-common.cloud.table. Only ENDPOINTS (host/port/user) stay
  # client-supplied via global.datastores/objectStorage; a cloud can't know
  # your DocumentDB/ElastiCache/AmazonMQ host. Precedence: native configmap
  # key > dedicated (datastores:/objectStorage: at chart root) > shared
  # (global.*) > this cloud preset > hardcoded default.
  # Example: cloud: "aws"
  cloud: ""
  # -- Env-wide SHARED datastore masks (set once per environment; a native
  # common.configmap.<KEY> always overrides). Sub-keys: mongo / redis / broker
  # (fetcher has no direct postgres datasource, unlike reporter).
  # Example:
  #   datastores:
  #     mongo: { host: "my-documentdb.example.com", port: "27017" }
  #     redis: { host: "my-elasticache.example.com", port: "6379", tls: "true" }
  #     broker: { host: "my-amazonmq.example.com", scheme: "amqps", amqpPort: "5671" }
  datastores: {}
  # -- Env-wide object storage (S3/SeaweedFS) mask, consumed by
  # lerian-common.objectStorage.value (name "fetcher") for the worker's
  # extraction output bucket. Non-secret fields only — access keys go in
  # secrets.OBJECT_STORAGE_ACCESS_KEY_ID/SECRET_KEY.
  # Example:
  #   objectStorage:
  #     fetcher: { endpoint: "https://s3.us-east-1.amazonaws.com", region: "us-east-1", bucket: "my-bucket" }
  objectStorage: {}
  # -- Env-wide observability. Consumed by lerian-common.globalValue (block "observability").
  # Fields: enabled, otlpEndpoint, deploymentEnvironment. (common.configmap.<KEY> overrides.)
  # Example: observability: { enabled: true, otlpEndpoint: "otel-collector:4317" }
  observability: {}
  # -- Env-wide auth (access-manager), used by the manager's PLUGIN_AUTH_* gate.
  # Consumed by lerian-common.globalValue (block "auth"). Fields: enabled, host.
  # (manager.configmap.PLUGIN_AUTH_* overrides.)
  # Example: auth: { enabled: true, host: "http://plugin-access-manager-auth:4000" }
  auth: {}
  # -- Env-wide streaming (lib-streaming). Consumed by lerian-common.streaming.env.
  # Fields: enabled, brokers, saslUsername, tlsEnabled, compression, requiredAcks, ...
  # (brokers gates emission). The fetcher worker HARD-REQUIRES streaming at startup
  # (mandatory job event notifications) — set at least `enabled: true` + `brokers`
  # here, or leave the per-component common.configmap.STREAMING_* passthrough.
  # Example: streaming: { enabled: true, brokers: "redpanda:9092" }
  streaming: {}
  # -- Env-wide multi-tenant infra (lib-commons/multitenancy). Consumed by
  # lerian-common.multiTenant.env, gated on MULTI_TENANT_ENABLED.
  # Example: multiTenant: { enabled: true, url: "http://tenant-manager:8080" }
  multiTenant: {}
  # -- Bootstrap job for external MongoDB: creates users and grants privileges
  externalMongoDefinitions:
    # -- Enable or disable the MongoDB bootstrap job
    enabled: false
    # -- MongoDB connection settings
    connection:
      # -- MongoDB host
      host: "fetcher-mongodb"
      # -- MongoDB port
      port: "27017"
    # -- Admin credentials for MongoDB (rootUser from bitnami subchart)
    mongoAdminLogin:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_ROOT_USER and MONGO_ROOT_PASSWORD keys
        name: ""
      # -- Admin username (ignored if useExistingSecret.name is set)
      username: "fetcher"
      # -- Admin password (ignored if useExistingSecret.name is set)
      password: ""
    # -- Credentials for fetcher user created by the job
    fetcherCredentials:
      useExistingSecret:
        # -- Name of existing secret containing MONGO_APP_USER and MONGO_APP_PASSWORD keys
        name: ""
      # -- App username (ignored if useExistingSecret.name is set)
      username: "fetcher"
      # -- Password for fetcher user (ignored if useExistingSecret.name is set)
      password: ""
      # -- List of roles to grant to the user. Each item is a {role, db} pair.
      roles:
        - role: "readWrite"
          db: "fetcher-db"
# Manager component - REST API service
manager:
  name: "fetcher-manager"
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: lerianstudio/fetcher-manager
    pullPolicy: IfNotPresent
    tag: "3.0.2"
  imagePullSecrets: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1001
    runAsUser: 1001
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  service:
    type: ClusterIP
    port: 4006
    annotations: {}
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
    maxUnavailable: 1
    annotations: {}
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  nodeSelector: {}
  tolerations: {}
  affinity: {}
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Manager-specific ConfigMap (VERSION is auto-set from image tag)
  configmap:
    ENV_NAME: "development"
    SERVER_PORT: "4006"
    SERVER_ADDRESS: ":4006"
    SCHEMA_CACHE_TTL_SECONDS: "300"
    LOG_LEVEL: "debug"
    # RabbitMQ
    RABBITMQ_FETCHER_WORK_QUEUE: "fetcher.extract-external-data.queue"
    # Swagger
    SWAGGER_TITLE: "Fetcher"
    SWAGGER_DESCRIPTION: "Documentation for fetcher"
    SWAGGER_VERSION: "1.0.0-beta.1"
    SWAGGER_HOST: ":4006"
    SWAGGER_BASE_PATH: "/"
    SWAGGER_SCHEMES: "http"
    SWAGGER_LEFT_DELIM: "{{"
    SWAGGER_RIGHT_DELIM: "}}"
    # AUTH — PLUGIN_AUTH_ENABLED/_ADDRESS now emitted by lerian-common.auth.env
    # (global.auth); default disabled, host "". Override via global.auth.{enabled,host}
    # or set manager.configmap.PLUGIN_AUTH_ENABLED/_ADDRESS here to win outright.
    # Rate Limiting - Three-tier system with Redis backend
    # Set RATE_LIMIT_ENABLED=false to disable (requires ALLOW_RATELIMIT_DISABLED in strict tier)
    # ALLOW_RATELIMIT_DISABLED: Set a detailed reason message explaining why rate limiting is disabled
    # ALLOW_RATELIMIT_FAIL_OPEN: Set a detailed reason message to allow fail-open mode in production
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_MAX: "500"
    RATE_LIMIT_WINDOW_SEC: "60"
    AGGRESSIVE_RATE_LIMIT_MAX: "100"
    AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: "60"
    RELAXED_RATE_LIMIT_MAX: "1000"
    RELAXED_RATE_LIMIT_WINDOW_SEC: "60"
    RATE_LIMIT_REDIS_TIMEOUT_MS: "500"
    ALLOW_RATELIMIT_DISABLED: ""
    ALLOW_RATELIMIT_FAIL_OPEN: ""
  # Manager-specific Secrets
  secrets:
    APP_ENC_KEY: ""
    APP_ENC_KEY_VERSION: "1"
  extraEnvVars: {}
  useExistingSecret: false
  existingSecretName: ""
# Worker component - Background processor
worker:
  name: "fetcher-worker"
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: lerianstudio/fetcher-worker
    pullPolicy: IfNotPresent
    tag: "3.0.2"
  imagePullSecrets: []
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsGroup: 1001
    runAsUser: 1001
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  nodeSelector: {}
  tolerations: {}
  affinity: {}
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  # Worker-specific ConfigMap (VERSION is auto-set from image tag)
  configmap:
    ENV_NAME: "development"
    LOG_LEVEL: "debug"
    # RabbitMQ
    RABBITMQ_NUMBERS_OF_WORKERS: "5"
    RABBITMQ_FETCHER_WORK_QUEUE: "fetcher.extract-external-data.queue"
    RABBITMQ_JOB_EVENTS_EXCHANGE: "fetcher.job.events"
    # Streaming (lib-streaming/CloudEvents) - the worker hard-requires this at
    # startup for mandatory job event notifications; it will not boot without
    # a reachable broker. STREAMING_ENABLED/_BROKERS/_TLS_ENABLED/_SASL_* are
    # now emitted by lerian-common.streaming.env (global.streaming); STREAMING_
    # BROKERS has no working default in either place - it MUST be set to a
    # real Kafka/Redpanda bootstrap address (e.g. "redpanda.<namespace>:9092")
    # via global.streaming.brokers or worker.configmap.STREAMING_BROKERS before
    # installing with the bundled worker.
    STREAMING_CLOUDEVENTS_SOURCE: "fetcher-worker"
    # Storage Provider - OBJECT_STORAGE_ENDPOINT/_REGION/_BUCKET/_USE_PATH_STYLE
    # now emitted by lerian-common.objectStorage.value (name "fetcher"); see
    # global.objectStorage.fetcher.
    STORAGE_PROVIDER: "seaweedfs"
    OBJECT_STORAGE_KEY_PREFIX: ""
    # Rate Limiting - Three-tier system with Redis backend
    # Set RATE_LIMIT_ENABLED=false to disable (requires ALLOW_RATELIMIT_DISABLED in strict tier)
    # ALLOW_RATELIMIT_DISABLED: Set a detailed reason message explaining why rate limiting is disabled
    # ALLOW_RATELIMIT_FAIL_OPEN: Set a detailed reason message to allow fail-open mode in production
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_MAX: "500"
    RATE_LIMIT_WINDOW_SEC: "60"
    AGGRESSIVE_RATE_LIMIT_MAX: "100"
    AGGRESSIVE_RATE_LIMIT_WINDOW_SEC: "60"
    RELAXED_RATE_LIMIT_MAX: "1000"
    RELAXED_RATE_LIMIT_WINDOW_SEC: "60"
    RATE_LIMIT_REDIS_TIMEOUT_MS: "500"
    ALLOW_RATELIMIT_DISABLED: ""
    ALLOW_RATELIMIT_FAIL_OPEN: ""
  # Worker-specific Secrets
  secrets:
    APP_ENC_KEY: ""
    APP_ENC_KEY_VERSION: "1"
    # Streaming (lib-streaming) credentials - only needed when
    # common.configmap.STREAMING_SASL_MECHANISM / STREAMING_TLS_ENABLED are set
    STREAMING_SASL_PASSWORD: ""
    STREAMING_TLS_CA_CERT: ""
    # Storage Encryption Keys
    CRYPTO_ENCRYPT_FILE_STORAGE: ""
    CRYPTO_HASH_SECRET_KEY_FILE_STORAGE: ""
    # CRM Plugin Encryption Keys
    CRYPTO_ENCRYPT_SECRET_KEY_PLUGIN_CRM: ""
    CRYPTO_HASH_SECRET_KEY_PLUGIN_CRM: ""
    # S3 Object Storage Credentials
    OBJECT_STORAGE_ACCESS_KEY_ID: ""
    OBJECT_STORAGE_SECRET_KEY: ""
  extraEnvVars: {}
  useExistingSecret: false
  existingSecretName: ""
# Common configuration shared between manager and worker
# -- Dedicated datastore masks for THIS release (override global.datastores).
# Sub-keys (each host/port/params):
#   mongo:  { host, port, params }   # MongoDB (report store)
#   redis:  { host, port }           # Valkey/Redis (rate-limit backend)
#   broker: { host, port, amqpPort, scheme }  # RabbitMQ (extraction queue)
# The native common.configmap.<KEY> still wins over these; these win over
# global.datastores.
datastores: {}
common:
  # -- Shared (common) application config for BOTH the manager and worker
  # surfaces. Defaults for every shared key live in the templates
  # (fetcher.commonConfigmapData): dependency CONNECTIONS resolve through
  # lerian-common typed masks/helpers (datastore.value / globalValue /
  # multiTenant.env), everything else is an escape-hatch passthrough. Set
  # common.configmap.<KEY> here to override any shared key; add any other key
  # and it flows through as-is.
  configmap: {}
# Shared secrets
secrets:
  MONGO_USER: "fetcher"
  MONGO_PASSWORD: ""
  RABBITMQ_DEFAULT_USER: "plugin"
  # -- Password the app uses to authenticate as the "plugin" RabbitMQ user.
  # Matches the fixed password_hash baked into files/rabbitmq/load_definitions.json
  # (loaded automatically when rabbitmq.enabled=true, bundled dev-mode broker).
  # DEV-ONLY default — for production/external RabbitMQ, override this AND
  # regenerate load_definitions.json's password_hash (rabbit_password_hashing_sha256)
  # to match, or use externalRabbitmqDefinitions with your own credentials.
  RABBITMQ_DEFAULT_PASS: "fetcher-dev-only"
  REDIS_USER: ""
  REDIS_PASSWORD: ""
  LICENSE_KEY: ""
  ORGANIZATION_IDS: ""
# =============================================================================
# Optional Dependencies - Enable to deploy components in Kubernetes
# =============================================================================

# SeaweedFS - Distributed file system for storing files
seaweedfs:
  enabled: false
  # Global settings - remove default amd64 node selector for multi-arch support
  global:
    nodeSelector: {}
  master:
    enabled: true
    replicas: 1
    nodeSelector: {}
    extraArgs:
      - "master"
      - "-port=9333"
      - "-mdir=/data"
    service:
      type: ClusterIP
      ports:
        http: 9333
        ui: 9334
    data:
      type: "persistentVolumeClaim"
      size: "5Gi"
      storageClass: null
  volume:
    enabled: true
    replicas: 1
    nodeSelector: {}
    extraArgs:
      - "volume"
      - "-port=9080"
      - "-mserver=seaweedfs-master:9333"
      - "-dir=/data"
      - "-max=0"
    service:
      type: ClusterIP
      ports:
        http: 9080
    dataDirs:
      - name: data
        type: "persistentVolumeClaim"
        size: "10Gi"
        storageClass: null
        maxVolumes: 0
  filer:
    enabled: true
    nodeSelector: {}
    extraArgs:
      - "filer"
      - "-port=8888"
      - "-master=seaweedfs-master:9333"
    service:
      type: ClusterIP
      ports:
        http: 8888
    data:
      type: "persistentVolumeClaim"
      size: "25Gi"
      storageClass: null
# MongoDB - Document database for storing metadata
mongodb:
  enabled: false
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamisecure/mongodb
    tag: "latest"
  external: false
  auth:
    enabled: true
    rootUser: fetcher
    rootPassword: ""
  persistence:
    size: 8Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 512Mi
  resourcesPreset: small
  service:
    type: ClusterIP
    port: 27017
# External RabbitMQ Bootstrap - Apply definitions to external RabbitMQ
externalRabbitmqDefinitions:
  enabled: false
  connection:
    protocol: "http"
    host: "rabbitmq"
    port: "15672"
    portAmqp: "5672"
  rabbitmqAdminLogin:
    username: "guest"
    password: ""
    useExistingSecret:
      name: ""
  appCredentials:
    pluginPassword: ""
    useExistingSecret:
      name: ""
# RabbitMQ - Message broker for async processing
rabbitmq:
  enabled: false
  image:
    tag: "3.13.6"
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: ["ALL"]}
  authentication:
    user:
      value: "midaz"
    password:
      value: ""
    erlangCookie:
      value: ""
  extraSecrets:
    - name: "fetcher-manager-load-definitions"
      mountPath: /etc/rabbitmq/definitions
  customConfig: |
    management.load_definitions = /etc/rabbitmq/definitions/load_definition.json
# Valkey - In-memory data store (Redis alternative)
valkey:
  enabled: false
  auth:
    enabled: false
# KEDA - Kubernetes Event-driven Autoscaling
keda:
  enabled: false
  crds:
    install: false
  webhookCerts:
    generate: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true
  operator:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  webhooks:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  metricsApiServer:
    logLevel: info
    logEncoder: console
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
# Observability configuration
observability:
  enabled: false
  metrics:
    enabled: false
  tracing:
    enabled: false
    jaegerEndpoint: {}
    samplingRate: {}
# AWS Authentication - IAM Roles Anywhere for non-AWS clusters (e.g. Proxmox)
aws:
  rolesAnywhere:
    enabled: false
    trustAnchorArn: ""
    profileArn: ""
    roleArn: ""
    region: "us-east-2"
    sessionDuration: 3600
    certificateSecretName: "fetcher-iam-tls"
    sidecar:
      image:
        repository: public.ecr.aws/rolesanywhere/credential-helper
        tag: "latest-amd64"
        pullPolicy: IfNotPresent
      port: 9911
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 64Mi
