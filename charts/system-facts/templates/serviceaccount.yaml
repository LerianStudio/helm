{{- if and (index .Values "system-facts").enabled (index .Values "system-facts").serviceAccount.create }}
{{- include "lerian-common.serviceAccount" (dict
      "serviceAccount" (index .Values "system-facts").serviceAccount
      "name" (include "system-facts.serviceAccountName" .)
      "namespace" (include "global.namespace" .)
      "labels" (include "system-facts.labels" (dict "context" . "component" (index .Values "system-facts").name "name" (index .Values "system-facts").name))
    ) }}
{{- end }}
