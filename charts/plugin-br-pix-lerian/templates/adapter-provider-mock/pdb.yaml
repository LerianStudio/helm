{{- if and .Values.adapterProviderMock.enabled .Values.adapterProviderMock.pdb.enabled }}
{{- $component := "adapter-provider-mock" }}
{{- $values := .Values.adapterProviderMock }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "plugin-br-pix-lerian.componentFullname" (dict "context" $ "component" $component) }}
  namespace: {{ include "global.namespace" . }}
  labels:
    {{- include "plugin-br-pix-lerian.labels" (dict "context" $ "component" $component) | nindent 4 }}
  {{- with $values.pdb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Key-presence (not truthiness) checks so 0 is honoured, plus an
         exactly-one validation: a PDB with both keys is invalid, and a PDB
         with neither silently protects nothing. */}}
  {{- $hasMin := and (hasKey $values.pdb "minAvailable") (not (kindIs "invalid" $values.pdb.minAvailable)) }}
  {{- $hasMax := and (hasKey $values.pdb "maxUnavailable") (not (kindIs "invalid" $values.pdb.maxUnavailable)) }}
  {{- if and $hasMin $hasMax }}
  {{- fail (printf "\n\nERROR: %s.pdb sets both minAvailable and maxUnavailable — set exactly one (use an explicit null to unset a key).\n" $component) }}
  {{- end }}
  {{- if $hasMin }}
  minAvailable: {{ $values.pdb.minAvailable }}
  {{- else if $hasMax }}
  maxUnavailable: {{ $values.pdb.maxUnavailable }}
  {{- else }}
  {{- fail (printf "\n\nERROR: %s.pdb requires one of minAvailable or maxUnavailable when enabled.\n" $component) }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "plugin-br-pix-lerian.selectorLabels" (dict "context" $ "component" $component) | nindent 6 }}
{{- end }}
