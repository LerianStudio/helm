{{- $reconcile := dig "partition" "reconcile" dict (.Values.ledger | default dict) }}
{{- if and .Values.ledger.enabled (include "midaz.ledgerPartitionEnabled" .) (ne (toString (dig "enabled" true $reconcile)) "false") }}
{{- /*
Ledger partition runner: `partition reconcile-indexes`, once per sync/upgrade.

Brings every database's partitioned tables in line with the partition-index
registry: an index registered after the table was partitioned is built on each
partition and attached to the parent. The registry and its support objects live
in the transaction schema, so this Job runs after the migration Job: Argo CD
wave `ledger.partition.reconcile.syncWave` (default "1", after the migration
Job's default wave 0 and together with the Deployment) and, on plain Helm, hook
weight "10" after the migration Job's weight 0.

It never blocks a sync on a database that is not ready for it: an empty registry
(the normal state today), an unpartitioned table or a database without the
partition support migration (`support_missing`) all exit 0 without changes, and
`--tolerate-unavailable` keeps an unreachable tenant or a pending index from
failing the hook (the daily `ensure --reconcile-indexes` CronJob retries them
and its failed Jobs are the alert signal). Exit 2 (invalid configuration) still
fails the Job after backoffLimit retries and the sync reports it.

Connection settings are resolved inline from this release's values (see
midaz-ledger.partitionPodSpec): on plain Helm a pre-upgrade hook runs before the
ledger ConfigMap is updated, so envFrom alone would read the previous release.

The Job name carries the ledger image tag because a Job spec is immutable; the
hook delete policies recreate it on every sync. The pod spec is shared with the
`partition ensure` CronJob.
*/}}
{{- $component := printf "%s-partition-reconcile" .Values.ledger.name }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "midaz-ledger.partitionReconcileJobName" . }}
  labels:
    {{- include "midaz.labels" (dict "context" . "component" $component "name" $component) | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: {{ dig "syncWave" "1" $reconcile | toString | quote }}
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ dig "activeDeadlineSeconds" 1800 $reconcile }}
  ttlSecondsAfterFinished: {{ dig "ttlSecondsAfterFinished" 259200 $reconcile }}
  template:
    metadata:
      labels:
        {{- include "midaz.labels" (dict "context" . "component" $component "name" $component) | nindent 8 }}
    spec:
      {{- include "midaz-ledger.partitionPodSpec" (dict "context" . "args" (list "reconcile-indexes" "--tolerate-unavailable")) | nindent 6 }}
{{- end }}
