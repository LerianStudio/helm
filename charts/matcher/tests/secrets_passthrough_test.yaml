suite: matcher secret renders every operator key
templates:
  - templates/matcher/secrets.yaml
release:
  name: matcher
  namespace: matcher
set:
  matcher.configmap.DEPLOYMENT_MODE: saas
  matcher.secrets.RABBITMQ_PASSWORD: x
tests:
  # ---------------------------------------------------------------------------
  # The Secret used to be an allowlist like the ConfigMap: benedita prd-st and
  # dev-st set ADVISOR_ / DOC_EXTRACTION_ / RULE_ADVISOR_ANTHROPIC_API_KEY and
  # none reached the pod. Every non-empty key now passes through, except the four
  # passwords whose presence depends on the subchart / existingSecret gates.
  # ---------------------------------------------------------------------------
  - it: renders a key the chart does not name, base64-encoded
    set:
      matcher.secrets.ADVISOR_ANTHROPIC_API_KEY: sk-test
    asserts:
      - equal:
          path: data.ADVISOR_ANTHROPIC_API_KEY
          value: c2stdGVzdA==

  - it: keeps a subchart-gated password out even when set (bundled postgres)
    set:
      postgresql.enabled: true
      matcher.secrets.POSTGRES_PASSWORD: pw
      matcher.secrets.POSTGRES_REPLICA_PASSWORD: pw
    asserts:
      - notExists:
          path: data.POSTGRES_PASSWORD
      - notExists:
          path: data.POSTGRES_REPLICA_PASSWORD

  - it: renders the gated password when its gate is open (external postgres)
    set:
      postgresql.enabled: false
      matcher.secrets.POSTGRES_PASSWORD: pw
    asserts:
      - equal:
          path: data.POSTGRES_PASSWORD
          value: cHc=

  - it: renders the empty default for OBJECT_STORAGE_ACCESS_KEY_ID when unset
    asserts:
      - equal:
          path: data.OBJECT_STORAGE_ACCESS_KEY_ID
          value: ""

  - it: keeps a render-if-set key absent when unset
    asserts:
      - notExists:
          path: data.IDEMPOTENCY_HMAC_SECRET

  - it: renders a named render-if-set key once, from the explicit line
    set:
      matcher.secrets.IDEMPOTENCY_HMAC_SECRET: h
    asserts:
      - equal:
          path: data.IDEMPOTENCY_HMAC_SECRET
          value: aA==
