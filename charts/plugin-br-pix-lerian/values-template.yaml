# Production values template for plugin-br-pix-lerian.
# No chart version is pinned in this header on purpose: Chart.yaml version is
# owned by the release pipeline (semantic-release rewrites it on every
# release), so any number written here goes stale on the next merge.
#
# Override only the fields you need to change from values.yaml defaults.
# 8 of the 14 components are enabled by default. Disabled by default:
# adapter-provider-mock, dict-hub-vsync, the adapter-lerian pair
# (adapterLerian / adapterLerianSystemplane) and the pixauto pair
# (pixauto / pixautoSystemplane). Disable any component by setting
# `enabled: false`; enabling one means supplying everything it requires --
# see the chart README, "Required before installation".

# There is NO shared `global.image` key. Each of the 14 components publishes
# and pulls its own image (ghcr.io/lerianstudio/plugin-br-pix-lerian-<component>),
# set under `<component>.image.repository`; the helpers read only that
# per-component block. A `global.image.tag` set here would be silently ignored
# and every component would still deploy `.Chart.AppVersion`.
#
# Leave the tags unset: an unset `<component>.image.tag` falls back to
# `.Chart.AppVersion`, which keeps the whole cohort in lockstep with the chart
# version — that is the intended way to pin a release. Override
# `<component>.image.tag` / `.pullPolicy` only to pin ONE component to an
# off-cohort build (rare), for example:
#
#   spi:
#     image:
#       tag: "1.0.0-beta.101"
#       pullPolicy: IfNotPresent
global:
  imagePullSecrets:
    - name: ghcr-credential

# ------------------------------------------------------------
# spi/api — PIX SPI (single-tenant identity REQUIRED)
# ------------------------------------------------------------
spi:
  enabled: true
  configmap:
    DEPLOYMENT_MODE: "byoc"            # or "saas" / "local"
    # ENV_NAME must be set on EVERY enabled component, not just here. The
    # chart default in values.yaml is "development", and two behaviours key off
    # it: a Systemplane skips the SYSTEMPLANE_SECRET_MASTER_KEY requirement
    # when ENV_NAME is "local" or "development" (booting with secret encryption
    # off), and SWAGGER_ENABLED, when unset, resolves to `envName != production`
    # (serving /docs and /openapi.json). Every component below therefore
    # repeats it.
    ENV_NAME: "production"
    PLUGIN_AUTH_ENABLED: "true"
    PLUGIN_AUTH_URL: "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000"
    # ORGANIZATION_IDS is the LICENSE allow-list and is required on every
    # workload that receives a LICENSE_KEY: the license client refuses to
    # initialise with a key and no allow-list, and the workload exits at boot.
    # "global" is the single-license value; a comma-separated list scopes it.
    # It is a different key from ORGANIZATION_ID below, which is this
    # deployment's single-tenant business identity. Set both.
    ORGANIZATION_IDS: "global"
    ORGANIZATION_ID: "<your-org-id>"
    ISPB: "<8-digit-ispb>"
    # Point at the adapter this environment actually runs (adapter-lerian, or
    # adapter-provider-mock only where it is enabled -- its URL carries the
    # /provider-mock prefix). No default: the mock is disabled in production,
    # and a wrong default would only mask the missing real configuration.
    # Leaving it empty does NOT fail at boot -- the app does not validate this
    # variable at startup; it resolves the effective value per request from
    # TenantConfig, so a missing value surfaces as a rejected request.
    ADAPTER_BASE_URL: ""
    DICT_BASE_URL: "http://plugin-br-pix-lerian-dict-hub:4104"
    COB_BASE_URL: "http://plugin-br-pix-lerian-cob-hub:4108"
    MIDAZ_BASE_URL: "http://midaz-onboarding.midaz.svc.cluster.local:3000"
    MIDAZ_LEDGER_ID: ""
    MIDAZ_ORGANIZATION_ID: ""
    CRM_BASE_URL: ""
    CRM_ORGANIZATION_ID: ""
  secrets:
    MIDAZ_CLIENT_ID: ""
    DICT_CLIENT_ID: ""
    COB_CLIENT_ID: ""
    CRM_CLIENT_ID: ""
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-spi?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-spi?sslmode=require"
    VALKEY_URL: "redis://default:<password>@valkey-host:6379/0"
    LICENSE_KEY: ""                   # use Vault / external-secret reference
    DICT_CLIENT_SECRET: ""
    COB_CLIENT_SECRET: ""
    CRM_CLIENT_SECRET: ""
    MIDAZ_CLIENT_SECRET: ""

# ------------------------------------------------------------
# spi/systemplane/api
# ------------------------------------------------------------
spiSystemplane:
  enabled: true
  # This component SEEDS the spi.* configuration store on first boot; spi reads
  # those values back and gates /readyz on them. Setting them only on `spi`
  # above is not enough. Keys below are the spi domain's seed mappings.
  configmap:
    # Production environment gate. See spi above -- this template ships a
    # production deployment, and the chart default is "development".
    ENV_NAME: "production"
    ORGANIZATION_ID: "<your-org-id>"
    ISPB: "<8-digit-ispb>"
    # Provider adapter this environment runs, including its route prefix.
    ADAPTER_BASE_URL: "<provider-adapter-url>"
    DICT_BASE_URL: "http://plugin-br-pix-lerian-dict-hub:4104"
    DICT_ROUTING_MODE: "hub"
    COB_BASE_URL: "http://plugin-br-pix-lerian-cob-hub:4108"
    COB_ROUTING_MODE: "hub"
    CRM_BASE_URL: "<crm-base-url>"
    MIDAZ_BASE_URL: "<midaz-base-url>"
    MIDAZ_LEDGER_ID: "<midaz-ledger-id>"
    # Tuning keys for this domain carry catalog defaults and are optional;
    # set them through the systemplane admin surface when you need one.
  secrets:
    DICT_CLIENT_ID: "<dict-client-id>"
    COB_CLIENT_ID: "<cob-client-id>"
    CRM_CLIENT_ID: "<crm-client-id>"
    MIDAZ_CLIENT_ID: "<midaz-client-id>"
    DICT_CLIENT_SECRET: ""
    COB_CLIENT_SECRET: ""
    CRM_CLIENT_SECRET: ""
    MIDAZ_CLIENT_SECRET: ""
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-spi?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-spi?sslmode=require"
    LICENSE_KEY: ""
    # REQUIRED and must be NON-EMPTY whenever ENV_NAME is not "local" or
    # "development" -- with the ENV_NAME above this workload refuses to start
    # without it. Deliberately empty here: supply it from your secret manager
    # through useExistingSecret / existingSecretName instead of committing a
    # value to this file. No format or length is validated; keep the SAME value
    # across upgrades and rollbacks, because it is re-checked at every boot.
    SYSTEMPLANE_SECRET_MASTER_KEY: ""

# ------------------------------------------------------------
# adapter-provider-mock (disabled in production!)
# ------------------------------------------------------------
adapterProviderMock:
  enabled: false

# ------------------------------------------------------------
# dict/hub/api — DICT hub
# ------------------------------------------------------------
dictHub:
  enabled: true
  configmap:
    DEPLOYMENT_MODE: "byoc"
    # Production environment gate. See spi above -- this template ships a
    # production deployment, and the chart default is "development".
    ENV_NAME: "production"
    PLUGIN_AUTH_ENABLED: "true"
    PLUGIN_AUTH_URL: "http://plugin-access-manager-auth.midaz-plugins.svc.cluster.local:4000"
    # License allow-list, required alongside LICENSE_KEY. See spi above.
    ORGANIZATION_IDS: "global"
    ORGANIZATION_ID: "<your-org-id>"
    ISPB: "<8-digit-ispb>"
    # Point at the adapter this environment actually runs (adapter-lerian, or
    # adapter-provider-mock only where it is enabled -- its URL carries the
    # /provider-mock prefix). No default: the mock is disabled in production,
    # and a wrong default would only mask the missing real configuration.
    # Leaving it empty does NOT fail at boot -- the app does not validate this
    # variable at startup; it resolves the effective value per request from
    # TenantConfig, so a missing value surfaces as a rejected request.
    ADAPTER_BASE_URL: ""
    KEY_CACHE_TTL_SEC: "60"
  secrets:
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-dict?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-dict?sslmode=require"
    VALKEY_URL: "redis://default:<password>@valkey-host:6379/0"
    LICENSE_KEY: ""
    CRM_CLIENT_ID: "<crm-client-id>"
    CRM_CLIENT_SECRET: ""

# ------------------------------------------------------------
# dict/hub/vsync — singleton background worker
# ------------------------------------------------------------
dictHubVsync:
  enabled: true
  configmap:
    # Production environment gate. See spi above -- this template ships a
    # production deployment, and the chart default is "development".
    ENV_NAME: "production"
    VSYNC_ENABLED: "true"
    # License allow-list, required alongside LICENSE_KEY. See spi above. The
    # worker builds a license client for shutdown coupling even though it
    # mounts no HTTP license middleware, so the key is needed here too.
    ORGANIZATION_IDS: "global"
  secrets:
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-dict?sslmode=require"
    VALKEY_URL: "redis://default:<password>@valkey-host:6379/0"
    # TLS-only: amqps:// on 5671. lib-commons v5.7.0 validates the broker cert
    # against the system trust store (a private CA needs an app-code change).
    RABBITMQ_URI: "amqps://pixswitch:<password>@rabbitmq-host:5671/"
    LICENSE_KEY: ""

# ------------------------------------------------------------
# dict/proxy/api
# ------------------------------------------------------------
dictProxy:
  # Hub-only is the supported production shape in this release -- see the chart
  # README, "Example topologies", which spells out this exact pair as false, and
  # the topology section above it: the proxy tier serves no business route, so
  # every business request it receives returns 404 while health and readyz stay
  # green. Enable it only if your provider topology requires the tier to exist,
  # and never point client traffic at it.
  enabled: false
  configmap:
    DEPLOYMENT_MODE: "byoc"
    # Production environment gate. See spi above -- this template ships a
    # production deployment, and the chart default is "development".
    ENV_NAME: "production"
    # License allow-list, required alongside LICENSE_KEY. See spi above.
    ORGANIZATION_IDS: "global"
  secrets:
    # Required at boot: the proxy has no business database, but it still needs
    # a DSN for its configuration-store consumer and refuses to start without
    # one. Point it at the same database as the domain's other workloads.
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-dict?sslmode=require"
    LICENSE_KEY: ""

# ------------------------------------------------------------
# dict/systemplane/api
# ------------------------------------------------------------
dictSystemplane:
  enabled: true
  # Seeds the dict.* configuration store; dictHub and dictHubVsync read these
  # back and gate /readyz on them.
  configmap:
    # Production environment gate. See spi above -- this template ships a
    # production deployment, and the chart default is "development".
    ENV_NAME: "production"
    ORGANIZATION_ID: "<your-org-id>"
    ISPB: "<8-digit-ispb>"
    ADAPTER_BASE_URL: "<provider-adapter-url>"
    CRM_BASE_URL: "<crm-base-url>"
    SPI_BASE_URL: "http://plugin-br-pix-lerian-spi:4101"
    # Tuning and outbound-callback keys for this domain carry catalog defaults
    # and are optional; set them through the systemplane admin surface.
  secrets:
    CRM_CLIENT_ID: "<crm-client-id>"
    SPI_CLIENT_ID: "<spi-client-id>"
    CRM_CLIENT_SECRET: ""
    SPI_CLIENT_SECRET: ""
    DATABASE_URL: "postgres://pixswitch:<password>@postgres-host:5432/pix-dict?sslmode=require"
    SYSTEMPLANE_POSTGRES_DSN: "postgres://pixswitch:<password>@postgres-host:5432/pix-dict?sslmode=require"
    LICENSE_KEY: ""
    # REQUIRED and must be NON-EMPTY whenever ENV_NAME is not "local" or
    # "development" -- with the ENV_NAME above this workload refuses to start
    # without it. Deliberately empty here: supply it from your secret manager
    # through useExistingSecret / existingSecretName instead of committing a
    # value to this file. No format or length is validated; keep the SAME value
    # across upgrades and rollbacks, because it is re-checked at every boot.
    SYSTEMPLANE_SECRET_MASTER_KEY: ""

# ------------------------------------------------------------
# cob/hub/api — COB hub
# ------------------------------------------------------------
cobHub:
  enabled: true
  configmap:
    DEPLOYMENT_MODE: "byoc"
    # Production environment gate. See spi above -- this template ships a
