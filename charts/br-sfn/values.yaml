# =============================================================================
# slcEdge — Cabine SLC authenticated passthrough edge (br-slc-edge). Stateless:
# no datastore, no migrations. Renders as "slc-edge" resources.
# =============================================================================
slcEdge:
  enabled: false
  replicaCount: 1
  revisionHistoryLimit: 10
  image:
    repository: ghcr.io/lerianstudio/br-slc-edge
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  podAnnotations: {}
  deploymentUpdate:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  service:
    type: ClusterIP
    # Matches the Dockerfile EXPOSE 3005 (config defaultServerPort).
    port: 3005
  # -- STATELESS edge: no datastore/broker/auth of its own (it relays the inbound
  # bearer to the br-slc core). No `datastores` block. SLC_UPSTREAM_URL is the
  # br-slc core address — a plain inter-service passthrough URL (br-slc is NOT a
  # component of this chart, so it cannot be derived); set it in configmap below.
  # -- SLC-EDGE ConfigMap escape hatch: set/override ANY native env KEY
  # (SLC_UPSTREAM_URL, SLC_*_TIMEOUT, SLC_EDGE_CORS_ALLOWED_ORIGINS, ...).
  configmap: {}
  # -- SLC-EDGE has NO secrets (it forwards the caller's Authorization header
  # verbatim; it holds no credential). Kept for the escape-hatch contract.
  secrets: {}
  useExistingSecret: false
  existingSecretName: ""
  extraEnvVars: []
  extraVolumes: []
  extraVolumeMounts: []
  livenessProbe: {}
  readinessProbe: {}
  resources:
