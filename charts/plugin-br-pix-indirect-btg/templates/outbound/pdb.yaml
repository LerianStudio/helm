{{- $h := include "outbound.health" . | fromYaml }}
{{- if $h.pdb }}
{{- include "lerian-common.pdb" (dict
      "pdb" $h.pdb
      "name" (include "outbound.fullname" .)
      "labels" (include "outbound.labels" (dict "context" . "name" .Values.outbound.name))
      "selector" (include "outbound.selectorLabels" (dict "context" . "name" .Values.outbound.name))
    ) }}
{{- end }}
